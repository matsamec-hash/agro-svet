slug: celer
name: Celer
name_plural: Celer
skupina: zelenina
hero_image: /images/plodiny/celer.jpg
hero_author: ""
hero_license: "Public domain"
hero_source: "https://commons.wikimedia.org/wiki/File:Illustration_Apium_graveolens0.jpg"
description: >-
  Celer (Apium graveolens) je v registru ÚKZÚZ veden ve dvou užitkových formách — celer bulvový
  (var. rapaceum) pěstovaný pro kořenovou bulvu a celer řapíkatý (var. dulce) pro dužnaté
  řapíky. Patří k plodinám s nejdelší vegetační dobou mezi zeleninou, přes 180 dní, a proto
  se vždy pěstuje ze sadby.
vysevek: výsev do sadbovačů 200–300 g osiva/ha; spon bulvový 40 × 40 cm, řapíkatý 40 × 30 cm
hnojeni: N 150–200 kg/ha děleně; K 250–300 kg K₂O/ha; bór proti srdéčkové hnilobě; snáší i vyšší dávky organických hnojiv
vynos_t_ha: 35–55 (bulvový), 40–60 (řapíkatý)
sklizen: září–říjen (bulvový), srpen–říjen (řapíkatý)
seti_mesice: [2, 3]
sklizen_mesice: [8, 9, 10]
vyuziti: kořenová zelenina do polévek a salátů, sušená zeleninová směs, řapíky pro čerstvou konzumu
choroby:
  - septoriová skvrnitost celeru (Septoria apiicola)
  - srdéčková hniloba (fyziologická, nedostatek bóru)
  - pochmurnatka mrkvová (Psila rosae)
  - fuzariové vadnutí (Fusarium oxysporum f. sp. apii)
  - virus mozaiky celeru
osevni_postup:
  - name: Předplodina a osevní postup
    text: Odstup po miříkovitých (mrkev, petržel, pastinák) nejméně 4 roky. Celer je vděčný za organické hnojení a řadí se do první trati po hnoji.
  - name: Předpěstování sadby
    text: Výsev už v únoru až březnu — celer klíčí pomalu, 14–21 dní, a potřebuje světlo, proto se nezasypává. Sadba je připravená až po 10–12 týdnech.
  - name: Výsadba
    text: Na pole v květnu po pominutí mrazíků. Bulvový celer se sází mělce, kořenový krček musí zůstat nad zemí, jinak bulva zarůstá kořínky a špatně se čistí.
  - name: Hnojení a závlaha
    text: Dusík dělit do tří dávek. Celer má nejvyšší nároky na vodu ze všech kořenových zelenin — bez pravidelné závlahy zůstane bulva malá a dřevnatá.
  - name: Ochrana rostlin
    text: Septoriová skvrnitost je hlavní chorobou vlhkých let a přenáší se osivem; používat mořené certifikované osivo. Bór aplikovat preventivně listově proti srdéčkové hnilobě.
  - name: Sklizeň
    text: Bulvový celer se sklízí v září až říjnu před silnějšími mrazy, nať se seřízne a bulvy se skladují při 0–1 °C. Řapíkatý celer se sklízí postupně od srpna.
wikipedia: https://cs.wikipedia.org/wiki/Mi%C5%99%C3%ADk_celer
faq:
  - q: Proč má celer dutou nebo hnědou bulvu uvnitř?
    a: Je to srdéčková hniloba z nedostatku bóru, ne choroba. Objevuje se hlavně na vyvápněných a lehkých půdách. Řeší se preventivní listovou aplikací bóru během vegetace.
  - q: Kdy vysévat celer?
    a: Už v únoru až březnu do sadbovačů. Celer má vegetační dobu přes 180 dní a klíčí velmi pomalu — pozdější výsev znamená, že bulva do podzimu nedoroste.
  - q: Jaký je rozdíl mezi bulvovým a řapíkatým celerem?
    a: Bulvový se pěstuje pro kořenovou bulvu a sází se mělce, aby bulva nezarůstala kořeny. Řapíkatý tvoří dužnaté řapíky, sází se hustěji a u některých odrůd se bělí zakrytím. ÚKZÚZ je vede jako samostatné skupiny odrůd.
