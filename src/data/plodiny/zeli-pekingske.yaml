slug: zeli-pekingske
name: Zelí pekingské
name_plural: Pekingské zelí
skupina: zelenina
hero_image: /images/plodiny/zeli-pekingske.jpg
hero_author: "Forest &amp; Kim Starr"
hero_license: "CC BY 3.0"
hero_source: "https://commons.wikimedia.org/wiki/File:Starr_070730-7855_Brassica_rapa.jpg"
description: >-
  Zelí pekingské (Brassica rapa subsp. pekinensis) je rychle rostoucí listová košťálovina
  s podlouhlou světlou hlávkou. Od hlávkového zelí se liší botanicky i pěstitelsky — má
  výrazně kratší vegetační dobu kolem 70 dní a je silně náchylné k vybíhání do květu při
  jarních výsevech, proto se v ČR pěstuje především jako podzimní plodina.
vysevek: výsev do sadbovačů 300–400 g osiva/ha; spon 50 × 35–40 cm
hnojeni: N 120–160 kg/ha; K 180–220 kg K₂O/ha; vápník proti okrajovému spálení listů
vynos_t_ha: 40–70
sklizen: září–listopad
seti_mesice: [6, 7]
sklizen_mesice: [9, 10, 11]
vyuziti: čerstvá listová zelenina, saláty, kimchi a kvašené výrobky, gastronomie
choroby:
  - nádorovitost kořenů brukvovitých (Plasmodiophora brassicae)
  - alternariová skvrnitost (Alternaria brassicae)
  - bakteriální měkká hniloba (Pectobacterium carotovorum)
  - dřepčíci a květilka zelná
  - okrajové spálení listů (fyziologická porucha, nedostatek vápníku)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Odstup po brukvovitých nejméně 4 roky. Díky krátké vegetační době se pekingské zelí často zařazuje jako druhá plodina po sklizni rané zeleniny nebo obilniny.
  - name: Termín výsevu
    text: Klíčové rozhodnutí. Jarní výsevy vybíhají do květu vlivem dlouhého dne a chladu, proto se v ČR seje až v červnu až červenci pro podzimní sklizeň.
  - name: Výsadba
    text: Spon 50 × 35–40 cm. Pekingské zelí má mělký kořenový systém a přesazování snáší hůř než hlávkové, proto se často seje přímo na stanoviště.
  - name: Hnojení a závlaha
    text: Rychlý růst vyžaduje dobře dostupné živiny a hlavně vyrovnanou závlahu. Kolísání vlhkosti způsobuje okrajové spálení listů uvnitř hlávky.
  - name: Ochrana rostlin
    text: Na podzim hlídat dřepčíky na mladých rostlinách a měkkou hnilobu za vlhka. Poškozené vnější listy jsou vstupní branou bakteriální infekce.
  - name: Sklizeň
    text: Sklízí se při dosažení pevné hlávky, zpravidla 60–75 dní po výsevu, před příchodem silnějších mrazů. Skladuje se při 0–1 °C, kde vydrží dva až tři měsíce.
wikipedia: https://cs.wikipedia.org/wiki/Pekingsk%C3%A9_zel%C3%AD
faq:
  - q: Proč pekingské zelí vybíhá do květu?
    a: Vybíhání spouští kombinace chladu na začátku růstu a prodlužujícího se dne. Proto se v ČR nevysévá na jaře, ale až v červnu až červenci pro podzimní sklizeň.
  - q: Jaký je rozdíl mezi pekingským a hlávkovým zelím?
    a: Jsou to různé botanické druhy. Pekingské (Brassica rapa) má podlouhlou světlou hlávku s tenkými listy a vegetační dobu kolem 70 dní; hlávkové (Brassica oleracea) má kulatou pevnou hlávku a roste podstatně déle.
  - q: Jak dlouho vydrží pekingské zelí ve skladu?
    a: Při 0–1 °C a vysoké vlhkosti dva až tři měsíce. Nesnáší skladování společně s ovocem produkujícím etylen, po kterém rychle žloutne.
