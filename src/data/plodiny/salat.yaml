slug: salat
name: Salát hlávkový
name_plural: Salát
skupina: zelenina
hero_image: /images/plodiny/salat.jpg
hero_author: "Rasbak 13:13, 20 May 2007 (UTC)"
hero_license: "CC BY-SA 3.0"
hero_source: "https://commons.wikimedia.org/wiki/File:Iceberg_lettuce_(IJssla_krop).jpg"
description: >-
  Salát (Lactuca sativa) je nejrozšířenější listová zelenina v ČR. Registr ÚKZÚZ zahrnuje pod
  jedním druhem hlávkové, ledové, listové (dubáčky), římské i trhací typy, které se liší tvarem
  hlávky, listem a odolností proti vybíhání do květu. Je to rychlá plodina s krátkou vegetační
  dobou, vhodná pro několik sklizní za sezónu.
vysevek: 0,5–1 kg/ha přímý výsev; ze sadby spon 30 × 30 cm (10–12 rostlin/m²)
hnojeni: N 80–120 kg/ha (pozor na dusičnany v listu); P a K dle rozborů; nepřehnojovat dusíkem před sklizní
vynos_t_ha: 25–40
sklizen: květen–říjen, postupně v několika sledech
seti_mesice: [3, 4, 5, 6, 7]
sklizen_mesice: [5, 6, 7, 8, 9, 10]
vyuziti: čerstvá listová zelenina, hotové salátové směsi, gastronomie
choroby:
  - plíseň salátová (Bremia lactucae)
  - plíseň šedá (Botrytis cinerea)
  - spodnička salátová (Rhizoctonia solani)
  - virus mozaiky salátu (LMV)
  - okrajové spálení listů (fyziologická porucha, nedostatek vápníku)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Salát je nenáročný na předplodinu a díky krátké vegetační době slouží často jako předplodina nebo meziplodina. Nevracet po hlávkové zelenině dříve než za 2–3 roky kvůli spodničce.
  - name: Setí a předpěstování sadby
    text: Pro nejranější sklizeň se předpěstuje sadba od února ve skleníku. Od dubna lze vysévat přímo. Salát klíčí i při nízkých teplotách, nad 25 °C naopak nastupuje teplotní dormance osiva.
  - name: Výsadba
    text: Spon 30 × 30 cm. Sázet mělce — kořenový krček musí zůstat nad povrchem, jinak hrozí spodnička. Pro souvislou nabídku se vysazuje v týdenních sledech.
  - name: Hnojení a závlaha
    text: Dusík aplikovat na začátku růstu, ne před sklizní — salát dusičnany kumuluje v listech. Rovnoměrná závlaha je klíčová proti okrajovému spálení listů.
  - name: Ochrana rostlin
    text: Plíseň salátová je hlavní chorobou; existují odrůdy s vysokou rasovou rezistencí (Bl:16–37 a další). Ve vlhku sledovat plíseň šedou, na jaře mšice jako přenašeče virů.
  - name: Sklizeň
    text: Sklízí se v technologické zralosti při dosažení pevné hlávky, u listových typů průběžným otrháváním. Sklizeň ráno za chladu prodlužuje trvanlivost.
wikipedia: https://cs.wikipedia.org/wiki/Sal%C3%A1t_hl%C3%A1vkov%C3%BD
faq:
  - q: Proč salát vybíhá do květu?
    a: Vybíhání spouští dlouhý den a vysoké teploty. Odrůdy se liší odolností — pro letní výsevy je nutné volit typy s deklarovanou pozdní dobou vybíhání, které ÚKZÚZ v popisu odrůdy uvádí.
  - q: Kolikrát za sezónu lze salát sklidit ze stejného pozemku?
    a: Při vegetační době 6–10 týdnů zvládne pozemek dva až tři sledy za sezónu. Praktikuje se výsadba v týdenních intervalech, aby sklizeň byla plynulá.
  - q: Co znamená okrajové spálení listů?
    a: Je to fyziologická porucha z lokálního nedostatku vápníku ve špičkách listů, ne choroba. Vzniká při rychlém růstu a kolísavé vlhkosti. Řešením je vyrovnaná závlaha a volba méně náchylných odrůd.
