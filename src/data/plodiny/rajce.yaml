slug: rajce
name: Rajče jedlé
name_plural: Rajčata
skupina: zelenina
hero_image: /images/plodiny/rajce.jpg
hero_author: "Karelj"
hero_license: "Public domain"
hero_source: "https://commons.wikimedia.org/wiki/File:Rajce.jpg"
description: >-
  Rajče jedlé (Solanum lycopersicum) je nejpěstovanější plodová zelenina v ČR i ve světě.
  Registr ÚKZÚZ ho vede ve dvou samostatných skupinách — indeterminantní (tyčkové, s neomezeným
  růstem, pro skleníky a opory) a determinantní (keříčkové, s ukončeným růstem, pro polní
  pěstování a průmyslové zpracování). Volba typu určuje celou pěstební technologii.
vysevek: výsev do sadbovačů 30–50 g osiva na 1 000 sazenic; spon tyčková 60–80 × 40–50 cm, keříčková 80–100 × 30–40 cm
hnojeni: N 120–180 kg/ha děleně; K 250–350 kg K₂O/ha (vysoká potřeba draslíku); vápník proti vrcholové hnilobě
vynos_t_ha: 40–80 (pole), 150–500 (skleník, dle technologie)
sklizen: červenec–říjen (pole), duben–listopad (vytápěný skleník)
seti_mesice: [2, 3]
sklizen_mesice: [7, 8, 9, 10]
vyuziti: čerstvá konzumace, protlaky a kečupy, sušená rajčata, konzervárenské zpracování
choroby:
  - plíseň bramborová (Phytophthora infestans)
  - alternariová skvrnitost (Alternaria solani)
  - plíseň šedá (Botrytis cinerea)
  - virus bronzovitosti rajčete (TSWV)
  - vrcholová hniloba plodů (fyziologická, nedostatek vápníku)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Nevracet po lilkovitých dříve než za 3–4 roky kvůli plísni bramborové a verticiliu. Ve skleníku se pěstuje v monokultuře na roubovaných podnožích nebo se střídá substrát.
  - name: Předpěstování sadby
    text: Výsev v únoru až březnu při 20–24 °C. Sadba je připravená za 6–8 týdnů. Tyčková rajčata se často roubují na odolné podnože proti půdním chorobám.
  - name: Výsadba
    text: Na pole po polovině května, do nevytápěného fóliovníku od poloviny dubna. Rajče lze sázet hlouběji než rostlo — na zahrnutém stonku vytvoří adventivní kořeny.
  - name: Vedení a vyžínkování
    text: Indeterminantní odrůdy se vedou na jeden až dva výhony k opoře a pravidelně se odstraňují zálistky. Determinantní se nevyžínkují — vytvoří keř a růst ukončí samy.
  - name: Ochrana rostlin
    text: Nejnebezpečnější je plíseň bramborová za vlhkého počasí. Zásadní je nesmáčet listy, větrat a preventivně ošetřovat. Ve skleníku sledovat molici a třásněnky.
  - name: Sklizeň
    text: Postupně od července podle zralosti. Pro čerstvý trh se sklízí v plné zralosti, pro delší přepravu ve fázi vybarvování.
wikipedia: https://cs.wikipedia.org/wiki/Raj%C4%8De_jedl%C3%A9
faq:
  - q: Jaký je rozdíl mezi indeterminantním a determinantním rajčetem?
    a: Indeterminantní (tyčkové) roste neomezeně, potřebuje oporu a vyžínkování zálistků a plodí postupně celou sezónu. Determinantní (keříčkové) ukončí růst po vytvoření několika květenství, nevyžínkuje se a dozrává naráz — proto se hodí na pole a pro průmysl.
  - q: Proč rajčatům praskají plody?
    a: Praskání způsobuje náhlý příjem vody po suchém období — plod roste rychleji, než stačí povolit slupka. Řešením je rovnoměrná závlaha a mulčování, ne omezení hnojení.
  - q: Lze rajčata pěstovat po bramborách?
    a: Nedoporučuje se. Obě plodiny jsou lilkovité a sdílejí plíseň bramborovou i půdní patogeny. Odstup by měl být nejméně tři až čtyři roky.
