slug: cibule
name: Cibule kuchyňská
name_plural: Cibule
skupina: zelenina
hero_image: /images/plodiny/cibule.jpg
hero_author: "Colin"
hero_license: "CC BY-SA 3.0"
hero_source: "https://commons.wikimedia.org/wiki/File:Onion_on_White.JPG"
description: >-
  Cibule kuchyňská (Allium cepa) patří k nejvýznamnějším druhům zeleniny v ČR. Registr ÚKZÚZ ji
  vede ve třech skupinách podle pěstitelského směru — cibule jarní (setá na jaře, sklízená
  vyzrálá na sucho), cibule ozimá (setá na podzim, sklízená o měsíc dříve) a cibule sečka
  pro produkci sazečky. Je náročná na strukturu půdy a nesnáší zaplevelení.
vysevek: 3–5 kg/ha přímý výsev (cílová hustota 60–90 rostlin/m²); ze sazečky 600–900 kg/ha
hnojeni: N 100–140 kg/ha (poslední dávka nejpozději 6 týdnů před sklizní); K 150–200 kg K₂O/ha; citlivá na chloridy
vynos_t_ha: 35–60
sklizen: srpen–září (jarní), červenec (ozimá)
seti_mesice: [3, 4]
sklizen_mesice: [7, 8, 9]
vyuziti: konzumní cibule pro čerstvý trh a skladování, sušení, konzervárenské zpracování, sazečka
choroby:
  - plíseň cibulová (Peronospora destructor)
  - krčková hniloba (Botrytis allii)
  - bílá hniloba cibule (Sclerotium cepivorum)
  - fuzariová bazální hniloba (Fusarium oxysporum f. sp. cepae)
  - vrtalka pórová (Napomyza gymnostoma) a květilka cibulová
osevni_postup:
  - name: Předplodina a osevní postup
    text: Cibule se nesmí vracet na stejný pozemek dříve než za 4–5 let kvůli bílé hnilobě a hlístici. Nejlepší předplodinou jsou obilniny nebo luskoviny; nevhodná je jakákoli cibulová zelenina.
  - name: Příprava půdy
    text: Cibule vyžaduje strukturní, hluboko zpracovanou půdu bez utužení a s neutrální reakcí. Jemné seťové lůžko je podmínkou — drobné semeno se seje mělce, do 2–3 cm.
  - name: Setí
    text: Jarní cibule se seje co nejdříve na jaře (březen–duben) při teplotě půdy nad 5 °C, ozimá v srpnu. Sazečka se sází v dubnu do hloubky 2–3 cm.
  - name: Hnojení
    text: Dusík dělit, poslední dávku nejpozději šest týdnů před sklizní — pozdní dusík zhoršuje vyzrávání a skladovatelnost. Chloridová hnojiva jsou nevhodná.
  - name: Ochrana rostlin a regulace plevelů
    text: Cibule je velmi slabý konkurent plevelů, herbicidní ochrana je nutná od vzcházení. Plíseň cibulová vyžaduje preventivní fungicidní program od června.
  - name: Sklizeň a dosoušení
    text: Sklízí se při poléhání a zasychání nati u 70–80 % porostu. Klíčové je dosoušení na 30–35 °C — nedosušená cibule se ve skladu rozkládá krčkovou hnilobou.
wikipedia: https://cs.wikipedia.org/wiki/Cibule_kuchy%C5%88sk%C3%A1
faq:
  - q: Jaký je rozdíl mezi jarní a ozimou cibulí?
    a: Jarní cibule se seje na jaře a sklízí v srpnu až září, dobře se skladuje a tvoří hlavní produkci. Ozimá cibule se seje v srpnu, přezimuje jako mladá rostlina a sklízí se už v červenci — je ale hůře skladovatelná a určená pro časný čerstvý trh.
  - q: Proč cibule ve skladu hnije?
    a: Nejčastější příčinou je krčková hniloba z nedostatečného dosušení. Cibule musí mít po sklizni zaschlý krček a suché slupky; dosoušení teplým vzduchem při 30–35 °C je nezbytné.
  - q: Co je cibule sečka?
    a: Sečka je hustě setá cibule určená k produkci sazečky — malých cibulek, které se příští rok vysazují místo přímého výsevu. ÚKZÚZ ji vede jako samostatnou skupinu s vlastními registrovanými odrůdami.
