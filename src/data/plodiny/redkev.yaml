slug: redkev
name: Ředkev setá
name_plural: Ředkev
skupina: zelenina
hero_image: /images/plodiny/redkev.jpg
hero_author: "Dguendel"
hero_license: "CC BY 4.0"
hero_source: "https://commons.wikimedia.org/wiki/File:Blankenburg,_Kloster_Michaelstein,_Klostergarten,_Rettich.jpg"
description: >-
  Ředkev setá (Raphanus sativus) je kořenová zelenina s výrazně větším a ostřejším kořenem než
  příbuzná ředkvička. V českém registru odrůd zahrnuje letní typy s bílým podlouhlým kořenem
  i zimní černou ředkev, která se skladuje přes zimu. Odrůdy typu daikon dosahují délky přes
  30 cm a vyžadují hlubokou, kamene prostou půdu.
vysevek: 6–12 kg/ha (spon 30–40 × 10–15 cm)
hnojeni: N 80–100 kg/ha; K 150–200 kg K₂O/ha; nehnojit čerstvým hnojem
vynos_t_ha: 25–40
sklizen: červenec–listopad
seti_mesice: [5, 6, 7]
sklizen_mesice: [7, 8, 9, 10, 11]
vyuziti: čerstvá konzumace, zimní skladovací zelenina, nakládání a kvašení, gastronomie
choroby:
  - nádorovitost kořenů brukvovitých (Plasmodiophora brassicae)
  - dřepčíci rodu Phyllotreta
  - květilka zelná (Delia radicum)
  - alternariová skvrnitost (Alternaria brassicae)
  - černá hniloba kořene (Aphanomyces raphani)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Odstup po brukvovitých nejméně 3–4 roky. Ředkev se často seje jako druhá plodina po sklizni rané zeleniny nebo ozimého ječmene.
  - name: Příprava půdy a setí
    text: Hluboko zpracovaná půda bez kamenů, zejména u dlouhých typů daikon. Letní typy se sejí od května, zimní černá ředkev až v červnu až červenci, aby nevybíhala do květu.
  - name: Hnojení a závlaha
    text: Střídmé hnojení dusíkem; přehnojená ředkev je dutá a nadměrně ostrá. Rovnoměrná závlaha je podmínkou hladkého nepraskajícího kořene.
  - name: Ochrana rostlin
    text: Dřepčíci ohrožují mladý porost, řešením je zakrytí netkanou textilií. Larvy květilky zelné vytvářejí v kořeni chodbičky a znehodnocují ho pro trh.
  - name: Sklizeň a skladování
    text: Letní ředkev se sklízí průběžně od července. Zimní černá ředkev v říjnu až listopadu před mrazy; při 0–1 °C a vysoké vlhkosti vydrží až do jara.
wikipedia: https://cs.wikipedia.org/wiki/%C5%98edkev_set%C3%A1
faq:
  - q: Jaký je rozdíl mezi ředkví a ředkvičkou?
    a: Jsou to formy téhož druhu Raphanus sativus, ale ÚKZÚZ je vede jako samostatné skupiny odrůd. Ředkvička má drobný kořen a dozraje za 3–6 týdnů, ředkev tvoří velký kořen s vegetační dobou 8–14 týdnů a zimní typy se skladují.
  - q: Kdy sít zimní černou ředkev?
    a: Až v červnu až červenci. Dřívější výsev znamená, že rostlina vlivem dlouhého dne vyběhne do květu a kořen nevytvoří.
  - q: Proč je ředkev dutá?
    a: Dutost vzniká přerostlostí nebo nerovnoměrnou závlahou, kdy vnitřní pletivo nestačí růstu kořene. Pomáhá včasná sklizeň a vyrovnané zavlažování.
