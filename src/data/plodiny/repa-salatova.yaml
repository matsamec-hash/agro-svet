slug: repa-salatova
name: Řepa salátová
name_plural: Řepa salátová
skupina: zelenina
hero_image: /images/plodiny/repa-salatova.jpg
hero_author: "Ellie from UK"
hero_license: "CC BY-SA 2.0"
hero_source: "https://commons.wikimedia.org/wiki/File:9_365_Beetroot_(27015792555).jpg"
description: >-
  Řepa salátová (Beta vulgaris subsp. vulgaris var. conditiva), lidově červená řepa, je nenáročná
  kořenová zelenina s vysokým obsahem betalainových barviv. V registru ÚKZÚZ je vedena jako
  samostatný druh oddělený od řepy cukrové a krmné. Odrůdy se liší tvarem kořene (kulatý,
  válcovitý), intenzitou vybarvení a přítomností světlých kroužků v dužnině.
vysevek: 8–12 kg/ha (spon 30–40 × 8–12 cm)
hnojeni: N 100–140 kg/ha; K 200–250 kg K₂O/ha; bór proti srdéčkové hnilobě; snáší i zasolenější půdy
vynos_t_ha: 35–60
sklizen: srpen–říjen
seti_mesice: [4, 5]
sklizen_mesice: [8, 9, 10]
vyuziti: čerstvý trh, vaření a sterilování, kvašená řepa a šťávy, přírodní barvivo
choroby:
  - cerkosporióza řepy (Cercospora beticola)
  - srdéčková hniloba (fyziologická, nedostatek bóru)
  - háďátko řepné (Heterodera schachtii)
  - padlí řepné (Erysiphe betae)
  - spála klíčních rostlin (Pythium, Aphanomyces)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Odstup po řepě cukrové, krmné a špenátu nejméně 4 roky kvůli háďátku řepnému. Nejlepší předplodinou jsou obilniny.
  - name: Setí
    text: Seje se od dubna do května do hloubky 2–3 cm. Klubíčko řepy obsahuje více semen, takže i při přesném výsevu je u starších odrůd nutná jednocení; moderní jednoklíčkové odrůdy ho nevyžadují.
  - name: Hnojení a závlaha
    text: Řepa je odolná vůči suchu i zasolení, ale výnos a vybarvení zvyšuje pravidelná závlaha. Bór aplikovat preventivně, zejména na vyvápněných půdách.
  - name: Regulace plevelů
    text: Kritické je období do zapojení porostu. Řepa salátová má stejné herbicidní možnosti jako řepa cukrová; využívá se i mechanická kultivace mezi řádky.
  - name: Sklizeň a skladování
    text: Sklízí se od srpna do října při dosažení průměru 6–10 cm — přerostlá řepa dřevnatí a vybledne. Nať se odřezává tak, aby nedošlo k poranění kořene, jinak řepa při vaření pouští barvu.
wikipedia: https://cs.wikipedia.org/wiki/%C5%98epa_obecn%C3%A1
faq:
  - q: Proč má řepa v dužnině světlé kroužky?
    a: Střídání tmavých a světlých kroužků je odrůdová vlastnost zvýrazněná stresem — hlavně suchem a vysokými teplotami. Odrůdy s vyrovnaným tmavým vybarvením ÚKZÚZ v popisu odrůdy uvádí.
  - q: Kdy sklízet salátovou řepu?
    a: Při průměru kořene 6–10 cm, zpravidla od srpna do října. Přerostlé kořeny dřevnatí, ztrácejí barvu a hůř se zpracovávají.
  - q: Musí se salátová řepa jednotit?
    a: U klasických odrůd ano, protože klubíčko obsahuje více semen. Moderní jednoklíčkové (monogermní) odrůdy jednocení nevyžadují a sejí se rovnou na konečnou vzdálenost.
