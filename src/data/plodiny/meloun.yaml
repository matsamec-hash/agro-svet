slug: meloun
name: Meloun
name_plural: Melouny
skupina: zelenina
hero_image: /images/plodiny/meloun.jpg
hero_author: "Atomicbre at English Wikipedia"
hero_license: "CC BY 3.0"
hero_source: "https://commons.wikimedia.org/wiki/File:Cantaloupe_and_canary_melon.jpg"
description: >-
  Meloun je v registru ÚKZÚZ veden ve dvou samostatných druzích — meloun vodní (Citrullus
  lanatus) s červenou šťavnatou dužninou a meloun cukrový (Cucumis melo), do kterého patří
  typy cantaloupe, charentais a žluté zimní melouny. Oba jsou vysoce teplomilné; v českých
  podmínkách se pěstují ze sadby, často pod fólií nebo netkanou textilií.
vysevek: výsev do sadbovačů 1,5–3 kg/ha; spon vodní 200 × 100 cm, cukrový 150 × 70–100 cm
hnojeni: N 100–140 kg/ha; K 200–250 kg K₂O/ha; organické hnojení velmi vhodné
vynos_t_ha: 25–50 (vodní), 20–35 (cukrový)
sklizen: srpen–září
seti_mesice: [4, 5]
sklizen_mesice: [8, 9]
vyuziti: čerstvá konzumace, gastronomie, šťávy
choroby:
  - plíseň okurková (Pseudoperonospora cubensis)
  - padlí tykvovitých (Podosphaera xanthii)
  - fuzariové vadnutí (Fusarium oxysporum f. sp. melonis)
  - antraknóza tykvovitých (Colletotrichum orbiculare)
  - virus mozaiky okurky (CMV)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Odstup po tykvovitých nejméně 4 roky. Meloun vyžaduje nejteplejší pozemky s lehčí, rychle se ohřívající půdou a ochranou před větrem.
  - name: Předpěstování sadby
    text: Výsev do květináčů v dubnu při 25 °C. Meloun nesnáší narušení kořenů, proto se pěstuje v sadbovačích s velkou buňkou a přesazuje s celým kořenovým balem.
  - name: Výsadba a krytí
    text: Na pole po polovině května, zpravidla na černou mulčovací fólii a pod netkanou textilii nebo nízký tunel. Krytí se odstraní až s nástupem kvetení kvůli opylení.
  - name: Hnojení a závlaha
    text: Kapková závlaha pod fólií. Voda je klíčová do fáze nalévání plodů; před sklizní se závlaha omezí, jinak klesá obsah cukru a dužnina je vodnatá.
  - name: Opylení a redukce plodů
    text: Meloun je závislý na hmyzím opylení. Na rostlině se ponechávají dva až čtyři plody u vodního melounu, u cukrového čtyři až šest — víc plodů znamená malé a nesladké.
  - name: Sklizeň
    text: Vodní meloun se sklízí při zaschnutí úponku u stopky a dutém zvuku po poklepu. Cukrový meloun se od stopky sám odděluje a intenzivně voní — to je nejspolehlivější znak zralosti.
wikipedia: https://cs.wikipedia.org/wiki/Meloun
faq:
  - q: Jaký je rozdíl mezi melounem vodním a cukrovým?
    a: Jsou to různé botanické druhy. Vodní meloun (Citrullus lanatus) má velké plody s červenou dužninou a tmavými semeny, cukrový (Cucumis melo) menší plody s oranžovou nebo nazelenalou aromatickou dužninou a semeny v dutině. ÚKZÚZ je vede odděleně.
  - q: Jak poznat zralý meloun?
    a: U vodního melounu podle zaschlého úponku u stopky, žluté skvrny na spodní straně a dutého zvuku po poklepu. Cukrový meloun se od stopky sám odděluje a silně voní.
  - q: Dá se meloun v ČR vypěstovat na poli?
    a: Ano, v teplých oblastech jižní Moravy a Polabí, ale téměř vždy ze sadby, na mulčovací fólii a s počátečním krytím textilií. Přímý výsev naše sezóna nestíhá.
