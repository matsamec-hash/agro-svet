slug: redkvicka
name: Ředkvička
name_plural: Ředkvičky
skupina: zelenina
hero_image: /images/plodiny/redkvicka.jpg
hero_author: "Felixphoto"
hero_license: "Public domain"
hero_source: "https://commons.wikimedia.org/wiki/File:Radish.jpg"
description: >-
  Ředkvička (Raphanus sativus var. sativus) je nejrychlejší zelenina v českém sortimentu —
  od výsevu ke sklizni jí stačí tři až šest týdnů. Díky tomu se pěstuje v mnoha sledech za
  sezónu a slouží i jako meziplodina. Odrůdy se liší tvarem (kulatý, poloudlouhý, dlouhý),
  barvou a hlavně odolností proti dřevnatění a vybíhání do květu.
vysevek: 8–15 kg/ha (spon 10–12 × 3–5 cm)
hnojeni: N 60–80 kg/ha; nepřehnojovat dusíkem (dutost a ostrá chuť); P a K dle rozborů
vynos_t_ha: 15–25
sklizen: duben–říjen, průběžně po sledech
seti_mesice: [3, 4, 5, 6, 7, 8]
sklizen_mesice: [4, 5, 6, 7, 8, 9, 10]
vyuziti: čerstvá konzumace, svazkování pro trh, mytá ředkvička v sáčcích
choroby:
  - dřepčíci rodu Phyllotreta
  - nádorovitost kořenů brukvovitých (Plasmodiophora brassicae)
  - květilka zelná (Delia radicum)
  - plíseň zelná (Hyaloperonospora parasitica)
  - černá hniloba kořene (Aphanomyces raphani)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Nevracet po brukvovitých dříve než za 3 roky kvůli nádorovitosti. Pro krátkou vegetační dobu se ředkvička výborně hodí jako předplodina i jako meziplodina mezi hlavními kulturami.
  - name: Setí
    text: Seje se mělce, 1–2 cm, od března do srpna v týdenních až dvoutýdenních sledech. Nejranější výsevy pod netkanou textilii už koncem února. Letní výsevy jsou rizikové kvůli vybíhání.
  - name: Hnojení a závlaha
    text: Nároky na živiny jsou nízké, ředkvička dobře využívá zbytkovou zásobu. Rozhodující je vyrovnaná vlhkost — jakýkoli výpadek vody způsobí dřevnatění a pálivou chuť.
  - name: Ochrana rostlin
    text: Hlavním škůdcem jsou dřepčíci, kteří mladé porosty zdecimují během několika dnů. Osvědčenou nechemickou ochranou je zakrytí porostu netkanou textilií hned po zasetí.
  - name: Sklizeň
    text: Sklízí se v technologické zralosti při dosažení průměru 2–3 cm. Přerostlá ředkvička dřevnatí a je dutá. Pro trh se svazkuje s natí nebo se prodává mytá bez nati.
wikipedia: https://cs.wikipedia.org/wiki/%C5%98edkvi%C4%8Dka
faq:
  - q: Proč je ředkvička dutá a pálivá?
    a: Obojí způsobuje stres z nedostatku vody nebo přerostlost. Při suchu rostlina zpomalí růst kořene, pletivo dřevnatí a stoupá obsah hořčičných silic. Řešením je pravidelná závlaha a včasná sklizeň.
  - q: Jak dlouho trvá vypěstovat ředkvičku?
    a: Od výsevu ke sklizni 3–6 týdnů podle odrůdy a ročního období. Jarní výsevy rostou déle kvůli nižším teplotám, letní nejrychleji — ty jsou ale nejnáchylnější k vybíhání do květu.
  - q: Jak zabránit poškození dřepčíky bez postřiku?
    a: Zakrýt porost netkanou textilií hned po zasetí a nechat ji do sklizně. Dřepčíci se nedostanou k rostlinám a textilie zároveň urychlí růst.
