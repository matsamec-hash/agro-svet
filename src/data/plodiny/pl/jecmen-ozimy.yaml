slug: jecmen-ozimy
name: Jęczmień ozimy
name_plural: Jęczmień ozimy
description: >-
  Jęczmień ozimy (Hordeum vulgare) jest ozimą rośliną zbożową o najkrótszym okresie wegetacyjnym
  wśród ozimych zbóż — zbiera się go o 1–2 tygodnie wcześniej niż pszenicę. Jest mniej odporny na
  zimowe mrozy, ale osiąga wysokie plony i wykorzystywany jest głównie jako pasza i surowiec do
  produkcji słodu.
vysevek: 280–380 kiełkujących ziaren/m²
hnojeni: N 100–150 kg/ha w podzielonych dawkach; fosfor i potas według analiz gleby
vynos_t_ha: 6–9
sklizen: koniec czerwca do początku lipca
vyuziti: ziarno paszowe, jęczmień browarniany (produkcja słodu i piwa), GPS
choroby:
  - brązowa plamistość jęczmienia (rynchosporioza)
  - paskowatość jęczmienia (pyrenofora)
  - mączniak prawdziwy zbóż i traw
  - rdze zbóż
  - żółta mozaika jęczmienia (BaYMV/BaMMV, przenoszona przez grzyby glebowe)
osevni_postup:
  - name: Przedplon
    text: >-
      Najlepsze przedplony to rzepak, rośliny strączkowe i okopowe. Po zbożu wzrasta ryzyko chorób i
      wirusów przenoszonych przez grzyby glebowe.
  - name: Przygotowanie gleby
    text: >-
      Płytsza orka 18–22 cm, wyrównanie łoża siewnego; jęczmień ozimy jest wrażliwy na zagęszczenie
      i złe pH (optymalne 6,0–7,0).
  - name: Siew
    text: >-
      Termin siewu 20 września – 10 października. Głębokość 3–4 cm, norma wysiewu 280–380
      kiełkujących ziaren/m².
  - name: Nawożenie azotem
    text: >-
      Azot w podzielonych dawkach; dawka startowa na wiosnę i druga dawka w fazie strzelania w
      źdźbło. Przenawożenie N zwiększa ryzyko leżenia.
  - name: Ochrona roślin
    text: >-
      Zaprawianie nasion (paskowatość, brązowa plamistość), regulatory wzrostu przy ryzyku leżenia,
      fungicydy według występowania chorób.
  - name: Zbiór
    text: >-
      Jęczmień szybko dojrzewa i jest podatny na wypadanie ziarna — zbiór należy przeprowadzić na
      czas, przy wilgotności 13–15 %.
faq:
  - q: Dlaczego jęczmień ozimy zbiera się wcześniej niż ozimą pszenicę?
    a: >-
      Jęczmień ozimy ma krótszy okres wegetacyjny i dojrzewa około 1–2 tygodnie wcześniej niż
      pszenica. To umożliwia wcześniejszy zbiór i zmniejsza ryzyko strat.
  - q: Jaka jest minimalna mrozoodporność jęczmienia ozimego?
    a: >-
      Jęczmień ozimy należy do mniej mrozoodpornych ozimych zbóż — znosi około −12 do −15 °C w
      strefie odgałęziania (bez pokrywy śnieżnej).
  - q: Czy można uprawiać jęczmień ozimy do wykorzystania browarnianego?
    a: >-
      Tak, istnieją browarniane odmiany jęczmienia ozimego. Aby spełnić parametry browarniane
      (zawartość białka, kiełkowanie), należy przestrzegać specyficznych działań agrotechnicznych,
      szczególnie ograniczyć nawożenie azotem.
