# Polský overlay plodin. slug, skupina, hero_*, seti_mesice, sklizen_mesice
# a wikipedia zůstávají z cs (klíče, obrázky, kalendář). Pole choroby[] drží
# STEJNÉ pořadí i délku jako cs — mapování na entitu jde přes cs index.
slug: psenice-ozima
name: Pszenica ozima
name_plural: Pszenica ozima
description: >-
  Pszenica ozima (Triticum aestivum) jest najpowszechniejszym zbożem w Polsce, uprawianym głównie na
  ziarno przeznaczone do konsumpcji i paszy. Forma ozima jest wysiewana na jesieni i zbierana latem,
  osiąga wyższe plony niż forma jara.
vysevek: 300–450 kiełkujących ziaren/m² (jesienny wysiew); niższe wartości dla wczesnych wysiewów
hnojeni: >-
  N 120–180 kg/ha w dawkach podzielonych (start wegetacji, strzelanie w źdźbło, kłoszenie); P i K
  według analiz
vynos_t_ha: 6–9
sklizen: lipiec
vyuziti: mąka spożywcza, ziarno paszowe, skrobia, bioetanol
choroby:
  - septorioza liści pszenicy (Zymoseptoria tritici)
  - fuzariozy kłosa i korzeni
  - mączniak prawdziwy zbóż i traw
  - rdze zbóż (pszeniczna, żółta)
  - śnięć karłowa
osevni_postup:
  - name: Przedplon
    text: >-
      Najlepsze przedplony to rzepak, groch i rośliny strączkowe. Powtarzająca się pszenica po
      pszenicy zwiększa ryzyko fuzariozy i septoriozy.
  - name: Przygotowanie gleby
    text: >-
      Orka na głębokość 20–25 cm po zbiorze przedplonu, wyrównanie łoża siewnego; przy minimalizacji
      dokładne włączenie resztek pożniwnych.
  - name: Siew
    text: >-
      Optymalny termin siewu w Polsce: 1.–20. października. Głębokość siewu 3–5 cm, wysiew 300–450
      kiełkujących ziaren/m².
  - name: Nawożenie azotem
    text: >-
      Azot aplikować w dawkach podzielonych — na starcie wegetacji, w fazie strzelania w źdźbło i
      przy kłoszeniu zgodnie z celem plonowania.
  - name: Ochrona roślin
    text: >-
      Zaprawianie nasion, wiosenne zabiegi fungicydowe (septorioza, mączniak, rdze) oraz ochrona
      kłosa (fuzariozy). Regulatory wzrostu w przypadku ryzyka leżenia.
  - name: Zbiór
    text: >-
      Zbiór przy wilgotności ziarna 13–15 % (lipiec); prawidłowe ustawienie młocarni minimalizuje
      straty.
faq:
  - q: Kiedy wysiewa się pszenicę ozimą?
    a: >-
      Optymalny termin wysiewu pszenicy ozimej w Polsce to 1.–20. października. Zbyt wczesny wysiew
      zwiększa ryzyko chorób grzybowych i nadmiaru szkodników.
  - q: Jakie jest zapotrzebowanie na azot w pszenicy ozimej?
    a: >-
      Pszenica ozima potrzebuje 120–180 kg N/ha, aplikowanych w 2–3 dawkach od startu wegetacji do
      fazy kłoszenia.
  - q: Jaki jest typowy plon pszenicy ozimej w Polsce?
    a: >-
      Średni plon w Polsce wynosi około 6–7 t/ha, w korzystnych warunkach i przy dobrej agrotechnice
      można osiągnąć 8–9 t/ha.
  - q: Jakie są najgroźniejsze choroby pszenicy ozimej?
    a: >-
      Kluczowe są septorioza liści pszenicy, fuzariozy kłosa i mączniak prawdziwy zbóż i traw.
      Ochrona fungicydami w odpowiedniej fazie jest ekonomicznie uzasadniona.
