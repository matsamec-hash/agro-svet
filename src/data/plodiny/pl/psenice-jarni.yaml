slug: psenice-jarni
name: Pszenica jara
name_plural: Pszenica jara
description: >-
  Pszenica jara (Triticum aestivum) jest wysiewana na wiosnę i zbierana o 2–3 tygodnie wcześniej niż
  pszenica ozima. Osiąga niższe plony, jednak jej ziarno ma zazwyczaj wyższą zawartość białka i
  glutenu, co predestynuje ją do produkcji mąki spożywczej o dobrych właściwościach piekarniczych.
vysevek: 350–500 kiełkujących ziaren/m²
hnojeni: N 80–130 kg/ha; nacisk na jakościową dawkę azotu w fazie strzelania w źdźbło do kłosowania
vynos_t_ha: 4–6
sklizen: lipiec
vyuziti: mąka spożywcza (chleb, pieczywo), ziarno paszowe
choroby:
  - septorioza liści pszenicy (Zymoseptoria tritici)
  - mączniak prawdziwy zbóż i traw
  - rdza zbóż
  - fuzariozy kłosa
osevni_postup:
  - name: Przedplon
    text: >-
      Pszenica jara nie jest tak wymagająca co do przedplonu jak ozima; odpowiednie są rośliny
      strączkowe, rzepak lub rośliny okopowe.
  - name: Przygotowanie gleby
    text: >-
      Jesienna orka lub wiosenne przygotowanie jak najszybciej po wyschnięciu gleby; drobne łóżko
      siewne dla równomiernego wschodu.
  - name: Siew
    text: >-
      Siew jak najszybciej na wiosnę (luty–marzec), głębokość 3–4 cm, norma wysiewu 350–500
      kiełkujących ziaren/m².
  - name: Nawożenie
    text: >-
      Azot 80–130 kg/ha; jakościowa dawka w fazie strzelania w źdźbło wspiera zawartość białka w
      ziarnie.
  - name: Ochrona roślin
    text: >-
      Zaprawianie nasion, fungicydowe traktowanie przy wystąpieniu chorób (mączniak, septorioza,
      fuzariozy kłosa) według progu szkodliwości.
  - name: Zbiór
    text: >-
      Zbiór w lipcu przy wilgotności ziarna 13–15 %; dla odmian spożywczych monitorować także
      parametry jakości (test Zeleny'ego, liczba opadania).
faq:
  - q: Czym różni się pszenica jara od ozimej?
    a: >-
      Pszenica jara jest wysiewana na wiosnę i nie potrzebuje wernalizacji. Osiąga niższy plon
      ziarna, ale zazwyczaj wyższą zawartość białka i glutenu odpowiedniego do piekarstwa.
  - q: Jaką normę wysiewu wybieramy dla pszenicy jarej?
    a: >-
      Zaleca się 350–500 kiełkujących ziaren/m². Wyższy wysiew kompensuje krótszy okres wegetacyjny
      i niższe krzewienie przy wiosennym siewie.
  - q: Kiedy siać pszenicę jarą?
    a: >-
      Siew powinien odbyć się jak najszybciej po wyschnięciu gleby, idealnie luty–marzec. Późny siew
      obniża plon i jakość ziarna.
