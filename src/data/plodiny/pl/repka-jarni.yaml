slug: repka-jarni
name: Rzepak jary
name_plural: Rzepak jary
description: >-
  Rzepak jary (Brassica napus var. annua) wysiewa się na wiosnę i nie wymaga wernalizacji. Osiąga
  niższy plon niż forma ozima, ale służy jako alternatywa w przypadku złego przezimowania rzepaku
  ozimego lub jako sposób na skrócenie zmianowania. Okres wegetacji jest znacznie krótszy.
vysevek: 60–100 kiełkujących nasion/m² (wyższy wysiew kompensuje krótszą wegetację)
hnojeni: N 80–120 kg/ha łącznie; siarka 20–30 kg/ha
vynos_t_ha: 2–3,5
sklizen: sierpień
vyuziti: olej roślinny, śruta białkowa (pasza)
choroby:
  - alternarioza (Alternaria spp.)
  - zgnilizna twardzikowa (Sclerotinia sclerotiorum)
  - mączniak prawdziwy roślin kapustnych
osevni_postup:
  - name: Przedplon
    text: >-
      Podobnie jak w przypadku rzepaku ozimego, obowiązuje 4–5-letnie zmianowanie bez roślin
      kapustnych. Odpowiednie przedplony to zboża i rośliny strączkowe.
  - name: Przygotowanie gleby
    text: >-
      Wiosenne przygotowanie łóżka siewnego jak najszybciej po wyschnięciu gleby; drobne, dobrze
      ubite łóżko siewne dla małych nasion.
  - name: Siew
    text: >-
      Jak najszybciej na wiosnę (luty–marzec), głębokość 1–2 cm, wysiew 60–100 kiełkujących
      ziaren/m². Późny siew znacznie obniża plon.
  - name: Nawożenie
    text: >-
      N 80–120 kg/ha; siarka 20–30 kg/ha. Całkowite nawożenie jest mniej zróżnicowane niż w
      przypadku formy ozimej.
  - name: Ochrona roślin
    text: >-
      Herbicydy, fungicydy w przypadku wystąpienia alternariozy i zgnilizny twardzikowej;
      insektycydy w przypadku wystąpienia stonki i chrząszczy.
  - name: Zbiór
    text: >-
      Zbiór w sierpniu; rzepak jary szybko dojrzewa i jest podatny na wypadanie z łuszczyn — należy
      monitorować termin.
faq:
  - q: Kiedy uprawia się rzepak jary zamiast ozimego?
    a: >-
      Rzepak jary sadzi się w przypadku wypadnięcia lub silnego uszkodzenia rzepaku ozimego przez
      mróz zimą, lub jako roślinę międzyplonową w krótszym zmianowaniu. Plon jest znacznie niższy
      niż w przypadku formy ozimej.
  - q: Jaki plon nasion osiąga rzepak jary?
    a: >-
      Plon wynosi od 2 do 3,5 t/ha, czyli znacznie mniej niż forma ozima (3–5 t/ha). Wczesny siew i
      odpowiednie nawożenie są kluczem do maksymalizacji plonu.
