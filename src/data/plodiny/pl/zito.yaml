slug: zito
name: Żyto ozime
name_plural: Żyto
description: >-
  Żyto ozime (Secale cereale) jest bardzo odporną ozimą rośliną zbożową, znoszącą najzimniejsze i
  najmniej urodzajne warunki ze wszystkich zbóż. W Polsce uprawiane jest na lekkich, piaszczystych i
  kwaśnych glebach, które nie nadają się do uprawy pszenicy, zarówno na ziarno spożywcze (chleb
  żytni), jak i jako roślina energetyczna (GPS, biogaz).
vysevek: 200–300 kiełkujących ziaren/m²
hnojeni: N 80–120 kg/ha w podzielonych dawkach; toleruje niższe zasobienie składnikami pokarmowymi
vynos_t_ha: 5–8
sklizen: przełom czerwca i lipca
vyuziti: mąka żytnia (chleb, pieczywo), ziarno paszowe, GPS (biogaz), whisky żytnia
choroby:
  - sporysz żyta (Claviceps purpurea) — toksyczny, monitorować zawartość w ziarnie
  - mączniak prawdziwy zbóż i traw
  - rdza zbóż
  - śnięć żytnią
osevni_postup:
  - name: Przedplon i zmianowanie
    text: >-
      Żyto jest najmniej wymagające pod względem przedplonu ze wszystkich zbóż. Znosi także
      powtarzane uprawy, ale korzystny jest przedplon roślin strączkowych lub okopowych.
  - name: Przygotowanie gleby
    text: >-
      Płytka orka lub minimalizacja; żyto dobrze rośnie także na lekkich glebach kwaśnych (pH
      5,5–6,5), gdzie inne zboża zawodzą.
  - name: Siew
    text: >-
      Siew wrzesień–październik, głębokość 2–4 cm, norma wysiewu 200–300 kiełkujących ziaren/m².
      Żyto szybko odrasta i tworzy gęste łany.
  - name: Nawożenie
    text: >-
      Wymagania dotyczące składników pokarmowych są niższe niż w przypadku pszenicy. N 80–120 kg/ha,
      stosowane wiosną w 1–2 dawkach.
  - name: Ochrona roślin
    text: >-
      Regulatory wzrostu są konieczne (żyto jest wysokie i podatne na leżenie), fungicydy stosować w
      zależności od występowania chorób. Sporysz monitorować i w przypadku wystąpienia zabezpieczyć
      łan.
  - name: Zbiór
    text: >-
      Żyto dojrzewa na przełomie czerwca i lipca. Monitorować zawartość sporyszu w ziarnie — przy
      przekroczeniu limitu nie można używać ziarna do celów spożywczych.
faq:
  - q: Na jakich glebach uprawia się żyto?
    a: >-
      Żyto znosi najlżejsze, kwaśne i mniej urodzajne gleby, które nie nadają się do pszenicy.
      Dobrze rośnie przy pH 5,5–6,5, potrafi wykorzystać składniki pokarmowe z mniej dostępnych
      form.
  - q: Co to jest sporysz i dlaczego jest niebezpieczny?
    a: >-
      Sporysz (Claviceps purpurea) to grzybowy patogen tworzący toksyczne sklerocja w kłosach żyta.
      Zawiera alkaloidy, które są toksyczne dla ludzi i zwierząt. Zawartość sporyszu w ziarnie
      spożywczym jest ograniczona przepisami.
  - q: Jakie plony daje żyto ozime?
    a: >-
      Żyto osiąga plony 5–8 t/ha; na urodzajnych glebach zbliża się do pszenicy, na ubogich jest
      wyraźniejszym wyborem.
