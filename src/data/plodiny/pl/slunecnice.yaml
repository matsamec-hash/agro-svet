slug: slunecnice
name: Słonecznik zwyczajny
name_plural: Słoneczniki
description: >-
  Słonecznik zwyczajny (Helianthus annuus) jest ciepłolubną rośliną olejną uprawianą dla nasion o
  wysokiej zawartości oleju (45–55 %). Jest interesujący jako roślina przerywająca siewy zbóż,
  roślina miododajna oraz w ostatnich latach także jako roślina bioenergetyczna. Wymaga ciepłego i
  słonecznego klimatu.
hnojeni: N 80–120 kg/ha; P i K według analiz; słonecznik jest wymagający pod względem potasu i boru
vynos_t_ha: 2,5–4
sklizen: wrzesień–październik (przy wilgotności nasion <12 %)
vyuziti: jadalny olej słonecznikowy, pasze, roślina miododajna, karma dla ptaków
choroby:
  - zgnilizna twardzikowa (Sclerotinia sclerotiorum) — najniebezpieczniejsza
  - pleśń słonecznikowa (Plasmopara halstedii)
  - alternarioza
  - zgnilizna łodygi (Diaporthe helianthi)
osevni_postup:
  - name: Przedplon i zmianowanie
    text: >-
      Słonecznik jest doskonałym przedplonem dla zbóż. Sam wymaga 4–5-letniego odstępu od
      słonecznika i innych gospodarzy zgnilizny twardzikowej (rzepak, groch).
  - name: Przygotowanie gleby
    text: >-
      Głęboka orka jesienna (25–30 cm), wiosenne przygotowanie stanowiska siewnego. Słonecznik
      dobrze rośnie na głębokich, dobrze napowietrzonych glebach.
  - name: Siew
    text: >-
      Siew od końca kwietnia do połowy maja, gdy temperatura gleby osiągnie 8–10 °C. Głębokość 4–6
      cm, norma wysiewu 5–8 roślin/m².
  - name: Nawożenie
    text: >-
      N 80–120 kg/ha, stosowane przed siewem lub podczas przygotowania gleby. Słonecznik jest
      wymagający pod względem K i B — należy monitorować ich zawartość w glebie.
  - name: Ochrona roślin
    text: >-
      Herbicydy (preemergentne lub postemergentne). Septorioza — fungicydy w czasie kwitnienia;
      pleśń słonecznikowa — odporność odmianowa + zaprawianie nasion.
  - name: Zbiór
    text: >-
      Zbiór we wrześniu–październiku, przy wilgotności nasion poniżej 12 %. Przy wyższej wilgotności
      należy dosuszyć. Głowy słonecznika zbiera się specjalnym adapterem.
faq:
  - q: Jakie plony nasion słonecznika można oczekiwać?
    a: >-
      Średni plon nasion w Polsce wynosi 2,5–3,5 t/ha. W sprzyjających warunkach z dobrą
      agrotechniką można osiągnąć 4 t/ha.
  - q: Dlaczego zgnilizna twardzikowa jest tak niebezpieczna dla słonecznika?
    a: >-
      Sclerotinia sclerotiorum atakuje łodygę i głowę słonecznika i może spowodować całkowite
      zniszczenie łanu. Sklerocja przetrwają w glebie przez dziesiątki lat, dlatego kluczowe jest
      długie zmianowanie (4–5 lat bez roślin podatnych).
  - q: Czy słonecznik jest dobrym przedplonem?
    a: >-
      Tak, słonecznik jest doskonałą rośliną przerywającą dla zbóż. Zostawia głęboko ukorzenioną
      glebę i przyczynia się do rozluźnienia siewów zbóż.
vysevek: 5–8 roślin/m² (50–80 tys. roślin/ha)
