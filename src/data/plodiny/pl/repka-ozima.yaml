slug: repka-ozima
name: Rzepak ozimy
name_plural: Rzepak ozimy
description: >-
  Rzepak ozimy (Brassica napus) jest najważniejszą rośliną oleistą w Polsce, uprawianą dla oleju o
  niskiej zawartości kwasu erukowego (olej spożywczy i techniczny, biodiesel) oraz białkowych śrut.
  Wysiewa się go pod koniec lata, a po przezimowaniu tworzy gęste łany zbierane w czerwcu–lipcu.
vysevek: 40–60 kiełkujących nasion/m² (docelowa gęstość 30–50 roślin/m² po przezimowaniu)
hnojeni: >-
  N 150–200 kg/ha łącznie — jesienna dawka startowa siarki i części N, wiosenne podzielone dawki N +
  siarka 30–40 kg/ha
vynos_t_ha: 3–5
sklizen: czerwiec–lipiec (przy wilgotności nasion <9 %)
vyuziti: olej roślinny (spożywczy, biodiesel), śruta białkowa (pasza), miód (roślina miododajna)
choroby:
  - sucha zgnilizna łodygi (Leptosphaeria maculans)
  - zgnilizna twardzikowa (Sclerotinia sclerotiorum)
  - alternarioza (czerń krzyżowych)
  - szara pleśń (Botrytis cinerea)
  - czernienie tkanek rzepaku (Alternaria brassicae)
osevni_postup:
  - name: Przedplon
    text: >-
      Rzepak ozimy nie może wrócić na to samo pole wcześniej niż po 4 latach. Najlepszymi
      przedplonami są ozime zboża. Należy wykluczyć przedplony z rodziny kapustowatych.
  - name: Przygotowanie gleby i siew
    text: >-
      Wczesny zbiór przedplonu i szybkie przygotowanie jakościowego łóżka siewnego do głębokości 2–3
      cm. Siew 15 sierpnia – 5 września, wysiew 40–60 kiełkujących ziaren/m².
  - name: Jesienne nawożenie
    text: >-
      Przed siewem lub w trakcie siewu zastosować P, K i siarkę; startowa dawka N (30–40 kg/ha)
      wspiera rozwój przed przezimowaniem. Łany wchodzą w zimę w stadium rozetowym.
  - name: Wiosenne nawożenie
    text: >-
      Główne nawożenie N na wiosnę w 2–3 dawkach (łącznie 120–160 kg N/ha). Siarka 30–40 kg/ha
      wspiera plon i zawartość oleju.
  - name: Ochrona roślin
    text: >-
      Fungicydy (sucha zgnilizna, zgnilizna twardzikowa), insektycydy (mszyca, chrząszcz łodygowy,
      błyszczek rzepakowy), herbicydy jesień + wiosna.
  - name: Zbiór
    text: >-
      Zbiór bezpośredni lub z dosuszeniem. Przy zbiorze bezpośrednim czekać na wilgotność nasion
      poniżej 9 %. Straty z łuszczyn minimalizować poprzez odpowiednie ustawienie młocarni.
faq:
  - q: Kiedy wysiewa się rzepak ozimy?
    a: >-
      Optymalny termin siewu to 15 sierpnia – 5 września. Późny siew osłabia rośliny przed zimą i
      obniża przezimowanie oraz plon.
  - q: Dlaczego siarka jest ważna dla rzepaku?
    a: >-
      Siarka jest niezbędna do syntezy aminokwasów i glukozynolanów. Niedobór siarki obniża plon i
      zawartość oleju. Zaleca się 30–40 kg S/ha, najlepiej w formie siarczanu.
  - q: Jak długi musi być płodozmian dla rzepaku?
    a: >-
      Rzepak i inne rośliny kapustne nie mogą wracać na to samo pole wcześniej niż po 4 latach,
      idealnie po 5–6 latach, z powodu gromadzenia patogenów (sucha zgnilizna, zgnilizna
      twardzikowa) i szkodników.
  - q: Jaki plon nasion osiąga rzepak ozimy?
    a: >-
      Średni plon w Polsce wynosi 3–4 t/ha, w sprzyjających warunkach i przy dobrej agrotechnice
      można osiągnąć 4–5 t/ha.
