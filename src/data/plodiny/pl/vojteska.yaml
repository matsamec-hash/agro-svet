slug: vojteska
name: Vojtęska setna
name_plural: Vojtęski
description: >-
  Vojtęska setna (Medicago sativa) jest wieloletnią rośliną pastewną z głębokim systemem korzeniowym
  (3–5 m), odporną na suszę i zdolną wiązać 200–300 kg N/ha rocznie. Dostarcza wysokiej jakości
  paszę (siano, kiszonka, granulaty) o zawartości białka 18–24 % w suchej masie i zbierana jest 3–5
  razy w roku.
vysevek: 15–20 kg/ha (w czystym łanie); 8–12 kg/ha w mieszance trawnej
hnojeni: >-
  N minimalne (biologiczne wiązanie); P 50–70 kg P₂O₅/ha; K 120–200 kg K₂O/ha; Ca (wapnowanie)
  kluczowe przy pH poniżej 6,5; bor 1 kg/ha
vynos_t_ha: 10–18 (sucha masa za cały sezon, 3–5 koszeń)
sklizen: >-
  3–5 koszeń rocznie; koszenia na początku kwitnienia (10 % roślin w kwiecie); w Polsce zazwyczaj
  3–4 koszenia
vyuziti: >-
  siano, kiszonka, dehydratowane granulaty (najwyższej jakości białko paszowe), zielona pasza,
  roślina miododajna
choroby:
  - więdnięcie wertykilowe (Verticillium albo-atrum)
  - fuzarioza korzeni i łodygi (Fusarium spp.)
  - mączniak vojtęski (Peronospora aestivalis)
  - więdnięcie bakteryjne (Clavibacter michiganensis subsp. insidiosus)
osevni_postup:
  - name: Przedplon i zmianowanie
    text: >-
      Vojtęska nie może być uprawiana na tym samym polu wcześniej niż co 6–8 lat (zmęczenie gleby,
      wertykilium, fuzarium). Najlepsze przedplony to zboża.
  - name: Przygotowanie gleby i wapnowanie
    text: >-
      Głęboka orka (28–30 cm) dla rozwoju korzeni. Wapnowanie przy pH 6,5–7,5 jest kluczowe —
      wojtęska jest bardzo wrażliwa na kwasowość. Drobne łóżko siewne.
  - name: Siew
    text: >-
      Siew wczesną wiosną (luty–kwiecień) lub latem po zbiorze zbóż (lipiec). Głębokość 1–2 cm,
      norma wysiewu 15–20 kg/ha. Można dosiewać pod wiosenne zboża.
  - name: Nawożenie
    text: >-
      Potas i fosfor według analiz gleby są kluczowymi składnikami; K 120–200 kg K₂O/ha aplikuje się
      po koszeniach. Bor 1 kg/ha wspomaga tworzenie guzków.
  - name: Zbiór
    text: >-
      Koszenia należy przeprowadzać na początku kwitnienia (10–20 % roślin w kwiecie) dla optymalnej
      kombinacji plonu i jakości. Pozostawić łan minimalnie 15 cm nad ziemią.
  - name: Pielęgnacja łanu
    text: >-
      Vojtęska wytrzymuje 4–6 lat; po przezimowaniu należy monitorować gęstość łanu. W przypadku
      ubytków dosiewać lub przejść na inne wykorzystanie powierzchni.
faq:
  - q: Jak głęboko sięgają korzenie wojtęski?
    a: >-
      Vojtęska tworzy korzeń palowy sięgający aż 3–5 m w głąb. Dzięki temu czerpie wodę z głębokich
      warstw gleby i jest znacznie bardziej odporna na suszę niż rośliny o płytkim systemie
      korzeniowym.
  - q: Ile razy w roku zbiera się wojtęskę?
    a: >-
      W Polsce wojtęska zbierana jest zazwyczaj 3–4 razy w roku, w cieplejszych rejonach może być aż
      5 koszeń. Każde koszenie odbywa się na początku kwitnienia dla optymalnej jakości paszy.
  - q: Dlaczego wapnowanie jest tak ważne dla wojtęski?
    a: >-
      Vojtęska jest bardzo wrażliwa na kwasową reakcję gleby. Przy pH poniżej 6,0 łany są rzadkie,
      bakterie guzkowe źle funkcjonują, a wiązanie azotu maleje. Optymalne pH to 6,5–7,5.
  - q: Jak długo wojtęska wytrzymuje na stanowisku?
    a: >-
      Dobrze prowadzone łany wojtęski są produktywne przez 4–6 lat. Po tym czasie gęstość łanu
      maleje, wzrasta udział chwastów, a plon spada — pole należy odnowić inną rośliną.
