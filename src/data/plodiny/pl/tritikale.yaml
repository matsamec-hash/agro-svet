slug: tritikale
name: Tritikale
name_plural: Tritikale
description: >-
  Tritikale jest sztucznym hybrydem pszenicy (Triticum) i żyta (Secale), łączącym potencjał
  plonotwórczy pszenicy z odpornością i przystosowaniem żyta. Uprawia się ją głównie jako paszowe
  zboże, a w ostatnich latach także jako roślinę energetyczną (GPS, biogaz), korzystną na mniej
  urodzajnych stanowiskach.
vysevek: 280–380 kiełkujących ziaren/m²
hnojeni: N 100–140 kg/ha w podzielonych dawkach; wymagania niższe niż pszenica, wyższe niż żyto
vynos_t_ha: 5–8
sklizen: przełom czerwca i lipca
vyuziti: paszowe ziarno (drób, świnie, bydło), GPS (biogaz), eksperymenty spożywcze
choroby:
  - mączniak prawdziwy zbóż i traw
  - rdze (żółta, źdźbłowa)
  - fuzariozy kłosa
  - septorioza liści pszenicy
osevni_postup:
  - name: Przedplon
    text: >-
      Tritikale nie jest wymagająca co do przedplonu — znosi nawet gorsze stanowisko w zmianowaniu,
      jednak przedplon roślin strączkowych lub okopowych jest korzystny.
  - name: Przygotowanie gleby
    text: >-
      Orka 20–22 cm, wyrównanie łóżka siewnego. Tritikale dobrze rośnie na glebach lekkich i średnio
      ciężkich przy pH 5,5–7,0.
  - name: Siew
    text: >-
      Siew październik (forma ozima), głębokość 3–5 cm, norma wysiewu 280–380 kiełkujących
      ziaren/m².
  - name: Nawożenie
    text: >-
      Azot 100–140 kg/ha w podzielonych dawkach (start wegetacji, strączkowanie). Wyższa zawartość N
      wspiera plon, ale zwiększa ryzyko wylegania.
  - name: Ochrona roślin
    text: >-
      Regulatory wzrostu przy ryzyku wylegania (tritikale jest wysokie), fungicydy w zależności od
      występowania chorób (mączniak, rdze, fuzarium kłosa).
  - name: Zbiór
    text: >-
      Zbiór na przełomie czerwca i lipca, przy wilgotności 14–16 %. Tritikale dojrzewa szybko i ma
      skłonność do wypadania.
faq:
  - q: Jakie są zalety tritikale w porównaniu do pszenicy i żyta?
    a: >-
      Tritikale łączy dobry plon pszenicy z odpornością żyta na niekorzystne warunki (zimno, kwaśna
      gleba, susza). Jest odpowiednia na mniej urodzajne stanowiska, gdzie pszenica nie osiąga
      pełnego potencjału.
  - q: Do czego wykorzystuje się tritikale?
    a: >-
      Głównie jako paszowe ziarno dla drobiu, świń i bydła. Coraz częściej uprawia się ją także na
      cały łan (GPS) do produkcji biogazu. Wykorzystanie spożywcze jest marginalne.
  - q: Czy tritikale jest odporne na mrozy?
    a: >-
      Ozimna tritikale jest bardziej odporna niż ozimy jęczmień, ale mniej odporna niż żyto. Znosi
      około −18 do −22 °C w strefie krzewienia przy pokrywie śnieżnej.
