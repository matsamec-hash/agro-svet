# a wikipedia zůstávají z cs (klíče, obrázky, kalendář). Pole choroby[] drží
# STEJNÉ pořadí i délku jako cs — mapování na entitu jde přes cs index.
slug: hrach
name: Groch polny
name_plural: Groch
description: >-
  Groch polny (Pisum sativum) jest najpowszechniejszą rośliną strączkową w Polsce, cenioną
  szczególnie jako przedplon dla zbóż ozimych. Wiążąc azot atmosferyczny symbiotycznie z bakteriami
  Rhizobium, poprawia żyzność gleby i zmniejsza wymagania na nawożenie azotowe następnych roślin.
  Ziarno jest bogatym źródłem białka (22–28 %).
vysevek: 80–110 kiełkujących ziaren/m²
hnojeni: >-
  N 0–30 kg/ha (tylko startowe — nasiona wiążą azot atmosferyczny); P i K według analiz; molibden
  dla lepszej funkcji bakterii brodawkowych
vynos_t_ha: 3–5
sklizen: lipiec (przy wilgotności ziarna <14 %)
vyuziti: >-
  ziarno paszowe (pasza białkowa), przemysł spożywczy (groch łuskany, konserwowany), zielone
  nawożenie
choroby:
  - askochytoza grochu (Ascochyta pisi)
  - fuzarioza korzeni i łodyg (Fusarium spp.)
  - pleśń grochowa (Peronospora viciae)
  - wirusowa mozaika grochu (PSbMV, przenoszona przez mszyce)
osevni_postup:
  - name: Przedplon i zmianowanie
    text: >-
      Groch nie może następować po innej roślinie strączkowej — minimalna przerwa 4–5 lat.
      Najlepszymi przedplonami są zboża ozime. Groch sam w sobie jest doskonałym przedplonem dla
      pszenicy ozimej.
  - name: Przygotowanie gleby
    text: >-
      Orka 20–22 cm lub minimalizacja; groch dobrze rośnie na średnio ciężkich, dobrze odwadnianych
      glebach o pH 6,0–7,5. Wrażliwy na kwasowość i zalewanie.
  - name: Siew
    text: >-
      Wiosenny siew jak najwcześniej (luty–marzec), głębokość 4–6 cm, norma wysiewu 80–110
      kiełkujących ziaren/m². Groch znosi lekkie przymrozki — wczesny siew jest korzystny.
  - name: Inokulacja i nawożenie
    text: >-
      Inokulacja nasion bakteriami brodawkowymi Rhizobium leguminosarum jest korzystna na gruntach
      bez historycznego uprawiania roślin strączkowych. N nawożenie minimalne (startowe 0–30 kg/ha),
      P i K według analiz.
  - name: Ochrona roślin
    text: >-
      Herbicydy (preemergentne + postemergentne), fungicydy przy wystąpieniu askochytozy i pleśni,
      insektycydy przy wystąpieniu mszyc i grochowca.
  - name: Zbiór
    text: >-
      Zbiór w lipcu przy wilgotności ziarna poniżej 14 %. Groch jest podatny na leżenie i wczesny
      zbiór — odpowiednie są odmiany półwysokie lub wysokie lub rośliny podporowe (owies).
faq:
  - q: Dlaczego groch jest tak dobrym przedplonem?
    a: >-
      Groch, wiążąc azot atmosferyczny (poprzez symbiotyczne bakterie Rhizobium), wzbogaca glebę w
      azot. Zostawia także dobrą strukturę gleby i przerywa cykl zbóż, co zmniejsza presję chorób i
      chwastów.
  - q: Czy groch potrzebuje nawozu azotowego?
    a: >-
      Groch większość azotu pozyskuje przez biologiczną fiksację. Startowa dawka N (0–30 kg/ha) może
      wspierać wschody, zanim rozwiną się bakterie brodawkowe. Wyższe dawki N są marnotrawstwem i
      hamują fiksację.
  - q: Jakie plony grochu polnego można oczekiwać?
    a: >-
      Średni plon wynosi 3–4,5 t/ha. Na dobrych stanowiskach z korzystną pogodą można osiągnąć 5
      t/ha. Groch jest plonem niestabilnym — susza w czasie kwitnienia znacznie obniża plon.
