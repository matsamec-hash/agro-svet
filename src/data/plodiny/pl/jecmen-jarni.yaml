slug: jecmen-jarni
name: Jęczmień jary
name_plural: Jęczmień jary
description: >-
  Jęczmień jary (Hordeum vulgare) jest najważniejszą wiosenną rośliną zbożową w Polsce, uprawianą
  głównie do produkcji słodu browarniczego (piwo), paszy i żywności. Wymaga dobrej przedplony i
  wczesnego siewu, ponieważ późniejszy termin siewu znacznie obniża plon i pogarsza parametry
  słodownicze.
vysevek: 300–400 kiełkujących ziaren/m²
hnojeni: N 60–90 kg/ha (słodowy jęczmień max. 80 kg/ha, aby nie przekroczyć limitu białka w ziarnie)
vynos_t_ha: 4–7
sklizen: lipiec do początku sierpnia
vyuziti: słód browarniczy (produkcja piwa), ziarno paszowe, przemysł spożywczy (kasze, mąka)
choroby:
  - brązowa plamistość jęczmienia (rynchosporioza)
  - pasmo jęczmienia (pyrenofora)
  - mączniak prawdziwy zbóż i traw
  - głownia pyląca jęczmienia
  - BYDV (wirusowa żółtaczka jęczmienia, przenoszona przez mszyce)
osevni_postup:
  - name: Przedplon
    text: >-
      Słodowy jęczmień wymaga dobrej przedplony — idealnie okopowych lub strączkowych. Po pszenicy
      wzrasta ryzyko chorób i pogorszenia jakości słodowniczej.
  - name: Przygotowanie gleby
    text: >-
      Jesienna orka i dobre przygotowanie łóżka siewnego na wiosnę; jęczmień jary jest wrażliwy na
      zagęszczenie i kwaśną reakcję gleby (optymalne pH 6,0–7,0).
  - name: Siew
    text: >-
      Jak najszybciej po wyschnięciu gleby (luty–marzec). Głębokość 3–4 cm, norma wysiewu 300–400
      kiełkujących ziaren/m². Późny siew obniża plon i jakość słodowniczą.
  - name: Nawożenie
    text: >-
      W przypadku słodowego jęczmienia ograniczyć N do max. 80 kg/ha (wyższe dawki zwiększają białka
      powyżej limitu słodu). Fosfor i potas według analiz.
  - name: Ochrona roślin
    text: >-
      Zaprawianie nasion (paskowatość, śnieć), zaprawianie insektycydowe lub opryski w przypadku
      wystąpienia mszyc (przenosicieli BYDV), fungicydy według progu szkodliwości.
  - name: Zbiór
    text: >-
      Zbiór przy wilgotności 13–15 % (lipiec–sierpień). Dla słodowego jęczmienia monitorować
      parametry jakości (kiełkowanie, zawartość białka, masa objętościowa).
faq:
  - q: Dlaczego wczesny siew jęczmienia jarego jest ważny?
    a: >-
      Wczesny siew (luty–marzec) wykorzystuje wiosenną wilgoć, wydłuża wegetację i poprawia plon
      oraz jakość słodowniczą. Każdy tydzień opóźnienia siewu może obniżyć plon o 0,2–0,3 t/ha.
  - q: Jaki jest limit azotu dla słodowego jęczmienia?
    a: >-
      Dla słodowego jęczmienia zaleca się max. 80 kg N/ha. Wyższe dawki zwiększają zawartość białka
      w ziarnie powyżej akceptowalnego poziomu do słodowania (zazwyczaj >12 %).
  - q: Jakie plony można oczekiwać z jęczmienia jarego?
    a: >-
      Na dobrych stanowiskach z dobrą agrotechniką jęczmień jary osiąga 5–7 t/ha, w suchszych
      warunkach lub przy późnym siewie 4–5 t/ha.
  - q: Jak zaprawianie nasion chroni jęczmień jary?
    a: >-
      Zaprawianie chroni przed paskowatością jęczmienia i śniecią jęczmienną, które są przenoszone
      przez zainfekowane nasiona. Zaprawianie insektycydowe dodatkowo ogranicza wczesne ataki mszyc
      przenoszących wirusa BYDV.
