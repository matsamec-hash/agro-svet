# Polský overlay plodin. slug, skupina, hero_*, seti_mesice, sklizen_mesice
# a wikipedia zůstávají z cs (klíče, obrázky, kalendář). Pole choroby[] drží
# STEJNÉ pořadí i délku jako cs — mapování na entitu jde přes cs index.
slug: brambory
name: Ziemniak
name_plural: Ziemniaki
description: >-
  Ziemniak (Solanum tuberosum) jest jedną z najważniejszych roślin uprawnych na świecie i
  historycznie kluczową okopową w Polsce. Uprawia się go dla konsumpcyjnych bulw, produkcji skrobi
  oraz celów paszowych. Wymaga jakościowych, dobrze odwadnianych gleb, a podatność na choroby stawia
  wysokie wymagania dotyczące ochrony.
vysevek: 35 000–45 000 sadzonek/ha (odległość w rzędzie 30–35 cm, odległość międzyrzędowa 70–75 cm)
hnojeni: >-
  N 100–160 kg/ha w zależności od przeznaczenia (konsumpcyjne vs. skrobiowe); K 150–250 kg K₂O/ha; P
  według analiz; nawozy organiczne korzystne
vynos_t_ha: 25–40 (odmiany konsumpcyjne i przemysłowe)
sklizen: sierpień–październik (w zależności od wczesności odmiany)
vyuziti: konsumpcyjne bulwy, produkcja skrobi, pasza, produkcja alkoholu i chipsów
choroby:
  - zaraza ziemniaka (Phytophthora infestans) — najniebezpieczniejsza
  - Alternaria solani (brązowa plamistość liści)
  - choroby wirusowe (mozaiki, skręcenie, wirus Y)
  - Rhizoctonia solani (wrzodowość bulw i łodyg)
  - skórzastość bulw (Streptomyces scabies)
osevni_postup:
  - name: Przedplon
    text: >-
      Ziemniak wymaga długiego zmienowania (minimum 3–4 lata bez roślin z rodziny psiankowatych).
      Najlepsze przedplony to zboża, kukurydza i rośliny strączkowe.
  - name: Przygotowanie gleby i nawożenie
    text: >-
      Głęboka orka jesienna (28–30 cm), aplikacja organicznych nawozów (obornik 20–30 t/ha).
      Wiosenne przygotowanie grzbietów lub równe łóżko siewne.
  - name: Przygotowanie sadzonek i sadzenie
    text: >-
      Certyfikowane, wirusowo przebadane sadzonki (min. klasa E lub A). Sadzenie od kwietnia,
      głębokość 8–12 cm, norma wysiewu 35 000–45 000 szt./ha.
  - name: Nawożenie
    text: >-
      N w zależności od przeznaczenia (konsumpcyjne 100–130 kg N/ha, skrobiowe 120–160 kg N/ha),
      wysoka dawka K poprawia tworzenie i jakość bulw.
  - name: Ochrona roślin
    text: >-
      Zaraza ziemniaka — fungicydy profilaktycznie według sygnalizacji, co 7–14 dni. Herbicydy
      preemergentnie. Insekticydy przy wystąpieniu stonki ziemniaczanej.
  - name: Zbiór
    text: >-
      Desykacja nadziemnej części i zbiór przy utwardzonej skórce (nacisk palcem nie uszkadza
      skórki). W zależności od wczesności odmiany lipiec–październik; delikatna manipulacja
      minimalizuje plamy ciśnieniowe.
faq:
  - q: Dlaczego zaraza ziemniaka jest tak poważna?
    a: >-
      Phytophthora infestans może w ciągu kilku dni zniszczyć cały łan w wilgotnej i ciepłej
      pogodzie. To ten sam patogen, który spowodował głód w Irlandii w XIX wieku. Profilaktyczne
      zabiegi fungicydowe są niezbędne w sprzyjających warunkach.
  - q: Jak rozpoznać, że ziemniaki są gotowe do zbioru?
    a: >-
      Ziemniaki są dojrzałe, gdy nadziemna część naturalnie żółknie i obumiera, a skórka bulw jest
      utwardzona — palcem nie można jej łatwo zdjąć. U wczesnych odmian można zbierać je wcześniej
      (małe ziemniaki).
  - q: Jakie jest znaczenie certyfikowanej sadzonki?
    a: >-
      Certyfikowana sadzonka gwarantuje niską zawartość chorób wirusowych (wirus Y, skręcenie,
      mozaiki), które rozprzestrzeniają się przez materiał sadzeniowy i dramatycznie obniżają plon i
      jakość.
  - q: Jaki jest typowy plon ziemniaków?
    a: >-
      Ziemniaki konsumpcyjne i przemysłowe osiągają 25–40 t/ha bulw. Wczesne odmiany zbierane
      wcześniej osiągają niższy plon (15–25 t/ha).
