# Polský overlay plodin. slug, skupina, hero_*, seti_mesice, sklizen_mesice
# a wikipedia zůstávají z cs (klíče, obrázky, kalendář). Pole choroby[] drží
# STEJNÉ pořadí i délku jako cs — mapování na entitu jde přes cs index.
slug: mak
name: Mak opium
name_plural: Maki
description: >-
  Mak opium (Papaver somniferum) to tradycyjna polska roślina oleista i przyprawowa, której ziarno
  zawiera 40–50 % tłuszczu i jest typowym składnikiem polskiej kuchni (ciasta, makowiec, bułki).
  Polska należy do największych producentów i eksporterów nasion maku na świecie. Uprawa maku jest
  ściśle regulowana prawnie.
hnojeni: N 60–100 kg/ha; wrażliwy na nawozy chlorkowe (stosować siarczany); P i K według analiz
vynos_t_ha: 0,8–1,5
sklizen: lipiec–sierpień (dojrzałe torebki, suche nasiona)
vyuziti: >-
  nasiona maku do celów spożywczych (pieczywo, cukiernictwo), olej makowy, alkaloidy farmaceutyczne
  (morfina)
choroby:
  - zaraza makowa (Peronospora arborescens)
  - bakterioza plamista (Xanthomonas campestris)
  - fuzarioza korzeni i łodyg
  - wirusowa mozaika maku (TuMV)
osevni_postup:
  - name: Przedplon i zmianowanie
    text: >-
      Mak nie może wrócić na to samo pole wcześniej niż po 5–6 latach. Najlepsze przedplony to
      zboża; wykluczyć rośliny strączkowe i kapustne (choroby przenoszone).
  - name: Przygotowanie gleby
    text: >-
      Bardzo drobne i równe łóżko siewne — mak ma małe nasiona i wrażliwe kiełki. Orka na głębokość
      20–22 cm, drobne wiosenne przygotowanie.
  - name: Siew
    text: >-
      Siew jak najwcześniej na wiosnę (luty–marzec), głębokość zaledwie 0,5–1,5 cm (!), norma
      wysiewu 0,4–0,8 kg/ha. Mak kiełkuje tylko w temperaturze powyżej 2 °C.
  - name: Nawożenie
    text: >-
      N 60–100 kg/ha, P i K według analiz; nawozy chlorkowe są niewłaściwe. Azot stosować przed
      siewem lub w fazie rozetki.
  - name: Ochrona roślin
    text: >-
      Herbicydy (preemergentnie i postemergentnie), fungicydy w przypadku wystąpienia zarazy
      makowej, insektycydy w przypadku wystąpienia mszycy makowej lub muchówki.
  - name: Zbiór
    text: >-
      Zbiór w lipcu–sierpniu przy całkowitym dojrzeniu torebek — w momencie, gdy są suche, a nasiona
      przy potrząsaniu brzęczą. Prze dojrzałe torebki otwierają się i dochodzi do strat.
faq:
  - q: Dlaczego głębokość siewu maku jest tak mała?
    a: >-
      Mak ma bardzo małe nasiona — nasiona są tak małe, że głęboko zasiane nie mogą wykiełkować i
      wydostać się na powierzchnię. Optymalna głębokość siewu to 0,5–1,5 cm.
  - q: Jakie są ograniczenia prawne przy uprawie maku w Polsce?
    a: >-
      Producenci maku są zobowiązani do corocznego zgłaszania uprawy do Urzędu Celnego i
      przestrzegania minimalnej odległości upraw od zabudowań. Zawartość morfiny w roślinach jest
      monitorowana.
  - q: Jakie plony nasion maku można oczekiwać?
    a: >-
      Średni plon wynosi 0,8–1,3 t/ha, w sprzyjającym roku na dobrym stanowisku nawet do 1,5 t/ha.
      Mak jest plonem niestabilnym, wrażliwym na deficyt opadów.
vysevek: 0,4–0,8 kg/ha (bardzo małe nasiona, docelowa gęstość 50–80 roślin/m²)
