slug: oves
name: Owies siewny
name_plural: Owies
description: >-
  Owies siewny (Avena sativa) jest wiosenną rośliną zbożową uprawianą dla ziarna i paszy. Znosi
  chłodniejsze i wilgotniejsze obszary oraz ma niskie wymagania co do przedplonu. Wykorzystywany
  jest w żywieniu ludzi (płatki, kasze), w paszoznawstwie oraz jako zielona biomasa (GPS).
vysevek: 350–450 kiełkujących ziaren/m²
hnojeni: N 60–90 kg/ha w zależności od przedplonu i stanowiska
vynos_t_ha: 4–6
sklizen: koniec lipca do sierpnia
vyuziti: ziarno paszowe, płatki owsiane, pasza, GPS
choroby:
  - mączniak prawdziwy zbóż i traw
  - rdze zbóż (koronkowa, źdźbłowa)
  - sporysz owsiany
  - krauroza owsa
osevni_postup:
  - name: Wybór pola
    text: >-
      Owies znosi gorszy przedplon, odpowiedni po roślinach okopowych i po innych zbożach. Dobrze
      rośnie w chłodniejszych i wilgotniejszych lokalizacjach.
  - name: Przygotowanie gleby
    text: >-
      Średnio głęboka orka lub minimalne przetwarzanie, wyrównanie łóżka siewnego przed wiosennym
      siewem.
  - name: Siew
    text: >-
      Wiosenny siew jak najszybciej po wyschnięciu gleby, głębokość 3–4 cm, norma wysiewu 350–450
      ziaren/m².
  - name: Nawożenie
    text: >-
      Azot 60–90 kg/ha w zależności od potencjału plonotwórczego stanowiska i przedplonu; fosfor i
      potas według analiz gleby.
  - name: Ochrona roślin
    text: >-
      Ochrona przed mączniakiem i rdzą według progu szkodliwości; zaprawianie nasion chroni przed
      sporyszem owsianym.
  - name: Zbiór
    text: >-
      Zbiór przy pełnej dojrzałości ziarna, wilgotność poniżej 15 %, unikać strat spowodowanych
      wykrzywieniem przy przejrzałości.
faq:
  - q: Jaka jest norma wysiewu owsa?
    a: >-
      Zalecana norma wysiewu owsa wynosi 350–450 kiełkujących ziaren na m², w zależności od
      stanowiska i terminu siewu.
  - q: Po jakim przedplonie uprawiać owies?
    a: >-
      Owies ma niskie wymagania co do przedplonu, dobrze znosi uprawę po roślinach okopowych oraz po
      innych zbożach.
  - q: W jakich obszarach owies uprawia się najlepiej?
    a: >-
      Owies dobrze rośnie w chłodniejszych i wilgotniejszych lokalizacjach, gdzie inne zboża są
      mniej wydajne. Niewłaściwe są suche i ciepłe niziny.
  - q: Jakie plony ziarna można oczekiwać od owsa?
    a: >-
      Przy dobrym prowadzeniu agrotechnicznym owies osiąga plon 4–6 t/ha ziarna. Na korzystnych
      stanowiskach można osiągnąć wyższe plony.
