# STEJNÉ pořadí i délku jako cs — mapování na entitu jde přes cs index.
slug: jetel
name: Koniczyna łąkowa
name_plural: Koniczyna łąkowa
description: >-
  Koniczyna łąkowa (Trifolium pratense) jest najważniejszą rośliną pastewną strączkową w Polsce,
  uprawianą na zieloną paszę, siano, kiszonkę i silos z wysoką zawartością białka (18–22 % w suchej
  masie). Biologicznie wiąże azot atmosferyczny i jest kluczowym elementem zmianowania dla poprawy
  żyzności gleby.
vysevek: 8–14 kg/ha (w czystym łanie); 4–8 kg/ha w mieszankach koniczyny z trawami
hnojeni: >-
  N minimalne (biologiczne wiązanie); P 40–60 kg P₂O₅/ha; K 80–130 kg K₂O/ha; wapnowanie przy pH
  poniżej 6,0
vynos_t_ha: 8–14 (suchej masy za cały sezon zbiorów, 2–3 koszenia)
sklizen: >-
  2–3 koszenia rocznie; pierwsze koszenie na początku kwitnienia (czerwiec), drugie koszenie w
  sierpniu
vyuziti: zielona pasza, siano, kiszonka, silos, zielone nawożenie, roślina miododajna
choroby:
  - zgnilizna twardzikowa (Sclerotinia trifoliorum) — zgnilizna zimowa
  - antraknoza koniczyny (Colletotrichum trifolii)
  - wirusowa mozaika koniczyny (CMV, TYMV)
  - zgnilizna korzeni (Phytophthora cactorum)
osevni_postup:
  - name: Przedplon i zmianowanie
    text: >-
      Koniczyna łąkowa jest doskonałym przedplonem dla zbóż ozimych. Nie może być uprawiana
      wielokrotnie — minimalna przerwa 4–5 lat (ryzyko chorób glebowych i zmęczenie gleby dla
      koniczyny).
  - name: Przygotowanie gleby
    text: >-
      Drobne łóżko siewne z dobrą zdolnością do nagrzewania. Koniczyna dobrze rośnie na glebach
      średnio ciężkich, neutralnych o pH 6,0–7,0. Wrażliwa na kwasowość i zalewanie.
  - name: Siew (pod roślinę okrywową)
    text: >-
      Najczęściej podsiew pod zboża jare (owies, jęczmień jary) na wiosnę. Norma wysiewu 8–14 kg/ha,
      głębokość siewu 1–2 cm (bardzo płytko — małe nasiona).
  - name: Nawożenie
    text: >-
      Fosfor i potas według analiz gleby, wapnowanie przy kwaśnej reakcji gleby. Azot nie jest
      uzupełniany (biologiczne wiązanie), potas jest najważniejszym składnikiem pokarmowym.
  - name: Zbiór
    text: >-
      Pierwsze koszenie na początku kwitnienia (maksymalna kombinacja plonu i jakości), drugie
      koszenie w sierpniu. Po ostatnim koszeniu pozostawić wystarczający łan dla bezpiecznego
      przezimowania.
  - name: Pielęgnacja i przezimowanie
    text: >-
      Monitorować występowanie zgnilizny twardzikowej po zimie. Koniczyna łąkowa jest dwuletnią lub
      krótkoterminową rośliną wieloletnią — zazwyczaj uprawiana jest przez 1–2 lata.
faq:
  - q: Ile azotu wiąże koniczyna łąkowa?
    a: >-
      Koniczyna łąkowa może wiązać 150–250 kg N/ha rocznie dzięki symbiotycznym bakteriom Rhizobium.
      Ta wartość zależy od kondycji łanu, warunków glebowych i pogody.
  - q: Dlaczego koniczyna jest siana pod roślinę okrywową?
    a: >-
      Podsiew pod roślinę okrywową chroni drobne kiełki koniczyny przed konkurencją chwastów i
      słońcem w pierwszym roku. Zboże działa jak „parasol" i koniczyna zakorzenia się w jego cieniu.
  - q: Jak długo utrzymuje się łan koniczyny łąkowej?
    a: >-
      Koniczyna łąkowa jest krótkoterminową rośliną wieloletnią — łan jest produktywny przez 1–2
      lata, wyjątkowo 3 lata. Potem znacznie spada gęstość i plon.
  - q: Jaki plon suchej masy daje koniczyna?
    a: >-
      Przy 2–3 koszeniach koniczyna łąkowa osiąga 8–14 t suchej masy/ha rocznie. Na dobrych
      stanowiskach z korzystnymi opadami plon może przekroczyć 14 t/ha.
