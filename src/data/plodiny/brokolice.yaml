slug: brokolice
name: Brokolice
name_plural: Brokolice
skupina: zelenina
hero_image: /images/plodiny/brokolice.jpg
hero_author: "Kolforn (Kolforn)"
hero_license: "CC BY-SA 4.0"
hero_source: "https://commons.wikimedia.org/wiki/File:-2018-10-06_Broccoli,_Trimingham_(1).JPG"
description: >-
  Brokolice (Brassica oleracea var. italica) je košťálová zelenina sklízená ve fázi nerozvinutých
  květních poupat. V registru ÚKZÚZ je vedena jako brokolice květáková s kompaktní hlavní růžicí.
  Proti květáku je otužilejší, rychlejší a po sklizni hlavní růžice u řady odrůd obrůstá postranními
  výhony, což prodlužuje sklizňové okno.
vysevek: výsev do sadbovačů 300–400 g osiva/ha; spon 50 × 35–45 cm
hnojeni: N 150–200 kg/ha děleně; K 200–250 kg K₂O/ha; bór a molybden
vynos_t_ha: 12–20
sklizen: červen–listopad
seti_mesice: [3, 4, 5, 6]
sklizen_mesice: [6, 7, 8, 9, 10, 11]
vyuziti: čerstvý trh, mrazírenské zpracování (hlavní odbyt), gastronomie
choroby:
  - nádorovitost kořenů brukvovitých (Plasmodiophora brassicae)
  - alternariová skvrnitost (Alternaria brassicae)
  - černá žilkovitost (Xanthomonas campestris)
  - housenky běláska a můry zelné
  - mšice zelná (Brevicoryne brassicae)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Odstup po brukvovitých nejméně 4 roky. Brokolice snáší chladnější stanoviště lépe než květák a hodí se i pro podzimní sklizně.
  - name: Předpěstování sadby
    text: Výsev do sadbovačů od března do června. Sadba je připravená za 4–5 týdnů; brokolice roste rychleji než květák a přestárlou sadbu snáší hůř.
  - name: Výsadba
    text: Spon 50 × 35–45 cm. Hustší spon dává menší, ale vyrovnanější růžice vhodné pro mrazírny; řidší větší růžice pro čerstvý trh.
  - name: Hnojení a závlaha
    text: Plynulá výživa dusíkem a pravidelná závlaha. Sucho v době zakládání růžice vede k drobným, předčasně rozkvétajícím hlavám.
  - name: Ochrana rostlin
    text: Sledovat housenky a mšice, které se schovávají uvnitř růžice a znehodnocují ji pro mrazírny. Ochranné sítě proti bělásku jsou u kvalitní produkce běžné.
  - name: Sklizeň a obrůstání
    text: Sklízí se ručně, dokud jsou poupata pevně zavřená a tmavě zelená. Po odříznutí hlavní růžice většina odrůd vytvoří postranní výhony, které lze sklízet další tři až čtyři týdny.
wikipedia: https://cs.wikipedia.org/wiki/Brokolice
faq:
  - q: Proč brokolice kvete dřív, než ji stihnu sklidit?
    a: Rozkvetení urychlují vysoké teploty a stres ze sucha. Sklizňové okno je za horka jen několik dní — je potřeba porost kontrolovat obden a sklízet, dokud jsou poupata pevně zavřená.
  - q: Obroste brokolice po sklizni?
    a: Ano, většina odrůd po odříznutí hlavní růžice vytvoří postranní výhony s menšími růžicemi, které lze sklízet ještě tři až čtyři týdny. Odrůdy se v této schopnosti liší.
  - q: Jaký je rozdíl mezi brokolicí a květákem?
    a: Brokolice se sklízí ve fázi zelených nerozvinutých poupat a má kratší vegetační dobu, květák tvoří bílou růžici z nediferencovaných pletiv a je náročnější na plynulost růstu. ÚKZÚZ vede brokolici jako samostatnou skupinu odrůd.
