slug: kedluben
name: Kedluben
name_plural: Kedlubny
skupina: zelenina
hero_image: /images/plodiny/kedluben.jpg
hero_author: "Rasbak"
hero_license: "CC BY-SA 3.0"
hero_source: "https://commons.wikimedia.org/wiki/File:Koolrabi_(Brassica_oleracea_convar._acephala_alef._var._gongylodes).jpg"
description: >-
  Kedluben (Brassica oleracea var. gongylodes) je košťálová zelenina pěstovaná pro zdužnatělou
  stonkovou bulvu nad povrchem půdy. Patří k nejrychlejším košťálovinám — rané odrůdy jsou
  sklizňové za 8–10 týdnů — a pěstuje se v několika sledech od jara do podzimu. Odrůdy se dělí
  na bílé (světle zelené) a modré (fialové), pozdní typy tvoří velké bulvy pro skladování.
vysevek: výsev do sadbovačů 200–300 g osiva/ha; spon rané 30 × 25 cm, pozdní 50 × 40 cm
hnojeni: N 100–140 kg/ha; K 180–220 kg K₂O/ha; bór proti dutosti bulvy
vynos_t_ha: 25–40
sklizen: květen–listopad, průběžně po sledech
seti_mesice: [2, 3, 4, 5, 6]
sklizen_mesice: [5, 6, 7, 8, 9, 10, 11]
vyuziti: čerstvá konzumace, gastronomie, zpracování na zeleninové směsi
choroby:
  - nádorovitost kořenů brukvovitých (Plasmodiophora brassicae)
  - dřepčíci rodu Phyllotreta
  - alternariová skvrnitost (Alternaria brassicae)
  - květilka zelná (Delia radicum)
  - dřevnatění a praskání bulvy (fyziologická porucha ze stresu)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Odstup po brukvovitých nejméně 3–4 roky. Kedluben má krátkou vegetační dobu, proto se dobře uplatní jako předplodina i jako druhá plodina v sezóně.
  - name: Předpěstování sadby
    text: Výsev do sadbovačů od února pro nejranější sklizeň, dále průběžně do června. Sadba je připravená za 4–5 týdnů; přestárlá sadba tvoří drobné, předčasně dřevnatějící bulvy.
  - name: Výsadba
    text: Rané odrůdy hustěji (30 × 25 cm) pro drobné jemné bulvy, pozdní skladovací řidčeji (50 × 40 cm). Sázet mělce, bulva se tvoří nad povrchem půdy.
  - name: Hnojení a závlaha
    text: Plynulá výživa a hlavně nepřerušená závlaha. Kedluben je na vodní stres nejcitlivější ze všech košťálovin — po přeschnutí bulva zdřevnatí a při následném dešti praskne.
  - name: Ochrana rostlin
    text: Dřepčíci na mladé sadbě jsou hlavním rizikem, řeší se netkanou textilií. Sledovat též housenky a květilku zelnou.
  - name: Sklizeň
    text: Rané odrůdy při průměru bulvy 6–8 cm, pozdní skladovací 12–20 cm. Rozhodující je včasnost — přerostlé rané odrůdy dřevnatí, zatímco pozdní typy zůstávají křehké i při velké bulvě.
wikipedia: https://cs.wikipedia.org/wiki/Kedluben
faq:
  - q: Proč kedluben dřevnatí?
    a: Nejčastěji přerostlostí u raných odrůd nebo přerušením závlahy. Rané odrůdy je nutné sklidit při průměru 6–8 cm; pozdní skladovací odrůdy zůstávají křehké i při dvojnásobné velikosti.
  - q: Proč bulva praská?
    a: Prudkým příjmem vody po suchém období, kdy vnitřek roste rychleji než slupka. Řešením je vyrovnaná závlaha, ne omezení hnojení.
  - q: Kolik sledů kedlubnu lze za sezónu stihnout?
    a: Při vegetační době 8–10 týdnů u raných odrůd dva až tři sledy. Vysazuje se od dubna do června ve dvou- až třítýdenních intervalech pro plynulou sklizeň.
