description: >-
  Bob zahradní (Vicia faba var. major) je luskovina pěstovaná jako zelenina pro nezralá semena
  sklízená v mléčné zralosti. Od bobu polního, který se pěstuje na suché zrno jako krmivo,
  se liší výrazně většími semeny a užitkovým směrem. Patří k nejotužilejším luskovinám —
  seje se velmi brzy na jaře a snese mrazíky do −5 °C.
vysevek: 200–300 kg/ha (spon 40–50 × 10–15 cm)
hnojeni: N jen startovací 20–30 kg/ha (váže vzdušný dusík); P a K dle rozborů
vynos_t_ha: 8–14 (zelená semena v luscích)
sklizen: červen–srpen
seti_mesice: [3, 4]
sklizen_mesice: [6, 7, 8]
vyuziti: čerstvá i mražená zelená semena, gastronomie, zelené hnojení
choroby:
  - čokoládová skvrnitost bobu (Botrytis fabae)
  - rez bobová (Uromyces viciae-fabae)
  - mšice maková (Aphis fabae)
  - zrnokaz bobový (Bruchus rufimanus)
  - fuzariové vadnutí (Fusarium spp.)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Odstup po luskovinách nejméně 4 roky. Bob je výbornou předplodinou — poutá vzdušný dusík a hluboký kořen zlepšuje strukturu půdy.
  - name: Setí
    text: Seje se velmi brzy, už v březnu, jakmile lze na pozemek. Bob potřebuje k vývoji chladné období a snese mrazíky do −5 °C. Hloubka setí 6–8 cm.
  - name: Hnojení a závlaha
    text: Dusíkem nepřehnojovat, potlačuje tvorbu hlízek. Kritické období pro vodu je kvetení a nalévání lusků; sucho v té době výrazně sráží počet nasazených lusků.
  - name: Ochrana rostlin
    text: Hlavním škůdcem je mšice maková, která napadá vrcholy rostlin od června. Osvědčeným opatřením je odštípnutí vrcholů po nasazení spodních lusků — omezí mšice a urychlí nalévání.
  - name: Sklizeň
    text: Sklízí se v mléčné zralosti, kdy jsou semena plně vyvinutá, ale ještě měkká a světle zelená. Sklizňové okno je krátké; přezrálá semena tvrdnou a moučnatí.
wikipedia: https://cs.wikipedia.org/wiki/Bob_obecn%C3%BD
faq:
  - q: Jaký je rozdíl mezi bobem zahradním a polním?
    a: Bob zahradní (var. major) má velká semena a sklízí se nezralý jako zelenina. Bob polní (var. minor) má drobná semena, pěstuje se na suché zrno pro krmné účely a ÚKZÚZ ho vede jako samostatný druh.
  - q: Kdy sít bob?
    a: Co nejdříve na jaře, už v březnu. Bob potřebuje chladné období na začátku vývoje a mrazíky do −5 °C mu neublíží. Pozdní výsev znamená nižší výnos a silnější napadení mšicí.
  - q: Proč se bobu odštipují vrcholy?
    a: Vrcholy jsou hlavním cílem mšice makové. Jejich odstranění po nasazení spodních lusků omezí napadení a zároveň nasměruje živiny do nalévání už založených lusků.
