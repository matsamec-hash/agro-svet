slug: mrkev
name: Mrkev obecná
name_plural: Mrkev
skupina: zelenina
hero_image: /images/plodiny/mrkev.jpg
hero_author: ""
hero_license: "Public domain"
hero_source: "https://commons.wikimedia.org/wiki/File:Illustration_Daucus_carota0.jpg"
description: >-
  Mrkev obecná (Daucus carota subsp. sativus) je nejvýznamnější kořenová zelenina v ČR.
  Odrůdy se dělí do sortimentních typů podle tvaru a délky kořene — Nantes, Flakkee, Chantenay,
  Amsterdam a Danvers — které určují, zda je odrůda vhodná pro svazkování, čerstvý trh,
  skladování nebo průmyslové zpracování. Vyžaduje hluboké, kamene prosté a strukturní půdy.
vysevek: 1,5–3 kg/ha (cílová hustota 80–150 rostlin/m² dle směru pěstování)
hnojeni: N 80–120 kg/ha (přehnojení dusíkem způsobuje větvení kořene); K 200–250 kg K₂O/ha; nehnojit čerstvým hnojem
vynos_t_ha: 40–70 (průmyslová až 90)
sklizen: červenec–listopad dle termínu setí
seti_mesice: [3, 4, 5]
sklizen_mesice: [7, 8, 9, 10, 11]
vyuziti: čerstvý trh a svazkování, skladovací mrkev, mrazírenské a konzervárenské zpracování, šťávy
choroby:
  - alternariová spála mrkve (Alternaria dauci)
  - padlí miříkovitých (Erysiphe heraclei)
  - pochmurnatka mrkvová (Psila rosae)
  - háďátko řepné a hlístice rodu Meloidogyne
  - bílá hniloba (Sclerotinia sclerotiorum) ve skladu
osevni_postup:
  - name: Předplodina a osevní postup
    text: Mrkev se nesmí vracet po miříkovitých (petržel, celer, pastinák) dříve než za 4 roky. Nejlepší předplodinou jsou obilniny. Nikdy nesázet do čerstvě hnojené půdy — hnůj způsobuje větvení kořene.
  - name: Příprava půdy
    text: Rozhodující operace. Půda musí být hluboko zpracovaná, bez kamenů a utužených vrstev — každá překážka způsobí deformaci nebo rozvětvení kořene. Standardem je pěstování na hrůbcích nebo záhonech.
  - name: Setí
    text: Seje se mělce, 1–2 cm, od března do května podle směru. Mrkev vzchází pomalu (14–21 dní) a v té době je bezbranná vůči plevelům. Používá se přesný výsev na konečnou vzdálenost.
  - name: Hnojení a závlaha
    text: Dusík držet nízko — přehnojená mrkev je náchylná k praskání a hůř skladovatelná. Rovnoměrná závlaha 200–300 mm zabraňuje praskání kořenů po suchu.
  - name: Ochrana rostlin a regulace plevelů
    text: Herbicidní ochrana je nutná od vzcházení, mrkev je slabý konkurent. Proti pochmurnatce mrkvové se používají ochranné sítě nebo insekticidní ošetření podle signalizace náletu.
  - name: Sklizeň
    text: Svazkovaná mrkev od července, skladovací od září do listopadu. Skladuje se při 0–1 °C a vysoké vlhkosti vzduchu, kde vydrží až do jara.
wikipedia: https://cs.wikipedia.org/wiki/Mrkev_obecn%C3%A1
faq:
  - q: Proč se mrkev větví a deformuje?
    a: Nejčastěji kvůli překážce v půdě — kameni, utužené vrstvě nebo hroudě — případně kvůli čerstvému hnoji či poškození kořenové špičky hlísticemi. Není to choroba, ale důsledek přípravy pozemku.
  - q: Co znamenají typy Nantes, Flakkee a Chantenay?
    a: Jsou to sortimentní typy podle tvaru kořene. Nantes má válcovitý tupě zakončený kořen pro čerstvý trh, Flakkee dlouhý kuželovitý pro skladování a průmysl, Chantenay krátký široký kořen pro těžší půdy. ÚKZÚZ typ uvádí v oficiálním popisu odrůdy.
  - q: Kdy sít mrkev na skladování?
    a: Skladovací mrkev se seje v květnu, aby dorostla do října a nebyla přerostlá. Nejranější svazkové odrůdy se sejí už v březnu pod netkanou textilii.
