slug: fazol
name: Fazol obecný
name_plural: Fazol
skupina: zelenina
hero_image: /images/plodiny/fazol.jpg
hero_author: "Rasbak"
hero_license: "CC BY-SA 3.0"
hero_source: "https://commons.wikimedia.org/wiki/File:Snijboon_peulen_Phaseolus_vulgaris.jpg"
description: >-
  Fazol obecný (Phaseolus vulgaris) se v registru ÚKZÚZ dělí podle růstového typu na keříčkový
  (nízký, samonosný, vhodný pro mechanizovanou sklizeň) a pnoucí (tyčkový, vyžadující oporu,
  s delší sklizňovou dobou). Pěstuje se na zelené lusky i na suché zrno. Jako luskovina váže
  vzdušný dusík a je výbornou předplodinou.
vysevek: keříčkový 100–140 kg/ha (spon 45 × 5–8 cm); pnoucí 60–80 kg/ha k opoře
hnojeni: N jen startovací 20–30 kg/ha (váže vzdušný dusík); P a K dle rozborů; citlivý na nízké pH
vynos_t_ha: 8–15 (zelené lusky), 2–3 (suché zrno)
sklizen: červenec–září
seti_mesice: [5]
sklizen_mesice: [7, 8, 9]
vyuziti: zelené lusky pro čerstvý trh a mrazírny, suché zrno, konzervárenské zpracování
choroby:
  - antraknóza fazolu (Colletotrichum lindemuthianum)
  - bakteriální spála fazolu (Xanthomonas axonopodis pv. phaseoli)
  - virus obecné mozaiky fazolu (BCMV)
  - plíseň šedá (Botrytis cinerea)
  - rez fazolová (Uromyces appendiculatus)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Fazol se nesmí vracet po luskovinách dříve než za 4 roky. Sám je vynikající předplodinou — po sobě zanechává dusík a zlepšuje strukturu půdy. Nevhodné jsou pozemky po slunečnici kvůli sklerotinii.
  - name: Příprava půdy a setí
    text: Seje se až když se půda ohřeje na 12 °C, tedy po polovině května. Fazol je citlivý i na slabý mrazík. Hloubka setí 4–6 cm; osivo se neinokuluje, půdní populace hlízkových bakterií zpravidla stačí.
  - name: Vedení pnoucích odrůd
    text: Tyčkové odrůdy potřebují oporu vysokou 2–2,5 m, nejčastěji síť nebo tyče. Poskytují sklizeň po delší dobu než keříčkové, ale vyžadují ruční sběr.
  - name: Hnojení a závlaha
    text: Dusíkem nepřehnojovat — potlačuje tvorbu hlízek. Kritické období pro vodu je kvetení a nalévání lusků; sucho v té době zásadně sráží výnos.
  - name: Ochrana rostlin
    text: Nevstupovat do porostu za vlhka, přenáší se tím bakteriální spála i antraknóza. Volit odrůdy s deklarovanou rezistencí proti BCMV, kterou ÚKZÚZ u odrůd uvádí.
  - name: Sklizeň
    text: Zelené lusky se sklízejí v technologické zralosti, kdy jsou semena sotva znatelná — u keříčkových jednorázově sklízečem, u pnoucích opakovaně ručně. Suché zrno se sklízí při vlhkosti pod 16 %.
wikipedia: https://cs.wikipedia.org/wiki/Fazol_obecn%C3%BD
faq:
  - q: Jaký je rozdíl mezi keříčkovým a pnoucím fazolem?
    a: Keříčkový roste do výšky 30–50 cm, nepotřebuje oporu a dozrává naráz, takže se hodí pro mechanizovanou sklizeň. Pnoucí (tyčkový) vyžaduje oporu až 2,5 m, plodí postupně několik týdnů a sklízí se ručně. ÚKZÚZ je vede jako dvě samostatné skupiny odrůd.
  - q: Kdy sít fazol?
    a: Až po polovině května, když se půda ohřeje na 12 °C a pomine riziko mrazíků. Fazol zaseté do studené půdy hnije a nevzchází.
  - q: Musí se fazol hnojit dusíkem?
    a: Ne, jen startovací dávkou 20–30 kg N/ha. Jako luskovina žije v symbióze s hlízkovými bakteriemi a vzdušný dusík si váže sám. Přehnojení dusíkem tvorbu hlízek naopak potlačí.
