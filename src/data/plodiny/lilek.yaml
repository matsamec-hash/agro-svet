slug: lilek
name: Lilek vejcoplodý
name_plural: Lilek
skupina: zelenina
hero_image: /images/plodiny/lilek.jpg
hero_author: "Miya.m"
hero_license: "CC BY-SA 3.0"
hero_source: "https://commons.wikimedia.org/wiki/File:Solanum_melongena_ja001.jpg"
description: >-
  Lilek vejcoplodý (Solanum melongena), známý také jako baklažán, je nejteplomilnější plodová
  zelenina v českém registru odrůd. V našich podmínkách se pěstuje téměř výhradně ve sklenících
  a fóliovnících; polní pěstování je možné jen v nejteplejších oblastech a s velkým rizikem.
  Odrůdy se liší tvarem a barvou plodu od klasických tmavě fialových po bílé a pruhované.
vysevek: výsev do sadbovačů 30–50 g osiva na 1 000 sazenic; spon 60–70 × 40–50 cm
hnojeni: N 120–180 kg/ha děleně; K 250–300 kg K₂O/ha; vysoké nároky po celou dobu plodnosti
vynos_t_ha: 15–30 (pole), 60–120 (skleník)
sklizen: červenec–říjen
seti_mesice: [2, 3]
sklizen_mesice: [7, 8, 9, 10]
vyuziti: čerstvá plodová zelenina, gastronomie, konzervárenské zpracování
choroby:
  - verticiliové vadnutí (Verticillium dahliae)
  - plíseň šedá (Botrytis cinerea)
  - svilušky a molice skleníková
  - virus bronzovitosti rajčete (TSWV)
  - fuzariové vadnutí (Fusarium oxysporum)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Nevracet po lilkovitých dříve než za 4 roky. Ve skleníku se lilek běžně roubuje na odolné podnože, které ÚKZÚZ vede jako samostatnou skupinu odrůd.
  - name: Předpěstování sadby
    text: Výsev v únoru až březnu při 24–26 °C — lilek klíčí pomaleji a při vyšší teplotě než rajče. Sadba je připravená za 9–10 týdnů.
  - name: Výsadba
    text: Do vytápěného skleníku od března, do nevytápěného fóliovníku v květnu, na pole až po polovině května. Lilek zastavuje růst už pod 15 °C.
  - name: Vedení a tvarování
    text: Ve skleníku se vede na dva až tři výhony k opoře, slabé postranní výhony se odstraňují. Plody jsou těžké, proto se výhony vždy vyvazují.
  - name: Hnojení a závlaha
    text: Vysoká a plynulá výživa po celou dobu plodnosti, kapková závlaha. Sucho v době nasazování plodů vede k jejich opadu.
  - name: Sklizeň
    text: Sklízí se v technologické zralosti, kdy je slupka lesklá a plod pružný. Přezrálý lilek matní, hořkne a semena tvrdnou. Sklízí se s částí stopky, nikdy se netrhá.
wikipedia: https://cs.wikipedia.org/wiki/Lilek_vejcoplod%C3%BD
faq:
  - q: Lze lilek pěstovat v ČR na poli?
    a: Jen v nejteplejších oblastech a s rizikem. Lilek zastavuje růst pod 15 °C a potřebuje dlouhé teplé léto. Prakticky veškerá česká produkce jde ze skleníků a fóliovníků.
  - q: Proč je lilek hořký?
    a: Hořkost roste s přezráním plodu, kdy tvrdnou semena a stoupá obsah alkaloidů. Moderní odrůdy jsou málo hořké, klíčem je ale sklizeň v technologické zralosti, dokud je slupka lesklá.
  - q: Proč lilku opadávají květy?
    a: Nejčastěji kvůli teplotnímu stresu (pod 15 °C nebo nad 32 °C) nebo výpadku závlahy. Ve skleníku pomáhá i podpora opylení proudícím vzduchem nebo čmeláky.
