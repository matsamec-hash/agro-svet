slug: pazitka
name: Pažitka pobřežní
name_plural: Pažitka
skupina: zelenina
hero_image: /images/plodiny/pazitka.jpg
hero_author: "Karelj"
hero_license: "CC BY-SA 3.0"
hero_source: "https://commons.wikimedia.org/wiki/File:Allium_schoenoprasum_Prague_2014_2.jpg"
description: >-
  Pažitka pobřežní (Allium schoenoprasum) je vytrvalá cibulová bylina pěstovaná pro duté
  zelené listy. Na jednom stanovišti vydrží tři až pět let a poskytuje několik sečí ročně.
  Kromě polního pěstování pro sušení a mrazírny se ve velkém pěstuje v květináčích pro
  maloobchod. Odrůdy se liší tloušťkou listu, rychlostí obrůstání a odolností proti rzi.
vysevek: 8–12 kg/ha přímý výsev; při množení dělením trsů 60–80 tisíc trsů/ha
hnojeni: N 100–150 kg/ha rozděleně po každé seči; K 150–200 kg K₂O/ha
vynos_t_ha: 15–25 (souhrn všech sečí za rok)
sklizen: duben–říjen, 3–5 sečí ročně
seti_mesice: [4, 5]
sklizen_mesice: [4, 5, 6, 7, 8, 9, 10]
vyuziti: čerstvá nať pro gastronomii, mrazírenské zpracování, sušení, hrnkové kultury pro maloobchod
choroby:
  - rez pažitková (Puccinia allii)
  - plíseň cibulová (Peronospora destructor)
  - třásněnka zahradní (Thrips tabaci)
  - bílá hniloba (Sclerotium cepivorum)
  - fuzariová hniloba báze (Fusarium spp.)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Odstup po cibulové zelenině nejméně 4 roky. Protože pažitka zůstává na stanovišti několik let, vybírá se pozemek bez vytrvalých plevelů — jejich pozdější regulace je v trvalé kultuře obtížná.
  - name: Založení porostu
    text: Přímý výsev v dubnu až květnu do hloubky 1–2 cm, nebo výsadba dělených trsů. Pažitka vzchází pomalu a v prvním roce se zpravidla sklízí jen jednou.
  - name: Hnojení
    text: Dusík se aplikuje po každé seči, aby porost rychle obrostl. Celková dávka se dělí do tří až čtyř přihnojení během vegetace.
  - name: Závlaha
    text: Pažitka má mělké kořeny a bez závlahy po seči obrůstá pomalu a list je tuhý. Zavlažuje se hned po každé sklizni.
  - name: Ochrana rostlin
    text: Hlavním problémem trvalých porostů je rez pažitková, která se v porostu kumuluje. Pomáhá včasná seč napadeného porostu a volba odolnějších odrůd.
  - name: Sklizeň a obnova porostu
    text: Seče se 2–3 cm nad zemí, třikrát až pětkrát ročně. Po třech až pěti letech porost prořídne a zaplevelí se — pak se ruší a zakládá znovu na jiném pozemku.
wikipedia: https://cs.wikipedia.org/wiki/Pa%C5%BEitka_pob%C5%99e%C5%BEn%C3%AD
faq:
  - q: Jak dlouho vydrží porost pažitky?
    a: Tři až pět let. Poté prořídne, kumuluje se v něm rez a plevele, a porost se ruší. Kvůli cibulové zelenině se nový zakládá na jiném pozemku s odstupem nejméně čtyř let.
  - q: Kolikrát ročně se pažitka seče?
    a: Třikrát až pětkrát podle ročníku a intenzity hnojení. Po každé seči je nutné přihnojit dusíkem a zavlažit, jinak porost obrůstá pomalu a list je tuhý.
  - q: Proč má pažitka na listech rezavé skvrny?
    a: Je to rez pažitková (Puccinia allii), typická choroba starších trvalých porostů. Řeší se včasnou sečí napadeného porostu, dobrým prouděním vzduchu a volbou odolnějších odrůd.
