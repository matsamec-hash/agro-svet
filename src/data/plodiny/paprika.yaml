slug: paprika
name: Paprika roční
name_plural: Paprika
skupina: zelenina
hero_image: /images/plodiny/paprika.jpg
hero_author: "AgroFidanishtjaHavolli"
hero_license: "CC BY-SA 4.0"
hero_source: "https://commons.wikimedia.org/wiki/File:AgroFidanishtja_Havolli_peppers.jpg"
description: >-
  Paprika roční (Capsicum annuum) je teplomilná plodová zelenina lilkovitých, v ČR pěstovaná
  jak na poli, tak ve skleníkách a fóliovnících. Registr ÚKZÚZ ji vede jako druh s vůbec
  nejvyšším počtem popsaných odrůd mezi zeleninou — od sladkých zeleninových typů přes
  kápie a beraní rohy až po pálivé odrůdy. Vyžaduje teplé stanoviště, závlahu a hlubokou
  humózní půdu.
vysevek: výsev do sadbovačů 40–60 g osiva na 1 000 sazenic; spon 50–60 × 30–40 cm (4–6 rostlin/m²)
hnojeni: N 100–150 kg/ha děleně (citlivá na jednorázové dávky); K 200–250 kg K₂O/ha; hořčík a vápník proti vrcholové hnilobě
vynos_t_ha: 20–40 (pole), 60–120 (skleník)
sklizen: červenec–říjen, postupně dle technologické zralosti
seti_mesice: [2, 3]
sklizen_mesice: [7, 8, 9, 10]
vyuziti: čerstvá zeleninová paprika, konzervárenské zpracování, sušení a mletí na koření, pálivé odrůdy
choroby:
  - bakteriální skvrnitost papriky (Xanthomonas euvesicatoria)
  - virus bronzovitosti rajčete (TSWV)
  - plíseň šedá (Botrytis cinerea)
  - verticiliové vadnutí (Verticillium dahliae)
  - vrcholová hniloba plodů (fyziologická, nedostatek vápníku)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Paprika se nesmí vracet po lilkovitých (rajče, brambor, lilek) dříve než za 3–4 roky. Vhodné předplodiny jsou luskoviny, obilniny a cibulová zelenina.
  - name: Předpěstování sadby
    text: Výsev do sadbovačů v únoru až březnu při 22–25 °C, přepichování do květináčů. Sadba je k výsadbě připravená za 8–10 týdnů, kdy má 8–10 listů a začínající poupata.
  - name: Výsadba
    text: Na pole až po odeznění pozdních mrazíků (po polovině května), do fóliovníku od poloviny dubna. Spon 50–60 × 30–40 cm. Paprika snáší přesazení dobře, kořeny jsou ale mělké.
  - name: Hnojení a závlaha
    text: Dusík dělit do 3–4 dávek. Klíčová je rovnoměrná závlaha — kolísání vlhkosti způsobuje vrcholovou hnilobu plodů. Kapková závlaha je standardem.
  - name: Ochrana rostlin
    text: Sledovat třásněnky jako přenašeče TSWV, mšice a molice. Proti plísni šedé větrat porost a odstraňovat poškozené plody.
  - name: Sklizeň
    text: Sklízí se postupně od července podle typu — zeleninová paprika v technologické zralosti (zelená, bílá), kápie a koření až v plné barevné zralosti.
wikipedia: https://cs.wikipedia.org/wiki/Paprika_ro%C4%8Dn%C3%AD
faq:
  - q: Kdy vysadit papriku na pole?
    a: Až po pominutí rizika pozdních mrazíků, tedy zpravidla po 15. květnu. Paprika je velmi citlivá na chlad — při teplotách pod 10 °C zastavuje růst a shazuje květy.
  - q: Proč paprikám černají špičky plodů?
    a: Je to vrcholová hniloba, fyziologická porucha z nedostatku vápníku v plodu. Příčinou bývá nepravidelná závlaha, ne nedostatek vápníku v půdě. Řešením je rovnoměrné zavlažování.
  - q: Kolik odrůd papriky je v ČR registrováno?
    a: ÚKZÚZ vede stovky registrovaných odrůd papriky, z toho více než dvě stovky mají zveřejněný oficiální popis odrůdy. Je to nejpočetnější zeleninový druh v českém registru.
