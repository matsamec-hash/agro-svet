slug: zeli
name: Zelí hlávkové
name_plural: Zelí
skupina: zelenina
hero_image: /images/plodiny/zeli.jpg
hero_author: ""
hero_license: "CC BY-SA 3.0"
hero_source: "https://commons.wikimedia.org/wiki/File:Brassica_oleracea2.jpg"
description: >-
  Zelí hlávkové (Brassica oleracea convar. capitata) je tradiční česká košťálová zelenina
  pěstovaná pro čerstvý trh, skladování i kysání. Registr ÚKZÚZ ho vede ve dvou barevných
  formách — bílé a červené — které se liší i pěstitelsky, protože červené má delší vegetační
  dobu a nižší výnos. Zelí patří mezi plodiny s nejvyššími nároky na živiny a vodu.
vysevek: výsev do sadbovačů 300–500 g osiva/ha; spon rané 50 × 40 cm, pozdní skladovací 60–70 × 50–60 cm
hnojeni: N 180–250 kg/ha děleně (velmi vysoká potřeba); K 250–350 kg K₂O/ha; bór proti dutosti košťálu
vynos_t_ha: 50–90 (pozdní skladovací až 100)
sklizen: červen–listopad dle ranosti
seti_mesice: [3, 4, 5]
sklizen_mesice: [6, 7, 8, 9, 10, 11]
vyuziti: čerstvá konzumace, kysané zelí, skladovací zelí pro zimní trh, konzervárenské zpracování
choroby:
  - nádorovitost kořenů brukvovitých (Plasmodiophora brassicae)
  - černá žilkovitost (Xanthomonas campestris)
  - alternariová skvrnitost (Alternaria brassicae)
  - plíseň zelná (Hyaloperonospora parasitica)
  - květilka zelná a dřepčíci
osevni_postup:
  - name: Předplodina a osevní postup
    text: Zelí se nesmí vracet po brukvovitých (řepka, hořčice, ostatní košťálovina) dříve než za 4–5 let kvůli nádorovitosti kořenů, která v půdě přežívá až 20 let.
  - name: Předpěstování sadby
    text: Výsev do sadbovačů podle ranosti od března do května. Sadba je připravená za 5–6 týdnů, kdy má 4–6 pravých listů.
  - name: Výsadba
    text: Rané odrůdy od dubna se sponem 50 × 40 cm, pozdní skladovací v květnu až červnu se sponem 60–70 × 50–60 cm. Řidší spon dává větší hlávky vhodné na kysání.
  - name: Hnojení a závlaha
    text: Zelí patří k nejnáročnějším plodinám na dusík. Dávku dělit na základní a dvě přihnojení. Bez závlahy 250–350 mm za vegetaci nelze dosáhnout tržního výnosu.
  - name: Ochrana rostlin
    text: Klíčová je prevence nádorovitosti vápněním na pH nad 7 a dodržením odstupu. Sledovat housenky běláska a můry zelné, dřepčíky na mladé sadbě a černou žilkovitost za vlhka.
  - name: Sklizeň
    text: Rané zelí se sklízí postupně při dosažení pevné hlávky, pozdní skladovací jednorázově před příchodem silných mrazů v říjnu až listopadu.
wikipedia: https://cs.wikipedia.org/wiki/Hl%C3%A1vkov%C3%A9_zel%C3%AD
faq:
  - q: Proč zelí praská v hlávce?
    a: Praskání způsobuje prudký příjem vody po suchu, kdy vnitřek hlávky roste rychleji než krycí listy. Pomáhá rovnoměrná závlaha a včasná sklizeň; odrůdy se v náchylnosti výrazně liší.
  - q: Jaký je rozdíl mezi bílým a červeným zelím při pěstování?
    a: Červené zelí má o dva až tři týdny delší vegetační dobu, nižší výnos a zpravidla menší hlávku. Pěstební technologie je jinak shodná. ÚKZÚZ je vede jako dvě samostatné skupiny odrůd.
  - q: Jak dlouho vydrží nádorovitost v půdě?
    a: Trvalé spory Plasmodiophora brassicae přežívají v půdě až 20 let. Jednou zamořený pozemek se pro košťálovou zeleninu prakticky vyřadí; jedinou obranou je prevence, vápnění a odolné odrůdy.
