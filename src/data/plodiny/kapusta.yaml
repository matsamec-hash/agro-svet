slug: kapusta
name: Kapusta
name_plural: Kapusta
skupina: zelenina
hero_image: /images/plodiny/kapusta.jpg
hero_author: "Jebulon"
hero_license: "Public domain"
hero_source: "https://commons.wikimedia.org/wiki/File:Brassica_oleracea_var._sabauda_JdP.jpg"
description: >-
  Kapusta je v registru ÚKZÚZ vedena ve dvou formách — kapusta hlávková (Brassica oleracea
  convar. capitata var. sabauda) s kadeřavou hlávkou a kapusta růžičková (var. gemmifera),
  která tvoří drobné hlávky v paždí listů na vysokém stonku. Obě patří k nejotužilejším
  zeleninám v českých podmínkách a snesou mráz i pod −10 °C.
vysevek: výsev do sadbovačů 300–400 g osiva/ha; spon hlávková 50 × 45 cm, růžičková 70 × 50 cm
hnojeni: N 150–200 kg/ha děleně; K 200–280 kg K₂O/ha; bór proti dutosti
vynos_t_ha: 30–50 (hlávková), 10–18 (růžičková)
sklizen: srpen–prosinec, růžičková po prvních mrazech
seti_mesice: [3, 4, 5]
sklizen_mesice: [8, 9, 10, 11, 12]
vyuziti: čerstvý trh a zimní zásobování, mrazírenské zpracování růžičkové kapusty, gastronomie
choroby:
  - nádorovitost kořenů brukvovitých (Plasmodiophora brassicae)
  - alternariová skvrnitost (Alternaria brassicae)
  - plíseň zelná (Hyaloperonospora parasitica)
  - mšice zelná a housenky běláska
  - černá žilkovitost (Xanthomonas campestris)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Odstup po brukvovitých nejméně 4–5 let. Kapusta má díky dlouhé vegetační době vysoké nároky na zásobu živin a strukturní půdu.
  - name: Předpěstování sadby
    text: Výsev v březnu až květnu podle formy. Růžičková kapusta má vegetační dobu 5–6 měsíců, takže se vysévá nejdříve a sází už v květnu.
  - name: Výsadba
    text: Hlávková 50 × 45 cm, růžičková řidčeji 70 × 50 cm — potřebuje prostor a světlo k rovnoměrnému nasazení růžiček po celém stonku.
  - name: Hnojení a závlaha
    text: Dusík dělit; pozdní dusíková dávka u růžičkové kapusty vede k volným, rozevřeným růžičkám. Závlaha rovnoměrná po celou vegetaci.
  - name: Zaštipování vrcholu
    text: U růžičkové kapusty se koncem srpna odstraní vrchol stonku. Rostlina přestane růst do výšky a živiny nasměruje do vyrovnaného dorůstání růžiček.
  - name: Sklizeň
    text: Hlávková kapusta od srpna průběžně. Růžičková až po prvních mrazech, které jí zásadně zlepší chuť — sklízí se postupně odspodu až do prosince.
wikipedia: https://cs.wikipedia.org/wiki/Kapusta
faq:
  - q: Proč sklízet růžičkovou kapustu až po mrazu?
    a: Mráz spustí přeměnu škrobu na cukry, čímž z růžiček zmizí hořkost a výrazně se zlepší chuť. Sklizená před mrazem je hořká. Rostlina přitom snese i −10 °C bez poškození.
  - q: Proč jsou růžičky volné a rozevřené?
    a: Nejčastěji kvůli přehnojení dusíkem nebo pozdní dusíkové dávce, případně příliš hustému sponu. Pomáhá i včasné zaštípnutí vrcholu koncem srpna.
  - q: Jaký je rozdíl mezi kapustou a zelím?
    a: Kapusta hlávková má kadeřavé, zvlněné listy a volnější hlávku, zelí hladké listy a pevnou hlávku. Kapusta je otužilejší a hodí se pro pozdní podzimní sklizně, zelí lépe skladuje a kysá.
