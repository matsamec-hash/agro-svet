slug: okurka
name: Okurka setá
name_plural: Okurky
skupina: zelenina
hero_image: /images/plodiny/okurka.jpg
hero_author: ""
hero_license: "Public domain"
hero_source: "https://commons.wikimedia.org/wiki/File:Illustration_Cucumis_sativus0.jpg"
description: >-
  Okurka setá (Cucumis sativus) se v českém registru odrůd vede ve dvou užitkových směrech —
  salátové okurky (hadovky) pro čerstvou konzumu a nakládačky pro konzervárenské zpracování.
  Je to teplomilná tykvovitá plodina s mělkým kořenovým systémem, mimořádně náročná na
  vyrovnanou vlhkost půdy i vzduchu.
vysevek: 3–5 kg/ha přímý výsev (nakládačky); salátové ze sadby, spon 120–150 × 30–50 cm
hnojeni: N 100–150 kg/ha děleně; K 200–250 kg K₂O/ha; organická hnojiva velmi vhodná
vynos_t_ha: 25–45 (nakládačky, pole), 100–250 (salátové, skleník)
sklizen: červenec–září, u nakládaček sběr obden
seti_mesice: [5]
sklizen_mesice: [7, 8, 9]
vyuziti: čerstvé salátové okurky, kvašáky a sterilované nakládačky, konzervárenský průmysl
choroby:
  - plíseň okurková (Pseudoperonospora cubensis)
  - padlí tykvovitých (Erysiphe cichoracearum)
  - fuzariové vadnutí (Fusarium oxysporum)
  - virus mozaiky okurky (CMV)
  - plíseň šedá (Botrytis cinerea)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Nevracet po tykvovitých dříve než za 3–4 roky. Ideální předplodinou jsou luskoviny nebo obilnina s podsevem. Okurka dobře využívá zbytkovou zásobu živin po hnojení chlévským hnojem.
  - name: Příprava půdy a setí
    text: Přímý výsev nakládaček až když půda dosáhne 12–15 °C, tedy zpravidla ve druhé polovině května. Sadba salátových okurek do fóliovníku od dubna.
  - name: Hnojení a závlaha
    text: Okurka má mělký kořenový systém a vysoké nároky na vodu. Kapková závlaha se závlahovou dávkou 20–30 mm týdně je standardem, výpadek vody způsobí hořknutí plodů.
  - name: Vedení a tvarování
    text: Salátové okurky ve skleníku se vedou k opoře na jeden výhon s postupným zaštipováním. Polní nakládačky se pěstují rozložené po povrchu, často na černé mulčovací fólii.
  - name: Ochrana rostlin
    text: Plíseň okurková je hlavní limit polního pěstování — objevuje se od července a při vlhku porost zlikviduje během dvou týdnů. Volit odolné odrůdy a preventivně ošetřovat.
  - name: Sklizeň
    text: Nakládačky se sbírají obden podle velikostních tříd, salátové okurky průběžně. Časté sklízení stimuluje nasazování dalších plodů.
wikipedia: https://cs.wikipedia.org/wiki/Okurka_set%C3%A1
faq:
  - q: Jaký je rozdíl mezi salátovou okurkou a nakládačkou?
    a: Salátové (hadovky) mají dlouhý hladký plod a pěstují se hlavně ve sklenících pro čerstvou konzumu. Nakládačky mají krátký plod s výraznějším ostnitým povrchem, pěstují se na poli a sklízejí nezralé pro konzervárenské zpracování. ÚKZÚZ je vede jako dva samostatné druhy s vlastními registry odrůd.
  - q: Proč jsou okurky hořké?
    a: Hořkost způsobují kukurbitaciny, jejichž tvorbu spouští stres — nejčastěji nedostatek vody, chlad nebo velké teplotní výkyvy. Moderní odrůdy jsou geneticky nehořknoucí, ale při silném stresu může hořknutí nastat i u nich.
  - q: Kdy vysévat okurky?
    a: Až se půda ohřeje na 12–15 °C, tedy zpravidla po polovině května. Vysazené dříve zůstávají stát a jsou náchylné k padání klíčních rostlin.
