# Slovenský overlay plodin. slug, skupina, hero_*, seti_mesice, sklizen_mesice
# a wikipedia zůstávají z cs (klíče, obrázky, kalendář). Pole choroby[] drží
# STEJNÉ pořadí i délku jako cs — mapování na entitu jde přes cs index.
slug: mak
name: Mak siaty
name_plural: Mak
description: >-
  Mak siaty (Papaver somniferum) je tradičná slovenská olejnina a korenina, ktorej zrno obsahuje
  40–50 % tuku a je typickou súčasťou slovenskej kuchyne (koláče, vianočka, rožky). Slovensko patrí
  medzi najväčších producentov a exportérov makového semena na svete. Pestovanie makovíc je prísne
  legislatívne regulované.
vysevek: 0,4–0,8 kg/ha (veľmi malé semeno, cieľová hustota 50–80 rastlín/m²)
hnojeni: N 60–100 kg/ha; citlivý na chloridové hnojivá (používať sírany); P a K podľa rozborov
vynos_t_ha: 0,8–1,5
sklizen: júl–august (tobolky zrelé, semená suché)
vyuziti: potravinárske makové semeno (pečivo, cukrárstvo), makový olej, farmaceutické alkaloidy (morfín)
choroby:
  - pleseň maková (Peronospora arborescens)
  - bakteriálna škvrnitosť (Xanthomonas campestris)
  - fuzarióza koreňov a stonky
  - vírusová mozaika maku (TuMV)
osevni_postup:
  - name: Predplodina a osevný postup
    text: >-
      Mak sa nesmie vrátiť na to isté pole skôr ako po 5–6 rokoch. Najlepšie predplodiny sú
      obilniny; vylúčiť strukoviny a kapustovité (prenosné choroby).
  - name: Príprava pôdy
    text: >-
      Veľmi jemné a rovné sejbové lôžko — mak má drobné semeno a citlivé klíčky. Orba 20–22 cm,
      jemná jarná príprava.
  - name: Sejba
    text: >-
      Sejba čo najskôr na jar (február–marec), hĺbka len 0,5–1,5 cm (!), výsevok 0,4–0,8 kg/ha. Mak
      klíči len pri teplote nad 2 °C.
  - name: Hnojenie
    text: >-
      N 60–100 kg/ha, P a K podľa rozborov; chloridové hnojivá sú nevhodné. Dusík aplikovať pred
      sejbou alebo vo fáze ružice.
  - name: Ochrana rastlín
    text: >-
      Herbicídy (preemergentne aj postemergentne), fungicídy pri výskyte plesne makovej, insekticídy
      pri výskyte vošky makovej alebo bejlomorky.
  - name: Zber
    text: >-
      Zber v júli–auguste pri úplnom dozretí toboliek — v momente, keď sú suché a semená pri
      zatrasení chrastia. Prezreté tobolky sa otvárajú a dochádza k stratám.
faq:
  - q: Prečo je hĺbka sejby maku taká malá?
    a: >-
      Mak má veľmi drobné semeno — semená sú také malé, že hlboko zasiate nemôžu vyklíčiť a dostať
      sa na povrch. Optimálna hĺbka sejby je 0,5–1,5 cm.
  - q: Aké sú legislatívne obmedzenia pri pestovaní maku v Česku?
    a: >-
      Pestovatelia maku sú povinní každoročne ohlásiť pestovanie Colnej správe ČR a dodržiavať
      minimálnu vzdialenosť porastov od obydlí. Obsah morfínu v rastlinách je sledovaný.
  - q: Aký výnos makového semena možno očakávať?
    a: >-
      Priemerný výnos je 0,8–1,3 t/ha, v priaznivom roku na dobrom stanovišti až 1,5 t/ha. Mak je
      výnosovo nestabilná plodina citlivá na zrážkový deficit.
