slug: jecmen-ozimy
name: Jačmeň ozimný
name_plural: Jačmeň ozimný
description: >-
  Jačmeň ozimný (Hordeum vulgare) je ozimná obilnina s najkratšou vegetačnou dobou medzi ozimnými
  obilninami — zberá sa o 1–2 týždne skôr ako pšenica. Je menej odolný voči zimným mrazom, ale
  dosahuje vysoké úrody a využíva sa najmä ako krmivo a sladovnícka surovina.
vysevek: 280–380 klíčiacich zŕn/m²
hnojeni: N 100–150 kg/ha v delených dávkach; fosfor a draslík podľa rozboru pôdy
vynos_t_ha: 6–9
sklizen: koniec júna až začiatok júla
vyuziti: krmné zrno, sladovnícky jačmeň (výroba sladu a piva), GPS
choroby:
  - hnedá škvrnitosť jačmeňa (rynchosporióza)
  - pruhovitosť jačmeňa (pyrenofóra)
  - múčnatka trávová
  - hrdze
  - žltá mozaika jačmeňa (BaYMV/BaMMV, prenášač pôdna huba)
osevni_postup:
  - name: Predplodina
    text: >-
      Najlepšie predplodiny sú repka, strukoviny a okopaniny. Po obilninách narastá riziko chorôb a
      vírusov prenášaných pôdnymi hubami.
  - name: Príprava pôdy
    text: >-
      Plytká orba 18–22 cm, urovnanie sejbového lôžka; jačmeň ozimný je citlivý na utuženie a
      nevhodné pH (optimum 6,0–7,0).
  - name: Sejba
    text: Termín sejby 20. september – 10. október. Hĺbka 3–4 cm, výsevok 280–380 klíčiacich zŕn/m².
  - name: Hnojenie dusíkom
    text: >-
      Dusík v delených dávkach; štartovacia dávka na jar a druhá dávka vo fáze steblovania.
      Prehnojenie N zvyšuje riziko poliehania.
  - name: Ochrana rastlín
    text: >-
      Morenie osiva (pruhovitosť, hnedá škvrnitosť), regulátory rastu pri riziku poliehania,
      fungicídy podľa výskytu chorôb.
  - name: Zber
    text: >-
      Jačmeň dozrieva rýchlo a je náchylný na vypadávanie zrna — zber je potrebné vykonať včas, pri
      vlhkosti 13–15 %.
faq:
  - q: Prečo sa jačmeň ozimný zberá skôr ako ozimná pšenica?
    a: >-
      Jačmeň ozimný má kratšiu vegetačnú dobu a dozrieva približne o 1–2 týždne skôr ako pšenica. To
      umožňuje skorší nástup zberu a znižuje riziko strát.
  - q: Aká je minimálna mrazuvzdornosť jačmeňa ozimného?
    a: >-
      Jačmeň ozimný patrí medzi menej mrazuodolné ozimné obilniny — znáša približne −12 až −15 °C v
      zóne odnožovania (bez snehovej pokrývky).
  - q: Je možné pestovať jačmeň ozimný na sladovnícke využitie?
    a: >-
      Áno, existujú sladovnícke odrody jačmeňa ozimného. Na splnenie sladovníckych parametrov (obsah
      bielkovín, klíčivosť) je potrebné dodržať špecifické agrotechnické opatrenia, najmä obmedziť N
      výživu.
