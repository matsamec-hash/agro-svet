# Slovenský overlay plodin. slug, skupina, hero_*, seti_mesice, sklizen_mesice
# a wikipedia zůstávají z cs (klíče, obrázky, kalendář). Pole choroby[] drží
# STEJNÉ pořadí i délku jako cs — mapování na entitu jde přes cs index.
slug: slunecnice
name: Slnečnica ročná
name_plural: Slnečnice
description: >-
  Slnečnica ročná (Helianthus annuus) je teplomilná olejnina pestovaná pre semená s vysokým obsahom
  oleja (45–55 %). Je zaujímavá ako prerušovač obilninových sledov, medonosná plodina a v posledných
  rokoch aj ako bioenergetická plodina. Vyžaduje teplé a slnečné podnebie.
vysevek: 5–8 rastlín/m² (50–80 tis. rastlín/ha)
hnojeni: N 80–120 kg/ha; P a K podľa rozborov; slnečnica je náročná na draslík a bór
vynos_t_ha: 2,5–4
sklizen: september–október (pri vlhkosti semien <12 %)
vyuziti: jedlý slnečnicový olej, krmné šroty, medonosná plodina, krmivo pre vtáky
choroby:
  - sklerotíniová hniloba (Sclerotinia sclerotiorum) — najnebezpečnejšia
  - pleseň slnečnicová (Plasmopara halstedii)
  - alternáriová škvrnitosť
  - fomópsová hniloba stonky (Diaporthe helianthi)
osevni_postup:
  - name: Predplodina a osevný postup
    text: >-
      Slnečnica je výbornou predplodinou pre obilniny. Sama vyžaduje 4–5-ročný odstup od slnečnice a
      ďalších hostiteľov sklerotíniovej hniloby (repka, hrach).
  - name: Príprava pôdy
    text: >-
      Hlboká jesenná orba (25–30 cm), jarná príprava sejbového lôžka. Slnečnica prospieva na
      hlbokých, dobre prevzdušnených pôdach.
  - name: Sejba
    text: >-
      Sejba od konca apríla do polovice mája, keď teplota pôdy dosiahne 8–10 °C. Hĺbka 4–6 cm,
      výsevok 5–8 rastlín/m².
  - name: Hnojenie
    text: >-
      N 80–120 kg/ha, aplikovaný pred sejbou alebo pri príprave pôdy. Slnečnica je náročná na K a B
      — sledovať zásobenosť týmito živinami.
  - name: Ochrana rastlín
    text: >-
      Herbicídy (preemergentné alebo postemergentné). Sklerotíniová hniloba — fungicídy pri
      kvitnutí; pleseň slnečnicová — odrodová odolnosť + morenie osiva.
  - name: Zber
    text: >-
      Zber v septembri–októbri, pri vlhkosti semien pod 12 %. Pri vyššej vlhkosti je potrebné
      dosušiť. Hlavy slnečnice sa zberajú špeciálnym adaptérom.
faq:
  - q: Aký výnos slnečnicových semien možno očakávať?
    a: >-
      Priemerný výnos semien v Česku je 2,5–3,5 t/ha. V priaznivých podmienkach s dobrou
      agrotechnikou možno dosiahnuť 4 t/ha.
  - q: Prečo je sklerotíniová hniloba taká nebezpečná pre slnečnicu?
    a: >-
      Sclerotinia sclerotiorum napáda stonku aj hlavu slnečnice a môže spôsobiť úplné zničenie
      porastu. Skleróciá prežívajú v pôde desiatky rokov, preto je kľúčový dlhý osevný postup (4–5
      rokov bez náchylných plodín).
  - q: Je slnečnica dobrou predplodinou?
    a: >-
      Áno, slnečnica je výbornou prerušovacou plodinou pre obilniny. Zanecháva hlboko zakorenenú
      pôdu a prispieva k narušeniu obilninového sledu.
