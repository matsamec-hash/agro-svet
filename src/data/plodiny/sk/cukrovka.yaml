# a wikipedia zůstávají z cs (klíče, obrázky, kalendář). Pole choroby[] drží
# STEJNÉ pořadí i délku jako cs — mapování na entitu jde přes cs index.
slug: cukrovka
name: Cukrová repa
name_plural: Cukrová repa
description: >-
  Cukrová repa (Beta vulgaris var. saccharifera) je najvýznamnejšia cukrodajná plodina mierneho
  pásma, pestovaná pre koreň s obsahom cukru 16–20 %. Spracováva sa výlučne v cukrovaroch na cukor
  (sacharózu), vedľajšie produkty (melasa, repné rezky) sa využívajú v krmovinárstve a na výrobu
  bioplynu.
vysevek: 1–1,2 polného vzchádzania na 9–10 rastlín/m² (presná sejba monosemennými odrodami)
hnojeni: >-
  N 120–160 kg/ha podľa zásobenosti pôdy; K 180–250 kg K₂O/ha; Na 50–100 kg/ha (sodík zlepšuje výnos
  cukru); bór 0,5–1 kg/ha
vynos_t_ha: 60–80 (korene); cukornatosť 16–20 %
sklizen: september–november (kampaňový príjem do cukrovaru)
vyuziti: výroba cukru (sacharóza), melasa (krmivo, kvasné suroviny), repné rezky (krmivo, bioplyn)
choroby:
  - cerkosporióza repy (Cercospora beticola) — najrozšírenejšia
  - pleseň sivá (Botrytis cinerea)
  - rizoktóniová hniloba koreňov (Rhizoctonia solani)
  - vírusové ochorenia (BYV — Beet yellows virus, prenášajú vošky)
  - múčnatka (Erysiphe betae)
osevni_postup:
  - name: Predplodina a osevný postup
    text: >-
      Cukrová repa sa nesmie pestovať opakovane — minimálna prestávka je 3 roky (najlepšie 4).
      Najlepšie predplodiny sú obilniny (najmä pšenica po strukovinách alebo repke).
  - name: Príprava pôdy
    text: >-
      Hlboká jesenná orba 28–30 cm, prípadné vápnenie na udržanie pH 6,5–7,5. Jarná príprava jemného
      sejbového lôžka bez hrúd.
  - name: Sejba
    text: >-
      Presná sejba monosemennými semenami od marca do apríla, hĺbka 2–3 cm, vzdialenosť v riadku
      18–22 cm, medziriadková vzdialenosť 45–50 cm.
  - name: Hnojenie
    text: >-
      Organické hnojivá sú výhodné; minerálny dusík v dávke 120–160 kg/ha, vysoká dávka draslíka a
      sodíka. Bor 0,5–1 kg/ha listovým hnojivom.
  - name: Ochrana rastlín
    text: >-
      Herbicídy (preemergentné + postemergentné BBCH 12–18), fungicídy pri výskyte cerkosporiózy,
      insekticídy pri výskyte vošiek a skočiek.
  - name: Zber
    text: >-
      Kampaňový zber podľa zmluvného termínu dodávky do cukrovaru (september–november). Šetrná
      manipulácia minimalizuje mechanické straty cukru.
faq:
  - q: Aký vysoký je výnos cukrovej repy?
    a: >-
      Cukrová repa dosahuje výnos koreňov 60–80 t/ha s cukornatosťou 16–20 %. Výnos cukru tak
      predstavuje približne 10–14 t/ha.
  - q: Prečo je sodík dôležitý pre cukrovú repu?
    a: >-
      Sodík (Na) čiastočne nahrádza draslík v metabolizme cukrovej repy a podporuje akumuláciu cukru
      v koreni. Aplikácia 50–100 kg Na/ha býva výhodná, najmä na ľahších pôdach.
  - q: Čo je cerkosporióza a ako ju rozpoznať?
    a: >-
      Cerkosporióza repy (Cercospora beticola) je hubová choroba spôsobujúca okrúhle škvrny s
      červenohnedým okrajom na listoch. Silný výskyt spôsobuje predčasné odumieranie listov a
      znižuje výnos aj cukornatosť.
  - q: Ako sa spracúvajú vedľajšie produkty z cukrovej repy?
    a: >-
      Melasa (zvyšok po extrakcii cukru) sa využíva ako krmivo alebo substrát na fermentáciu
      (droždie, alkohol). Repné rezky (vylisovaná dreň) slúžia ako krmivo pre hovädzí dobytok alebo
      ako substrát na bioplyn.
