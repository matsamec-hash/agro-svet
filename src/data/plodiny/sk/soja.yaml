# Slovenský overlay plodin. slug, skupina, hero_*, seti_mesice, sklizen_mesice
# a wikipedia zůstávají z cs (klíče, obrázky, kalendář). Pole choroby[] drží
# STEJNÉ pořadí i délku jako cs — mapování na entitu jde přes cs index.
slug: soja
name: Sója fazuľová
name_plural: Sója
description: >-
  Sója fazuľová (Glycine max) je teplomilná strukovina s najvyšším obsahom bielkovín (35–45 %) a
  oleja (18–22 %) zo všetkých poľných plodín. V Česku sa pestovanie sóje rozširuje vďaka šľachteniu
  krátkodenných odrôd a otepľovaniu klímy; je výbornou predplodinou a zdrojom dusíka pre pôdu.
vysevek: 60–80 klíčivých zŕn/m² (550 000–700 000 rastlín/ha)
hnojeni: >-
  N minimálne (biologická fixácia); P 40–60 kg P₂O₅/ha; K 80–120 kg K₂O/ha; molybdén a kobalt pre
  funkciu hľúzkových baktérií
vynos_t_ha: 2–4
sklizen: september–október (pri vlhkosti zrna <14 %)
vyuziti: >-
  krmný šrot (bielkovinové krmivo), potravinársky sójový olej, tofu, sójové mlieko, technické
  využitie
choroby:
  - fuzarióza stonky a koreňov (Fusarium spp.)
  - sklerotíniová hniloba (Sclerotinia sclerotiorum)
  - pleseň sójová (Peronospora manshurica)
  - bakteriálna pustulóza (Pseudomonas savastanoi pv. glycinea)
osevni_postup:
  - name: Predplodina a osevný postup
    text: >-
      Sója je vynikajúcou predplodinou pre obilniny. Sama nesmie nasledovať po inej strukovine —
      minimálna prestávka 4 roky.
  - name: Príprava pôdy
    text: >-
      Hlboká jesenná orba alebo jarná príprava. Sója prospieva na stredne ťažkých, dobre odvodnených
      a záhrevných pôdach s pH 6,0–7,0.
  - name: Inokulácia osiva
    text: >-
      Inokulácia osiva špecifickými kultúrami Bradyrhizobium japonicum je nevyhnutná — bez účinnej
      fixácie nemožno dosiahnuť dobrý výnos bez N hnojenia.
  - name: Sejba
    text: >-
      Sejba od konca apríla do polovice mája, keď teplota pôdy dosiahne aspoň 10 °C. Hĺbka 3–5 cm,
      výsevok 60–80 klíčivých zŕn/m².
  - name: Ochrana rastlín
    text: >-
      Herbicídy sú kľúčové — sója zle znáša burinnú konkurenciu v mladosti. Fungicídy a insekticídy
      podľa výskytu chorôb a škodcov.
  - name: Zber
    text: >-
      Zber v septembri–októbri pri vlhkosti zrna pod 14 %. Sója má nízko nasadené struky — je nutné
      správne nastavenie výšky žacieho ústrojenstva.
faq:
  - q: Prečo je inokulácia sóje taká dôležitá?
    a: >-
      Sója viaže vzdušný dusík pomocou špecifických baktérií Bradyrhizobium japonicum. Tieto
      baktérie sa prirodzene nevyskytujú v slovenských pôdach (sója je tu nová plodina), preto je
      inokulácia osiva nevyhnutná na tvorbu účinných hľúzok a biologickú fixáciu dusíka.
  - q: Aký výnos sóje možno v Česku dosiahnuť?
    a: >-
      Priemerný výnos v Česku je 2,5–3,5 t/ha. Na teplých a úrodných stanovištiach s priaznivým
      priebehom počasia možno dosiahnuť 4 t/ha. Sója je citlivá na sucho v období kvitnutia a tvorby
      strukov.
  - q: Dá sa sója pestovať v celom Česku?
    a: >-
      Sója potrebuje teplé podnebie — vhodné sú teplejšie nížinné stanovištia južného Moravy a
      stredných Čiech. V chladnejších oblastiach (nad 350–400 m n. m.) je pestovanie rizikové pre
      kratšie vegetačné obdobie.
