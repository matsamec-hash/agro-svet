# STEJNÉ pořadí i délku jako cs — mapování na entitu jde přes cs index.
slug: vojteska
name: Lucerna siata
name_plural: Lucerna siata
description: >-
  Lucerna siata (Medicago sativa) je trváca krmovina zo strukovín s hlbokým koreňovým systémom (3–5
  m), odolná voči suchu a schopná viazať 200–300 kg N/ha ročne. Poskytuje vysoko kvalitné krmivo
  (seno, senáž, granule) s obsahom bielkovín 18–24 % v sušine a zberá sa 3–5x ročne.
vysevek: 15–20 kg/ha (v čistom poraste); 8–12 kg/ha v miešanke s trávami
hnojeni: >-
  N minimálne (biologická fixácia); P 50–70 kg P₂O₅/ha; K 120–200 kg K₂O/ha; Ca (vápnenie) kľúčové
  pri pH pod 6,5; bór 1 kg/ha
vynos_t_ha: 10–18 (sušina za celú sezónu, 3–5 kosieb)
sklizen: >-
  3–5 kosieb ročne; kosenie na začiatku kvitnutia (10 % rastlín v kvete); v Česku spravidla 3–4
  kosby
vyuziti: >-
  seno, senáž, dehydrované granule (najkvalitnejšia krmná bielkovina), zelené krmivo, medonosná
  plodina
choroby:
  - verticíliové vädnutie (Verticillium albo-atrum)
  - fuzarióza koreňov a stonky (Fusarium spp.)
  - pleseň lucernová (Peronospora aestivalis)
  - bakteriálne vädnutie (Clavibacter michiganensis subsp. insidiosus)
osevni_postup:
  - name: Predplodina a osevný postup
    text: >-
      Lucerna siata nesmie byť pestovaná na tom istom pozemku skôr ako po 6–8 rokoch (únava pôdy,
      verticílium, fuzarióza). Najlepšie predplodiny sú obilniny.
  - name: Príprava pôdy a vápnenie
    text: >-
      Hlboká orba (28–30 cm) pre rozvoj koreňov. Vápnenie na pH 6,5–7,5 je kľúčové — lucerna siata
      je veľmi citlivá na kyslosť pôdy. Jemné sejbové lôžko.
  - name: Sejba
    text: >-
      Sejba skoro na jar (február–apríl) alebo v lete po zbere obilniny (júl). Hĺbka 1–2 cm, výsevok
      15–20 kg/ha. Možno podsevať pod jarnú obilninu.
  - name: Hnojenie
    text: >-
      Draslík a fosfor podľa rozborov pôdy sú kľúčové živiny; K 120–200 kg K₂O/ha sa aplikuje po
      kosbách. Bór 1 kg/ha podporuje tvorbu hľúzok.
  - name: Zber
    text: >-
      Kosiť na začiatku kvitnutia (10–20 % rastlín v kvete) pre optimálnu kombináciu výnosu a
      kvality. Porast ponechať minimálne 15 cm nad zemou.
  - name: Starostlivosť o porast
    text: >-
      Lucerna siata vydrží 4–6 rokov; po prezimovaní sledovať hustotu porastu. Pri výpadkoch dosiať
      alebo prejsť na iné využitie plochy.
faq:
  - q: Ako hlboko siahajú korene lucerny siatej?
    a: >-
      Lucerna siata vytvára kolovitý koreň siahajúci až 3–5 m do hĺbky. Vďaka tomu čerpá vodu z
      hlbokých vrstiev pôdy a je výrazne odolnejšia voči suchu ako plytko zakoreňujúce plodiny.
  - q: Koľkokrát ročne sa lucerna siata zberá?
    a: >-
      V Česku sa lucerna siata zberá spravidla 3–4x ročne, v teplejších oblastiach môže byť až 5
      kosieb. Každá kosba sa vykonáva na začiatku kvitnutia pre optimálnu kvalitu krmiva.
  - q: Prečo je vápnenie pre lucernu siatu také dôležité?
    a: >-
      Lucerna siata je veľmi citlivá na kyslú pôdnu reakciu. Pri pH pod 6,0 sú porasty riedke,
      hľúzkové baktérie zle fungujú a fixácia dusíka klesá. Optimálne pH je 6,5–7,5.
  - q: Ako dlho vydrží lucerna siata na stanovišti?
    a: >-
      Dobre vedené porasty lucerny siatej sú produktívne 4–6 rokov. Potom sa hustota porastu
      znižuje, narastá podiel burín a výnos klesá — pozemok je potrebné obnoviť inou plodinou.
