# Slovenský overlay plodin. slug, skupina, hero_*, seti_mesice, sklizen_mesice
# a wikipedia zůstávají z cs (klíče, obrázky, kalendář). Pole choroby[] drží
# STEJNÉ pořadí i délku jako cs — mapování na entitu jde přes cs index.
slug: repka-ozima
name: Repka ozimná
name_plural: Repka ozimná
description: >-
  Repka ozimná (Brassica napus) je najvýznamnejšia olejnina v Česku, pestovaná na olej s nízkym
  obsahom erukovej kyseliny (potravinársky a technický olej, bionafta) a bielkovinové šroty. Vysieva
  sa na konci leta a po prezimovaní tvorí husté porasty zberané v júni–júli.
vysevek: 40–60 klíčivých semien/m² (cieľová hustota 30–50 rastlín/m² po prezimovaní)
hnojeni: >-
  N 150–200 kg/ha celkovo — jesenná štartovacia dávka síry a časti N, jarné delené dávky N + síra
  30–40 kg/ha
vynos_t_ha: 3–5
sklizen: jún–júl (pri vlhkosti semien <9 %)
vyuziti: rastlinný olej (potravinársky, bionafta), bielkovinový šrot (krmivo), med (medonosná plodina)
choroby:
  - fómová hniloba stonky (Leptosphaeria maculans)
  - sklerotíniová hniloba (Sclerotinia sclerotiorum)
  - alternáriová škvrnitosť
  - pleseň sivá (Botrytis cinerea)
  - čerň pletív repky (Alternaria brassicae)
osevni_postup:
  - name: Predplodina
    text: >-
      Repka ozimná sa nesmie vrátiť na ten istý pozemok skôr ako po 4 rokoch. Najlepšie predplodiny
      sú ozimné obilniny. Vylúčiť predplodiny z čeľade kapustovité.
  - name: Príprava pôdy a sejba
    text: >-
      Skorý zber predplodiny a rýchla príprava kvalitného sejbového lôžka do hĺbky 2–3 cm. Sejba 15.
      augusta – 5. septembra, výsevok 40–60 klíčivých zŕn/m².
  - name: Jesenné hnojenie
    text: >-
      Pred sejbou alebo pri sejbe aplikovať P, K a síru; štartovacia dávka N (30–40 kg/ha) podporí
      vývoj do prezimovania. Porasty vstupujú do zimy v ružicovom štádiu.
  - name: Jarné hnojenie
    text: >-
      Hlavná N výživa na jar v 2–3 dávkach (celkovo 120–160 kg N/ha). Síra 30–40 kg/ha podporuje
      úrodu a obsah oleja.
  - name: Ochrana rastlín
    text: >-
      Fungicídy (fómová hniloba, sklerotíniová hniloba), insekticídy (byľomorka, krytonosce
      stonkové, blyskáčik repkový), herbicídy jeseň + jar.
  - name: Zber
    text: >-
      Zber priamy alebo s podsúšaním. Pri priamom zbere čakať na vlhkosť semien pod 9 %. Straty zo
      šešúľ minimalizovať správnym nastavením mláťačky.
faq:
  - q: Kedy sa seje ozimná repka?
    a: >-
      Optimálny termín sejby je 15. augusta – 5. septembra. Neskorá sejba oslabuje rastliny pred
      zimou a znižuje prezimovanie aj úrodu.
  - q: Prečo je síra dôležitá pre repku?
    a: >-
      Síra je nevyhnutná pre syntézu aminokyselín a glukozinolátov. Nedostatok síry znižuje úrodu aj
      obsah oleja. Odporúča sa 30–40 kg S/ha, najlepšie vo forme síranu.
  - q: Aký dlhý musí byť osevný postup pri repke?
    a: >-
      Repka a ostatné kapustovité plodiny nesmú na ten istý pozemok skôr ako po 4 rokoch, ideálne po
      5–6 rokoch, kvôli hromadeniu patogénov (fómová hniloba, sklerotíniová hniloba) a škodcov.
  - q: Aký výnos semena dosahuje repka ozimná?
    a: >-
      Priemerný výnos v Česku je 3–4 t/ha, v priaznivých podmienkach a s dobrou agrotechnikou možno
      dosiahnuť 4–5 t/ha.
