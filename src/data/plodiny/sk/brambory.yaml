# Slovenský overlay plodin. slug, skupina, hero_*, seti_mesice, sklizen_mesice
# a wikipedia zůstávají z cs (klíče, obrázky, kalendář). Pole choroby[] drží
# STEJNÉ pořadí i délku jako cs — mapování na entitu jde přes cs index.
slug: brambory
name: Zemiak
name_plural: Zemiaky
description: >-
  Zemiak (Solanum tuberosum) je jednou z najdôležitejších potravinárskych plodín sveta a historicky
  kľúčová okopanina na Slovensku. Pestuje sa pre konzumné hľuzy, výrobu škrobu a na kŕmne účely.
  Vyžaduje kvalitné, dobre odvodnené pôdy a náchylnosť na choroby kladie vysoké nároky na ochranu
  rastlín.
vysevek: 35 000–45 000 sadby/ha (vzdialenosť v riadku 30–35 cm, medziriadková vzdialenosť 70–75 cm)
hnojeni: >-
  N 100–160 kg/ha podľa smeru (konzumné vs. škrobové); K 150–250 kg K₂O/ha; P podľa rozborov;
  organické hnojivá sú výhodné
vynos_t_ha: 25–40 (konzumné a priemyselné odrody)
sklizen: august–október (podľa skorosti odrody)
vyuziti: konzumné hľuzy, výroba škrobu, krmivo, výroba liehu a lupienkov
choroby:
  - pleseň zemiaková (Phytophthora infestans) — najnebezpečnejšia
  - Alternaria solani (hnedá škvrnitosť listov)
  - vírusové choroby (mozaiky, zvinutka, Y-vírus)
  - Rhizoctonia solani (vredovitosť hľúz a stoniek)
  - strupovitosť hľúz (Streptomyces scabies)
osevni_postup:
  - name: Predplodina
    text: >-
      Zemiak vyžaduje dlhý osevný postup (minimálne 3–4 roky bez ľuľkovitých). Najlepšie predplodiny
      sú obilniny, kukurica a strukoviny.
  - name: Príprava pôdy a hnojenie
    text: >-
      Hlboká jesenná orba (28–30 cm), aplikácia organiky (maštaľný hnoj 20–30 t/ha). Jarná príprava
      hrbov alebo rovné sejbové lôžko.
  - name: Príprava sadby a výsadba
    text: >-
      Certifikovaná, virologicky overená sadba (min. E alebo A trieda). Výsadba od apríla, hĺbka
      8–12 cm, výsevok 35 000–45 000 ks/ha.
  - name: Hnojenie
    text: >-
      N podľa smeru využitia (konzumné 100–130 kg N/ha, škrobové 120–160 kg N/ha), vysoká dávka K
      zlepšuje tvorbu a kvalitu hľúz.
  - name: Ochrana rastlín
    text: >-
      Pleseň zemiaková — fungicídy preventívne podľa signalizácie, každých 7–14 dní. Herbicídy
      preemergentne. Insekticídy pri výskyte mandelinky zemiakovej.
  - name: Zber
    text: >-
      Desikácia vňate a zber pri vytvrdnutej šupke (tlakom palca sa šupka nepoškodí). Podľa skorosti
      odrody júl–október; šetrná manipulácia minimalizuje tlakové škvrny.
faq:
  - q: Prečo je pleseň zemiaková taká závažná?
    a: >-
      Phytophthora infestans môže počas niekoľkých dní zničiť celý porast za vlhkého a teplého
      počasia. Je to ten istý patogén, ktorý spôsobil írsky hladomor v 19. storočí. Preventívne
      fungicídne ošetrenie je pri priaznivých podmienkach nevyhnutné.
  - q: Ako spoznať, že sú zemiaky pripravené na zber?
    a: >-
      Zemiaky sú zrelé, keď vňať prirodzene žltne a odumiera a šupka hľúz je vytvrdnutá — palcom ju
      nemožno ľahko olúpať. Pri skorých odrodách možno zberať aj skôr (baby zemiaky).
  - q: Aký je význam certifikovanej sadby?
    a: >-
      Certifikovaná sadba zaručuje nízku hladinu vírusových chorôb (Y-vírus, zvinutka, mozaiky),
      ktoré sa šíria sadbovým materiálom a dramaticky znižujú úrodu a kvalitu.
  - q: Aký je typický výnos zemiakov?
    a: >-
      Konzumné a priemyselné zemiaky dosahujú 25–40 t/ha hľúz. Skoré odrody zberané skôr dosahujú
      nižší výnos (15–25 t/ha).
