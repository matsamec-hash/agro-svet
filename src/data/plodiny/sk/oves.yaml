# Slovenský overlay plodin. slug, skupina, hero_*, seti_mesice, sklizen_mesice
# a wikipedia zůstávají z cs (klíče, obrázky, kalendář). Pole choroby[] drží
# STEJNÉ pořadí i délku jako cs — mapování na entitu jde přes cs index.
slug: oves
name: Ovos siaty
name_plural: Ovos
description: >-
  Ovos siaty (Avena sativa) je jarná obilnina pestovaná na zrno aj krmovinu. Znáša chladnejšie a
  vlhkejšie oblasti a má nízke nároky na predplodinu. Využíva sa vo výžive ľudí (vločky, kaše), v
  krmivárstve aj ako zelená biomasa (GPS).
vysevek: 350–450 klíčivých zŕn/m²
hnojeni: N 60–90 kg/ha podľa predplodiny a stanovišťa
vynos_t_ha: 4–6
sklizen: koniec júla až august
vyuziti: krmné zrno, ovsené vločky, krmovina, GPS
choroby:
  - múčnatka trávová
  - hrdze (korunková, steblová)
  - prašná sneť ovosná
  - krauróza ovosná
osevni_postup:
  - name: Voľba pozemku
    text: >-
      Ovos znáša aj horšiu predplodinu, vhodný po okopaninách aj po obilnine. Dobre prospieva v
      chladnejších a vlhkejších polohách.
  - name: Príprava pôdy
    text: >-
      Stredne hlboká orba alebo minimalizačné spracovanie, urovnanie sejbového lôžka pred jarnou
      sejbou.
  - name: Sejba
    text: Jarný výsev čo najskôr po vyschnutí pôdy, hĺbka 3–4 cm, výsevok 350–450 zŕn/m².
  - name: Hnojenie
    text: >-
      Dusík 60–90 kg/ha podľa výnosového potenciálu stanovišťa a predplodiny; fosfor a draslík podľa
      rozborov pôdy.
  - name: Ochrana rastlín
    text: >-
      Ochrana proti múčnatke a hrdziam podľa prahu škodlivosti; morenie osiva chráni proti sneťi
      ovosnej.
  - name: Zber
    text: Zber pri plnej zrelosti zrna, vlhkosť pod 15 %, predísť stratám vykláňaním pri prezretí.
faq:
  - q: Aký je výsevok ovsa?
    a: Odporúčaný výsevok ovsa je 350–450 klíčivých zŕn na m², podľa stanovišťa a termínu sejby.
  - q: Po akej predplodine pestovať ovos?
    a: >-
      Ovos má nízke nároky na predplodinu, dobre znáša pestovanie po okopaninách aj po inej
      obilnine.
  - q: V akých oblastiach sa ovos pestuje najlepšie?
    a: >-
      Ovos prospieva v chladnejších a vlhkejších polohách, kde sú iné obilniny menej výnosné.
      Nevhodné sú suché a teplé nížiny.
  - q: Aký výnos zrna možno od ovsa očakávať?
    a: >-
      Pri dobrom agrotechnickom vedení dosahuje ovos výnos 4–6 t/ha zrna. Na priaznivých
      stanovištiach možno dosiahnuť aj vyššie výnosy.
