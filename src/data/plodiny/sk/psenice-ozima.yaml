slug: psenice-ozima
name: Pšenica ozimná
name_plural: Pšenica ozimná
description: >-
  Pšenica ozimná (Triticum aestivum) je najrozšírenejšia obilnina v Česku, pestovaná najmä na
  potravinárske a kŕmne zrno. Ozimná forma sa seje na jeseň a zberá v lete, dosahuje vyššie úrody
  ako jarná forma.
vysevek: 300–450 klíčiacich zŕn/m² (jesenný výsev); nižšie hodnoty pre skoré sejby
hnojeni: N 120–180 kg/ha v delených dávkach (začiatok vegetácie, steblovanie); P a K podľa rozborov
vynos_t_ha: 6–9
sklizen: júl
vyuziti: potravinárska múka, kŕmne zrno, škrob, bioetanol
choroby:
  - septorióza listov pšenice (Zymoseptoria tritici)
  - fuzariózy klasu a koreňov
  - múčnatka trávová
  - hrdze (pšeničná, žltá)
  - SNS (sneť zakrpatená)
osevni_postup:
  - name: Predplodina
    text: >-
      Najlepšie predplodiny sú repka, hrach a strukoviny. Opakovaná pšenica po pšenici zvyšuje
      riziko fuzariózy a septoriózy.
  - name: Príprava pôdy
    text: >-
      Orba na 20–25 cm po zbere predplodiny, urovnanie sejbového lôžka; pri minimalizácii dôkladné
      zapracovanie pozberových zvyškov.
  - name: Sejba
    text: >-
      Optimálny termín sejby v Česku: 1.–20. októbra. Hĺbka sejby 3–5 cm, výsevok 300–450 klíčiacich
      zŕn/m².
  - name: Hnojenie dusíkom
    text: >-
      Dusík aplikovať v delených dávkach — na začiatku vegetácie, vo fáze steblovania a podľa
      výnosového cieľa.
  - name: Ochrana rastlín
    text: >-
      Morenie osiva, jarné fungicídne ošetrenie (septorióza, múčnatka, hrdze) a ochrana klasu
      (fuzariózy). Regulátory rastu pri riziku poliehania.
  - name: Zber
    text: Zber pri vlhkosti zrna 13–15 % (júl); správne nastavenie mláťačky minimalizuje straty.
faq:
  - q: Kedy sa seje ozimná pšenica?
    a: >-
      Optimálny termín sejby ozimnej pšenice v Česku je 1.–20. októbra. Príliš skorá sejba zvyšuje
      riziko hubových chorôb a premnoženia škodcov.
  - q: Aká je spotreba dusíka pri ozimnej pšenici?
    a: >-
      Ozimná pšenica potrebuje 120–180 kg N/ha, aplikovaných v 2–3 dávkach od začiatku vegetácie po
      fázu steblovania.
  - q: Aký je typický výnos ozimnej pšenice v Česku?
    a: >-
      Priemerný výnos v Česku sa pohybuje okolo 6–7 t/ha, vo výhodných podmienkach a pri dobrej
      agrotechnike možno dosiahnuť 8–9 t/ha.
  - q: Aké sú najnebezpečnejšie choroby ozimnej pšenice?
    a: >-
      Kľúčové sú septorióza listov pšenice (Zymoseptoria tritici), fuzariózy klasu a múčnatka
      trávová. Ochrana fungicídmi v správnej fáze je ekonomicky opodstatnená.
