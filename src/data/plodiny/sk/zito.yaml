# STEJNÉ pořadí i délku jako cs — mapování na entitu jde přes cs index.
slug: zito
name: Raž ozimná
name_plural: Raž
description: >-
  Raž ozimná (Secale cereale) je veľmi odolná ozimná obilnina, znáša najchladnejšie a najmenej
  úrodné podmienky zo všetkých obilnín. V Česku sa pestuje na ľahkých, piesčitých a kyslých pôdach
  nevhodných pre pšenicu, a to ako na potravinárske zrno (ražný chlieb), tak aj ako energetická
  plodina (GPS, bioplyn).
vysevek: 200–300 klíčiacich zŕn/m²
hnojeni: N 80–120 kg/ha v delených dávkach; toleruje nižšiu zásobenosť živinami
vynos_t_ha: 5–8
sklizen: prelom júna a júla
vyuziti: ražná múka (chlieb), kŕmne zrno, GPS (bioplyn), ražná whisky
choroby:
  - námeľ ražný (Claviceps purpurea) — toxický, sledovať obsah v zrne
  - múčnatka trávová
  - hrdze
  - prašná sneť ražná
osevni_postup:
  - name: Predplodina a osevný postup
    text: >-
      Raž je najmenej náročná na predplodinu zo všetkých obilnín. Znáša aj opakované pestovanie, ale
      predplodina strukoviny alebo okopaniny je výhodná.
  - name: Príprava pôdy
    text: >-
      Plytká orba alebo minimalizácia; raž dobre rastie aj na ľahkých kyslých pôdach (pH 5,5–6,5),
      kde iné obilniny zlyhávajú.
  - name: Sejba
    text: >-
      Výsev september–október, hĺbka 2–4 cm, výsevok 200–300 klíčiacich zŕn/m². Raž rýchlo odnožuje
      a tvorí husté porasty.
  - name: Hnojenie
    text: Nároky na živiny sú nižšie ako pri pšenici. N 80–120 kg/ha, aplikovaný na jar v 1–2 dávkach.
  - name: Ochrana rastlín
    text: >-
      Regulátory rastu sú potrebné (raž je vysoká a náchylná na poliehanie), fungicídy podľa výskytu
      chorôb. Námeľ sledovať a pri výskyte ošetriť porast.
  - name: Zber
    text: >-
      Raž dozrieva na prelome júna a júla. Sledovať obsah námeľa v zrne — pri prekročení limitu
      nemožno zrno použiť na potravinárske účely.
faq:
  - q: Na akých pôdach sa raž pestuje?
    a: >-
      Raž znáša najľahšie, kyslé a menej úrodné pôdy nevhodné pre pšenicu. Darí sa jej pri pH
      5,5–6,5, dokáže využiť živiny z menej dostupných foriem.
  - q: Čo je námeľ a prečo je nebezpečný?
    a: >-
      Námeľ (Claviceps purpurea) je hubový patogén tvoriaci jedovaté skleróciá v kláskoch raže.
      Obsahuje alkaloidy, ktoré sú toxické pre ľudí aj zvieratá. Obsah námeľa v potravinárskom zrne
      je legislatívne obmedzený.
  - q: Aký výnos dáva raž ozimná?
    a: >-
      Raž dosahuje výnosy 5–8 t/ha; na úrodných pôdach sa približuje pšenici, na chudobných je
      výraznejším výberom.
