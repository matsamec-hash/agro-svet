slug: repka-jarni
name: Repka jarná
name_plural: Repka jarná
description: >-
  Repka jarná (Brassica napus var. annua) sa vysieva na jar a nepotrebuje jarovizáciu. Dosahuje
  nižší výnos ako ozimná forma, ale slúži ako alternatíva pri zlom prezimovaní ozimnej repky alebo
  ako spôsob skrátenia osevného postupu. Vegetačné obdobie je výrazne kratšie.
vysevek: 60–100 klíčivých semien/m² (vyšší výsevok kompenzuje kratšie vegetačné obdobie)
hnojeni: N 80–120 kg/ha celkovo; síra 20–30 kg/ha
vynos_t_ha: 2–3,5
sklizen: august
vyuziti: rastlinný olej, bielkovinový šrot (krmivo)
choroby:
  - alternáriová škvrnitosť (Alternaria spp.)
  - sklerotíniová hniloba (Sclerotinia sclerotiorum)
  - múčnatka kapustovitých
osevni_postup:
  - name: Predplodina
    text: >-
      Rovnako ako pri ozimnej repke platí 4–5-ročný osevný postup bez kapustovitých. Vhodné
      predplodiny sú obilniny a strukoviny.
  - name: Príprava pôdy
    text: >-
      Jarná príprava sejbového lôžka čo najskôr po vyschnutí pôdy; jemné, dobre utužené sejbové
      lôžko pre malé semeno.
  - name: Sejba
    text: >-
      Čo najskôr na jar (február–marec), hĺbka 1–2 cm, výsevok 60–100 klíčivých zŕn/m². Neskorá
      sejba výrazne znižuje výnos.
  - name: Hnojenie
    text: N 80–120 kg/ha; síra 20–30 kg/ha. Celková výživa je menej rozčlenená ako pri ozimnej forme.
  - name: Ochrana rastlín
    text: >-
      Herbicídy, fungicídy pri výskyte alternáriovej škvrnitosti a sklerotíniovej hniloby;
      insekticídy pri výskyte blyskáčika a krytonosov.
  - name: Zber
    text: >-
      Zber v auguste; repka jarná dozrieva rýchlo a je náchylná na vypadávanie zo šešúľ — sledovať
      termín.
faq:
  - q: Kedy sa pestuje jarná repka namiesto ozimnej?
    a: >-
      Jarná repka sa vysieva pri výpadku alebo silnom poškodení ozimnej repky mrazom v zime, alebo
      ako medziplodina v kratšom osevnom postupe. Výnos je výrazne nižší ako pri ozimnej forme.
  - q: Aký výnos semena dosahuje jarná repka?
    a: >-
      Výnos sa pohybuje v rozmedzí 2–3,5 t/ha, teda výrazne menej ako ozimná forma (3–5 t/ha). Skorý
      výsev a dostatočná výživa sú kľúčom k maximalizácii výnosu.
