# Slovenský overlay plodin. slug, skupina, hero_*, seti_mesice, sklizen_mesice
# a wikipedia zůstávají z cs (klíče, obrázky, kalendář). Pole choroby[] drží
# STEJNÉ pořadí i délku jako cs — mapování na entitu jde přes cs index.
slug: tritikale
name: Tritikale
name_plural: Tritikale
description: >-
  Tritikale je umelý hybrid pšenice (Triticum) a raže (Secale), ktorý kombinuje výnosový potenciál
  pšenice s odolnosťou a prispôsobivosťou raže. Pestuje sa najmä ako krmná obilnina a v posledných
  rokoch aj ako energetická plodina (GPS, bioplyn), výhodná na menej úrodných stanovištiach.
vysevek: 280–380 klíčiacich zŕn/m²
hnojeni: N 100–140 kg/ha v delených dávkach; nároky nižšie ako pšenica, vyššie ako raž
vynos_t_ha: 5–8
sklizen: prelom júna a júla
vyuziti: krmné zrno (hydina, ošípané, hovädzí dobytok), GPS (bioplyn), potravinárske experimenty
choroby:
  - múčnatka trávová
  - hrdze (žltá, steblová)
  - fuzariózy klasu
  - septorióza
osevni_postup:
  - name: Predplodina
    text: >-
      Tritikale nie je náročné na predplodinu — znesie aj horšie zaradenie v osevnom postupe, avšak
      predplodina strukoviny alebo okopaniny je výhodná.
  - name: Príprava pôdy
    text: >-
      Orba 20–22 cm, urovnanie sejbového lôžka. Tritikale prospieva na ľahších a stredne ťažkých
      pôdach pri pH 5,5–7,0.
  - name: Sejba
    text: Výsev október (ozimná forma), hĺbka 3–5 cm, výsevok 280–380 klíčiacich zŕn/m².
  - name: Hnojenie
    text: >-
      Dusík 100–140 kg/ha v delených dávkach (začiatok vegetácie, steblovanie). Vyšší N podporí
      výnos, ale zvyšuje riziko poliehania.
  - name: Ochrana rastlín
    text: >-
      Regulátory rastu pri riziku poliehania (tritikale je vysoké), fungicídy podľa výskytu chorôb
      (múčnatka, hrdze, fuzariózy klasu).
  - name: Zber
    text: >-
      Zber na prelome júna a júla, pri vlhkosti 14–16 %. Tritikale dozrieva rýchlo a má sklon k
      vypadávaniu.
faq:
  - q: Aké sú výhody tritikale oproti pšenici a raži?
    a: >-
      Tritikale kombinuje dobrý výnos pšenice s odolnosťou raže voči nepriaznivým podmienkam (chlad,
      kyslá pôda, sucho). Je vhodné na menej úrodné stanovištia, kde pšenica nedosahuje plný
      potenciál.
  - q: Na čo sa tritikale využíva?
    a: >-
      Prevažne ako krmné zrno pre hydinu, ošípané a hovädzí dobytok. Stále viac sa pestuje aj na
      celý porast (GPS) na výrobu bioplynu. Potravinárske využitie je menšinové.
  - q: Je tritikale odolné voči mrazom?
    a: >-
      Ozimné tritikale je odolnejšie ako ozimný jačmeň, ale menej odolné ako raž. Znáša približne
      −18 až −22 °C v zóne odnožovania pri snehovej pokrývke.
