slug: psenice-jarni
name: Pšenica jarná
name_plural: Pšenica jarná
description: >-
  Pšenica jarná (Triticum aestivum) sa vysieva na jar a zberá sa o 2–3 týždne skôr ako ozimá.
  Dosahuje nižšie úrody, avšak jej zrno má spravidla vyšší obsah bielkovín a lepku, čo ju predurčuje
  na výrobu potravinárskej múky s dobrými pekárenskými vlastnosťami.
vysevek: 350–500 klíčivých zŕn/m²
hnojeni: N 80–130 kg/ha; dôraz na kvalitatívnu dávku dusíka vo fáze steblovania až klasenia
vynos_t_ha: 4–6
sklizen: júl
vyuziti: potravinárska múka (chlieb, pečivo), kŕmne zrno
choroby:
  - septorióza listov pšenice (Zymoseptoria tritici)
  - múčnatka trávová
  - hrdze
  - fuzariózy klasu
osevni_postup:
  - name: Predplodina
    text: >-
      Jarná pšenica nie je taká náročná na predplodinu ako ozimá; vhodné sú strukoviny, repka alebo
      okopaniny.
  - name: Príprava pôdy
    text: >-
      Jesenná orba alebo jarné spracovanie čo najskôr po vyschnutí pôdy; jemné sejbové lôžko pre
      rovnomerné vzchádzanie.
  - name: Sejba
    text: Výsev čo najskôr na jar (február–marec), hĺbka 3–4 cm, výsevok 350–500 klíčivých zŕn/m².
  - name: Hnojenie
    text: Dusík 80–130 kg/ha; kvalitatívna dávka vo fáze steblovania podporí obsah bielkovín v zrne.
  - name: Ochrana rastlín
    text: >-
      Morenie osiva, fungicídne ošetrenie pri výskyte chorôb (múčnatka, septorióza, fuzariózy klasu)
      podľa prahu škodlivosti.
  - name: Zber
    text: >-
      Zber v júli pri vlhkosti zrna 13–15 %; pri potravinárskych odrodách sledovať aj parametre
      kvality (Zelenyho test, číslo poklesu).
faq:
  - q: Čím sa líši jarná pšenica od ozimej?
    a: >-
      Jarná pšenica sa vysieva na jar a nepotrebuje jarovizáciu. Dosahuje nižšiu úrodu zrna, ale
      spravidla vyšší obsah bielkovín a lepku vhodného pre pekárenské využitie.
  - q: Aký výsevok volíme pri jarnej pšenici?
    a: >-
      Odporúča sa 350–500 klíčivých zŕn/m². Vyšší výsevok kompenzuje kratšie vegetačné obdobie a
      nižšie odnožovanie pri jarnej sejbe.
  - q: Kedy siať jarnú pšenicu?
    a: >-
      Výsev by mal prebehnúť čo najskôr po vyschnutí pôdy, ideálne február–marec. Neskorá sejba
      znižuje úrodu aj kvalitu zrna.
