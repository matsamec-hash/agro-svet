# Slovenský overlay plodin. slug, skupina, hero_*, seti_mesice, sklizen_mesice
# a wikipedia zůstávají z cs (klíče, obrázky, kalendář). Pole choroby[] drží
# STEJNÉ pořadí i délku jako cs — mapování na entitu jde přes cs index.
slug: hrach
name: Hrach siaty
name_plural: Hrach
description: >-
  Hrach siaty (Pisum sativum) je najrozšírenejšou strukovinou v Slovenskej republike, cenený najmä
  ako predplodina pre ozimné obilniny. Viazaním vzdušného dusíka symbioticky s baktériami Rhizobium
  zlepšuje úrodnosť pôdy a znižuje nároky na dusíkaté hnojenie nasledujúcej plodiny. Zrno je bohatým
  zdrojom bielkovín (22–28 %).
vysevek: 80–110 klíčivých zŕn/m²
hnojeni: >-
  N 0–30 kg/ha (iba štartovacia dávka — hrach fixuje atmosférický dusík); P a K podľa rozborov;
  molybdén pre lepšiu funkciu hľúzkových baktérií
vynos_t_ha: 3–5
sklizen: júl (pri vlhkosti zrna <14 %)
vyuziti: krmné zrno (bielkovinové krmivo), potravinárstvo (lúpaný hrach, konzervovaný), zelené hnojenie
choroby:
  - askochytóza hrachu (Ascochyta pisi)
  - fuzarióza koreňov a stonky (Fusarium spp.)
  - pleseň hrachová (Peronospora viciae)
  - vírusová mozaika hrachu (PSbMV, prenášajú vošky)
osevni_postup:
  - name: Predplodina a osevný postup
    text: >-
      Hrach nesmie nasledovať po inej strukovine — minimálna prestávka 4–5 rokov. Najlepšie
      predplodiny sú ozimné obilniny. Hrach je sám vynikajúcou predplodinou pre ozimnú pšenicu.
  - name: Príprava pôdy
    text: >-
      Orba 20–22 cm alebo minimalizácia; hrach prospieva na stredne ťažkých, dobre odvodnených
      pôdach s pH 6,0–7,5. Citlivý na kyslosť a zamokrenie.
  - name: Sejba
    text: >-
      Jarná sejba čo najskôr (február–marec), hĺbka 4–6 cm, výsevok 80–110 klíčivých zŕn/m². Hrach
      znáša mierny mráz — skorý výsev je výhodný.
  - name: Inokulácia a hnojenie
    text: >-
      Inokulácia osiva hľúzkovými baktériami Rhizobium leguminosarum je výhodná na pozemkoch bez
      historického pestovania strukovín. Dusíkaté hnojenie minimálne (štartovacia dávka 0–30 kg/ha),
      P a K podľa rozborov.
  - name: Ochrana rastlín
    text: >-
      Herbicídy (preemergentné + postemergentné), fungicídy pri výskyte askochytózy a plesní,
      insekticídy pri výskyte vošiek a hrachovej zrnokazky.
  - name: Zber
    text: >-
      Zber v júli pri vlhkosti zrna pod 14 %. Hrach je náchylný na poliehanie a skorý zber — vhodné
      sú polotyčkové alebo tyčkové odrody alebo podporné plodiny (ovos).
faq:
  - q: Prečo je hrach takou dobrou predplodinou?
    a: >-
      Hrach viazaním vzdušného dusíka (cez symbiotické baktérie Rhizobium) obohacuje pôdu o dusík.
      Zanecháva tiež dobrú štruktúru pôdy a prerušuje obilninový sled, čím znižuje tlak chorôb a
      burín.
  - q: Potrebuje hrach dusíkaté hnojivo?
    a: >-
      Hrach si väčšinu dusíka zabezpečuje biologickou fixáciou. Štartovacia dávka N (0–30 kg/ha)
      môže podporiť vzchádzanie, kým sa rozvinú hľúzkové baktérie. Vyššie dávky N sú plytvaním a
      inhibujú fixáciu.
  - q: Aký výnos hrachu siateho možno očakávať?
    a: >-
      Priemerný výnos je 3–4,5 t/ha. Na kvalitných stanovištiach s priaznivým počasím možno
      dosiahnuť 5 t/ha. Hrach je výnosovo nestabilný — sucho v období kvitnutia výrazne znižuje
      výnos.
