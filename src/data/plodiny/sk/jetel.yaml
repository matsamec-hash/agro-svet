# Slovenský overlay plodin. slug, skupina, hero_*, seti_mesice, sklizen_mesice
# a wikipedia zůstávají z cs (klíče, obrázky, kalendář). Pole choroby[] drží
# STEJNÉ pořadí i délku jako cs — mapování na entitu jde přes cs index.
slug: jetel
name: Ďatelina lúčna
name_plural: Ďatelina lúčna
description: >-
  Ďatelina lúčna (Trifolium pratense) je najdôležitejšou krmovinovou strukovinou na Slovensku,
  pestovaná na zelené krmivo, seno, senáž a siláž s vysokým obsahom bielkovín (18–22 % v sušine).
  Biologicky fixuje vzdušný dusík a je kľúčovým prvkom osevného postupu na zlepšenie úrodnosti pôdy.
vysevek: 8–14 kg/ha (v čistom poraste); 4–8 kg/ha v ďatelinotrávnych miešankách
hnojeni: N minimálne (biologická fixácia); P 40–60 kg P₂O₅/ha; K 80–130 kg K₂O/ha; vápnenie pri pH pod 6,0
vynos_t_ha: 8–14 (sušina za celú zberovú sezónu, 2–3 kosby)
sklizen: 2–3 kosby ročne; prvá kosba na začiatku kvitnutia (jún), druhá kosba august
vyuziti: zelené krmivo, seno, senáž, siláž, zelené hnojenie, medonosná plodina
choroby:
  - sklerotíniová hniloba (Sclerotinia trifoliorum) — prezimovacia hniloba
  - antraknóza ďateliny (Colletotrichum trifolii)
  - vírusová mozaika ďateliny (CMV, TYMV)
  - fytoftorová hniloba koreňov (Phytophthora cactorum)
osevni_postup:
  - name: Predplodina a osevný postup
    text: >-
      Ďatelina lúčna je výbornou predplodinou pre ozimné obilniny. Sama sa nesmie pestovať opakovane
      — minimálna prestávka 4–5 rokov (riziko pôdnych chorôb a únava pôdy pre ďatelinu).
  - name: Príprava pôdy
    text: >-
      Jemné sejbové lôžko s dobrou schopnosťou prehrievania. Ďatelina prospieva na stredne ťažkých,
      neutrálnych pôdach s pH 6,0–7,0. Citlivá na kyslosť a zamokrenie.
  - name: Sejba (pod kryciu plodinu)
    text: >-
      Najčastejšie podsev pod jarnú obilninu (ovos, jačmeň jarný) na jar. Výsevok 8–14 kg/ha, hĺbka
      sejby 1–2 cm (veľmi plytko — malé semeno).
  - name: Hnojenie
    text: >-
      Fosfor a draslík podľa rozborov pôdy, vápnenie pri kyslej pôdnej reakcii. Dusík sa nedopĺňa
      (biologická fixácia), draslík je najdôležitejšou živinou.
  - name: Zber
    text: >-
      Prvá kosba na začiatku kvitnutia (maximálna kombinácia výnosu a kvality), druhá kosba v
      auguste. Po poslednej kosbe ponechať dostatočný porast na bezpečné prezimovanie.
  - name: Starostlivosť a prezimovanie
    text: >-
      Sledovať výskyt sklerotíniovej hniloby po zime. Ďatelina lúčna je dvojročná alebo krátkodobo
      trváca plodina — väčšinou sa pestuje 1–2 roky.
faq:
  - q: Koľko dusíka ďatelina lúčna fixuje?
    a: >-
      Ďatelina lúčna môže viazať 150–250 kg N/ha za rok prostredníctvom symbiotických baktérií
      Rhizobium. Táto hodnota závisí od kondície porastu, pôdnych podmienok a počasia.
  - q: Prečo sa ďatelina vysieva pod kryciu plodinu?
    a: >-
      Podsev pod kryciu obilninu chráni drobné ďatelinové klíčky pred burinovou konkurenciou a
      slnečným žiarom v prvom roku. Obilnina funguje ako „dáždnik" a ďatelina sa etabluje v jej
      tieni.
  - q: Ako dlho vydrží porast ďateliny lúčnej?
    a: >-
      Ďatelina lúčna je krátkodobo trváca strukovina — porast je produktívny 1–2 roky, výnimočne 3
      roky. Potom výrazne klesá hustota a výnos.
  - q: Aký výnos sušiny ďatelina poskytuje?
    a: >-
      Pri 2–3 kosbách dosahuje ďatelina lúčna 8–14 t sušiny/ha ročne. Na dobrých stanovištiach s
      priaznivými zrážkami môže výnos presiahnuť 14 t/ha.
