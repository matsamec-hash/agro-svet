slug: tykev
name: Tykev
name_plural: Tykve
skupina: zelenina
hero_image: /images/plodiny/tykev.jpg
hero_author: "George Chernilevsky"
hero_license: "Public domain"
hero_source: "https://commons.wikimedia.org/wiki/File:Cucurbita_2011_G1.jpg"
description: >-
  Tykev je v registru ÚKZÚZ vedena ve dvou botanických druzích — tykev obecná (Cucurbita pepo),
  kam patří cukety, patizony a olejné tykve na semeno, a tykev velkoplodá (Cucurbita maxima)
  s velkými skladovatelnými plody typu hokaido a máslová dýně. Je to teplomilná plodina
  s rozsáhlým kořenovým systémem a vysokou spotřebou živin i vody.
vysevek: 3–6 kg/ha dle druhu; spon cuketa 100–150 × 60–80 cm, velkoplodá 200 × 100 cm
hnojeni: N 100–150 kg/ha; K 200–250 kg K₂O/ha; velmi dobře reaguje na organické hnojení
vynos_t_ha: 30–60 (cuketa), 25–45 (velkoplodá dýně), 0,8–1,5 (olejné semeno)
sklizen: červenec–říjen (cuketa průběžně), září–říjen (skladovací dýně)
seti_mesice: [5]
sklizen_mesice: [7, 8, 9, 10]
vyuziti: cukety a patizony pro čerstvý trh, skladovací dýně, dýňový olej a loupané semeno, krmné využití
choroby:
  - padlí tykvovitých (Erysiphe cichoracearum, Podosphaera xanthii)
  - plíseň okurková (Pseudoperonospora cubensis)
  - virus mozaiky okurky (CMV) a virus žluté mozaiky cukety (ZYMV)
  - bakteriální vadnutí tykvovitých (Erwinia tracheiphila)
  - fuzariové vadnutí (Fusarium spp.)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Nevracet po tykvovitých dříve než za 4 roky. Tykev je náročná na živiny a výborně zhodnotí hnůj; často se řadí do prvního roku po organickém hnojení.
  - name: Setí a výsadba
    text: Přímý výsev až po polovině května, když půda dosáhne 12–14 °C, do hloubky 3–4 cm. Pro časnější sklizeň cuket se předpěstuje sadba v květináčích — tykev nesnáší přesazování s narušeným kořenem.
  - name: Hnojení a závlaha
    text: Vysoké nároky na draslík a vodu, zejména v období nalévání plodů. Kapková závlaha pod mulčovací fólií je u cuket standardem a zároveň řeší plevele.
  - name: Opylení
    text: Tykev má oddělené samčí a samičí květy a je závislá na hmyzím opylení. Nedostatek opylovačů se projeví zasychajícími malými plody — v produkčních porostech se umisťují včelstva.
  - name: Ochrana rostlin
    text: Padlí je hlavní chorobou druhé poloviny vegetace; volit odrůdy s deklarovanou odolností. Virózy přenášejí mšice, proto se sleduje jejich nálet od června.
  - name: Sklizeň
    text: Cukety se sklízejí nezralé obden při délce 15–20 cm; časté sklízení prodlužuje plodnost. Skladovací dýně se sklízí v plné zralosti se zaschlou stopkou před prvními mrazy.
wikipedia: https://cs.wikipedia.org/wiki/Tykev
faq:
  - q: Jaký je rozdíl mezi tykví obecnou a velkoplodou?
    a: Tykev obecná (Cucurbita pepo) zahrnuje cukety, patizony a olejné tykve, má tvrdou hranatou stopku a plody se sklízejí většinou nezralé. Tykev velkoplodá (Cucurbita maxima) má měkkou okrouhlou stopku, velké plody typu hokaido a sklízí se plně zralá pro skladování. ÚKZÚZ je vede jako samostatné druhy.
  - q: Proč cuketám zasychají malé plody?
    a: Nejčastěji kvůli nedostatečnému opylení. Tykev potřebuje přenos pylu ze samčích na samičí květy hmyzem; za chladného deštivého počasí nebo bez opylovačů se plod nezačne nalévat a zaschne.
  - q: Kdy sklízet dýni na skladování?
    a: V plné zralosti, kdy stopka zdřevnatí a slupku nelze nehtem promáčknout, nejpozději před prvním mrazem. Sklizené dýně se nechávají 10–14 dní dozrát v teple, což výrazně prodlouží skladovatelnost.
