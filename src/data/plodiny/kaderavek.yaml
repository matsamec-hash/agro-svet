slug: kaderavek
name: Kadeřávek
name_plural: Kadeřávek
skupina: zelenina
hero_image: /images/plodiny/kaderavek.jpg
hero_author: "Evan-Amos"
hero_license: "CC0"
hero_source: "https://commons.wikimedia.org/wiki/File:Kale-Bundle.jpg"
description: >-
  Kadeřávek (Brassica oleracea var. sabellica), v posledních letech známý i pod anglickým názvem
  kale, je listová košťálovina, která netvoří hlávku. Je to nejotužilejší zelenina v českém
  sortimentu — snese mráz pod −15 °C a po zámrazu se jeho chuť zlepšuje. Sklízí se postupně
  odspodu po jednotlivých listech, díky čemuž poskytuje úrodu od podzimu až do jara.
vysevek: výsev do sadbovačů 200–300 g osiva/ha; spon 50 × 40 cm
hnojeni: N 120–160 kg/ha děleně; K 180–220 kg K₂O/ha
vynos_t_ha: 15–30
sklizen: říjen–březen, postupně po listech
seti_mesice: [5, 6]
sklizen_mesice: [10, 11, 12, 1, 2, 3]
vyuziti: čerstvá listová zelenina, saláty a smoothie, sušené chipsy, gastronomie
choroby:
  - nádorovitost kořenů brukvovitých (Plasmodiophora brassicae)
  - mšice zelná (Brevicoryne brassicae)
  - housenky běláska zelného a můry zelné
  - alternariová skvrnitost (Alternaria brassicae)
  - plíseň zelná (Hyaloperonospora parasitica)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Odstup po brukvovitých nejméně 4 roky. Kadeřávek má dlouhou vegetační dobu a na pozemku zůstává přes zimu, s čímž je nutné počítat v osevním sledu.
  - name: Předpěstování sadby
    text: Výsev do sadbovačů v květnu až červnu. Sadba je připravená za 5–6 týdnů; výsadba probíhá v červnu až červenci, často po sklizni rané plodiny.
  - name: Výsadba
    text: Spon 50 × 40 cm. Kadeřávek roste do výšky 60–100 cm a na exponovaných stanovištích se vyšší odrůdy přihrnují zeminou, aby v zimě nevyvrátil vítr.
  - name: Hnojení a závlaha
    text: Dusík dělit, poslední dávku nejpozději v září, aby porost do zimy vyzrál a nebyl náchylný k namrznutí. Závlaha rovnoměrná po celé léto.
  - name: Ochrana rostlin
    text: Hlavním problémem jsou mšice a housenky v létě a na začátku podzimu. Mšice se schovávají v kadeřavém listu, kam se postřik obtížně dostane — účinnější jsou ochranné sítě.
  - name: Sklizeň
    text: Sklízí se postupně odspodu jednotlivé listy, vrchol se ponechává k dalšímu růstu. Sklizeň pokračuje přes celou zimu; po prvních mrazech je list výrazně sladší.
wikipedia: https://cs.wikipedia.org/wiki/Kade%C5%99%C3%A1vek
faq:
  - q: Snese kadeřávek mráz?
    a: Ano, je to nejotužilejší zelenina v českém sortimentu — bez poškození snese pod −15 °C. Mráz navíc spustí přeměnu škrobu na cukry, takže list po zámrazu výrazně zesládne.
  - q: Jak se kadeřávek sklízí?
    a: Postupně, po jednotlivých listech odspodu, zatímco vrchol rostliny dál roste. Jedna rostlina tak dává úrodu několik měsíců, od října zhruba do března.
  - q: Kdy kadeřávek vysévat?
    a: V květnu až červnu, s výsadbou v červnu až červenci. Cílem není rychlá sklizeň, ale vzrostlá rostlina do nástupu mrazů — hlavní sklizňové období je zima.
