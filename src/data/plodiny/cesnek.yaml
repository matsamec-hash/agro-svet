slug: cesnek
name: Česnek kuchyňský
name_plural: Česnek
skupina: zelenina
hero_image: /images/plodiny/cesnek.jpg
hero_author: ""
hero_license: "Public domain"
hero_source: "https://commons.wikimedia.org/wiki/File:Allium_sativum_Woodwill_1793.jpg"
description: >-
  Česnek kuchyňský (Allium sativum) se v registru ÚKZÚZ dělí na ozimý, který se sází na podzim,
  tvoří květní stvol (paličák) a dává větší cibule, a jarní, sázený na jaře, bez stvolu
  a s výrazně lepší skladovatelností. Česká produkce dlouhodobě nepokrývá spotřebu, proto
  jde o plodinu s trvale silnou domácí poptávkou.
vysevek: 800–1 500 kg/ha sadby dle velikosti stroužku (spon 30 × 10–12 cm)
hnojeni: N 80–120 kg/ha na jaře děleně; K 150–200 kg K₂O/ha; nesnáší čerstvý hnůj
vynos_t_ha: 6–12
sklizen: červenec (ozimý), srpen (jarní)
seti_mesice: [10, 11, 3]
sklizen_mesice: [7, 8]
vyuziti: konzumní česnek pro čerstvý trh a skladování, sušení, výroba pasty a koření
choroby:
  - fuzariová bazální hniloba (Fusarium culmorum, F. oxysporum)
  - bílá hniloba česneku (Sclerotium cepivorum)
  - háďátko zhoubné (Ditylenchus dipsaci)
  - rez česneková (Puccinia allii)
  - vrtalka pórová (Napomyza gymnostoma)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Česnek se nesmí vracet po cibulové zelenině dříve než za 4–5 let kvůli bílé hnilobě a háďátku. Nejlepší předplodinou jsou obilniny a luskoviny. Nikdy nesázet do čerstvě hnojené půdy.
  - name: Příprava sadby
    text: Rozhodující je zdravotní stav sadby — háďátko i fuzária se přenášejí právě sadbou. Používat certifikovanou sadbu, stroužky rozebírat těsně před výsadbou a vyřazovat poškozené.
  - name: Výsadba
    text: Ozimý česnek se sází v říjnu až listopadu do hloubky 5–8 cm, aby stihl zakořenit před mrazy. Jarní co nejdříve na jaře, jakmile lze na pozemek. Spon 30 × 10–12 cm.
  - name: Hnojení a závlaha
    text: Dusík aplikovat na jaře děleně, poslední dávku nejpozději měsíc před sklizní. Závlaha je klíčová v květnu a červnu při tvorbě cibule; poslední tři týdny před sklizní se závlaha ukončí.
  - name: Odstranění stvolu
    text: U ozimého paličáku se odstraňuje květní stvol, jakmile se začne stáčet. Ponechaný stvol odčerpá živiny a sníží hmotnost cibule o 20–30 %.
  - name: Sklizeň a dosoušení
    text: Sklízí se při zaschnutí spodní třetiny listů, dokud jsou krycí suknice celé. Dosoušení ve stínu při dobrém proudění vzduchu je podmínkou skladovatelnosti.
wikipedia: https://cs.wikipedia.org/wiki/%C4%8Cesnek_kuchy%C5%88sk%C3%BD
faq:
  - q: Jaký je rozdíl mezi ozimým a jarním česnekem?
    a: Ozimý se sází na podzim, vytváří květní stvol (proto paličák), má větší cibuli s menším počtem velkých stroužků a sklízí se v červenci. Jarní se sází na jaře, stvol netvoří, má menší cibuli s více stroužky, ale skladuje se výrazně déle — až do jara.
  - q: Proč se u česneku odstraňuje stvol?
    a: Květní stvol odčerpává živiny do vzdušných cibulek místo do podzemní cibule. Jeho včasné odstranění zvyšuje hmotnost cibule zhruba o pětinu až třetinu.
  - q: Kdy sklízet česnek?
    a: Když zaschne spodní třetina až polovina listů a krycí suknice jsou ještě neporušené. Pozdní sklizeň znamená rozpadlé cibule s popraskanými suknicemi, které se nedají skladovat.
