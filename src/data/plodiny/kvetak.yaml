slug: kvetak
name: Květák
name_plural: Květák
skupina: zelenina
hero_image: /images/plodiny/kvetak.jpg
hero_author: ""
hero_license: "CC BY-SA 3.0"
hero_source: "https://commons.wikimedia.org/wiki/File:Cauliflower.jpg"
description: >-
  Květák (Brassica oleracea var. botrytis) je nejnáročnější košťálová zelenina na pěstitelskou
  přesnost. Tržní produkt — kompaktní bílá růžice — vzniká jen při vyrovnaném růstu bez stresu;
  jakýkoli výpadek vody, živin nebo teplotní šok se okamžitě projeví sypkou, prorostlou nebo
  zbarvenou růžicí. Odrůdy se liší dobou vegetace a samokrycí schopností listů.
vysevek: výsev do sadbovačů 300–500 g osiva/ha; spon 50–60 × 40–50 cm
hnojeni: N 180–220 kg/ha děleně; K 250–300 kg K₂O/ha; bór a molybden zásadní (bez nich hnědnutí a bičovitost listů)
vynos_t_ha: 20–35
sklizen: červen–listopad dle termínu výsadby
seti_mesice: [3, 4, 5, 6]
sklizen_mesice: [6, 7, 8, 9, 10, 11]
vyuziti: čerstvý trh, mrazírenské zpracování, konzervárenství
choroby:
  - nádorovitost kořenů brukvovitých (Plasmodiophora brassicae)
  - černá žilkovitost (Xanthomonas campestris)
  - alternariová skvrnitost (Alternaria brassicae)
  - květilka zelná a housenky běláska zelného
  - hnědnutí růžice (fyziologická porucha z nedostatku bóru)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Odstup po brukvovitých nejméně 4–5 let. Květák patří do první trati po organickém hnojení a vyžaduje půdy s vysokou zásobou živin a pH nad 6,5.
  - name: Předpěstování sadby
    text: Výsev do sadbovačů od března do června podle plánovaného termínu sklizně. Sadba je připravená za 5–6 týdnů. Přestárlá sadba je hlavní příčinou předčasného zakládání drobných růžic.
  - name: Výsadba
    text: Spon 50–60 × 40–50 cm podle ranosti. Sázet do vlhké půdy a hned zalít — každý stres po výsadbě znamená menší nebo deformovanou růžici.
  - name: Hnojení a závlaha
    text: Vysoká a plynulá výživa dusíkem, doplněná bórem a molybdenem. Závlaha musí být pravidelná po celou vegetaci; květák nesnese ani krátké přeschnutí.
  - name: Krytí růžice
    text: U odrůd bez dostatečného samokrytí se listy lámou přes růžici, aby zůstala bílá. Nekryté růžice na slunci žloutnou a ztrácejí tržní hodnotu.
  - name: Sklizeň
    text: Sklízí se ručně při dosažení tržní velikosti, dokud je růžice pevná a zrnitost jemná. Sklizňové okno je krátké — o pár dní později růžice zhrubne a rozpadá se.
wikipedia: https://cs.wikipedia.org/wiki/Kv%C4%9Bt%C3%A1k
faq:
  - q: Proč je růžice květáku sypká a prorostlá listy?
    a: Je to reakce na stres — nejčastěji sucho, vysoké teploty nebo přestárlou sadbu. Květák potřebuje plynulý růst bez přerušení; jakmile se růst zastaví a znovu rozběhne, růžice se rozpadne.
  - q: Proč růžice hnědne?
    a: Hnědnutí a sklovitost pletiva způsobuje nedostatek bóru. Projeví se i hořkou chutí a dutými stonky. Řeší se listovou aplikací bóru, na lehkých a vyvápněných půdách preventivně.
  - q: Jak udržet růžici bílou?
    a: Zakrýt ji vlastními listy — u odrůd bez samokrytí se listy zalomí přes růžici, jakmile dosáhne velikosti pěsti. Bez zakrytí slunce růžici zbarví dožluta.
