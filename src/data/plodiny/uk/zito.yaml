# a wikipedia zůstávají z cs (klíče, obrázky, kalendář). Pole choroby[] drží
# STEJNÉ pořadí i délku jako cs — mapování na entitu jde přes cs index.
# Termíny setí a sklizně jsou ČESKÉ a text to říká nahlas („у Чехії").
slug: zito
name: Жито озиме
name_plural: Жито
description: >-
  Жито озиме (Secale cereale) — дуже стійка озима зернова культура, яка витримує найхолодніші та
  найменш родючі умови серед усіх зернових. У Чехії вирощується на легких, піщаних і кислих ґрунтах,
  непридатних для пшениці, як для виробництва продовольчого зерна (житній хліб), так і як
  енергетична культура (GPS, біогаз).
vysevek: 200–300 схожих зерен/м²
hnojeni: N 80–120 кг/га у розділених дозах; толерує низьку забезпеченість елементами живлення
vynos_t_ha: 5–8
sklizen: кінець червня — початок липня (у Чехії)
vyuziti: житнє борошно (хліб, хлібобулочні вироби), кормове зерно, GPS (біогаз), житня віскі
choroby:
  - ріжки житні (Claviceps purpurea) — токсичні, контролювати вміст у зерні
  - борошниста роса злаків
  - іржі
  - пухирчаста сажка жита
osevni_postup:
  - name: Попередник і сівозміна
    text: >-
      Жито — найменш вибаглива до попередника культура серед зернових. Витримує повторне
      вирощування, але попередник у вигляді зернобобових або просапних культур є перевагою.
  - name: Підготовка ґрунту
    text: >-
      Мілке орання або мінімальний обробіток; жито добре росте навіть на легких кислих ґрунтах (pH
      5,5–6,5), де інші зернові не дають результату.
  - name: Сівба
    text: >-
      Сівба у вересні–жовтні (у Чехії), глибина загортання 2–4 см, норма висіву 200–300 схожих
      зерен/м². Жито швидко кущиться і формує густий посів.
  - name: Удобрення
    text: >-
      Потреба в елементах живлення нижча, ніж у пшениці. N 80–120 кг/га, вносити навесні у 1–2
      прийоми.
  - name: Захист рослин
    text: >-
      Регулятори росту необхідні (жито високе і схильне до вилягання), фунгіциди — за наявності
      хвороб. Вміст ріжків контролювати, за необхідності — обробити посів.
  - name: Збирання врожаю
    text: >-
      Жито достигає на межі червня та липня (у Чехії). Контролювати вміст ріжків у зерні — при
      перевищенні допустимого рівня зерно не можна використовувати для харчових цілей.
faq:
  - q: На яких ґрунтах вирощують жито?
    a: >-
      Жито витримує найлегші, кислі та малородючі ґрунти, непридатні для пшениці. Добре росте при pH
      5,5–6,5, здатне засвоювати поживні речовини з важкодоступних форм.
  - q: Що таке ріжки і чим вони небезпечні?
    a: >-
      Ріжки (Claviceps purpurea) — грибковий патоген, що утворює отруйні склероції у колосках жита.
      Містить алкалоїди, токсичні для людей і тварин. Вміст ріжків у продовольчому зерні обмежений
      законодавчо.
  - q: Яку врожайність дає жито озиме?
    a: >-
      Жито забезпечує врожайність 5–8 т/га (у Чехії); на родючих ґрунтах наближається до пшениці, на
      бідних — є кращим вибором.
