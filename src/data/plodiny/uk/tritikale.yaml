slug: tritikale
name: Тритикале
name_plural: Тритикале
description: >-
  Тритикале — це штучний гібрид пшениці (Triticum) та жита (Secale), який поєднує врожайний
  потенціал пшениці з витривалістю та адаптивністю жита. Вирощується переважно як кормова зернова
  культура, а останніми роками — і як енергетична рослина (GPS, біогаз), особливо вигідна на менш
  родючих ґрунтах.
vysevek: 'норма висіву: 280–380 схожих зерен/м²'
hnojeni: N 100–140 кг/га у розділених дозах; потреби нижчі, ніж у пшениці, але вищі, ніж у жита
vynos_t_ha: 5–8 (у Чехії)
sklizen: збирання врожаю на межі червня та липня (у Чехії)
vyuziti: кормове зерно (для птиці, свиней, великої рогатої худоби), GPS (біогаз), харчові експерименти
choroby:
  - борошниста роса злаків
  - іржі (жовта, стеблова)
  - фузаріоз колоса
  - септоріоз (плямистість листя)
osevni_postup:
  - name: Попередник
    text: >-
      Тритикале невибагливе до попередника — витримує навіть гірше місце у сівозміні, однак бобові
      або просапні культури як попередник є перевагою.
  - name: Підготовка ґрунту
    text: >-
      Оранка на 20–22 см, вирівнювання посівного ложа. Тритикале добре росте на легких і
      середньосуглинкових ґрунтах при pH 5,5–7,0.
  - name: Сівба
    text: Сівба у жовтні (озима форма), глибина загортання 3–5 см, норма висіву 280–380 схожих зерен/м².
  - name: Удобрення
    text: >-
      Азот 100–140 кг/га у розділених дозах (на початку вегетації, у фазі виходу в трубку). Вища
      доза N підвищує врожайність, але збільшує ризик вилягання.
  - name: Захист рослин
    text: >-
      Регулятори росту при ризику вилягання (тритикале має високе стебло), фунгіциди згідно з появою
      хвороб (борошниста роса, іржі, фузаріоз колоса). Використовувати препарати, зареєстровані у
      Державному реєстрі пестицидів і агрохімікатів України.
  - name: Збирання врожаю
    text: >-
      Збирання врожаю на межі червня та липня (у Чехії), при вологості зерна 14–16 %. Тритикале
      швидко достигає і має схильність до осипання зерна.
faq:
  - q: Які переваги тритикале порівняно з пшеницею та житом?
    a: >-
      Тритикале поєднує добру врожайність пшениці з витривалістю жита до несприятливих умов (холод,
      кислі ґрунти, посуха). Підходить для менш родючих ділянок, де пшениця не розкриває свій
      потенціал.
  - q: Для чого використовується тритикале?
    a: >-
      Переважно як кормове зерно для птиці, свиней і великої рогатої худоби. Все частіше вирощується
      на зелений корм (GPS) для виробництва біогазу. Харчове використання — незначне.
  - q: Чи стійке тритикале до морозів?
    a: >-
      Озиме тритикале стійкіше до морозів, ніж озимий ячмінь, але менш стійке, ніж жито. Витримує
      приблизно −18 до −22 °C у фазі кущення за наявності снігового покриву.
