slug: jetel
name: Конюшина лучна
name_plural: Конюшина лучна
description: >-
  Конюшина лучна (Trifolium pratense) є найважливішою кормовою бобовою культурою у Чехії,
  вирощується для зеленого корму, сіна, сенажу та силосу з високим вмістом білка (18–22 % у сухій
  речовині). Біологічно фіксує атмосферний азот і є ключовим елементом сівозміни для підвищення
  родючості ґрунту.
vysevek: 8–14 кг/га (у чистому посіві); 4–8 кг/га у конюшиново-злакових сумішах
hnojeni: >-
  Азот мінімальний (біологічна фіксація); фосфор 40–60 кг P₂O₅/га; калій 80–130 кг K₂O/га;
  вапнування при pH нижче 6,0
vynos_t_ha: 8–14 (суха речовина за весь сезон збирання, 2–3 укоси, у Чехії)
sklizen: 2–3 укоси на рік; перший укіс на початку цвітіння (червень), другий укіс — серпень (у Чехії)
vyuziti: зелений корм, сіно, сенаж, силос, зелене добриво, медоносна культура
choroby:
  - склеротиніозна гниль (Sclerotinia trifoliorum) — зимова гниль
  - антракноз конюшини (Colletotrichum trifolii)
  - вірусна мозаїка конюшини (CMV, TYMV)
  - фітофторозна гниль коренів (Phytophthora cactorum)
osevni_postup:
  - name: Попередник і сівозміна
    text: >-
      Конюшина лучна є відмінним попередником для озимих зернових. Не допускається повторне
      вирощування на одному полі — мінімальна перерва 4–5 років (ризик ґрунтових хвороб і втоми
      ґрунту для конюшини).
  - name: Підготовка ґрунту
    text: >-
      Дрібне посівне ложе з доброю прогріваністю. Конюшина найкраще росте на середньосуглинкових,
      нейтральних ґрунтах з pH 6,0–7,0. Чутлива до кислотності та перезволоження.
  - name: Сівба (під покривну культуру)
    text: >-
      Найчастіше підсів під ярі зернові (овес, ярий ячмінь) навесні. Норма висіву 8–14 кг/га,
      глибина загортання 1–2 см (дуже мілко — дрібне насіння).
  - name: Удобрення
    text: >-
      Фосфор і калій за результатами аналізу ґрунту, вапнування при кислій реакції ґрунту. Азот не
      вноситься (біологічна фіксація), калій — найважливіший елемент живлення.
  - name: Збирання врожаю
    text: >-
      Перший укіс на початку цвітіння (максимальне поєднання врожайності та якості), другий укіс у
      серпні. Після останнього укосу залишати достатній травостій для безпечної перезимівлі.
  - name: Догляд і перезимівля
    text: >-
      Слідкувати за появою склеротиніозної гнилі після зими. Конюшина лучна — дворічна або
      короткотривала багаторічна культура, зазвичай вирощується 1–2 роки.
faq:
  - q: Скільки азоту фіксує конюшина лучна?
    a: >-
      Конюшина лучна може фіксувати 150–250 кг N/га за рік завдяки симбіотичним бактеріям роду
      Rhizobium. Цей показник залежить від стану посіву, ґрунтових умов і погодних факторів.
  - q: Чому конюшину висівають під покривну культуру?
    a: >-
      Підсів під покривну зернову культуру захищає дрібні сходи конюшини від конкуренції з бур'янами
      та сонячного перегріву в перший рік. Зернова культура виконує роль «парасолі», а конюшина
      укорінюється у її затінку.
  - q: Скільки років продуктивний посів конюшини лучної?
    a: >-
      Конюшина лучна — короткотривала багаторічна бобова культура: посів продуктивний 1–2 роки,
      рідше — до 3 років. Після цього густота і врожайність різко знижуються.
  - q: Який урожай сухої речовини дає конюшина?
    a: >-
      За 2–3 укоси конюшина лучна забезпечує 8–14 т сухої речовини/га на рік (у Чехії). На добрих
      ділянках із достатньою кількістю опадів урожайність може перевищувати 14 т/га.
