slug: vojteska
name: Люцерна посівна
name_plural: Люцерна
description: >-
  Люцерна посівна (Medicago sativa) — багаторічна кормова бобова культура з глибокою кореневою
  системою (3–5 м), стійка до посухи та здатна фіксувати 200–300 кг N/га щороку. Забезпечує
  високоякісний корм (сіно, сінаж, гранули) з вмістом білка 18–24 % у сухій речовині та збирається
  3–5 разів на рік.
vysevek: 15–20 кг/га (у чистому посіві); 8–12 кг/га у травосумішах
hnojeni: >-
  Мінімальна потреба в азоті (біологічна фіксація); фосфор 50–70 кг P₂O₅/га; калій 120–200 кг
  K₂O/га; кальцій (вапнування) є ключовим при pH нижче 6,5; бор 1 кг/га
vynos_t_ha: 10–18 (суха речовина за сезон, 3–5 укосів)
sklizen: >-
  3–5 укосів на рік; косіння на початку цвітіння (10 % рослин у фазі цвітіння); у Чехії зазвичай 3–4
  укоси
vyuziti: сіно, сінаж, дегідратовані гранули (найякісніший кормовий білок), зелений корм, медоносна культура
choroby:
  - вертицильозне в’янення (Verticillium albo-atrum)
  - фузаріоз коренів і стебла (Fusarium spp.)
  - несправжня борошниста роса люцерни (Peronospora aestivalis)
  - бактеріальне в’янення (Clavibacter michiganensis subsp. insidiosus)
osevni_postup:
  - name: Попередник і сівозміна
    text: >-
      Люцерну не слід вирощувати на одному полі раніше, ніж через 6–8 років (виснаження ґрунту,
      вертицильоз, фузаріоз). Найкращі попередники — зернові культури.
  - name: Підготовка ґрунту та вапнування
    text: >-
      Глибока оранка (28–30 см) для розвитку кореневої системи. Вапнування до pH 6,5–7,5 є ключовим
      — люцерна дуже чутлива до кислотності. Ретельно підготовлене посівне ложе.
  - name: Сівба
    text: >-
      Сівба рано навесні (лютий–квітень) або влітку після збирання зернових (липень). Глибина
      загортання насіння 1–2 см, норма висіву 15–20 кг/га. Можливий підсів під ярі зернові.
  - name: Удобрення
    text: >-
      Калій і фосфор за результатами аналізу ґрунту — ключові елементи живлення; калій 120–200 кг
      K₂O/га вносять після укосів. Бор 1 кг/га стимулює утворення бульбочок.
  - name: Збирання врожаю
    text: >-
      Косити на початку цвітіння (10–20 % рослин у фазі цвітіння) для оптимального співвідношення
      врожайності та якості. Залишати травостій не нижче 15 см над ґрунтом.
  - name: Догляд за посівом
    text: >-
      Люцерна зберігає продуктивність 4–6 років; після перезимівлі контролювати густоту травостою. У
      разі випадіння рослин — підсівати або змінювати використання площі.
faq:
  - q: Якої глибини сягає коренева система люцерни?
    a: >-
      Люцерна формує стрижневий корінь, який сягає 3–5 м у глибину. Завдяки цьому рослина
      використовує вологу з глибоких шарів ґрунту та значно стійкіша до посухи, ніж культури з
      поверхневою кореневою системою.
  - q: Скільки разів на рік збирають люцерну?
    a: >-
      У Чехії люцерну зазвичай збирають 3–4 рази на рік, у тепліших регіонах можливі до 5 укосів.
      Кожен укіс проводять на початку цвітіння для отримання якісного корму.
  - q: Чому для люцерни так важливе вапнування?
    a: >-
      Люцерна дуже чутлива до кислої реакції ґрунту. При pH нижче 6,0 травостій зріджений,
      бульбочкові бактерії працюють погано, а фіксація азоту знижується. Оптимальний pH — 6,5–7,5.
  - q: Скільки років люцерна зберігає продуктивність на одному полі?
    a: >-
      Добре доглянуті посіви люцерни залишаються продуктивними 4–6 років. Після цього густота
      травостою зменшується, зростає кількість бур’янів і врожайність падає — площу слід оновити
      іншою культурою.
