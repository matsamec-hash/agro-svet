slug: repka-jarni
name: Яра ріпак
name_plural: Яра ріпак
description: >-
  Яра ріпак (Brassica napus var. annua) висівається навесні і не потребує яровизації. Має нижчу
  врожайність, ніж озима форма, але використовується як альтернатива у разі поганої перезимівлі
  озимого ріпаку або як спосіб скорочення сівозміни. Вегетаційний період значно коротший.
vysevek: 60–100 схожих насінин/м² (підвищена норма висіву компенсує коротший період вегетації)
hnojeni: N 80–120 кг/га загалом; сірка 20–30 кг/га
vynos_t_ha: 2–3,5
sklizen: серпень (у Чехії)
vyuziti: рослинна олія, білковий шрот (корм)
choroby:
  - альтернаріозна плямистість (Alternaria spp.)
  - склеротиніозна гниль (Sclerotinia sclerotiorum)
  - борошниста роса хрестоцвітих
osevni_postup:
  - name: Попередник
    text: >-
      Як і для озимого ріпаку, дотримується 4–5-річна сівозміна без хрестоцвітих. Найкращі
      попередники — зернові та зернобобові культури.
  - name: Підготовка ґрунту
    text: >-
      Весняна підготовка посівного ложа якомога раніше після підсушування ґрунту; дрібногрудкувате,
      добре ущільнене посівне ложе для дрібного насіння.
  - name: Сівба
    text: >-
      Якомога раніше навесні (лютий–березень у Чехії), глибина 1–2 см, норма висіву 60–100 схожих
      насінин/м². Пізня сівба суттєво знижує врожайність.
  - name: Удобрення
    text: >-
      N 80–120 кг/га; сірка 20–30 кг/га. Загальна система живлення менш деталізована, ніж у озимої
      форми.
  - name: Захист рослин
    text: >-
      Гербіциди, фунгіциди при появі альтернаріозної плямистості та склеротиніозної гнилі;
      інсектициди при появі ріпакового квіткоїда та стеблових прихованохоботників. Використовувати
      препарати, зареєстровані у Державному реєстрі пестицидів і агрохімікатів України.
  - name: Збирання врожаю
    text: >-
      Збирання врожаю у серпні (у Чехії); яра ріпак швидко достигає і схильна до осипання з стручків
      — контролюйте строки збирання.
faq:
  - q: Коли яру ріпак вирощують замість озимого?
    a: >-
      Яру ріпак висівають у разі випадання або сильного пошкодження озимого ріпаку морозами взимку,
      а також як проміжну культуру при скороченій сівозміні. Врожайність значно нижча, ніж у озимої
      форми.
  - q: Якої врожайності насіння досягає яра ріпак?
    a: >-
      Врожайність становить 2–3,5 т/га (у Чехії), тобто значно менше, ніж у озимої форми (3–5 т/га).
      Ранній строк сівби та достатнє живлення є ключовими для максимального врожаю.
