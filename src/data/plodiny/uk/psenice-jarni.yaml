slug: psenice-jarni
name: Пшениця яра
name_plural: Пшениця яра
description: >-
  Пшениця яра (Triticum aestivum) висівається навесні і збирається на 2–3 тижні раніше, ніж озима.
  Має нижчу врожайність (у Чехії), проте її зерно зазвичай містить більше білка і клейковини, що
  робить її придатною для виробництва харчового борошна з добрими хлібопекарськими властивостями.
vysevek: 350–500 схожих зерен/м²
hnojeni: N 80–130 кг/га; акцент на якісну дозу азоту у фазі виходу в трубку до колосіння
vynos_t_ha: 4–6 (у Чехії)
sklizen: липень (у Чехії)
vyuziti: харчове борошно (хліб, випічка), кормове зерно
choroby:
  - септоріоз листя пшениці
  - борошниста роса злаків
  - іржі
  - фузаріоз колоса
osevni_postup:
  - name: Попередник
    text: >-
      Яра пшениця менш вибаглива до попередника, ніж озима; придатні попередники — зернобобові,
      ріпак або просапні культури.
  - name: Підготовка ґрунту
    text: >-
      Осіння оранка або весняний обробіток одразу після підсихання ґрунту; дрібне посівне ложе для
      рівномірних сходів.
  - name: Сівба
    text: >-
      Сівба якомога раніше навесні (лютий–березень у Чехії), глибина загортання 3–4 см, норма висіву
      350–500 схожих зерен/м².
  - name: Удобрення
    text: Азот 80–130 кг/га; якісна доза у фазі виходу в трубку сприяє підвищенню вмісту білка у зерні.
  - name: Захист рослин
    text: >-
      Протруєння насіння, фунгіцидні обробки за появи хвороб (борошниста роса, септоріоз, фузаріоз
      колоса) відповідно до порогу шкідливості. Використовувати препарати, зареєстровані у
      Державному реєстрі пестицидів і агрохімікатів України.
  - name: Збирання врожаю
    text: >-
      Збирання у липні (у Чехії) при вологості зерна 13–15 %; для харчових сортів контролювати також
      якісні показники (тест Зелені, число падіння).
faq:
  - q: Чим відрізняється яра пшениця від озимої?
    a: >-
      Яра пшениця висівається навесні і не потребує яровизації. Має нижчу врожайність зерна (у
      Чехії), але зазвичай вищий вміст білка і клейковини, що підходить для хлібопекарської
      промисловості.
  - q: Яку норму висіву обирають для ярої пшениці?
    a: >-
      Рекомендується норма висіву 350–500 схожих зерен/м². Вища норма компенсує коротший
      вегетаційний період і меншу кущистість при весняній сівбі.
  - q: Коли сіяти яру пшеницю?
    a: >-
      Сівбу слід проводити якомога раніше після підсихання ґрунту, оптимально — лютий–березень (у
      Чехії). Запізнення із сівбою знижує врожайність і якість зерна.
