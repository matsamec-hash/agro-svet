slug: kukurice
name: Кукурудза звичайна
name_plural: Кукурудза
description: >-
  Кукурудза звичайна (Zea mays) — теплолюбна однорічна культура з найвищим потенціалом урожайності
  серед усіх польових культур у Чехії. Вирощується на зерно, силос (весь посів) і як енергетична
  культура для біогазу. Вимагає теплих умов, достатнього забезпечення водою та поживними речовинами.
vysevek: 7–10 рослин/м² (65–95 тис. рослин/га), залежно від стиглості сорту та умов вирощування
hnojeni: >-
  N 120–200 кг/га загалом (стартова доза при сівбі + основне удобрення); P, K і Mg згідно з аналізом
  ґрунту; кукурудза чутлива до дефіциту цинку
vynos_t_ha: 8–14 (зерно); 40–60 т/га сирої маси силосу
sklizen: вересень–жовтень (зерно при вологості <30 %; силос при 30–35 % сухої речовини) у Чехії
vyuziti: >-
  силосна кукурудза (корм для великої рогатої худоби), кукурудза на зерно (корм, крохмаль,
  біоетанол, продукти харчування)
choroby:
  - фузаріоз стебла і качанів (Fusarium spp.)
  - гельмінтоспоріоз кукурудзи
  - карликовість кукурудзи (WDV і MDV, переноситься комахами)
  - бактеріоз кукурудзи
osevni_postup:
  - name: Попередник і сівозміна
    text: >-
      Найкращими попередниками є зернобобові, зернові культури та ріпак. Кукурудза витримує повторне
      вирощування на одному полі, але при монокультурі зростає ризик фузаріозу та ґрунтових
      шкідників.
  - name: Підготовка ґрунту
    text: >-
      Глибока осіння оранка (25–30 см) для аерації, весняна підготовка посівного ложа. Кукурудза
      потребує добре прогрітий ґрунт (не менше 8–10 °C на глибині сівби).
  - name: Сівба
    text: >-
      Сівба з кінця квітня до середини травня у Чехії. Глибина 4–6 см, норма висіву 7–10 рослин/м²
      (залежно від стиглості). Міжряддя 70–75 см (традиційно) або 45–50 см (ущільнені рядки).
  - name: Удобрення
    text: >-
      Стартова доза P+K+N при сівбі, основне внесення N (дигестат, гній або мінеральні добрива) до
      або під час підготовки ґрунту. Контролювати забезпеченість цинком.
  - name: Захист рослин
    text: >-
      Гербіциди (до сходів або після сходів) є необхідними. Інсектицидне протруєння насіння захищає
      від дротяників і попелиць; моніторинг стеблового метелика кукурудзи.
  - name: Збирання врожаю
    text: >-
      Силос при вмісті сухої речовини 30–35 % (орієнтовно серпень–вересень), зерно при вологості
      нижче 30 % (жовтень) у Чехії. При вологості зерна понад 14–15 % необхідно досушування.
faq:
  - q: Коли найкраще сіяти кукурудзу?
    a: >-
      Кукурудзу висівають з кінця квітня до середини травня у Чехії, коли температура ґрунту на
      глибині сівби досягає щонайменше 8–10 °C. Надто ранній висів у холодний ґрунт уповільнює сходи
      та підвищує ризик хвороб.
  - q: Яка різниця між силосною та зерновою кукурудзою?
    a: >-
      Силосна кукурудза збирається весь посів (стебло + качан) при 30–35 % сухої речовини як корм
      для великої рогатої худоби. Зернова кукурудза збирається лише зерно при вологості менше 30 %,
      призначена для годівлі або промислової переробки.
  - q: Яка потреба кукурудзи в азоті?
    a: >-
      Кукурудза — вимоглива культура, їй потрібно 120–200 кг N/га загалом. Частину азоту зазвичай
      вносять органічними добривами (дигестат, гній), решту — мінеральними добривами.
  - q: Яких шкідників слід контролювати на кукурудзі?
    a: >-
      Основні — дротяники (личинки у ґрунті), стебловий метелик кукурудзи (Ostrinia nubilalis) та
      попелиці. Стеблового метелика можна моніторити феромонними пастками й біологічно контролювати
      (Trichogramma).
