# Ukrajinský overlay plodin. slug, skupina, hero_*, seti_mesice, sklizen_mesice
# a wikipedia zůstávají z cs (klíče, obrázky, kalendář). Pole choroby[] drží
# STEJNÉ pořadí i délku jako cs — mapování na entitu jde přes cs index.
# Termíny setí a sklizně jsou ČESKÉ a text to říká nahlas („у Чехії").
slug: oves
name: Вівсяниця посівна
name_plural: Вівес
description: >-
  Вівсяниця посівна (Avena sativa) — яра зернова культура, яку вирощують як на зерно, так і на
  зелений корм. Добре переносить прохолодні та вологі райони, має низькі вимоги до попередника.
  Використовується у харчуванні людей (пластівці, каші), у тваринництві, а також як зелена біомаса
  (GPS).
vysevek: 350–450 схожих зерен/м²
hnojeni: N 60–90 кг/га залежно від попередника та місця вирощування
vynos_t_ha: 4–6
sklizen: кінець липня – серпень (у Чехії)
vyuziti: кормове зерно, вівсяні пластівці, зелений корм, GPS
choroby:
  - борошниста роса злакових
  - іржі (корончаста, стеблова)
  - пухирчаста сажка вівса
  - крауроз вівса
osevni_postup:
  - name: Вибір ділянки
    text: >-
      Вівес невибагливий до попередника, підходить після просапних культур і після зернових. Добре
      росте у прохолодних і вологих районах.
  - name: Підготовка ґрунту
    text: >-
      Середньоглибока оранка або мінімальний обробіток, вирівнювання посівного ложа перед весняною
      сівбою.
  - name: Сівба
    text: >-
      Весняна сівба якомога раніше після підсихання ґрунту, глибина загортання 3–4 см, норма висіву
      350–450 зерен/м².
  - name: Удобрення
    text: >-
      Азот 60–90 кг/га залежно від потенціалу врожайності ділянки та попередника; фосфор і калій —
      за результатами аналізу ґрунту.
  - name: Захист рослин
    text: >-
      Захист від борошнистої роси та іржі за порогом шкідливості; протруєння насіння захищає від
      пухирчастої сажки вівса.
  - name: Збирання врожаю
    text: >-
      Збирання при повній стиглості зерна, вологість нижче 15 %, уникати втрат через осипання при
      перестої.
faq:
  - q: Яка норма висіву вівса?
    a: >-
      Рекомендована норма висіву вівса — 350–450 схожих зерен на м², залежно від ділянки та строку
      сівби.
  - q: Після якого попередника вирощувати вівес?
    a: >-
      Вівес має низькі вимоги до попередника, добре росте після просапних культур і після інших
      зернових.
  - q: У яких районах найкраще вирощувати вівес?
    a: >-
      Вівес добре росте у прохолодних і вологих районах, де інші зернові менш урожайні. Сухі та
      теплі низини є невідповідними.
  - q: Який урожай зерна можна очікувати від вівса?
    a: >-
      За належного агротехнічного догляду вівес дає урожай 4–6 т/га зерна (у Чехії). На сприятливих
      ділянках можливі й вищі врожаї.
