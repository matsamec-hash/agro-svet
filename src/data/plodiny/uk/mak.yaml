slug: mak
name: Мак сіяний
name_plural: Мак
description: >-
  Мак сіяний (Papaver somniferum) — традиційна чеська олійна та пряна культура, насіння якої містить
  40–50 % жиру і є типовим інгредієнтом чеської кухні (пироги, різдвяна випічка, булочки). Чеська
  Республіка входить до числа найбільших виробників і експортерів макового насіння у світі.
  Вирощування макових головок суворо регулюється законодавством.
vysevek: 0,4–0,8 кг/га (дуже дрібне насіння, цільова густота 50–80 рослин/м²)
hnojeni: >-
  N 60–100 кг/га; чутливий до хлоридних добрив (використовувати сульфати); P і K згідно з аналізом
  ґрунту
vynos_t_ha: 0,8–1,5
sklizen: липень–серпень (стулки дозрілі, насіння сухе) — у Чехії
vyuziti: >-
  харчове макове насіння (випічка, кондитерська промисловість), макова олія, фармацевтичні алкалоїди
  (морфін)
choroby:
  - макова несправжня борошниста роса (Peronospora arborescens)
  - бактеріальна плямистість (Xanthomonas campestris)
  - фузаріоз коренів і стебла
  - вірусна мозаїка маку (TuMV)
osevni_postup:
  - name: Попередник і сівозміна
    text: >-
      Мак не можна повертати на те саме поле раніше, ніж через 5–6 років. Найкращі попередники —
      зернові культури; виключити бобові та капустяні (через ризик перенесення хвороб).
  - name: Підготовка ґрунту
    text: >-
      Дуже дрібне і вирівняне посівне ложе — мак має дрібне насіння і чутливі проростки. Оранка на
      глибину 20–22 см, ретельна весняна підготовка.
  - name: Сівба
    text: >-
      Сівба якомога раніше навесні (лютий–березень у Чехії), глибина лише 0,5–1,5 см (!), норма
      висіву 0,4–0,8 кг/га. Мак проростає лише за температури понад 2 °C.
  - name: Удобрення
    text: >-
      N 60–100 кг/га, P і K згідно з аналізом; хлоридні добрива непридатні. Азот вносити до сівби
      або у фазі розетки.
  - name: Захист рослин
    text: >-
      Гербіциди (до- та післясходово), фунгіциди при появі макової несправжньої борошнистої роси,
      інсектициди при появі попелиці макової або галиці.
  - name: Збирання врожаю
    text: >-
      Збирання у липні–серпні (у Чехії) при повному дозріванні стулок — коли вони сухі, а насіння
      при струшуванні шелестить. Перестиглі стулки розкриваються, що призводить до втрат.
faq:
  - q: Чому глибина сівби маку така мала?
    a: >-
      Мак має дуже дрібне насіння — воно настільки мале, що при глибокій сівбі не може прорости і
      вийти на поверхню. Оптимальна глибина сівби — 0,5–1,5 см.
  - q: Які законодавчі обмеження існують для вирощування маку у Чехії?
    a: >-
      Виробники маку зобов’язані щорічно повідомляти про посіви Митній службі Чеської Республіки та
      дотримуватися мінімальної відстані посівів від житлових будівель. Вміст морфіну у рослинах
      контролюється.
  - q: Якої врожайності макового насіння можна очікувати?
    a: >-
      Середня врожайність становить 0,8–1,3 т/га, у сприятливий рік на доброму полі — до 1,5 т/га (у
      Чехії). Мак — культура з нестабільною врожайністю, чутлива до дефіциту вологи.
