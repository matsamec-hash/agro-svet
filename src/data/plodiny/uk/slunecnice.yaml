slug: slunecnice
name: Соняшник однорічний
name_plural: Соняшник
description: >-
  Соняшник однорічний (Helianthus annuus) — теплолюбна олійна культура, яку вирощують заради насіння
  з високим вмістом олії (45–55 %). Цікава як культура для розриву зернових сівозмін, медоносна
  рослина, а останніми роками також як біоенергетична культура. Вимагає теплого та сонячного
  клімату.
vysevek: 5–8 рослин/м² (50–80 тис. рослин/га)
hnojeni: N 80–120 кг/га; P і K згідно з аналізом ґрунту; соняшник вимогливий до калію та бору
vynos_t_ha: 2,5–4
sklizen: вересень–жовтень (при вологості насіння <12 %) — у Чехії
vyuziti: харчова соняшникова олія, кормові шроти, медоносна рослина, корм для птахів
choroby:
  - склеротиніозна гниль (Sclerotinia sclerotiorum) — найнебезпечніша
  - несправжня борошниста роса соняшнику (Plasmopara halstedii)
  - альтернаріозна плямистість
  - фомопсисна гниль стебла (Diaporthe helianthi)
osevni_postup:
  - name: Попередник і сівозміна
    text: >-
      Соняшник є відмінним попередником для зернових культур. Сам потребує 4–5-річної перерви після
      соняшнику та інших господарів склеротиніозної гнилі (ріпак, горох).
  - name: Підготовка ґрунту
    text: >-
      Глибока осіння оранка (25–30 см), весняна підготовка посівного ложа. Соняшник добре росте на
      глибоких, добре аерованих ґрунтах.
  - name: Сівба
    text: >-
      Сівба з кінця квітня до середини травня, коли температура ґрунту досягає 8–10 °C. Глибина
      загортання 4–6 см, норма висіву 5–8 рослин/м².
  - name: Удобрення
    text: >-
      N 80–120 кг/га, вноситься перед сівбою або під час підготовки ґрунту. Соняшник вимогливий до K
      і B — контролювати забезпеченість цими елементами.
  - name: Захист рослин
    text: >-
      Гербіциди (до- або післясходові). Склеротиніоз — фунгіциди у фазу цвітіння; несправжня
      борошниста роса — сортова стійкість + протруєння насіння. Застосовувати препарати згідно з
      Державним реєстром пестицидів і агрохімікатів України.
  - name: Збирання врожаю
    text: >-
      Збирання у вересні–жовтні, при вологості насіння нижче 12 % — у Чехії. За вищої вологості
      необхідно досушувати. Кошики соняшнику збирають спеціальним адаптером.
faq:
  - q: Якої врожайності насіння соняшнику можна очікувати?
    a: >-
      Середня врожайність насіння у Чехії становить 2,5–3,5 т/га. За сприятливих умов і хорошої
      агротехніки можна досягти 4 т/га.
  - q: Чому склеротиніозна гниль така небезпечна для соняшнику?
    a: >-
      Sclerotinia sclerotiorum уражає стебло та кошик соняшнику й може призвести до повної загибелі
      посіву. Склероції зберігаються у ґрунті десятки років, тому критично важливо дотримуватися
      тривалої сівозміни (4–5 років без чутливих культур).
  - q: Чи є соняшник добрим попередником?
    a: >-
      Так, соняшник — чудова культура для розриву зернових сівозмін. Залишає глибоко розпушений
      ґрунт і сприяє руйнуванню монокультури зернових.
