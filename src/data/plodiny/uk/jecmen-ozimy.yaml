slug: jecmen-ozimy
name: Озимий ячмінь
name_plural: Озимий ячмінь
description: >-
  Озимий ячмінь (Hordeum vulgare) — це озима зернова культура з найкоротшим періодом вегетації серед
  озимих злаків: його збирають на 1–2 тижні раніше, ніж пшеницю (у Чехії). Менш стійкий до зимових
  морозів, але забезпечує високі врожаї та використовується переважно як кормова культура і сировина
  для солодової промисловості.
vysevek: 'норма висіву: 280–380 схожих зерен/м²'
hnojeni: азот (N) 100–150 кг/га у розділених дозах; фосфор і калій — за результатами аналізу ґрунту
vynos_t_ha: 6–9
sklizen: кінець червня — початок липня (у Чехії)
vyuziti: кормове зерно, солодовий ячмінь (виробництво солоду та пива), зелена маса на силос (GPS)
choroby:
  - буре листкове плямистість ячменю (ринхоспоріоз)
  - смугастість ячменю (піренофора)
  - борошниста роса злаків
  - іржі
  - жовта мозаїка ячменю (BaYMV/BaMMV, переносник — ґрунтовий гриб)
osevni_postup:
  - name: Попередник
    text: >-
      Найкращими попередниками є ріпак, зернобобові та просапні культури. Після зернових
      підвищується ризик хвороб і вірусів, що передаються ґрунтовими грибами.
  - name: Підготовка ґрунту
    text: >-
      Мілке орання на глибину 18–22 см, вирівнювання посівного ложа; озимий ячмінь чутливий до
      ущільнення та невідповідного pH (оптимум 6,0–7,0).
  - name: Сівба
    text: >-
      Оптимальний строк сівби у Чехії: 20 вересня – 10 жовтня. Глибина загортання 3–4 см, норма
      висіву 280–380 схожих зерен/м².
  - name: Удобрення азотом
    text: >-
      Азот вноситься у розділених дозах: стартова доза навесні та друга доза у фазі виходу в трубку.
      Надлишок азоту підвищує ризик вилягання.
  - name: Захист рослин
    text: >-
      Протруєння насіння (проти смугастості, бурої плямистості), застосування регуляторів росту при
      ризику вилягання, фунгіциди — за наявності хвороб (відповідно до Державного реєстру пестицидів
      і агрохімікатів України).
  - name: Збирання врожаю
    text: >-
      Ячмінь достигає швидко і схильний до осипання зерна — збирання слід проводити вчасно, при
      вологості 13–15 %.
faq:
  - q: Чому озимий ячмінь збирають раніше, ніж озиму пшеницю?
    a: >-
      Озимий ячмінь має коротший період вегетації і достигає приблизно на 1–2 тижні раніше, ніж
      пшениця (у Чехії). Це дозволяє раніше розпочати збирання врожаю та зменшує ризик втрат.
  - q: Яка мінімальна морозостійкість озимого ячменю?
    a: >-
      Озимий ячмінь належить до менш морозостійких озимих злаків — витримує приблизно −12 до −15 °C
      у фазі кущення (без снігового покриву).
  - q: Чи можна вирощувати озимий ячмінь для солодової промисловості?
    a: >-
      Так, існують солодові сорти озимого ячменю. Для досягнення солодових параметрів (вміст білка,
      схожість) необхідно дотримуватися спеціальних агротехнічних заходів, зокрема обмежити азотне
      живлення.
