slug: soja
name: Соя культурна
name_plural: Соя
description: >-
  Соя культурна (Glycine max) — теплолюбна зернобобова культура з найвищим вмістом білка (35–45 %)
  та олії (18–22 %) серед усіх польових культур. У Чехії вирощування сої поширюється завдяки
  селекції короткоденних сортів і потеплінню клімату; є відмінною попередньою культурою та джерелом
  азоту для ґрунту.
vysevek: 60–80 схожих насінин/м² (550 000–700 000 рослин/га)
hnojeni: >-
  Азот — мінімально (біологічна фіксація); фосфор 40–60 кг P₂O₅/га; калій 80–120 кг K₂O/га; молібден
  і кобальт для функціонування бульбочкових бактерій
vynos_t_ha: 2–4
sklizen: вересень–жовтень (за вологості насіння <14 %, у Чехії)
vyuziti: кормовий шрот (білковий корм), харчова соєва олія, тофу, соєве молоко, технічне використання
choroby:
  - фузаріоз стебла і коренів (Fusarium spp.)
  - склеротиніозна гниль (Sclerotinia sclerotiorum)
  - пероноспороз сої (Peronospora manshurica)
  - бактеріальна пустульоз (Pseudomonas savastanoi pv. glycinea)
osevni_postup:
  - name: Попередник і сівозміна
    text: >-
      Соя є відмінною попередньою культурою для зернових. Не допускається вирощування після інших
      зернобобових — мінімальна перерва 4 роки.
  - name: Підготовка ґрунту
    text: >-
      Глибока осіння оранка або весняна підготовка. Соя добре росте на середньосуглинкових, добре
      дренованих і прогрітих ґрунтах з pH 6,0–7,0.
  - name: Інокуляція насіння
    text: >-
      Інокуляція насіння специфічними культурами Bradyrhizobium japonicum є обов’язковою — без
      ефективної фіксації неможливо отримати добрий урожай без азотного удобрення.
  - name: Сівба
    text: >-
      Сівба з кінця квітня до середини травня, коли температура ґрунту досягає щонайменше 10 °C.
      Глибина загортання 3–5 см, норма висіву 60–80 схожих насінин/м².
  - name: Захист рослин
    text: >-
      Гербіциди є ключовими — соя погано переносить конкуренцію з боку бур’янів у молодому віці.
      Фунгіциди та інсектициди застосовують за наявності хвороб і шкідників (відповідно до
      Державного реєстру пестицидів і агрохімікатів України).
  - name: Збирання врожаю
    text: >-
      Збирання у вересні–жовтні (у Чехії) при вологості насіння нижче 14 %. Соя має низько
      розташовані боби — необхідно правильно налаштувати висоту жатки.
faq:
  - q: Чому інокуляція сої така важлива?
    a: >-
      Соя засвоює атмосферний азот за допомогою специфічних бактерій Bradyrhizobium japonicum. Ці
      бактерії природно відсутні у ґрунтах Чехії (оскільки соя тут нова культура), тому інокуляція
      насіння є обов’язковою для утворення ефективних бульбочок і біологічної фіксації азоту.
  - q: Якої врожайності сої можна досягти у Чехії?
    a: >-
      Середня врожайність у Чехії становить 2,5–3,5 т/га. На добре прогрітих і родючих ділянках за
      сприятливих погодних умов можна отримати 4 т/га. Соя чутлива до посухи під час цвітіння та
      формування бобів.
  - q: Чи можна вирощувати сою по всій території Чехії?
    a: >-
      Соя потребує теплого клімату — підходять теплі низинні райони Південної Моравії та Середньої
      Чехії. У холодніших регіонах (вище 350–400 м над рівнем моря) вирощування ризиковане через
      коротший вегетаційний період.
