slug: repka-ozima
name: Озимий ріпак
name_plural: Озимий ріпак
description: >-
  Озимий ріпак (Brassica napus) — найважливіша олійна культура у Чехії, яку вирощують для отримання
  олії з низьким вмістом ерукової кислоти (харчова та технічна олія, біодизель) і білкових шротів.
  Висівається наприкінці літа, після перезимівлі формує густі посіви, які збирають у червні–липні (у
  Чехії).
vysevek: 40–60 схожих насінин/м² (цільова густота 30–50 рослин/м² після перезимівлі)
hnojeni: >-
  N 150–200 кг/га загалом — осіння стартова доза сірки та частини азоту, весняні розділені дози
  азоту + сірка 30–40 кг/га
vynos_t_ha: 3–5
sklizen: червень–липень (за вологості насіння <9 %, у Чехії)
vyuziti: рослинна олія (харчова, біодизель), білковий шрот (корм), мед (медоносна культура)
choroby:
  - фомоз стебла (Leptosphaeria maculans)
  - склеротиніозна гниль (Sclerotinia sclerotiorum)
  - альтернаріозна плямистість
  - сіра гниль (Botrytis cinerea)
  - чорна плямистість ріпаку (Alternaria brassicae)
osevni_postup:
  - name: Попередник
    text: >-
      Озимий ріпак не можна повертати на те саме поле раніше, ніж через 4 роки. Найкращі попередники
      — озимі зернові культури. Виключити попередники з родини капустяних.
  - name: Підготовка ґрунту та сівба
    text: >-
      Рання збиральна кампанія попередника і швидка підготовка якісного посівного ложа на глибину
      2–3 см. Сівба 15 серпня – 5 вересня (у Чехії), норма висіву 40–60 схожих насінин/м².
  - name: Осіннє удобрення
    text: >-
      Перед сівбою або під час сівби внести фосфор, калій і сірку; стартова доза азоту (30–40 кг/га)
      стимулює розвиток до перезимівлі. Посіви входять у зиму у фазі розетки.
  - name: Весняне удобрення
    text: >-
      Основне азотне живлення навесні у 2–3 прийоми (загалом 120–160 кг N/га). Сірка 30–40 кг/га
      підвищує врожайність і вміст олії.
  - name: Захист рослин
    text: >-
      Фунгіциди (фомоз, склеротиніозна гниль), інсектициди (галиця, стеблові прихованохоботники,
      ріпаковий квіткоїд), гербіциди — осінь + весна. Використовувати засоби, зареєстровані у
      Державному реєстрі пестицидів і агрохімікатів України.
  - name: Збирання врожаю
    text: >-
      Збирання прямим комбайнуванням або з підсушуванням. При прямому збиранні чекати вологості
      насіння нижче 9 %. Втрати з насіннєвих стручків мінімізувати правильним налаштуванням
      комбайна.
faq:
  - q: Коли висівають озимий ріпак?
    a: >-
      Оптимальний строк сівби у Чехії: 15 серпня – 5 вересня. Пізня сівба послаблює рослини перед
      зимою і знижує перезимівлю та врожайність.
  - q: Чому сірка важлива для ріпаку?
    a: >-
      Сірка необхідна для синтезу амінокислот і глюкозинолатів. Її нестача знижує врожайність і
      вміст олії. Рекомендовано 30–40 кг S/га, найкраще у вигляді сульфату.
  - q: Якою має бути сівозміна для ріпаку?
    a: >-
      Ріпак та інші капустяні культури не можна повертати на те саме поле раніше, ніж через 4 роки,
      оптимально — через 5–6 років, щоб уникнути накопичення патогенів (фомоз, склеротиніозна гниль)
      і шкідників.
  - q: Якої врожайності досягає озимий ріпак?
    a: >-
      Середня врожайність у Чехії: 3–4 т/га, за сприятливих умов і якісної агротехніки можна
      отримати 4–5 т/га.
