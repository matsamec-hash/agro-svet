slug: brambory
name: Картопля
name_plural: Картопля
description: >-
  Картопля (Solanum tuberosum) є однією з найважливіших продовольчих культур світу та історично
  ключовою коренеплідною культурою у Чехії. Вирощується для споживчих бульб, виробництва крохмалю та
  на кормові цілі. Вимагає якісних, добре дренованих ґрунтів, а схильність до хвороб висуває високі
  вимоги до захисту рослин.
vysevek: 35 000–45 000 бульб/га (відстань у рядку 30–35 см, міжряддя 70–75 см)
hnojeni: >-
  N 100–160 кг/га залежно від напряму використання (споживчі чи крохмальні); K 150–250 кг K₂O/га; P
  за результатами аналізу ґрунту; органічні добрива бажані
vynos_t_ha: 25–40 (споживчі та промислові сорти, у Чехії)
sklizen: серпень–жовтень (залежно від ранньостиглості сорту, у Чехії)
vyuziti: споживчі бульби, виробництво крохмалю, корм, виробництво спирту та чипсів
choroby:
  - фітофтороз картоплі (Phytophthora infestans) — найнебезпечніший
  - Alternaria solani (бура плямистість листя)
  - вірусні хвороби (мозаїки, скручування листя, Y-вірус)
  - Rhizoctonia solani (парша бульб та стебел)
  - парша бульб (Streptomyces scabies)
osevni_postup:
  - name: Попередник
    text: >-
      Картопля потребує тривалої сівозміни (мінімум 3–4 роки без пасльонових). Найкращі попередники
      — зернові, кукурудза та зернобобові.
  - name: Підготовка ґрунту та удобрення
    text: >-
      Глибока осіння оранка (28–30 см), внесення органіки (гній 20–30 т/га). Весняна підготовка
      гребенів або вирівняне посівне ложе.
  - name: Підготовка садивного матеріалу та висаджування
    text: >-
      Сертифікований, вірусологічно перевірений садивний матеріал (мінімум клас E або A).
      Висаджування з квітня, глибина 8–12 см, норма висаджування 35 000–45 000 шт./га.
  - name: Удобрення
    text: >-
      N залежно від напряму використання (споживчі 100–130 кг N/га, крохмальні 120–160 кг N/га),
      висока доза калію покращує формування та якість бульб.
  - name: Захист рослин
    text: >-
      Фітофтороз картоплі — фунгіциди профілактично за сигналізацією, кожні 7–14 днів. Гербіциди —
      до сходів. Інсектициди — при появі колорадського жука.
  - name: Збирання врожаю
    text: >-
      Десикація бадилля та збирання при затверділій шкірці (шкірка не пошкоджується при натисканні
      пальцем). Залежно від ранньостиглості сорту — липень–жовтень у Чехії; дбайлива обробка
      мінімізує утворення тискових плям.
faq:
  - q: Чому фітофтороз картоплі такий небезпечний?
    a: >-
      Phytophthora infestans може за кілька днів знищити весь посів за вологої та теплої погоди. Це
      той самий патоген, що спричинив ірландський голод у XIX столітті. Профілактичне фунгіцидне
      оброблення є обов’язковим за сприятливих умов.
  - q: Як визначити, що картопля готова до збирання?
    a: >-
      Картопля стигла, коли бадилля природно жовтіє та відмирає, а шкірка бульб затверділа — її не
      можна легко зняти пальцем. Ранні сорти можна збирати раніше (молода картопля).
  - q: Яке значення має сертифікований садивний матеріал?
    a: >-
      Сертифікований садивний матеріал гарантує низький рівень вірусних хвороб (Y-вірус, скручування
      листя, мозаїки), які поширюються з садивним матеріалом і суттєво знижують урожайність та
      якість.
  - q: Яка типова врожайність картоплі?
    a: >-
      Споживчі та промислові сорти картоплі дають 25–40 т/га бульб у Чехії. Ранні сорти, які
      збирають раніше, мають нижчу врожайність (15–25 т/га у Чехії).
