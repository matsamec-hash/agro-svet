slug: cukrovka
name: Цукровий буряк
name_plural: Цукрові буряки
description: >-
  Цукровий буряк (Beta vulgaris var. saccharifera) — найважливіша цукроносна культура помірного
  клімату, яку вирощують заради коренеплоду з вмістом цукру 16–20 %. Переробляється виключно на
  цукрових заводах на цукор (сахарозу), побічні продукти (меласа, жом) використовують у
  кормовиробництві та для виробництва біогазу.
vysevek: 1–1,2 норми польової схожості на 9–10 рослин/м² (точний висів моногерменними сортами)
hnojeni: >-
  N 120–160 кг/га залежно від забезпеченості ґрунту; K 180–250 кг K₂O/га; Na 50–100 кг/га (натрій
  підвищує урожайність цукру); бор 0,5–1 кг/га
vynos_t_ha: 60–80 (коренеплоди); цукристість 16–20 % (у Чехії)
sklizen: вересень–листопад (кампанійний прийом на цукровий завод; у Чехії)
vyuziti: виробництво цукру (сахароза), меласа (корм, сировина для бродіння), жом (корм, біогаз)
choroby:
  - церкоспоріоз буряків (Cercospora beticola) — найпоширеніший
  - сіра гниль (Botrytis cinerea)
  - ризоктоніозна гниль коренів (Rhizoctonia solani)
  - вірусні захворювання (Жовтяниця буряків — Beet yellows virus, переноситься попелицями)
  - борошниста роса (Erysiphe betae)
osevni_postup:
  - name: Попередник і сівозміна
    text: >-
      Цукрові буряки не можна вирощувати повторно — мінімальна перерва 3 роки (оптимально 4).
      Найкращі попередники — зернові (особливо пшениця після зернобобових або ріпаку).
  - name: Підготовка ґрунту
    text: >-
      Глибока осіння оранка на 28–30 см, за необхідності вапнування для підтримання pH 6,5–7,5.
      Весняна підготовка — дрібне посівне ложе без грудок.
  - name: Сівба
    text: >-
      Точна сівба моногерменним насінням з березня по квітень, глибина 2–3 см, відстань у рядку
      18–22 см, міжряддя 45–50 см (у Чехії).
  - name: Удобрення
    text: >-
      Органічні добрива бажані; мінеральний азот у дозі 120–160 кг/га, висока доза калію та натрію.
      Бор 0,5–1 кг/га позакореневим підживленням.
  - name: Захист рослин
    text: >-
      Гербіциди (досходові + післясходові у фазі BBCH 12–18), фунгіциди при появі церкоспоріозу,
      інсектициди при появі попелиць і блішок. Застосування препаратів згідно з Державним реєстром
      пестицидів і агрохімікатів України.
  - name: Збирання врожаю
    text: >-
      Кампанійне збирання згідно з договірними строками постачання на цукровий завод
      (вересень–листопад у Чехії). Дбайливе поводження мінімізує механічні втрати цукру.
faq:
  - q: Яка врожайність цукрових буряків?
    a: >-
      Цукрові буряки дають врожайність коренеплодів 60–80 т/га з цукристістю 16–20 %. Урожай цукру
      становить приблизно 10–14 т/га (у Чехії).
  - q: Чому натрій важливий для цукрових буряків?
    a: >-
      Натрій (Na) частково заміщує калій у метаболізмі цукрових буряків і сприяє накопиченню цукру в
      коренеплоді. Внесення 50–100 кг Na/га є доцільним, особливо на легких ґрунтах.
  - q: Що таке церкоспоріоз і як його розпізнати?
    a: >-
      Церкоспоріоз (Cercospora beticola) — грибкова хвороба, що викликає круглі плями з
      червонувато-коричневою облямівкою на листках. Сильне ураження призводить до передчасного
      відмирання листя, зниження врожайності та цукристості.
  - q: Як використовують побічні продукти цукрових буряків?
    a: >-
      Меласа (залишок після екстракції цукру) використовується як корм або субстрат для ферментації
      (дріжджі, спирт). Жом (відпресована м’якоть) слугує кормом для великої рогатої худоби або
      субстратом для біогазу.
