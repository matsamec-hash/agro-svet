slug: hrach
name: Польовий горох
name_plural: Горох
description: >-
  Польовий горох (Pisum sativum) є найпоширенішою зернобобовою культурою у Чехії, цінується
  насамперед як попередник для озимих зернових культур. Завдяки фіксації атмосферного азоту у
  симбіозі з бактеріями роду Rhizobium покращує родючість ґрунту та знижує потребу в азотному
  удобренні наступної культури. Насіння є багатим джерелом білка (22–28 %).
vysevek: 80–110 схожих насінин/м²
hnojeni: >-
  N 0–30 кг/га (лише стартова доза — рослина фіксує атмосферний азот); P і K за результатами аналізу
  ґрунту; молібден для кращої роботи бульбочкових бактерій
vynos_t_ha: 3–5
sklizen: липень (за вологості насіння <14 %) у Чехії
vyuziti: >-
  кормове зерно (білковий корм), харчова промисловість (лущений горох, консервований), сидерація
  (зелене удобрення)
choroby:
  - аскохітоз гороху (Ascochyta pisi)
  - фузаріоз коренів і стебла (Fusarium spp.)
  - несправжня борошниста роса гороху (Peronospora viciae)
  - вірусна мозаїка гороху (PSbMV, переноситься попелицями)
osevni_postup:
  - name: Попередник і сівозміна
    text: >-
      Горох не можна висівати після інших зернобобових — мінімальна перерва 4–5 років. Найкращі
      попередники — озимі зернові культури. Сам горох є відмінним попередником для озимої пшениці.
  - name: Підготовка ґрунту
    text: >-
      Оранка на глибину 20–22 см або мінімальний обробіток; горох добре росте на
      середньосуглинкових, добре дренованих ґрунтах з pH 6,0–7,5. Чутливий до кислотності та
      перезволоження.
  - name: Сівба
    text: >-
      Яра сівба якомога раніше (лютий–березень у Чехії), глибина загортання 4–6 см, норма висіву
      80–110 схожих насінин/м². Горох витримує легкі заморозки — ранній посів є перевагою.
  - name: Інокуляція та удобрення
    text: >-
      Інокуляція насіння бульбочковими бактеріями Rhizobium leguminosarum доцільна на полях, де
      раніше не вирощували зернобобові. Азотне удобрення мінімальне (стартова доза 0–30 кг/га),
      фосфор і калій — за результатами аналізу ґрунту.
  - name: Захист рослин
    text: >-
      Гербіциди (до- та післясходові), фунгіциди при появі аскохітозу та несправжньої борошнистої
      роси, інсектициди при появі попелиць та горохової зернівки. Перелік дозволених препаратів
      дивіться у Державному реєстрі пестицидів і агрохімікатів України.
  - name: Збирання врожаю
    text: >-
      Збирання у липні (у Чехії) за вологості насіння менше 14 %. Горох схильний до вилягання та
      раннього дозрівання — доцільно використовувати напівкарликові або карликові сорти чи підпірні
      культури (овес).
faq:
  - q: Чому горох є таким хорошим попередником?
    a: >-
      Горох завдяки фіксації атмосферного азоту (через симбіотичні бактерії Rhizobium) збагачує
      ґрунт азотом. Також залишає добру структуру ґрунту та розриває зернову сівозміну, зменшуючи
      тиск хвороб і бур'янів.
  - q: Чи потрібне гороху азотне удобрення?
    a: >-
      Горох забезпечує себе азотом переважно за рахунок біологічної фіксації. Стартова доза азоту
      (0–30 кг/га) може підтримати проростання, поки не розвинуться бульбочкові бактерії. Вищі дози
      азоту — марнотратство і пригнічують фіксацію.
  - q: Який урожай польового гороху можна очікувати?
    a: >-
      Середня врожайність становить 3–4,5 т/га. На якісних ділянках і за сприятливої погоди можна
      отримати 5 т/га. Урожайність гороху нестабільна — посуха під час цвітіння суттєво знижує
      врожай.
