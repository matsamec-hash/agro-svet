slug: psenice-ozima
name: Озима пшениця
name_plural: Озима пшениця
description: >-
  Озима пшениця (Triticum aestivum) є найпоширенішою зерновою культурою у Чехії, вирощується
  переважно для виробництва харчового та кормового зерна. Озима форма висівається восени, а збирання
  врожаю відбувається влітку, забезпечує вищу врожайність порівняно з ярою формою.
vysevek: 300–450 схожих насінин/м² (осіння сівба); нижчі значення для ранніх строків сівби
hnojeni: >-
  N 120–180 кг/га у розділених дозах (початок вегетації, вихід у трубку, стеблування); P і K згідно
  з результатами аналізу ґрунту
vynos_t_ha: 6–9
sklizen: липень (у Чехії)
vyuziti: харчове борошно, кормове зерно, крохмаль, біоетанол
choroby:
  - септоріоз (бронзовість пшениці)
  - фузаріози колосу та коренів
  - борошниста роса злаків
  - іржі (пшенична, жовта)
  - карликова сажка (SNS)
osevni_postup:
  - name: Попередник
    text: >-
      Найкращими попередниками є ріпак, горох та інші зернобобові. Вирощування пшениці після пшениці
      підвищує ризик розвитку фузаріозу та септоріозу.
  - name: Підготовка ґрунту
    text: >-
      Оранка на глибину 20–25 см після збирання попередника, вирівнювання посівного ложа; за
      мінімального обробітку — ретельне загортання післяжнивних решток.
  - name: Сівба
    text: >-
      Оптимальний строк сівби у Чехії: 1–20 жовтня. Глибина загортання насіння 3–5 см, норма висіву
      300–450 схожих насінин/м².
  - name: Удобрення азотом
    text: >-
      Азот вносити у розділених дозах — на початку вегетації, у фазі виходу в трубку та під час
      стеблування відповідно до запланованої врожайності.
  - name: Захист рослин
    text: >-
      Протруєння насіння, весняне фунгіцидне оброблення (септоріоз, борошниста роса, іржі) та захист
      колосу від фузаріозу. Використання регуляторів росту при ризику вилягання.
  - name: Збирання врожаю
    text: >-
      Збирання врожаю при вологості зерна 13–15 % (липень, у Чехії); правильне налаштування комбайна
      мінімізує втрати.
faq:
  - q: Коли висівають озиму пшеницю?
    a: >-
      Оптимальний строк сівби озимої пшениці у Чехії: 1–20 жовтня. Надто рання сівба підвищує ризик
      грибкових хвороб і масового розмноження шкідників.
  - q: Яка потреба озимої пшениці в азоті?
    a: >-
      Озима пшениця потребує 120–180 кг N/га, які вносять у 2–3 прийоми від початку вегетації до
      фази стеблування.
  - q: Яка типова врожайність озимої пшениці у Чехії?
    a: >-
      Середня врожайність у Чехії становить близько 6–7 т/га, за сприятливих умов і якісної
      агротехніки можна отримати 8–9 т/га.
  - q: Які найнебезпечніші хвороби озимої пшениці?
    a: >-
      Основними є септоріоз (бронзовість пшениці), фузаріози колосу та борошниста роса злаків.
      Фунгіцидний захист у відповідні фази розвитку економічно виправданий.
