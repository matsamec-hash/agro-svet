# STEJNÉ pořadí i délku jako cs — mapování na entitu jde přes cs index.
# Termíny setí a sklizně jsou ČESKÉ a text to říká nahlas („у Чехії").
slug: jecmen-jarni
name: Ячмінь ярий
name_plural: Ячмінь ярий
description: >-
  Ячмінь ярий (Hordeum vulgare) є найважливішою ярою зерновою культурою у Чехії, вирощується
  переважно для виробництва солодової сировини (пиво), на корм та для харчових потреб. Вимагає
  якісної попередньої культури та раннього висіву, оскільки пізні строки сівби суттєво знижують
  урожайність і погіршують солодові показники.
vysevek: 300–400 схожих зерен/м²
hnojeni: >-
  N 60–90 кг/га (для солодового ячменю максимум 80 кг/га, щоб не перевищити допустимий вміст білка у
  зерні)
vynos_t_ha: 4–7
sklizen: липень — початок серпня (у Чехії)
vyuziti: солодовий солод (виробництво пива), кормове зерно, харчова промисловість (крупи, борошно)
choroby:
  - буре плямистість ячменю (ринхоспоріоз)
  - смугастість ячменю (піренофора)
  - борошниста роса злаків
  - пилова сажка ячменю
  - BYDV (вірусні жовтяниці ячменю, переноситься попелицями)
osevni_postup:
  - name: Попередник
    text: >-
      Солодовий ячмінь потребує якісного попередника — ідеально просапні або зернобобові культури.
      Після пшениці зростає ризик хвороб і погіршення солодової якості.
  - name: Підготовка ґрунту
    text: >-
      Осіння оранка та якісна підготовка посівного ложа навесні; ярий ячмінь чутливий до ущільнення
      і кислої реакції ґрунту (оптимум pH 6,0–7,0).
  - name: Сівба
    text: >-
      Якомога раніше після підсихання ґрунту (лютий–березень у Чехії). Глибина загортання 3–4 см,
      норма висіву 300–400 схожих зерен/м². Пізня сівба знижує урожайність і солодову якість.
  - name: Удобрення
    text: >-
      Для солодового ячменю обмежити азот до максимум 80 кг/га (надлишок підвищує вміст білка понад
      допустимий для солоду). Фосфор і калій — за результатами аналізу ґрунту.
  - name: Захист рослин
    text: >-
      Протруєння насіння (проти смугастості, сажки), інсектицидне протруєння або обробка у разі
      появи попелиць (переносників BYDV), фунгіциди за порогом шкідливості. Використовувати
      препарати, зареєстровані у Державному реєстрі пестицидів і агрохімікатів України.
  - name: Збирання врожаю
    text: >-
      Збирання при вологості 13–15 % (липень–серпень у Чехії). Для солодового ячменю контролювати
      якісні показники (схожість, вміст білка, об’ємна маса).
faq:
  - q: Чому важливий ранній строк сівби ярого ячменю?
    a: >-
      Ранній висів (лютий–березень у Чехії) дозволяє використати весняну вологу, подовжує вегетацію
      та покращує урожайність і солодові якості. Кожен тиждень затримки сівби може знизити урожай на
      0,2–0,3 т/га (у Чехії).
  - q: Яка допустима норма азоту для солодового ячменю?
    a: >-
      Для солодового ячменю рекомендується максимум 80 кг N/га. Вищі дози підвищують вміст білка у
      зерні понад допустиму межу для солодження (зазвичай >12 %).
  - q: Яку урожайність можна очікувати від ярого ячменю?
    a: >-
      На якісних ґрунтах із дотриманням агротехніки ярий ячмінь дає 5–7 т/га, у посушливих умовах
      або при пізній сівбі — 4–5 т/га (у Чехії).
  - q: Як протруєння насіння захищає ярий ячмінь?
    a: >-
      Протруєння захищає від смугастості ячменю та пилової сажки, які передаються інфікованим
      насінням. Інсектицидне протруєння додатково зменшує ризик раннього ураження попелицями, що
      переносять вірус BYDV.
