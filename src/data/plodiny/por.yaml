slug: por
name: Pór zahradní
name_plural: Pór
skupina: zelenina
hero_image: /images/plodiny/por.jpg
hero_author: "User:BotBln"
hero_license: "CC BY-SA 3.0"
hero_source: "https://commons.wikimedia.org/wiki/File:Allium_porrum_porrum_HabitusInflorescences_BotGardBln0906.JPG"
description: >-
  Pór zahradní (Allium ampeloprasum var. porrum) je cibulová zelenina pěstovaná pro bílý
  nezdužnatělý stonek, takzvaný falešný stvol. Odrůdy se dělí na letní, podzimní a zimní podle
  odolnosti proti mrazu — zimní typy s tmavě modrozelenou natí přezimují na poli a sklízejí se
  postupně až do jara, což z póru dělá jednu z mála zelenin s celoroční nabídkou z pole.
vysevek: výsev do sadbovačů 400–600 g osiva/ha; spon 30–40 × 10–15 cm
hnojeni: N 150–200 kg/ha děleně; K 200–250 kg K₂O/ha; dobře snáší organické hnojení
vynos_t_ha: 30–45
sklizen: srpen–duben dle sortimentní skupiny
seti_mesice: [2, 3, 4]
sklizen_mesice: [8, 9, 10, 11, 12]
vyuziti: čerstvý trh, polévky a gastronomie, mrazírenské zpracování
choroby:
  - rez pórová (Puccinia allii)
  - plíseň cibulová (Peronospora destructor)
  - vrtalka pórová (Napomyza gymnostoma)
  - třásněnka zahradní (Thrips tabaci)
  - bílá hniloba (Sclerotium cepivorum)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Odstup po cibulové zelenině nejméně 4 roky. Pór dobře zhodnotí organické hnojení a řadí se do první nebo druhé trati po hnoji.
  - name: Předpěstování sadby
    text: Výsev do sadbovačů od února do dubna podle sortimentní skupiny. Sadba je připravená za 8–10 týdnů, kdy má tloušťku tužky.
  - name: Výsadba do rýh
    text: Sází se do rýh hlubokých 10–15 cm, které se během vegetace postupně zahrnují. Právě zahrnování vytváří dlouhý bílý stonek, který je tržním produktem.
  - name: Hnojení a závlaha
    text: Dusík dělit do dvou až tří dávek, poslední u zimních odrůd nejpozději v srpnu, aby porost do zimy vyzrál. Závlaha rovnoměrná, pór má mělké kořeny.
  - name: Přihrnování
    text: Dvakrát až třikrát za vegetaci se k rostlinám přihrne zemina. Každé přihrnutí prodlouží bílou část stonku; pozor, aby se zemina nedostala mezi listy.
  - name: Sklizeň
    text: Letní odrůdy od srpna, podzimní od října, zimní postupně přes zimu až do dubna. Zimní typy snesou −15 °C a sklízejí se podle poptávky přímo z pole.
wikipedia: https://cs.wikipedia.org/wiki/P%C3%B3r_zahradn%C3%AD
faq:
  - q: Jak dosáhnout dlouhé bílé části póru?
    a: Sázením do hlubokých rýh a postupným přihrnováním zeminy během vegetace. Bílá je ta část stonku, ke které se nedostane světlo — délka není dána jen odrůdou, ale hlavně technologií.
  - q: Přežije pór na poli zimu?
    a: Zimní odrůdy ano, snesou teploty kolem −15 °C a sklízejí se postupně až do dubna. Letní a podzimní typy se musí sklidit do příchodu silných mrazů.
  - q: Proč má pór mezi listy zeminu?
    a: Zemina se dostane dovnitř při nešetrném přihrnování nebo silném dešti. Prakticky ji nelze vymýt, proto se přihrnuje opatrně a jen k vnější části stonku.
