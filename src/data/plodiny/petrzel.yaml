slug: petrzel
name: Petržel zahradní
name_plural: Petržel
skupina: zelenina
hero_image: /images/plodiny/petrzel.jpg
hero_author: "Yelkrokoyade"
hero_license: "CC BY-SA 3.0"
hero_source: "https://commons.wikimedia.org/wiki/File:Petroselinum_crispum_var._tuberosum.jpg"
description: >-
  Petržel zahradní (Petroselinum crispum) se v registru ÚKZÚZ vede ve dvou formách — kořenová
  (var. tuberosum) pěstovaná pro bílý kořen do polévek a listová (var. crispum) pro nať,
  v hladké i kadeřavé variantě. Je to typická česká kořenová zelenina s pomalým vzcházením
  a vysokými nároky na hloubku a strukturu půdy.
vysevek: 4–6 kg/ha (kořenová), 3–5 kg/ha (listová)
hnojeni: N 80–120 kg/ha; K 180–220 kg K₂O/ha; nehnojit čerstvým hnojem (větvení kořene)
vynos_t_ha: 20–35 (kořenová), 15–25 (listová, v několika sečích)
sklizen: září–listopad (kořenová), červen–říjen průběžně (listová)
seti_mesice: [3, 4]
sklizen_mesice: [6, 7, 8, 9, 10, 11]
vyuziti: kořenová zelenina do vývarů a polévkových směsí, sušená nať, čerstvá nať pro gastronomii
choroby:
  - septoriová skvrnitost (Septoria petroselini)
  - padlí miříkovitých (Erysiphe heraclei)
  - pochmurnatka mrkvová (Psila rosae)
  - alternariová skvrnitost (Alternaria spp.)
  - bílá hniloba (Sclerotinia sclerotiorum)
osevni_postup:
  - name: Předplodina a osevní postup
    text: Odstup po miříkovitých nejméně 4 roky. Petržel se řadí až do druhé trati po organickém hnojení — čerstvý hnůj způsobuje rozvětvení kořene.
  - name: Příprava půdy a setí
    text: Hluboko zpracovaná půda bez kamenů a utužení, stejně jako u mrkve. Seje se brzy na jaře do hloubky 1–2 cm. Petržel vzchází velmi pomalu, 20–28 dní.
  - name: Regulace plevelů
    text: Kritické období. Během tří až čtyř týdnů, než petržel vzejde, ji plevele přerostou. Používá se herbicidní ochrana nebo se jako značkovací plodina přiseje ředkvička.
  - name: Hnojení a závlaha
    text: Dusíku střídmě, přehnojená petržel praská a hůř se skladuje. Rovnoměrná závlaha 200–250 mm za vegetaci zajistí hladký nerozvětvený kořen.
  - name: Ochrana rostlin
    text: Sledovat pochmurnatku mrkvovou, jejíž larvy chodbičkují kořen. Za vlhka hlídat septoriózu, která u listové petržele znehodnotí celou nať.
  - name: Sklizeň
    text: Kořenová petržel se sklízí od září do listopadu, snese i lehké mrazíky a skladuje se při 0–1 °C. Listová se seče průběžně, zpravidla ve třech až čtyřech sečích.
wikipedia: https://cs.wikipedia.org/wiki/Petr%C5%BEel_zahradn%C3%AD
faq:
  - q: Proč petržel tak dlouho nevzchází?
    a: Osivo miříkovitých obsahuje klíčení brzdící silice a potřebuje 20–28 dní stálé vlhkosti. Není to vadné osivo. Pomáhá přisetí ředkvičky, která vzejde za týden a označí řádky pro plečkování.
  - q: Proč se petrželi větví kořen?
    a: Kvůli překážce v půdě — kameni nebo utužené vrstvě — anebo kvůli čerstvému hnoji. Petržel patří až do druhého roku po organickém hnojení.
  - q: Jaký je rozdíl mezi kořenovou a listovou petrželí?
    a: Kořenová tvoří silný bílý kořen a nať je vedlejším produktem. Listová kořen netvoří a pěstuje se výhradně pro nať, v hladké nebo kadeřavé formě. ÚKZÚZ obě vede jako samostatné skupiny odrůd.
