# Polský overlay katalogu medů. `typ` a `krystalizace` jsou kanonicky české
# (klíč pro CSS třídy + JSON-LD) — zobrazovaný text překládá medTypLabel /
# medKrystalizaceLabel. Slug a image_* beze změny.
- slug: akatovy
  name: Miód akacjowy
  typ: kvetovy
  zdroj_snusky: robinia akacjowa (Robinia pseudoacacia)
  barva: jasnożółta do niemal przezroczystej
  chut: delikatny, słodki, bez wyraźnej kwasowości
  krystalizace: velmi pomalá
  popis_kratky: Jasny miód nektarowy o bardzo powolnej krystalizacji.
  description: >
    Miód akacjowy należy do najjaśniejszych i najdelikatniejszych miodów. Dzięki
    wysokiemu udziałowi fruktozy krystalizuje bardzo powoli i długo pozostaje płynny.
  image_url: /images/vcelarstvi/med/akatovy.webp
  image_credit: "Dr. Manavpreet Kaur"
  image_source_url: https://commons.wikimedia.org/wiki/File:Honey_1.jpg
  image_license: CC BY-SA 4.0

- slug: kvetovy
  name: Miód wielokwiatowy
  typ: kvetovy
  zdroj_snusky: nektar różnych roślin kwitnących
  barva: jasnożółta do złocistej
  chut: delikatny, harmonijny, z lekko aromatycznym podtonem
  krystalizace: střední
  popis_kratky: Najpowszechniejszy wiosenny miód o jasnej barwie i zrównoważonym, uniwersalnym smaku.
  description: >
    Miód wielokwiatowy powstaje z nektaru rozmaitych roślin kwitnących, przy czym
    jego profil smakowy i barwa różnią się w zależności od składu botanicznego pożytku
    w danej lokalizacji i porze roku. To najbardziej rozpowszechniony typ miodu
    zbieranego w Czechach — podobnie jak w Polsce — zwykle o barwie jasnożółtej
    do złocistej i delikatnej, zrównoważonej słodyczy.
    Krystalizuje w średnim tempie, a w stanie stałym tworzy drobnoziarnistą strukturę.
  image_url: /images/vcelarstvi/med/kvetovy.webp
  image_credit: "Kamalfencer"
  image_source_url: https://commons.wikimedia.org/wiki/File:Honey_3.jpg
  image_license: CC BY-SA 4.0

- slug: medovicovy
  name: Miód spadziowy (leśny)
  typ: medovicovy
  zdroj_snusky: spadź drzew iglastych i liściastych
  barva: ciemnobrązowa do niemal czarnej
  chut: wyrazisty, lekko gorzkawy, słodowy, z mineralnym akcentem
  krystalizace: pomalá
  popis_kratky: Ciemny miód leśny o wyrazistym smaku i wysokiej zawartości składników mineralnych.
  description: >
    Miód spadziowy nie pochodzi z nektaru roślin, lecz ze spadzi — słodkiej wydzieliny
    owadów wysysających soki z drzew, przede wszystkim mszyc i czerwców żerujących
    na drzewach iglastych (świerk, jodła, sosna) i liściastych (dąb, buk, klon).
    Pszczoły zbierają tę spadź i przerabiają ją tak samo jak nektar.
    W porównaniu z miodami nektarowymi zawiera więcej składników mineralnych, enzymów
    i oligosacharydów, co przekłada się na ciemniejszą barwę i wyrazistszy smak.
    Krystalizuje powoli, a pożytek przypada głównie na miesiące letnie.
  image_url: /images/vcelarstvi/med/medovicovy.webp
  image_credit: "Kottairajcs"
  image_source_url: https://commons.wikimedia.org/wiki/File:Honey_2.jpg
  image_license: CC BY-SA 4.0

- slug: lipovy
  name: Miód lipowy
  typ: kvetovy
  zdroj_snusky: kwiat lipy (Tilia sp.)
  barva: jasnożółta z zielonkawym odcieniem
  chut: aromatyczny, świeży, lekko mentolowy
  krystalizace: střední
  popis_kratky: Aromatyczny miód o zielonkawym odcieniu, tradycyjnie kojarzony ze wsparciem dróg oddechowych.
  description: >
    Miód lipowy pozyskuje się z pożytku na kwitnących lipach — w Czechach i w Polsce
    najczęściej na lipie drobnolistnej (Tilia cordata) i lipie szerokolistnej
    (Tilia platyphyllos).
    Charakteryzuje go jasnożółta barwa z delikatnym zielonkawym odcieniem oraz wyraziste
    składniki aromatyczne — linalol i farnezol — które nadają mu typowy, lekko
    mentolowy ton.
    W tradycyjnej medycynie ludowej bywa stosowany przy przeziębieniu i stanach zapalnych
    górnych dróg oddechowych, choć naukowo potwierdzone dane kliniczne są ograniczone.
  image_url: /images/vcelarstvi/med/lipovy.webp
  image_credit: "mueritz (Thomas Kohler)"
  image_source_url: https://commons.wikimedia.org/wiki/File:Lindenhonig.jpg
  image_license: CC BY-SA 2.0

- slug: repkovy
  name: Miód rzepakowy
  typ: kvetovy
  zdroj_snusky: kwiat rzepaku (Brassica napus)
  barva: kremowobiała do jasnożółtej
  chut: delikatny, lekko słodkawy, bez wyraźnego aromatu
  krystalizace: rychlá
  popis_kratky: Jasny miód o bardzo szybkiej krystalizacji, który trzeba w porę odwirować.
  description: >
    Miód rzepakowy krystalizuje najszybciej ze wszystkich popularnych rodzajów miodu —
    już w ciągu dwóch do czterech tygodni po odwirowaniu przechodzi w stałą,
    drobnoziarnistą strukturę.
    Pszczelarze muszą więc odwirować miód z pożytku rzepakowego bezpośrednio
    po zasklepieniu plastrów, inaczej grozi zastygnięcie miodu w plastrach
    i uniemożliwienie odwirowania.
    Po skrystalizowaniu miód poddaje się kremowaniu (kontrolowanemu mieszaniu),
    aby uzyskać gładką konsystencję do smarowania; gotowy miód rzepakowy kremowany
    jest kremowobiały do jasnożółtego.
  image_url: null

- slug: pohankovy
  name: Miód gryczany
  typ: kvetovy
  zdroj_snusky: kwiat gryki zwyczajnej (Fagopyrum esculentum)
  barva: ciemnobrązowa do czerwonobrązowej
  chut: wyrazisty, korzenny, słodowy, z delikatną goryczką
  krystalizace: střední
  popis_kratky: Ciemny miód o wyrazistym słodowym smaku i wysokiej zawartości przeciwutleniaczy.
  description: >
    Miód gryczany należy do najciemniejszych i najbardziej wyrazistych smakowo miodów
    nektarowych. Pochodzi z pożytku na polach gryki, który w Czechach przypada
    głównie na okres od lipca do sierpnia.
    Cechuje go wysoka zawartość flawonoidów i związków fenolowych, co koresponduje
    z jego ciemną barwą i silną aktywnością przeciwutleniającą, wykazywaną metodami
    laboratoryjnymi.
    Krystalizuje w średnim tempie, a w stanie stałym tworzy gruboziarnistą strukturę.
  image_url: null

- slug: pastovany
  name: Miód kremowany
  typ: smiseny
  zdroj_snusky: różne (obróbka technologiczna — zob. opis)
  barva: kremowobiała do jasnożółtej
  chut: delikatny, gładki, słodki, bez wyraźnego aromatu
  krystalizace: střední
  popis_kratky: Miód kremowany to nie rodzaj pożytku, lecz sposób obróbki — kontrolowana krystalizacja daje kremową konsystencję do smarowania.
  description: >
    Miód kremowany nie jest osobnym botanicznym rodzajem miodu, lecz wynikiem obróbki
    technologicznej — kontrolowanego mieszania miodu w trakcie rozpoczynającej się
    krystalizacji.
    Do miodu płynnego lub delikatnie skrystalizowanego dodaje się zaczyn ze skrystalizowanego
    już miodu o bardzo drobnych kryształach (tzw. miód zaszczepiający), a całą masę miesza się
    regularnie w kontrolowanej temperaturze (zwykle 14–18 °C), dzięki czemu powstaje
    jednorodna, kremowo gładka struktura bez grubych kryształów.
    Produkt końcowy łatwo się smaruje, nie wypływa z naczynia, a jego profil smakowy
    zależy od wyjściowego rodzaju miodu (najczęściej rzepakowego albo wielokwiatowego wiosennego).
  image_url: null
