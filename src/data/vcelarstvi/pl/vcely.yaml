# Polský overlay katalogu včel. Enum hodnoty (temperament/medny_vynos/rojivost),
# slug, latinsky a image_* zůstávají česky/beze změny — jsou to klíče pro CSS
# třídy, JSON-LD a sdílené obrázky. Překládá se jen zobrazovaná próza.
- slug: kranska
  name: Pszczoła kraińska
  latinsky: Apis mellifera carnica
  alternative_names: [kraińska, carnica]
  puvod: Słowenia i region alpejski
  temperament: mírná
  medny_vynos: vysoký
  rojivost: vyšší
  zimuvzdornost: doskonała
  vhodnost_cr: W Czechach zdecydowanie najbardziej rozpowszechniona pszczoła; w Polsce również dominuje w pasiekach.
  barva: brązowoszara z szarym owłosieniem
  description: >
    Kraińska jest w Czechach pszczołą dominującą. Wyróżnia się łagodnością,
    doskonałym wykorzystaniem wiosennego pożytku i niskim zużyciem zapasów
    zimowych. Jej słabą stroną jest większa skłonność do rojenia, którą
    ogranicza się przez odpowiednio wczesne poszerzanie gniazda.
  image_url: /images/vcelarstvi/druhy/kranska.webp
  image_credit: "Richard Bartz, Munich · Makro Freak"
  image_source_url: https://commons.wikimedia.org/wiki/File:Apis_mellifera_carnica_worker_hive_entrance_3.jpg
  image_license: CC BY-SA 2.5
  wikipedia: https://pl.wikipedia.org/wiki/Pszczo%C5%82a_krai%C5%84ska

- slug: tmava-vcela
  name: Pszczoła ciemna europejska
  latinsky: Apis mellifera mellifera
  alternative_names: [pszczoła środkowoeuropejska, mellifera]
  puvod: północna i zachodnia Europa
  temperament: obranná
  medny_vynos: střední
  rojivost: střední
  zimuvzdornost: doskonała — pierwotna adaptacja do surowego klimatu północnoeuropejskiego
  vhodnost_cr: >
    Pierwotny podgatunek krajobrazu środkowoeuropejskiego; dziś rzadki — w Czechach
    i krajach ościennych działają hodowle ochronne nastawione na zachowanie czystych
    populacji.
  barva: ciemnobrązowa do czarnej, minimalne żółte ubarwienie
  description: >
    Pszczoła ciemna europejska to pierwotny europejski podgatunek pszczoły miodnej,
    który przez stulecia zasiedlał lasy i łąki Europy Środkowej i Północnej.
    Cechuje się ciemnym ubarwieniem, masywną budową ciała i doskonałym
    przystosowaniem do zimnej i wilgotnej zimy. Wiosenny rozwój rodziny jest
    wolniejszy niż u ras południowoeuropejskich, pszczoła gospodaruje jednak
    oszczędnie i zużywa mało zapasów zimowych. Dziś czyste populacje są rzadkie
    i chronione; w wielu krajach prowadzone są hodowle zachowawcze służące
    utrzymaniu różnorodności genetycznej tego rodzimego podgatunku. W porównaniu
    z innymi rasami wykazuje większą skłonność do rojenia, co trzeba uwzględnić
    w gospodarce pasiecznej.
  image_url: /images/vcelarstvi/druhy/tmava-vcela.webp
  image_credit: "Jürg Vollmer"
  image_source_url: https://commons.wikimedia.org/wiki/File:Apis_mellifera_mellifera,_04.jpg
  image_license: CC BY-SA 4.0
  faq:
    - q: Dlaczego czyste populacje pszczoły ciemnej są tak rzadkie?
      a: >
        Pszczoła ciemna krzyżuje się naturalnie z liniami wprowadzanymi przez
        pszczelarzy — kraińską, włoską czy buckfastem. Napływ obcych genów
        stopniowo zmienia morfologię i zachowanie populacji. Hodowle zachowawcze
        wybierają dlatego izolowane lokalizacje, gdzie naturalny dopływ trutni
        z obcych linii jest minimalny.
    - q: Czy pszczoła ciemna nadaje się dla początkujących pszczelarzy?
      a: >
        Jej wyraźniejsza obronność wymaga bardziej doświadczonej ręki i konsekwentnego
        używania odzieży ochronnej. Początkującym poleca się raczej kraińską
        lub buckfasta.

- slug: italka
  name: Pszczoła włoska
  latinsky: Apis mellifera ligustica
  alternative_names: [włoszka, ligustica]
  puvod: Włochy (Półwysep Apeniński)
  temperament: mírná
  medny_vynos: velmi vysoký
  rojivost: střední
  zimuvzdornost: >
    niższa — wrażliwa na długie chłodne zimy; wyższe zużycie zapasów zimowych
    ze względu na dużą populację letnią
  vhodnost_cr: >
    W cieplejszych rejonach południowych Moraw i środkowych Czech osiąga dobre
    wyniki; w surowszym klimacie terenów podgórskich zazimowanie jest trudniejsze.
  barva: żółta do złocistej, z wyraźnymi żółtymi obrączkami na odwłoku
  description: >
    Pszczoła włoska należy do najczęściej hodowanych ras na świecie — dzięki
    złocistemu ubarwieniu i wyjątkowej produkcji miodu. Matka jest bardzo płodna,
    rodziny osiągają dużą siłę letnią i skutecznie wykorzystują pożytek główny.
    Większa liczba pszczół zimujących zwiększa jednak zużycie zapasów miodowych;
    podczas długiej zimy, bez wystarczającego uzupełnienia pokarmu, grozi im głód.
    W klimacie środkowoeuropejskim nadaje się więc przede wszystkim dla bardziej
    doświadczonych pszczelarzy, potrafiących na bieżąco kontrolować i w razie
    potrzeby uzupełniać zapasy.
  image_url: /images/vcelarstvi/druhy/italka.webp
  image_credit: "Chop2x"
  image_source_url: https://commons.wikimedia.org/wiki/File:Ligustica_italian_bee_with_pollen.jpg
  image_license: CC BY-SA 3.0
  faq:
    - q: Dlaczego pszczoła włoska zużywa więcej zapasów niż kraińska?
      a: >
        Matka włoszki utrzymuje duże czerwisko również późnym latem i jesienią,
        więc rodzina wchodzi w zimę z liczniejszą populacją. Więcej pszczół oznacza
        wyższe zużycie miodu, dlatego prawidłowe oszacowanie zapasów na zazimowanie
        ma kluczowe znaczenie.
    - q: Czy włoszka krzyżuje się z kraińską?
      a: >
        Tak — przy swobodnym unasienianiu trutniami z okolicy dochodzi do naturalnej
        hybrydyzacji. Powstałe rodziny mogą wykazywać zwiększoną obronność typową
        dla mieszańców międzyrasowych. Czystą linię da się utrzymać wyłącznie przez
        sztuczne unasienianie albo w izolacji geograficznej.

- slug: buckfast
  name: Buckfast
  latinsky: Apis mellifera (hodowlany mieszaniec)
  alternative_names: [pszczoła buckfast, pszczoła brata Adama]
  puvod: Anglia, opactwo Buckfast (brat Adam, XX wiek)
  temperament: mírná
  medny_vynos: velmi vysoký
  rojivost: nízká
  zimuvzdornost: >
    dobra — linie są selekcjonowane między innymi pod kątem oszczędnego zimowania;
    konkretne wyniki różnią się w zależności od hodowli
  vhodnost_cr: >
    Popularna wśród pszczelarzy zawodowych i amatorów w całych Czechach; wymaga
    regularnego zakupu sprawdzonych matek od uznanych hodowców, ponieważ potomstwo
    z własnej produkcji rozszczepia się genetycznie.
  barva: zmienna — zależna od składu linii; zwykle brązowawa z żółtymi paskami
  description: >
    Buckfast to hodowlany mieszaniec powstały w wyniku konsekwentnej selekcji
    prowadzonej przez brata Adama w opactwie Buckfast w południowo-zachodniej Anglii,
    gdzie pracował od 1915 roku aż do lat 90. XX wieku. Linia łączy geny kraińskiej,
    włoskiej i innych podgatunków, aby jednocześnie osiągnąć łagodność, wysoką
    produkcję i niską rojliwość. Cechy użytkowe są wyrównane i przewidywalne —
    o ile pszczoły pochodzą od sprawdzonego hodowcy. Zasadnicze ograniczenie polega
    na niemożności odchowu własnych matek: matka z rodziny buckfast unasieniona
    swobodnie daje mieszańce o zmiennych cechach, więc pszczelarz musi regularnie
    kupować czyste matki buckfast.
  image_url: null
  faq:
    - q: Dlaczego nie da się odchować własnych matek z rodziny buckfast?
      a: >
        Buckfast to mieszaniec F1 złożony z genetycznie odmiennych linii. Trutnie,
        które unasienią nową matkę, zwykle nie pochodzą z hodowli buckfast,
        a potomstwo (pokolenie F2) przestaje mieć spójne cechy. Rodziny bywają
        nagle obronne albo rojliwe. Pszczelarz powinien więc regularnie wymieniać
        matki na pochodzące od certyfikowanego hodowcy.
    - q: Czy buckfast nadaje się dla początkujących pszczelarzy?
      a: >
        Łagodność pszczół buckfast jest jedną z ich głównych cech hodowlanych,
        więc praca przy ulu bywa spokojniejsza. Konieczność regularnego zakupu
        nowych matek to jednak koszt finansowy i organizacyjny, który początkujący
        biorą pod uwagę.

- slug: kavkazska
  name: Pszczoła kaukaska
  latinsky: Apis mellifera caucasica
  alternative_names: [kaukaska szara, szara pszczoła górska]
  puvod: Kaukaz (zwłaszcza obszary centralne i wschodnie)
  temperament: mírná
  medny_vynos: vysoký
  rojivost: nízká
  zimuvzdornost: >
    średnio dobra — w suchym klimacie kontynentalnym zimuje dobrze;
    w wilgotnym środowisku środkowoeuropejskim bywa bardziej podatna na nosemozę
  vhodnost_cr: >
    W Czechach hodowana marginalnie; interesująca na terenach z dużym udziałem
    koniczyny dzięki długiemu języczkowi; obfite kitowanie utrudnia jednak pracę przy ulu.
  barva: szara do szarobrązowej; ogólnie ciemniejsza niż kraińska
  description: >
    Pszczoła kaukaska wyróżnia się najdłuższym języczkiem spośród wszystkich
    podgatunków pszczoły miodnej, dzięki czemu sięga do nektaru koniczyny łąkowej,
    trudno dostępnego dla pozostałych ras. Rodziny są łagodne i mało rojliwe,
    więc praca z nimi jest wygodna. Obfite wytwarzanie propolisu — typowa cecha
    kaukaskiej — uszczelnia ul, ale podczas przeglądu skleja ramki i komplikuje
    manipulację. W wilgotnym klimacie środkowoeuropejskim rodzina bywa bardziej
    podatna na nosemozę niż w suchszym, rodzimym środowisku kaukaskim.
  image_url: /images/vcelarstvi/druhy/kavkazska.webp
  image_credit: "Zeynel Cebeci"
  image_source_url: https://commons.wikimedia.org/wiki/File:Honeybee_-_Balar%C4%B1s%C4%B1_01.jpg
  image_license: CC BY-SA 4.0
  faq:
    - q: Dlaczego pszczoła kaukaska jest interesująca na terenach z koniczyną?
      a: >
        Kaukaska ma wyraźnie dłuższy języczek niż pozostałe rasy środkowoeuropejskie,
        dzięki czemu sięga do nektarników w koronie kwiatu koniczyny łąkowej.
        Na obszarach z uprawami koniczyny może więc przynosić więcej nektaru
        niż rasy o krótszym języczku.

- slug: krajinka-sklenar
  name: Pszczoła kraińska linii Sklenar
  latinsky: Apis mellifera carnica
  alternative_names: [Sklenar, linia Sklenar]
  puvod: Austria (hodowla Sklenar)
  temperament: mírná
  medny_vynos: vysoký
  rojivost: střední
  zimuvzdornost: doskonała — cecha odziedziczona po wyjściowej kraińskiej, dodatkowo utrwalona selekcją
  vhodnost_cr: >
    Uznana linia hodowlana dostępna u zatwierdzonych hodowców w Czechach i Austrii;
    odpowiednia dla pszczelarzy szukających sprawdzonej kraińskiej o spójnych cechach.
  barva: brązowoszara, typowe ubarwienie kraińskie
  description: >
    Linia Sklenar to jedna z najbardziej znanych linii hodowlanych podgatunku
    Apis mellifera carnica pochodzących z Austrii. Powstała w wyniku długoletniej
    selekcji na łagodność, niską rojliwość i wydajną produkcję miodu przy zachowaniu
    doskonałej odporności zimowej kraińskiej. Pszczelarze cenią ją za przewidywalne
    zachowanie i łatwą pracę z rodziną. Jak każda linia hodowlana wymaga zakupu matek
    od uznanego hodowcy, aby cechy zostały zachowane; własny odchów z matek
    unasienionych swobodnie stopniowo je zaciera.
  image_url: /images/vcelarstvi/druhy/krajinka-sklenar.webp
  image_credit: "Richard Bartz, Munich · Makro Freak"
  image_source_url: https://commons.wikimedia.org/wiki/File:Apis_mellifera_carnica_worker_honeycomb_2.jpg
  image_license: CC BY-SA 2.5
  faq:
    - q: Czym różni się standardowa kraińska od linii Sklenar?
      a: >
        Określenie „kraińska" obejmuje cały podgatunek Apis mellifera carnica bez
        gwarancji konkretnych cech — matki pochodzą z różnych hodowli o różnym
        poziomie selekcji. Linia Sklenar to udokumentowana linia hodowlana
        z rodowodem, w której cechy takie jak łagodność i wydajność miodowa są
        systematycznie kontrolowane i potwierdzane przez pokolenia.
    - q: Gdzie można kupić matki linii Sklenar?
      a: >
        Matki są dostępne u zarejestrowanych hodowców kraińskiej współpracujących
        z hodowlami austriackimi i innymi zagranicznymi. Informacji o uznanych
        hodowcach udzielają związki pszczelarskie i wojewódzkie stacje hodowlane.
