- slug: kurak
  name: Smoker
  kategorie: ochrana
  popis_kratky: >-
    Gerät, das kalten Rauch erzeugt, die Bienen bei der Arbeit an der Beute
    beruhigt und das Stichrisiko senkt.
  description: >
    Der Smoker besteht aus einem Brennbehälter aus Edelstahl oder verzinntem
    Blech mit angebautem Blasebalg; als Brennstoff dienen trockenes Gras,
    Sägespäne, Rinde oder spezielle Pellets aus Naturmaterialien. Der Rauch
    bewirkt, dass die Bienen reflexartig Honig aufnehmen und sich auf eine
    Flucht vor einem Brand vorbereiten — in diesem Zustand sind sie weniger
    wehrhaft und ertragen den Eingriff leichter. Der richtige Umgang mit dem
    Smoker gehört zu den Grundfertigkeiten jeder Imkerin und jedes Imkers und
    senkt die Zahl der Stiche am Stand deutlich.
  pro_zacatecniky: true
  orientacni_cena: 300–800 Kč
  image_url: /images/vcelarstvi/vybaveni/kurak.webp
  image_credit: Orce Wiki
  image_source_url: >-
