- slug: ramek
  name: Rähmchen
  kategorie: naradi
  popis_kratky: >-
    Holz- oder Kunststoffrahmen, der die Wabe trägt, in die Zarge gehängt wird
    und das Entnehmen des Wabenwerks ohne Beschädigung ermöglicht.
  description: >
    Das Rähmchen bildet die tragende Grundeinheit der Wabe — die Bienen
    besiedeln es mit Wachs, bauen die Mittelwand zu Zellen aus, und die Königin
    bestiftet sie oder die Arbeiterinnen lagern Honig und Pollen ein. Die
    übliche Ausführung ist aus Holz mit Oberträger, Seitenteilen und
    Unterträger; zwischen den Seitenteilen werden Draht aus Edelstahl oder
    Messing gespannt, auf dem die Mittelwand befestigt wird. Die Maße des
    Rähmchens bestimmen das Rähmchenmaß der gesamten Beute — Zander, Deutsch
    Normal, Langstroth und Optimal lassen sich ohne Umbau der Zarge nicht
    gegeneinander austauschen.
  pro_zacatecniky: true
  orientacni_cena: 10–30 Kč je Stück
  image_url: /images/vcelarstvi/vybaveni/ramek.webp
  image_credit: Jolán Dénes
  image_source_url: >-
