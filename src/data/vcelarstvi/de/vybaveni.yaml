- slug: vcelarsky-oblek
  name: Imkeranzug und Schleier
  kategorie: ochrana
  popis_kratky: >-
    Schutzkleidung und Schleier gegen Stiche bei der Arbeit an der Beute —
    Anfängern wird der vollständige Anzug empfohlen.
  description: >
    Der Imkeranzug ist ein Overall aus dicht gewebtem hellem Material (Baumwolle
    oder Mischgewebe) mit elastischen Bündchen an Handgelenken und Knöcheln, die
    das Eindringen von Bienen unter die Kleidung verhindern. Der Schleier mit
    Metall- oder Kunststoffgitter schützt Gesicht und Hals; es gibt lose
    Schleier zum Tragen über eigener Kleidung wie auch fest mit dem Overall
    vernähte Ausführungen. Anfängerinnen und Anfängern empfehlen die
    Imkerverbände in Deutschland und Österreich den vollständigen Anzug mit
    integriertem Schleier — erfahrenere Imker arbeiten bei sanftmütigen Völkern
    oft nur mit Schleier und Handschuhen.
  pro_zacatecniky: true
  orientacni_cena: 600–1 800 Kč (Schleier), 1 500–4 000 Kč (kompletter Anzug)
  image_url: /images/vcelarstvi/vybaveni/vcelarsky-oblek.webp
  image_credit: Migco
  image_source_url: https://commons.wikimedia.org/wiki/File:Beekeeper.jpg
  image_license: Public domain
