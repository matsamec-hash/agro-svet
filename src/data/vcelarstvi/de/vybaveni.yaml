- slug: krmitko
  name: Futtergeschirr
  kategorie: krmeni
  popis_kratky: >-
    Behälter, der in oder über die Beute gesetzt wird und der Gabe von
    Zuckerlösung bei der Einwinterung oder zur Notfütterung dient.
  description: >
    Das Futtergeschirr dient dazu, die Energievorräte des Volkes in Zeiten
    aufzufüllen, in denen die natürliche Tracht nicht ausreicht — typischerweise
    bei der Einwinterung im September und Oktober oder in einer trachtarmen
    Phase im Sommer. Eine Futtertasche in Rähmchenform wird direkt zwischen die
    Waben gehängt; ein flaches Aufsatzfuttergeschirr deckt die gesamte Oberseite
    der Zarge ab, fasst ein bis drei Liter Lösung, und die Bienen gelangen von
    unten durch eine Öffnung daran. Die Zuckerlösung wird im Verhältnis 1:1
    (Reizfütterung) oder 3:2 bis 2:1 (Wintervorrat) angesetzt; die Menge richtet
    sich nach dem empfohlenen Wintervorrat, der je nach Region und Beutensystem
    üblicherweise bei 15 bis 20 kg je überwinterndem Volk liegt.
  pro_zacatecniky: true
  orientacni_cena: 100–400 Kč
  image_url: null
