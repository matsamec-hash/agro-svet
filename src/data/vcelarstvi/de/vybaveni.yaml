- slug: rozperka
  name: Stockmeißel
  kategorie: naradi
  popis_kratky: >-
    Edelstahlhebel zum Trennen propolisverklebter Zargen und Rähmchen — das
    tägliche Grundwerkzeug der Imkerei.
  description: >
    Der Stockmeißel ist ein geformter Edelstahlstab von etwa 20 bis 25 cm Länge
    mit leicht gebogenem keilförmigem Ende und einem geraden Schaber auf der
    Gegenseite. Er dient zum Trennen propolisverklebter Zargen, zum Lösen der
    Rähmchen aus engen Spalten und zum Abkratzen angesetzten Propolis oder
    Wachses von den Zargenwänden. Ohne dieses Werkzeug lässt sich eine Beute
    nicht öffnen, ohne das Wabenwerk zu beschädigen oder Bienen zu quetschen —
    es ist deshalb das erste Werkzeug, das sich Einsteiger anschaffen.
  pro_zacatecniky: true
  orientacni_cena: 80–250 Kč
  image_url: null
