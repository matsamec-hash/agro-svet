- slug: mezistena
  name: Mittelwand
  kategorie: naradi
  popis_kratky: >-
    Wachsplatte mit vorgeprägten Zellböden, die ins Rähmchen eingelötet wird und
    von den Bienen rasch zur fertigen Wabe ausgebaut wird.
  description: >
    Die Mittelwand ist eine dünne Wachsplatte mit vorgeprägten sechseckigen
    Zellböden. Sie beschleunigt den Wabenbau und lenkt die Bienen zum Bau von
    Zellen normgerechter Größe. Eingesetzt wird sie in ein vorbereitetes
    Rähmchen mit gespannten Drähten, die sie mechanisch stützen, und
    anschließend mit einem Einlötgerät oder einem beheizten Sporn befestigt.
    Hochwertige Mittelwände bestehen aus reinem Bienenwachs ohne Paraffinzusatz;
    ihre stoffliche Reinheit wirkt sich unmittelbar auf die Gesundheit der Brut
    in den Zellen aus.
  pro_zacatecniky: true
  orientacni_cena: ab 20 Kč je Stück, 100–350 Kč je kg Wachs
  image_url: /images/vcelarstvi/vybaveni/mezistena.webp
  image_credit: Plantsurfer
  image_source_url: https://commons.wikimedia.org/wiki/File:Beeswax_foundation.jpg
  image_license: Public domain
