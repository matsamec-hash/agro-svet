- slug: nastavkovy-ul
  name: Magazinbeute
  kategorie: ul
  popis_kratky: >-
    Modulare Beute aus einzelnen aufeinandergesetzten Zargen — der heutige
    Standard.
  description: >
    Die Magazinbeute besteht aus trennbaren, aufeinandergesetzten Zargen. Sie
    erlaubt das Arbeiten mit ganzen Zargen sowie das einfache Erweitern und
    Abnehmen des Honigraums. Im deutschsprachigen Raum verbreitet sind vor allem
    die Rähmchenmaße Zander, Deutsch Normal (DN) und Langstroth, in Tschechien
    überwiegend Optimal (39×24 cm). Für Anfänger ist die Magazinbeute dank der
    Verfügbarkeit von Zubehör und Literatur die naheliegende erste Beute.
  pro_zacatecniky: true
  orientacni_cena: 2 500–6 000 Kč je Zarge
