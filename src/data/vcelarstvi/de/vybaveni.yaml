- slug: optimal
  name: Beute Optimal (39×24)
  kategorie: ul
  popis_kratky: >-
    Das tschechische Rähmchenmaß 39×24 cm — das Gegenstück zu Zander und Deutsch
    Normal im deutschsprachigen Raum.
  description: >
    Das Rähmchenmaß Optimal (Breite 390 mm, Höhe 240 mm) setzte sich in
    Tschechien nach dem Zweiten Weltkrieg als Standard durch und wird dort bis
    heute von der Mehrheit der Imker verwendet. Es erfüllt dieselbe Rolle wie im
    deutschsprachigen Raum Zander oder Deutsch Normal: Rähmchen, Mittelwände und
    Zargen sind im heimischen Handel breit verfügbar und günstiger als
    importierte Systeme. Für die Imkerei in Deutschland und Österreich ist
    Optimal nur dann relevant, wenn Ausrüstung aus Tschechien übernommen wird —
    die Maße sind mit Zander und DN nicht austauschbar.
  pro_zacatecniky: true
  orientacni_cena: 2 000–5 000 Kč je Zarge
  image_url: null
