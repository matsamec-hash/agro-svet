- slug: medomet
  name: Honigschleuder
  kategorie: zpracovani
  popis_kratky: >-
    Zentrifuge zum Schleudern des Honigs aus den Waben, ohne diese zu
    beschädigen.
  description: >
    Die Honigschleuder arbeitet nach dem Prinzip der Zentrifuge — die Waben
    beziehungsweise ganze Rähmchen werden in eine rotierende Trommel gestellt,
    und die Fliehkraft treibt den Honig aus den Zellen an die Wand des
    zylindrischen Behälters, von wo er durch den Quetschhahn in ein Gefäß läuft.
    Handschleudern mit einer Kapazität von zwei bis vier Rähmchen sind
    erschwinglich und reichen für einen kleineren Bestand bis etwa zehn Völker;
    elektrische Geräte mit sechs bis neun Rähmchen und mehr sparen bei größerer
    Ernte Zeit. Entscheidend ist die Passung zum Rähmchenmaß (Zander, DN,
    Langstroth oder Optimal), denn die Körbe in der Trommel lassen sich nicht
    immer an mehrere Maße anpassen.
  pro_zacatecniky: false
  orientacni_cena: 2 000–6 000 Kč (Handschleuder), ab 8 000 Kč (elektrisch)
  image_url: /images/vcelarstvi/vybaveni/medomet.webp
  image_credit: Orce Wiki
