- slug: langstroth
  name: Langstroth-Beute
  kategorie: ul
  popis_kratky: >-
    Das weltweit verbreitetste Rähmchenmaß mit herstellerübergreifend
    kompatiblem Zubehör.
  description: >
    Die Langstroth-Beute entwarf 1851 der amerikanische Pfarrer Lorenzo
    Langstroth; heute beherrscht sie die weltweite Imkerei, vor allem dank der
    genormten Rähmchenmaße (448×232 mm). Die Modularität erlaubt den Austausch
    von Zargen und Waben verschiedener Hersteller, was die Beschaffung von
    Ersatzteilen und das gemeinsame Nutzen von Ausrüstung erleichtert. Im
    deutschsprachigen Raum ist sie neben Zander und Deutsch Normal verbreitet;
    mit der Ausbreitung der Berufsimkerei wächst ihr Anteil.
  pro_zacatecniky: true
  orientacni_cena: 2 500–5 500 Kč je Zarge
  image_url: /images/vcelarstvi/vybaveni/langstroth.webp
  image_credit: Easy n
  image_source_url: https://commons.wikimedia.org/wiki/File:Beehive.jpg
  image_license: Public domain
