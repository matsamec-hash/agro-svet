- slug: kranska
  name: Kärntner Biene
  latinsky: Apis mellifera carnica
  alternative_names:
    - Carnica
    - Kärntner Biene
  puvod: Slowenien und der Alpenraum
  temperament: mírná
  medny_vynos: vysoký
  rojivost: vyšší
  zimuvzdornost: hervorragend
  vhodnost_cr: Im gesamten deutschsprachigen Raum die mit Abstand meistgehaltene Biene.
  barva: braungrau mit grauer Behaarung
  description: >
    Die Carnica ist in Deutschland, Österreich und Tschechien die vorherrschende
    Biene. Sie überzeugt durch Sanftmut, hervorragende Nutzung der
    Frühjahrstracht und einen geringen Winterfutterverbrauch. Ihre Schwäche ist
    die erhöhte Schwarmneigung, der man mit rechtzeitiger Erweiterung der Beute
    begegnet.
  image_url: /images/vcelarstvi/druhy/kranska.webp
  image_credit: Richard Bartz, Munich · Makro Freak
  image_source_url: >-
    https://commons.wikimedia.org/wiki/File:Apis_mellifera_carnica_worker_hive_entrance_3.jpg
  image_license: CC BY-SA 2.5
  wikipedia: https://cs.wikipedia.org/wiki/V%C4%8Dela_medonosn%C3%A1_kra%C5%88sk%C3%A1
- slug: tmava-vcela
  name: Dunkle Biene
  latinsky: Apis mellifera mellifera
  alternative_names:
    - Dunkle Europäische Biene
    - Mellifera
    - Nigra
  puvod: Nord- und Westeuropa
  temperament: obranná
  medny_vynos: střední
  rojivost: střední
  zimuvzdornost: hervorragend — ursprüngliche Anpassung an das raue nordeuropäische Klima
  vhodnost_cr: >
    Die ursprüngliche Unterart Mitteleuropas; heute selten. In der Schweiz, in
    Österreich und in mehreren weiteren Ländern bestehen Schutzzuchten zur
    Erhaltung reiner Populationen.
  barva: dunkelbraun bis schwarz, kaum gelbe Anteile
  description: >
    Die Dunkle Biene ist die ursprüngliche europäische Unterart der Honigbiene,
    die über Jahrhunderte die Wälder und Wiesen Mittel- und Nordeuropas
    besiedelte. Sie zeichnet sich durch dunkle Färbung, kräftigen Körperbau und
    hervorragende Anpassung an kalte und feuchte Winter aus. Die
    Frühjahrsentwicklung des Volkes verläuft langsamer als bei den
    südeuropäischen Rassen, dafür wirtschaftet die Biene sparsam mit geringem
    Winterfutterverbrauch. Reine Populationen sind heute selten und geschützt;
    in mehreren Ländern laufen Erhaltungszuchten zur Bewahrung der genetischen
    Vielfalt dieser ursprünglichen europäischen Unterart. Gegenüber anderen
    Rassen zeigt sie eine höhere Schwarmneigung, was in der Haltung zu
    berücksichtigen ist.
  image_url: /images/vcelarstvi/druhy/tmava-vcela.webp
  image_credit: Jürg Vollmer
  image_source_url: https://commons.wikimedia.org/wiki/File:Apis_mellifera_mellifera,_04.jpg
  image_license: CC BY-SA 4.0
  faq:
    - q: Warum sind reine Populationen der Dunklen Biene so selten?
      a: >
        Die Dunkle Biene kreuzt sich auf natürlichem Weg mit eingeführten Linien
        — Carnica, Ligustica oder Buckfast. Die Introgression fremder Gene
        verändert Morphologie und Verhalten der Population nach und nach.
        Erhaltungszuchten wählen deshalb abgelegene Standorte, an denen der
        natürliche Zuflug von Drohnen fremder Linien möglichst gering ist.
    - q: Eignet sich die Dunkle Biene für Einsteiger?
      a: >
        Ihre ausgeprägtere Verteidigungsbereitschaft verlangt erfahrenen Umgang
        und konsequentes Tragen der Schutzausrüstung. Anfängerinnen und
        Anfängern wird eher die Carnica oder Buckfast empfohlen.
- slug: italka
  name: Italienische Biene
  latinsky: Apis mellifera ligustica
  alternative_names:
    - Ligustica
    - Italiener
  puvod: Italien (Apenninenhalbinsel)
  temperament: mírná
  medny_vynos: velmi vysoký
  rojivost: střední
  zimuvzdornost: >
    geringer — empfindlich gegenüber langen kalten Wintern; höherer
    Winterfutterverbrauch wegen des großen Sommervolkes
  vhodnost_cr: >
    In wärmeren Lagen erzielt sie gute Ergebnisse; im raueren Klima der
    Vorgebirgslagen ist die Einwinterung anspruchsvoller.
  barva: gelb bis golden mit ausgeprägten gelben Hinterleibsringen
  description: >
    Die Italienische Biene zählt wegen ihrer goldenen Färbung und der
    außergewöhnlichen Honigleistung weltweit zu den meistgehaltenen Zuchtrassen.
    Die Königin ist sehr legefreudig, die Völker erreichen im Sommer große
    Stärke und nutzen die Haupttracht wirkungsvoll. Die höhere Zahl
    überwinternder Bienen erhöht allerdings den Verbrauch an Honigvorräten; in
    einem langen Winter ohne ausreichende Auffütterung droht Verhungern. Im
    mitteleuropäischen Klima eignet sie sich deshalb vor allem für erfahrenere
    Imkerinnen und Imker, die die Vorräte laufend kontrollieren und bei Bedarf
    ergänzen können.
  image_url: /images/vcelarstvi/druhy/italka.webp
  image_credit: Chop2x
  image_source_url: >-
    https://commons.wikimedia.org/wiki/File:Ligustica_italian_bee_with_pollen.jpg
  image_license: CC BY-SA 3.0
  faq:
    - q: Warum verbraucht die Italienische Biene mehr Vorräte als die Carnica?
      a: >
        Die Königin der Ligustica hält auch im Spätsommer und Herbst eine große
        Brutfläche aufrecht, sodass das Volk mit einer größeren Population in
        den Winter geht. Mehr Bienen bedeuten einen höheren Honigverbrauch — die
        richtige Einschätzung der Vorräte bei der Einwinterung ist deshalb
        entscheidend.
    - q: Kreuzt sich die Italienische Biene mit der Carnica?
      a: >
        Ja — bei der Standbegattung mit Drohnen aus der Umgebung kommt es zur
        natürlichen Hybridisierung. Die entstehenden Völker können die für
        Rassekreuzungen typische erhöhte Verteidigungsbereitschaft zeigen. Eine
        reine Linie lässt sich nur durch Besamung oder in geografischer
        Isolation halten.
- slug: buckfast
  name: Buckfast
  latinsky: Apis mellifera (Zuchthybride)
  alternative_names:
    - Buckfastbiene
  puvod: England, Abtei Buckfast (Bruder Adam, 20. Jahrhundert)
  temperament: mírná
  medny_vynos: velmi vysoký
  rojivost: nízká
  zimuvzdornost: >
    gut — die Linien sind unter anderem auf sparsame Überwinterung selektiert;
    die konkreten Ergebnisse unterscheiden sich je nach Züchter
  vhodnost_cr: >
    Bei Berufs- wie bei Hobbyimkern verbreitet; erfordert den regelmäßigen
    Zukauf geprüfter Königinnen von anerkannten Züchtern, weil die Nachkommen
    eigener Vermehrung genetisch aufspalten.
  barva: >-
    variabel — abhängig von der Linienzusammensetzung; meist bräunlich mit
    gelben Bändern
  description: >
    Buckfast ist ein Zuchthybrid, entstanden durch die systematische Selektion
    von Bruder Adam in der Abtei Buckfast im Südwesten Englands, wo er von 1915
    bis in die 1990er-Jahre arbeitete. Die Linie verbindet Gene der Carnica, der
    Ligustica und weiterer Unterarten mit dem Ziel, Sanftmut, hohe Leistung und
    geringe Schwarmneigung gleichzeitig zu erreichen. Die wirtschaftlichen
    Eigenschaften sind ausgeglichen und vorhersehbar — sofern die Bienen von
    einem geprüften Züchter stammen. Die wesentliche Einschränkung liegt darin,
    dass eigene Königinnen nicht nachgezogen werden können: Eine standbegattete
    Königin aus einem Buckfast-Volk erzeugt Kreuzungen mit wechselhaften
    Eigenschaften, sodass regelmäßig reine Buckfast-Königinnen zugekauft werden
    müssen.
  image_url: null
  faq:
    - q: >-
        Warum lässt sich aus einem Buckfast-Volk keine eigene Königin
        nachziehen?
      a: >
        Buckfast ist eine aus genetisch unterschiedlichen Linien
        zusammengesetzte Kombinationszucht. Die Drohnen, die eine neue Königin
        begatten, stammen in der Regel nicht aus einer Buckfast-Zucht, und die
        Nachkommen der Folgegeneration verlieren die gleichmäßigen
        Eigenschaften. Die Völker können plötzlich verteidigungsbereit oder
        schwarmfreudig sein. Königinnen sollten deshalb regelmäßig bei einem
        geprüften Züchter erneuert werden.
    - q: Eignet sich Buckfast für Einsteiger?
      a: >
        Die Sanftmut der Buckfastbienen ist eines ihrer wichtigsten Zuchtziele,
        sodass die Arbeit an der Beute ruhiger verläuft. Die Notwendigkeit,
        regelmäßig neue Königinnen zuzukaufen, ist allerdings ein finanzieller
        und organisatorischer Aufwand, den Anfängerinnen und Anfänger
        einkalkulieren sollten.
- slug: kavkazska
  name: Kaukasische Biene
  latinsky: Apis mellifera caucasica
  alternative_names:
    - Kaukasier
    - Graue Gebirgsbiene
  puvod: Kaukasus (vor allem die zentralen und östlichen Gebiete)
  temperament: mírná
  medny_vynos: vysoký
  rojivost: nízká
  zimuvzdornost: >
    mittelgut — im trockenen Kontinentalklima überwintert sie gut; im feuchten
    mitteleuropäischen Umfeld kann sie anfälliger für Nosemose sein
  vhodnost_cr: >
    Nur am Rande gehalten; interessant in kleereichen Lagen wegen des langen
    Rüssels. Die starke Propolisbildung erschwert die Arbeit an der Beute.
  barva: grau bis graubraun; insgesamt dunkler als die Carnica
  description: >
    Die Kaukasische Biene besitzt den längsten Rüssel aller Unterarten der
    Honigbiene und erreicht damit den Nektar des Rotklees, der für andere Rassen
    schwer zugänglich ist. Die Völker sind sanftmütig und schwärmen wenig,
    sodass sich angenehm mit ihnen arbeiten lässt. Die reichliche
    Propolisbildung — eine typisch kaukasische Eigenschaft — dichtet die Beute
    ab, verklebt bei der Durchsicht aber die Rähmchen und erschwert die
    Handhabung. Im feuchten mitteleuropäischen Klima kann das Volk anfälliger
    für Nosemose sein als in seiner trockeneren kaukasischen Heimat.
  image_url: /images/vcelarstvi/druhy/kavkazska.webp
  image_credit: Zeynel Cebeci
  image_source_url: https://commons.wikimedia.org/wiki/File:Honeybee_-_Balar%C4%B1s%C4%B1_01.jpg
  image_license: CC BY-SA 4.0
  faq:
    - q: Warum ist die Kaukasische Biene in kleereichen Lagen interessant?
      a: >
        Die Kaukasierin hat einen deutlich längeren Rüssel als die übrigen
        mitteleuropäischen Rassen und erreicht damit das Nektarium in der
        Blütenkrone des Rotklees. In Gebieten mit Kleeflächen kann sie deshalb
        mehr Nektar eintragen als Rassen mit kürzerem Rüssel.
- slug: krajinka-sklenar
  name: Carnica Linie Sklenar
  latinsky: Apis mellifera carnica
  alternative_names:
    - Sklenar
    - Linie Sklenar
  puvod: Österreich (Zuchtbetrieb Sklenar)
  temperament: mírná
  medny_vynos: vysoký
  rojivost: střední
  zimuvzdornost: >-
    hervorragend — eine von der Carnica ererbte und durch Selektion weiter
    gefestigte Eigenschaft
  vhodnost_cr: >
    Anerkannte Zuchtlinie, in Österreich und darüber hinaus über zugelassene
    Züchter erhältlich; geeignet für alle, die eine bewährte Carnica mit
    gleichbleibenden Eigenschaften suchen.
  barva: braungrau, typische Carnica-Färbung
  description: >
    Die Linie Sklenar ist eine der bekanntesten Zuchtlinien der Apis mellifera
    carnica und stammt aus Österreich. Sie entstand durch langjährige Selektion
    auf Sanftmut, geringe Schwarmneigung und leistungsfähige Honigproduktion bei
    Erhalt der hervorragenden Winterfestigkeit der Carnica. Imkerinnen und Imker
    schätzen sie für ihr vorhersehbares Verhalten und die einfache Arbeit am
    Volk. Wie jede Zuchtlinie erfordert sie zum Erhalt der Eigenschaften den
    Zukauf von Königinnen bei einem anerkannten Züchter; die eigene Nachzucht
    aus standbegatteten Königinnen nivelliert die Eigenschaften nach und nach.
  image_url: /images/vcelarstvi/druhy/krajinka-sklenar.webp
  image_credit: Richard Bartz, Munich · Makro Freak
  image_source_url: >-
    https://commons.wikimedia.org/wiki/File:Apis_mellifera_carnica_worker_honeycomb_2.jpg
  image_license: CC BY-SA 2.5
  faq:
    - q: Worin unterscheiden sich die Standard-Carnica und die Linie Sklenar?
      a: >
        Die Bezeichnung „Carnica" umfasst die gesamte Unterart Apis mellifera
        carnica ohne Gewähr für bestimmte Eigenschaften — die Königinnen stammen
        aus verschiedenen Zuchten mit unterschiedlichem Selektionsstand. Die
        Linie Sklenar ist eine dokumentierte Zuchtlinie mit Abstammungsnachweis,
        bei der Eigenschaften wie Sanftmut und Honigleistung über Generationen
        systematisch erfasst und bestätigt werden.
    - q: Wo bekommt man Königinnen der Linie Sklenar?
      a: >
        Die Königinnen sind bei registrierten Carnica-Züchtern erhältlich, die
        mit österreichischen und weiteren Zuchten zusammenarbeiten. Auskunft
        über anerkannte Züchter geben die Landesverbände der Imker sowie die
        Zuchtstellen in Deutschland und Österreich.
