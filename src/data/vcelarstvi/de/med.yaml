- slug: akatovy
  name: Akazienhonig
  typ: kvetovy
  zdroj_snusky: Robinie (Robinia pseudoacacia)
  barva: hellgelb bis fast klar
  chut: mild, süß, ohne ausgeprägte Säure
  krystalizace: velmi pomalá
  popis_kratky: Heller Blütenhonig mit sehr langsamer Kristallisation.
  description: >
    Der Akazienhonig zählt zu den hellsten und mildesten Honigen. Wegen des
    hohen Fruchtzuckeranteils kristallisiert er sehr langsam und bleibt lange
    flüssig. Botanisch stammt er nicht von der Akazie, sondern von der Robinie —
    der Handelsname hat sich dennoch durchgesetzt.
  image_url: /images/vcelarstvi/med/akatovy.webp
  image_credit: Dr. Manavpreet Kaur
  image_source_url: https://commons.wikimedia.org/wiki/File:Honey_1.jpg
  image_license: CC BY-SA 4.0
- slug: kvetovy
  name: Blütenhonig
  typ: kvetovy
  zdroj_snusky: Nektar verschiedener blühender Pflanzen
  barva: hellgelb bis goldfarben
  chut: mild, harmonisch, mit leicht aromatischem Unterton
  krystalizace: střední
  popis_kratky: >-
    Der häufigste Frühjahrshonig — hell und mit ausgewogenem, universellem
    Geschmack.
  description: >
    Blütenhonig entsteht aus dem Nektar unterschiedlicher blühender Pflanzen,
    wobei Geschmacksprofil und Farbe je nach botanischer Zusammensetzung der
    Tracht am jeweiligen Standort und in der jeweiligen Jahreszeit variieren. Es
    ist der verbreitetste Honigtyp Mitteleuropas, meist hellgelb bis goldfarben,
    mit milder, ausgewogener Süße. Er kristallisiert in mittlerem Tempo und
    bildet im festen Zustand eine feinkörnige Struktur.
  image_url: /images/vcelarstvi/med/kvetovy.webp
  image_credit: Kamalfencer
  image_source_url: https://commons.wikimedia.org/wiki/File:Honey_3.jpg
  image_license: CC BY-SA 4.0
- slug: medovicovy
  name: Waldhonig (Honigtauhonig)
  typ: medovicovy
  zdroj_snusky: Honigtau von Nadel- und Laubbäumen
  barva: dunkelbraun bis fast schwarz
  chut: kräftig, leicht herb, malzig, mit mineralischem Anklang
  krystalizace: pomalá
  popis_kratky: Dunkler Waldhonig mit kräftigem Geschmack und hohem Mineralstoffgehalt.
  description: >
    Der Honigtauhonig stammt nicht aus Pflanzennektar, sondern aus Honigtau —
    den zuckerhaltigen Ausscheidungen von Insekten, die Pflanzensaft aus Bäumen
    saugen, vor allem Blatt- und Schildläuse an Nadelbäumen (Fichte, Tanne,
    Kiefer) und Laubbäumen (Eiche, Buche, Ahorn). Die Bienen sammeln diesen
    Honigtau und verarbeiten ihn wie Nektar. Gegenüber Blütenhonigen enthält er
    mehr Mineralstoffe, Enzyme und Oligosaccharide, was sich in der dunkleren
    Farbe und dem kräftigeren Geschmack niederschlägt. Er kristallisiert
    langsam, und die Tracht fällt überwiegend in die Sommermonate.
  image_url: /images/vcelarstvi/med/medovicovy.webp
  image_credit: Kottairajcs
  image_source_url: https://commons.wikimedia.org/wiki/File:Honey_2.jpg
  image_license: CC BY-SA 4.0
- slug: lipovy
  name: Lindenhonig
  typ: kvetovy
  zdroj_snusky: Lindenblüte (Tilia sp.)
  barva: hellgelb mit grünlichem Schimmer
  chut: aromatisch, frisch, leicht mentholartig
  krystalizace: střední
  popis_kratky: >-
    Aromatischer Honig mit grünlichem Ton, traditionell mit den Atemwegen in
    Verbindung gebracht.
  description: >
    Der Lindenhonig stammt aus der Tracht blühender Linden, in Mitteleuropa vor
    allem der Winterlinde (Tilia cordata) und der Sommerlinde (Tilia
    platyphyllos). Kennzeichnend sind eine hellgelbe Farbe mit feinem grünlichem
    Schimmer und ausgeprägte Aromastoffe — Linalool und Farnesol — die ihm den
    typischen, leicht mentholartigen Ton verleihen. In der Volksheilkunde wird
    er traditionell bei Erkältungen und Entzündungen der oberen Atemwege
    verwendet, wissenschaftlich belastbare klinische Daten dazu sind allerdings
    begrenzt.
  image_url: /images/vcelarstvi/med/lipovy.webp
  image_credit: mueritz (Thomas Kohler)
  image_source_url: https://commons.wikimedia.org/wiki/File:Lindenhonig.jpg
  image_license: CC BY-SA 2.0
- slug: repkovy
  name: Rapshonig
  typ: kvetovy
  zdroj_snusky: Rapsblüte (Brassica napus)
  barva: cremeweiß bis hellgelb
  chut: mild, leicht süßlich, ohne ausgeprägtes Aroma
  krystalizace: rychlá
  popis_kratky: >-
    Heller Honig mit sehr rascher Kristallisation, der zeitig geschleudert
    werden muss.
  description: >
    Der Rapshonig kristallisiert von allen gängigen Honigsorten am schnellsten —
    bereits zwei bis vier Wochen nach dem Schleudern geht er in eine feste,
    feinkörnige Struktur über. Imkerinnen und Imker müssen den Honig aus der
    Rapstracht deshalb unmittelbar nach dem Verdeckeln der Waben schleudern,
    sonst droht er in den Waben fest zu werden und lässt sich nicht mehr
    gewinnen. Nach dem Auskristallisieren wird er durch kontrolliertes Rühren zu
    einer glatten, streichfähigen Form gecremt; der fertige Rapshonig ist
    cremeweiß bis hellgelb.
  image_url: null
- slug: pohankovy
  name: Buchweizenhonig
  typ: kvetovy
  zdroj_snusky: Buchweizenblüte (Fagopyrum esculentum)
  barva: dunkelbraun bis rotbraun
  chut: kräftig, würzig, malzig, mit feiner Bitternote
  krystalizace: střední
  popis_kratky: Dunkler Honig mit kräftigem Malzgeschmack und hohem Antioxidantiengehalt.
  description: >
    Der Buchweizenhonig zählt zu den dunkelsten und geschmacklich kräftigsten
    Blütenhonigen. Er stammt aus der Tracht auf Buchweizenfeldern, die in
    Mitteleuropa überwiegend von Juli bis August verläuft. Kennzeichnend ist ein
    hoher Gehalt an Flavonoiden und phenolischen Verbindungen, was mit seiner
    dunklen Farbe und der laborgestützt nachweisbaren starken antioxidativen
    Aktivität einhergeht. Er kristallisiert in mittlerem Tempo und bildet im
    festen Zustand eine grobkörnige Struktur.
  image_url: null
- slug: pastovany
  name: Cremehonig
  typ: smiseny
  zdroj_snusky: verschieden (technologische Bearbeitung — siehe Beschreibung)
  barva: cremeweiß bis hellgelb
  chut: mild, glatt, süß, ohne ausgeprägtes Aroma
  krystalizace: střední
  popis_kratky: >-
    Cremehonig ist keine Trachtsorte, sondern eine Verarbeitungsform — durch
    gesteuerte Kristallisation entsteht eine cremige, streichfähige Konsistenz.
  description: >
    Cremehonig ist keine eigene botanische Honigsorte, sondern das Ergebnis
    einer technologischen Bearbeitung — des gesteuerten Rührens während der
    beginnenden Kristallisation. In flüssigen oder fein kristallinen Honig wird
    ein Ansatz aus bereits auskristallisiertem Honig mit sehr feinen Kristallen
    (sogenannter Impfhonig) gegeben, und die gesamte Masse wird bei
    kontrollierter Temperatur (üblicherweise 14 bis 18 °C) regelmäßig gerührt,
    wodurch eine homogene, cremig glatte Struktur ohne grobe Kristalle entsteht.
    Das Erzeugnis ist leicht streichfähig, läuft nicht aus dem Glas, und sein
    Geschmacksprofil hängt von der Ausgangssorte ab (am häufigsten Raps oder
    gemischte Frühjahrstracht).
  image_url: null
