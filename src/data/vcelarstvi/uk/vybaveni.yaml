- slug: mezistena
  name: Вощина
  kategorie: naradi
  popis_kratky: >-
    Воскова основа з попередньо відтиснутими комірками, яку бджоли вставляють у рамку та швидко
    добудовують до готового стільника.
  description: >
    Mezistěna — це тонка воскова пластина з попередньо відтиснутими шестикутними основами комірок,
    яка прискорює будівництво стільників і спрямовує бджіл до створення комірок стандартного
    розміру. Вона вставляється у підготовлену рамку з натягнутими дротами, які механічно її
    зміцнюють, а потім фіксується запаюванням за допомогою електричного джерела або нагрітого
    коліщатка. Якісні mezistěny виготовляються з чистого бджолиного воску без домішок парафіну; їхня
    біологічна чистота безпосередньо впливає на здоров’я розплоду в комірках.
  pro_zacatecniky: true
  orientacni_cena: від 20 Kč за штуку (Optimal), 100–350 Kč за кг воску (у Чехії)
  image_url: /images/vcelarstvi/vybaveni/mezistena.webp
  image_credit: Plantsurfer
  image_source_url: https://commons.wikimedia.org/wiki/File:Beeswax_foundation.jpg
  image_license: Public domain
