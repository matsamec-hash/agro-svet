- slug: rozperka
  name: Rozpěrka (páčidло)
  kategorie: naradi
  popis_kratky: >-
    Нержавіюче бджолярське ломик для розділення корпусів і рамок, склеєних прополісом; основний
    щоденний інструмент пасічника.
  description: >-
    Rozpěrka — це вигнутий нержавіючий стрижень довжиною приблизно 20–25 см із злегка зігнутим
    клиноподібним кінцем і прямим шкребком з іншого боку. Використовується для розділення корпусів,
    склеєних прополісом, звільнення рамок із вузьких проміжків і для очищення стінок корпусу від
    осілого прополісу чи воску. Без цього інструмента неможливо безпечно відкрити вулик, не
    пошкодивши стільники чи не розчавивши бджіл — тому це перший інструмент, який купує кожен
    початківець-пасічник.
  pro_zacatecniky: true
  orientacni_cena: 80–250 Kč (у Чехії)
  image_url: null
