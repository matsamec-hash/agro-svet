- slug: langstroth
  name: Вулик Langstroth
  kategorie: ul
  popis_kratky: Найпоширеніший розмір рамки у світі з модульним приладдям, сумісним між різними виробниками.
  description: >
    Вулик Langstroth був розроблений у 1851 році американським пастором Лоренцо Лангстротом;
    сьогодні він домінує у світовому бджільництві насамперед завдяки стандартизованим розмірам рамки
    (448×232 мм). Модульність дозволяє взаємно замінювати корпуси та стільники від різних
    виробників, що полегшує придбання запасних частин і спільне використання обладнання між
    пасічниками. У Чехії менш поширений, ніж Optimal, але з розвитком екологічного та професійного
    бджільництва його частка зростає.
  pro_zacatecniky: true
  orientacni_cena: 2 500–5 500 Kč за корпус
  image_url: /images/vcelarstvi/vybaveni/langstroth.webp
  image_credit: Easy n
  image_source_url: https://commons.wikimedia.org/wiki/File:Beehive.jpg
  image_license: Public domain
