- slug: krmitko
  name: Годівниця
  kategorie: krmeni
  popis_kratky: >-
    Ємність, що розміщується безпосередньо в або над вуликом для підгодівлі бджіл цукровим розчином
    під час підготовки до зимівлі або екстреного підгодовування.
  description: >-
    Кормушка призначена для поповнення енергетичних запасів бджолосім’ї у періоди, коли природний
    взяток недостатній — зазвичай під час підготовки до зимівлі у вересні та жовтні або в бідний
    міжсезонний період влітку. Стельова кормушка (плоска, покриває всю стелю корпусу) вміщує 1–3
    літри розчину, і бджоли підходять до неї через отвір знизу; рамкова кормушка має форму вузької
    рамки й вставляється безпосередньо між стільниками. Цукровий розчин готують у співвідношенні 1:1
    (весна) або 2:1 (запаси на зиму), а його дозування визначається вагою зимових запасів,
    рекомендованою Чеським союзом бджолярів, зазвичай 15–20 кг на зимуючу сім’ю.
  pro_zacatecniky: true
  orientacni_cena: 100–400 Kč у Чехії
  image_url: null
