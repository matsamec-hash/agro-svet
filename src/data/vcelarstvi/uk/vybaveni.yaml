- slug: vcelarsky-oblek
  name: Бджолярський комбінезон і каптур
  kategorie: ochrana
  popis_kratky: >-
    Захисний одяг і сітчастий каптур, що захищають від укусів під час роботи з вуликом; для
    початківців рекомендовано повний комбінезон.
  description: >-
    Бджолярський комбінезон складається з комбінезона з щільно тканого світлого матеріалу (бавовна
    або поліестер з бавовною) з еластичними манжетами на зап’ястях і щиколотках, які запобігають
    проникненню бджіл під одяг. Каптур із металевою або пластиковою сіткою захищає обличчя та шию;
    існують окремі каптури для використання з власним одягом, а також інтегровані каптури,
    безпосередньо пришиті до комбінезона. Для початківців професійні організації, такі як Чеський
    союз бджолярів, рекомендують повний комбінезон з інтегрованим каптуром — досвідченіші пасічники
    з миролюбними породами часто працюють лише в каптурах і рукавицях.
  pro_zacatecniky: true
  orientacni_cena: 600–1 800 Kč (каптур), 1 500–4 000 Kč (повний комбінезон)
  image_url: /images/vcelarstvi/vybaveni/vcelarsky-oblek.webp
  image_credit: Migco
  image_source_url: https://commons.wikimedia.org/wiki/File:Beekeeper.jpg
  image_license: Public domain
