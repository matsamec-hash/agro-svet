- slug: optimal
  name: Вулик Optimal (39×24)
  kategorie: ul
  popis_kratky: Традиційна чеська рамкова система 39×24 см, яка досі є найпоширенішою у місцевих пасіках.
  description: >-
    Рамкова система Optimal (ширина 390 мм, висота 240 мм) утвердилася у Чехії як стандарт після
    Другої світової війни й досі використовується більшістю місцевих пасічників. Високий рівень
