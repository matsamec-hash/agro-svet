- slug: nastavkovy-ul
  name: Nástavkový úл
  kategorie: ul
  popis_kratky: Модульний вулик, що складається з окремих корпусів; сучасний стандарт.
  description: >-
    Надставковий вулик складається з відокремлюваних корпусів, які встановлюються один на одного. Це
    дозволяє працювати з цілими корпусами, легко розширювати або забирати медовий корпус. У Чехії
    найчастіше використовуються рамкові розміри Optimal (39×24 cm) або Langstroth. Для початківця
    підходить як перший вулик завдяки доступності аксесуарів і літератури.
