- slug: ramek
  name: Рамка
  kategorie: naradi
  popis_kratky: >-
    Дерев'яна або пластикова рамка, що несе стільник, яку вставляють у корпус і яка дозволяє виймати
    стільник без його пошкодження.
  description: >-
    Рамка є основною несучою одиницею стільника — бджоли оббудовують її воском, у вощину закладають
    комірки, а матка відкладає в них яйця або робочі бджоли зберігають мед і пилок. Стандартне
    виконання — дерев'яне з верхньою планкою, боковими брусками та нижньою планкою; між брусками
    натягують сталеві або латунні дроти, на які фіксується вощина. Розміри рамки визначають розмір
    рамки всього вулика — заміна рамок Optimal і Langstroth неможлива без модифікації корпусу.
  pro_zacatecniky: true
  orientacni_cena: 10–30 Kč за штуку у Чехії
  image_url: /images/vcelarstvi/vybaveni/ramek.webp
  image_credit: Jolán Dénes
  image_source_url: https://commons.wikimedia.org/wiki/File:Frame_from_a_beehive;_closeup_-_2011.12.18.jpg
  image_license: CC BY-SA 2.5
  related:
    - mezistena
    - optimal
    - langstroth
    - nastavkovy-ul
- slug: medomet
  name: Медогонка
  kategorie: zpracovani
  popis_kratky: Центрифуга для відкачування меду з стільників за допомогою відцентрової сили без їх пошкодження.
  description: >-
    Медогонка працює за принципом центрифуги — стільники (або цілі рамки) вкладаються у обертовий
    барабан, і відцентрова сила виштовхує мед із комірок у циліндричну ємність, звідки він стікає
    через зливний кран у посудину. Ручні медогонки з місткістю 2–4 рамки є доступними за ціною та
    підходять для невеликих пасік до 10 вуликів; електричні пристрої з місткістю 6–9 рамок і більше
    економлять час при масштабнішому зборі. Ключовий параметр — сумісність із розміром рамки
    (Optimal або Langstroth), оскільки касети в барабані не завжди можна пристосувати до обох
    розмірів.
  pro_zacatecniky: false
  orientacni_cena: 2 000–6 000 Kč (ручна), від 8 000 Kč (електрична) у Чехії
  image_url: /images/vcelarstvi/vybaveni/medomet.webp
  image_credit: Orce Wiki
  image_source_url: >-
    https://commons.wikimedia.org/wiki/File:Centrifuge_for_extracting_honey_-_Macedonian_traditional_agriculture.jpg
  image_license: CC BY-SA 4.0
  related:
    - rozperka
    - ramek
- slug: kurak
  name: Димар (курак)
  kategorie: ochrana
  popis_kratky: >-
    Інструмент, що виробляє холодний дим, який заспокоює бджіл під час роботи з вуликом і зменшує
    ризик ужалення.
  description: >
    Димар складається з нержавіючого або оцинкованого топкового кошика з міховим нагнітачем; як
    паливо використовують суху траву, деревні тирсу, кору або спеціальні пелети з природних
    матеріалів. Дим змушує бджіл рефлекторно приймати мед і готуватися до втечі від пожежі — у
    такому стані вони менш агресивні й легше переносять втручання пасічника. Правильне використання
    димаря належить до основних навичок кожного бджоляра і суттєво знижує кількість ужалень як
    пасічника, так і сусідів під час роботи на пасіці.
  pro_zacatecniky: true
  orientacni_cena: 300–800 Kč
  image_url: /images/vcelarstvi/vybaveni/kurak.webp
  image_credit: Orce Wiki
  image_source_url: >-
    https://commons.wikimedia.org/wiki/File:Bee_smoker_(pufka)_-_Macedonian_traditional_agriculture.jpg
  image_license: CC BY-SA 4.0
  related:
    - vcelarsky-oblek
