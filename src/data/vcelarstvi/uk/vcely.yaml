# Ukrajinský overlay včelařství. slug, latinské názvy, obrázky a odkazy
# zůstávají z cs. Údaje o vhodnosti pro ČR a ceny v Kč text označuje „у Чехії".
- slug: kranska
  name: Крайнська бджола (карніка)
  latinsky: Apis mellifera carnica
  alternative_names:
    - карніка
    - carnica
  puvod: Словенія та альпійський регіон
  temperament: mírná
  medny_vynos: vysoký
  rojivost: vyšší
  zimuvzdornost: відмінна
  vhodnost_cr: У Чехії це беззаперечно найпоширеніша бджола.
  barva: коричнево-сіра із сірим опушенням
  description: >
    Країнська бджола є домінуючою у Чехії. Відзначається миролюбністю, чудовим використанням
    весняного медозбору та низьким споживанням зимових запасів. Її недоліком є підвищена схильність
    до роїння, яку вирішують своєчасним розширенням вулика.
  image_url: /images/vcelarstvi/druhy/kranska.webp
  image_credit: Richard Bartz, Munich · Makro Freak
  image_source_url: https://commons.wikimedia.org/wiki/File:Apis_mellifera_carnica_worker_hive_entrance_3.jpg
  image_license: CC BY-SA 2.5
  wikipedia: https://cs.wikipedia.org/wiki/V%C4%8Dela_medonosn%C3%A1_kra%C5%88sk%C3%A1
- slug: tmava-vcela
  name: Темна бджола
  latinsky: Apis mellifera mellifera
  alternative_names:
    - європейська темна бджола
    - mellifera
  puvod: північна та західна Європа
  temperament: obranná
  medny_vynos: střední
  rojivost: střední
  zimuvzdornost: відмінна — первинна адаптація до суворого північноєвропейського клімату
  vhodnost_cr: >-
    Первісний підвид для середньоєвропейських ландшафтів; нині рідкісний, у Чехії та сусідніх
    країнах існують охоронні пасіки, спрямовані на збереження чистих популяцій.
  barva: темно-коричнева до чорної, мінімальне жовте забарвлення
  description: >-
    Темна бджола — це автохтонний європейський підвид медоносної бджоли, який протягом століть
    заселяв ліси й луки центральної та північної Європи. Відзначається темним забарвленням, міцною
    тілобудовою та чудовою пристосованістю до холодної й вологої зими. Весняний розвиток колонії
    повільніший порівняно з південноєвропейськими расами, проте ця бджола економно витрачає зимові
    запаси. Нині чисті популяції рідкісні й перебувають під охороною; у низці країн ведуться
    рятувальні програми для збереження генетичного різноманіття цього автохтонного європейського
    підвиду. Порівняно з іншими расами має більшу схильність до роїння, що слід враховувати під час
    утримання.
  image_url: /images/vcelarstvi/druhy/tmava-vcela.webp
  image_credit: Jürg Vollmer
  image_source_url: https://commons.wikimedia.org/wiki/File:Apis_mellifera_mellifera,_04.jpg
  image_license: CC BY-SA 4.0
  faq:
    - q: Чому чисті популяції темної бджоли такі рідкісні?
      a: >
        Темна бджола природно схрещується з завезеними лініями — карнікою, італійською бджолою
        чи бакфастом. Інтрогресія чужих генів поступово змінює морфологію й поведінку
        популяції. Тому охоронні пасіки обирають ізольовані місцевості, де природний приплив
        трутнів із чужих ліній мінімальний.
    - q: Чи підходить темна бджола для початківців?
      a: >
        Її виразніша оборонність вимагає досвідченішого поводження й послідовного використання
        захисного спорядження. Початківцям радше рекомендують карніку або бакфаст.
- slug: italka
  name: Італійська бджола
  latinsky: Apis mellifera ligustica
  alternative_names:
    - italka
    - ligustica
  puvod: Італія (Апеннінський півострів)
  temperament: mírná
  medny_vynos: velmi vysoký
  rojivost: střední
  zimuvzdornost: |
    нижча — чутлива до довгих холодних зим; більша витрата кормових запасів через велику літню сім’ю
  vhodnost_cr: >
    У тепліших районах південної Моравії та центральної Чехії дає добрі результати; у суворішому
    кліматі передгірських районів зимівля є складнішою (у Чехії).
  barva: жовта до золотавої з виразними жовтими кільцями на черевці
  description: >
    Італійська бджола належить до найпоширеніших у світі розведених рас завдяки золотавому забарвленню
    та винятковій медовій продуктивності. Матка дуже плідна, колонії досягають великої сили влітку й
    ефективно використовують основний медозбір. Вищий обсяг зимуючих бджіл, однак, підвищує
    споживання медових запасів; під час тривалої зими без достатнього підгодовування існує ризик
    голодування. У середньоєвропейському кліматі ця порода підходить насамперед досвідченим
    пасічникам, які здатні постійно контролювати запаси й у разі потреби поповнювати їх.
  image_url: /images/vcelarstvi/druhy/italka.webp
  image_credit: Chop2x
  image_source_url: https://commons.wikimedia.org/wiki/File:Ligustica_italian_bee_with_pollen.jpg
  image_license: CC BY-SA 3.0
  faq:
    - q: Чому італійська бджола споживає більше запасів, ніж карніка?
      a: >
        Матка італійської бджоли підтримує велику площу розплоду і наприкінці літа та восени,
        тож сім’я входить у зиму більшою. Більше бджіл означає більшу витрату меду, тому
        правильна оцінка кормових запасів перед зазимівлею є ключовою.
    - q: Чи схрещується італійська бджола в Чехії з карнікою?
      a: >
        Так — за вільного парування з трутнями з околиці відбувається природна гібридизація.
        Отримані сім’ї можуть виявляти підвищену оборонність, типову для міжпорідних
        гібридів. Чисту лінію можна втримати лише інструментальним осіменінням або
        в географічній ізоляції.
- slug: buckfast
  name: Buckfast
  latinsky: Apis mellifera (селекційний гібрид)
  alternative_names:
    - бджола бакфаст
    - бджола брата Адама
  puvod: Англія, абатство Buckfast (брат Адам, XX століття)
  temperament: mírná
  medny_vynos: velmi vysoký
  rojivost: nízká
  zimuvzdornost: >
    добра — лінії селекціонують зокрема на ощадливу зимівлю; конкретні результати різняться
    залежно від племінного господарства
  vhodnost_cr: >
    Популярна серед професійних пасічників і аматорів по всій Чехії; вимагає регулярного придбання
    перевірених маток у визнаних селекціонерів, оскільки нащадки власного розведення генетично
    розпадаються.
  barva: змінна — залежить від складу лінії; зазвичай бурого кольору з жовтими смугами
  description: >
    Buckfast — це селекційний гібрид, створений шляхом цілеспрямованої селекції братом Адамом в
    абатстві Buckfast на південному заході Англії, де він працював з 1915 року до 90-х років XX
    століття. Лінія поєднує гени Carnica, італійської бджоли та інших підвидів з метою досягнення
    одночасно миролюбності, високої продуктивності та низької ройливості. Господарські якості
    вирівняні та передбачувані — якщо бджоли походять від перевіреного селекціонера. Основне
    обмеження полягає в неможливості самостійного розведення маток: матка, облетілася у
    Buckfast-колонії, дає гібридних нащадків із непередбачуваними властивостями, тому пасічник
    повинен регулярно купувати чистопородних маток Buckfast.
  image_url: null
  faq:
    - q: Чому з бакфастівської сім’ї не можна виводити власних маток?
      a: >
        Бакфаст — це гібрид F1, складений із генетично відмінних ліній. Трутні, які паруються
        з новою маткою, зазвичай походять не з бакфастівського господарства, і нащадки
        (покоління F2) втрачають послідовні властивості. Сім’ї можуть раптово стати
        оборонними або ройливими. Пасічникові варто регулярно оновлювати маток
        у сертифікованого селекціонера.
    - q: Чи підходить бакфаст для початківців?
      a: >
        Лагідність бакфастівських бджіл — одна з їхніх головних селекційних властивостей, тож
        робота з вуликом зазвичай спокійніша. Проте потреба регулярно купувати нових маток
        є фінансовим і організаційним витратом, який початківці беруть до уваги.
- slug: kavkazska
  name: Кавказька бджола
  latinsky: Apis mellifera caucasica
  alternative_names:
    - kavkazanka
    - сіра гірська бджола
  puvod: Кавказ (переважно центральні та східні райони)
  temperament: mírná
  medny_vynos: vysoký
  rojivost: nízká
  zimuvzdornost: >
    середня — у сухому континентальному кліматі зимує добре; у вологому центральноєвропейському
    середовищі буває чутливішою до нозематозу
  vhodnost_cr: >-
    У Чехії утримується обмежено; цікава для регіонів із великою кількістю конюшини завдяки довгому
    хоботку; рясне прополісування ускладнює роботу з вуликом.
  barva: сіра до сіро-коричневої; загалом темніша, ніж Carnica
  description: >-
    Кавказька бджола вирізняється найдовшим хоботком серед усіх підвидів медоносної бджоли, що
    дозволяє їй діставати нектар з конюшини лучної, який для інших рас є важкодоступним. Сім’ї
    спокійні та мало роїться, тому робота з ними зручна. Інтенсивне вироблення прополісу —
    характерна кавказька риса — герметизує вулик, але під час огляду склеює рамки й ускладнює
    маніпуляції. У вологому кліматі Центральної Європи колонії можуть бути більш чутливими до
    нозематозу, ніж у сухішому кавказькому середовищі.
  image_url: /images/vcelarstvi/druhy/kavkazska.webp
  image_credit: Zeynel Cebeci
  image_source_url: https://commons.wikimedia.org/wiki/File:Honeybee_-_Balar%C4%B1s%C4%B1_01.jpg
  image_license: CC BY-SA 4.0
  faq:
    - q: Чим кавказька бджола цікава пасічникам у районах із конюшиною?
      a: >
        Кавказька бджола має помітно довший хоботок, ніж інші центральноєвропейські породи,
        завдяки чому дістає до нектарників віночка конюшини лучної. У районах із площами
        конюшини вона тому може приносити більше нектару, ніж породи з коротшим хоботком.
- slug: krajinka-sklenar
  name: Карніка лінії Sklenar
  latinsky: Apis mellifera carnica
  alternative_names:
    - Sklenar
    - linie Sklenar
  puvod: Австрія (племінне господарство Sklenar)
  temperament: mírná
  medny_vynos: vysoký
  rojivost: střední
  zimuvzdornost: відмінна — властивість, успадкована від базової карніки й закріплена селекцією
  vhodnost_cr: >
    Визнана племінна лінія, доступна через затверджених селекціонерів у Чехії та Австрії; підходить
    для пасічників, які шукають перевірену карніку з послідовними властивостями.
  barva: коричнево-сірий, типовий окрас карніки
  description: >
    Лінія Sklenar є однією з найвідоміших селекційних ліній виду Apis mellifera carnica, що походить
    з Австрії. Вона була створена шляхом тривалої селекції на миролюбність, низьку ройливість і
    високу продуктивність меду при збереженні відмінної зимостійкості карніки. Пасічники цінують її
    за передбачувану поведінку та легкість у роботі з колонією. Як і будь-яка племінна лінія, для
    збереження властивостей потребує придбання маток у визнаного селекціонера; власне вирощування
    від вільно спарених маток поступово призводить до вирівнювання властивостей.
  image_url: /images/vcelarstvi/druhy/krajinka-sklenar.webp
  image_credit: Richard Bartz, Munich · Makro Freak
  image_source_url: https://commons.wikimedia.org/wiki/File:Apis_mellifera_carnica_worker_honeycomb_2.jpg
  image_license: CC BY-SA 2.5
  faq:
    - q: Яка різниця між звичайною карнікою та лінією Sklenar?
      a: >
        Назва «карніка» охоплює весь підвид Apis mellifera carnica без гарантії конкретних
        властивостей — матки походять із різних господарств із різним рівнем селекції.
        Лінія Sklenar — це задокументована племінна лінія з підтвердженим походженням,
        де такі властивості, як лагідність і медова продуктивність, системно відстежують
        і підтверджують через покоління.
    - q: Де в Чехії можна придбати маток лінії Sklenar?
      a: >
        Матки доступні в зареєстрованих селекціонерів карніки, які співпрацюють з австрійськими
        та іншими закордонними господарствами. Інформацію про визнаних селекціонерів надає
        Чеська спілка бджолярів (Český svaz včelařů) та обласні племінні станції — тобто
        йдеться про чеську пропозицію, не про українську.
