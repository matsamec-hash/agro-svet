# Ukrajinský overlay včelařství. slug, latinské názvy, obrázky a odkazy
# zůstávají z cs. Údaje o vhodnosti pro ČR a ceny v Kč text označuje „у Чехії".
- slug: akatovy
  name: Акацієвий мед
  typ: kvetovy
  zdroj_snusky: акація (Robinia pseudoacacia)
  barva: світло-жовтий до майже прозорого
  chut: ніжний, солодкий, без вираженої кислинки
  krystalizace: velmi pomalá
  popis_kratky: Світлий квітковий мед з дуже повільною кристалізацією.
  description: >
    Акацієвий мед належить до найсвітліших і найніжніших медів. Завдяки високому вмісту фруктози
    кристалізується дуже повільно і довго залишається рідким.
  image_url: /images/vcelarstvi/med/akatovy.webp
  image_credit: Dr. Manavpreet Kaur
  image_source_url: https://commons.wikimedia.org/wiki/File:Honey_1.jpg
  image_license: CC BY-SA 4.0
- slug: kvetovy
  name: Квітковий мед
  typ: kvetovy
  zdroj_snusky: нектар різноманітних квітучих рослин
  barva: світло-жовта до золотистої
  chut: ніжний, гармонійний, з легким ароматичним відтінком
  krystalizace: střední
  popis_kratky: Найпоширеніший весняний мед світлого кольору з врівноваженим, універсальним смаком.
  description: >
    Квітковий мед утворюється з нектару різноманітних квітучих рослин, при цьому його смаковий
    профіль і колір залежать від ботанічного складу медозбору в конкретній місцевості та пори року.
    Це найпоширеніший тип меду, зібраного у Чехії, зазвичай світло-жовтого до золотистого кольору з
    ніжною, врівноваженою солодкістю. Кристалізується у середньому темпі, а в твердому стані має
    дрібнозернисту структуру.
  image_url: /images/vcelarstvi/med/kvetovy.webp
  image_credit: Kamalfencer
  image_source_url: https://commons.wikimedia.org/wiki/File:Honey_3.jpg
  image_license: CC BY-SA 4.0
- slug: medovicovy
  name: Медовий (лісовий) мед
  typ: medovicovy
  zdroj_snusky: медяна роса хвойних і листяних дерев
  barva: темно-коричнева до майже чорної
  chut: виразний, злегка гіркуватий, солодовий, з мінеральним відтінком
  krystalizace: pomalá
  popis_kratky: Темний лісовий мед з виразним смаком і високим вмістом мінеральних речовин.
  description: >
    Медовиковий мед не походить з нектару рослин, а з медяної роси — солодких виділень комах, що
    висмоктують сік із дерев, переважно попелиць і кліщів на хвойних (ялина, ялиця, сосна) та
    листяних (дуб, бук, клен) деревах. Бджоли збирають цю медяну росу і переробляють її так само, як
    і нектар. У порівнянні з квітковими медами містить більше мінеральних речовин, ферментів та
    олігосахаридів, що відображається у темнішому кольорі та виразнішому смаку. Кристалізується
    повільно, а основний період збору припадає переважно на літні місяці.
  image_url: /images/vcelarstvi/med/medovicovy.webp
  image_credit: Kottairajcs
  image_source_url: https://commons.wikimedia.org/wiki/File:Honey_2.jpg
  image_license: CC BY-SA 4.0
- slug: lipovy
  name: Липовий мед
  typ: kvetovy
  zdroj_snusky: квітка липи (Tilia sp.)
  barva: світло-жовтий із зеленкуватим відтінком
  chut: ароматний, свіжий, з легким ментоловим присмаком
  krystalizace: střední
  popis_kratky: Ароматний мед із зеленкуватим відтінком, традиційно асоціюється з підтримкою дихальних шляхів.
  description: >-
    Липовий мед отримують із нектару квітучих лип, у Чехії найчастіше з липи серцелистої (Tilia
    cordata) та липи широколистої (Tilia platyphyllos). Його вирізняє світло-жовтий колір із ніжним
    зеленкуватим відтінком і виражені ароматичні сполуки — ліналоол і фарнезол — які надають йому
    характерного, злегка ментолового тону. У місцевій народній медицині традиційно використовується
    при застудах і запаленнях верхніх дихальних шляхів, хоча науково підтверджені клінічні дані
    обмежені.
  image_url: /images/vcelarstvi/med/lipovy.webp
  image_credit: mueritz (Thomas Kohler)
  image_source_url: https://commons.wikimedia.org/wiki/File:Lindenhonig.jpg
  image_license: CC BY-SA 2.0
- slug: repkovy
  name: Ріпаковий мед
  typ: kvetovy
  zdroj_snusky: квітка ріпаку олійного (Brassica napus)
  barva: кремово-білий до світло-жовтого
  chut: ніжний, злегка солодкуватий, без виразного аромату
  krystalizace: rychlá
  popis_kratky: Світлий мед з дуже швидкою кристалізацією, який необхідно вчасно відкачати.
  description: >
    Ріпаковий мед кристалізується найшвидше серед усіх поширених видів меду — вже протягом
    двох-чотирьох тижнів після відкачування він переходить у щільну, дрібнозернисту структуру. Тому
    пасічники повинні відкачувати мед з ріпакової взятки одразу після запечатування стільників,
    інакше існує ризик затвердіння прямо у стільниках і неможливості відкачування. Після
    кристалізації мед пастують (керованим перемішуванням) до гладкої, намазуваної консистенції;
    готовий пастований ріпаковий мед має кремово-білий до світло-жовтого відтінок.
  image_url: null
- slug: pohankovy
  name: Гречаний мед
  typ: kvetovy
  zdroj_snusky: квітка гречки посівної (Fagopyrum esculentum)
  barva: темно-коричнева до червоно-коричневої
  chut: виразний, пряний, солодовий смак з легкою гіркуватістю
  krystalizace: střední
  popis_kratky: Темний мед з виразним солодовим смаком і високим вмістом антиоксидантів.
  description: >
    Гречаний мед належить до найтемніших і найвиразніших за смаком квіткових медів. Походить зі
    збору нектару на гречаних полях, який у Чехії відбувається переважно з липня по серпень.
    Відзначається високим вмістом флавоноїдів і фенольних сполук, що відповідає його темному кольору
    та сильній антиоксидантній активності, підтвердженій лабораторними методами. Кристалізується із
    середньою швидкістю, а у твердому стані має крупнозернисту структуру.
  image_url: null
- slug: pastovany
  name: Кремовий мед
  typ: smiseny
  zdroj_snusky: різноманітні (технологічна обробка — див. опис)
  barva: кремово-біла до світло-жовтої
  chut: ніжна, гладка, солодка, без виразного аромату
  krystalizace: střední
  popis_kratky: >-
    Кремовий мед — це не вид медозбору, а спосіб обробки: шляхом контрольованої кристалізації
    утворюється кремова, намазувана консистенція.
  description: >-
    Кремовий мед не є окремим ботанічним видом меду, а результатом технологічної обробки —
    контрольованого перемішування меду під час початкової кристалізації. До рідкого або
    дрібнокристалічного меду додається основа з уже закристалізованого меду з дуже дрібними
    кристалами (так званий зародковий мед), і вся маса при контрольованій температурі (зазвичай
    14–18 °C) регулярно перемішується, внаслідок чого утворюється однорідна, кремово-гладка
    структура без грубих кристалів. Готовий продукт легко намазується, не витікає з посудини, а його
    смаковий профіль залежить від початкового виду меду (найчастіше ріпаковий або змішаний
    весняний).
  image_url: null
