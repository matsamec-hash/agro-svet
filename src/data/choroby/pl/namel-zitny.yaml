# Polský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: namel-zitny
name: Sporysz żyta
puvodce: Grzyb Claviceps purpurea
popis: >-
  Sporysz jest chorobą grzybową zbóż i traw, najbardziej widoczną u żyta, które jest obcopylne i
  ma dłużej otwarte kwiaty. Zamiast ziarna w kłosie tworzy się ciemnofioletowe aż czarne rohlikowate
  sklerocjum (sporysz), które przerasta ziarno. Sklerocja zawierają toksyczne alkaloidy sporyszowe,
  które są niebezpieczne dla ludzi i zwierząt gospodarskich, dlatego zawartość sporyszu w zbożu
  przeznaczonym do spożycia i paszy jest legislacyjnie monitorowana i ograniczona.
priznaky: >-
  Pierwszym objawem jest w czasie kwitnienia słodka lepkawa ciecz (spadź) wydobywająca się z
  zaatakowanych kwiatów, na którą przylatuje owad. Później zamiast ziarna w kłosie tworzy się twarde
  rohlikowate sklerocjum — ciemnofioletowe do czarnego, zwykle wyraźnie dłuższe niż zdrowe ziarno i
  wystające z plew. W jednym kłosie bywa jedno do kilku sklerocjów.
hostitele:
  - Żyto (najbardziej podatne)
  - Pszenica, jęczmień, owies, tritikale
  - Trawy nasienne i chwasty trawiaste
sireni: >-
  Pierwotna infekcja pochodzi z askospor uwalnianych ze sklerocji, które przezimowały w glebie lub
  dostały się do nasion. Askospory infekują otwarte kwiaty w czasie kwitnienia; mszyce z konidiami
  przenoszą je na kolejne kwiaty. Wrażliwość zwiększa wszystko, co wydłuża i rozluźnia kwitnienie
  (zimna pogoda, rzadki łan, obcopylność).
skodlivost: >-
  Bezpośrednia utrata plonu bywa raczej niewielka, decydujące jest ryzyko zdrowotne i legislacyjne:
  sklerocja zawierają toksyczne alkaloidy sporyszowe, a ich zawartość w ziarnie przeznaczonym do
  spożycia i paszy jest prawem ograniczona. Przekroczenie limitu dyskwalifikuje partię. Historycznie
  sporysz powodował masowe zatrucia (ergotyzm).
cyklus: >-
  Grzyb przezimowuje jako sklerocja w glebie i w nasionach. Wiosną z nich wyrastają drobne owocniki
  (stromata) z askosporami, które inicjują infekcję kwitnących zbóż i traw. Po infekcji powstaje
  faza spadziowa (konidiowa) przenoszona przez owady, a na końcu tworzą się nowe sklerocja.
  Sklerocja z powierzchni gleby po głębokiej orce tracą zdolność kiełkowania.
ochrana: >-
  Chemiczna ochrona przed sporyszem nie jest skuteczna, decyduje agrotechnika. Pomaga użycie
  oczyszczonego, wolnego od sporyszu materiału siewnego, głęboka orka (sklerocja z powierzchni tracą
  zdolność kiełkowania), tłumienie kwitnących traw i resztek w okolicy pól jako źródeł zakażenia
  oraz zrównoważone, ciągłe kwitnienie łanu, które skraca czas podatności. Sklerocja są usuwane
  przez czyszczenie i sortowanie zebranego ziarna.
faq:
  - q: Dlaczego sporysz jest niebezpieczny?
    a: >-
      Sklerocja sporyszu zawiera alkaloidy sporyszowe, które są toksyczne dla ludzi i zwierząt
      (historycznie powodowały zatrucia zwane ergotyzmem). Dlatego jego zawartość w zbożu
      przeznaczonym do spożycia i paszy jest monitorowana i ograniczona prawnie.
  - q: Dlaczego żyto jest najbardziej zagrożone sporyszem?
    a: >-
      Żyto jest obcopylne, a jego kwiaty pozostają dłużej otwarte, co sprawia, że są łatwiej
      dostępne dla infekcji zarodnikami sporyszu w czasie kwitnienia. Zboża samopylne z szybkim
      zamykaniem kwiatów są atakowane rzadziej.
  - q: Czy można zwalczać sporysz fungicydem?
    a: >-
      Skuteczna chemiczna ochrona przed sporyszem nie istnieje. Decydujące są prewencyjne środki
      agrotechniczne — zdrowe oczyszczone nasiona, głęboka orka w celu zakrycia sklerocji, tłumienie
      kwitnących traw i czyszczenie zbiorów.
  - q: Jak sklerocja dostaje się z ziarna?
    a: >-
      Sklerocja są zazwyczaj dłuższe i lżejsze niż zdrowe ziarno, dlatego można je usunąć z partii
      poprzez dokładne czyszczenie i sortowanie (sita, sortowniki grawitacyjne i optyczne). W
      przypadku silnie zaatakowanej zbioru czyszczenie jest niezbędne do przestrzegania limitów.
