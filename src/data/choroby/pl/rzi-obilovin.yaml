slug: rzi-obilovin
name: Rdze zbóż
puvodce: Rdzawy grzyby z rodzaju Puccinia (rdza pszeniczna, rdza plewowa/żółta, rdza trawna)
popis: Rdze są grupą grzybowych chorób zbóż wywołanych rdzawymi grzybami z rodzaju Puccinia. Na liściach,
  pochwach i źdźbłach tworzą się rdzawobrązowe, żółte lub ciemne, proszkowate skupiska (uredospory), które
  łatwo się zmazują z ręki. Najpoważniejsze są rdza plewowa (żółta), rdza pszeniczna (brązowa) i rdza
  trawna (czarna). Silne porażenie zmniejsza powierzchnię asymilacyjną, przyspiesza obumieranie liści
  i może znacznie obniżyć plon oraz jakość ziarna, szczególnie w wilgotnej i ciepłej pogodzie.
priznaky: Rdza plewowa (żółta) tworzy cytrynowożółte skupiska spor ułożone w paski wzdłuż żyłek, najbardziej
  widoczne wczesną wiosną. Rdza pszeniczna (brązowa) ma drobne rdzawobrązowe, nieregularnie rozmieszczone
  skupiska na górnej stronie liści. Rdza trawna (czarna) tworzy ciemnobrązowe do czarnych podłużne skupiska,
  szczególnie na źdźbłach i pochwach. Ze wszystkich skupisk spory się zmazują i pozostawiają kolorowy
  ślad na palcach.
hostitele:
- Pszenica ozima i jara
- Jęczmień (w tym rdza jęczmienna)
- Żyto, owies, tritikale
- Trawy (żywiciele pośredni i rezerwuary)
sireni: Rdze rozprzestrzeniają się za pomocą uredospor przenoszonych przez wiatr na dużych odległościach,
  co umożliwia szybkie epidemie na dużą skalę. Rdza plewowa (żółta) preferuje chłodniejszą i wilgotną
  wiosnę, rdza pszeniczna (brązowa) oraz trawna cieplejszą pogodę. Infekcję wspomaga długotrwałe nawilżenie
  liści. Źródłem wiosennej infekcji są resztki pożniwne, ozimy oraz przelot spor z innych obszarów.
skodlivost: Rdze należą do najbardziej szkodliwych chorób liściowych zbóż; silne porażenie może w sprzyjających
  warunkach i podatnych odmianach zmniejszyć plon o dziesiątki procent. Najszybciej szkodzi rdza plewowa
  (żółta), która atakuje łan już wczesną wiosną i niszczy powierzchnię asymilacyjną w okresie tworzenia
  i wypełniania ziarna.
cyklus: Rdze mają skomplikowany cykl rozwojowy, często z kilkoma typami spor i u niektórych gatunków z
  przemiennością żywicieli (żywicielem pośrednim rdzy trawnej jest berberys). Przezimowują jako mycelium
  i uredospory na ozimych i resztkach pożniwnych, wiosną rozpoczynają infekcję, a w trakcie wegetacji
  rozmnażają się policyklicznie za pomocą uredospor. Na końcu sezonu tworzą ciemne teliospory przetrwalnikowe
  na resztkach.
ochrana: Kluczowy jest wybór odpornych odmian oraz monitorowanie łanów od początku wiosny. W przypadku
  wystąpienia stosuje się fungicydy (azole, strobiluryny, SDHI), najlepiej profilaktycznie lub na początku
  epidemii, z naprzemiennym stosowaniem substancji czynnych z powodu odporności. Usuwanie resztek pożniwnych
  i zakopywanie pozostałości po zbiorach ogranicza źródła infekcji. Zarejestrowanie preparatów należy
  sprawdzić w Rejestrze preparatów ochrony roślin URZ.
faq:
- q: Jak rozpoznać rdze od innych chorób zbóż?
  a: Dla rdzy charakterystyczne są proszkowate skupiska spor, które zmazują się na palcach i pozostawiają
    rdzawy lub żółty ślad. W ten sposób różnią się od mączniaka (biała powłoka) oraz od plamistości typu
    septoriozy (ograniczone nekrozy bez proszkowatych spor).
- q: Która rdza jest najniebezpieczniejsza?
  a: Bardzo niebezpieczna jest rdza plewowa (żółta), która pojawia się już wczesną wiosną i tworzy charakterystyczne
    żółte paski spor wzdłuż żyłek. W sprzyjających warunkach szybko się rozprzestrzenia i może powodować
    duże straty w plonie.
- q: Kiedy należy zastosować fungicyd przeciw rdzy?
  a: Najskuteczniejsza jest interwencja profilaktyczna lub zaraz na początku epidemii, gdy porażenie jest
    jeszcze niskie. W przypadku rdzy plewowej zazwyczaj jest to wczesną wiosną, a w przypadku rdzy pszenicznej
    później w czasie kłoszenia. Decydująca jest regularna kontrola łanu.
- q: Czy odporna odmiana pomaga przeciw rdzy?
  a: Tak, wśród odmian zbóż istnieją duże różnice w odporności na poszczególne rdze. Wybór odpornej odmiany
    jest najtańszym i najskuteczniejszym środkiem, który znacznie zmniejsza potrzebę stosowania fungicydów.
