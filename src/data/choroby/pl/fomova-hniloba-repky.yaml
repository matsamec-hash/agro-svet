# Polský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: fomova-hniloba-repky
name: Sucha zgnilizna kapustnych
puvodce: Grzyb Leptosphaeria maculans (anamorfa Phoma lingam)
popis: >-
  Sucha zgnilizna (czernienie stonku) jest znaczną chorobą rzepaku i innych roślin kapustnych.
  Jesienią na liściach pojawiają się jasne plamy z drobnymi czarnymi owocnikami; grzyb następnie
  przerasta ogonkiem liściowym do szyjki korzeniowej i podstawy łodygi, gdzie powoduje zażółcenie i
  suchą gniliznę. Zainfekowane rośliny łamią się, przedwcześnie dojrzewają i leżą, co prowadzi do
  znacznych strat w plonach. Pierwotne zakażenie pochodzi z askospor uwalnianych z resztek
  pożniwnych.
priznaky: >-
  Na jesiennych liściach powstają okrągłe białe do szarawych plam z rozproszonymi czarnymi
  piknidami. Najpoważniejszym objawem jest sucha gnilizna szyjki korzeniowej i podstawy łodygi, na
  przekroju z ciemnym, wyschniętym tkanką. Zainfekowane rośliny łatwo wyłamują się z ziemi, na
  wiosnę przedwcześnie dojrzewają, zmieniają kolor i leżą.
hostitele:
  - Rzepak ozimy i jary
  - Rzodkiewka
  - Warzywa kapustne
sireni: >-
  Głównym źródłem zakażenia są askospory uwalniane z resztek pożniwnych rzepaku podczas jesiennych
  deszczy; niosą się wiatrem na wschodzące łany. Infekcję wspiera wilgotna pogoda i umiarkowane
  temperatury jesienią. Choroba z liści przechodzi do łodygi poprzez stopniowe przerastanie ogonkiem
  liściowym, co trwa tygodnie do miesięcy.
skodlivost: >-
  Straty powstają przez zażółcenie i łamanie łodyg przed zbiorem, nawet w łanach, które jesienią
  wyglądały zdrowo. Przy silnym nacisku i wrażliwych odmianach mogą osiągnąć dziesiątki procent
  plonów. Szkodliwość ocenia się jesienią według udziału zainfekowanych roślin i głębokości
  zakażenia szyjki.
cyklus: >-
  Grzyb przezimowuje na resztkach pożniwnych rzepaku, gdzie dojrzewają owocniki (pseudothecia) z
  askosporami. Te rozpoczynają jesienne zakażenie liści, skąd grzyb przerasta do łodygi i przez zimę
  oraz wegetację kontynuuje. Krótki odstęp rzepaku i pozostawienie resztek na powierzchni znacznie
  zwiększają inokulum.
ochrana: >-
  Kluczowy jest wystarczający odstęp rzepaku w zmianowaniu (co najmniej 3–4 lata) oraz włączenie
  resztek pożniwnych, które są głównym źródłem askospor. Uprawiane są odporniejsze odmiany, a w
  zależności od nalotu spor i rozwoju łanu, jesienią (ewentualnie także wiosną) stosuje się
  fungicydy azolowe, które jednocześnie działają morforegulacyjnie. Rejestrację i dawkowanie należy
  sprawdzić w Rejestrze środków ochrony roślin.
faq:
  - q: Dlaczego sucha zgnilizna jest szczególnie niebezpieczna dla rzepaku?
    a: >-
      Grzyb przerasta od liści aż do szyjki korzeniowej i podstawy łodygi, którą zażółca i osłabia.
      Rośliny łamią się i leżą jeszcze przed zbiorem, co powoduje straty także w łanach, które
      jesienią wyglądały zdrowo.
  - q: Jak najlepiej zapobiegać suchej gniliznie?
    a: >-
      Najskuteczniejszą prewencją jest wystarczająco długi odstęp rzepaku na polu (3–4 lata),
      włączenie resztek pożniwnych oraz wybór odpornych odmian. Uzupełnia je jesienne leczenie
      fungicydowe w zależności od sygnalizacji nalotu spor.
  - q: Kiedy przeprowadzić jesienne leczenie przeciw suchej gniliznie?
    a: >-
      Leczenie kieruje się na okres od nalotu askospor, zwykle na rozwinięty jesienny łan w fazie
      około 4–8 liści, w zależności od sygnalizacji i przebiegu pogody. Preparaty azolowe
      jednocześnie wzmacniają i skracają łan przed zimą.
  - q: Czy wybór odmiany pomaga w walce z suchą gnilizną?
    a: >-
      Tak, między odmianami rzepaku są wyraźne różnice w odporności na suchą gniliznę, część z nich
      nosi specyficzne geny odporności. Odporna odmiana zmniejsza ryzyko oraz potrzebę intensywnej
      ochrony fungicydowej.
