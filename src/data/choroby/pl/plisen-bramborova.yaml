slug: plisen-bramborova
name: Zaraza ziemniaka
puvodce: Oomycet Phytophthora infestans
popis: Zaraza ziemniaka jest najniebezpieczniejszą chorobą ziemniaków i atakuje również pomidory. Na liściach
  tworzą się brązowo-czarne plamy, a na spodniej stronie liści w wilgotnych warunkach biały nalot zarodników;
  choroba szybko przechodzi na łodygę, a później na bulwy, gdzie powoduje brązową zgniliznę. W ciepłej
  i wilgotnej pogodzie może zniszczyć cały łan w ciągu kilku dni. Jest to ten sam patogen, który w XIX
  wieku spowodował irlandzki głód.
priznaky: Na liściach pojawiają się ciemnozielone do brązowo-czarnych wodnistych plam, początkowo często
  na brzegach i końcach liści. Na spodniej stronie liścia na granicy zdrowej i zaatakowanej tkanki w wilgotnych
  warunkach widoczny jest biały nalot sporangi. Zaatakowana łodyga szybko czernieje, gnije i wydziela
  nieprzyjemny zapach. Na bulwach pojawiają się szare, zapadnięte plamy, a pod skórką występuje rdzawobrązowa
  sucha do wilgotnej zgnilizna sięgająca do miąższu.
hostitele:
- Ziemniaki
- Pomidory
sireni: Choroba rozprzestrzenia się przez sporangia przenoszone przez wiatr i deszcz na dużą odległość.
  Kluczowe są wilgoć i ciepło — długotrwałe nawilżenie łodygi i temperatury około 15–22 °C (tzw. okresy
  blightowe). W tych warunkach nowy cykl infekcyjny zachodzi w ciągu kilku dni. Źródłem są zaatakowane
  bulwy (sadzeniaki, stosy zarażone) oraz zimujące oospory.
skodlivost: Zaraza ziemniaka jest najpoważniejszą chorobą ziemniaków; zaniedbana ochrona może w sprzyjających
  warunkach zniszczyć cały łan w ciągu jednego do dwóch tygodni. Zaatakowane bulwy gniją również w magazynie
  i są bramą do wtórnych bakteryjnych zgnilizn. Straty są więc liczone zarówno w plonach łodygi, jak i
  w możliwości przechowywania zbiorów.
cyklus: Patogen zimuje jako mycelium w zaatakowanych bulwach (sadzeniaki, stosy) oraz jako oospory w glebie.
  Z zainfekowanych bulw wyrasta zaatakowana łodyga, na której tworzą się sporangia inicjujące epidemię.
  W wilgotnych warunkach sporangia uwalniają ruchome zoospory, które infekują zarówno łodygę, jak i bulwy;
  cykl szybko się powtarza w sprzyjających warunkach.
ochrana: Kluczowa jest prewencyjna ochrona fungicydowa rozpoczęta zgodnie z sygnalizacją jeszcze przed
  pojawieniem się objawów i powtarzana w odstępach 7–14 dni w zależności od presji choroby i pogody (substancje
  systemowe na wzrost, kontaktowe na pokrycie, specyficzne na bulwy). Ważne jest zdrowe certyfikowane
  sadzeniaki, odpowiednie odgarnianie chroniące bulwy przed spłukiwaniem zarodników oraz osuszanie lub
  mechaniczne usuwanie łodygi przed zbiorem. Zarejestruj preparaty w Rejestrze preparatów ochrony roślin
  URZ.
faq:
- q: Dlaczego zaraza ziemniaka jest tak obawiana?
  a: Phytophthora infestans w ciepłej i wilgotnej pogodzie rozprzestrzenia się niezwykle szybko i potrafi
    zniszczyć cały łan w ciągu kilku dni. Atakuje również bulwy, które następnie gniją w przechowywaniu.
    Jest to ten sam patogen, który spowodował irlandzki głód.
- q: Jak bronić się przed zarazą ziemniaka?
  a: Kluczowa jest prewencyjna ochrona fungicydowa rozpoczęta zgodnie z sygnalizacją jeszcze przed wystąpieniem
    objawów i regularnie powtarzana. Uzupełnia ją zdrowe sadzeniaki, dobre odgarnianie chroniące bulwy
    oraz terminowe usunięcie łodygi przed zbiorem.
- q: Co to jest okres blightowy?
  a: Jest to okres pogody sprzyjającej infekcji zarazy ziemniaka — długotrwałe nawilżenie łodygi i temperatury
    około 15–22 °C. Modele prognozujące informują o tych okresach i służą do planowania prewencyjnych
    oprysków jeszcze przed pojawieniem się objawów.
- q: Dlaczego usuwać łodygę przed zbiorem?
  a: Zniszczenie łodygi (osuszanie lub mechanicznie) przerywa źródło zarodników i pozwala skórce bulw
    stwardnieć, co zmniejsza ryzyko infekcji bulw podczas zbioru. Zbiór w wilgotnej, nieusuniętej łodydze
    zwiększa ryzyko gnicia bulw w magazynie.
