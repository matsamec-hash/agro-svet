slug: plisen-seda
name: Szara pleśń
puvodce: Grzyb Botrytis cinerea
popis: Szara pleśń jest wszechobecną chorobą grzybową o bardzo szerokim zakresie żywicieli, od roślin
  uprawnych po warzywa i owoce. Na obumierających lub uszkodzonych tkankach tworzy się szary, pylisty
  nalot gęstego mycelium i zarodników. Grzyb zachowuje się głównie jako osłabiający (wtórny) patogen —
  przenika przez uszkodzenia, obumarłe płatki kwiatów lub osłabione tkanki i powoduje gnilizny w wilgotnej
  i chłodniejszej pogodzie. W przypadku buraka cukrowego i rzepaku atakuje liście i inne tkanki, szczególnie
  w gęstych, wilgotnych łanach.
priznaky: Typowym objawem jest szary do szaro-brązowego pylisty nalot, który z zaatakowanej tkanki przy
  dotyku się pyli (masy konidiów). Najpierw powstają wodniste, brązowiejące plamy na uszkodzonych lub
  obumierających częściach (płatki kwiatów, uszkodzenia, podstawa łodyg), skąd gnilizna postępuje do zdrowej
  tkanki. W zaatakowanych tkankach później tworzą się drobne czarne sklerocja.
hostitele:
- Rzepak i słonecznik
- Burak cukrowy
- Rośliny strączkowe i warzywa
- Winorośl i owoce (jagody)
sireni: Grzyb rozprzestrzenia się konidiami przenoszonymi przez wiatr i spływ. Kiełkowanie zarodników
  i infekcję wspiera długotrwałe nawilżenie tkanek, wysoka wilgotność powietrza i chłodniejsza pogoda
  (optymalnie około 15–20 °C). Bramą wejściową są uszkodzenia i obumarłe tkanki, dlatego ryzyko jest najwyższe
  w gęstych, leżących lub uszkodzonych przez mróz łanach.
skodlivost: W przypadku roślin uprawnych szara pleśń jest raczej towarzyszącą chorobą osłabionych łanów,
  znaczenie rośnie w przypadku warzyw, winorośli i owoców, gdzie powoduje gnilizny owoców przed zbiorem
  i po nim. Szkodliwość wzrasta w wilgotnych latach i w gęstych łanach; w przypadku przechowywanych owoców
  i warzyw należy do głównych przyczyn strat.
cyklus: Grzyb przezimowuje jako sklerocja i mycelium na resztkach roślinnych. W wilgoci z nich wyrastają
  konidiofory produkujące dużą ilość konidiów, które zapewniają powtarzające się rozprzestrzenianie się
  przez cały okres wegetacji. Botrytis łatwo atakuje obumierające tkanki i stąd rozprzestrzenia się do
  zdrowych; ma skłonność do powstawania odporności na fungicydy.
ochrana: Podstawą jest ograniczenie wilgotności w łanie (przewiewne łany, zrównoważone nawożenie) oraz
  zapobieganie uszkodzeniom roślin. Celowe zabiegi fungicydowe koncentrują się na ryzykownych okresach
  i osłabionych łanach; ze względu na skłonność Botrytis do odporności konieczne jest naprzemienne stosowanie
  substancji czynnych o różnym mechanizmie działania. Pomaga również wprowadzenie zaatakowanych resztek
  oraz w przypadku warzyw i owoców szybkie schłodzenie zbiorów. Rejestrację preparatów należy sprawdzić
  w Rejestrze preparatów ochrony roślin URS.
faq:
- q: Dlaczego szara pleśń pojawia się głównie na osłabionych roślinach?
  a: Botrytis cinerea jest głównie osłabiającym patogenem — najłatwiej przenika przez uszkodzenia, obumarłe
    płatki kwiatów lub tkanki osłabione stresem, mrozem czy inną chorobą. Zdrowe i dobrze odżywione łany
    są trudniej atakowane.
- q: Jakie warunki pogodowe sprzyjają szarej pleśni?
  a: Szara pleśń rozprzestrzenia się najbardziej w wilgotnej, chłodniejszej pogodzie i wysokiej wilgotności
    powietrza w gęstych łanach. Długotrwałe nawilżenie liści i słabe przewietrzanie znacznie zwiększają
    ryzyko.
- q: Dlaczego w przypadku szarej pleśni występuje problem z odpornością?
  a: Botrytis cinerea ma krótki cykl reprodukcyjny i dużą populację zarodników, więc szybko tworzy szczepy
    odporne na fungicydy. Dlatego kluczowe jest naprzemienne stosowanie substancji czynnych o różnym mechanizmie
    działania i unikanie polegania na jednej grupie.
- q: Jak ograniczyć szarą pleśń w przechowywanych owocach i warzywach?
  a: Pomaga zbiór zdrowych, nieuszkodzonych owoców w suchych warunkach, szybkie schłodzenie oraz utrzymywanie
    niskiej temperatury i odpowiedniej wilgotności w magazynie. Uszkodzone i zgniłe sztuki należy usunąć,
    ponieważ są źródłem dalszego rozprzestrzeniania się.
ucinne_latky:
- latka: fludioxonil + cyprodinil
- latka: boscalid + pyraclostrobin
- latka: fenhexamid
