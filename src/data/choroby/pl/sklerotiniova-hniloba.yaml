slug: sklerotiniova-hniloba
name: Zgnilizna twardzikowa
puvodce: Grzyb Sclerotinia sclerotiorum (u koniczyny S. trifoliorum)
popis: Zgnilizna twardzikowa (biała zgnilizna) jest poważną chorobą grzybową olejnin i roślin strączkowych
  z bardzo szerokim zakresem żywicieli. Na łodygach i szyjce korzeniowej tworzą się wodniste, brązowiejące
  zmiany z białym, watowatym grzybnią, wewnątrz i na powierzchni tkanek powstają twarde, czarne sklerocja.
  Rośliny zaatakowane przedwcześnie więdną, leżą i usychają; w przypadku rzepaku i słonecznika choroba
  należy do najgroźniejszych. Sklerocja przetrwają w glebie przez wiele lat i są źródłem infekcji.
priznaky: Na łodydze, najczęściej na wysokości kąta liści, początkowo powstaje wodnista, później wybielona,
  łuszcząca się zmiana; zaatakowana tkanka się rozwarstwia, a łodyga łamie się. Wewnątrz łodygi i na jej
  powierzchni znajduje się biała, watowata grzybnia oraz twarde, czarne sklerocja wielkości ziarna do
  fasoli. Roślina nad zmianą przedwcześnie żółknie, więdnie i dojrzewa; w wilgotnych warunkach zgnilizna
  jest miękka, w suchych sucha i wybielona.
hostitele:
- Rzepak i słonecznik
- Soja i inne rośliny strączkowe
- Koniczyna (Sclerotinia trifoliorum)
- Warzywa (marchew, sałata, fasola)
sireni: Źródłem infekcji są sklerocja w glebie, z których po nawilżeniu wyrastają drobne owocniki (apotecja)
  uwalniające askospory. Te infekują roślinę najczęściej przez opadłe płatki kwiatowe zatrzymane w kącie
  liści. Infekcję wspiera wilgotna pogoda w czasie kwitnienia oraz gęsty, bujny, zagęszczony łan z wysoką
  wilgotnością przy ziemi.
skodlivost: W przypadku rzepaku i słonecznika zgnilizna twardzikowa należy do najpoważniejszych chorób;
  zaatakowane rośliny przedwcześnie dojrzewają, łamią się i osypują, co może prowadzić do strat w plonach
  sięgających dziesiątek procent przy silnym nacisku. Sklerocja dodatkowo trwale zanieczyszcza glebę i
  obniża wartość gruntów dla kolejnych podatnych upraw.
cyklus: Grzyb przezimowuje jako sklerocja w glebie, gdzie przetrwa także przez wiele lat. Po odpowiednim
  nawilżeniu wyrastają z nich apotecja z askosporami; te rozpoczynają infekcję w czasie kwitnienia żywiciela.
  Po obumarciu rośliny w tkankach powstają nowe sklerocja, które wracają do gleby. Krótkie zmiany w uprawach
  z podatnymi roślinami gromadzą inokulum.
ochrana: Decydujące jest wystarczająco długi odstęp podatnych roślin w zmianowaniu (rzepak, słonecznik,
  soja, koniczyna) oraz ograniczenie zbyt gęstych, bujnych łanów. Ochrona fungicydowa w przypadku rzepaku
  koncentruje się na okresie kwitnienia, kiedy infekcja zachodzi przez opadłe płatki kwiatowe. Pomaga
  również biologiczna ochrona (Coniothyrium minitans) rozkładająca sklerocja w glebie. Zarejestrowanie
  preparatów należy sprawdzić w Rejestrze preparatów ochrony roślin URZĄD.
faq:
- q: Dlaczego zgnilizna twardzikowa jest tak trudna do zwalczenia?
  a: Patogen ma bardzo szeroki zakres żywicieli i tworzy odporne sklerocja, które w glebie przetrwają
    przez wiele lat. Krótkie zmiany w uprawach z rzepakiem, słonecznikiem i roślinami strączkowymi gromadzą
    więc inokulum w glebie, a jednorazowe środki nie wystarczą.
- q: Kiedy w przypadku rzepaku podejmuje się działania przeciwko zgniliźnie twardzikowej?
  a: Kluczowy jest okres kwitnienia rzepaku, kiedy grzyb infekuje roślinę przez opadłe płatki kwiatowe
    zatrzymane w kącie liści. Fungicyd należy więc stosować na początku aż do pełnego kwitnienia, w zależności
    od przebiegu pogody i nacisku choroby.
- q: Jak działa biologiczna ochrona przeciwko zgniliźnie twardzikowej?
  a: Preparat z grzybem Coniothyrium minitans jest wprowadzany do gleby, gdzie pasożytuje i rozkłada sklerocja
    zgnilizny twardzikowej. W ten sposób zmniejsza zapas inokulum w glebie, jednak działanie jest powolne
    i służy raczej jako długoterminowe działanie prewencyjne.
- q: Które rośliny są najbardziej zagrożone zgnilizną twardzikową?
  a: Najbardziej wrażliwe są rzepak i słonecznik, a także soja i inne rośliny strączkowe, koniczyna oraz
    wiele gatunków warzyw. Ponieważ jest wiele podatnych roślin, przy planowaniu zmianowania należy uwzględnić
    ich wzajemne ryzyko.
