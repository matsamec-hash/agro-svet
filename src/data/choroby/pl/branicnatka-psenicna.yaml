slug: branicnatka-psenicna
name: Septorioza liści pszenicy (Zymoseptoria tritici)
puvodce: Grzyb Zymoseptoria tritici (wcześniej Septoria tritici / Mycosphaerella graminicola)
popis: Septorioza liści pszenicy jest w Polsce jedną z najważniejszych chorób liści pszenicy. Na liściach
  tworzą się podłużne żółtawe do brązowych plamy ograniczone żyłkami, w których widoczne są drobne czarne
  owocniki (pyknidy). Choroba postępuje od dolnych liści ku górnym i w wilgotnych warunkach może zniszczyć
  także liść flagowy, co znacząco obniża plon.
priznaky: Na liściach najpierw pojawiają się drobne wodniste plamki, które wydłużają się wzdłuż żyłek
  do nieregularnych żółto-brązowych do szarawych nekroz z ciemnym obrzeżem. W plamach gołym okiem widoczne
  są czarne kropki — pyknidy z zarodnikami. Infekcja postępuje od dołu do góry; przy silnym nacisku obumierają
  górne liście, w tym liść flagowy, a łan przedwcześnie wysycha.
hostitele:
- Pszenica ozima i jara
- Tritikale
- Sporadycznie inne trawy i zboża
sireni: Pierwotna infekcja pochodzi z askospor uwalnianych z resztek pożniwnych, w łanie choroba dalej
  rozprzestrzenia się konidiami spłukiwanymi kroplami deszczu na wyższe piętra liści. Infekcję wspiera
  wilgotna i umiarkowana pogoda (około 15–20 °C) oraz długotrwałe nawilżenie liści. Gęsty, bujny łan przyspiesza
  rozprzestrzenianie.
skodlivost: Septorioza należy do najgroźniejszych chorób liści pszenicy; uszkodzenie górnych liści i liścia
  flagowego bezpośrednio obniża masę ziarna. Straty w plonie przy silnym porażeniu i sprzyjającej pogodzie
  mogą wynosić dziesiątki procent. Patogen jest podatny na rozwój odporności na substancje czynne.
cyklus: Grzyb przezimowuje na resztkach pożniwnych pszenicy i w ozimie jako mycelium. Askospory rozpoczynają
  wiosenną infekcję dolnych liści, skąd choroba polikrotnie rozprzestrzenia się konidiami na górne piętra
  przez całe wiosnę. Szczególnie niebezpieczny jest długi okres utajenia (nawet kilka tygodni), podczas
  którego infekcja nie jest widoczna.
ochrana: Ważne jest uprawianie odporniejszych odmian, wykluczenie pszenicy po pszenicy oraz wprowadzenie
  resztek pożniwnych (źródło infekcji) do gleby. Ochrona fungicydowa koncentruje się na górnych liściach
  i liściu flagowym w fazie strzelania w źdźbło do kłoszenia; stosuje się azole oraz substancje z grupy
  SDHI, wskazane jest naprzemienne stosowanie i łączenie substancji czynnych ze względu na odporność.
  Rejestrację i dawkowanie należy sprawdzić w Rejestrze środków ochrony roślin.
faq:
- q: Dlaczego ochrona liścia flagowego w przypadku septoriozy jest kluczowa?
  a: Liść flagowy i liść podflagowy stanowią istotną część powierzchni asymilacyjnej, która wypełnia ziarno.
    Ich uszkodzenie przez septoriozę bezpośrednio obniża masę ziarna i plon, dlatego zabieg fungicydowy
    jest planowany tak, aby chronić te liście.
- q: Jak rozprzestrzenia się septorioza?
  a: Pierwotna infekcja pochodzi z resztek pożniwnych (askospory), w łanie rozprzestrzeniają się następnie
    zarodniki (konidie) spłukiwane kroplami deszczu na wyższe piętra liści. Wilgotna i umiarkowana pogoda
    znacząco wspiera rozprzestrzenianie.
- q: Dlaczego w przypadku septoriozy występuje problem z odpornością?
  a: Zymoseptoria tritici jest bardzo podatna na rozwój odporności, a w Polsce i Europie opisano spadek
    skuteczności wielu azoli i SDHI. Dlatego zaleca się naprzemienne i łączenie substancji czynnych o
    różnych mechanizmach działania oraz dodawanie substancji wieloskładnikowych.
- q: Jak odróżnić septoriozę od innych plamistości liści?
  a: Charakterystyczne są wydłużone nekrozy ograniczone żyłkami z widocznymi czarnymi pyknidami w plamach.
    W przeciwieństwie do rdzy nie tworzą one proszkowatych skupisk zarodników, a w przeciwieństwie do
    mączniaka nie mają białego nalotu na powierzchni liścia.
