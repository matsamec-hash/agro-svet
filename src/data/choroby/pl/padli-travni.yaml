# Polský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: padli-travni
name: Mączniak prawdziwy zbóż i traw
puvodce: Grzyb Blumeria graminis (wcześniej Erysiphe graminis)
popis: >-
  Mączniak prawdziwy zbóż i traw jest najpowszechniejszą chorobą grzybową zbóż. Na liściach,
  pochwach liściowych, a później także na kłosach tworzy się charakterystyczny biały do szarawego
  mączysty nalot mycelium, który stopniowo brązowieje, a w nim dojrzewają ciemne owocniki
  (kleistotecja). Zaatakowana tkanka żółknie i przedwcześnie obumiera, co prowadzi do spadku
  powierzchni asymilacyjnej, masy ziarna i plonu. Choroba rozprzestrzenia się szczególnie w ciepłej
  i wilgotnej pogodzie w gęstych, przefosforowanych łanach.
priznaky: >-
  Typowym objawem jest biały do szarawego mączysty (watowaty) nalot na górnej i dolnej stronie
  liści, pochwach liściowych i źdźbłach, który można początkowo zetrzeć palcem. Nalot stopniowo
  szarzeje i brązowieje, a w nim pojawiają się drobne czarne ciałka (kleistotecja). Pod nalotem
  tkanka żółknie i wysycha; atak postępuje od dolnych liści ku górze, przy silnym nacisku także na
  kłosy.
hostitele:
  - Pszenica ozima i jara
  - Jęczmień
  - Żyto, owies, tritikale
sireni: >-
  Mączniak rozprzestrzenia się konidiami przenoszonymi przez wiatr. Do infekcji nie potrzebuje
  wilgoci kroplowej (w przeciwieństwie do większości chorób liściowych), wystarczy wysoka wilgotność
  powietrza i temperatury około 15–22 °C. Rozprzestrzenianie się znacząco wspierają gęste, bujne i
  przefosforowane łany z ograniczonym przepływem powietrza. Źródłem wiosennej infekcji jest resztka
  pożniwna i oziminy.
skodlivost: >-
  Silne porażenie zmniejsza powierzchnię asymilacyjną, przyspiesza starzenie liści i zmniejsza masę
  ziarna; straty w plonie w sprzyjających warunkach i podatnych odmianach wynoszą zazwyczaj od kilku
  do kilkudziesięciu procent. Próg szkodliwości ocenia się według udziału zaatakowanej powierzchni
  liści w dolnych partiach.
cyklus: >-
  Grzyb przezimowuje jako mycelium na oziminach i resztkach pożniwnych oraz jako kleistotecja na
  resztkach. Wiosną produkuje konidia, które inicjują polikliniczne rozprzestrzenianie się, które w
  sprzyjających warunkach odbywa się w krótkich cyklach przez cały okres wegetacji. Patogen ma
  wyspecjalizowane formy (formae speciales) związane z poszczególnymi gatunkami zbóż.
ochrana: >-
  Podstawą jest wybór odpornych odmian, zrównoważone nawożenie azotowe (przefosforowanie zwiększa
  ryzyko) oraz odpowiednia gęstość łanu. Po przekroczeniu progu szkodliwości stosuje się fungicydy z
  grupy azoli, morfolinów lub specyficznych substancji przeciwko mączniakowi, często w kombinacji na
  liście i ochronę kłosa. Ważne jest naprzemienne stosowanie substancji czynnych w celu zapobiegania
  oporności; rejestrację należy sprawdzić w Rejestrze środków ochrony roślin.
faq:
  - q: Które rośliny najczęściej atakuje mączniak prawdziwy?
    a: >-
      Mączniak prawdziwy atakuje większość zbóż — pszenicę, jęczmień, owies, żyto i tritikale.
      Patogen ma co prawda wyspecjalizowane formy (formae speciales) związane z konkretnym
      gatunkiem, ale jako choroba występuje w całym spektrum zbóż.
  - q: Jak rozpoznać mączniaka na zbożu?
    a: >-
      Typowym objawem jest biały mączysty nalot na liściach i źdźbłach, który można początkowo
      zetrzeć palcem. Stopniowo ciemnieje, a w nim pojawiają się drobne czarne owocniki. Zaatakowane
      liście żółkną i przedwcześnie wysychają.
  - q: Dlaczego mączniak sprzyja gęstym i przefosforowanym łanom?
    a: >-
      W gęstym i przefosforowanym łanie jest wyższa wilgotność powietrza, gorsza wentylacja oraz
      miększe, bardziej podatne tkanki. To tworzy idealne warunki do rozprzestrzeniania się
      mączniaka, dlatego zrównoważone nawożenie i gęstość łanu są częścią ochrony.
  - q: Czy mączniak potrzebuje deszczu do infekcji?
    a: >-
      Nie. W przeciwieństwie do większości chorób liściowych mączniak do kiełkowania zarodników nie
      potrzebuje wody kroplowej, wystarczy mu wysoka wilgotność powietrza. Dlatego może się
      rozprzestrzeniać także w okresach bez obfitych opadów, jeśli łany są gęste i wilgotne.
