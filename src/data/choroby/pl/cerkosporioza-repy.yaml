# Polský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: cerkosporioza-repy
name: Chwościk buraka
puvodce: Grzyb Cercospora beticola
popis: >-
  Chwościk buraka jest najpowszechniejszą i najważniejszą chorobą liści cukrowej. Na liściach tworzą
  się drobne okrągłe plamy ze jasnym środkiem i ciemnobrązowym do czerwono-fioletowego obrzeżem;
  przy silnym porażeniu plamy zlewają się, a liście obumierają. Roślina zastępuje obumarłe liście
  nowymi kosztem gromadzenia cukru w bulwie, co prowadzi do spadku plonów i zawartości cukru.
  Choroba rozprzestrzenia się w ciepłej i wilgotnej pogodzie w drugiej połowie wegetacji.
priznaky: >-
  Pierwszymi objawami są drobne okrągłe plamy (2–3 mm) z popielato-szarym środkiem i wyraźnie
  ograniczonym ciemnobrązowym do czerwono-fioletowego obrzeżem. W centrum plam w wilgotnych
  warunkach widoczne są drobne czarne skupiska konidioforów. Plamy stopniowo się zlewają, liść
  żółknie, brązowieje i obumiera; najpierw atakowane są starsze zewnętrzne liście. Silnie porażone
  łany wyglądają jak spalone.
hostitele:
  - Cukrowa burak
  - Burak pastewny
  - Szpinak i burak sałatowy (mniej znacząco)
sireni: >-
  Grzyb rozprzestrzenia się przez konidia przenoszone wiatrem, deszczem i techniką rolniczą. Optimum
  do infekcji to ciepła i wilgotna pogoda (około 25–30 °C w ciągu dnia, nocne nawilżenie liści).
  Źródłem pierwotnej infekcji są porażone resztki pożniwne buraka i gleba, dlatego ryzyko jest
  najwyższe na polach z krótkim odstępem buraka.
skodlivost: >-
  Chwościk buraka należy do ekonomicznie najpoważniejszych chorób cukrowej. Powtarzająca się utrata
  powierzchni liści i jej odbudowa pochłania cukry; straty w plonach bulw i zawartości cukru mogą
  przy zaniedbanej ochronie osiągnąć dziesiątki procent. Interwencja następuje według sygnalizacji
  na początku wystąpienia pierwszych plam.
cyklus: >-
  Grzyb przezimowuje jako mycelium i pseudostromata na resztkach pożniwnych buraka w glebie, gdzie
  przetrwa nawet kilka lat. Wiosną produkuje konidia inicjujące pierwotną infekcję; w ciepłe i
  wilgotne lato odbywa się szereg infekcji policyklicznych. Krótki zmiennik z burakiem gromadzi
  inokulum w glebie.
ochrana: >-
  Podstawą jest uprawa odmian tolerancyjnych, przestrzeganie zmienności z odstępem buraka (co
  najmniej 3 lata) oraz włączenie porażonej reszty. Ochrona fungicydowa rozpoczyna się według
  sygnalizacji na początku wystąpienia i powtarza się w zależności od presji choroby; konieczne jest
  stosowanie różnych substancji czynnych z powodu szerokiej odporności Cercospora beticola.
  Rejestrację i dawkowanie należy sprawdzić w Rejestrze środków ochrony roślin.
faq:
  - q: Jak chwościk buraka obniża plon cukrowej?
    a: >-
      Porażone liście obumierają, a roślina musi je zastępować tworzeniem nowych, co pochłania
      energię i cukry, które w przeciwnym razie zostałyby zgromadzone w bulwie. W rezultacie
      następuje niższy plon bulw i spadek zawartości cukru.
  - q: Kiedy interweniuje się przeciwko chwościkowi buraka?
    a: >-
      Zabiegi rozpoczynają się według sygnalizacji zaraz na początku wystąpienia pierwszych plam,
      zazwyczaj w drugiej połowie lata, a w zależności od przebiegu pogody i presji choroby mogą być
      powtarzane przy zachowaniu zmiany substancji czynnych.
  - q: Jak odróżnić chwościk buraka od plamistości ramulariowej?
    a: >-
      Chwościk buraka tworzy mniejsze plamy z wyraźnym ciemnobrązowym do czerwono-fioletowego
      obrzeżem, podczas gdy plamistość ramulariowa ma plamy jaśniejsze, większe i z mniej ostrym
      brzegiem. Dokładne odróżnienie potwierdzi analiza, jednak ochrona w dużej mierze się pokrywa.
  - q: Dlaczego w przypadku chwościka buraka występuje szeroka odporność?
    a: >-
      Cercospora beticola ma wysoką zdolność reprodukcyjną, a w Polsce i Europie opisano spadek
      skuteczności wielu azoli i strobiluryn. Dlatego zaleca się stosowanie różnych substancji
      czynnych o odmiennym mechanizmie działania oraz uzupełnianie ich preparatami multisystemowymi.
