# Polský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: alternariova-skvrnitost
name: Alternarioza (czerń krzyżowych)
puvodce: Grzyby z rodzaju Alternaria (np. A. brassicae, A. brassicicola)
popis: >-
  Alternarioza (czerń) jest grzybową chorobą przede wszystkim roślin oleistych z rodziny
  kapustowatych oraz słonecznika. Na liściach, łodygach i strąkach tworzą się ciemne, często
  koncentrycznie strefowane plamy z szaro-czarnym nalotem sporulacyjnym. U rzepaku choroba głównie
  atakuje strąki, które przedwcześnie pękają i osypują się, co powoduje straty w zbiorach i pogarsza
  jakość nasion. Choroba rozprzestrzenia się w wilgotnej, cieplejszej pogodzie pod koniec wegetacji.
priznaky: >-
  Na liściach powstają ciemno-brązowe do czarnych okrągłe plamy z wyraźną koncentryczną strefowością
  (tarczowa struktura) i często z żółtym otoczeniem. W wilgotnych warunkach pokrywają je
  szaro-czarny aksamitny nalot konidiów. Na łodygach i strąkach pojawiają się wydłużone czarne
  plamy; zaatakowane strąki przedwcześnie dojrzewają, deformują się i pękają. Silnie zaatakowane
  liście żółkną i przedwcześnie opadają.
hostitele:
  - Rzepak ozimy i jary
  - Gorczyca
  - Warzywa kapustne (kapusta, brukselka, brokuły)
  - Słonecznik
sireni: >-
  Grzyb rozprzestrzenia się konidiami przenoszonymi przez wiatr i deszcz. Infekcję wspiera ciepła i
  wilgotna pogoda (optymalna temperatura wynosi około 18–25 °C) oraz długotrwałe nawilżenie roślin w
  drugiej połowie wegetacji, szczególnie w czasie dojrzewania strąków. Znaczącym źródłem pierwotnej
  infekcji jest zainfekowane nasiono oraz pozostałości po zbiorach roślin kapustnych.
skodlivost: >-
  Główne straty powstają w wyniku ataku na strąki, ich przedwczesnego pękania i osypywania nasion
  przed zbiorami i w trakcie zbiorów. Straty w plonach rzepaku, w zależności od intensywności ataku
  i warunków pogodowych, zwykle wynoszą kilka procent, a przy silnym nacisku mogą być wyższe.
  Zainfekowane nasiona mają niższą masę tysiąca nasion (HTS) i gorszą zawartość oleju.
cyklus: >-
  Grzyb przezimowuje na pozostałościach po zbiorach i w zainfekowanym nasieniu jako mycelium i
  konidia. Wiosną i latem produkuje nowe konidia, które zapewniają powtarzające się (policykliczne)
  rozprzestrzenianie się w łanie. Najbardziej podatny jest rzepak w okresie od kwitnienia do
  dojrzewania strąków.
ochrana: >-
  Pomaga przestrzeganie zmienności upraw z odstępem roślin kapustnych (co najmniej 3–4 lata),
  wprowadzenie pozostałości po zbiorach do gleby oraz zaprawianie nasion. Ochrona fungicydowa w
  okresie dojrzewania strąków (często w połączeniu z zabiegiem przeciwko zgniliźnie twardzikowej)
  ogranicza atak na strąki i osypywanie; rejestracja i dawkowanie preparatów muszą być potwierdzone
  w Rejestrze środków ochrony roślin. Terminowy i nieprzedłużający się zbiór dodatkowo zmniejsza
  straty.
faq:
  - q: Które części rzepaku najczęściej uszkadza alternaria?
    a: >-
      Z punktu widzenia plonów najwrażliwsze są strąki. Zainfekowane strąki przedwcześnie
      dojrzewają, pękają i osypują się, co prowadzi do strat tuż przed zbiorami i w trakcie zbiorów.
      Plamy na liściach i łodygach są zazwyczaj mniej istotne.
  - q: Czy alternarioza różni się od czerni rzepakowych tkanek?
    a: >-
      Są to pokrewne choroby tego samego rodzaju — czerń tkanek rzepakowych wywołuje głównie
      Alternaria brassicae. W praktyce objawy i ochrona się pokrywają, a obie choroby zalicza się do
      alternarioz roślin kapustnych.
  - q: Kiedy podejmuje się działania przeciwko alternariozie rzepaku?
    a: >-
      Zabiegi kieruje się na okres dojrzewania strąków, kiedy ryzyko infekcji i osypywania jest
      najwyższe. W praktyce często łączy się je z fungicydowym zabiegiem przeciwko zgniliźnie
      twardzikowej w czasie kwitnienia do końca kwitnienia.
  - q: Czy alternaria przenosi się przez nasiona?
    a: >-
      Tak, zainfekowane nasiona są istotnym źródłem zakażenia i przenoszą grzyba na nowe łany.
      Dlatego zaprawianie nasion i stosowanie zdrowych, certyfikowanych nasion należy do
      podstawowych działań prewencyjnych.
