# Polský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: fuzariozy
name: Fuzariozy
puvodce: Grzyby z rodzaju Fusarium (np. F. graminearum, F. culmorum)
popis: >-
  Fuzariozy są grupą chorób wywoływanych przez grzyby z rodzaju Fusarium, które atakują korzenie,
  źdźbło, kłos i kolbę wielu roślin. U zbóż najpoważniejsza jest fuzarioza kłosa, objawiająca się
  przedwcześnie wybielonymi kłoskami i różowym nalotem na ziarnie; u kukurydzy, roślin strączkowych
  i oleistych dominują gnilizny korzeni i łodyg. Oprócz strat w plonach ryzykiem jest powstawanie
  mykotoksyn (szczególnie deoksywalanolu, DON), które pogarszają zdrowotność ziarna i pasz.
priznaky: >-
  U fuzariozy kłosa poszczególne kłoski lub całe części kłosa przedwcześnie wybielają się, podczas
  gdy zdrowe otoczenie pozostaje zielone; w wilgotnych warunkach na kłoskach i ziarnie widoczny jest
  różowy do łososiowego nalot grzybni. Ziarno jest pomarszczone, matowe i ma niską masę. U korzeni i
  źdźbła powstają brązowe, wyschnięte gnilizny, rośliny przedwcześnie dojrzewają i leżą; u kukurydzy
  gniją korzenie, źdźbło i kolba.
hostitele:
  - Pszenica i jęczmień
  - Kukurydza
  - Owies, żyto, tritikale
  - Rośliny strączkowe i oleiste (gnilizny korzeni i łodyg)
sireni: >-
  Źródłem zakażenia są resztki pożniwne (szczególnie kukurydzy) oraz zainfekowane nasiona. Infekcja
  kłosa zachodzi w czasie kwitnienia w ciepłej i wilgotnej pogodzie (deszcz podczas kwitnienia jest
  głównym czynnikiem ryzyka). Spory rozprzestrzeniają się wiatrem i spływem; zakażenie wspiera
  minimalne przetwarzanie pozostawiające resztki na powierzchni.
skodlivost: >-
  Oprócz bezpośredniej straty plonów i obniżenia HTS głównym ryzykiem jest kontaminacja ziarna
  mykotoksynami, przede wszystkim deoksywalanolem (DON) i zearalenonem, których limity w zbożach
  przeznaczonych do żywności i pasz są ustawowo określone. Przekroczenie limitu może zdewaluować
  całą partię, dlatego fuzarioza kłosa ma również istotny wpływ na higienę.
cyklus: >-
  Grzyby przezimowują jako grzybnia i odporne formy (chlamydospory, peritecje) na resztkach
  pożniwnych i w glebie. Wiosną i latem produkują spory (askospory i konidia), które infekują kłosy
  w czasie kwitnienia i korzenie przez cały okres wegetacji. Ryzykowne jest uprawianie zbóż po
  kukurydzy.
ochrana: >-
  Podstawą jest zrównoważone zmianowanie (szczególnie ryzykowne jest uprawianie pszenicy po
  kukurydzy), jakościowe przetwarzanie i włączenie resztek pożniwnych oraz wybór mniej podatnych
  odmian. W przypadku zbóż celuje się w fungicydowe leczenie azolami do okresu kwitnienia zgodnie z
  sygnalizacją i prognozą opadów. Kluczowe jest również zbieranie w suchej pogodzie i szybkie
  dosuszanie ziarna, co ogranicza powstawanie mykotoksyn; zarejestrowanie preparatów należy
  sprawdzić w Rejestrze środków ochrony roślin URSUS.
faq:
  - q: Czym są fuzariozy niebezpieczne oprócz straty plonów?
    a: >-
      Grzyby z rodzaju Fusarium produkują mykotoksyny, przede wszystkim deoksywalanol (DON) i
      zearalenon. Mogą one kontaminować zboża przeznaczone do żywności i pasz, a w ziarnie są
      ustawowo monitorowane limity, dlatego fuzariozy zagrażają również zdrowotności produkcji.
  - q: Która przedplon zwiększa ryzyko fuzarioz?
    a: >-
      Najbardziej ryzykowne jest uprawianie zbóż (szczególnie pszenicy) po kukurydzy, której resztki
      pożniwne są istotnym źródłem zakażenia. Ryzyko zwiększa również minimalne przetwarzanie gleby
      pozostawiające resztki na powierzchni.
  - q: Kiedy przeprowadzić fungicydowe leczenie przeciwko fuzariozie kłosa?
    a: >-
      Najskuteczniejsze jest leczenie w czasie kwitnienia zbóż, kiedy grzyb infekuje kłos. Termin
      zależy od sygnalizacji i prognozy opadów — deszcz podczas kwitnienia znacznie zwiększa ryzyko,
      dlatego leczenie przeprowadza się przed przewidywanym deszczowym okresem.
  - q: Jak zmniejszyć zawartość mykotoksyn w już zaatakowanej plantacji?
    a: >-
      Po zakażeniu pomocne jest zbieranie w suchej pogodzie, ustawienie młocarni na odrzucenie
      lekkiego pomarszczonego ziarna oraz szybkie dosuszanie i czyszczenie zbiorów. Przechowywanie
      wilgotnego, zainfekowanego ziarna dodatkowo zwiększa powstawanie mykotoksyn.
