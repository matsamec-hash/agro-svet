slug: cerkosporioza-repy
name: Cerkosporióza řepy
latinsky: Cercospora beticola
puvodce: Houba Cercospora beticola
popis: >-
  Cerkosporióza je nejrozšířenější a nejvýznamnější listová choroba cukrovky. Na
  listech se tvoří drobné okrouhlé skvrny se světlým středem a tmavě hnědým až
  červenofialovým lemem; při silném napadení skvrny splývají a listy odumírají.
  Rostlina nahrazuje odumřelé listy novými na úkor ukládání cukru do bulvy, takže
  klesá výnos i cukernatost. Choroba se šíří za teplého a vlhkého počasí ve druhé
  polovině vegetace.
priznaky: >-
  Prvními příznaky jsou drobné okrouhlé skvrny (2–3 mm) s popelavě šedým středem a
  ostře ohraničeným tmavě hnědým až červenofialovým lemem. Ve středu skvrn jsou za
  vlhka patrné drobné černé kupky konidioforů. Skvrny postupně splývají, list
  žloutne, hnědne a odumírá; nejprve jsou zasaženy starší vnější listy. Silně
  napadené porosty vypadají jako spálené.
hostitele:
  - Cukrovka
  - Krmná řepa
  - Špenát a řepa salátová (méně významně)
sireni: >-
  Houba se šíří konidiemi přenášenými větrem, deštěm a strojní technikou. Optimum
  pro infekci je teplé a vlhké počasí (přibližně 25–30 °C ve dne, noční ovlhčení
  listů). Zdrojem primární nákazy jsou napadené posklizňové zbytky řepy a půda,
  proto je riziko nejvyšší na pozemcích s krátkým odstupem řepy.
skodlivost: >-
  Cerkosporióza patří k ekonomicky nejzávažnějším chorobám cukrovky. Opakovaná
  ztráta listové plochy a její obnova spotřebovávají cukry; ztráty na výnosu bulev
  i cukernatosti mohou při zanedbané ochraně dosáhnout desítek procent. Zasahuje
  se podle signalizace na počátku výskytu prvních skvrn.
cyklus: >-
  Houba přezimuje jako mycelium a pseudostromata na posklizňových zbytcích řepy v
  půdě, kde přežívá i několik let. Na jaře produkuje konidie zahajující primární
  infekci; v teplém a vlhkém létě probíhá řada polycyklických infekcí za sebou.
  Krátký osevní postup s řepou inokulum v půdě hromadí.
ucinne_latky:
  - latka: difenoconazole + fenpropidin
    pripravky: např. Spyrale
  - latka: epoxiconazole + thiophanate-methyl
    pripravky: např. Duett Top
  - latka: azoxystrobin + difenoconazole
    pripravky: např. Amistar Gold
  - latka: měďnaté přípravky
    pripravky: multisitní podpora proti rezistenci
ochrana: >-
  Základem je pěstování tolerantních odrůd, dodržování osevního postupu s odstupem
  řepy (nejméně 3 roky) a zapravení napadené chrásti. Fungicidní ochrana se zahajuje
  podle signalizace na začátku výskytu a podle tlaku choroby se opakuje; nutné je
  střídat účinné látky kvůli rozšířené rezistenci Cercospora beticola. Registraci a
  dávkování ověřte v Registru přípravků na ochranu rostlin ÚKZÚZ.
aliases:
  - cerkosporioza řepy (Cercospora beticola) — nejrozšířenější
faq:
  - q: Jak cerkosporióza snižuje výnos cukrovky?
    a: >-
      Napadené listy odumírají a rostlina je musí nahrazovat tvorbou nových, což
      spotřebovává energii a cukry, které by jinak uložila do bulvy. Výsledkem je
      nižší výnos bulev i pokles cukernatosti.
  - q: Kdy se proti cerkosporióze zasahuje?
    a: >-
      Ošetření se zahajuje podle signalizace hned na počátku výskytu prvních skvrn,
      obvykle ve druhé polovině léta, a podle průběhu počasí a tlaku choroby se
      případně opakuje při dodržení střídání účinných látek.
  - q: Jak odlišit cerkosporiózu od ramulariové skvrnitosti?
    a: >-
      Cerkosporióza tvoří menší skvrny s výrazným tmavě hnědým až červenofialovým
      lemem, zatímco ramulariová skvrnitost mívá skvrny světlejší, větší a s méně
      ostrým okrajem. Přesné odlišení potvrdí rozbor, ochrana se však do značné míry
      překrývá.
  - q: Proč je u cerkosporiózy rozšířená rezistence?
    a: >-
      Cercospora beticola má vysokou reprodukční schopnost a v ČR i Evropě je popsán
      pokles účinnosti řady azolů i strobilurinů. Proto se doporučuje střídat účinné
      látky s odlišným mechanismem účinku a doplňovat je multisitními přípravky.
