slug: sklerotiniova-hniloba
name: Sklerotiniová hniloba
latinsky: Sclerotinia sclerotiorum
puvodce: Houba Sclerotinia sclerotiorum (u jetele S. trifoliorum)
popis: >-
  Sklerotiniová hniloba (bílá hniloba) je závažná houbová choroba olejnin a
  luskovin s velmi širokým okruhem hostitelů. Na stoncích a kořenovém krčku se
  tvoří vodnaté hnědnoucí léze s bílým vatovitým myceliem, uvnitř i na povrchu
  pletiv vznikají tvrdá černá sklerocia. Napadené rostliny předčasně vadnou,
  poléhají a zasychají; u řepky a slunečnice patří choroba k nejnebezpečnějším.
  Sklerocia přežívají v půdě řadu let a jsou zdrojem nákazy.
priznaky: >-
  Na stonku, nejčastěji ve výšce úžlabí listů, vzniká zprvu vodnatá, později
  vybělená olupující se léze; napadené pletivo se rozvlákňuje a stonek se láme.
  Uvnitř stonku a na jeho povrchu je bílé vatovité mycelium a tvrdá černá sklerocia
  velikosti zrna až fazole. Rostlina nad lézí předčasně žloutne, vadne a dozrává;
  za vlhka je hniloba měkká, za sucha suchá a vybělená.
hostitele:
  - Řepka a slunečnice
  - Sója a další luskoviny
  - Jetel (Sclerotinia trifoliorum)
  - Zelenina (mrkev, salát, fazol)
sireni: >-
  Zdrojem nákazy jsou sklerocia v půdě, z nichž po zvlhčení vyrůstají drobné
  plodnice (apothecia) uvolňující askospory. Ty infikují rostlinu nejčastěji přes
  opadané okvětní lístky zachycené v úžlabí listů. Infekci podporuje vlhké počasí v
  době kvetení a hustý, bujný, zapojený porost s vysokou vlhkostí u země.
skodlivost: >-
  U řepky a slunečnice patří sklerotiniová hniloba k nejzávažnějším chorobám;
  napadené rostliny předčasně dozrávají, lámou se a osypávají, takže ztráty na
  výnosu mohou za silného tlaku dosáhnout desítek procent. Sklerocia navíc trvale
  zamořují půdu a snižují hodnotu pozemku pro další náchylné plodiny.
cyklus: >-
  Houba přezimuje jako sklerocia v půdě, kde přežívá i řadu let. Po dostatečném
  provlhčení z nich vyrůstají apothecia s askosporami; ty zahajují infekci v době
  kvetení hostitele. Po odumření rostliny se v pletivech vytvoří nová sklerocia,
  která se vracejí do půdy. Krátké osevní postupy s náchylnými plodinami inokulum
  hromadí.
ucinne_latky:
  - latka: prothioconazole
    pripravky: např. Proline
  - latka: boscalid + dimoxystrobin
    pripravky: např. Pictor
  - latka: prothioconazole + fluopyram
    pripravky: např. Propulse
  - latka: Coniothyrium minitans
    pripravky: biologický přípravek Contans rozkládající sklerocia v půdě
ochrana: >-
  Rozhodující je dostatečně dlouhý odstup náchylných plodin v osevním postupu
  (řepka, slunečnice, sója, jetel) a omezení příliš hustých, bujných porostů.
  Fungicidní ošetření se u řepky cílí do období kvetení, kdy infekce probíhá přes
  opadané okvětní lístky. Pomáhá i biologická ochrana (Coniothyrium minitans)
  rozkládající sklerocia v půdě. Registraci přípravků ověřte v Registru přípravků
  na ochranu rostlin ÚKZÚZ.
aliases:
  - sklerotiniová hniloba (Sclerotinia sclerotiorum)
  - sklerotiniová hniloba (Sclerotinia sclerotiorum) — nejnebezpečnější
  - sklerotiniová hniloba (Sclerotinia trifoliorum) — přezimovací hniloba
faq:
  - q: Proč je sklerotiniová hniloba tak obtížně potlačitelná?
    a: >-
      Patogen má velmi široký okruh hostitelů a tvoří odolná sklerocia, která v
      půdě přežívají i řadu let. Krátké osevní postupy s řepkou, slunečnicí a
      luskovinami proto inokulum v půdě hromadí a jednorázové opatření nestačí.
  - q: Kdy se u řepky proti sklerotinii zasahuje?
    a: >-
      Klíčové je období kvetení řepky, kdy houba infikuje rostlinu přes opadané
      okvětní lístky zachycené v úžlabí listů. Fungicid se proto aplikuje na začátku
      až do plného kvetení podle průběhu počasí a tlaku choroby.
  - q: Jak funguje biologická ochrana proti sklerotinii?
    a: >-
      Přípravek s houbou Coniothyrium minitans se zapravuje do půdy, kde parazituje
      a rozkládá sklerocia sklerotiniové hniloby. Snižuje tak zásobu inokula v půdě,
      účinek je ale pozvolný a slouží spíše jako dlouhodobé preventivní opatření.
  - q: Které plodiny sklerotiniová hniloba ohrožuje nejvíce?
    a: >-
      Nejcitlivější jsou řepka a slunečnice, dále sója a další luskoviny, jetel a
      řada druhů zeleniny. Protože jde o mnoho náchylných plodin, je při plánování
      osevního postupu nutné počítat s jejich vzájemným rizikem.
