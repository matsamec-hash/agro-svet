# Slovenský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: plisen-bramborova
name: Pleseň zemiaková
puvodce: Riasovka (oomycéta) Phytophthora infestans
popis: >-
  Pleseň zemiaková je najnebezpečnejšou chorobou zemiakov a napáda aj paradajky. Na listoch sa
  tvoria hnedočierne vädnúce škvrny, na rube listov za vlhka belavý povlak spór; choroba rýchlo
  prechádza na vňať a neskôr na hľuzy, kde spôsobuje hnedú hnilobu. Za teplého a vlhkého počasia
  môže počas niekoľkých dní zničiť celý porast. Ide o ten istý patogén, ktorý v 19. storočí spôsobil
  írsky hladomor.
priznaky: >-
  Na listoch vznikajú tmavozelené až hnedočierne vodnaté škvrny, spočiatku často na okrajoch a
  špičkách listov. Na rube listu je na rozhraní zdravého a napadnutého pletiva za vlhka zreteľný
  belavý povlak sporangiofórov. Napadnutá vňať rýchlo černie, hnije a zapácha. Na hľuzách sa
  objavujú našedlé prepadnuté škvrny a pod šupkou hrdzavohnedá suchá až vlhká hniloba zasahujúca do
  dužiny.
hostitele:
  - Zemiaky
  - Paradajky
sireni: >-
  Choroba sa šíri spórami prenášanými vetrom a dažďom aj na veľké vzdialenosti. Rozhodujúca je
  vlhkosť a teplo — dlhodobé ovlhčenie vňate a teploty približne 15–22 °C (tzv. blightové periódy).
  Za týchto podmienok prebieha nový infekčný cyklus počas niekoľkých dní. Zdrojom sú napadnuté hľuzy
  (sadbové, výmetové kopy) a prezimujúce oospóry.
skodlivost: >-
  Pleseň zemiaková je najzávažnejšou chorobou zemiakov; zanedbaná ochrana môže za priaznivého
  počasia zničiť celý porast počas jedného až dvoch týždňov. Napadnuté hľuzy hnijú aj v sklade a sú
  vstupnou bránou pre sekundárne bakteriálne hniloby. Straty sa preto počítajú na úrode vňate aj na
  skladovateľnosti zberu.
cyklus: >-
  Patogén prezimuje ako mycélium v napadnutých hľuzách (sadbové, výmet) a ako oospóry v pôde. Z
  infikovaných hľúz vyrastá napadnutá vňať, na ktorej sa tvoria sporangie začínajúce epidémiu. Za
  vlhka sporangie uvoľňujú pohyblivé zoospóry, ktoré infikujú vňať aj hľuzy; cyklus sa za
  priaznivého počasia rýchlo opakuje.
ochrana: >-
  Rozhodujúca je preventívna fungicídna ochrana začatá podľa signalizácie ešte pred objavením
  príznakov a opakovaná v intervaloch 7–14 dní podľa tlaku choroby a počasia (systémové látky na
  rast, kontaktné na krytie, špecifické na hľuzy). Dôležitá je zdravá certifikovaná sadba,
  dostatočné prihŕňanie chrániace hľuzy pred splachom spór a desikácia či mechanické odstránenie
  vňate pred zberom. Registráciu prípravkov overte v Registri prípravkov na ochranu rastlín ÚKSÚP.
faq:
  - q: Prečo je pleseň zemiaková taká obávaná?
    a: >-
      Phytophthora infestans sa za teplého a vlhkého počasia šíri mimoriadne rýchlo a dokáže zničiť
      celý porast počas niekoľkých dní. Napáda aj hľuzy, ktoré potom pri skladovaní hnijú. Je to ten
      istý patogén, ktorý spôsobil írsky hladomor.
  - q: Ako sa proti plesni zemiakovej brániť?
    a: >-
      Kľúčová je preventívna fungicídna ochrana začatá podľa signalizácie ešte pred výskytom
      príznakov a pravidelne opakovaná. Dopĺňa ju zdravá sadba, dobré prihŕňanie chrániace hľuzy a
      včasné odstránenie vňate pred zberom.
  - q: Čo je blightová perióda?
    a: >-
      Ide o obdobie počasia priaznivé pre infekciu plesne zemiakovej — dlhodobé ovlhčenie vňate a
      teploty zhruba 15–22 °C. Predpovedné modely tieto obdobia hlásia a slúžia na načasovanie
      preventívnych postrekov ešte pred objavením príznakov.
  - q: Prečo odstraňovať vňať pred zberom?
    a: >-
      Zničenie vňate (desikácia alebo mechanicky) preruší zdroj spór a nechá šupku hľúz spevnieť,
      takže sa hľuzy pri zbere menej infikujú. Zber do zvädnutej nezničenej vňate riziko hniloby
      hľúz v sklade zvyšuje.
