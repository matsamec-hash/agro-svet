# Slovenský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: alternariova-skvrnitost
name: Alternáriová škvrnitosť
puvodce: Huby rodu Alternaria (napr. A. brassicae, A. brassicicola)
popis: >-
  Alternáriová škvrnitosť (čerň) je hubové ochorenie najmä kapustovitých olejnín a slnečnice. Na
  listoch, stonkách a šešuliach sa tvoria tmavé, často sústredne zónované škvrny so šedočiernym
  povlakom sporulácie. Pri repke postihuje hlavne šešule, ktoré predčasne pukajú a vypadávajú z nich
  semená, čím spôsobuje straty pri zbere a zhoršuje kvalitu semena. Choroba sa šíri za vlhkého,
  teplejšieho počasia ku koncu vegetácie.
priznaky: >-
  Na listoch vznikajú tmavohnedé až čierne okrúhle škvrny s výraznou sústrednou zónovitosťou
  (terčovitá kresba) a často so žltým dvorcom. Za vlhka ich pokrýva šedočierny zamatový povlak
  konídií. Na stonkách a šešuliach sa objavujú pretiahnuté čierne škvrny; napadnuté šešule predčasne
  dozrievajú, deformujú sa a pukajú. Silno napadnuté listy žltnú a predčasne opadávajú.
hostitele:
  - Repka ozimná aj jarná
  - Horčica
  - Kapustovitá zelenina (kapusta, kel, brokolica)
  - Slnečnica
sireni: >-
  Huba sa šíri konídiami prenášanými vetrom a dažďom. Infekcii napomáha teplé a vlhké počasie
  (optimum približne 18–25 °C) a dlhodobé ovlhčenie rastlín v druhej polovici vegetácie, najmä v
  období dozrievania šešúľ. Významným zdrojom primárnej nákazy je napadnuté osivo a pozberové zvyšky
  kapustovitých.
skodlivost: >-
  Hlavné straty vznikajú napadnutím šešúľ, ich predčasným puknutím a vypadávaním semien pred zberom
  a počas neho. Straty na výnose repky sa podľa intenzity napadnutia a priebehu počasia pohybujú
  bežne v jednotkách percent, pri silnom tlaku aj vyššie. Napadnuté semeno má nižšiu HTS a horšiu
  olejnatosť.
cyklus: >-
  Huba prezimuje na pozberových zvyškoch a v napadnutom osive ako mycélium a konídiá. Na jar a v
  lete produkuje nové konídiá, ktoré zabezpečujú opakované (polycyklické) šírenie v poraste.
  Najnáchylnejšia je repka v období od kvitnutia do dozrievania šešúľ.
ochrana: >-
  Pomáha dodržiavanie osevného postupu s odstupom kapustovitých (minimálne 3–4 roky), zapravenie
  pozberových zvyškov a morenie osiva. Fungicídne ošetrenie v období dozrievania šešúľ (často spolu
  s ošetrením proti sklerotíniovej hnilobe) obmedzuje napadnutie šešúľ a vypadávanie semien;
  registráciu a dávkovanie prípravkov je potrebné overiť v Registri prípravkov na ochranu rastlín
  ÚKSÚP. Včasný a nepredlžovaný zber straty ďalej znižuje.
faq:
  - q: Ktoré časti repky alternária najviac poškodzuje?
    a: >-
      Z hľadiska výnosu sú najcitlivejšie šešule. Napadnuté šešule predčasne dozrievajú, pukajú a
      vypadávajú z nich semená, takže straty vznikajú tesne pred zberom aj počas neho. Škvrny na
      listoch a stonkách bývajú menej významné.
  - q: Líši sa alternáriová škvrnitosť od černe pletív repky?
    a: >-
      Ide o príbuzné ochorenia toho istého rodu — čerň pletív repky spôsobuje najmä Alternaria
      brassicae. V praxi sa prejavy aj ochrana prekrývajú a obe sa zaraďujú medzi alternáriové
      škvrnitosti kapustovitých.
  - q: Kedy sa proti alternáriovej škvrnitosti pri repke zasahuje?
    a: >-
      Ošetrenie sa cieli do obdobia dozrievania šešúľ, keď je riziko napadnutia a vypadávania semien
      najvyššie. V praxi sa často spája s fungicídnym ošetrením proti sklerotíniovej hnilobe v čase
      kvitnutia až po odkvitnutie.
  - q: Prenáša sa alternária osivom?
    a: >-
      Áno, napadnuté osivo je významným zdrojom nákazy a prenáša hubu na nové porasty. Preto patrí
      morenie osiva a používanie zdravého, certifikovaného osiva medzi základné preventívne
      opatrenia.
