# Slovenský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: fuzariozy
name: Fuzariózy
puvodce: Huby rodu Fusarium (napr. F. graminearum, F. culmorum)
popis: >-
  Fuzariózy sú skupinou chorôb spôsobených hubami rodu Fusarium, ktoré napádajú korene, steblo, klas
  aj šúľok viacerých plodín. U obilnín je najzávažnejšia fuzarióza klasu, prejavujúca sa predčasne
  vybielenými kláskami a ružovým povlakom na zrne; pri kukurici, strukovinách a olejninách prevažujú
  hniloby koreňov a stonky. Okrem strát na úrode je rizikom tvorba mykotoxínov (najmä
  deoxynivalenolu, DON), ktoré zhoršujú zdravotnú nezávadnosť zrna a krmív.
priznaky: >-
  Pri fuzarióze klasu sa jednotlivé klásky alebo celé časti klasu predčasne vybielia, zatiaľ čo
  zdravé okolie zostáva zelené; za vlhka je na kláskoch a zrne viditeľný ružový až lososový povlak
  mycélia. Zrno je scvrknuté, matné a nízkej hmotnosti. Na koreňoch a steble vznikajú hnedé
  zaschnuté hniloby, rastliny predčasne dozrievajú a poliehajú; pri kukurici hnijú korene, steblo aj
  šúľok.
hostitele:
  - Pšenica a jačmeň
  - Kukurica
  - Ovos, raž, tritikale
  - Strukoviny a olejniny (hniloby koreňov a stonky)
sireni: >-
  Zdrojom nákazy sú pozberové zvyšky (najmä kukuričné) a napadnuté osivo. Infekcia klasu prebieha v
  období kvitnutia za teplého a vlhkého počasia (dážď počas kvitnutia je hlavný rizikový faktor).
  Spóry sa šíria vetrom a splachom; napadnutie podporuje minimalizačné spracovanie ponechávajúce
  zvyšky na povrchu.
skodlivost: >-
  Okrem priamej straty úrody a zníženia HTS je hlavným rizikom kontaminácia zrna mykotoxínmi,
  predovšetkým deoxynivalenolom (DON) a zearalenónom, ktorých limity v potravinárskom aj kŕmnom
  obilí sú legislatívne stanovené. Prekročenie limitu môže znehodnotiť celú partiu, preto má
  fuzarióza klasu aj významný hygienický dopad.
cyklus: >-
  Huby prezimujú ako mycélium a odolné útvary (chlamydospóry, peritéciá) na pozberových zvyškoch a v
  pôde. Na jar a v lete produkujú spóry (askospóry a konídiá), ktoré infikujú klasy v období
  kvitnutia a korene počas celej vegetácie. Rizikové je zaradenie obilniny po kukurici.
ochrana: >-
  Základom je vyvážený osevný postup (riziková je najmä pšenica po kukurici), kvalitné spracovanie a
  zapravenie pozberových zvyškov a výber menej náchylných odrôd. U obilnín sa proti fuzarióze klasu
  cieli fungicídne ošetrenie azolmi do obdobia kvitnutia podľa signalizácie a predpovede zrážok.
  Zásadná je aj žatva za suchého počasia a rýchle dosušenie zrna, ktoré obmedzí tvorbu mykotoxínov;
  registráciu prípravkov overte v Registri prípravkov na ochranu rastlín ÚKSÚP.
faq:
  - q: Čím sú fuzariózy nebezpečné okrem straty úrody?
    a: >-
      Huby rodu Fusarium produkujú mykotoxíny, predovšetkým deoxynivalenol (DON) a zearalenón. Tie
      môžu kontaminovať potravinárske aj kŕmne obilniny a pri zrne sú legislatívne sledované limity,
      preto fuzariózy ohrozujú aj zdravotnú nezávadnosť produkcie.
  - q: Ktorá predplodina zvyšuje riziko fuzarióz?
    a: >-
      Najrizikovejšie je pestovanie obilniny (najmä pšenice) po kukurici, ktorej pozberové zvyšky sú
      významným zdrojom infekcie. Riziko zvyšuje aj minimalizačné spracovanie pôdy ponechávajúce
      zvyšky na povrchu.
  - q: Kedy vykonať fungicídne ošetrenie proti fuzarióze klasu?
    a: >-
      Najúčinnejšie je ošetrenie v čase kvitnutia obilniny, keď huba infikuje klas. Termín sa riadi
      signalizáciou a predpoveďou zrážok — dážď počas kvitnutia riziko výrazne zvyšuje, preto sa
      ošetruje pred očakávaným daždivým obdobím.
  - q: Ako znížiť obsah mykotoxínov v už napadnutom poraste?
    a: >-
      Po napadnutí pomáha zber za suchého počasia, nastavenie mláťačky na odfúknutie ľahkého
      scvrknutého zrna a rýchle dosušenie a čistenie úrody. Skladovanie vlhkého napadnutého zrna
      tvorbu mykotoxínov ďalej zvyšuje.
