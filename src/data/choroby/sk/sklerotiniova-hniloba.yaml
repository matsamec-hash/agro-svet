# Slovenský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: sklerotiniova-hniloba
name: Sklerotíniová hniloba
puvodce: Huba Sclerotinia sclerotiorum (pri ďateline S. trifoliorum)
popis: >-
  Sklerotíniová hniloba (biela hniloba) je závažné hubové ochorenie olejnín a strukovín s veľmi
  širokým okruhom hostiteľov. Na stonkách a koreňovom krčku sa tvoria vodnaté, hnednúce lézie s
  bielym vatovitým mycéliom, vo vnútri aj na povrchu pletív vznikajú tvrdé čierne skleróciá.
  Napadnuté rastliny predčasne vädnú, poliehajú a zasychajú; pri repke a slnečnici patrí ochorenie k
  najnebezpečnejším. Skleróciá prežívajú v pôde mnoho rokov a sú zdrojom infekcie.
priznaky: >-
  Na stonke, najčastejšie vo výške pazúch listov, vzniká spočiatku vodnatá, neskôr vyblednutá
  olupujúca sa lézia; napadnuté pletivo sa rozvlákňuje a stonka sa láme. Vo vnútri stonky a na jej
  povrchu je biele vatovité mycélium a tvrdé čierne skleróciá veľkosti zrna až fazule. Rastlina nad
  léziou predčasne žltne, vädne a dozrieva; za vlhka je hniloba mäkká, za sucha suchá a vyblednutá.
hostitele:
  - Repka a slnečnica
  - Sója a ďalšie strukoviny
  - Ďatelina (Sclerotinia trifoliorum)
  - Zelenina (mrkva, šalát, fazuľa)
sireni: >-
  Zdrojom infekcie sú skleróciá v pôde, z ktorých po zvlhčení vyrastajú drobné plodnice (apothecia)
  uvoľňujúce askospóry. Tie infikujú rastlinu najčastejšie cez opadané okvetné lístky zachytené v
  pazuchách listov. Infekcii napomáha vlhké počasie v období kvitnutia a hustý, bujný, zapojený
  porast s vysokou vlhkosťou pri zemi.
skodlivost: >-
  Pri repke a slnečnici patrí sklerotíniová hniloba k najzávažnejším ochoreniam; napadnuté rastliny
  predčasne dozrievajú, lámu sa a osypávajú, takže straty na úrode môžu pri silnom tlaku dosiahnuť
  desiatky percent. Skleróciá navyše trvalo zamorujú pôdu a znižujú hodnotu pozemku pre ďalšie
  náchylné plodiny.
cyklus: >-
  Huba prezimuje ako skleróciá v pôde, kde prežíva aj mnoho rokov. Po dostatočnom prevlhčení z nich
  vyrastajú apotheciá s askospórami; tie začínajú infekciu v období kvitnutia hostiteľa. Po odumretí
  rastliny sa v pletivách vytvoria nové skleróciá, ktoré sa vracajú do pôdy. Krátke osevné postupy s
  náchylnými plodinami inokulum hromadia.
ochrana: >-
  Rozhodujúci je dostatočne dlhý odstup náchylných plodín v osevnom postupe (repka, slnečnica, sója,
  ďatelina) a obmedzenie príliš hustých, bujných porastov. Fungicídne ošetrenie sa pri repke cieli
  do obdobia kvitnutia, keď infekcia prebieha cez opadané okvetné lístky. Pomáha aj biologická
  ochrana (Coniothyrium minitans) rozkladajúca skleróciá v pôde. Registráciu prípravkov overte v
  Registri prípravkov na ochranu rastlín ÚKSÚP.
faq:
  - q: Prečo je sklerotíniová hniloba tak ťažko potlačiteľná?
    a: >-
      Patogén má veľmi široký okruh hostiteľov a tvorí odolné skleróciá, ktoré v pôde prežívajú aj
      mnoho rokov. Krátke osevné postupy s repkou, slnečnicou a strukovinami preto inokulum v pôde
      hromadia a jednorazové opatrenie nestačí.
  - q: Kedy sa pri repke proti sklerotínii zasahuje?
    a: >-
      Kľúčové je obdobie kvitnutia repky, keď huba infikuje rastlinu cez opadané okvetné lístky
      zachytené v pazuchách listov. Fungicíd sa preto aplikuje na začiatku až do plného kvitnutia
      podľa priebehu počasia a tlaku choroby.
  - q: Ako funguje biologická ochrana proti sklerotínii?
    a: >-
      Prípravok s hubou Coniothyrium minitans sa zapravuje do pôdy, kde parazituje a rozkladá
      skleróciá sklerotíniovej hniloby. Znižuje tak zásobu inokula v pôde, účinok je však pozvoľný a
      slúži skôr ako dlhodobé preventívne opatrenie.
  - q: Ktoré plodiny sklerotíniová hniloba ohrozuje najviac?
    a: >-
      Najcitlivejšie sú repka a slnečnica, ďalej sója a ďalšie strukoviny, ďatelina a množstvo
      druhov zeleniny. Keďže ide o mnoho náchylných plodín, pri plánovaní osevného postupu je
      potrebné počítať s ich vzájomným rizikom.
