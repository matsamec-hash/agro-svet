# Slovenský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: namel-zitny
name: Námeľ ražný
puvodce: Huba Claviceps purpurea
popis: >-
  Námeľ je hubové ochorenie obilnín a tráv, najvýraznejšie u raže, ktorá je cudzoprašná a má dlhšie
  otvorené kvety. Namiesto zrna sa v klase vytvorí tmavofialové až čierne rožkovité sklerócium
  (námeľ), ktoré prerastá obilku. Skleróciá obsahujú jedovaté námelové alkaloidy, ktoré sú
  nebezpečné pre ľudí aj hospodárske zvieratá, preto je obsah námeľa v potravinárskom a kŕmnom zrne
  legislatívne sledovaný a obmedzený.
priznaky: >-
  Prvým príznakom je v období kvitnutia sladká lepkavá tekutina (medovica) vylučovaná z napadnutých
  kvetov, na ktorú prilieta hmyz. Neskôr sa namiesto zrna v klase vytvorí tvrdé rožkovité sklerócium
  — tmavofialové až čierne, zvyčajne výrazne dlhšie ako zdravá obilka a vyčnievajúce z pliev. V
  jednom klase býva jedno až niekoľko sklerócií.
hostitele:
  - Raž (najnáchylnejšia)
  - Pšenica, jačmeň, ovos, tritikale
  - Trávy na semeno a burinné trávy
sireni: >-
  Primárna infekcia pochádza z askospór uvoľňovaných zo sklerócií, ktoré prezimovali v pôde alebo sa
  dostali do osiva. Askospóry infikujú otvorené kvety v období kvitnutia; medovica s konídiami je
  potom prenášaná hmyzom a dažďom na ďalšie kvety. Náchylnosť zvyšuje všetko, čo predlžuje a
  rozvoľňuje kvitnutie (chladné počasie, riedky porast, cudzoprašnosť).
skodlivost: >-
  Priama strata úrody býva skôr nižšia, rozhodujúce je zdravotné a legislatívne riziko: skleróciá
  obsahujú toxické námelové alkaloidy a ich obsah v potravinárskom aj kŕmnom zrne je zákonom
  obmedzený. Prekročenie limitu znehodnotí celú partiu. Historicky námel spôsoboval hromadné otravy
  (ergotizmus).
cyklus: >-
  Huba prezimuje ako skleróciá v pôde a v osive. Na jar z nich vyrastajú drobné plodnice (stromatá)
  s askospórami, ktoré začínajú infekciu kvitnúcich obilnín a tráv. Po infekcii vzniká medovicová
  (konídiová) fáza šírená hmyzom a nakoniec sa vytvoria nové skleróciá. Skleróciá z povrchu pôdy po
  hlbokej orbe strácajú klíčivosť.
ochrana: >-
  Chemická ochrana proti námeľu nie je účinná, rozhoduje agrotechnika. Pomáha použitie čisteného,
  námeľa prostého osiva, hlboká orba (skleróciá z povrchu strácajú klíčivosť), potláčanie kvitnúcich
  tráv a výmrvu v okolí pozemkov ako zdrojov infekcie a vyrovnané, súvislé kvitnutie porastu, ktoré
  skracuje dobu náchylnosti. Skleróciá sa odstraňujú čistením a triedením zozbieraného zrna.
faq:
  - q: Prečo je námeľ nebezpečný?
    a: >-
      Skleróciá námeľa obsahujú námelové alkaloidy, ktoré sú toxické pre ľudí aj zvieratá
      (historicky spôsobovali otravy nazývané ergotizmus). Preto je jeho obsah v potravinárskom a
      kŕmnom zrne sledovaný a zákonom obmedzený.
  - q: Prečo je námeľom najviac ohrozená raž?
    a: >-
      Raž je cudzoprašná a jej kvety zostávajú dlhšie otvorené, takže sú ľahšie prístupné infekcii
      výtrusmi námeľa v období kvitnutia. Samoprašné obilniny s rýchlym uzatváraním kvetov sú
      napádané menej.
  - q: Dá sa proti námeľu zasiahnuť fungicídom?
    a: >-
      Účinná chemická ochrana proti námeľu neexistuje. Rozhodujúce sú preventívne agrotechnické
      opatrenia — zdravé čistené osivo, hlboká orba na zaklopenie sklerócií, potláčanie kvitnúcich
      tráv a čistenie úrody.
  - q: Ako sa skleróciá dostanú zo zrna preč?
    a: >-
      Skleróciá sú zvyčajne dlhšie a ľahšie ako zdravé zrno, preto ich možno z partie odstrániť
      dôkladným čistením a triedením (sita, gravitačné a optické triediče). Pri silne napadnutej
      úrode je čistenie nevyhnutné na dodržanie limitov.
