# Slovenský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: plisen-seda
name: Pleseň sivá
puvodce: Huba Botrytis cinerea
popis: >-
  Pleseň sivá je všadeprítomné hubové ochorenie s veľmi širokým okruhom hostiteľov, od poľných
  plodín po zeleninu a ovocie. Na odumierajúcich alebo poškodených pletivách sa vytvára sivý prašný
  povlak hustého mycélia a spór. Huba sa správa prevažne ako oslabujúci (sekundárny) patogén —
  preniká poraneniami, odumretými okvetnými lístkami alebo oslabenými pletivami a spôsobuje hniloby
  za vlhkého a chladnejšieho počasia. Pri cukrovej repe a repke napáda listy a ďalšie pletivá, najmä
  v zapojených, vlhkých porastoch.
priznaky: >-
  Typickým príznakom je sivý až sivohnedý prašný povlak, ktorý sa z napadnutého pletiva pri dotyku
  práši (masa konídií). Najskôr vznikajú vodnaté hnednúce škvrny na poškodených alebo odumierajúcich
  častiach (okvetné lístky, poranenia, báza stoniek), odkiaľ hniloba postupuje do zdravého pletiva.
  V napadnutých pletivách sa neskôr tvoria drobné čierne skleróciá.
hostitele:
  - Repka a slnečnica
  - Cukrová repa
  - Strukoviny a zelenina
  - Vinič a ovocie (bobuľoviny)
sireni: >-
  Huba sa šíri konídiami prenášanými vetrom a splachom. Klíčeniu spór a infekcii napomáha dlhodobé
  ovlhčenie pletív, vysoká vzdušná vlhkosť a chladnejšie počasie (optimum približne 15–20 °C).
  Vstupnou bránou sú poranenia a odumreté pletivá, preto je riziko najvyššie v zapojených,
  poliehajúcich alebo mrazom poškodených porastoch.
skodlivost: >-
  Pri poľných plodinách býva pleseň sivá skôr sprievodným ochorením oslabených porastov, význam
  rastie pri zelenine, viniči a ovocí, kde spôsobuje hniloby plodov pred zberom aj po ňom.
  Škodlivosť stúpa vo vlhkých rokoch a v hustých porastoch; pri skladovanom ovocí a zelenine patrí k
  hlavným príčinám strát.
cyklus: >-
  Huba prezimuje ako skleróciá a mycélium na rastlinných zvyškoch. Za vlhka z nich vyrastajú
  konidiofory produkujúce veľké množstvo konídií, ktoré zabezpečujú opakované šírenie počas celej
  vegetácie. Botrytis ľahko napáda odumierajúce pletivá a odtiaľ sa šíri do zdravých; má sklon k
  vzniku rezistencie voči fungicídom.
ochrana: >-
  Základom je obmedzenie vlhkosti v poraste (vzdušné porasty, vyvážená výživa) a prevencia poranení
  rastlín. Cielené fungicídne ošetrenie sa zameriava na rizikové obdobie a oslabené porasty;
  vzhľadom na sklon Botrytis k rezistencii je potrebné striedať účinné látky s odlišným mechanizmom
  účinku. Pomáha aj zapracovanie napadnutých zvyškov a pri zelenine a ovocí rýchle schladenie zberu.
  Registráciu prípravkov overte v Registri prípravkov na ochranu rastlín ÚKSÚP.
faq:
  - q: Prečo sa pleseň sivá objavuje hlavne na oslabených rastlinách?
    a: >-
      Botrytis cinerea je prevažne oslabujúci patogén — najľahšie preniká poraneniami, odumretými
      okvetnými lístkami alebo pletivami oslabenými stresom, mrazom či iným ochorením. Zdravé a
      dobre vyživené porasty napáda ťažšie.
  - q: Aké počasie plesni sivej vyhovuje?
    a: >-
      Pleseň sivá sa najviac šíri za vlhkého, chladnejšieho počasia a vysokej vzdušnej vlhkosti v
      zapojených porastoch. Dlhodobé ovlhčenie listov a zlé prevzdušnenie riziko výrazne zvyšujú.
  - q: Prečo je pri plesni sivej problém s rezistenciou?
    a: >-
      Botrytis cinerea má krátky reprodukčný cyklus a veľkú populáciu spór, takže rýchlo vytvára
      kmene odolné voči fungicídom. Preto je zásadné striedať účinné látky s odlišným mechanizmom
      účinku a nespoliehať sa opakovane na jednu skupinu.
  - q: Ako obmedziť pleseň sivú pri skladovanom ovocí a zelenine?
    a: >-
      Pomáha zber zdravých, nepoškodených plodov za sucha, rýchle schladenie a udržiavanie nízkej
      teploty a primeranej vlhkosti v sklade. Poranené a nahnité kusy je potrebné vyradiť, pretože
      sú zdrojom ďalšieho šírenia.
