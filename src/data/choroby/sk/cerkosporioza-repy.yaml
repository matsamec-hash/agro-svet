# Slovenský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: cerkosporioza-repy
name: Cerkosporióza repy
puvodce: Huba Cercospora beticola
popis: >-
  Cerkosporióza je najrozšírenejšia a najvýznamnejšia listová choroba cukrovej repy. Na listoch sa
  vytvárajú drobné okrúhle škvrny so svetlým stredom a tmavohnedým až červenofialovým okrajom; pri
  silnom napadnutí škvrny splývajú a listy odumierajú. Rastlina nahrádza odumreté listy novými na
  úkor ukladania cukru do buľvy, takže klesá úroda aj cukornatosť. Choroba sa šíri za teplého a
  vlhkého počasia v druhej polovici vegetácie.
priznaky: >-
  Prvými príznakmi sú drobné okrúhle škvrny (2–3 mm) s popolavosivým stredom a ostro ohraničeným
  tmavohnedým až červenofialovým okrajom. V strede škvŕn sú za vlhka viditeľné drobné čierne
  skupinky konidiofórov. Škvrny postupne splývajú, list žltne, hnedne a odumiera; najskôr sú
  zasiahnuté staršie vonkajšie listy. Silno napadnuté porasty vyzerajú ako spálené.
hostitele:
  - Cukrová repa
  - Kŕmna repa
  - Špenát a šalátová repa (menej významne)
sireni: >-
  Huba sa šíri konídiami prenášanými vetrom, dažďom a poľnohospodárskou technikou. Optimum pre
  infekciu je teplé a vlhké počasie (približne 25–30 °C cez deň, nočné ovlhčenie listov). Zdrojom
  primárnej nákazy sú napadnuté pozberové zvyšky repy a pôda, preto je riziko najvyššie na pozemkoch
  s krátkym odstupom repy.
skodlivost: >-
  Cerkosporióza patrí medzi ekonomicky najzávažnejšie choroby cukrovej repy. Opakovaná strata
  listovej plochy a jej obnova spotrebúvajú cukry; straty na výnose buľiev aj cukornatosti môžu pri
  zanedbanej ochrane dosiahnuť desiatky percent. Zásah sa vykonáva podľa signalizácie na začiatku
  výskytu prvých škvŕn.
cyklus: >-
  Huba prezimuje ako mycélium a pseudostromatá na pozberových zvyškoch repy v pôde, kde prežíva aj
  niekoľko rokov. Na jar produkuje konídiá, ktoré spôsobujú primárnu infekciu; v teplom a vlhkom
  lete prebieha viacero polycyklických infekcií za sebou. Krátky osevný postup s repou vedie k
  hromadeniu inokula v pôde.
ochrana: >-
  Základom je pestovanie tolerantných odrôd, dodržiavanie osevného postupu s odstupom repy
  (minimálne 3 roky) a zapravenie napadnutej vňate. Fungicídna ochrana sa začína podľa signalizácie
  na začiatku výskytu a podľa tlaku choroby sa opakuje; nevyhnutné je striedanie účinných látok
  kvôli rozšírenej rezistencii Cercospora beticola. Registráciu a dávkovanie si overte v Registri
  prípravkov na ochranu rastlín ÚKSÚP.
faq:
  - q: Ako cerkosporióza znižuje úrodu cukrovej repy?
    a: >-
      Napadnuté listy odumierajú a rastlina ich musí nahrádzať tvorbou nových, čo spotrebúva energiu
      a cukry, ktoré by inak uložila do buľvy. Výsledkom je nižšia úroda buľiev aj pokles
      cukornatosti.
  - q: Kedy sa proti cerkosporióze zasahuje?
    a: >-
      Ošetrenie sa začína podľa signalizácie hneď na začiatku výskytu prvých škvŕn, zvyčajne v
      druhej polovici leta, a podľa priebehu počasia a tlaku choroby sa prípadne opakuje pri
      dodržaní striedania účinných látok.
  - q: Ako odlíšiť cerkosporiózu od ramuláriovej škvrnitosti?
    a: >-
      Cerkosporióza vytvára menšie škvrny s výrazným tmavohnedým až červenofialovým okrajom, zatiaľ
      čo ramuláriová škvrnitosť má škvrny svetlejšie, väčšie a s menej ostrým okrajom. Presné
      odlíšenie potvrdí rozbor, ochrana sa však do značnej miery prekrýva.
  - q: Prečo je pri cerkosporióze rozšírená rezistencia?
    a: >-
      Cercospora beticola má vysokú reprodukčnú schopnosť a v Česku aj Európe je popísaný pokles
      účinnosti viacerých azolov aj strobilurínov. Preto sa odporúča striedať účinné látky s
      odlišným mechanizmom účinku a dopĺňať ich multispektrálnymi prípravkami.
