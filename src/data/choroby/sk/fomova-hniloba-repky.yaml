# Slovenský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: fomova-hniloba-repky
name: Fómová hniloba stonky
puvodce: Huba Leptosphaeria maculans (anamorfa Phoma lingam)
popis: >-
  Fómová hniloba (fómové černenie stonky) je významné ochorenie repky a ďalších kapustovitých
  rastlín. Na jeseň sa na listoch objavujú svetlé škvrny s drobnými čiernymi plodničkami; huba
  následne prerastá stopkou do koreňového krčku a bázy stonky, kde spôsobuje zaškrcujúcu suchú
  hnilobu. Napadnuté rastliny sa lámu, predčasne dozrievajú a poliehajú, čo vedie k výrazným stratám
  na úrode. Primárna nákaza pochádza z askospór uvoľňovaných z pozberových zvyškov.
priznaky: >-
  Na jesenných listoch vznikajú okrúhle belavé až sivasté škvrny s roztrúsenými čiernymi pyknidami.
  Najzávažnejším príznakom je suchá zaškrcujúca hniloba koreňového krčku a bázy stonky, na reze s
  tmavým, zaschnutým pletivom. Napadnuté rastliny ľahko vylomíte zo zeme, na jar predčasne
  dozrievajú, menia farbu a poliehajú.
hostitele:
  - Repka ozimná aj jarná
  - Horčica
  - Kapustovitá zelenina
sireni: >-
  Hlavným zdrojom nákazy sú askospóry uvoľňované z pozberových zvyškov repky počas jesenných dažďov;
  prenášajú sa vetrom na vzchádzajúce porasty. Infekcii napomáha vlhké počasie a mierne teploty na
  jeseň. Choroba sa z listov dostáva do stonky postupným prerastaním stopkou, čo trvá týždne až
  mesiace.
skodlivost: >-
  Straty vznikajú zaškrtením a lámaním stoniek pred zberom aj v porastoch, ktoré na jeseň vyzerali
  zdravo. Pri silnom tlaku a citlivých odrodách môžu dosiahnuť desiatky percent úrody. Škodlivosť sa
  posudzuje na jeseň podľa podielu napadnutých rastlín a hĺbky napadnutia krčku.
cyklus: >-
  Huba prezimuje na pozberových zvyškoch repky, kde dozrievajú plodnice (pseudotécia) s askospórami.
  Tie začínajú jesennú infekciu listov, odkiaľ huba prerastá do stonky a cez zimu aj vegetáciu
  pokračuje. Krátky odstup repky a ponechanie zvyškov na povrchu výrazne zvyšujú množstvo inokula.
ochrana: >-
  Kľúčový je dostatočný odstup repky v osevnom postupe (minimálne 3–4 roky) a zapravenie pozberových
  zvyškov, ktoré sú hlavným zdrojom askospór. Pestujú sa odolnejšie odrody a podľa náletu spór a
  vývoja porastu sa na jeseň (prípadne aj na jar) aplikujú azolové fungicídy, ktoré zároveň pôsobia
  morforegulačne. Registráciu a dávkovanie overte v Registri prípravkov na ochranu rastlín ÚKSÚP.
faq:
  - q: Prečo je fómová hniloba pri repke obzvlášť nebezpečná?
    a: >-
      Huba prerastá od listov až do koreňového krčku a bázy stonky, ktorý zaškrcuje a oslabuje.
      Rastliny sa potom lámu a poliehajú ešte pred zberom, takže straty vznikajú aj v porastoch,
      ktoré na jeseň vyzerali zdravo.
  - q: Ako najlepšie predchádzať fómovej hnilobe?
    a: >-
      Najúčinnejšou prevenciou je dostatočne dlhý odstup repky na pozemku (3–4 roky), zapravenie
      pozberových zvyškov a výber odolných odrôd. Doplňuje ich jesenné fungicídne ošetrenie podľa
      signalizácie náletu spór.
  - q: Kedy vykonať jesenné ošetrenie proti fómovej hnilobe?
    a: >-
      Ošetrenie sa cieli do obdobia od náletu askospór, zvyčajne na vyvinutý jesenný porast
      približne vo fáze 4–8 listov, podľa signalizácie a priebehu počasia. Azolové prípravky zároveň
      spevňujú a skracujú porast pred zimou.
  - q: Pomáha proti fómovej hnilobe výber odrody?
    a: >-
      Áno, medzi odrodami repky sú výrazné rozdiely v odolnosti voči fómovej hnilobe, časť z nich
      nesie špecifické gény rezistencie. Odolná odroda znižuje riziko aj potrebu intenzívnej
      fungicídnej ochrany.
