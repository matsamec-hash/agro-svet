# Slovenský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: rzi-obilovin
name: Hrdze obilnín
puvodce: Hrdzavé huby rodu Puccinia (hrdza pšeničná, hrdza plevová/žltá, hrdza trávová)
popis: >-
  Hrdze sú skupina hubových chorôb obilnín spôsobených hrdzavými hubami rodu Puccinia. Na listoch,
  pošvách a steblách sa vytvárajú hrdzavo hnedé, žlté alebo tmavé prášivé kupky (uredospóry), ktoré
  sa ľahko zotierajú na ruku. Najzávažnejšie sú hrdza plevová (žltá), hrdza pšeničná (hnedá) a hrdza
  trávová (čierna). Silné napadnutie znižuje asimilačnú plochu, urýchľuje odumieranie listov a môže
  výrazne znížiť úrodu aj kvalitu zrna, najmä za vlhkého a teplého počasia.
priznaky: >-
  Hrdza plevová (žltá) vytvára citrónovo žlté kupky spór usporiadané do pásikov pozdĺž žilnatiny,
  najvýraznejšie skoro na jar. Hrdza pšeničná (hnedá) má drobné hrdzavo hnedé, nepravidelne
  rozmiestnené kupky na vrchnej strane listov. Hrdza trávová (čierna) vytvára tmavohnedé až čierne
  podlhovasté kupky najmä na steblách a pošvách. Zo všetkých kupiek sa spóry zotierajú a zanechávajú
  farebnú stopu na prstoch.
hostitele:
  - Pšenica ozimná aj jarná
  - Jačmeň (aj hrdza jačmenná)
  - Raž, ovos, tritikale
  - Trávy (medzihostitelia a rezervoár)
sireni: >-
  Hrdze sa šíria uredospórami prenášanými vetrom aj na veľké vzdialenosti, čo umožňuje rýchle plošné
  epidémie. Hrdza plevová (žltá) uprednostňuje chladnejšiu a vlhkú jar, hrdza pšeničná (hnedá) a
  trávová teplejšie počasie. Infekcii napomáha dlhé ovlhčenie listov. Zdrojom jarnej nákazy je
  výmrv, oziminy a nálet spór z iných oblastí.
skodlivost: >-
  Hrdze patria k najškodlivejším listovým chorobám obilnín; silné napadnutie môže za priaznivého
  počasia a náchylných odrôd znížiť úrodu o desiatky percent. Najrýchlejšie škodí hrdza plevová
  (žltá), ktorá napáda porast už skoro na jar a ničí asimilačnú plochu v období tvorby a plnenia
  zrna.
cyklus: >-
  Hrdze majú zložitý vývojový cyklus, často s viacerými typmi spór a u niektorých druhov so
  striedaním hostiteľov (medzihostiteľom hrdze trávovej je dráč). Prezimujú ako mycélium a
  uredospóry na oziminách a výmrve, na jar začínajú infekciu a počas vegetácie sa polycyklicky
  množia uredospórami. Na konci sezóny tvoria tmavé teliospóry prežívajúce na zvyškoch.
ochrana: >-
  Kľúčová je voľba odolných odrôd a sledovanie porastov od začiatku jari. Pri výskyte sa používajú
  fungicídy (azoly, strobiluríny, SDHI), najlepšie preventívne alebo na začiatku epidémie, so
  striedaním účinných látok kvôli rezistencii. Odstraňovanie výmrvu obilnín a zaorávka pozberových
  zvyškov obmedzuje zdroje nákazy. Registráciu prípravkov overte v Registri prípravkov na ochranu
  rastlín ÚKSÚP.
faq:
  - q: Ako rozoznať hrdzu od iných chorôb obilnín?
    a: >-
      Pre hrdze sú typické prášivé kupky spór, ktoré sa zotierajú na prsty a zanechávajú hrdzavú
      alebo žltú stopu. Tým sa líšia od múčnatky (biely povlak) aj od škvrnitostí typu septoriózy
      (ohraničené nekrózy bez prášivých spór).
  - q: Ktorá hrdza je najnebezpečnejšia?
    a: >-
      Veľmi nebezpečná je hrdza plevová (žltá), ktorá sa objavuje už skoro na jar a tvorí
      charakteristické žlté pásy spór pozdĺž žilnatiny. Za priaznivých podmienok sa šíri rýchlo a
      môže spôsobiť veľké straty na úrode.
  - q: Kedy proti hrdziam zasiahnuť fungicídom?
    a: >-
      Najúčinnejší je zásah preventívne alebo hneď na začiatku epidémie, keď je napadnutie ešte
      nízke. Pri hrdzi plevovej to býva skoro na jar, pri hrdzi pšeničnej neskôr v období klasenia.
      Rozhodujúca je pravidelná kontrola porastu.
  - q: Pomáha proti hrdziam odolná odroda?
    a: >-
      Áno, medzi odrodami obilnín sú veľké rozdiely v odolnosti voči jednotlivým hrdziam. Voľba
      odolnej odrody je najlacnejším a najúčinnejším opatrením a výrazne znižuje potrebu
      fungicídnych zásahov.
