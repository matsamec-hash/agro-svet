# Slovenský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: padli-travni
name: Múčnatka trávová
puvodce: Huba Blumeria graminis (predtým Erysiphe graminis)
popis: >-
  Múčnatka trávová je najrozšírenejšie hubové ochorenie obilnín. Na listoch, listových pošvách a
  neskôr aj na klasoch sa vytvára charakteristický biely až sivastý múčnatý povlak mycélia, ktorý
  postupne hnedne a v ňom dozrievajú tmavé plodničky (kleistotécium). Napadnuté pletivo žltne a
  predčasne odumiera, čím sa znižuje asimilačná plocha, hmotnosť zrna aj úroda. Choroba sa šíri
  najmä za teplého a vlhkého počasia v hustých, prehnojených porastoch.
priznaky: >-
  Typickým príznakom je biely až sivastý múčnatý (vatovitý) povlak na vrchnej aj spodnej strane
  listov, listových pošvách a steblách, ktorý sa dá spočiatku zotrieť prstom. Povlak postupne sivie
  a hnedne a objavujú sa v ňom drobné čierne telieska (kleistotécium). Pod povlakom pletivo žltne a
  zasychá; napadnutie postupuje od spodných listov smerom nahor, pri silnom tlaku aj na klasy.
hostitele:
  - Pšenica ozimná aj jarná
  - Jačmeň
  - Raž, ovos, tritikale
sireni: >-
  Múčnatka sa šíri konídiami prenášanými vetrom. Na infekciu nepotrebuje kvapkovú vlhkosť (na
  rozdiel od väčšiny listových chorôb), postačuje vysoká vzdušná vlhkosť a teploty približne 15–22
  °C. Šírenie výrazne podporujú husté, bujné a dusíkom prehnojené porasty s obmedzeným prúdením
  vzduchu. Zdrojom jarnej nákazy je výmrv a oziminy.
skodlivost: >-
  Silné napadnutie znižuje asimilačnú plochu, urýchľuje starnutie listov a znižuje hmotnosť zrna;
  straty na úrode sa za priaznivých podmienok a náchylných odrôd pohybujú bežne v jednotkách až
  nižších desiatkach percent. Prah škodlivosti sa hodnotí podľa podielu napadnutej listovej plochy
  na spodných poschodiach.
cyklus: >-
  Huba prezimuje ako mycélium na oziminách a výmrve a ako kleistotécium na zvyškoch. Na jar
  produkuje konídiá, ktoré spúšťajú polycyklické šírenie, ktoré za priaznivého počasia prebieha v
  krátkych cykloch počas celej vegetácie. Patogén má špecializované formy (formae speciales) viazané
  na jednotlivé druhy obilnín.
ochrana: >-
  Základom je výber odolných odrôd, vyvážené dusíkaté hnojenie (prehnojenie dusíkom riziko zvyšuje)
  a primeraná hustota porastu. Pri prekročení prahu škodlivosti sa aplikujú fungicídy zo skupín
  azolov, morfolínov alebo špecifických látok proti múčnatke, často v kombinácii na listy aj ochranu
  klasu. Dôležité je striedanie účinných látok kvôli prevencii rezistencie; registráciu si overte v
  Registri prípravkov na ochranu rastlín ÚKSÚP.
faq:
  - q: Ktoré plodiny múčnatka trávová najčastejšie napáda?
    a: >-
      Múčnatka trávová napáda väčšinu obilnín — pšenicu, jačmeň, ovos, raž aj tritikale. Patogén má
      síce špecializované formy (formae speciales) viazané na konkrétny druh, ale ako choroba sa
      vyskytuje naprieč celým spektrom obilnín.
  - q: Ako spoznať múčnatku na obilí?
    a: >-
      Typickým príznakom je biely múčnatý povlak na listoch a steblách, ktorý sa dá spočiatku
      zotrieť prstom. Postupne tmavne a v ňom sa objavujú drobné čierne plodničky. Napadnuté listy
      žltnú a predčasne zasychajú.
  - q: Prečo múčnatke vyhovujú husté a prehnojené porasty?
    a: >-
      V hustých a dusíkom prehnojených porastoch je vyššia vzdušná vlhkosť, horšie prevetrávanie a
      mäkšie, náchylnejšie pletivá. To vytvára ideálne podmienky pre šírenie múčnatky, preto je
      vyvážená výživa a hustota porastu súčasťou ochrany.
  - q: Potrebuje múčnatka na infekciu dážď?
    a: >-
      Nie. Na rozdiel od väčšiny listových chorôb múčnatka na klíčenie spór nepotrebuje kvapkovú
      vodu, postačuje jej vysoká vzdušná vlhkosť. Preto sa môže šíriť aj v obdobiach bez výdatných
      zrážok, ak sú porasty husté a vlhké.
