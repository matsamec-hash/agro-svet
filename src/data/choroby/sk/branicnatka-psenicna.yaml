# Slovenský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: branicnatka-psenicna
name: Septorióza listov pšenice (Zymoseptoria tritici)
puvodce: Huba Zymoseptoria tritici (predtým Septoria tritici / Mycosphaerella graminicola)
popis: >-
  Septorióza listov pšenice je v podmienkach Slovenska jednou z najvýznamnejších listových chorôb
  pšenice. Na listoch sa vytvárajú podlhovasté žltkasté až hnedé škvrny ohraničené žilnatinou, v
  ktorých sú viditeľné drobné čierne plodničky (pyknídiá). Choroba postupuje od spodných listov k
  horným a za vlhkého počasia môže zničiť aj praporcový list, čím výrazne znižuje úrodu.
priznaky: >-
  Na listoch vznikajú najskôr drobné vodnaté škvrnky, ktoré sa predlžujú pozdĺž žilnatiny do
  nepravidelných žltohnedých až sivastých nekróz s tmavým lemom. V škvrnách sú voľným okom viditeľné
  čierne bodky — pyknídiá s výtrusmi. Napadnutie postupuje zdola nahor; pri silnom tlaku odumierajú
  horné listy vrátane praporcového a porast predčasne vysychá.
hostitele:
  - Pšenica ozimná aj jarná
  - Tritikale
  - Ojedinele ďalšie trávy a obilniny
sireni: >-
  Primárna infekcia pochádza z askospór uvoľňovaných z pozberových zvyškov, v poraste sa choroba
  ďalej šíri konídiami splachovanými dažďovými kvapkami na vyššie poschodia listov. Infekcii
  napomáha vlhké a mierne počasie (približne 15–20 °C) a dlhé ovlhčenie listov. Hustý, bujný porast
  šírenie urýchľuje.
skodlivost: >-
  Septorióza patrí medzi najškodlivejšie listové choroby pšenice; poškodenie horných listov a
  praporcového listu priamo znižuje hmotnosť zrna. Straty na úrode sa pri silnom napadnutí a
  priaznivom počasí môžu pohybovať v desiatkach percent. Patogén je náchylný na vznik rezistencie
  voči účinným látkam.
cyklus: >-
  Huba prezimuje na pozberových zvyškoch pšenice a v ozimnej pšenici ako mycélium. Askospóry
  začínajú jarnú infekciu spodných listov, odkiaľ sa choroba polycyklicky šíri konídiami na horné
  poschodia počas celého jara. Nebezpečná je najmä dlhá latentná doba (aj niekoľko týždňov), počas
  ktorej nie je napadnutie viditeľné.
ochrana: >-
  Dôležité je pestovanie odolnejších odrôd, vylúčenie pšenice po pšenici a zapravenie pozberových
  zvyškov (zdroj infekcie). Fungicídna ochrana sa zameriava na horné listy a praporcový list vo fáze
  steblovania až klasenia; používajú sa azoly a látky zo skupiny SDHI, vhodné je striedanie a
  kombinovanie účinných látok kvôli rezistencii. Registráciu a dávkovanie overte v Registri
  prípravkov na ochranu rastlín ÚKSÚP.
faq:
  - q: Prečo je ochrana praporcového listu pri septorióze kľúčová?
    a: >-
      Praporcový a podpraporcový list tvoria podstatnú časť asimilačnej plochy, ktorá vyživuje zrno.
      Ich poškodenie septoriózou priamo znižuje hmotnosť zrna a úrodu, preto sa fungicídne ošetrenie
      načasováva tak, aby tieto listy ochránilo.
  - q: Ako sa septorióza šíri?
    a: >-
      Primárna infekcia pochádza z pozberových zvyškov (askospóry), v poraste sa potom šíri výtrusmi
      (konídiami) splachom dažďových kvapiek na vyššie poschodia listov. Vlhké a mierne počasie
      šírenie výrazne podporuje.
  - q: Prečo je pri septorióze problém s rezistenciou?
    a: >-
      Zymoseptoria tritici je veľmi náchylná na vznik rezistencie a v Česku aj Európe je popísaný
      pokles účinnosti pri viacerých azoloch aj SDHI. Preto sa odporúča striedať a kombinovať účinné
      látky s odlišným mechanizmom účinku a pridávať multispektrálnu látku.
  - q: Ako odlíšiť septoriózu od iných listových škvrnitostí?
    a: >-
      Charakteristické sú podlhovasté nekrózy ohraničené žilnatinou s viditeľnými čiernymi
      pyknídiami v škvrnách. Na rozdiel od hrdzí netvorí prášivé kupky spór a na rozdiel od múčnatky
      nemá biely povlak na povrchu listu.
