slug: rzi-obilovin
name: Getreideroste
latinsky: Puccinia spp.
puvodce: Rostpilze der Gattung Puccinia (Braunrost, Gelbrost, Schwarzrost)
popis: >-
  Die Roste sind eine Gruppe von Pilzkrankheiten des Getreides, verursacht durch
  Rostpilze der Gattung Puccinia. Auf Blättern, Blattscheiden und Halmen bilden
  sich rostbraune, gelbe oder dunkle pulvrige Sporenlager (Uredosporen), die
  sich leicht an der Hand abreiben lassen. Am bedeutendsten sind Gelbrost,
  Braunrost und Schwarzrost. Starker Befall verringert die Assimilationsfläche,
  beschleunigt das Absterben der Blätter und kann Ertrag und Kornqualität
  deutlich drücken, besonders bei feuchtwarmer Witterung.
priznaky: >-
  Der Gelbrost bildet zitronengelbe Sporenlager, die in Streifen entlang der
  Blattadern angeordnet sind und im zeitigen Frühjahr am auffälligsten
  auftreten. Der Braunrost zeigt kleine rostbraune, unregelmäßig verteilte Lager
  auf der Blattoberseite. Der Schwarzrost bildet dunkelbraune bis schwarze
  längliche Lager vor allem an Halmen und Blattscheiden. Aus allen Lagern lassen
  sich die Sporen abreiben und hinterlassen eine farbige Spur an den Fingern.
hostitele:
  - Winter- und Sommerweizen
  - Gerste (auch Zwergrost)
  - Roggen, Hafer, Triticale
  - Gräser (Zwischenwirte und Reservoir)
sireni: >-
  Die Roste breiten sich über Uredosporen aus, die der Wind auch über große
  Entfernungen verfrachtet — das ermöglicht rasche flächige Epidemien. Der
  Gelbrost bevorzugt ein kühleres, feuchtes Frühjahr, Braun- und Schwarzrost
  wärmere Witterung. Lange Blattnässe fördert die Infektion. Quelle der
  Frühjahrsinfektion sind Ausfallgetreide, Wintergetreide und Sporenzuflug aus
  anderen Regionen.
skodlivost: >-
  Die Roste zählen zu den schädlichsten Blattkrankheiten des Getreides; starker
  Befall kann bei günstiger Witterung und anfälligen Sorten den Ertrag um
  Zehnerprozente mindern. Am schnellsten schädigt der Gelbrost, der den Bestand
  bereits im zeitigen Frühjahr befällt und die Assimilationsfläche in der Phase
  der Kornanlage und Kornfüllung zerstört.
cyklus: >-
  Die Roste haben einen komplexen Entwicklungszyklus mit mehreren Sporentypen
  und bei einigen Arten mit Wirtswechsel (Zwischenwirt des Schwarzrostes ist die
  Berberitze). Sie überwintern als Myzel und Uredosporen an Wintergetreide und
  Ausfallgetreide, leiten im Frühjahr die Infektion ein und vermehren sich
  während der Vegetation polyzyklisch über Uredosporen. Am Saisonende bilden sie
  dunkle Teleutosporen, die an Ernterückständen überdauern.
ucinne_latky:
  - latka: tebuconazole
  - latka: prothioconazole
  - latka: azoxystrobin
  - latka: pyraclostrobin + fluxapyroxad
ochrana: >-
  Entscheidend sind die Wahl widerstandsfähiger Sorten und die
  Bestandeskontrolle ab dem zeitigen Frühjahr. Bei Auftreten werden Fungizide
  eingesetzt (Azole, Strobilurine, SDHI), am besten vorbeugend oder zu Beginn
  der Epidemie und mit Wirkstoffwechsel wegen der Resistenzgefahr. Die
  Beseitigung von Ausfallgetreide und das Einarbeiten der Ernterückstände
  verringern die Infektionsquellen. ‼️ Die Zulassung von Pflanzenschutzmitteln
  ist national geregelt — prüfen Sie sie in Deutschland beim BVL, in Österreich
  beim BAES beziehungsweise der AGES.
aliases:
  - Roste
  - Gelbrost
  - Braunrost
  - Schwarzrost
  - Getreiderost
faq:
  - q: Wie unterscheidet man Rost von anderen Getreidekrankheiten?
    a: >-
      Für die Roste sind pulvrige Sporenlager typisch, die sich an den Fingern
      abreiben und eine rostfarbene oder gelbe Spur hinterlassen. Damit
      unterscheiden sie sich vom Mehltau (weißer Belag) und von
      Blattfleckenkrankheiten wie Septoria (abgegrenzte Nekrosen ohne pulvrige
      Sporen).
  - q: Welcher Rost ist am gefährlichsten?
    a: >-
      Sehr gefährlich ist der Gelbrost, der bereits im zeitigen Frühjahr
      auftritt und die charakteristischen gelben Sporenstreifen entlang der
      Blattadern bildet. Unter günstigen Bedingungen breitet er sich rasch aus
      und kann große Ertragsverluste verursachen.
  - q: Wann sollte man gegen Roste mit einem Fungizid eingreifen?
    a: >-
      Am wirksamsten ist der Eingriff vorbeugend oder gleich zu Beginn der
      Epidemie, solange der Befall noch gering ist. Beim Gelbrost ist das meist
      im zeitigen Frühjahr, beim Braunrost später zum Ährenschieben.
      Entscheidend ist die regelmäßige Bestandeskontrolle.
  - q: Hilft eine widerstandsfähige Sorte gegen Roste?
    a: >-
      Ja, zwischen den Getreidesorten bestehen große Unterschiede in der
      Widerstandsfähigkeit gegen die einzelnen Roste. Die Sortenwahl ist die
      günstigste und wirksamste Maßnahme und senkt den Fungizidbedarf deutlich.
