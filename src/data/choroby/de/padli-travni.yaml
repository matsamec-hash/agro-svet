slug: padli-travni
name: Echter Mehltau des Getreides
latinsky: Blumeria graminis
puvodce: Pilz Blumeria graminis (früher Erysiphe graminis)
popis: >-
  Der Echte Mehltau ist die verbreitetste Pilzkrankheit des Getreides. Auf
  Blättern, Blattscheiden und später auch auf den Ähren bildet sich der
  charakteristische weiße bis gräuliche, mehlige Myzelbelag, der allmählich
  braun wird und in dem dunkle Fruchtkörper (Kleistothecien) heranreifen.
  Befallenes Gewebe vergilbt und stirbt vorzeitig ab, wodurch
  Assimilationsfläche, Korngewicht und Ertrag sinken. Die Krankheit breitet sich
  vor allem bei warmer, feuchter Witterung in dichten, überdüngten Beständen
  aus.
priznaky: >-
  Typisch ist ein weißer bis gräulicher, mehliger (watteartiger) Belag auf Ober-
  und Unterseite der Blätter, an Blattscheiden und Halmen, der sich anfangs mit
  dem Finger abwischen lässt. Der Belag ergraut und bräunt allmählich, und darin
  erscheinen kleine schwarze Körperchen (Kleistothecien). Unter dem Belag
  vergilbt und vertrocknet das Gewebe; der Befall schreitet von den unteren
  Blättern nach oben fort, bei starkem Druck bis in die Ähren.
hostitele:
  - Winter- und Sommerweizen
  - Gerste
  - Roggen, Hafer, Triticale
sireni: >-
  Der Mehltau breitet sich über windverfrachtete Konidien aus. Für die Infektion
  braucht er keine Tropfennässe (anders als die meisten Blattkrankheiten) — hohe
  Luftfeuchte und Temperaturen von etwa 15 bis 22 °C genügen. Die Ausbreitung
  fördern dichte, üppige und mit Stickstoff überdüngte Bestände mit
  eingeschränkter Durchlüftung. Quelle der Frühjahrsinfektion sind
  Ausfallgetreide und Wintergetreide.
skodlivost: >-
  Starker Befall verringert die Assimilationsfläche, beschleunigt die
  Blattalterung und senkt das Korngewicht; die Ertragsverluste bewegen sich
  unter günstigen Bedingungen und bei anfälligen Sorten üblicherweise im
  einstelligen bis unteren zweistelligen Prozentbereich. Die Schadschwelle wird
  nach dem Anteil befallener Blattfläche in den unteren Etagen beurteilt.
cyklus: >-
  Der Pilz überwintert als Myzel an Wintergetreide und Ausfallgetreide sowie als
  Kleistothecien an Ernterückständen. Im Frühjahr bildet er Konidien, die eine
  polyzyklische Ausbreitung einleiten; bei günstiger Witterung folgen die Zyklen
  in kurzen Abständen über die gesamte Vegetation. Der Erreger bildet
  spezialisierte Formen (formae speciales), die an einzelne Getreidearten
  gebunden sind.
ucinne_latky:
  - latka: metrafenone
  - latka: prothioconazole
  - latka: spiroxamine
  - latka: proquinazid
ochrana: >-
  Grundlage sind die Wahl widerstandsfähiger Sorten, eine ausgewogene
  Stickstoffdüngung (Überdüngung erhöht das Risiko) und eine angemessene
  Bestandesdichte. Bei Überschreiten der Schadschwelle werden Fungizide aus den
  Gruppen der Azole, Morpholine oder spezifische Mehltaumittel eingesetzt, oft
  in Kombination für Blatt- und Ährenschutz. Wichtig ist der Wechsel der
  Wirkstoffe zur Resistenzvorbeugung. ‼️ Die Zulassung von Pflanzenschutzmitteln
  ist national geregelt — prüfen Sie sie in Deutschland beim BVL, in Österreich
  im Pflanzenschutzmittelregister des BAES beziehungsweise der AGES.
aliases:
  - Echter Mehltau
  - Getreidemehltau
  - Mehltau
faq:
  - q: Welche Kulturen befällt der Echte Mehltau am häufigsten?
    a: >-
      Der Echte Mehltau befällt die meisten Getreidearten — Weizen, Gerste,
      Hafer, Roggen und Triticale. Der Erreger bildet zwar spezialisierte Formen
      (formae speciales), die an eine bestimmte Art gebunden sind, tritt als
      Krankheit aber über das gesamte Getreidespektrum auf.
  - q: Wie erkennt man Mehltau am Getreide?
    a: >-
      Typisch ist ein weißer, mehliger Belag auf Blättern und Halmen, der sich
      anfangs mit dem Finger abwischen lässt. Er dunkelt allmählich nach, und
      darin erscheinen kleine schwarze Fruchtkörper. Befallene Blätter vergilben
      und vertrocknen vorzeitig.
  - q: Warum begünstigen dichte und überdüngte Bestände den Mehltau?
    a: >-
      In einem dichten, mit Stickstoff überdüngten Bestand herrscht höhere
      Luftfeuchte, die Durchlüftung ist schlechter und das Gewebe weicher und
      anfälliger. Das schafft ideale Bedingungen für die Ausbreitung —
      ausgewogene Ernährung und Bestandesdichte sind deshalb Teil der
      Bekämpfung.
  - q: Braucht Mehltau Regen für die Infektion?
    a: >-
      Nein. Anders als die meisten Blattkrankheiten benötigt der Mehltau zur
      Sporenkeimung kein Tropfenwasser, hohe Luftfeuchte genügt. Er kann sich
      deshalb auch in Perioden ohne nennenswerte Niederschläge ausbreiten,
      sofern die Bestände dicht und feucht sind.
