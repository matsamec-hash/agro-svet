slug: plisen-seda
name: Grauschimmelfäule
latinsky: Botrytis cinerea
puvodce: Pilz Botrytis cinerea
popis: >-
  Die Grauschimmelfäule ist eine allgegenwärtige Pilzkrankheit mit sehr breitem
  Wirtskreis, von Ackerkulturen über Gemüse bis zu Obst. Auf absterbendem oder
  verletztem Gewebe bildet sich ein grauer, staubender Belag aus dichtem Myzel
  und Sporen. Der Pilz verhält sich überwiegend als Schwächeparasit — er dringt
  über Verletzungen, abgestorbene Blütenblätter oder geschwächtes Gewebe ein und
  verursacht bei feuchter, kühlerer Witterung Fäulen. Bei Zuckerrübe und Raps
  befällt er Blätter und weiteres Gewebe, vor allem in dichten, feuchten
  Beständen.
priznaky: >-
  Typisch ist ein grauer bis graubrauner, staubender Belag, der bei Berührung
  aus dem befallenen Gewebe stäubt (eine Masse von Konidien). Zunächst entstehen
  wässrige, bräunende Flecken an geschädigten oder absterbenden Teilen
  (Blütenblätter, Verletzungen, Stängelbasis), von wo die Fäule ins gesunde
  Gewebe fortschreitet. Im befallenen Gewebe bilden sich später kleine schwarze
  Sklerotien.
hostitele:
  - Raps und Sonnenblume
  - Zuckerrübe
  - Leguminosen und Gemüse
  - Weinrebe und Obst (Beerenobst)
sireni: >-
  Der Pilz breitet sich über Konidien aus, die Wind und Spritzwasser
  verfrachten. Sporenkeimung und Infektion fördern lange Gewebenässe, hohe
  Luftfeuchte und kühlere Witterung (Optimum etwa 15 bis 20 °C).
  Eintrittspforten sind Verletzungen und abgestorbenes Gewebe, weshalb das
  Risiko in dichten, lagernden oder frostgeschädigten Beständen am höchsten ist.
skodlivost: >-
  Bei Ackerkulturen ist die Grauschimmelfäule eher eine Begleitkrankheit
  geschwächter Bestände; ihre Bedeutung wächst bei Gemüse, Wein und Obst, wo sie
  Fruchtfäulen vor und nach der Ernte verursacht. Die Schädlichkeit steigt in
  feuchten Jahren und dichten Beständen; bei gelagertem Obst und Gemüse zählt
  sie zu den Hauptverlustursachen.
cyklus: >-
  Der Pilz überwintert als Sklerotien und Myzel an Pflanzenresten. Bei
  Feuchtigkeit wachsen daraus Konidienträger, die große Mengen an Konidien
  bilden und eine wiederholte Ausbreitung über die gesamte Vegetation
  sicherstellen. Botrytis befällt leicht absterbendes Gewebe und breitet sich
  von dort ins gesunde aus; er neigt stark zur Resistenzbildung gegenüber
  Fungiziden.
ucinne_latky:
  - latka: fludioxonil + cyprodinil
  - latka: boscalid + pyraclostrobin
  - latka: fenhexamid
ochrana: >-
  Grundlage sind die Begrenzung der Feuchtigkeit im Bestand (luftige Bestände,
  ausgewogene Ernährung) und das Vermeiden von Pflanzenverletzungen. Eine
  gezielte Fungizidbehandlung richtet sich auf Risikophasen und geschwächte
  Bestände; wegen der Resistenzneigung von Botrytis müssen Wirkstoffe mit
  unterschiedlichem Wirkmechanismus gewechselt werden. Es helfen auch das
  Einarbeiten befallener Rückstände und bei Gemüse und Obst die rasche Kühlung
  der Ernte. ‼️ Die Zulassung von Pflanzenschutzmitteln ist national geregelt —
  prüfen Sie sie in Deutschland beim BVL, in Österreich beim BAES
  beziehungsweise der AGES.
aliases:
  - Grauschimmel
  - Botrytis
faq:
  - q: Warum tritt der Grauschimmel vor allem an geschwächten Pflanzen auf?
    a: >-
      Botrytis cinerea ist überwiegend ein Schwächeparasit — er dringt am
      leichtesten über Verletzungen, abgestorbene Blütenblätter oder durch
      Stress, Frost oder andere Krankheiten geschwächtes Gewebe ein. Gesunde,
      gut ernährte Bestände befällt er schwerer.
  - q: Welche Witterung begünstigt den Grauschimmel?
    a: >-
      Der Grauschimmel breitet sich vor allem bei feuchter, kühlerer Witterung
      und hoher Luftfeuchte in dichten Beständen aus. Lange Blattnässe und
      schlechte Durchlüftung erhöhen das Risiko erheblich.
  - q: Warum ist Resistenz beim Grauschimmel ein Problem?
    a: >-
      Botrytis cinerea hat einen kurzen Vermehrungszyklus und eine große
      Sporenpopulation und bildet daher rasch fungizidresistente Stämme. Deshalb
      ist es entscheidend, Wirkstoffe mit unterschiedlichem Wirkmechanismus zu
      wechseln und sich nicht wiederholt auf eine Gruppe zu verlassen.
  - q: Wie begrenzt man den Grauschimmel bei gelagertem Obst und Gemüse?
    a: >-
      Es helfen die Ernte gesunder, unverletzter Früchte bei Trockenheit, rasche
      Kühlung und die Einhaltung niedriger Temperatur und angemessener Feuchte
      im Lager. Verletzte und angefaulte Stücke müssen aussortiert werden, weil
      sie Ausgangspunkt der weiteren Ausbreitung sind.
