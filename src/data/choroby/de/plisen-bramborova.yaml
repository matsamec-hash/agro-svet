slug: plisen-bramborova
name: Kraut- und Knollenfäule der Kartoffel
latinsky: Phytophthora infestans
puvodce: Eipilz (Oomycet) Phytophthora infestans
popis: >-
  Die Kraut- und Knollenfäule ist die gefährlichste Krankheit der Kartoffel und
  befällt auch Tomaten. Auf den Blättern bilden sich braunschwarze, welkende
  Flecken, auf der Blattunterseite bei Feuchtigkeit ein weißlicher Sporenrasen;
  die Krankheit greift rasch auf das gesamte Kraut und später auf die Knollen
  über, wo sie eine braune Fäule verursacht. Bei warmer, feuchter Witterung kann
  sie einen ganzen Bestand innerhalb weniger Tage vernichten. Es ist derselbe
  Erreger, der im 19. Jahrhundert die große Hungersnot in Irland auslöste.
priznaky: >-
  Auf den Blättern entstehen dunkelgrüne bis braunschwarze, wässrige Flecken,
  zunächst häufig an Blatträndern und -spitzen. Auf der Blattunterseite ist an
  der Grenze zwischen gesundem und befallenem Gewebe bei Feuchtigkeit ein
  weißlicher Rasen von Sporangienträgern erkennbar. Das befallene Kraut schwärzt
  rasch, fault und riecht faulig. An den Knollen erscheinen gräuliche
  eingesunkene Flecken und unter der Schale eine rostbraune trockene bis feuchte
  Fäule, die bis ins Fleisch reicht.
hostitele:
  - Kartoffeln
  - Tomaten
sireni: >-
  Die Krankheit breitet sich über Sporangien aus, die Wind und Regen auch über
  große Entfernungen verfrachten. Entscheidend sind Feuchtigkeit und Wärme —
  lange Blattnässe und Temperaturen von etwa 15 bis 22 °C (sogenannte
  Krautfäule-Perioden). Unter diesen Bedingungen läuft ein neuer
  Infektionszyklus innerhalb weniger Tage ab. Quellen sind befallene Knollen
  (Pflanzgut, Abfallhaufen) und überwinternde Oosporen.
skodlivost: >-
  Die Kraut- und Knollenfäule ist die schwerwiegendste Krankheit der Kartoffel;
  bei vernachlässigtem Schutz kann sie unter günstiger Witterung einen ganzen
  Bestand in ein bis zwei Wochen vernichten. Befallene Knollen faulen auch im
  Lager und sind Eintrittspforte für bakterielle Folgefäulen. Die Verluste
  betreffen daher sowohl den Ertrag als auch die Lagerfähigkeit.
cyklus: >-
  Der Erreger überwintert als Myzel in befallenen Knollen (Pflanzgut, Abfall)
  und als Oosporen im Boden. Aus infizierten Knollen wächst befallenes Kraut,
  auf dem sich Sporangien bilden und die Epidemie einleiten. Bei Feuchtigkeit
  setzen die Sporangien bewegliche Zoosporen frei, die Kraut und Knollen
  infizieren; bei günstiger Witterung wiederholt sich der Zyklus rasch.
ucinne_latky:
  - latka: mandipropamid
  - latka: fluazinam
  - latka: cymoxanil + mancozeb
  - latka: oxathiapiprolin
ochrana: >-
  Entscheidend ist ein vorbeugender Fungizidschutz, der nach Warndienst noch vor
  dem Auftreten der Symptome beginnt und je nach Krankheitsdruck und Witterung
  alle 7 bis 14 Tage wiederholt wird (systemische Wirkstoffe im Zuwachs,
  Kontaktmittel zur Abdeckung, spezifische Mittel für die Knollen). Wichtig sind
  gesundes zertifiziertes Pflanzgut, ausreichendes Anhäufeln zum Schutz der
  Knollen vor Sporeneinschwemmung sowie Sikkation oder mechanische
  Krautbeseitigung vor der Ernte. ‼️ Die Zulassung von Pflanzenschutzmitteln ist
  national geregelt — prüfen Sie sie in Deutschland beim BVL, in Österreich beim
  BAES beziehungsweise der AGES.
aliases:
  - Krautfäule
  - Braunfäule
  - Phytophthora
faq:
  - q: Warum ist die Krautfäule so gefürchtet?
    a: >-
      Phytophthora infestans breitet sich bei warmer, feuchter Witterung
      außerordentlich rasch aus und kann einen ganzen Bestand in wenigen Tagen
      vernichten. Sie befällt auch die Knollen, die dann im Lager faulen. Es ist
      derselbe Erreger, der die große Hungersnot in Irland auslöste.
  - q: Wie schützt man sich gegen die Krautfäule?
    a: >-
      Entscheidend ist ein vorbeugender Fungizidschutz, der nach Warndienst noch
      vor dem Auftreten der Symptome beginnt und regelmäßig wiederholt wird.
      Ergänzend wirken gesundes Pflanzgut, gutes Anhäufeln zum Schutz der
      Knollen und die rechtzeitige Krautbeseitigung vor der Ernte.
  - q: Was ist eine Krautfäule-Periode?
    a: >-
      Damit ist eine Witterungslage gemeint, die die Infektion begünstigt —
      lange Blattnässe und Temperaturen von etwa 15 bis 22 °C. Prognosemodelle
      melden diese Perioden und dienen dazu, vorbeugende Spritzungen noch vor
      dem Auftreten der Symptome zu terminieren.
  - q: Warum sollte man das Kraut vor der Ernte beseitigen?
    a: >-
      Die Vernichtung des Krauts (Sikkation oder mechanisch) unterbricht die
      Sporenquelle und lässt die Schale der Knollen abhärten, sodass sie sich
      bei der Ernte weniger infizieren. Eine Ernte in noch nicht abgetötetes
      Kraut erhöht das Risiko der Knollenfäule im Lager.
