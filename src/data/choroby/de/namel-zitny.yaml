slug: namel-zitny
name: Mutterkorn
latinsky: Claviceps purpurea
puvodce: Pilz Claviceps purpurea
popis: >-
  Das Mutterkorn ist eine Pilzkrankheit des Getreides und der Gräser, am
  auffälligsten beim Roggen, der fremdbefruchtend ist und länger geöffnete
  Blüten hat. Anstelle des Korns bildet sich in der Ähre ein dunkelviolettes bis
  schwarzes, hornförmiges Sklerotium (das Mutterkorn), das die Karyopse
  überwächst. Die Sklerotien enthalten giftige Mutterkornalkaloide, die für
  Menschen und Nutztiere gefährlich sind, weshalb der Mutterkorngehalt in
  Lebens- und Futtermittelgetreide gesetzlich überwacht und begrenzt ist.
priznaky: >-
  Erstes Symptom ist zur Blüte eine süße, klebrige Flüssigkeit (Honigtau), die
  aus den befallenen Blüten austritt und Insekten anlockt. Später bildet sich
  anstelle des Korns in der Ähre ein hartes hornförmiges Sklerotium —
  dunkelviolett bis schwarz, meist deutlich länger als eine gesunde Karyopse und
  aus den Spelzen herausragend. In einer Ähre finden sich ein bis mehrere
  Sklerotien.
hostitele:
  - Roggen (am anfälligsten)
  - Weizen, Gerste, Hafer, Triticale
  - Samengräser und Ungrasarten
sireni: >-
  Die Primärinfektion geht von Ascosporen aus, die aus im Boden überwinterten
  oder ins Saatgut gelangten Sklerotien freigesetzt werden. Die Ascosporen
  infizieren die geöffneten Blüten zur Blütezeit; der Honigtau mit Konidien wird
  anschließend von Insekten und Regen auf weitere Blüten übertragen. Die
  Anfälligkeit erhöht alles, was die Blüte verlängert und auflockert (kühle
  Witterung, lückige Bestände, Fremdbefruchtung).
skodlivost: >-
  Der unmittelbare Ertragsverlust ist eher gering, entscheidend ist das
  gesundheitliche und rechtliche Risiko: Die Sklerotien enthalten toxische
  Mutterkornalkaloide, deren Gehalt in Lebens- und Futtermittelgetreide
  gesetzlich begrenzt ist. Eine Überschreitung entwertet die Partie. Historisch
  verursachte das Mutterkorn Massenvergiftungen (Ergotismus).
cyklus: >-
  Der Pilz überwintert als Sklerotium im Boden und im Saatgut. Im Frühjahr
  wachsen daraus kleine Fruchtkörper (Stromata) mit Ascosporen, die die
  Infektion blühenden Getreides und blühender Gräser einleiten. Nach der
  Infektion folgt die Honigtau- beziehungsweise Konidienphase, die Insekten
  verbreiten, und schließlich bilden sich neue Sklerotien. Sklerotien verlieren
  nach tiefem Pflügen ihre Keimfähigkeit.
ucinne_latky: []
ochrana: >-
  Eine chemische Bekämpfung des Mutterkorns ist nicht wirksam — entscheidend ist
  die Anbautechnik. Es helfen gereinigtes, mutterkornfreies Saatgut, tiefes
  Pflügen (Sklerotien von der Oberfläche verlieren die Keimfähigkeit), das
  Zurückdrängen blühender Gräser und von Ausfallgetreide im Umfeld der Flächen
  als Infektionsquellen sowie eine gleichmäßige, geschlossene Blüte des
  Bestands, die die anfällige Phase verkürzt. Die Sklerotien werden durch
  Reinigen und Sortieren des Ernteguts entfernt.
aliases:
  - Mutterkorn
  - Claviceps
faq:
  - q: Warum ist Mutterkorn gefährlich?
    a: >-
      Die Sklerotien enthalten Mutterkornalkaloide, die für Menschen und Tiere
      giftig sind (historisch verursachten sie Vergiftungen, den sogenannten
      Ergotismus). Deshalb wird ihr Gehalt in Lebens- und Futtermittelgetreide
      überwacht und ist gesetzlich begrenzt.
  - q: Warum ist Roggen am stärksten gefährdet?
    a: >-
      Roggen ist fremdbefruchtend, und seine Blüten bleiben länger geöffnet,
      sodass sie den Sporen des Mutterkorns zur Blütezeit leichter zugänglich
      sind. Selbstbefruchtende Getreidearten mit rasch schließenden Blüten
      werden seltener befallen.
  - q: Kann man gegen Mutterkorn ein Fungizid einsetzen?
    a: >-
      Eine wirksame chemische Bekämpfung gibt es nicht. Entscheidend sind
      vorbeugende anbautechnische Maßnahmen — gesundes gereinigtes Saatgut,
      tiefes Pflügen zum Vergraben der Sklerotien, Zurückdrängen blühender
      Gräser und Reinigen der Ernte.
  - q: Wie entfernt man die Sklerotien aus dem Korn?
    a: >-
      Die Sklerotien sind meist länger und leichter als gesundes Korn und lassen
      sich durch gründliches Reinigen und Sortieren aus der Partie entfernen
      (Siebe, Schwerkraft- und optische Sortierer). Bei stark befallener Ernte
      ist die Reinigung zur Einhaltung der Grenzwerte unerlässlich.
