slug: fuzariozy
name: Fusariosen
latinsky: Fusarium spp.
puvodce: Pilze der Gattung Fusarium (z. B. F. graminearum, F. culmorum)
popis: >-
  Die Fusariosen sind eine Gruppe von Krankheiten, verursacht durch Pilze der
  Gattung Fusarium, die Wurzeln, Halm, Ähre und Kolben zahlreicher Kulturen
  befallen. Beim Getreide ist die Ährenfusariose am schwerwiegendsten; sie zeigt
  sich durch vorzeitig ausgebleichte Ährchen und einen rosafarbenen Belag am
  Korn. Bei Mais, Leguminosen und Ölfrüchten überwiegen Wurzel- und
  Stängelfäulen. Neben Ertragsverlusten liegt das Risiko in der Bildung von
  Mykotoxinen (vor allem Deoxynivalenol, DON), die die gesundheitliche
  Unbedenklichkeit von Korn und Futter beeinträchtigen.
priznaky: >-
  Bei der Ährenfusariose bleichen einzelne Ährchen oder ganze Ährenteile
  vorzeitig aus, während die gesunde Umgebung grün bleibt; bei Feuchtigkeit ist
  an Ährchen und Korn ein rosa bis lachsfarbener Myzelbelag erkennbar. Das Korn
  ist geschrumpft, matt und leicht. An Wurzeln und Halm entstehen braune,
  eingetrocknete Fäulen, die Pflanzen reifen vorzeitig ab und lagern; beim Mais
  faulen Wurzeln, Stängel und Kolben.
hostitele:
  - Weizen und Gerste
  - Mais
  - Hafer, Roggen, Triticale
  - Leguminosen und Ölfrüchte (Wurzel- und Stängelfäulen)
sireni: >-
  Infektionsquellen sind Ernterückstände (insbesondere von Mais) und befallenes
  Saatgut. Die Infektion der Ähre erfolgt zur Blüte bei warmer, feuchter
  Witterung — Regen während der Blüte ist der wichtigste Risikofaktor. Die
  Sporen verbreiten sich über Wind und Spritzwasser; eine reduzierte
  Bodenbearbeitung, die Rückstände an der Oberfläche belässt, fördert den
  Befall.
skodlivost: >-
  Neben dem unmittelbaren Ertragsverlust und dem geringeren Tausendkorngewicht
  ist die Kontamination des Korns mit Mykotoxinen das Hauptrisiko, vor allem mit
  Deoxynivalenol (DON) und Zearalenon, deren Grenzwerte in Lebens- und
  Futtermittelgetreide gesetzlich festgelegt sind. Eine Überschreitung kann eine
  ganze Partie entwerten, weshalb die Ährenfusariose auch hygienisch bedeutsam
  ist.
cyklus: >-
  Die Pilze überwintern als Myzel und als Dauerformen (Chlamydosporen,
  Perithecien) an Ernterückständen und im Boden. Im Frühjahr und Sommer bilden
  sie Sporen (Ascosporen und Konidien), die die Ähren zur Blüte und die Wurzeln
  während der gesamten Vegetation infizieren. Riskant ist die Fruchtfolge
  Getreide nach Mais.
ucinne_latky:
  - latka: prothioconazole + tebuconazole
  - latka: metconazole
  - latka: tebuconazole
ochrana: >-
  Grundlage sind eine ausgewogene Fruchtfolge (riskant ist vor allem Weizen nach
  Mais), eine sorgfältige Bearbeitung und Einarbeitung der Ernterückstände sowie
  die Wahl weniger anfälliger Sorten. Beim Getreide zielt die Fungizidbehandlung
  mit Azolen gegen die Ährenfusariose auf die Blüte, nach Warndienst und
  Niederschlagsprognose. Wesentlich sind außerdem die Ernte bei trockener
  Witterung und die rasche Trocknung des Korns, die die Mykotoxinbildung
  begrenzen. ‼️ Die Zulassung von Pflanzenschutzmitteln ist national geregelt —
  prüfen Sie sie in Deutschland beim BVL, in Österreich beim BAES
  beziehungsweise der AGES.
aliases:
  - Ährenfusariose
  - Fusarium
  - Fusarium-Wurzel- und Stängelfäule
  - Fusarium-Kolbenfäule
faq:
  - q: Was macht Fusariosen über den Ertragsverlust hinaus gefährlich?
    a: >-
      Pilze der Gattung Fusarium bilden Mykotoxine, vor allem Deoxynivalenol
      (DON) und Zearalenon. Diese können Lebens- und Futtermittelgetreide
      kontaminieren, und für Korn gelten gesetzlich überwachte Grenzwerte —
      Fusariosen gefährden damit auch die gesundheitliche Unbedenklichkeit der
      Erzeugung.
  - q: Welche Vorfrucht erhöht das Fusariose-Risiko?
    a: >-
      Am riskantesten ist Getreide (vor allem Weizen) nach Mais, dessen
      Ernterückstände eine wichtige Infektionsquelle sind. Das Risiko erhöht
      auch eine reduzierte Bodenbearbeitung, die die Rückstände an der
      Oberfläche belässt.
  - q: Wann behandelt man gegen die Ährenfusariose?
    a: >-
      Am wirksamsten ist die Behandlung zur Blüte des Getreides, wenn der Pilz
      die Ähre infiziert. Der Termin richtet sich nach Warndienst und
      Niederschlagsprognose — Regen während der Blüte erhöht das Risiko
      erheblich, weshalb vor der erwarteten Regenperiode behandelt wird.
  - q: Wie senkt man den Mykotoxingehalt in einem bereits befallenen Bestand?
    a: >-
      Nach dem Befall helfen die Ernte bei trockener Witterung, eine
      Mähdreschereinstellung, die leichtes geschrumpftes Korn ausbläst, sowie
      rasches Trocknen und Reinigen der Ernte. Die Lagerung feuchten befallenen
      Korns erhöht die Mykotoxinbildung weiter.
