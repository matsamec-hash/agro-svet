slug: branicnatka-psenicna
name: Septoria-Blattdürre des Weizens
latinsky: Zymoseptoria tritici
puvodce: >-
  Pilz Zymoseptoria tritici (früher Septoria tritici / Mycosphaerella
  graminicola)
popis: >-
  Die Septoria-Blattdürre, auch Blattseptoria genannt, ist in Mitteleuropa eine
  der bedeutendsten Blattkrankheiten des Weizens. Auf den Blättern bilden sich
  längliche gelbliche bis braune, von den Blattadern begrenzte Flecken, in denen
  kleine schwarze Fruchtkörper (Pyknidien) erkennbar sind. Die Krankheit
  schreitet von den unteren zu den oberen Blättern fort und kann bei feuchter
  Witterung auch das Fahnenblatt zerstören, was den Ertrag erheblich mindert.
priznaky: >-
  Auf den Blättern entstehen zunächst kleine wässrige Flecken, die sich entlang
  der Blattadern zu unregelmäßigen gelbbraunen bis gräulichen Nekrosen mit
  dunklem Rand strecken. In den Flecken sind mit bloßem Auge schwarze Punkte
  sichtbar — Pyknidien mit Sporen. Der Befall schreitet von unten nach oben
  fort; bei starkem Druck sterben die oberen Blätter einschließlich des
  Fahnenblatts ab und der Bestand trocknet vorzeitig ein.
hostitele:
  - Winter- und Sommerweizen
  - Triticale
  - Vereinzelt weitere Gräser und Getreidearten
sireni: >-
  Die Primärinfektion geht von Ascosporen aus, die aus Ernterückständen
  freigesetzt werden; im Bestand breitet sich die Krankheit weiter über Konidien
  aus, die Regentropfen in höhere Blattetagen spritzen. Feuchte und milde
  Witterung (etwa 15 bis 20 °C) sowie lange Blattnässe fördern die Infektion.
  Dichte, üppige Bestände beschleunigen die Ausbreitung.
skodlivost: >-
  Die Septoria-Blattdürre zählt zu den schädlichsten Blattkrankheiten des
  Weizens; die Schädigung der oberen Blätter und des Fahnenblatts senkt
  unmittelbar das Korngewicht. Die Ertragsverluste können bei starkem Befall und
  günstiger Witterung Zehnerprozente erreichen. Der Erreger neigt stark zur
  Resistenzbildung gegenüber Wirkstoffen.
cyklus: >-
  Der Pilz überwintert an Ernterückständen des Weizens und im Winterweizen als
  Myzel. Ascosporen leiten die Frühjahrsinfektion der unteren Blätter ein, von
  wo sich die Krankheit im Verlauf des Frühjahrs polyzyklisch über Konidien in
  die oberen Etagen ausbreitet. Gefährlich ist vor allem die lange Latenzzeit
  von mehreren Wochen, in der der Befall nicht sichtbar ist.
ucinne_latky:
  - latka: prothioconazole
  - latka: mefentrifluconazole
  - latka: fluxapyroxad + mefentrifluconazole
  - latka: benzovindiflupyr
  - latka: folpet
ochrana: >-
  Wichtig sind der Anbau widerstandsfähigerer Sorten, der Verzicht auf Weizen
  nach Weizen und das Einarbeiten der Ernterückstände als Infektionsquelle. Der
  Fungizidschutz zielt auf die oberen Blätter und das Fahnenblatt im Stadium
  Schossen bis Ährenschieben; eingesetzt werden Azole und SDHI-Wirkstoffe, wobei
  Wechsel und Kombination der Wirkstoffe wegen der Resistenzgefahr angebracht
  sind. ‼️ Die Zulassung von Pflanzenschutzmitteln ist national geregelt —
  prüfen Sie sie in Deutschland beim BVL, in Österreich beim BAES
  beziehungsweise der AGES.
aliases:
  - Blattseptoria
  - Septoria tritici
  - Septoria-Blattfleckenkrankheit
faq:
  - q: Warum ist der Schutz des Fahnenblatts entscheidend?
    a: >-
      Fahnenblatt und das darunterliegende Blatt bilden einen wesentlichen Teil
      der Assimilationsfläche, die das Korn füllt. Ihre Schädigung senkt
      unmittelbar Korngewicht und Ertrag, weshalb die Fungizidbehandlung so
      terminiert wird, dass sie diese Blätter schützt.
  - q: Wie breitet sich die Septoria-Blattdürre aus?
    a: >-
      Die Primärinfektion geht von Ernterückständen aus (Ascosporen), im Bestand
      breitet sie sich dann über Konidien aus, die Regentropfen in höhere
      Blattetagen spritzen. Feuchte und milde Witterung fördert die Ausbreitung
      erheblich.
  - q: Warum ist Resistenz bei Septoria ein Problem?
    a: >-
      Zymoseptoria tritici neigt stark zur Resistenzbildung, und in ganz Europa
      ist ein Wirkungsverlust bei zahlreichen Azolen und SDHI beschrieben.
      Empfohlen wird deshalb, Wirkstoffe mit unterschiedlichem Wirkmechanismus
      zu wechseln und zu kombinieren und einen Multisite-Wirkstoff beizugeben.
  - q: Wie unterscheidet man Septoria von anderen Blattflecken?
    a: >-
      Charakteristisch sind längliche, von den Blattadern begrenzte Nekrosen mit
      sichtbaren schwarzen Pyknidien in den Flecken. Anders als die Roste bildet
      sie keine pulvrigen Sporenlager, und anders als der Mehltau keinen weißen
      Belag auf der Blattoberfläche.
