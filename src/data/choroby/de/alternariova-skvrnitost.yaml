slug: alternariova-skvrnitost
name: Dürrfleckenkrankheit (Alternaria)
latinsky: Alternaria spp.
puvodce: Pilze der Gattung Alternaria (z. B. A. brassicae, A. brassicicola)
popis: >-
  Die Dürrfleckenkrankheit ist eine Pilzkrankheit vor allem der
  Kruziferen-Ölfrüchte und der Sonnenblume. Auf Blättern, Stängeln und Schoten
  bilden sich dunkle, häufig konzentrisch gezonte Flecken mit graubis schwarzem
  Sporulationsbelag. Beim Raps betrifft sie vor allem die Schoten, die vorzeitig
  aufplatzen und ausfallen, was Ernteverluste verursacht und die Saatgutqualität
  mindert. Die Krankheit breitet sich bei feuchter, wärmerer Witterung gegen
  Ende der Vegetation aus.
priznaky: >-
  Auf den Blättern entstehen dunkelbraune bis schwarze runde Flecken mit
  ausgeprägter konzentrischer Zonierung (Ringelmuster), oft mit gelbem Hof. Bei
  Feuchtigkeit überzieht sie ein graubis schwarzer samtiger Konidienbelag. An
  Stängeln und Schoten erscheinen längliche schwarze Flecken; befallene Schoten
  reifen vorzeitig, verformen sich und platzen auf. Stark befallene Blätter
  vergilben und fallen vorzeitig ab.
hostitele:
  - Winter- und Sommerraps
  - Senf
  - Kohlgemüse (Kopfkohl, Wirsing, Brokkoli)
  - Sonnenblume
sireni: >-
  Der Pilz breitet sich über Konidien aus, die Wind und Regen verfrachten. Die
  Infektion fördern warme und feuchte Witterung (Optimum etwa 18 bis 25 °C) und
  lange Blattnässe in der zweiten Vegetationshälfte, insbesondere während der
  Schotenreife. Eine wichtige Quelle der Primärinfektion sind befallenes Saatgut
  und Ernterückstände von Kruziferen.
skodlivost: >-
  Die Hauptverluste entstehen durch den Befall der Schoten, ihr vorzeitiges
  Aufplatzen und das Ausfallen der Körner vor und während der Ernte. Die
  Ertragsverluste beim Raps bewegen sich je nach Befallsstärke und Witterung
  üblicherweise im einstelligen Prozentbereich, bei starkem Druck auch darüber.
  Befallenes Saatgut hat ein geringeres Tausendkorngewicht und einen niedrigeren
  Ölgehalt.
cyklus: >-
  Der Pilz überwintert als Myzel und Konidien an Ernterückständen und in
  befallenem Saatgut. Im Frühjahr und Sommer bildet er neue Konidien, die eine
  wiederholte (polyzyklische) Ausbreitung im Bestand sicherstellen. Am
  anfälligsten ist der Raps von der Abblüte bis zur Schotenreife.
ucinne_latky:
  - latka: azoxystrobin
  - latka: boscalid + dimoxystrobin
  - latka: prothioconazole + fluopyram
  - latka: difenoconazole
ochrana: >-
  Hilfreich sind die Einhaltung der Anbaupause für Kruziferen (mindestens 3 bis
  4 Jahre), das Einarbeiten der Ernterückstände und die Saatgutbeizung. Eine
  Fungizidbehandlung während der Schotenreife (häufig gemeinsam mit der
  Behandlung gegen Sclerotinia) begrenzt den Schotenbefall und das Ausfallen.
  Eine zeitige, nicht hinausgezögerte Ernte senkt die Verluste weiter. ‼️ Die
  Zulassung von Pflanzenschutzmitteln ist national geregelt — prüfen Sie sie in
  Deutschland beim BVL, in Österreich beim BAES beziehungsweise der AGES.
aliases:
  - Rapsschwärze
  - Alternaria
  - Dürrfleckenkrankheit
faq:
  - q: Welche Teile des Rapses schädigt Alternaria am stärksten?
    a: >-
      Für den Ertrag sind die Schoten am empfindlichsten. Befallene Schoten
      reifen vorzeitig, platzen auf und fallen aus, sodass die Verluste
      unmittelbar vor und während der Ernte entstehen. Flecken an Blättern und
      Stängeln sind meist weniger bedeutend.
  - q: Ist die Dürrfleckenkrankheit dasselbe wie die Rapsschwärze?
    a: >-
      Es handelt sich um verwandte Krankheiten derselben Gattung — die
      Rapsschwärze verursacht vor allem Alternaria brassicae. In der Praxis
      überschneiden sich Symptome und Bekämpfung, und beide werden zu den
      Alternaria-Dürrflecken der Kruziferen gezählt.
  - q: Wann greift man beim Raps gegen Alternaria ein?
    a: >-
      Die Behandlung zielt auf die Zeit der Schotenreife, in der das Risiko von
      Befall und Ausfall am höchsten ist. In der Praxis wird sie häufig mit der
      Fungizidbehandlung gegen die Weißstängeligkeit zur Blüte beziehungsweise
      Abblüte verbunden.
  - q: Wird Alternaria über das Saatgut übertragen?
    a: >-
      Ja, befallenes Saatgut ist eine wichtige Infektionsquelle und überträgt
      den Pilz auf neue Bestände. Saatgutbeizung und die Verwendung gesunden,
      zertifizierten Saatguts zählen deshalb zu den grundlegenden vorbeugenden
      Maßnahmen.
