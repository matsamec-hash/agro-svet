slug: cerkosporioza-repy
name: Cercospora-Blattfleckenkrankheit der Rübe
latinsky: Cercospora beticola
puvodce: Pilz Cercospora beticola
popis: >-
  Die Cercospora-Blattfleckenkrankheit ist die verbreitetste und bedeutendste
  Blattkrankheit der Zuckerrübe. Auf den Blättern bilden sich kleine runde
  Flecken mit hellem Zentrum und dunkelbraunem bis rotviolettem Rand; bei
  starkem Befall fließen die Flecken zusammen und die Blätter sterben ab. Die
  Pflanze ersetzt die abgestorbenen Blätter durch neue — auf Kosten der
  Zuckereinlagerung in den Rübenkörper, sodass Ertrag und Zuckergehalt sinken.
  Die Krankheit breitet sich bei warmer, feuchter Witterung in der zweiten
  Vegetationshälfte aus.
priznaky: >-
  Erste Symptome sind kleine runde Flecken (2 bis 3 mm) mit aschgrauem Zentrum
  und scharf abgegrenztem dunkelbraunem bis rotviolettem Rand. Im Zentrum der
  Flecken sind bei Feuchtigkeit kleine schwarze Konidienträgerbüschel erkennbar.
  Die Flecken fließen allmählich zusammen, das Blatt vergilbt, bräunt und stirbt
  ab; zuerst betroffen sind die älteren äußeren Blätter. Stark befallene
  Bestände wirken wie verbrannt.
hostitele:
  - Zuckerrübe
  - Futterrübe
  - Spinat und Rote Bete (weniger bedeutend)
sireni: >-
  Der Pilz breitet sich über Konidien aus, die Wind, Regen und Maschinen
  verfrachten. Optimal für die Infektion ist warme, feuchte Witterung (etwa 25
  bis 30 °C tagsüber, nächtliche Blattnässe). Quelle der Primärinfektion sind
  befallene Ernterückstände der Rübe und der Boden — das Risiko ist deshalb auf
  Flächen mit kurzer Anbaupause am höchsten.
skodlivost: >-
  Die Cercospora zählt zu den wirtschaftlich schwerwiegendsten Krankheiten der
  Zuckerrübe. Der wiederholte Verlust der Blattfläche und deren Neubildung
  verbrauchen Zucker; die Verluste an Rübenertrag und Zuckergehalt können bei
  vernachlässigtem Schutz Zehnerprozente erreichen. Behandelt wird nach
  Warndienst beim Auftreten der ersten Flecken.
cyklus: >-
  Der Pilz überwintert als Myzel und Pseudostromata an Ernterückständen der Rübe
  im Boden, wo er mehrere Jahre überdauert. Im Frühjahr bildet er Konidien, die
  die Primärinfektion einleiten; im warmen, feuchten Sommer folgt eine Reihe
  polyzyklischer Infektionen. Eine kurze Anbaupause reichert das Inokulum im
  Boden an.
ucinne_latky:
  - latka: difenoconazole + fenpropidin
  - latka: epoxiconazole + thiophanate-methyl
  - latka: azoxystrobin + difenoconazole
  - latka: Kupferpräparate
ochrana: >-
  Grundlage sind der Anbau toleranter Sorten, die Einhaltung einer Anbaupause
  von mindestens drei Jahren und das Einarbeiten des befallenen Rübenblatts. Der
  Fungizidschutz beginnt nach Warndienst zu Befallsbeginn und wird je nach
  Krankheitsdruck wiederholt; wegen der verbreiteten Resistenz von Cercospora
  beticola müssen die Wirkstoffe gewechselt werden. ‼️ Die Zulassung von
  Pflanzenschutzmitteln ist national geregelt — prüfen Sie sie in Deutschland
  beim BVL, in Österreich beim BAES beziehungsweise der AGES.
aliases:
  - Cercospora
  - Blattfleckenkrankheit der Rübe
faq:
  - q: Wie senkt die Cercospora den Ertrag der Zuckerrübe?
    a: >-
      Befallene Blätter sterben ab, und die Pflanze muss sie durch neue
      ersetzen. Das verbraucht Energie und Zucker, die sie sonst im Rübenkörper
      einlagern würde. Die Folge sind ein geringerer Rübenertrag und ein
      sinkender Zuckergehalt.
  - q: Wann greift man gegen die Cercospora ein?
    a: >-
      Die Behandlung beginnt nach Warndienst gleich beim Auftreten der ersten
      Flecken, üblicherweise in der zweiten Sommerhälfte, und wird je nach
      Witterung und Krankheitsdruck gegebenenfalls wiederholt — unter Einhaltung
      des Wirkstoffwechsels.
  - q: Wie unterscheidet man Cercospora von der Ramularia-Blattfleckenkrankheit?
    a: >-
      Die Cercospora bildet kleinere Flecken mit ausgeprägtem dunkelbraunem bis
      rotviolettem Rand, während die Ramularia hellere, größere Flecken mit
      weniger scharfem Rand zeigt. Die sichere Unterscheidung bestätigt eine
      Laboranalyse, die Bekämpfung überschneidet sich jedoch weitgehend.
  - q: Warum ist Resistenz bei der Cercospora verbreitet?
    a: >-
      Cercospora beticola hat ein hohes Vermehrungspotenzial, und in ganz Europa
      ist ein Wirkungsverlust zahlreicher Azole und Strobilurine beschrieben.
      Empfohlen wird deshalb, Wirkstoffe mit unterschiedlichem Wirkmechanismus
      zu wechseln und durch Multisite-Präparate zu ergänzen.
