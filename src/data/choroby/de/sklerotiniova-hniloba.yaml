slug: sklerotiniova-hniloba
name: Weißstängeligkeit (Sclerotinia)
latinsky: Sclerotinia sclerotiorum
puvodce: Pilz Sclerotinia sclerotiorum (beim Klee S. trifoliorum)
popis: >-
  Die Weißstängeligkeit (Weißfäule) ist eine schwerwiegende Pilzkrankheit der
  Ölfrüchte und Leguminosen mit sehr breitem Wirtskreis. An Stängeln und
  Wurzelhals bilden sich wässrige, bräunende Läsionen mit weißem, watteartigem
  Myzel; im Inneren und auf der Oberfläche des Gewebes entstehen harte schwarze
  Sklerotien. Befallene Pflanzen welken vorzeitig, lagern und trocknen ein; bei
  Raps und Sonnenblume zählt die Krankheit zu den gefährlichsten. Die Sklerotien
  überdauern im Boden viele Jahre und sind die Infektionsquelle.
priznaky: >-
  Am Stängel, meist auf Höhe der Blattachseln, entsteht eine zunächst wässrige,
  später ausgebleichte, sich ablösende Läsion; das befallene Gewebe zerfasert
  und der Stängel bricht. Im Stängelinneren und an seiner Oberfläche finden sich
  weißes watteartiges Myzel und harte schwarze Sklerotien von Korn- bis
  Bohnengröße. Oberhalb der Läsion vergilbt die Pflanze vorzeitig, welkt und
  reift ab; bei Feuchtigkeit ist die Fäule weich, bei Trockenheit trocken und
  ausgebleicht.
hostitele:
  - Raps und Sonnenblume
  - Soja und weitere Leguminosen
  - Klee (Sclerotinia trifoliorum)
  - Gemüse (Karotte, Salat, Bohne)
sireni: >-
  Infektionsquelle sind Sklerotien im Boden, aus denen nach Durchfeuchtung
  kleine Fruchtkörper (Apothecien) wachsen und Ascosporen freisetzen. Diese
  infizieren die Pflanze am häufigsten über abgefallene Blütenblätter, die sich
  in den Blattachseln verfangen. Die Infektion fördern feuchte Witterung zur
  Blüte und ein dichter, üppiger, geschlossener Bestand mit hoher Feuchte in
  Bodennähe.
skodlivost: >-
  Bei Raps und Sonnenblume zählt die Weißstängeligkeit zu den schwerwiegendsten
  Krankheiten; befallene Pflanzen reifen vorzeitig ab, brechen und fallen aus,
  sodass die Ertragsverluste bei starkem Druck Zehnerprozente erreichen können.
  Die Sklerotien verseuchen den Boden zudem dauerhaft und mindern den Wert der
  Fläche für weitere anfällige Kulturen.
cyklus: >-
  Der Pilz überwintert als Sklerotium im Boden, wo er auch über viele Jahre
  überdauert. Nach ausreichender Durchfeuchtung wachsen daraus Apothecien mit
  Ascosporen, die die Infektion zur Blüte des Wirts einleiten. Nach dem
  Absterben der Pflanze bilden sich im Gewebe neue Sklerotien, die in den Boden
  zurückgelangen. Kurze Fruchtfolgen mit anfälligen Kulturen reichern das
  Inokulum an.
ucinne_latky:
  - latka: prothioconazole
  - latka: boscalid + dimoxystrobin
  - latka: prothioconazole + fluopyram
  - latka: Coniothyrium minitans
ochrana: >-
  Entscheidend sind eine ausreichend lange Anbaupause für anfällige Kulturen
  (Raps, Sonnenblume, Soja, Klee) und die Vermeidung zu dichter, üppiger
  Bestände. Die Fungizidbehandlung zielt beim Raps auf die Blüte, in der die
  Infektion über abgefallene Blütenblätter erfolgt. Es hilft auch die
  biologische Bekämpfung mit Coniothyrium minitans, das die Sklerotien im Boden
  abbaut. ‼️ Die Zulassung von Pflanzenschutzmitteln ist national geregelt —
  prüfen Sie sie in Deutschland beim BVL, in Österreich beim BAES
  beziehungsweise der AGES.
aliases:
  - Weißstängeligkeit
  - Sclerotinia
  - Weißfäule
faq:
  - q: Warum ist die Weißstängeligkeit so schwer zu bekämpfen?
    a: >-
      Der Erreger hat einen sehr breiten Wirtskreis und bildet widerstandsfähige
      Sklerotien, die im Boden viele Jahre überdauern. Kurze Fruchtfolgen mit
      Raps, Sonnenblume und Leguminosen reichern das Inokulum an, sodass eine
      einmalige Maßnahme nicht genügt.
  - q: Wann greift man beim Raps gegen Sclerotinia ein?
    a: >-
      Entscheidend ist die Blütezeit des Rapses, in der der Pilz die Pflanze
      über abgefallene, in den Blattachseln hängende Blütenblätter infiziert.
      Das Fungizid wird deshalb von Blühbeginn bis zur Vollblüte ausgebracht, je
      nach Witterung und Krankheitsdruck.
  - q: Wie funktioniert die biologische Bekämpfung?
    a: >-
      Ein Präparat mit dem Pilz Coniothyrium minitans wird in den Boden
      eingearbeitet, wo er die Sklerotien der Weißstängeligkeit parasitiert und
      abbaut. Das senkt den Inokulumvorrat im Boden; die Wirkung setzt jedoch
      langsam ein und dient eher als langfristige vorbeugende Maßnahme.
  - q: Welche Kulturen sind am stärksten gefährdet?
    a: >-
      Am empfindlichsten sind Raps und Sonnenblume, ferner Soja und weitere
      Leguminosen, Klee und zahlreiche Gemüsearten. Da viele anfällige Kulturen
      betroffen sind, muss bei der Fruchtfolgeplanung ihr wechselseitiges Risiko
      berücksichtigt werden.
