slug: fomova-hniloba-repky
name: Wurzelhals- und Stängelfäule des Rapses (Phoma)
latinsky: Leptosphaeria maculans
puvodce: Pilz Leptosphaeria maculans (Anamorphe Phoma lingam)
popis: >-
  Die Wurzelhals- und Stängelfäule ist eine bedeutende Krankheit des Rapses und
  weiterer Kruziferen. Im Herbst erscheinen auf den Blättern helle Flecken mit
  kleinen schwarzen Fruchtkörpern; der Pilz wächst dann durch den Blattstiel in
  Wurzelhals und Stängelbasis, wo er eine einschnürende Trockenfäule verursacht.
  Befallene Pflanzen brechen, reifen vorzeitig ab und lagern, was zu erheblichen
  Ertragsverlusten führt. Die Primärinfektion geht von Ascosporen aus, die aus
  Ernterückständen freigesetzt werden.
priznaky: >-
  Auf den Herbstblättern entstehen runde weißliche bis gräuliche Flecken mit
  verstreuten schwarzen Pyknidien. Das schwerwiegendste Symptom ist die
  einschnürende Trockenfäule an Wurzelhals und Stängelbasis, im Schnitt mit
  dunklem, eingetrocknetem Gewebe. Befallene Pflanzen lassen sich leicht aus dem
  Boden ziehen, reifen im Frühjahr vorzeitig ab, verfärben sich und lagern.
hostitele:
  - Winter- und Sommerraps
  - Senf
  - Kohlgemüse
sireni: >-
  Hauptinfektionsquelle sind Ascosporen, die während der Herbstniederschläge aus
  Rapsernterückständen freigesetzt und vom Wind auf die auflaufenden Bestände
  getragen werden. Feuchte Witterung und milde Temperaturen im Herbst fördern
  die Infektion. Vom Blatt gelangt der Pilz durch allmähliches Durchwachsen des
  Blattstiels in den Stängel, was Wochen bis Monate dauert.
skodlivost: >-
  Die Verluste entstehen durch das Einschnüren und Brechen der Stängel vor der
  Ernte — auch in Beständen, die im Herbst gesund wirkten. Bei starkem Druck und
  anfälligen Sorten können sie Zehnerprozente des Ertrags erreichen. Die
  Schädlichkeit wird im Herbst nach dem Anteil befallener Pflanzen und der
  Befallstiefe am Wurzelhals beurteilt.
cyklus: >-
  Der Pilz überwintert an Rapsernterückständen, auf denen Fruchtkörper
  (Pseudothecien) mit Ascosporen heranreifen. Diese leiten die Herbstinfektion
  der Blätter ein, von wo der Pilz in den Stängel wächst und über Winter und
  Vegetation weiterschreitet. Eine kurze Anbaupause und an der Oberfläche
  belassene Rückstände erhöhen das Inokulum erheblich.
ucinne_latky:
  - latka: prothioconazole
  - latka: metconazole
  - latka: tebuconazole
  - latka: difenoconazole + paclobutrazol
ochrana: >-
  Entscheidend sind eine ausreichende Anbaupause für Raps (mindestens 3 bis 4
  Jahre) und das Einarbeiten der Ernterückstände als Hauptquelle der Ascosporen.
  Angebaut werden widerstandsfähigere Sorten, und je nach Sporenflug und
  Bestandesentwicklung werden im Herbst (gegebenenfalls auch im Frühjahr)
  Azolfungizide eingesetzt, die zugleich wachstumsregulierend wirken. ‼️ Die
  Zulassung von Pflanzenschutzmitteln ist national geregelt — prüfen Sie sie in
  Deutschland beim BVL, in Österreich beim BAES beziehungsweise der AGES.
aliases:
  - Phoma
  - Rapskrebs
  - Wurzelhalsfäule
faq:
  - q: Warum ist die Phoma beim Raps besonders gefährlich?
    a: >-
      Der Pilz wächst von den Blättern bis in Wurzelhals und Stängelbasis, die
      er einschnürt und schwächt. Die Pflanzen brechen und lagern dann noch vor
      der Ernte, sodass Verluste auch in Beständen entstehen, die im Herbst
      gesund wirkten.
  - q: Wie beugt man der Phoma am besten vor?
    a: >-
      Die wirksamste Vorbeugung sind eine ausreichend lange Anbaupause für Raps
      (3 bis 4 Jahre), das Einarbeiten der Ernterückstände und die Wahl
      widerstandsfähiger Sorten. Ergänzt werden sie durch eine Herbstbehandlung
      nach dem Warndienst zum Sporenflug.
  - q: Wann führt man die Herbstbehandlung durch?
    a: >-
      Die Behandlung zielt auf die Zeit ab dem Ascosporenflug, üblicherweise auf
      den entwickelten Herbstbestand etwa im Stadium 4 bis 8 Blätter, nach
      Warndienst und Witterungsverlauf. Azolpräparate festigen und verkürzen den
      Bestand zugleich vor dem Winter.
  - q: Hilft die Sortenwahl gegen die Phoma?
    a: >-
      Ja, zwischen den Rapssorten bestehen deutliche Unterschiede in der
      Widerstandsfähigkeit, und ein Teil von ihnen trägt spezifische
      Resistenzgene. Eine widerstandsfähige Sorte senkt sowohl das Risiko als
      auch den Bedarf an intensivem Fungizidschutz.
