slug: rzi-obilovin
name: Rzi obilovin
latinsky: Puccinia spp.
puvodce: Rzivé houby rodu Puccinia (rez pšeničná, rez plevová/žlutá, rez travní)
popis: >-
  Rzi jsou skupina houbových chorob obilnin způsobených rzivými houbami rodu
  Puccinia. Na listech, pochvách a stéblech se tvoří rezavě hnědé, žluté nebo
  tmavé prášivé kupky (uredospory), které se snadno otírají na ruku. Nejvážnější
  jsou rez plevová (žlutá), rez pšeničná (hnědá) a rez travní (černá). Silné
  napadení snižuje asimilační plochu, urychluje odumírání listů a může výrazně
  srazit výnos i kvalitu zrna, zejména za vlhkého a teplého počasí.
priznaky: >-
  Rez plevová (žlutá) tvoří citronově žluté kupky spor uspořádané do proužků podél
  žilnatiny, nejnápadnější brzy na jaře. Rez pšeničná (hnědá) má drobné rezavě
  hnědé, nepravidelně rozmístěné kupky na svrchní straně listů. Rez travní (černá)
  vytváří tmavě hnědé až černé podlouhlé kupky zejména na stéblech a pochvách. Ze
  všech kupek se spory otírají a zanechávají barevnou stopu na prstech.
hostitele:
  - Pšenice ozimá i jarní
  - Ječmen (i rez ječná)
  - Žito, oves, tritikale
  - Traviny (mezihostitelé a rezervoár)
sireni: >-
  Rzi se šíří uredospory přenášenými větrem i na velké vzdálenosti, což umožňuje
  rychlé plošné epidemie. Rez plevová (žlutá) upřednostňuje chladnější a vlhké
  jaro, rez pšeničná (hnědá) a travní teplejší počasí. Infekci podporuje dlouhé
  ovlhčení listů. Zdrojem jarní nákazy je výmrsk, ozimy a nálet spor z jiných
  oblastí.
skodlivost: >-
  Rzi patří k nejškodlivějším listovým chorobám obilnin; silné napadení může za
  příznivého počasí a náchylných odrůd snížit výnos o desítky procent. Nejrychleji
  škodí rez plevová (žlutá), která napadá porost už brzy na jaře a ničí asimilační
  plochu v období tvorby a plnění zrna.
cyklus: >-
  Rzi mají složitý vývojový cyklus, často s několika typy spor a u některých druhů
  se střídáním hostitelů (mezihostitelem rzi travní je dřišťál). Přezimují jako
  mycelium a uredospory na ozimech a výmrsku, na jaře zahajují infekci a během
  vegetace se polycyklicky množí uredosporami. Na konci sezony tvoří tmavé
  teliospory přežívající na zbytcích.
ucinne_latky:
  - latka: tebuconazole
    pripravky: např. Horizon
  - latka: prothioconazole
    pripravky: např. Proline
  - latka: azoxystrobin
    pripravky: např. Amistar
  - latka: pyraclostrobin + fluxapyroxad
    pripravky: např. Ceriax
ochrana: >-
  Klíčová je volba odolných odrůd a sledování porostů od počátku jara. Při výskytu
  se používají fungicidy (azoly, strobiluriny, SDHI), nejlépe preventivně nebo na
  začátku epidemie, se střídáním účinných látek kvůli rezistenci. Odstraňování
  výmrsku obilnin a zaorávka posklizňových zbytků omezuje zdroje nákazy. Registraci
  přípravků ověřte v Registru přípravků na ochranu rostlin ÚKZÚZ.
aliases:
  - rezi
  - rezi (pšeničná, žlutá)
  - rzi (korunková, stéblová)
  - rezi (žlutá, stéblová)
  - rzi
faq:
  - q: Jak rozeznat rez od jiných chorob obilí?
    a: >-
      Pro rzi jsou typické prášivé kupky spor, které se otírají na prsty a
      zanechávají rezavou nebo žlutou stopu. Tím se liší od padlí (bílý povlak)
      i od skvrnitostí typu braničnatky (ohraničené nekrózy bez prášivých spor).
  - q: Která rez je nejnebezpečnější?
    a: >-
      Velmi nebezpečná je rez plevová (žlutá), která se objevuje již brzy na jaře
      a tvoří charakteristické žluté pruhy spor podél žilnatiny. Za příznivých
      podmínek se šíří rychle a může způsobit velké ztráty na výnosu.
  - q: Kdy proti rzím zasáhnout fungicidem?
    a: >-
      Nejúčinnější je zásah preventivně nebo hned na počátku epidemie, kdy je
      napadení ještě nízké. U rzi plevové to bývá brzy na jaře, u rzi pšeničné
      později v době metání. Rozhodující je pravidelná kontrola porostu.
  - q: Pomáhá proti rzím odolná odrůda?
    a: >-
      Ano, mezi odrůdami obilnin jsou velké rozdíly v odolnosti vůči jednotlivým
      rzím. Volba odolné odrůdy je nejlevnějším a nejúčinnějším opatřením a výrazně
      snižuje potřebu fungicidních zásahů.
