# Ukrajinský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: cerkosporioza-repy
name: Церкоспоріоз буряків
puvodce: Гриб Cercospora beticola
popis: >-
  Церкоспоріоз — найпоширеніша та найважливіша листкова хвороба цукрових буряків. На листках
  утворюються дрібні округлі плями зі світлим центром і темно-коричневою або червоно-фіолетовою
  облямівкою; при сильному ураженні плями зливаються, і листки відмирають. Рослина заміщує відмерлі
  листки новими за рахунок накопичення цукру в коренеплоді, тому знижується врожайність і
  цукристість. Хвороба поширюється за теплої та вологої погоди у другій половині вегетації (у
  Чехії).
priznaky: >-
  Першими ознаками є дрібні округлі плями (2–3 мм) з попелясто-сірим центром і чітко окресленою
  темно-коричневою або червоно-фіолетовою облямівкою. У центрі плям за вологої погоди помітні дрібні
  чорні скупчення конідієносців. Плями поступово зливаються, листок жовтіє, буріє й відмирає;
  спочатку уражуються старі зовнішні листки. Сильно уражені посіви виглядають, наче обпалені.
hostitele:
  - Цукрові буряки
  - Кормові буряки
  - Шпинат і столові буряки (менш значущі)
sireni: >-
  Гриб поширюється конідіями, які переносяться вітром, дощем і сільськогосподарською технікою.
  Оптимальні умови для інфікування — тепла і волога погода (приблизно 25–30 °C вдень, нічне
  зволоження листків). Джерелом первинного зараження є уражені післязбиральні рештки буряків і
  ґрунт, тому ризик найвищий на полях із коротким інтервалом повернення буряків у сівозміні.
skodlivost: >-
  Церкоспоріоз належить до економічно найнебезпечніших хвороб цукрових буряків. Повторна втрата
  листкової поверхні та її відновлення споживають цукри; втрати врожаю коренеплодів і цукристості
  можуть при відсутності захисту сягати десятків відсотків (у Чехії). Обробки проводять за
  сигналізацією на початку появи перших плям.
cyklus: >-
  Гриб зимує у вигляді міцелію та псевдостром на післязбиральних рештках буряків у ґрунті, де може
  зберігатися кілька років. Навесні утворює конідії, які спричиняють первинне зараження; у тепле й
  вологе літо відбувається низка поліциклічних інфекцій. Коротка сівозміна з буряками сприяє
  накопиченню інокулюму в ґрунті.
ochrana: >-
  Основою є вирощування толерантних сортів, дотримання сівозміни з інтервалом повернення буряків не
  менше 3 років і загортання уражених решток. Фунгіцидний захист починають за сигналізацією на
  початку появи хвороби й повторюють залежно від тиску хвороби; обов’язково чергувати діючі речовини
  через поширену резистентність Cercospora beticola. Перевіряйте реєстрацію та норму внесення у
  Державному реєстрі пестицидів і агрохімікатів України.
faq:
  - q: Як церкоспоріоз знижує врожайність цукрових буряків?
    a: >-
      Уражені листки відмирають, і рослина змушена формувати нові, що споживає енергію та цукри, які
      інакше накопичувалися б у коренеплоді. В результаті знижується врожайність коренеплодів і
      цукристість.
  - q: Коли проводять захист проти церкоспоріозу?
    a: >-
      Обробку починають за сигналізацією одразу на початку появи перших плям, зазвичай у другій
      половині літа (у Чехії), і за потреби повторюють залежно від погодних умов і тиску хвороби,
      обов’язково чергуючи діючі речовини.
  - q: Як відрізнити церкоспоріоз від рамуляріозної плямистості?
    a: >-
      Церкоспоріоз формує дрібніші плями з виразною темно-коричневою або червоно-фіолетовою
      облямівкою, тоді як при рамуляріозній плямистості плями світліші, більші й з менш чіткою
      межею. Точне визначення дає лабораторний аналіз, однак заходи захисту значною мірою
      збігаються.
  - q: Чому при церкоспоріозі поширена резистентність?
    a: >-
      Cercospora beticola має високу здатність до розмноження, і в Чехії та Європі відзначено
      зниження ефективності багатьох азолів і стробілуринів. Тому рекомендується чергувати діючі
      речовини з різним механізмом дії та доповнювати їх багатосайтними препаратами.
