# Ukrajinský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: branicnatka-psenicna
name: Септоріоз пшениці (септоріозна плямистість листя)
puvodce: Гриб Zymoseptoria tritici (раніше Septoria tritici / Mycosphaerella graminicola)
popis: >-
  Септоріоз пшениці, також відомий як септоріозна плямистість листя, є однією з найважливіших
  листкових хвороб пшениці у Чехії. На листках утворюються видовжені жовтуваті до бурих плями,
  обмежені жилками, у яких помітні дрібні чорні плодові тіла (пікніди). Хвороба поширюється з нижніх
  листків на верхні і за вологої погоди може уражати навіть прапорцевий листок, що суттєво знижує
  врожайність.
priznaky: >-
  На листках спочатку з’являються дрібні водянисті плями, які витягуються вздовж жилок у неправильні
  жовто-бурі до сіруватих некрози з темною облямівкою. У плямах неозброєним оком видно чорні крапки
  — пікніди зі спорами. Ураження поширюється знизу вгору; за сильного розвитку відмирають верхні
  листки, включаючи прапорцевий, і посів передчасно всихає.
hostitele:
  - Озима та яра пшениця
  - Тритикале
  - Іноді інші злаки та зернові культури
sireni: >-
  Первинне зараження відбувається аскоспорами, що вивільняються з післяжнивних решток, у посіві
  хвороба далі поширюється конідіями, які розносяться краплями дощу на верхні яруси листя. Інфекції
  сприяє волога і помірна погода (приблизно 15–20 °C) та тривале зволоження листків. Густий,
  розвинений посів прискорює поширення.
skodlivost: >-
  Септоріоз належить до найбільш шкідливих листкових хвороб пшениці; ураження верхніх листків і
  прапорцевого листка безпосередньо знижує масу зерна. Втрати врожаю за сильного ураження і
  сприятливої погоди можуть сягати десятків відсотків у Чехії. Патоген схильний до розвитку
  резистентності до діючих речовин.
cyklus: >-
  Гриб зимує на післяжнивних рештках пшениці та в озимих посівах у вигляді міцелію. Аскоспори
  ініціюють весняне зараження нижніх листків, звідки хвороба поліциклічно поширюється конідіями на
  верхні яруси протягом усього весняного періоду. Особливо небезпечна тривала латентна фаза (до
  кількох тижнів), під час якої ураження не видно.
ochrana: >-
  Важливо вирощувати стійкіші сорти, уникати висіву пшениці по пшениці та ретельно загортати
  післяжнивні рештки (джерело інфекції). Фунгіцидний захист спрямовується на верхні листки та
  прапорцевий листок у фазі виходу в трубку — колосіння; застосовують азоли та речовини із групи
  SDHI, доцільно чергувати й комбінувати діючі речовини для запобігання резистентності. Реєстрацію
  та норми застосування перевіряйте у Державному реєстрі пестицидів і агрохімікатів України.
faq:
  - q: Чому захист прапорцевого листка при септоріозі є ключовим?
    a: >-
      Прапорцевий і підпрапорцевий листок становлять основну частину асиміляційної поверхні, яка
      забезпечує налив зерна. Їх ураження септоріозом безпосередньо знижує масу зерна та
      врожайність, тому фунгіцидні обробки планують так, щоб захистити саме ці листки.
  - q: Як поширюється септоріоз?
    a: >-
      Первинне зараження відбувається з післяжнивних решток (аскоспори), у посіві далі поширюється
      спорами (конідіями), які розносяться краплями дощу на верхні яруси листя. Волога і помірна
      погода значно сприяють поширенню.
  - q: Чому при септоріозі виникає проблема резистентності?
    a: >-
      Zymoseptoria tritici дуже схильна до розвитку резистентності, і у Чехії та Європі вже
      зафіксовано зниження ефективності багатьох азолів і SDHI. Тому рекомендується чергувати й
      комбінувати діючі речовини з різними механізмами дії та додавати багатосайтові препарати.
  - q: Як відрізнити септоріоз від інших листкових плямистостей?
    a: >-
      Характерні видовжені некрози, обмежені жилками, з видимими чорними пікнідами у плямах. На
      відміну від іржі, не утворює порошкоподібних купок спор, а на відміну від борошнистої роси —
      не має білого нальоту на поверхні листка.
