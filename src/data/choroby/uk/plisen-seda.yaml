# Ukrajinský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: plisen-seda
name: Сіра гниль
puvodce: Гриб Botrytis cinerea
popis: >-
  Сіра гниль — це повсюдно поширене грибкове захворювання з дуже широким колом господарів: від
  польових культур до овочів і фруктів. На відмираючих або пошкоджених тканинах утворюється сірий
  пиловидний наліт густого міцелію та спор. Гриб переважно поводиться як ослаблюючий (вторинний)
  патоген — проникає через поранення, відмерлі пелюстки або ослаблені тканини та викликає гнилі за
  вологої й прохолодної погоди. У цукрових буряків і ріпаку уражає листя та інші тканини, особливо в
  загущених, вологих посівах (у Чехії).
priznaky: >-
  Типовою ознакою є сірий або сіро-коричневий пиловидний наліт, який при дотику легко осипається з
  уражених тканин (маса конідій). Спочатку з’являються водянисті, що буріють, плями на пошкоджених
  або відмираючих частинах (пелюстки, поранення, основа стебел), звідки гниль поширюється на здорові
  тканини. В уражених тканинах згодом формуються дрібні чорні склероції.
hostitele:
  - Ріпак і соняшник
  - Цукрові буряки
  - Бобові та овочі
  - Виноград і фрукти (ягідні культури)
sireni: >-
  Гриб поширюється конідіями, які переносяться вітром і водою. Проростанню спор і інфікуванню сприяє
  тривале зволоження тканин, висока вологість повітря та прохолодна погода (оптимум приблизно 15–20
  °C). Вхідними воротами є поранення та відмерлі тканини, тому ризик найвищий у загущених, полеглих
  або пошкоджених морозом посівах (у Чехії).
skodlivost: >-
  Для польових культур сіра гниль зазвичай є супутнім захворюванням ослаблених посівів, її значення
  зростає для овочів, винограду та фруктів, де вона викликає гнилі плодів до і після збирання
  врожаю. Шкідливість зростає у вологі роки та в густих посівах; для зберіганих фруктів і овочів
  належить до основних причин втрат (у Чехії).
cyklus: >-
  Гриб зимує у вигляді склероціїв і міцелію на рослинних рештках. За вологої погоди з них виростають
  конідієносці, що продукують велику кількість конідій, які забезпечують повторне поширення протягом
  усієї вегетації. Botrytis легко уражає відмираючі тканини та звідти поширюється на здорові; має
  схильність до формування резистентності до фунгіцидів.
ochrana: >-
  Основою є зменшення вологості в посівах (провітрювані посіви, збалансоване живлення) та
  профілактика поранень рослин. Цілеспрямоване фунгіцидне оброблення проводять у ризикований період
  і на ослаблених посівах; з огляду на схильність Botrytis до резистентності необхідно чергувати
  діючі речовини з різним механізмом дії. Допомагає також загортання уражених решток, а для овочів і
  фруктів — швидке охолодження врожаю після збирання. Перевіряйте реєстрацію препаратів у Державному
  реєстрі пестицидів і агрохімікатів України.
faq:
  - q: Чому сіра гниль з’являється переважно на ослаблених рослинах?
    a: >-
      Botrytis cinerea є переважно ослаблюючим патогеном — найпростіше проникає через поранення,
      відмерлі пелюстки або тканини, ослаблені стресом, морозом чи іншими хворобами. Здорові та
      добре забезпечені посіви уражає значно рідше.
  - q: Яка погода сприяє розвитку сірої гнилі?
    a: >-
      Сіра гниль найактивніше поширюється за вологої, прохолодної погоди та високої вологості
      повітря в загущених посівах. Тривале зволоження листя та погане провітрювання значно
      підвищують ризик.
  - q: Чому у сірої гнилі виникають проблеми з резистентністю?
    a: >-
      Botrytis cinerea має короткий репродуктивний цикл і велику кількість спор, тому швидко формує
      штами, стійкі до фунгіцидів. Тому важливо чергувати діючі речовини з різним механізмом дії та
      не покладатися багаторазово на одну групу.
  - q: Як обмежити сіру гниль при зберіганні фруктів і овочів?
    a: >-
      Допомагає збирання здорових, неушкоджених плодів у суху погоду, швидке охолодження та
      підтримання низької температури й помірної вологості у сховищі. Пошкоджені та загнилі плоди
      потрібно видаляти, оскільки вони є джерелом подальшого поширення.
