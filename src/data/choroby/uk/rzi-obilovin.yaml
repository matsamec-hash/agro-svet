# Ukrajinský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: rzi-obilovin
name: Іржі зернових культур
puvodce: Іржасті гриби роду Puccinia (іржа пшенична, іржа плівкова/жовта, іржа стеблова)
popis: >-
  Іржі — це група грибкових хвороб зернових культур, які спричиняються іржастими грибами роду
  Puccinia. На листках, піхвах і стеблах утворюються іржаво-коричневі, жовті або темні
  порошкоподібні подушечки (уредоспори), які легко стираються з поверхні рослини. Найнебезпечнішими
  є іржа плівкова (жовта), іржа пшенична (коричнева) та іржа стеблова (чорна). Сильне ураження
  зменшує асиміляційну поверхню, прискорює відмирання листя і може суттєво знизити врожайність і
  якість зерна, особливо за вологих і теплих погодних умов.
priznaky: >-
  Іржа плівкова (жовта) формує лимонно-жовті подушечки спор, розташовані смужками вздовж жилок,
  найбільш помітна рано навесні. Іржа пшенична (коричнева) утворює дрібні іржаво-коричневі,
  нерегулярно розміщені подушечки на верхньому боці листків. Іржа стеблова (чорна) створює
  темно-коричневі до чорних видовжені подушечки, переважно на стеблах і піхвах. Усі ці подушечки
  легко стираються, залишаючи кольоровий слід на пальцях.
hostitele:
  - Озима та яра пшениця
  - Ячмінь (також іржа ячмінна)
  - Жито, овес, тритикале
  - Злакові трави (проміжні господарі та резервуар інфекції)
sireni: >-
  Іржі поширюються уредоспорами, які переносяться вітром навіть на великі відстані, що сприяє
  швидким масовим епідеміям. Іржа плівкова (жовта) віддає перевагу прохолодній і вологій весні, іржа
  пшенична (коричнева) та стеблова — теплішій погоді. Інфекції сприяє тривале зволоження листя.
  Джерелом весняного зараження є падалиця, озимі посіви та занос спор з інших регіонів.
skodlivost: >-
  Іржі належать до найшкідливіших листкових хвороб зернових культур; сильне ураження за сприятливих
  погодних умов і чутливих сортів може знизити врожайність на десятки відсотків. Найшвидше шкодить
  іржа плівкова (жовта), яка уражує посіви вже на початку весни та знищує асиміляційну поверхню в
  період формування і наливу зерна.
cyklus: >-
  Іржі мають складний цикл розвитку, часто з кількома типами спор і у деяких видів зі зміною
  господарів (проміжним господарем іржі стеблової є барбарис). Перезимовують у вигляді міцелію та
  уредоспор на озимих посівах і падалиці, навесні розпочинають інфекцію і протягом вегетації
  поліциклічно розмножуються уредоспорами. Наприкінці сезону утворюють темні теліоспори, що
  зберігаються на рослинних рештках.
ochrana: >-
  Ключовим є вибір стійких сортів і моніторинг посівів із початку весни. За появи хвороби
  застосовують фунгіциди (азоли, стробілурини, SDHI), найкраще профілактично або на початку
  епідемії, з чергуванням діючих речовин для запобігання резистентності. Видалення падалиці зернових
  і заорювання післяжнивних решток зменшує джерела інфекції. Перевіряйте реєстрацію препаратів у
  Державному реєстрі пестицидів і агрохімікатів України.
faq:
  - q: Як відрізнити іржу від інших хвороб зернових?
    a: >-
      Для іржі характерні порошкоподібні подушечки спор, які легко стираються з поверхні рослини і
      залишають іржавий або жовтий слід на пальцях. Це відрізняє іржу від борошнистої роси (білий
      наліт) і плямистостей типу септоріозу (обмежені некрози без порошкоподібних спор).
  - q: Яка іржа є найнебезпечнішою?
    a: >-
      Дуже небезпечною є іржа плівкова (жовта), яка з’являється вже на початку весни й утворює
      характерні жовті смуги спор вздовж жилок. За сприятливих умов швидко поширюється і може
      спричинити значні втрати врожаю у Чехії.
  - q: Коли застосовувати фунгіциди проти іржі?
    a: >-
      Найефективніше обробляти посіви профілактично або відразу на початку епідемії, коли ураження
      ще незначне. Для іржі плівкової це зазвичай рано навесні, для іржі пшеничної — пізніше, під
      час виходу в трубку. Вирішальне значення має регулярний огляд посівів.
  - q: Чи допомагає стійкий сорт проти іржі?
    a: >-
      Так, між сортами зернових існують значні відмінності у стійкості до різних видів іржі. Вибір
      стійкого сорту — найдешевший і найефективніший захід, що суттєво знижує потребу у фунгіцидних
      обробках.
