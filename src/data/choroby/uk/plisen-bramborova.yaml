# Ukrajinský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: plisen-bramborova
name: Фітофтороз картоплі
puvodce: Ооміцет Phytophthora infestans
popis: >-
  Фітофтороз картоплі є найнебезпечнішою хворобою картоплі, також уражує томати. На листках
  утворюються буро-чорні в'янучі плями, на звороті листків за вологої погоди з'являється білуватий
  наліт спор; хвороба швидко переходить на бадилля, а згодом і на бульби, де спричиняє буру гниль.
  За теплої та вологої погоди може за кілька днів знищити весь посів. Це той самий патоген, який у
  XIX столітті спричинив ірландський голод.
priznaky: >-
  На листках з'являються темно-зелені до буро-чорних водянисті плями, спочатку часто на краях і
  верхівках листків. На звороті листка на межі здорової та ураженої тканини за вологої погоди
  помітний білуватий наліт спорангієносців. Уражене бадилля швидко чорніє, гниє і має неприємний
  запах. На бульбах з'являються сіруваті втиснуті плями, а під шкіркою — іржаво-бура суха або волога
  гниль, що проникає у м'якоть.
hostitele:
  - Картопля
  - Томати
sireni: >-
  Хвороба поширюється спорангіями, які переносяться вітром і дощем навіть на великі відстані.
  Вирішальне значення мають вологість і тепло — тривале зволоження бадилля та температури приблизно
  15–22 °C (так звані блайтові періоди). За таких умов новий інфекційний цикл відбувається протягом
  кількох днів. Джерелом інфекції є уражені бульби (насіннєвий матеріал, відходи) та ооспори, що
  перезимували у ґрунті.
skodlivost: >-
  Фітофтороз картоплі — найнебезпечніша хвороба картоплі; нехтування захистом може за сприятливої
  погоди знищити весь посів протягом одного-двох тижнів. Уражені бульби гниють навіть у сховищі та
  стають вхідними воротами для вторинних бактеріальних гнилей. Втрати обраховуються як зниженням
  урожайності бадилля, так і зменшенням лежкості врожаю.
cyklus: >-
  Патоген зимує у вигляді міцелію в уражених бульбах (насіннєвий матеріал, відходи) та у вигляді
  ооспор у ґрунті. З інфікованих бульб виростає уражене бадилля, на якому утворюються спорангії, що
  запускають епідемію. За вологої погоди спорангії виділяють рухливі зооспори, які інфікують як
  бадилля, так і бульби; цикл за сприятливих умов швидко повторюється.
ochrana: >-
  Вирішальне значення має превентивний фунгіцидний захист, розпочатий за сигналізацією ще до появи
  симптомів і повторюваний з інтервалом 7–14 днів залежно від тиску хвороби та погодних умов
  (системні препарати для росту, контактні для покриття, специфічні для захисту бульб). Важливо
  використовувати здоровий сертифікований насіннєвий матеріал, достатнє підгортання для захисту
  бульб від змиву спор, а також десикацію або механічне видалення бадилля перед збиранням врожаю.
  Перевіряйте реєстрацію препаратів у Державному реєстрі пестицидів і агрохімікатів України.
faq:
  - q: Чому фітофтороз картоплі є таким небезпечним?
    a: >-
      Phytophthora infestans за теплої та вологої погоди поширюється надзвичайно швидко й може
      знищити весь посів за кілька днів. Уражає також бульби, які потім гниють під час зберігання.
      Це той самий патоген, який спричинив ірландський голод.
  - q: Як захищатися від фітофторозу картоплі?
    a: >-
      Ключовим є превентивний фунгіцидний захист, розпочатий за сигналізацією ще до появи симптомів
      і регулярно повторюваний. Доповнюється використанням здорового насіннєвого матеріалу, якісним
      підгортанням для захисту бульб і своєчасним видаленням бадилля перед збиранням врожаю.
  - q: Що таке блайтова періодика?
    a: >-
      Це період погодних умов, сприятливих для інфікування фітофторозом картоплі — тривале
      зволоження бадилля та температури близько 15–22 °C. Прогностичні моделі повідомляють про ці
      періоди й допомагають визначити час для превентивних обробок ще до появи симптомів.
  - q: Чому потрібно видаляти бадилля перед збиранням врожаю?
    a: >-
      Знищення бадилля (десикація або механічно) перериває джерело спор і дає змогу шкірці бульб
      зміцніти, завдяки чому бульби менше інфікуються під час збирання. Збирання врожаю у в'ялу, але
      не знищену гичку підвищує ризик гнилі бульб у сховищі.
