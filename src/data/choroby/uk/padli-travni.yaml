# Ukrajinský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: padli-travni
name: Борошниста роса злаків
puvodce: Гриб Blumeria graminis (раніше Erysiphe graminis)
popis: >-
  Борошниста роса злаків — найпоширеніше грибне захворювання зернових культур. На листках, листкових
  піхвах, а згодом і на колосках утворюється характерний білий або сіруватий борошнистий наліт
  міцелію, який поступово буріє, і в ньому дозрівають темні плодові тіла (клейстотеції). Уражена
  тканина жовтіє та передчасно відмирає, що зменшує асиміляційну поверхню, масу зерна і врожай.
  Хвороба поширюється переважно за теплої та вологої погоди у густих, надмірно удобрених посівах.
priznaky: >-
  Типовою ознакою є білий або сіруватий борошнистий (ватоподібний) наліт на верхньому та нижньому
  боці листків, листкових піхвах і стеблах, який спочатку можна стерти пальцем. Згодом наліт сіріє і
  буріє, у ньому з’являються дрібні чорні тільця (клейстотеції). Під нальотом тканина жовтіє і
  висихає; ураження поширюється з нижніх листків догори, за сильного розвитку — і на колоски.
hostitele:
  - Озима та яра пшениця
  - Ячмінь
  - Жито, овес, тритикале
sireni: >-
  Борошниста роса поширюється конідіями, які переносяться вітром. Для інфікування не потрібна
  краплинна волога (на відміну від більшості листкових хвороб), достатньо високої вологості повітря
  та температури близько 15–22 °C. Поширенню значно сприяють густі, розвинені та надмірно удобрені
  азотом посіви з обмеженим рухом повітря. Джерелом весняного зараження є падалиця та озимі.
skodlivost: >-
  Сильне ураження зменшує асиміляційну поверхню, прискорює старіння листків і знижує масу зерна;
  втрати врожаю за сприятливих умов і чутливих сортів зазвичай становлять від кількох до кількох
  десятків відсотків у Чехії. Поріг шкідливості визначають за часткою ураженої листкової поверхні на
  нижніх ярусах.
cyklus: >-
  Гриб зимує у вигляді міцелію на озимих та падалиці, а також у вигляді клейстотеції на рослинних
  рештках. Навесні утворює конідії, які запускають поліциклічне поширення, що за сприятливої погоди
  відбувається короткими циклами протягом усієї вегетації. Патоген має спеціалізовані форми (formae
  speciales), пов’язані з окремими видами злаків.
ochrana: >-
  Основою захисту є вибір стійких сортів, збалансоване азотне удобрення (надлишок азоту підвищує
  ризик) та оптимальна густота посіву. При перевищенні порогу шкідливості застосовують фунгіциди з
  груп азолів, морфолінів або специфічні засоби проти борошнистої роси, часто у комбінації для
  обробки листків і захисту колоса. Важливо чергувати діючі речовини для запобігання резистентності;
  реєстрацію перевіряйте у Державному реєстрі пестицидів і агрохімікатів України.
faq:
  - q: Які культури найчастіше уражує борошниста роса злаків?
    a: >-
      Борошниста роса злаків уражує більшість зернових культур — пшеницю, ячмінь, овес, жито та
      тритикале. Патоген має спеціалізовані форми (formae speciales), пов’язані з конкретним видом,
      але як хвороба зустрічається на всьому спектрі злаків.
  - q: Як розпізнати борошнисту росу на зернових?
    a: >-
      Типовою ознакою є білий борошнистий наліт на листках і стеблах, який спочатку можна стерти
      пальцем. Згодом він темніє, і в ньому з’являються дрібні чорні плодові тіла. Уражені листки
      жовтіють і передчасно висихають.
  - q: Чому борошниста роса краще розвивається у густих і надмірно удобрених посівах?
    a: >-
      У густих і надмірно удобрених азотом посівах підвищується вологість повітря, погіршується
      провітрювання та формуються м’якші, більш сприйнятливі тканини. Це створює ідеальні умови для
      поширення борошнистої роси, тому збалансоване живлення і густота посіву є частиною захисту.
  - q: Чи потрібен дощ для інфікування борошнистою росою?
    a: >-
      Ні. На відміну від більшості листкових хвороб, для проростання спор борошнистої роси не
      потрібна краплинна вода, достатньо високої вологості повітря. Тому вона може поширюватися
      навіть у періоди без значних опадів, якщо посіви густі та вологі.
