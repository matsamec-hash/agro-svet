# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: alternariova-skvrnitost
name: Альтернаріозна плямистість
puvodce: Гриби роду Alternaria (наприклад, A. brassicae, A. brassicicola)
popis: >-
  Альтернаріозна плямистість (чорнь) — це грибкова хвороба, що уражає переважно хрестоцвіті олійні
  культури та соняшник. На листках, стеблах і стручках утворюються темні, часто концентрично
  зоновані плями з сіро-чорним нальотом споруляції. У ріпаку уражуються переважно стручки, які
  передчасно розтріскуються та обсипаються, що спричиняє втрати врожаю під час збирання та погіршує
  якість насіння. Хвороба поширюється за вологої, теплої погоди наприкінці вегетації.
priznaky: >-
  На листках з’являються темно-коричневі до чорних округлі плями з вираженою концентричною
  зональністю (мішенеподібний малюнок), часто з жовтою облямівкою. За вологої погоди їх вкриває
  сіро-чорний оксамитовий наліт конідій. На стеблах і стручках утворюються видовжені чорні плями;
  уражені стручки передчасно достигають, деформуються та розтріскуються. Сильно уражені листки
  жовтіють і передчасно опадають.
hostitele:
  - Озимий і ярий ріпак
  - Гірчиця
  - Хрестоцвіта овочева група (капуста, савойська капуста, броколі)
  - Соняшник
sireni: >-
  Гриб поширюється конідіями, які переносяться вітром і дощем. Інфекції сприяє тепла та волога
  погода (оптимум приблизно 18–25 °C) і тривале зволоження рослин у другій половині вегетації,
  особливо під час достигання стручків. Важливим джерелом первинного зараження є уражене насіння та
  післяжнивні рештки хрестоцвітих.
skodlivost: >-
  Основні втрати виникають через ураження стручків, їх передчасне розтріскування та обсипання
  насіння перед збиранням врожаю та під час нього. Втрати врожаю ріпаку у Чехії зазвичай становлять
  кілька відсотків залежно від інтенсивності ураження та погодних умов, за сильного розвитку хвороби
  — ще більше. Уражене насіння має меншу масу тисячі насінин і гіршу олійність.
cyklus: >-
  Гриб зимує на післяжнивних рештках і в ураженому насінні у вигляді міцелію та конідій. Навесні та
  влітку утворює нові конідії, які забезпечують повторне (поліциклічне) поширення у посівах.
  Найчутливішим періодом для ріпаку є фаза від цвітіння до достигання стручків.
ochrana: >-
  Ефективними заходами є дотримання сівозміни з інтервалом між хрестоцвітими не менше 3–4 років,
  заробка післяжнивних решток і протруєння насіння. Фунгіцидна обробка у період достигання стручків
  (часто разом з обробкою проти склеротиніозу) обмежує ураження стручків і обсипання; реєстрацію та
  норми застосування препаратів слід перевіряти у Державному реєстрі пестицидів і агрохімікатів
  України. Своєчасне та неперетягнуте збирання врожаю додатково зменшує втрати.
faq:
  - q: Які частини ріпаку найбільше уражує альтернаріоз?
    a: >-
      З точки зору врожайності найчутливішими є стручки. Уражені стручки передчасно достигають,
      розтріскуються та обсипаються, тому втрати виникають безпосередньо перед збиранням врожаю та
      під час нього. Плями на листках і стеблах менш значущі.
  - q: Чи відрізняється альтернаріозна плямистість від чорні ріпакових тканин?
    a: >-
      Це споріднені хвороби одного роду — чорнь ріпакових тканин переважно спричиняє Alternaria
      brassicae. На практиці прояви та заходи захисту подібні, обидві належать до альтернаріозних
      плямистостей хрестоцвітих.
  - q: Коли проводять захист ріпаку від альтернаріозної плямистості?
    a: >-
      Обробки спрямовані на період достигання стручків, коли ризик ураження та обсипання найвищий.
      На практиці їх часто поєднують із фунгіцидною обробкою проти склеротиніозу у фазі цвітіння —
      кінця цвітіння.
  - q: Чи передається альтернаріоз через насіння?
    a: >-
      Так, уражене насіння є важливим джерелом інфекції та переносить гриб на нові посіви. Тому
      протруєння насіння та використання здорового, сертифікованого насіння є основними
      профілактичними заходами.
