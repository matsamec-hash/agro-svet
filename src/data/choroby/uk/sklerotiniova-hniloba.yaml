# Ukrajinský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: sklerotiniova-hniloba
name: Склеротиніозна гниль
puvodce: Гриб Sclerotinia sclerotiorum (у конюшини S. trifoliorum)
popis: >-
  Склеротиніозна гниль (біла гниль) — це серйозне грибкове захворювання олійних і бобових культур з
  дуже широким колом господарів. На стеблах і кореневій шийці утворюються водянисті, що буріють,
  ураження з білим ватоподібним міцелієм, всередині та на поверхні тканин формуються тверді чорні
  склероції. Уражені рослини передчасно в'януть, полягають і засихають; для ріпаку та соняшнику ця
  хвороба є однією з найнебезпечніших. Склероції зберігаються у ґрунті багато років і є джерелом
  інфекції.
priznaky: >-
  На стеблі, найчастіше на рівні пазухи листків, спочатку виникає водяниста, згодом вибілена, що
  лущиться, пляма; уражена тканина розволокнюється, і стебло ламається. Усередині стебла і на його
  поверхні — білий ватоподібний міцелій і тверді чорні склероції розміром від зерна до квасолини.
  Частина рослини над ураженням передчасно жовтіє, в'яне і дозріває; за вологої погоди гниль м'яка,
  за сухої — суха і вибілена.
hostitele:
  - Ріпак і соняшник
  - Соя та інші бобові культури
  - Конюшина (Sclerotinia trifoliorum)
  - Овочі (морква, салат, квасоля)
sireni: >-
  Джерелом інфекції є склероції у ґрунті, з яких після зволоження виростають дрібні плодові тіла
  (апотеції), що вивільняють аскоспори. Вони найчастіше інфікують рослину через опалі пелюстки, які
  затрималися у пазухах листків. Інфекції сприяє волога погода під час цвітіння та густий,
  розвинений, зімкнутий посів із високою вологістю біля ґрунту.
skodlivost: >-
  Для ріпаку та соняшнику склеротиніозна гниль належить до найнебезпечніших хвороб; уражені рослини
  передчасно дозрівають, ламаються і осипаються, тому втрати врожаю за сильного ураження можуть
  сягати десятків відсотків (у Чехії). Склероції також постійно заражають ґрунт і знижують цінність
  поля для наступних чутливих культур.
cyklus: >-
  Гриб зимує у вигляді склероціїв у ґрунті, де може зберігатися багато років. Після достатнього
  зволоження з них виростають апотеції з аскоспорами; вони ініціюють інфекцію під час цвітіння
  рослини-господаря. Після відмирання рослини у тканинах формуються нові склероції, які повертаються
  у ґрунт. Коротка сівозміна з чутливими культурами призводить до накопичення інокулюму.
ochrana: >-
  Вирішальне значення має достатньо тривалий інтервал між вирощуванням чутливих культур у сівозміні
  (ріпак, соняшник, соя, конюшина) та обмеження надмірно густих, розвинених посівів. Фунгіцидна
  обробка ріпаку проводиться у період цвітіння, коли інфекція відбувається через опалі пелюстки.
  Допомагає також біологічний захист (Coniothyrium minitans), який розкладає склероції у ґрунті.
  Перевіряйте реєстрацію препаратів у Державному реєстрі пестицидів і агрохімікатів України.
faq:
  - q: Чому склеротиніозну гниль так важко контролювати?
    a: >-
      Патоген має дуже широкий спектр господарів і утворює стійкі склероції, які зберігаються у
      ґрунті багато років. Коротка сівозміна з ріпаком, соняшником і бобовими культурами призводить
      до накопичення інокулюму в ґрунті, і разових заходів недостатньо.
  - q: Коли у ріпаку проводять захист проти склеротиніозу?
    a: >-
      Ключовим є період цвітіння ріпаку, коли гриб інфікує рослину через опалі пелюстки, що
      затрималися у пазухах листків. Фунгіцид застосовують на початку і до повного цвітіння залежно
      від погодних умов і тиску хвороби (у Чехії).
  - q: Як працює біологічний захист проти склеротиніозу?
    a: >-
      Препарат із грибом Coniothyrium minitans вносять у ґрунт, де він паразитує і розкладає
      склероції склеротиніозної гнилі. Це знижує запас інокулюму у ґрунті, але дія поступова і
      підходить переважно для довгострокової профілактики.
  - q: Які культури найбільше уражуються склеротиніозною гниллю?
    a: >-
      Найчутливіші — ріпак і соняшник, далі соя та інші бобові, конюшина і багато видів овочів.
      Оскільки чутливих культур багато, при плануванні сівозміни потрібно враховувати їхній взаємний
      ризик.
