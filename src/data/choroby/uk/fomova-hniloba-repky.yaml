# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: fomova-hniloba-repky
name: Фомова гниль стебла
puvodce: Гриб Leptosphaeria maculans (анаморфа Phoma lingam)
popis: >-
  Фомова гниль (фомове почорніння стебла) — це значуща хвороба ріпаку та інших капустяних культур.
  Восени на листках з’являються світлі плями з дрібними чорними плодовими тілами; гриб далі
  проростає через черешок до кореневої шийки та основи стебла, де викликає перетяжку і суху гниль.
  Уражені рослини ламаються, передчасно достигають і полягають, що призводить до значних втрат
  урожаю. Первинне зараження відбувається через аскоспори, які виділяються з післяжнивних решток.
priznaky: >-
  На осінніх листках утворюються округлі білуваті або сіруваті плями з розкиданими чорними
  пікнідами. Найсерйозніша ознака — суха перетяжна гниль кореневої шийки та основи стебла, на зрізі
  видно темну, висохлу тканину. Уражені рослини легко вириваються із ґрунту, навесні передчасно
  достигають, змінюють забарвлення і полягають.
hostitele:
  - Озимий і ярий ріпак
  - Гірчиця
  - Капустяна овочева група
sireni: >-
  Основним джерелом інфекції є аскоспори, що вивільняються з післяжнивних решток ріпаку під час
  осінніх дощів; вони переносяться вітром на сходи посіву. Інфекції сприяє волога погода і помірні
  температури восени. Хвороба поширюється з листків у стебло поступовим проростанням через черешок,
  що триває від кількох тижнів до місяців.
skodlivost: >-
  Втрати виникають через перетяжку і ламкість стебел перед збиранням врожаю навіть у посівах, які
  восени виглядали здоровими. За сильного інфекційного тиску та чутливих сортів втрати можуть сягати
  десятків відсотків урожаю. Шкідливість оцінюють восени за часткою уражених рослин і глибиною
  ураження шийки.
cyklus: >-
  Гриб зимує на післяжнивних рештках ріпаку, де дозрівають плодові тіла (псевдотеції) з аскоспорами.
  Вони ініціюють осіннє зараження листків, звідки гриб проростає у стебло і продовжує розвиток
  протягом зими та вегетації. Короткий інтервал між посівами ріпаку і залишення решток на поверхні
  значно підвищують інфекційне навантаження.
ochrana: >-
  Ключовим є достатній інтервал ріпаку у сівозміні (не менше 3–4 років) і заробка післяжнивних
  решток, які є основним джерелом аскоспор. Вирощують більш стійкі сорти, а за наявності спор і
  розвитку посіву восени (іноді й навесні) застосовують азольні фунгіциди, які також мають
  морфорегуляторну дію. Реєстрацію та дозування перевіряйте у Державному реєстрі пестицидів і
  агрохімікатів України.
faq:
  - q: Чому фомова гниль особливо небезпечна для ріпаку?
    a: >-
      Гриб проростає від листків до кореневої шийки та основи стебла, де викликає перетяжку і
      ослаблення. Рослини потім ламаються і полягають ще до збирання врожаю, тому втрати виникають
      навіть у посівах, які восени виглядали здоровими.
  - q: Як найкраще запобігти фомовій гнилі?
    a: >-
      Найефективніша профілактика — достатньо тривалий інтервал вирощування ріпаку на полі (3–4
      роки), заробка післяжнивних решток і вибір стійких сортів. Додатково застосовують осіннє
      фунгіцидне оброблення за сигналізацією появи спор.
  - q: Коли проводити осіннє оброблення проти фомової гнилі?
    a: >-
      Оброблення проводять у період після появи аскоспор, зазвичай на розвинений осінній посів
      приблизно у фазі 4–8 листків, залежно від сигналізації та погодних умов. Азольні препарати
      одночасно зміцнюють і вкорочують посів перед зимою.
  - q: Чи допомагає вибір сорту проти фомової гнилі?
    a: >-
      Так, між сортами ріпаку існують значні відмінності у стійкості до фомової гнилі, частина з них
      має специфічні гени резистентності. Стійкий сорт знижує ризик і потребу в інтенсивному
      фунгіцидному захисті.
