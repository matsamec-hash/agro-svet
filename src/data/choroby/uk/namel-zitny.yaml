# Ukrajinský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: namel-zitny
name: Ріжки житні
puvodce: Гриб Claviceps purpurea
popis: >-
  Ріжки — це грибкова хвороба зернових культур і трав, найбільш помітна на житі, яке є
  перехреснозапильним і має довше відкриті квітки. Замість зерна у колосі утворюється
  темно-фіолетове або чорне рогоподібне склероцій (ріжки), яке переростає зернівку. Склероції
  містять отруйні ріжкові алкалоїди, що становлять небезпеку для людей і сільськогосподарських
  тварин, тому вміст ріжків у продовольчому та кормовому зерні законодавчо контролюється та
  обмежується.
priznaky: >-
  Першою ознакою у період цвітіння є солодка липка рідина (медвяна роса), що виділяється з уражених
  квіток і приваблює комах. Згодом замість зерна у колосі формується тверде рогоподібне склероцій —
  темно-фіолетове або чорне, зазвичай значно довше за здорову зернівку і виступає з колоскових
  лусок. В одному колосі може бути одне або кілька склероціїв.
hostitele:
  - Жито (найчутливіше)
  - Пшениця, ячмінь, овес, тритикале
  - Трави на насіння та бур'янисті трави
sireni: >-
  Первинне зараження відбувається аскоспорами, які вивільняються зі склероціїв, що перезимували у
  ґрунті або потрапили до насіння. Аскоспори інфікують відкриті квітки під час цвітіння; медвяна
  роса з конідіями потім переноситься комахами та дощем на інші квітки. Сприйнятливість підвищується
  всім, що подовжує та розріджує цвітіння (прохолодна погода, зріджений посів, перехресне
  запилення).
skodlivost: >-
  Пряма втрата врожаю зазвичай невелика, вирішальне значення має санітарний і законодавчий ризик:
  склероції містять токсичні ріжкові алкалоїди, а їхній вміст у продовольчому та кормовому зерні
  обмежується законом. Перевищення ліміту знецінює партію. Історично ріжки спричиняли масові
  отруєння (ерготизм).
cyklus: >-
  Гриб зимує у вигляді склероціїв у ґрунті та у насінні. Навесні з них виростають дрібні плодові
  тіла (стромати) з аскоспорами, які ініціюють зараження квітучих зернових і трав. Після зараження
  виникає медвяна (конідіальна) фаза, що поширюється комахами, і зрештою утворюються нові склероції.
  Склероції, що залишаються на поверхні ґрунту після глибокої оранки, втрачають схожість.
ochrana: >-
  Хімічний захист проти ріжків неефективний, вирішальне значення має агротехніка. Допомагає
  використання очищеного, вільного від ріжків насіння, глибока оранка (склероції на поверхні
  втрачають схожість), знищення квітучих трав і падалиці навколо полів як джерел інфекції та
  вирівняне, суцільне цвітіння посіву, що скорочує період сприйнятливості. Склероції видаляють
  очищенням і сортуванням зібраного зерна.
faq:
  - q: Чому ріжки небезпечні?
    a: >-
      Склероції ріжків містять ріжкові алкалоїди, які токсичні для людей і тварин (історично
      спричиняли отруєння, відомі як ерготизм). Тому їхній вміст у продовольчому та кормовому зерні
      контролюється і обмежується законом.
  - q: Чому найбільше ріжками уражується жито?
    a: >-
      Жито є перехреснозапильним, а його квітки залишаються відкритими довше, тому легше уражуються
      спорами ріжків під час цвітіння. Самозапильні зернові з швидким закриттям квіток уражуються
      менше.
  - q: Чи можна боротися з ріжками фунгіцидами?
    a: >-
      Ефективного хімічного захисту проти ріжків не існує. Вирішальними є профілактичні агротехнічні
      заходи — здорове очищене насіння, глибока оранка для загортання склероціїв, знищення квітучих
      трав і очищення врожаю.
  - q: Як видаляють склероції із зерна?
    a: >-
      Склероції зазвичай довші й легші за здорове зерно, тому їх можна видалити з партії ретельним
      очищенням і сортуванням (сита, гравітаційні та оптичні сепаратори). Для сильно ураженого
      врожаю очищення є обов'язковим для дотримання лімітів.
