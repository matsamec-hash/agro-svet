# Ukrajinský overlay chorob. slug, latinsky, aliases a ucinne_latky zůstávají z cs
# (aliasy jsou mapovací klíče, účinné látky jsou mezinárodní názvy).
slug: fuzariozy
name: Фузаріози
puvodce: Гриби роду Fusarium (наприклад, F. graminearum, F. culmorum)
popis: >-
  Фузаріози — це група хвороб, спричинених грибами роду Fusarium, які уражають корені, стебло, колос
  і качан багатьох культур. У зернових найнебезпечнішою є фузаріозна гниль колоса, що проявляється
  передчасним вибіленням колосків і рожевим нальотом на зерні; у кукурудзи, зернобобових і олійних
  культур переважають гнилі коренів і стебла. Окрім втрат урожаю, ризиком є утворення мікотоксинів
  (особливо дезоксиніваленолу, DON), які погіршують безпечність зерна та кормів.
priznaky: >-
  При фузаріозі колоса окремі колоски або цілі частини колоса передчасно вибілюються, тоді як
  здорове оточення залишається зеленим; за вологої погоди на колосках і зерні помітний рожевий або
  лососевий наліт міцелію. Зерно щупле, матове і малої маси. На коренях і стеблі з’являються бурі
  сухі гнилі, рослини передчасно достигають і полягають; у кукурудзи гниють корені, стебло і качан.
hostitele:
  - Пшениця та ячмінь
  - Кукурудза
  - Овес, жито, тритикале
  - Зернобобові та олійні культури (гнилі коренів і стебла)
sireni: >-
  Джерелом інфекції є післяжнивні рештки (особливо кукурудзяні) та уражене насіння. Інфікування
  колоса відбувається під час цвітіння за теплої та вологої погоди (дощ під час цвітіння — головний
  ризиковий фактор). Спори поширюються вітром і стоком води; ураженню сприяє мінімальний обробіток
  ґрунту з залишенням решток на поверхні.
skodlivost: >-
  Окрім прямої втрати врожаю та зниження маси 1000 зерен, основним ризиком є забруднення зерна
  мікотоксинами, насамперед дезоксиніваленолом (DON) і зеараленоном, граничні рівні яких у
  продовольчому та кормовому зерні встановлені законодавчо. Перевищення ліміту може знецінити всю
  партію, тому фузаріоз колоса має також суттєве гігієнічне значення.
cyklus: >-
  Гриби зимують у вигляді міцелію та стійких структур (хламідоспори, перитеції) на післяжнивних
  рештках і в ґрунті. Навесні та влітку утворюють спори (аскоспори й конідії), які інфікують колоси
  під час цвітіння, а корені — протягом усього вегетаційного періоду. Ризикованим є вирощування
  зернових після кукурудзи.
ochrana: >-
  Основою є збалансована сівозміна (особливо ризикована — пшениця після кукурудзи), якісний
  обробіток і загортання післяжнивних решток, а також вибір менш чутливих сортів. У зернових проти
  фузаріозу колоса застосовують фунгіцидний захист азолами у фазу цвітіння згідно з сигналізацією та
  прогнозом опадів. Важливо також збирати врожай за сухої погоди та швидко досушувати зерно, що
  обмежує утворення мікотоксинів; реєстрацію препаратів перевіряйте у Державному реєстрі пестицидів
  і агрохімікатів України.
faq:
  - q: Чим небезпечні фузаріози, окрім втрати врожаю?
    a: >-
      Гриби роду Fusarium утворюють мікотоксини, насамперед дезоксиніваленол (DON) і зеараленон.
      Вони можуть забруднювати продовольче та кормове зерно, для якого законодавчо встановлені
      граничні рівні, тому фузаріози становлять загрозу і для безпечності продукції.
  - q: Яка попередня культура підвищує ризик фузаріозу?
    a: >-
      Найризикованішим є вирощування зернових (особливо пшениці) після кукурудзи, післяжнивні рештки
      якої є важливим джерелом інфекції. Ризик підвищує і мінімальний обробіток ґрунту із залишенням
      решток на поверхні.
  - q: Коли проводити фунгіцидний захист проти фузаріозу колоса?
    a: >-
      Найефективніше обробляти у фазу цвітіння зернових, коли гриб інфікує колос. Термін визначають
      за сигналізацією та прогнозом опадів — дощ під час цвітіння суттєво підвищує ризик, тому
      обробку проводять перед очікуваним дощовим періодом (у Чехії).
  - q: Як зменшити вміст мікотоксинів у вже ураженому посіві?
    a: >-
      Після ураження допомагає збирання врожаю за сухої погоди, налаштування комбайна для видалення
      легкого щуплого зерна, а також швидке досушування і очищення врожаю. Зберігання вологого
      ураженого зерна сприяє подальшому утворенню мікотоксинів.
