slug: plisen-bramborova
name: Plíseň bramborová
latinsky: Phytophthora infestans
puvodce: Řasovka (oomyceta) Phytophthora infestans
popis: >-
  Plíseň bramborová je nejnebezpečnější chorobou brambor a napadá i rajčata. Na
  listech se tvoří hnědočerné zavadající skvrny, na rubu listů za vlhka bělavý
  povlak sporů; choroba rychle přechází na nať a později hlízy, kde způsobuje
  hnědou hnilobu. Za teplého a vlhkého počasí může během několika dní zničit celý
  porost. Jde o stejný patogen, který v 19. století způsobil irský hladomor.
priznaky: >-
  Na listech vznikají tmavě zelené až hnědočerné vodnaté skvrny, zpočátku často na
  okrajích a špičkách listů. Na rubu listu je na rozhraní zdravého a napadeného
  pletiva za vlhka patrný bělavý povlak sporangioforů. Napadená nať rychle černá,
  hnije a zapáchá. Na hlízách se objevují našedlé propadlé skvrny a pod slupkou
  rezavě hnědá suchá až vlhká hniloba zasahující do dužniny.
hostitele:
  - Brambory
  - Rajčata
sireni: >-
  Choroba se šíří sporangii přenášenými větrem a deštěm i na velké vzdálenosti.
  Rozhodující je vlhko a teplo — dlouhé ovlhčení nati a teploty přibližně 15–22 °C
  (tzv. blightové periody). Za těchto podmínek probíhá nový infekční cyklus během
  několika dní. Zdrojem jsou napadené hlízy (sadba, výmětové hromady) a přezimující
  oospory.
skodlivost: >-
  Plíseň bramborová je nejzávažnější chorobou brambor; zanedbaná ochrana může za
  příznivého počasí zničit celý porost během jednoho až dvou týdnů. Napadené hlízy
  hnijí i ve skladu a jsou vstupní branou pro sekundární bakteriální hniloby.
  Ztráty se proto počítají na výnosu nati i na skladovatelnosti sklizně.
cyklus: >-
  Patogen přezimuje jako mycelium v napadených hlízách (sadba, výmět) a jako
  oospory v půdě. Z infikovaných hlíz vyrůstá napadená nať, na níž se tvoří
  sporangia zahajující epidemii. Za vlhka sporangia uvolňují pohyblivé zoospory,
  které infikují nať i hlízy; cyklus se za příznivého počasí rychle opakuje.
ucinne_latky:
  - latka: mandipropamid
    pripravky: např. Revus
  - latka: fluazinam
    pripravky: např. Shirlan
  - latka: cymoxanil + mancozeb
    pripravky: např. Curzate
  - latka: oxathiapiprolin
    pripravky: např. Zorvec
ochrana: >-
  Rozhodující je preventivní fungicidní ochrana zahájená podle signalizace ještě
  před objevením příznaků a opakovaná v intervalech 7–14 dní podle tlaku choroby a
  počasí (systémové látky na růst, kontaktní na krytí, specifické na hlízy).
  Důležitá je zdravá certifikovaná sadba, dostatečné odhrnování chránící hlízy před
  splachem spor a desikace či mechanické odstranění nati před sklizní. Registraci
  přípravků ověřte v Registru přípravků na ochranu rostlin ÚKZÚZ.
aliases:
  - plíseň bramborová (Phytophthora infestans) — nejnebezpečnější
faq:
  - q: Proč je plíseň bramborová tak obávaná?
    a: >-
      Phytophthora infestans se za teplého a vlhkého počasí šíří mimořádně rychle a
      dokáže zničit celý porost během několika dní. Napadá i hlízy, které pak v
      uskladnění hnijí. Je to stejný patogen, který způsobil irský hladomor.
  - q: Jak se proti plísni bramborové bránit?
    a: >-
      Klíčová je preventivní fungicidní ochrana zahájená podle signalizace ještě
      před výskytem příznaků a pravidelně opakovaná. Doplňuje ji zdravá sadba,
      dobré odhrnování chránící hlízy a včasné odstranění nati před sklizní.
  - q: Co je blightová perioda?
    a: >-
      Jde o období počasí příznivé pro infekci plísně bramborové — dlouhé ovlhčení
      nati a teploty zhruba 15–22 °C. Předpovědní modely tato období hlásí a slouží
      k načasování preventivních postřiků ještě před objevením příznaků.
  - q: Proč odstraňovat nať před sklizní?
    a: >-
      Zničení nati (desikace nebo mechanicky) přeruší zdroj spor a nechá slupku
      hlíz zpevnit, takže se hlízy při sklizni méně infikují. Sklizeň do zavadlé
      nezničené nati riziko hniloby hlíz ve skladu zvyšuje.
