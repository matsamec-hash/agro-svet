slug: fuzariozy
name: Fuzariózy
latinsky: Fusarium spp.
puvodce: Houby rodu Fusarium (např. F. graminearum, F. culmorum)
popis: >-
  Fuzariózy jsou skupinou chorob způsobených houbami rodu Fusarium, které napadají
  kořeny, stéblo, klas i palici řady plodin. U obilnin je nejzávažnější fuzarióza
  klasu, projevující se předčasně vybělenými klásky a růžovým povlakem na zrnu; u
  kukuřice, luskovin a olejnin převažují hniloby kořenů a stonku. Kromě ztrát na
  výnosu je rizikem tvorba mykotoxinů (zejména deoxynivalenolu, DON), které
  zhoršují zdravotní nezávadnost zrna a krmiv.
priznaky: >-
  U fuzariózy klasu se jednotlivé klásky nebo celé části klasu předčasně vybělují,
  zatímco zdravé okolí zůstává zelené; za vlhka je na kláscích a zrnu patrný
  růžový až lososový povlak mycelia. Zrno je scvrklé, matné a nízké hmotnosti. U
  kořenů a stébla vznikají hnědé zaschlé hniloby, rostliny předčasně dozrávají a
  poléhají; u kukuřice hnijí kořeny, stéblo i palice.
hostitele:
  - Pšenice a ječmen
  - Kukuřice
  - Oves, žito, tritikale
  - Luskoviny a olejniny (hniloby kořenů a stonku)
sireni: >-
  Zdrojem nákazy jsou posklizňové zbytky (zejména kukuřičné) a napadené osivo.
  Infekce klasu probíhá v době kvetení za teplého a vlhkého počasí (déšť během
  květu je hlavní rizikový faktor). Spory se šíří větrem a splachem; napadení
  podporuje minimalizační zpracování ponechávající zbytky na povrchu.
skodlivost: >-
  Kromě přímé ztráty výnosu a snížení HTS je hlavním rizikem kontaminace zrna
  mykotoxiny, především deoxynivalenolem (DON) a zearalenonem, jejichž limity v
  potravinářském i krmném obilí jsou legislativně stanoveny. Překročení limitu může
  znehodnotit celou partii, proto má fuzarióza klasu i významný hygienický dopad.
cyklus: >-
  Houby přezimují jako mycelium a odolné útvary (chlamydospory, peritecia) na
  posklizňových zbytcích a v půdě. Na jaře a v létě produkují spory (askospory a
  konidie), které infikují klasy v době kvetení a kořeny během celé vegetace.
  Rizikové je pořadí obilnina po kukuřici.
ucinne_latky:
  - latka: prothioconazole + tebuconazole
    pripravky: např. Prosaro
  - latka: metconazole
    pripravky: např. Caramba
  - latka: tebuconazole
    pripravky: např. Horizon
ochrana: >-
  Základem je vyvážený osevní postup (riziková je zejména pšenice po kukuřici),
  kvalitní zpracování a zapravení posklizňových zbytků a volba méně náchylných
  odrůd. U obilnin se proti fuzarióze klasu cílí fungicidní ošetření azoly do období
  kvetení podle signalizace a předpovědi srážek. Zásadní je i sklizeň za suchého
  počasí a rychlé dosušení zrna, které omezí tvorbu mykotoxinů; registraci přípravků
  ověřte v Registru přípravků na ochranu rostlin ÚKZÚZ.
aliases:
  - fuzariózy klasu a kořenů
  - fuzariózy klasu
  - fuzarióza kořenů a stonku (Fusarium spp.)
  - fuzarióza kořenů a stonku
  - fuzarióza stonku a kořenů (Fusarium spp.)
  - fuzarióza stonku a palic (Fusarium spp.)
faq:
  - q: Čím jsou fuzariózy nebezpečné kromě ztráty výnosu?
    a: >-
      Houby rodu Fusarium produkují mykotoxiny, především deoxynivalenol (DON) a
      zearalenon. Ty mohou kontaminovat potravinářské i krmné obilí a u zrna jsou
      legislativně sledovány limity, proto fuzariózy ohrožují i zdravotní
      nezávadnost produkce.
  - q: Která předplodina zvyšuje riziko fuzarióz?
    a: >-
      Nejrizikovější je pěstování obilniny (zejména pšenice) po kukuřici, jejíž
      posklizňové zbytky jsou významným zdrojem nákazy. Riziko zvyšuje i
      minimalizační zpracování půdy ponechávající zbytky na povrchu.
  - q: Kdy provést fungicidní ošetření proti fuzarióze klasu?
    a: >-
      Nejúčinnější je ošetření v době kvetení obilniny, kdy houba infikuje klas.
      Termín se řídí signalizací a předpovědí srážek — déšť během květu riziko
      výrazně zvyšuje, proto se ošetřuje před očekávaným deštivým obdobím.
  - q: Jak snížit obsah mykotoxinů v už napadeném porostu?
    a: >-
      Po napadení pomáhá sklizeň za suchého počasí, nastavení mlátičky pro odvátí
      lehkého scvrklého zrna a rychlé dosušení a čištění sklizně. Skladování vlhkého
      napadeného zrna tvorbu mykotoxinů dále zvyšuje.
