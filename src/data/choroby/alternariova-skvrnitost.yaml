slug: alternariova-skvrnitost
name: Alternariová skvrnitost
latinsky: Alternaria spp.
puvodce: Houby rodu Alternaria (např. A. brassicae, A. brassicicola)
popis: >-
  Alternariová skvrnitost (čerň) je houbová choroba zejména brukvovitých olejnin a
  slunečnice. Na listech, stoncích a šešulích se tvoří tmavé, často soustředně
  zónované skvrny s šedočerným povlakem sporulace. U řepky postihuje hlavně šešule,
  které předčasně pukají a osypávají se, čímž způsobuje sklizňové ztráty a zhoršuje
  kvalitu semene. Choroba se šíří za vlhkého, teplejšího počasí ke konci vegetace.
priznaky: >-
  Na listech vznikají tmavě hnědé až černé okrouhlé skvrny s výraznou soustřednou
  zónovitostí (terčovitá kresba) a často se žlutým dvorcem. Za vlhka je pokrývá
  šedočerný sametový povlak konidií. Na stoncích a šešulích se objevují protáhlé
  černé skvrny; napadené šešule předčasně dozrávají, deformují se a pukají. Silně
  napadené listy žloutnou a předčasně opadávají.
hostitele:
  - Řepka ozimá i jarní
  - Hořčice
  - Brukvovitá zelenina (zelí, kapusta, brokolice)
  - Slunečnice
sireni: >-
  Houba se šíří konidiemi přenášenými větrem a deštěm. Infekci podporuje teplé a
  vlhké počasí (optimum přibližně 18–25 °C) a dlouhé ovlhčení rostlin ve druhé
  polovině vegetace, zejména v době dozrávání šešulí. Významným zdrojem primární
  nákazy je napadené osivo a posklizňové zbytky brukvovitých.
skodlivost: >-
  Hlavní ztráty vznikají napadením šešulí, jejich předčasným pukáním a osypáváním
  semen před sklizní a během ní. Ztráty na výnosu řepky se podle intenzity napadení
  a průběhu počasí pohybují běžně v jednotkách procent, za silného tlaku i výše.
  Napadené semeno má nižší HTS a horší olejnatost.
cyklus: >-
  Houba přezimuje na posklizňových zbytcích a v napadeném osivu jako mycelium a
  konidie. Na jaře a v létě produkuje nové konidie, které zajišťují opakované
  (polycyklické) šíření v porostu. Nejnáchylnější je řepka v období od odkvětu do
  dozrávání šešulí.
ucinne_latky:
  - latka: azoxystrobin
    pripravky: např. Amistar
  - latka: boscalid + dimoxystrobin
    pripravky: např. Pictor
  - latka: prothioconazole + fluopyram
    pripravky: např. Propulse
  - latka: difenoconazole
    pripravky: např. Difcor, Score
ochrana: >-
  Pomáhá dodržování osevního postupu s odstupem brukvovitých (nejméně 3–4 roky),
  zapravení posklizňových zbytků a moření osiva. Fungicidní ošetření v období
  dozrávání šešulí (často společně s ošetřením proti sklerotinii) omezuje napadení
  šešulí a osypávání; registraci a dávkování přípravků je nutné ověřit v Registru
  přípravků na ochranu rostlin ÚKZÚZ. Včasná a nepřetahovaná sklizeň ztráty dále
  snižuje.
aliases:
  - alternariová skvrnitost
  - alternariová skvrnitost (Alternaria spp.)
faq:
  - q: Které části řepky alternárie nejvíce poškozuje?
    a: >-
      Z hlediska výnosu jsou nejcitlivější šešule. Napadené šešule předčasně
      dozrávají, pukají a osypávají se, takže ztráty vznikají těsně před sklizní i
      během ní. Skvrny na listech a stoncích bývají méně významné.
  - q: Liší se alternariová skvrnitost od černě řepkových pletiv?
    a: >-
      Jde o příbuzné choroby téhož rodu — čerň řepkových pletiv způsobuje zejména
      Alternaria brassicae. V praxi se projevy i ochrana překrývají a obě se řadí
      mezi alternariové skvrnitosti brukvovitých.
  - q: Kdy se proti alternariové skvrnitosti u řepky zasahuje?
    a: >-
      Ošetření se cílí do období dozrávání šešulí, kdy je riziko napadení a
      osypávání nejvyšší. V praxi se často spojuje s fungicidním ošetřením proti
      sklerotiniové hnilobě v době kvetení až odkvětu.
  - q: Přenáší se alternárie osivem?
    a: >-
      Ano, napadené osivo je významným zdrojem nákazy a přenáší houbu na nové
      porosty. Proto patří moření osiva a používání zdravého, certifikovaného osiva
      mezi základní preventivní opatření.
