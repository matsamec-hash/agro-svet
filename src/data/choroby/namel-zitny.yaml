slug: namel-zitny
name: Námel žitný
latinsky: Claviceps purpurea
puvodce: Houba Claviceps purpurea
popis: >-
  Námel je houbová choroba obilnin a trav, nejnápadnější u žita, které je cizosprašné
  a má déle otevřené květy. Místo zrna se v klasu vytvoří tmavě fialové až černé
  rohlíčkovité sklerocium (námel), které přerůstá obilku. Sklerocia obsahují jedovaté
  námelové alkaloidy, jež jsou nebezpečné pro lidi i hospodářská zvířata, proto je
  obsah námele v potravinářském a krmném zrnu legislativně sledován a omezen.
priznaky: >-
  Prvním příznakem je v době kvetení sladká lepkavá tekutina (medovice) vylučovaná z
  napadených květů, na kterou se slétá hmyz. Později se místo zrna v klasu vytvoří
  tvrdé rohlíčkovité sklerocium — tmavě fialové až černé, obvykle výrazně delší než
  zdravá obilka a vyčnívající z pluch. V jednom klasu bývá jedno až několik sklerocií.
hostitele:
  - Žito (nejnáchylnější)
  - Pšenice, ječmen, oves, tritikale
  - Trávy na semeno a plevelné trávy
sireni: >-
  Primární infekce vychází z askospor uvolňovaných ze sklerocií, která přezimovala v
  půdě nebo se dostala do osiva. Askospory infikují otevřené květy v době kvetení;
  medovice s konidiemi pak přenáší hmyz a déšť na další květy. Náchylnost zvyšuje vše,
  co prodlužuje a rozvolňuje kvetení (chladné počasí, řídký porost, cizosprašnost).
skodlivost: >-
  Přímá ztráta výnosu bývá spíše nižší, rozhodující je zdravotní a legislativní
  riziko: sklerocia obsahují toxické námelové alkaloidy a jejich obsah v
  potravinářském i krmném zrnu je zákonem omezen. Překročení limitu partii
  znehodnotí. Historicky námel způsoboval hromadné otravy (ergotismus).
cyklus: >-
  Houba přezimuje jako sklerocia v půdě a v osivu. Na jaře z nich vyrůstají drobné
  plodnice (stromata) s askosporami, které zahajují infekci kvetoucích obilnin a
  trav. Po infekci vzniká medovicová (konidiová) fáze šířená hmyzem a nakonec se
  vytvoří nová sklerocia. Sklerocia z povrchu půdy po hluboké orbě ztrácejí
  klíčivost.
ochrana: >-
  Chemická ochrana proti námelu není účinná, rozhoduje agrotechnika. Pomáhá použití
  čištěného, námele prostého osiva, hluboká orba (sklerocia z povrchu ztrácejí
  klíčivost), potlačování kvetoucích trav a výmrsku v okolí pozemků jako zdrojů
  nákazy a vyrovnané, souvislé kvetení porostu, které zkracuje dobu náchylnosti.
  Sklerocia se odstraňují čištěním a tříděním sklizeného zrna.
aliases:
  - námel žitný (Claviceps purpurea) — toxický, sledovat obsah v zrnu
faq:
  - q: Proč je námel nebezpečný?
    a: >-
      Sklerocia námele obsahují námelové alkaloidy, které jsou toxické pro lidi i
      zvířata (historicky způsobovaly otravy zvané ergotismus). Proto je jeho obsah v
      potravinářském a krmném zrnu sledován a zákonem omezen.
  - q: Proč je námelem nejvíce ohroženo žito?
    a: >-
      Žito je cizosprašné a jeho květy zůstávají déle otevřené, takže jsou snáze
      přístupné infekci výtrusy námele v době kvetení. Samosprašné obilniny s rychlým
      uzavřením květů jsou napadány méně.
  - q: Lze proti námelu zasáhnout fungicidem?
    a: >-
      Účinná chemická ochrana proti námelu neexistuje. Rozhodující jsou preventivní
      agrotechnická opatření — zdravé čištěné osivo, hluboká orba k zaklopení
      sklerocií, potlačení kvetoucích trav a čištění sklizně.
  - q: Jak se sklerocia dostanou ze zrna pryč?
    a: >-
      Sklerocia jsou obvykle delší a lehčí než zdravé zrno, takže je lze z partie
      odstranit důkladným čištěním a tříděním (síta, gravitační a optické třídiče).
      U silně napadené sklizně je čištění nezbytné pro dodržení limitů.
