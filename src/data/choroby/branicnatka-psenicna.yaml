slug: branicnatka-psenicna
name: Braničnatka pšeničná (septorióza)
latinsky: Zymoseptoria tritici
puvodce: Houba Zymoseptoria tritici (dříve Septoria tritici / Mycosphaerella graminicola)
popis: >-
  Braničnatka pšeničná, označovaná též jako septorióza listů, je v podmínkách ČR
  jednou z nejvýznamnějších listových chorob pšenice. Na listech se tvoří
  podlouhlé žlutavé až hnědé skvrny ohraničené žilnatinou, v nichž jsou patrné
  drobné černé plodničky (pyknidy). Choroba postupuje od spodních listů k horním
  a za vlhkého počasí může zničit i praporcový list, čímž výrazně snižuje výnos.
priznaky: >-
  Na listech vznikají nejprve drobné vodnaté skvrnky, které se protahují podél
  žilnatiny do nepravidelných žlutohnědých až šedavých nekróz s tmavým lemem. Ve
  skvrnách jsou pouhým okem viditelné černé tečky — pyknidy s výtrusy. Napadení
  postupuje zdola nahoru; při silném tlaku odumírají horní listy včetně
  praporcového a porost předčasně zasychá.
hostitele:
  - Pšenice ozimá i jarní
  - Tritikale
  - Ojediněle další trávy a obilniny
sireni: >-
  Primární nákaza pochází z askospor uvolňovaných z posklizňových zbytků, v porostu
  se choroba dále šíří konidiemi splachovanými dešťovými kapkami na vyšší patra
  listů. Infekci podporuje vlhké a mírné počasí (přibližně 15–20 °C) a dlouhé
  ovlhčení listů. Hustý, bujný porost šíření urychluje.
skodlivost: >-
  Braničnatka patří k nejškodlivějším listovým chorobám pšenice; poškození horních
  listů a praporcového listu přímo snižuje hmotnost zrna. Ztráty na výnosu se za
  silného napadení a příznivého počasí mohou pohybovat v desítkách procent.
  Patogen je náchylný ke vzniku rezistence vůči účinným látkám.
cyklus: >-
  Houba přezimuje na posklizňových zbytcích pšenice a v ozimu jako mycelium.
  Askospory zahajují jarní infekci spodních listů, odkud se choroba polycyklicky
  šíří konidiemi na horní patra během celého jara. Nebezpečná je zejména dlouhá
  latentní doba (i několik týdnů), během níž není napadení viditelné.
ucinne_latky:
  - latka: prothioconazole
    pripravky: např. Proline
  - latka: mefentrifluconazole
    pripravky: např. Revystar
  - latka: fluxapyroxad + mefentrifluconazole
    pripravky: např. Revytrex
  - latka: benzovindiflupyr
    pripravky: např. Elatus Plus
  - latka: folpet
    pripravky: multisite, do kombinací proti rezistenci
ochrana: >-
  Důležité je pěstování odolnějších odrůd, vyloučení pšenice po pšenici a zapravení
  posklizňových zbytků (zdroj nákazy). Fungicidní ochrana se cílí na horní listy a
  praporcový list ve fázi sloupkování až metání; používají se azoly a látky ze
  skupiny SDHI, vhodné je střídání a kombinování účinných látek kvůli rezistenci.
  Registraci a dávkování ověřte v Registru přípravků na ochranu rostlin ÚKZÚZ.
aliases:
  - braničnatka pšeničná (septorióza)
  - braničnatka (septorióza)
faq:
  - q: Proč je ochrana praporcového listu u braničnatky klíčová?
    a: >-
      Praporcový a podpraporcový list tvoří podstatnou část asimilační plochy,
      která plní zrno. Jejich poškození braničnatkou přímo snižuje hmotnost zrna a
      výnos, proto se fungicidní ošetření načasovává tak, aby tyto listy ochránilo.
  - q: Jak se braničnatka šíří?
    a: >-
      Primární nákaza pochází z posklizňových zbytků (askospory), v porostu se pak
      šíří výtrusy (konidie) splachem dešťových kapek na vyšší patra listů. Vlhké a
      mírné počasí šíření výrazně podporuje.
  - q: Proč je u braničnatky problém s rezistencí?
    a: >-
      Zymoseptoria tritici je vůči vzniku rezistence velmi náchylná a v ČR i Evropě
      je popsán pokles účinnosti u řady azolů i SDHI. Proto se doporučuje střídat a
      kombinovat účinné látky s odlišným mechanismem účinku a přidávat multisitní
      látku.
  - q: Jak odlišit braničnatku od jiných listových skvrnitostí?
    a: >-
      Charakteristické jsou protáhlé nekrózy ohraničené žilnatinou s viditelnými
      černými pyknidami ve skvrnách. Na rozdíl od rzí netvoří prášivé kupky spor a
      na rozdíl od padlí nemá bílý povlak na povrchu listu.
