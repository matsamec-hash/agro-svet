slug: fomova-hniloba-repky
name: Fomová hniloba stonku
latinsky: Leptosphaeria maculans
puvodce: Houba Leptosphaeria maculans (anamorfa Phoma lingam)
popis: >-
  Fomová hniloba (fomové černání stonku) je významná choroba řepky a dalších
  brukvovitých. Na podzim se na listech objevují světlé skvrny s drobnými černými
  plodničkami; houba pak prorůstá řapíkem do kořenového krčku a báze stonku, kde
  způsobuje zaškrcující suchou hnilobu. Napadené rostliny se lámou, předčasně
  dozrávají a poléhají, což vede k výrazným ztrátám na výnosu. Primární nákaza
  pochází z askospor uvolňovaných z posklizňových zbytků.
priznaky: >-
  Na podzimních listech vznikají okrouhlé bělavé až šedavé skvrny s roztroušenými
  černými pyknidami. Nejzávažnějším příznakem je suchá zaškrcující hniloba
  kořenového krčku a báze stonku, na řezu s tmavým, zaschlým pletivem. Napadené
  rostliny snadno vylomíte ze země, na jaře předčasně dozrávají, mění barvu a
  poléhají.
hostitele:
  - Řepka ozimá i jarní
  - Hořčice
  - Brukvovitá zelenina
sireni: >-
  Hlavním zdrojem nákazy jsou askospory uvolňované z posklizňových zbytků řepky
  během podzimních dešťů; nesou se větrem na vzcházející porosty. Infekci podporuje
  vlhké počasí a mírné teploty na podzim. Choroba se z listů dostává do stonku
  postupným prorůstáním řapíkem, což trvá týdny až měsíce.
skodlivost: >-
  Ztráty vznikají zaškrcením a lámáním stonků před sklizní i u porostů, které na
  podzim vypadaly zdravě. Za silného tlaku a vnímavých odrůd mohou dosáhnout desítek
  procent výnosu. Škodlivost se posuzuje na podzim podle podílu napadených rostlin a
  hloubky napadení krčku.
cyklus: >-
  Houba přezimuje na posklizňových zbytcích řepky, kde dozrávají plodnice
  (pseudothecia) s askosporami. Ty zahajují podzimní infekci listů, odkud houba
  prorůstá do stonku a přes zimu i vegetaci pokračuje. Krátký odstup řepky a
  ponechání zbytků na povrchu inokulum výrazně zvyšují.
ucinne_latky:
  - latka: prothioconazole
    pripravky: např. Proline
  - latka: metconazole
    pripravky: např. Caramba (s morforegulačním účinkem)
  - latka: tebuconazole
    pripravky: např. Horizon
  - latka: difenoconazole + paclobutrazol
    pripravky: např. Toprex
ochrana: >-
  Klíčový je dostatečný odstup řepky v osevním postupu (nejméně 3–4 roky) a
  zapravení posklizňových zbytků, které jsou hlavním zdrojem askospor. Pěstují se
  odolnější odrůdy a podle náletu spor a vývoje porostu se na podzim (případně i na
  jaře) aplikují azolové fungicidy, které zároveň působí morforegulačně. Registraci
  a dávkování ověřte v Registru přípravků na ochranu rostlin ÚKZÚZ.
aliases:
  - fomová hniloba stonku (Leptosphaeria maculans)
faq:
  - q: Proč je fomová hniloba u řepky zvlášť nebezpečná?
    a: >-
      Houba prorůstá od listů až do kořenového krčku a báze stonku, který zaškrcuje
      a oslabuje. Rostliny se pak lámou a poléhají ještě před sklizní, takže ztráty
      vznikají i u porostů, které na podzim vypadaly zdravě.
  - q: Jak se fomové hnilobě nejlépe předcházet?
    a: >-
      Nejúčinnější prevencí je dostatečně dlouhý odstup řepky na pozemku (3–4 roky),
      zapravení posklizňových zbytků a volba odolných odrůd. Doplňuje je podzimní
      fungicidní ošetření podle signalizace náletu spor.
  - q: Kdy provést podzimní ošetření proti fomové hnilobě?
    a: >-
      Ošetření se cílí do období od náletu askospor, obvykle na vyvinutý podzimní
      porost přibližně ve fázi 4–8 listů, podle signalizace a průběhu počasí.
      Azolové přípravky zároveň zpevňují a zkracují porost před zimou.
  - q: Pomáhá proti fomové hnilobě volba odrůdy?
    a: >-
      Ano, mezi odrůdami řepky jsou výrazné rozdíly v odolnosti vůči fomové hnilobě,
      část z nich nese specifické geny rezistence. Odolná odrůda snižuje riziko i
      potřebu intenzivní fungicidní ochrany.
