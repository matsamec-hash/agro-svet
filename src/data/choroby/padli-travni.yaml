slug: padli-travni
name: Padlí travní
latinsky: Blumeria graminis
puvodce: Houba Blumeria graminis (dříve Erysiphe graminis)
popis: >-
  Padlí travní je nejrozšířenější houbová choroba obilnin. Na listech, listových
  pochvách a později i na klasech se tvoří charakteristický bílý až šedavý
  moučnatý povlak mycelia, který postupně hnědne a v něm dozrávají tmavá
  plodnička (kleistothecia). Napadené pletivo žloutne a předčasně odumírá, čímž
  klesá asimilační plocha, hmotnost zrna i výnos. Choroba se šíří zejména za
  teplého a vlhkého počasí v hustých, přehnojených porostech.
priznaky: >-
  Typickým příznakem je bílý až šedavý moučnatý (vatovitý) povlak na svrchní i
  spodní straně listů, listových pochvách a stéblech, který lze zpočátku setřít
  prstem. Povlak postupně šedne a hnědne a objevují se v něm drobná černá tělíska
  (kleistothecia). Pod povlakem pletivo žloutne a zasychá; napadení postupuje od
  spodních listů vzhůru, za silného tlaku i na klasy.
hostitele:
  - Pšenice ozimá i jarní
  - Ječmen
  - Žito, oves, tritikale
sireni: >-
  Padlí se šíří konidiemi přenášenými větrem. K infekci nepotřebuje kapkovou vlhkost
  (na rozdíl od většiny listových chorob), stačí vysoká vzdušná vlhkost a teploty
  přibližně 15–22 °C. Šíření výrazně podporují husté, bujné a dusíkem přehnojené
  porosty s omezeným prouděním vzduchu. Zdrojem jarní nákazy je výmrsk a ozimy.
skodlivost: >-
  Silné napadení snižuje asimilační plochu, urychluje stárnutí listů a snižuje
  hmotnost zrna; ztráty na výnosu se za příznivých podmínek a náchylných odrůd
  pohybují běžně v jednotkách až nižších desítkách procent. Práh škodlivosti se
  hodnotí podle podílu napadené listové plochy na spodních patrech.
cyklus: >-
  Houba přezimuje jako mycelium na ozimech a výmrsku a jako kleistothecia na
  zbytcích. Na jaře produkuje konidie zahajující polycyklické šíření, které za
  příznivého počasí probíhá v krátkých cyklech po celou vegetaci. Patogen má
  specializované formy (formae speciales) vázané na jednotlivé druhy obilnin.
ucinne_latky:
  - latka: metrafenone
    pripravky: např. Flexity
  - latka: prothioconazole
    pripravky: např. Proline
  - latka: spiroxamine
    pripravky: morfolinová složka kombinovaných přípravků
  - latka: proquinazid
    pripravky: např. Talius
ochrana: >-
  Základem je volba odolných odrůd, vyvážené dusíkaté hnojení (přehnojení dusíkem
  riziko zvyšuje) a přiměřená hustota porostu. Při překročení prahu škodlivosti se
  aplikují fungicidy ze skupin azolů, morfolinů či specifických látek proti padlí,
  často v kombinaci na listy i ochranu klasu. Důležité je střídání účinných látek
  kvůli prevenci rezistence; registraci ověřte v Registru přípravků na ochranu
  rostlin ÚKZÚZ.
aliases:
  - padlí travní
faq:
  - q: Které plodiny padlí travní nejčastěji napadá?
    a: >-
      Padlí travní napadá většinu obilnin — pšenici, ječmen, oves, žito i
      tritikale. Patogen má sice specializované formy (formae speciales) vázané na
      konkrétní druh, ale jako choroba se vyskytuje napříč celým spektrem obilnin.
  - q: Jak poznat padlí na obilí?
    a: >-
      Typickým příznakem je bílý moučnatý povlak na listech a stéblech, který lze
      zpočátku setřít prstem. Postupně tmavne a v něm se objevují drobné černé
      plodničky. Napadené listy žloutnou a předčasně zasychají.
  - q: Proč padlí svědčí husté a přehnojené porosty?
    a: >-
      V hustém a dusíkem přehnojeném porostu je vyšší vzdušná vlhkost, horší
      provětrávání a měkčí, náchylnější pletiva. To vytváří ideální podmínky pro
      šíření padlí, proto je vyvážená výživa a hustota porostu součástí ochrany.
  - q: Potřebuje padlí k infekci déšť?
    a: >-
      Ne. Na rozdíl od většiny listových chorob padlí ke klíčení spor nepotřebuje
      kapkovou vodu, stačí mu vysoká vzdušná vlhkost. Proto se může šířit i v
      obdobích bez vydatných srážek, pokud jsou porosty husté a vlhké.
