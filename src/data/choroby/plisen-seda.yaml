slug: plisen-seda
name: Plíseň šedá
latinsky: Botrytis cinerea
puvodce: Houba Botrytis cinerea
popis: >-
  Plíseň šedá je všudypřítomná houbová choroba s velmi širokým okruhem hostitelů,
  od polních plodin po zeleninu a ovoce. Na odumírajících nebo poškozených
  pletivech se tvoří šedý prašný povlak hustého mycelia a spor. Houba se chová
  převážně jako oslabující (sekundární) patogen — proniká poraněními, odumřelými
  okvětními lístky nebo zeslabenými pletivy a způsobuje hniloby za vlhkého a
  chladnějšího počasí. U cukrovky a řepky napadá listy a další pletiva, zejména v
  zapojených, vlhkých porostech.
priznaky: >-
  Typickým příznakem je šedý až šedohnědý prašný povlak, který se z napadeného
  pletiva při doteku práší (masa konidií). Nejprve vznikají vodnaté hnědnoucí
  skvrny na poškozených nebo odumírajících částech (okvětní lístky, poranění,
  báze stonků), odkud hniloba postupuje do zdravého pletiva. V napadených
  pletivech se později tvoří drobná černá sklerocia.
hostitele:
  - Řepka a slunečnice
  - Cukrovka
  - Luskoviny a zelenina
  - Réva vinná a ovoce (bobuloviny)
sireni: >-
  Houba se šíří konidiemi přenášenými větrem a splachem. Klíčení spor a infekci
  podporuje dlouhé ovlhčení pletiv, vysoká vzdušná vlhkost a chladnější počasí
  (optimum přibližně 15–20 °C). Vstupní branou jsou poranění a odumřelá pletiva,
  proto je riziko nejvyšší v zapojených, poléhajících nebo mrazem poškozených
  porostech.
skodlivost: >-
  U polních plodin bývá plíseň šedá spíše doprovodnou chorobou oslabených porostů,
  význam roste u zeleniny, révy a ovoce, kde způsobuje hniloby plodů před sklizní i
  po ní. Škodlivost stoupá ve vlhkých letech a v hustých porostech; u skladovaného
  ovoce a zeleniny patří k hlavním příčinám ztrát.
cyklus: >-
  Houba přezimuje jako sklerocia a mycelium na rostlinných zbytcích. Za vlhka z
  nich vyrůstají konidiofory produkující velké množství konidií, které zajišťují
  opakované šíření během celé vegetace. Botrytis snadno napadá odumírající pletiva
  a odtud se šíří do zdravých; má sklon ke vzniku rezistence vůči fungicidům.
ucinne_latky:
  - latka: fludioxonil + cyprodinil
    pripravky: např. Switch
  - latka: boscalid + pyraclostrobin
    pripravky: např. Signum
  - latka: fenhexamid
    pripravky: např. Teldor
ochrana: >-
  Základem je omezení vlhkosti v porostu (vzdušné porosty, vyvážená výživa) a
  prevence poranění rostlin. Cílené fungicidní ošetření se zaměřuje na rizikové
  období a oslabené porosty; vzhledem ke sklonu Botrytis k rezistenci je nutné
  střídat účinné látky s odlišným mechanismem účinku. Pomáhá i zapravení napadených
  zbytků a u zeleniny a ovoce rychlé zchlazení sklizně. Registraci přípravků ověřte
  v Registru přípravků na ochranu rostlin ÚKZÚZ.
aliases:
  - plíseň šedá (Botrytis cinerea)
faq:
  - q: Proč se plíseň šedá objevuje hlavně na oslabených rostlinách?
    a: >-
      Botrytis cinerea je převážně oslabující patogen — nejsnáze proniká
      poraněními, odumřelými okvětními lístky nebo pletivy zeslabenými stresem,
      mrazem či jinou chorobou. Zdravé a dobře vyživené porosty napadá obtížněji.
  - q: Jaké počasí plísni šedé svědčí?
    a: >-
      Plíseň šedá se nejvíce šíří za vlhkého, chladnějšího počasí a vysoké vzdušné
      vlhkosti v zapojených porostech. Dlouhé ovlhčení listů a špatné provětrávání
      riziko výrazně zvyšují.
  - q: Proč je u plísně šedé problém s rezistencí?
    a: >-
      Botrytis cinerea má krátký reprodukční cyklus a velkou populaci spor, takže
      rychle vytváří kmeny odolné vůči fungicidům. Proto je zásadní střídat účinné
      látky s odlišným mechanismem účinku a nespoléhat opakovaně na jednu skupinu.
  - q: Jak omezit plíseň šedou u skladovaného ovoce a zeleniny?
    a: >-
      Pomáhá sklizeň zdravých, nepoškozených plodů za sucha, rychlé zchlazení a
      udržování nízké teploty a přiměřené vlhkosti ve skladu. Poraněné a nahnilé
      kusy je nutné vyřadit, protože jsou zdrojem dalšího šíření.
