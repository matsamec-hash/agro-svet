slug: valtra
name: Valtra
country: Finsko
founded: 1951
website: https://www.valtra.cz
wikipedia: https://en.wikipedia.org/wiki/Valtra
wikidata: https://www.wikidata.org/wiki/Q385867
description: >
  Finský výrobce traktorů s dlouhou tradicí (dříve Valmet). Součást koncernu AGCO od roku 2004.
  Známý robustní konstrukcí pro severské podmínky, reverzním systémem TwinTrac (kabina
  s otočným sedadlem pro práci zezadu) a personalizací — každý traktor se vyrábí na míru
  zákaznickým požadavkům. Kombajny nevyrábí.

categories:
  traktory:
    name: Traktory

    series:
      # ========== VALMET legacy (do 2001) ==========
      - slug: valmet-6000-8000
        name: "Valmet 6000/8000 Series (1991–2007)"
        year_from: 1991
        year_to: 2007
        description: >
          Traktory Valmet / Valtra Valmet: řada Mezzo 6000 (od 1991) a „padesátkové“ modely 8000
          (1995–2004); 6200 až 6400 se vyráběly ještě v letech 2005–2007. Motory Valmet / Sisu
          4- a 6-válec, převodovka 12F/12R synchro, volitelně Delta Powershift 36F/36R.
        models:
          - slug: valtra-valmet-6100
            name: "Valmet 6100"
            year_from: 1991
            year_to: 1995
            power_hp: 81
            power_kw: 60
          - slug: valtra-valmet-6200
            name: "Valmet 6200"
            year_from: 1996
            year_to: 2007
            power_hp: 92
            power_kw: 68
            overview: >
              Finská řada 6000 (Mezzo), model 6200 se vyráběl zhruba v letech 1996–2007 s výkonem kolem 92 koní. Jednoduchý,
              mimořádně houževnatý traktor s pověstí „nezničitelného". Dnes veterán
              a ojetina — dobře udržované kusy slouží i po 30 letech.
            reliability: >
              Vynikající pověst spolehlivosti a životnosti (běžně přes 14 000 motohodin).
              Mechanicky prostý a snadno opravitelný.
            common_faults:
              - issue: "Hrubší řazení powershiftu 36/36"
                note: "Charakter řady Mezzo, ne závada — očekávat drsnější řazení pod zatížením."
              - issue: "Opotřebení, koroze a těsnění dané stářím"
                note: "U 30+ let starého stroje rozhoduje historie a údržba, ne modelová slabina."
            pros:
              - "Legendární spolehlivost a životnost"
              - "Jednoduchý a levný servis"
              - "Osvědčený pracovní kůň"
              - "Silná zůstatková hodnota u zachovalých kusů"
            cons:
              - "Stáří 30+ let"
              - "Hrubší powershift"
              - "Zastaralý komfort"
              - "U vysoko naježděných kusů opotřebení"
            used_price:
              min: 200000
              max: 450000
              note: "Orientačně podle inzerce; závisí silně na stavu, nájezdu a údržbě."
            for_whom: >
              Vhodný pro toho, kdo chce jednoduchý a odolný pracovní traktor na lehčí
              a záložní práce a nevadí mu stáří a nižší komfort.
