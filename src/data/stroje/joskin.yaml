      - slug: volumetra
        name: Volumetra
        family: volumetra
        subcategory: cisterny-kejda
        description: |
          Volumetra je velkoobjemová cisterna na kejdu s objemy od 12000 do 30000 litrů určená pro velké zemědělské podniky a aplikační družstva. Tridem náprava s pneumatickým odpružením a všechny řízené nápravy zajišťují obratnost i s plnou nádrží. Standardní výbava zahrnuje turbínové plnicí rameno s pamětí poslední polohy. Galvanizovaná ocelová nádrž 6 mm odolá nejagresivnější kejdě i digestátu po desetiletí.
