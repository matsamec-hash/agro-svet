      - slug: trans-ktp
        name: Trans-KTP
        family: trans-ktp
        subcategory: navesy-sklapeci
        description: |
          Trans-KTP je heavy-duty zadní sklápěč určený pro nejtěžší přepravní úkoly v zemědělství i stavebnictví. Robustní monocoque korba z 6 mm HARDOX plechu odolá kamenům, štěrku i zmrzlé hlíně. Tridem náprava se samořiditelnou poslední nápravou snižuje opotřebení pneumatik a zvyšuje obratnost. Hydraulické zadní čelo s automatickým otevíráním urychluje vykládku.
        tech_highlights:
