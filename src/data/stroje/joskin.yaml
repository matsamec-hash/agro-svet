      - slug: trans-space
        name: Trans-SPACE
        family: trans-space
        subcategory: navesy-posuvne-dno
        description: |
          Trans-SPACE je velkoobjemový návěs s posuvnou čelní stěnou pro maximální využití nákladového prostoru. Konstrukce s rovnou podlahou a hladkými hliníkovými bočnicemi minimalizuje rezidua a usnadňuje čištění. Hydraulicky poháněná čelní stěna postupně tlačí náklad ven, což je šetrné k materiálu i k samotnému stroji. Ideální pro siláž, senáž, brambory nebo cukrovku.
        tech_highlights:
