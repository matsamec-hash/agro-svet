        description: |
          Pendislide je vlečný hadicový aplikátor kejdy pro přesnou aplikaci přímo k zemi mezi rostliny. Ocelové smyky na konci každé hadice rozhrnují porost a kladou kejdu přímo na povrch půdy, čímž minimalizují ztráty amoniaku. Hydraulicky sklopná ramena zajišťují kompaktní transportní rozměry. Vhodný pro kukuřici, obilniny i trvalé travní porosty.
