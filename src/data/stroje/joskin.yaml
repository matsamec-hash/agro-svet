      - slug: solodisc
        name: Solodisc
        family: solodisc
        subcategory: aplikatory-kejda
        description: |
          Solodisc je diskový aplikátor kejdy s injektážními kotouči, které zaorávají kejdu mělce do půdy a tím dramaticky snižují emise amoniaku. Každý kotouč je pružinou nezávisle odpružený pro kopírování terénu. Hydraulicky sklopná ramena umožňují transportní šířku pod 3 m. Ideální pro strniska, podmítku a aplikace v souladu s dusíkatou direktivou EU.
