# SK overlay (popisy/polia) na cs štruktúru. AI draft+editor, review nutný.

country: "USA"
description: >-
  Najväčší výrobca poľnohospodárskej techniky na svete. Americká spoločnosť so zelenými traktormi a žltou hviezdou dominuje trhu v Severnej Amerike, Európe aj Ázii.

categories:
  traktory: "Traktory"
  kombajny: "Kombajny"
  rezacky: "Samohybné rezačky"
  postrikovace: "Samohybné postrekovače"

series:
  new-generation-10-series: >-
    Rad, ktorý ukončil éru dvojvalcových motorov John Deere („Johnny Popper“). Premiéra 30. augusta 1960 v Dallase („Deere Day in Dallas“) predstavila viacvalcové motory, prevodovku Synchro-Range a novú hydrauliku. Traktory 1010–5010 sa vyrábali v rokoch 1960–1965, potom ich nahradil rad 20.
  20-series-1963: >-
    Nástupca radu 10. Kľúčový model 4020 (1963–1972) patrí k najpredávanejším traktorom John Deere, vyrobilo sa ich viac ako 184 000; ponúkal prevodovku Power Shift s radením pod záťažou a naftový šesťvalec 6,6 l. V Mannheime John Deere vyrába od prevzatia firmy Heinrich Lanz v roku 1956. Uvedené výkony sú výkony na vývodovom hriadeli (PTO).
  30-series-sound-gard: >-
    Generácia, ktorá definovala pohodlie v poľnohospodárstve. V septembri 1972 predstavil John Deere revolučnú kabínu **Sound-Gard** — prvú integrovanú zvukovo izolovanú kabínu v poľnohospodárskej technike s klimatizáciou, kúrením a tlmením vibrácií (max. 80 dB(A) vo vnútri). Prezývaná „Generation II". Modely 4030/4230/4430/4630 nahradili úspešné rady 4020/4320/4520/4620 a stanovili nové štandardy ergonómie pre celé odvetvie.
  40-series-iron-horse: >-
    Modernizácia kabíny Sound-Gard. Modely 4040/4240/4440/4640/4840 priniesli úspornejšie motory, vylepšenú hydrauliku a prevodovku Quad-Range s čiastočným radením pod záťažou. Uvedené výkony sú výkony na vývodovom hriadeli (PTO), ako ich vtedy uvádzal John Deere; 4840 mal 180 k na PTO.
  50-series-1982: >-
    Pokračovanie radu 40 s dôrazom na úspornosť. Modely 4050/4250/4450/4650/4850 mali výkon motora zhruba 130–215 k (DIN), atmosférický alebo preplňovaný šesťvalec 7,6 l a prevodovky Quad-Range alebo Power Shift.
  55-series-1988: >-
    Posledný rad veľkých row-crop traktorov John Deere pred radom 7000. Modely 4055/4255/4455/4555/4755/4955 mali preplňovaný šesťvalec 7,6 l; vrcholný 4955 mal výkon motora 230 k (DIN), 200 k na vývodovom hriadeli.
  5000: >-
    Utility traktory 5200, 5300, 5400 a 5500 z továrne John Deere v Auguste (Georgia, USA), výkon motora zhruba 45–85 k. Jednoduchá koncepcia pre menšie farmy a komunálne nasadenie; európske verzie vyrábala firma Carraro v Taliansku.
  5010-5020-5030: >-
    Súhrnný riadok niekoľkých generácií utility traktorov John Deere (rady 5015, 5020 a 5M). Motory PowerTech, synchronizované prevodovky.
  5m: >-
    Univerzálny rad 5M (od 2009) s motormi PowerTech a elektronicky riadenou hydraulikou. Od modelového roku 2023 (USA) a 2024 (Európa) ho tvoria 5075M, 5095M, 5105M, 5120M a 5130M.
  5r: >-
    Prémiový utility rad v dvoch generáciách: 5080R/5090R/5100R (2008–2013) a 5090R/5100R/5115R/5125R (2016–2022). Prevodovky CommandQuad alebo plynulá AutoPowr, ovládanie CommandARM.
  6000: >-
    Rad stredných traktorov z Mannheimu: štvorvalce 6100–6400 (od 1992, motory 3,9 a 4,5 l) a šesťvalce 6506, 6600, 6800 a 6900 (od 1994, motory 5,9 a 6,8 l). Prevodovka PowrQuad, voliteľné odpruženie prednej nápravy Triple Link Suspension.
  6010: >-
    Nástupca radu 6000, motory PowerTech, prevodovka PowrQuad Plus 16x16. Rozšírený výber od 80 do 150 koní.
  6020: >-
    Úplne nová platforma. Kabína ComfortGard, motor PowerTech Plus s common-rail, voliteľná prevodovka AutoQuad Plus a hydraulika s detekciou záťaže (load sensing).
  6030-premium: >-
    Prémiový rad s technológiou AutoPowr (CVT), plné odpruženie prednej nápravy TLS, kabína Premium a integrácia s GreenStar 2.
  6m: >-
    Univerzálny rad pre zmiešané farmy v troch generáciách (2012–2016, 2016–2019, 2019–2024). Motory PowerTech 4,5 a 6,8 l, prevodovky AutoQuad, CommandQuad a AutoPowr. Od roku 2024 ho nahradili modely 6M 95 až 6M 250.
  6r: >-
    Prémiový všestranný rad v dvoch generáciách: 2012–2015 s motormi PowerTech PVX (Stage IIIB) a 2015–2021 (Stage IV). Prevodovky AutoQuad, DirectDrive a plynulá AutoPowr IVT, ovládanie joystickom CommandPRO, odpruženie TLS Plus. Od novembra 2021 ho nahradili modely 6R 110 až 6R 250.
  6r-gen3: >-
    Súčasná generácia 6R (od modelového roku 2022) z Mannheimu. Motory PowerTech 4,5 l (4-valec, do 6R 150) a 6,8 l (6-valec) Stage V, prevodovky AutoQuad, DirectDrive a plynulá AutoPowr, kabína CommandView 4. Pre modelový rok 2027 John Deere ohlásil nové veľké modely 6R 180 až 6R 260.
  7000: >-
    Row-crop traktory 7600, 7700 a 7800 z továrne Waterloo (1992–1997), výkon motora 130–170 k. Predchodcovia radov 7010 a 7020.
  7010: >-
    Row-crop traktory druhej generácie: motory PowerTech 6,8 l a pri 7710 a 7810 8,1 l, prevodovky PowrQuad Plus, AutoQuad, 19-stupňová PowerShift a pri veľkých modeloch aj plynulá IVT.
  7020: >-
    Motory PowerTech s elektronickým vstrekovaním (7920 8,1 l), prevodovky AutoQuad, PowerShift a plynulá AutoPowr IVT, ktorú John Deere ponúkal už pri rade 7010.
  7030: >-
    Emisná norma Tier 3, motor PowerTech Plus 6,8 L s 24-ventilovou hlavou. Kabína Premium s vetraním, klimatizáciou a elektronicky ovládaným sedadlom.
  7r: >-
    Row-crop rad 7R (2011–2019): prvá generácia 7200R–7280R (2011–2013), potom 7210R–7310R. Motory PowerTech 6,8 a 9,0 l, prevodovky PowerQuad, AutoQuad, od modelového roku 2014 e23 PowerShift, a plynulá AutoPowr IVT. Od modelového roku 2020 ho nahradil rad 7R 210–7R 350.
  7r-gen3: >-
    Súčasný rad 7R (od modelového roku 2020, 7R 350 od roku 2021): 7R 210–270 s motorom PowerTech PSS 6,8 l, 7R 290–350 s motorom PowerTech PVS 9,0 l, prevodovky e23 PowerShift alebo plynulá AutoPowr IVT, kabína CommandView 4. Výkony po 20 k; v Európe sa ponúkajú 7R 270 až 7R 350.
  8000: >-
    Legendárna „veľká zelená". Prvý row-crop nad 200 koní s modernou kabínou, elektronicky riadenou hydraulikou a PowerShift 16/4.
  8010: >-
    Motor PowerTech 8,1 L, prevodovka PowerShift 16/4, kabína ComfortGard Plus.
  8020: >-
    Nová generácia s motorom PowerTech Plus, voliteľná prevodovka IVT AutoPowr, aktívne odpruženie prednej nápravy ILS.
  8030: >-
    Emisná norma Tier 3 (PowerTech Plus 9,0 L), automatické riadenie **AutoTrac**, displej GreenStar 2 1800/2630, kabína CommandView, odpruženie prednej nápravy TLS Plus, pásová verzia 8030T (8130T/8230T/8330T/8430T/8530T).
  8r-gen1: >-
    Prvá generácia 8R s pásovou verziou 8RT v troch sadách modelov: modelový rok 2010 (8225R–8345R), 2011–2013 Interim Tier 4 (8235R–8360R) a 2014–2019 Final Tier 4 (8245R–8370R, od 2016 aj 8400R). Motory PowerTech 9,0 l, prevodovky PowerShift, od 2014 e23, a plynulá AutoPowr IVT.
  8r-gen2: >-
    Úplne nová platforma, motor PowerTech PSS 9,0 L, prevodovka e23 / IVT / DirectDrive, kabína CommandView 4, pásové verzie 8RT a kolesové 8R. AutoPath a autonómne riadenie (CES 2022).
  8rx-4track: >-
    Štvorpásová verzia radu 8R (od modelového roku 2020): namiesto každého kolesa samostatný gumový pás pre nízky tlak na pôdu a vysoký ťah. Zdieľa motor PowerTech PSX 9,0 l (od modelového roku 2027 John Deere JD9) a kabínu s radom 8R, prevodovky e23 alebo AutoPowr IVT.
  9000: >-
    Kĺbové traktory 4WD pre rozsiahle farmy. Motory PowerTech 8,1 l (9100), 10,5 l (9200) a 12,5 l (9300, 9400), prevodovka PowerShift 12/3.
  9020: >-
    Kĺbové traktory s motormi PowerTech 8,1 l (9120) a 12,5 l, voliteľný pásový podvozok 9020T, GreenStar 2. Model 9620 pribudol s modelovým rokom 2004.
  9030: >-
    Kĺbové traktory s motormi PowerTech 9,0 l (9230) a 13,5 l, AutoTrac a GreenStar 3.
  9r-gen1: >-
    Prvá generácia 9R/9RT. V rokoch 2012–2014 modely 9360R–9560R, od modelového roku 2015 9370R–9620R. Motory John Deere 9,0 l (9370R) a 13,5 l (9420R–9520R), Cummins QSX15 len pri 9570R a 9620R. Pásové verzie 9RT (dva pásy) a od roku 2016 9RX (štyri pásy).
  9r-gen2: >-
    Súčasná generácia 9R/9RT/9RX (od modelového roku 2022). Motory John Deere JD14 (13,6 l) s prevodovkou e18 PowerShift a od modelového roku 2025 JD18 (18,0 l) s prevodovkou e21 PowerShift, ktorý poháňa 9RX 710, 770 a 830. Pásové verzie 9RT (dva pásy) a 9RX (štyri pásy).
  9rx:
    name: "9RX 4-track (2015–2021, samostatná séria)"
    description: >-
      Prvá generácia kĺbového štvorpásového 9RX, predstavená v auguste 2015 (dodávky od jari 2016): modely 9470RX a 9520RX s motorom John Deere 13,5 l, 9570RX a 9620RX s motorom Cummins QSX15, prevodovka e18 PowerShift. Od modelového roku 2022 prešla 9RX do novej generácie 9R.
  cts: >-
    Hybridná technológia CTS (Cylinder Tine Separator) — kombinácia konvenčného bubna a dvoch rotorov. Nástupca radu 9000/9500/9600.
  9000-kombajn: >-
    Konvenčný bubon-slamník, typický americký ťažký rad.
  wts: >-
    Európska generácia kombajnov, konvenčný systém separácie s vylepšenými slamníkmi a rotačným doseparátorom.
  9000-sts: >-
    Revolučná single-rotorová technológia STS (Single Tine Separator). Od 9660 STS po 9880i STS.
  s-series: >-
    Prémiový rad single-rotorových kombajnov. Motor JD PowerTech / Cummins 13,5 L, hydrostatický pohon, ActiveYield, automatika HarvestSmart, displej Gen 4.
  t-series: >-
    Európsky konvenčný kombajn so slamníkmi (Walker). Motor JD PowerTech 6,8/9,0/13,5 L, prevodovka ProDrive, päťslamník.
  w-series: >-
    Ekonomický európsky rad s konvenčnou separáciou, 4 až 5 slamníkmi, motor JD PowerTech 6,8 L.
  x-series: >-
    Revolučný dvojrotorový systém Dual Separator. Najväčšia priepustnosť a najnižšie straty v triede. Motor JD PowerTech 13,6 L, AutoMaintain, HarvestVision.
  6000-rezacky: >-
    Prvé moderné samohybné rezačky John Deere vyrábané v Zweibrückene (Nemecko). Po akvizícii nemeckej firmy Hesston/Heesemann a know-how o krmovinách. Motory PowerTech 8,1–12,5 L, mechanický pohon valcov, klasický kovový vyhadzovač.
  7000-rezacky: >-
    Modernizácia s elektronickým riadením žacieho ústrojenstva, automatické nastavenie dĺžky rezanky AutoLOC a vylepšený systém KernelStar na drvenie zŕn kukurice. Motor PowerTech Tier 3, kabína ComfortGard.
  7050-rezacky: >-
    Generácia 7050 priniesla AutoLOC II, senzor HarvestLab NIR na analýzu sušiny a živín v reálnom čase a integráciu s GreenStar 2. Motory Tier 3, výkony 360 až 625 koní.
  8000-rezacky: >-
    Generácia 8000 priniesla úplne nový priechod stroja — žacie ústrojenstvo o 25 % väčšie, nový systém KernelStar 2 (drvič zrna), HarvestLab 3000 a integrácia s JDLink. Motor JD PowerTech 9,0 / 13,5 / 19,0 L Tier 4.
  9000-rezacky: >-
    Vlajkový rad samohybných rezačiek. **9900** s motorom 24,2 L Liebherr a výkonom nad 1 000 koní je najvýkonnejšia samohybná rezačka na svete. AutoLOC III, KernelStar 3, HarvestLab 3000, plne integrovaný AutoTrac, kamerové systémy a JDLink Connect.
  4730-postrikovace: >-
    Prvá moderná generácia samohybných postrekovačov John Deere pre európsky trh. Vyrábané vo Waterloo (USA) a v Horste (Holandsko). Motor PowerTech, štyri kolesá s nezávislým pohonom (HydroHandle), nádrž 1 500–4 540 l. Modely 4730/4830/4930 poskytli výkonový rozsah od 200 do 360 koní.
  r-series-postrikovace: >-
    Aktuálna generácia samohybných postrekovačov. Modely R4030/R4040i/R4045i a americký rad R4044/R4060/R4150. Motor JD PowerTech, BoomTrac Pro (automatická regulácia výšky ramien), individuálne spínanie trysiek (ExactApply, See & Spray), AutoTrac, integrácia s Operations Center.

models:
  john-deere-5010: >-
    Prvý John Deere, ktorý oficiálne prekročil 100 koní. Veľký terénny traktor určený pre západné pláne USA.
  john-deere-4020: >-
    Ikona americkej poľnohospodárskej mechanizácie 60. rokov. Prevodovka Power Shift s 8 rýchlosťami pod záťažou bola revolučná. Jeden z najcennejších zberateľských traktorov John Deere.
  john-deere-4430: >-
    Bestseller éry Sound-Gard. Prevodovka Quad-Range alebo Power Shift, turbomotor 125 k. Vyrobených vyše 95 000 kusov.
  john-deere-4440: >-
    Najikonickejší John Deere 70. a 80. rokov. Power Shift, Sound-Gard II, turbo 7,6 L. Synonymum spoľahlivosti.
  john-deere-8r-410: >-
    Vlajkový model. Kabína CommandView 4, AutoPath, hydraulika 435 l/min, zadný záves 12 000 kg. IVT Boost do 428 k.
  john-deere-8rx-410: >-
    Vlajkový štvropásový model. Rovnaký motor ako 8R 410, štyri gumové húsenice pre maximálny záber a minimálne utláčanie pôdy.
  john-deere-fh-7950: >-
    Najvýkonnejšia samohybná rezačka svojej doby — vyše 800 koní z motora 19,0 L.
  john-deere-fh-9900: >-
    Vlajková samohybná rezačka. Motor V12 24,2 L Liebherr, záber až 12 riadkov, priepustnosť vyše 400 t/h zelenej hmoty. Symbol sily v európskom poľnohospodárstve.
  john-deere-4730: >-
    Nádrž 3 000 l, ramená 24/27/28 m.
  john-deere-4830: >-
    Nádrž 3 800 l, ramená 27/30 m.
  john-deere-4930: >-
    Nádrž 4 540 l, ramená 36 m.
  john-deere-4940: >-
    Tier 4 Final. Nádrž 4 540 l.
  john-deere-r4030: >-
    Nádrž 3 000 l, ramená 24–28 m.
  john-deere-r4040i: >-
    Nádrž 4 000 l, ramená 27–36 m, izolovaný systém.
  john-deere-r4045i: >-
    Nádrž 4 500 l, ramená 30–40 m, ExactApply.
  john-deere-r4150i: >-
    Vlajkový model. Nádrž 5 700 l, ramená 36–40 m, See & Spray Premium.
