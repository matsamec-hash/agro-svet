# SK overlay (popisy/polia) na cs štruktúru. AI draft+editor, review nutný.

country: "Nemecko / Taliansko"
description: >-
  Nemecká značka s dlhou tradíciou od roku 1864 (Deutz), fúzia s Fahr 1969. Súčasť SDF Group (Same Deutz-Fahr) s talianskou zložkou. Traktory vyrábané v Lauingene (Nemecko) a Treviglio (Taliansko). Výrazné zelené sfarbenie. Vlajkovým radom je 9 Series.

categories:
  traktory: "Traktory"
  kombajny: "Kombajny"

series:
  06-series: >-
    Rad zelených traktorov Deutz (Klöckner-Humboldt-Deutz) z konca 60. a zo 70. rokov so vzduchom chladenými motormi Deutz radu 912. Modely D 4006 až D 13006 pokrývali výkon zhruba 35–120 k; vrcholný D 13006 mal preplňovaný šesťvalec BF6L 912. Typy D 5206 až D 7206 prišli v roku 1974.
  dx: >-
    Historická klasika Deutz-Fahr so vzduchom chladenými motormi Deutz F3L / F4L / F6L 912 a 913. Ikonická rada rozdelená do tried DX 3 (kompaktný 3-valec), DX 4 (4-valec), DX 6 (6-valec) a vlajkových DX 7/8. V roku 1983 modernizácia s vyšším výkonom.
  agrostar: >-
    Predchodca rady Agrotron. Modernizovaný nástupca rady DX so vzduchom chladenými motormi Deutz. Reprezentatívna „hviezda" 90. rokov s charakteristickým dizajnom a otvorenou kabínou StarCab.
  agroxtra: >-
    Rad AgroXtra nadväzoval na DX 4 a AgroPrimu. Štvorvalce 4.47 a 4.57 mali preplňovaný vzduchom chladený motor Deutz BF4L 913 (4,1 l), šesťvalce 6.07 a 6.17 nasávacie motory F6L 912/913.
  agrotron-legacy: >-
    Ikonická generácia Agrotron. **MK1** (1995–1997) mala revolučnú presklenú kabínu a motor Deutz s problematickou prevodovkou ZF Eccom. **MK2** (1997–2000) odstránila problémy so spoľahlivosťou. **MK3** (2000–2003) priniesla modely 80–230 a v roku **2001 prvý Agrotron TTV** s CVT (plynulá variátorová).
  agroplus: >-
    Kompaktné univerzálne traktory. Typy 60 a 70 so vzduchom chladenými motormi Deutz a typy 75, 85, 95 a 100 s kvapalinou chladenými motormi Deutz 1012 sa vyrábali súbežne zhruba v rokoch 1997–2005; Agroplus 100 mal šesťvalec. V rokoch 2005–2007 ponuku doplnili úzke vyhotovenia Agroplus S 70 až S 100 pre vinice a sady.
  agrofarm: >-
    Univerzálne traktory pre menšie podniky. Agrofarm 85 a 100 (2007–2008) s motormi Deutz, potom Agrofarm 410, 420 a 430 a plynulé Agrofarm TTV 420 a TTV 430 (od 2008). Rad Agrofarm G (G 85, G 100, G 115, G 410, G 430) má motory SDF 1000.4 s objemom 4,0 l.
  agrotron-m: >-
    Prémiová stredne veľká rada. M410/M420 sú 4-valcové, M600–M650 sú 6-valcové s motormi Deutz TCD 2012 / TCD 2013 a vstrekovaním DCR (Deutz Common Rail). Dostupné aj vo variante Profiline.
  agrotron-k: >-
    Nástupca najmenších Agrotronov MK3 s kvapalinou chladenými motormi Deutz 2012: štvorvalce (K90, K100, K120, K410, K420, K430) aj šesťvalce (K110, K610). Verzia Profiline s automatickým radením powershift, load-sensing hydraulikou a manažmentom úvrate.
  5g: >-
    Riadok spája exportný rad 5G (5090.4 G, 5100 G, 5110 G) s motormi SDF, ktorý Deutz-Fahr ponúka mimo EÚ, a modely 5120 (2013–2016) a 5125 (od 2016) z európskeho radu 5 s motorom Deutz 3,6 l.
  6g: >-
    Rad 6 (Agrotron 6): štvorvalcový 6140 od roku 2013 a šesťvalce 6155–6215 s motorom Deutz TCD 6.1 z nového radu 6 predstaveného v júli 2016 (156–226 k), prevodovky RCshift alebo plynulá TTV. Exportný rad 6G (6155 G–6205 G) je iný. Dnes Deutz-Fahr ponúka nástupcov 6160–6230 a rady 6.4 a 6C.
  7: >-
    Prémiový rad s motorom Deutz TCD 6.1 a plynulou prevodovkou TTV. Dizajn Giugiaro. Od júla 2016 ho tvoria 7230 TTV a 7250 TTV.
  8: >-
    8280 TTV (od roku 2020) s motorom Deutz TTCD 6.1 s dvojitým preplňovaním a prevodovkou TTV. Nový rad 8 predstavený v novembri 2025 (8310 TTV a 8340 TTV) má motor FPT N67 s objemom 6,7 l a kabínu SigmaVision.
  9: >-
    Vlajkový rad Deutz-Fahr, predstavený na Agritechnice 2013 a vyrábaný od roku 2015 v Lauingene. Motor Deutz TTCD 7.8 s dvojstupňovým preplňovaním, plynulá prevodovka TTV, maximálny výkon 295–336 k. Dizajn Giugiaro.
  9-warrior: >-
    Špeciálna edícia Warrior vlajkovej rady 9. LED osvetľovací paket 4. generácie, pohodlné sedadlo Evolution Active, automatická klimatizácia, podložka DEUTZ-FAHR v čiernej farbe. Dostupné aj v klasickej zelenej farbe.
  6c: >-
    Kompaktná 4-valcová rada 6 Series s motormi Stage V a kabínou TopVision. Tri varianty prevodovky: Powershift 3-stupňový, RVshift full-powershift 20F/16R alebo CVT TTV. Load-sensing hydraulika 120 l/min, nosnosť zadného zdvíhača 7 000 kg.
  5d: >-
    Základný rad s trojvalcovým motorom FARMotion 35 a mechanickou prevodovkou 15+15 alebo 30+15, max. 40 km/h. Výkony v katalógu zodpovedajú verzii z roku 2018; od roku 2021 sa vyrába verzia Stage V s max. výkonom 66–102 k.
  m-series-old: >-
    Staršia generácia klasických konvenčných kombajnov pred modernizáciou na Topliner. Vzduchom chladené diesely Deutz F5L / F6L 912 a 913. Modely M1080, M2385, M2480, M2580, M2680, M2685, M2780 a M34 / M36 pre veľké hospodárstva.
  starliner: >-
    Stredné konvenčné kombajny Starliner. Klasické 5-klávesové slamové drviče s priamym remeňovým pohonom. Paralelná generácia k Topliner pre nižšiu výkonovú triedu.
  htc-old: >-
    Veľké konvenčné kombajny so systémom APS (Advanced Propulsion System) — dvojitý urýchľovací bubon a dlhé vytriasadlá. Spomedzi modelov 5690 HTS a 6090 HTS bol najvýkonnejší 7545 RTS s rotačnou separáciou.
  topliner: >-
    Legendárne konvenčné kombajny. V 90. rokoch dominantné na stredoeurópskom trhu.
  c-series-old: >-
    Stredné a veľké konvenčné kombajny. Motor MTU/Deutz, rotačný separátor.
  c-series-new: >-
    Nová generácia kombajnov. Motor Deutz TCD 6.1 L a 12.0 L, hybridný systém pri vlajkovom C9000 (APS + rotor).
