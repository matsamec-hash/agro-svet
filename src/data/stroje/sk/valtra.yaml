# SK overlay (popisy/polia) na cs štruktúru. AI draft+editor, review nutný.

country: "Fínsko"
description: >-
  Fínsky výrobca traktorov s dlhou tradíciou (predtým Valmet). Súčasť koncernu AGCO od roku 2004. Známy robustnou konštrukciou pre severské podmienky, reverzným systémom TwinTrac (kabína s otočným sedadlom pre prácu zozadu) a personalizáciou — každý traktor sa vyrába na mieru podľa požiadaviek zákazníka. Kombajny nevyrába.

categories:
  traktory: "Traktory"

series:
  valmet-6000-8000: >-
    Traktory Valmet / Valtra Valmet: rad Mezzo 6000 (od 1991) a „päťdesiatkové“ modely 8000 (1995–2004); 6200 až 6400 sa vyrábali ešte v rokoch 2005–2007. Motory Valmet / Sisu 4- a 6-valec, prevodovka 12F/12R synchro, voliteľne Delta Powershift 36F/36R.
  hitech: >-
    Štvorvalcové traktory HiTech 6250, 6350, 6550, 6650, 6750 a 6850 (zhruba 1998–2006) s motormi Sisu 4,4 l a prevodovkou HiTech 36F/36R s radením pod záťažou. Predávali sa pod značkou Valtra Valmet aj Valtra. V tomto výpise sú aj Valmet 6600 a 6800 z radu Mezzo, ktoré verziu HiTech nemali.
  n-gen1: >-
    Prvá generácia N Series (2005): N91, N101, N111, N111e, N121 a N141, od 2007 aj N82 a N92. Motory Sisu / AGCO Power 4,4 l, prevodovky HiTech a od 2008/09 Versu a plynulá Direct (N122, N142). Od januára 2012 ju nahradila 3. generácia N93–N163.
  n-gen2:
    name: "N Series Mk3 / 4. generácia (2014–2021)"
    description: >-
      4. generácia N Series (N4, 2014/2015–2021): N104, N114e, N124, N134, N154e a N174. Motory AGCO Power 4,4 a 4,9 l, verzie HiTech, Active, Versu a plynulá Direct, strešné okno SkyView na prácu s čelným nakladačom.
  n-gen3:
    name: "N Series Mk4 / 5. generácia (2021–súčasnosť)"
    description: >-
      5. generácia N Series (N5, od 14. 4. 2021): N135, N155e a N175. Motor AGCO Power 4,9 l Stage V, verzie Active, Versu a plynulá Direct, kabína SmartTouch.
  t-gen1: >-
    Súhrnný riadok troch generácií T Series: T130–T190 (2003–2007/08), T121–T191 (2007–2012, od 2009 aj plynulá Direct) a T213 (2012–2014). Motory Sisu / AGCO Power 6-valec 6,6 a 7,4 l, prevodovky HiTech, HiTech 5 a Versu.
  t-gen2: >-
    4. generácia T Series (T4, jeseň 2014 – apríl 2021): T144 a T154 s motorom AGCO Power 6,6 l, väčšie modely 7,4 l; prevodovky HiTech, Active, Versu a plynulá Direct, od 2017 kabína SmartTouch. Od apríla 2021 ju nahradila 5. generácia T145–T255, dnes sa vyrába 6. generácia T146–T236.
  s-gen1: >-
    S Series S232–S352 (2009–2011): motor AGCO Power 8,4 l, prevodovka AGCO Variable Transmission (AVT), reverzné stanovište TwinTrac. Od roku 2011 ju nahradili S233–S353.
  s-gen5: >-
    4. generácia S Series (S4): S274–S374 od prelomu 2013/2014, S394 od 2017. Motor AGCO Power 8,4 l, prevodovka AGCO Variable Transmission (AVT), kabína SmartTouch. V novembri 2023 ju nahradila 6. generácia S286–S416.
  a-series: >-
    4. generácia A Series (A4, 2017–2021) pre menšie farmy a komunálne nasadenie: A74–A94 s trojvalcom AGCO Power 3,3 l, A104–A134 so štvorvalcom 4,4 l. V januári 2021 ju nahradila 5. generácia A75–A135 o 5 k silnejšia.
  g-series: >-
    Stredná trieda medzi A a N. Motor AGCO Power 4,4 L Stage V, kompaktné rozmery s modernou kabínou SmartTouch (voliteľná) alebo Classic.
  q-series: >-
    Rad medzi T a S, predstavený 2. 9. 2022. Šesťvalec AGCO Power 7,4 l Stage V, plynulá prevodovka, kabína SmartTouch. Modely Q225 až Q305.
