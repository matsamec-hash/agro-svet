# UK переклад (описи/поля) на cs структуру. AI чернетка + редактор, потрібна перевірка.

country: "США"
description: >-
  Найбільший виробник сільськогосподарської техніки у світі. Американська компанія із зеленими тракторами та жовтою зіркою домінує на ринку Північної Америки, Європи та Азії.

categories:
  traktory: "Трактори"
  kombajny: "Комбайни"
  rezacky: "Самохідні косарки-подрібнювачі"
  postrikovace: "Самохідні обприскувачі"

series:
  new-generation-10-series: >-
    Серія, що завершила еру двоциліндрових двигунів John Deere («Johnny Popper»). Прем'єра 30 серпня 1960 року в Далласі («Deere Day in Dallas») принесла багатоциліндрові двигуни, трансмісію Synchro-Range і нову гідравліку. Трактори 1010–5010 випускалися в 1960–1965 роках, потім їх замінила серія 20.
  20-series-1963: >-
    Наступник серії 10. Ключова модель 4020 (1963–1972) належить до найпродаваніших тракторів John Deere, виготовлено понад 184 000 штук; пропонувала трансмісію Power Shift з перемиканням під навантаженням і дизельний шестициліндровий двигун 6,6 л. У Мангеймі John Deere виробляє з часу придбання фірми Heinrich Lanz у 1956 році. Наведені потужності — це потужність на ВВП.
  30-series-sound-gard: >-
    Покоління, що визначило комфорт у сільському господарстві. У вересні 1972 року John Deere представив революційну кабіну **Sound-Gard** — першу інтегровану звукоізольовану кабіну в сільськогосподарській техніці з кондиціонером, опаленням і гасінням вібрацій (макс. 80 дБ(A) всередині). Прозвана «Generation II». Моделі 4030/4230/4430/4630 замінили успішні ряди 4020/4320/4520/4620 і встановили нові стандарти ергономіки для всієї галузі.
  40-series-iron-horse: >-
    Модернізація кабіни Sound-Gard. Моделі 4040/4240/4440/4640/4840 принесли економніші двигуни, покращену гідравліку й трансмісію Quad-Range з частковим перемиканням під навантаженням. Наведені потужності — це потужність на ВВП, як її тоді вказувала John Deere; 4840 мав 180 к.с. на ВВП.
  50-series-1982: >-
    Продовження серії 40 з акцентом на економність. Моделі 4050/4250/4450/4650/4850 мали потужність двигуна приблизно 130–215 к.с. (DIN), атмосферний або турбований шестициліндровий двигун 7,6 л і трансмісії Quad-Range або Power Shift.
  55-series-1988: >-
    Остання серія великих row-crop тракторів John Deere перед серією 7000. Моделі 4055/4255/4455/4555/4755/4955 мали турбований шестициліндровий двигун 7,6 л; флагман 4955 мав потужність двигуна 230 к.с. (DIN), 200 к.с. на ВВП.
  5000: >-
    Утилітарні трактори 5200, 5300, 5400 і 5500 із заводу John Deere в Огасті (Джорджія, США), потужність двигуна приблизно 45–85 к.с. Проста концепція для менших господарств і комунальних робіт; європейські версії виготовляла фірма Carraro в Італії.
  5010-5020-5030: >-
    Зведений рядок кількох поколінь утилітарних тракторів John Deere (серії 5015, 5020 і 5M). Двигуни PowerTech, синхронізовані трансмісії.
  5m: >-
    Універсальна серія 5M (з 2009 року) з двигунами PowerTech і електронно керованою гідравлікою. З 2023 (США) і 2024 (Європа) модельного року до неї входять 5075M, 5095M, 5105M, 5120M і 5130M.
  5r: >-
    Преміальна утилітарна серія у двох поколіннях: 5080R/5090R/5100R (2008–2013) і 5090R/5100R/5115R/5125R (2016–2022). Трансмісії CommandQuad або безступінчаста AutoPowr, керування CommandARM.
  6000: >-
    Серія тракторів середнього класу з Мангейма: чотирициліндрові 6100–6400 (з 1992, двигуни 3,9 і 4,5 л) і шестициліндрові 6506, 6600, 6800 і 6900 (з 1994, двигуни 5,9 і 6,8 л). Трансмісія PowrQuad, опційна підвіска переднього моста Triple Link Suspension.
  6010: >-
    Наступник ряду 6000, двигуни PowerTech, трансмісія PowrQuad Plus 16x16. Розширений вибір від 80 до 150 коней.
  6020: >-
    Цілком нова платформа. Кабіна ComfortGard, двигун PowerTech Plus з common-rail, опційна трансмісія AutoQuad Plus і гідравліка з виявленням навантаження (load sensing).
  6030-premium: >-
    Преміальний ряд з технологією AutoPowr (CVT), повна підвіска передньої осі TLS, кабіна Premium та інтеграція з GreenStar 2.
  6m: >-
    Універсальна серія для змішаних господарств у трьох поколіннях (2012–2016, 2016–2019, 2019–2024). Двигуни PowerTech 4,5 і 6,8 л, трансмісії AutoQuad, CommandQuad і AutoPowr. З 2024 року її замінили моделі 6M 95–6M 250.
  6r: >-
    Преміальна універсальна серія у двох поколіннях: 2012–2015 з двигунами PowerTech PVX (Stage IIIB) і 2015–2021 (Stage IV). Трансмісії AutoQuad, DirectDrive і безступінчаста AutoPowr IVT, джойстик CommandPRO, підвіска TLS Plus. З листопада 2021 року її замінили моделі 6R 110–6R 250.
  6r-gen3: >-
    Поточне покоління 6R (з 2022 модельного року) з Мангейма. Двигуни PowerTech 4,5 л (4-циліндрові, до 6R 150) і 6,8 л (6-циліндрові) Stage V, трансмісії AutoQuad, DirectDrive і безступінчаста AutoPowr, кабіна CommandView 4. На 2027 модельний рік John Deere анонсував нові великі моделі 6R 180–6R 260.
  7000: >-
    Row-crop трактори 7600, 7700 і 7800 із заводу Waterloo (1992–1997), потужність двигуна 130–170 к.с. Попередники серій 7010 і 7020.
  7010: >-
    Row-crop трактори другого покоління: двигуни PowerTech 6,8 л, у 7710 і 7810 — 8,1 л, трансмісії PowrQuad Plus, AutoQuad, 19-ступінчаста PowerShift, а у великих моделях і безступінчаста IVT.
  7020: >-
    Двигуни PowerTech з електронним вприскуванням (7920 — 8,1 л), трансмісії AutoQuad, PowerShift і безступінчаста AutoPowr IVT, яку John Deere пропонував ще в серії 7010.
  7030: >-
    Екологічна норма Tier 3, двигун PowerTech Plus 6,8 L з 24-клапанною головкою. Кабіна Premium з вентиляцією, кондиціонером та електронно керованим сидінням.
  7r: >-
    Row-crop серія 7R (2011–2019): перше покоління 7200R–7280R (2011–2013), потім 7210R–7310R. Двигуни PowerTech 6,8 і 9,0 л, трансмісії PowerQuad, AutoQuad, з 2014 модельного року e23 PowerShift, а також безступінчаста AutoPowr IVT. З 2020 модельного року її замінила серія 7R 210–7R 350.
  7r-gen3: >-
    Поточна серія 7R (з 2020 модельного року, 7R 350 з 2021): 7R 210–270 з двигуном PowerTech PSS 6,8 л, 7R 290–350 з двигуном PowerTech PVS 9,0 л, трансмісії e23 PowerShift або безступінчаста AutoPowr IVT, кабіна CommandView 4. Кроки потужності по 20 к.с.; у Європі пропонуються 7R 270–7R 350.
  8000: >-
    Легендарна «велика зелена». Перший row-crop понад 200 коней із сучасною кабіною, електронно керованою гідравлікою та PowerShift 16/4.
  8010: >-
    Двигун PowerTech 8,1 L, трансмісія PowerShift 16/4, кабіна ComfortGard Plus.
  8020: >-
    Нове покоління з двигуном PowerTech Plus, опційна трансмісія IVT AutoPowr, активна підвіска передньої осі ILS.
  8030: >-
    Екологічна норма Tier 3 (PowerTech Plus 9,0 L), автоматичне керування **AutoTrac**, дисплей GreenStar 2 1800/2630, кабіна CommandView, підвіска передньої осі TLS Plus, гусенична версія 8030T (8130T/8230T/8330T/8430T/8530T).
  8r-gen1: >-
    Перше покоління 8R з гусеничною версією 8RT у трьох наборах моделей: 2010 модельний рік (8225R–8345R), 2011–2013 Interim Tier 4 (8235R–8360R) і 2014–2019 Final Tier 4 (8245R–8370R, з 2016 і 8400R). Двигуни PowerTech 9,0 л, трансмісії PowerShift, з 2014 e23, і безступінчаста AutoPowr IVT.
  8r-gen2: >-
    Цілком нова платформа, двигун PowerTech PSS 9,0 L, трансмісія e23 / IVT / DirectDrive, кабіна CommandView 4, гусеничні версії 8RT і колісні 8R. AutoPath і автономне керування (CES 2022).
  8rx-4track: >-
    Чотиригусенична версія серії 8R (з 2020 модельного року): замість кожного колеса окрема гумова гусениця для низького тиску на ґрунт і високої тяги. Двигун PowerTech PSX 9,0 л (з 2027 модельного року John Deere JD9) і кабіна як у 8R, трансмісії e23 або AutoPowr IVT.
  9000: >-
    Шарнірно-зчленовані трактори 4WD для великих господарств. Двигуни PowerTech 8,1 л (9100), 10,5 л (9200) і 12,5 л (9300, 9400), трансмісія PowerShift 12/3.
  9020: >-
    Шарнірно-зчленовані трактори з двигунами PowerTech 8,1 л (9120) і 12,5 л, опційне гусеничне шасі 9020T, GreenStar 2. Модель 9620 додали з 2004 модельного року.
  9030: >-
    Шарнірно-зчленовані трактори з двигунами PowerTech 9,0 л (9230) і 13,5 л, AutoTrac і GreenStar 3.
  9r-gen1: >-
    Перше покоління 9R/9RT. У 2012–2014 роках моделі 9360R–9560R, з 2015 модельного року 9370R–9620R. Двигуни John Deere 9,0 л (9370R) і 13,5 л (9420R–9520R), Cummins QSX15 лише у 9570R і 9620R. Гусеничні версії 9RT (дві гусениці) і з 2016 року 9RX (чотири гусениці).
  9r-gen2: >-
    Поточне покоління 9R/9RT/9RX (з 2022 модельного року). Двигуни John Deere JD14 (13,6 л) з трансмісією e18 PowerShift, а з 2025 модельного року JD18 (18,0 л) з трансмісією e21 PowerShift, який рухає 9RX 710, 770 і 830. Гусеничні версії 9RT (дві гусениці) і 9RX (чотири гусениці).
  9rx:
    name: "9RX 4-track (2015–2021, окремий ряд)"
    description: >-
      Перше покоління шарнірно-зчленованого чотиригусеничного 9RX, представлене в серпні 2015 року (поставки з весни 2016): моделі 9470RX і 9520RX з двигуном John Deere 13,5 л, 9570RX і 9620RX з двигуном Cummins QSX15, трансмісія e18 PowerShift. З 2022 модельного року 9RX перейшов у нове покоління 9R.
  cts: >-
    Гібридна технологія CTS (Cylinder Tine Separator) — поєднання конвенційного барабана й двох роторів. Наступник ряду 9000/9500/9600.
  9000-kombajn: >-
    Конвенційний барабан-соломотряс, типовий американський важкий ряд.
  wts: >-
    Європейське покоління комбайнів, конвенційна система сепарації з покращеними соломотрясами та ротаційним досепаратором.
  9000-sts: >-
    Революційна однороторна технологія STS (Single Tine Separator). Від 9660 STS до 9880i STS.
  s-series: >-
    Преміальний ряд однороторних комбайнів. Двигун JD PowerTech / Cummins 13,5 L, гідростатичний привід, ActiveYield, автоматика HarvestSmart, дисплей Gen 4.
  t-series: >-
    Європейський конвенційний комбайн із соломотрясами (Walker). Двигун JD PowerTech 6,8/9,0/13,5 L, трансмісія ProDrive, п'ятиклавішний соломотряс.
  w-series: >-
    Економічний європейський ряд з конвенційною сепарацією, 4 до 5 соломотрясами, двигун JD PowerTech 6,8 L.
  x-series: >-
    Революційна двороторна система Dual Separator. Найбільша пропускна здатність і найнижчі втрати в класі. Двигун JD PowerTech 13,6 L, AutoMaintain, HarvestVision.
  6000-rezacky: >-
    Перші сучасні самохідні косарки-подрібнювачі John Deere, виготовлені у Цвайбрюкені (Німеччина). Після придбання німецької фірми Hesston/Heesemann і ноу-хау щодо кормів. Двигуни PowerTech 8,1–12,5 L, механічний привід вальців, класичний металевий викидач.
  7000-rezacky: >-
    Модернізація з електронним керуванням жниварки, автоматичне налаштування довжини різання AutoLOC і покращена система KernelStar для подрібнення зерен кукурудзи. Двигун PowerTech Tier 3, кабіна ComfortGard.
  7050-rezacky: >-
    Покоління 7050 принесло AutoLOC II, датчик HarvestLab NIR для аналізу сухої речовини й поживних речовин у реальному часі та інтеграцію з GreenStar 2. Двигуни Tier 3, потужності 360 до 625 коней.
  8000-rezacky: >-
    Покоління 8000 принесло цілком новий прохід машини — жниварка на 25 % більша, нова система KernelStar 2 (подрібнювач зерна), HarvestLab 3000 та інтеграція з JDLink. Двигун JD PowerTech 9,0 / 13,5 / 19,0 L Tier 4.
  9000-rezacky: >-
    Флагманський ряд самохідних косарок-подрібнювачів. **9900** з двигуном 24,2 L Liebherr і потужністю понад 1 000 коней є найпотужнішою самохідною косаркою-подрібнювачем у світі. AutoLOC III, KernelStar 3, HarvestLab 3000, повністю інтегрований AutoTrac, камерні системи та JDLink Connect.
  4730-postrikovace: >-
    Перше сучасне покоління самохідних обприскувачів John Deere для європейського ринку. Виготовлені у Ватерлоо (США) та в Горсті (Нідерланди). Двигун PowerTech, чотири колеса з незалежним приводом (HydroHandle), бак 1 500–4 540 л. Моделі 4730/4830/4930 забезпечили діапазон потужності від 200 до 360 коней.
  r-series-postrikovace: >-
    Актуальне покоління самохідних обприскувачів. Моделі R4030/R4040i/R4045i та американський ряд R4044/R4060/R4150. Двигун JD PowerTech, BoomTrac Pro (автоматичне регулювання висоти штанг), індивідуальне перемикання форсунок (ExactApply, See & Spray), AutoTrac, інтеграція з Operations Center.

models:
  john-deere-5010: >-
    Перший John Deere, що офіційно перевищив 100 коней. Великий польовий трактор, призначений для західних рівнин США.
  john-deere-4020: >-
    Ікона американської сільськогосподарської механізації 60-х років. Трансмісія Power Shift з 8 швидкостями під навантаженням була революційною. Один із найцінніших колекційних тракторів John Deere.
  john-deere-4430: >-
    Бестселер ери Sound-Gard. Трансмісія Quad-Range або Power Shift, турбодвигун 125 к. Вироблено понад 95 000 одиниць.
  john-deere-4440: >-
    Найкультовіший John Deere 70-х і 80-х років. Power Shift, Sound-Gard II, турбо 7,6 L. Синонім надійності.
  john-deere-8r-410: >-
    Флагманська модель. Кабіна CommandView 4, AutoPath, гідравліка 435 л/хв, задня навіска 12 000 кг. IVT Boost до 428 к.
  john-deere-8rx-410: >-
    Флагманська чотиригусенична модель. Той самий двигун, що й 8R 410, чотири гумові гусениці для максимального зчеплення та мінімального ущільнення ґрунту.
  john-deere-fh-7950: >-
    Найпотужніша самохідна косарка-подрібнювач свого часу — понад 800 коней із двигуна 19,0 L.
  john-deere-fh-9900: >-
    Флагманська самохідна косарка-подрібнювач. Двигун V12 24,2 L Liebherr, захват до 12 рядків, пропускна здатність понад 400 т/год зеленої маси. Символ сили в європейському сільському господарстві.
  john-deere-4730: >-
    Бак 3 000 л, штанги 24/27/28 м.
  john-deere-4830: >-
    Бак 3 800 л, штанги 27/30 м.
  john-deere-4930: >-
    Бак 4 540 л, штанги 36 м.
  john-deere-4940: >-
    Tier 4 Final. Бак 4 540 л.
  john-deere-r4030: >-
    Бак 3 000 л, штанги 24–28 м.
  john-deere-r4040i: >-
    Бак 4 000 л, штанги 27–36 м, ізольована система.
  john-deere-r4045i: >-
    Бак 4 500 л, штанги 30–40 м, ExactApply.
  john-deere-r4150i: >-
    Флагманська модель. Бак 5 700 л, штанги 36–40 м, See & Spray Premium.
