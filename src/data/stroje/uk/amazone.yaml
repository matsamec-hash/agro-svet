# UK overlay (описи/поля) на cs структуру. AI draft+editor, потрібен review.

country: "Німеччина"
description: >-
  Німецький спеціаліст (штаб-квартира Hasbergen-Gaste) з розкидачів мінеральних добрив (серії ZA-V, ZA-TS, ZG-TS), обприскувачів (UF, UX, самохідна Pantera), сівалок (Cataya, Centaya, Cirrus, Precea, Primera DMC) та обробітку ґрунту (дискові лущильники Catros/Catros XL, лапові Cenius/Cenio, глибокорозпушувач Cobra, ротаційні борони KE/KG/KX). Відомий технологіями ArgusTwin (розкидачі) та SmartSprayer (обприскувачі).

categories:
  hnojeni: "Удобрення"
  ochrana-rostlin: "Захист рослин"
  seti: "Сівба та садіння"
  zpracovani-pudy: "Обробіток ґрунту"

series:
  za-v: >-
    ZA-V — навісний дисковий розкидач мінеральних добрив для середніх і більших ферм.
    Робоча ширина 10–36 м, об'єм бункера 1 400–4 200 л залежно від надбудови. Вагова
    регуляція дози системою AMADOS+, граничне внесення BorderTS. Вигідне співвідношення
    ціна/продуктивність, ідеальний для ферм 100–500 га. Зважування та посекційне внесення опціонально.
  za-ts: >-
    ZA-TS — флагман навісних розкидачів для точного внесення. Робоча
    ширина до 54 м, об'єм 1 400–4 200 л. Система ArgusTwin безперервно контролює кут
    падіння добрива чотирма радарами та коригує положення лопаток для однорідного внесення.
    AutoTS дозволяє автоматичне граничне та поворотне внесення без заміни лопаток.
    Підходить для змінного внесення за GPS-картами.
  za-m: >-
    ZA-M — навісний дводисковий розкидач мінеральних добрив із робочою шириною 10–36 м. Типи ZA-M 1002 Special (1 200–1 700 л), ZA-M 1202 (1 200–2 700 л) і ZA-M 1502 (1 500–3 000 л); об'єм збільшують надставки. Розкидальний апарат із нержавної сталі, необслуговувані редуктори в масляній ванні із захистом від перевантаження.
  zg-ts: >-
    ZG-TS — причіпний розкидач мінеральних добрив із розкидальною системою TS і робочою шириною 15–54 м. Типи ZG-TS 7501 (7 500 л) і ZG-TS 10001 (10 000 л). Межове внесення AutoTS або BorderTS, посекційне керування до 128 секцій через ISOBUS. Для великих господарств і сервісних компаній.
  pantera: >-
    Pantera 4504 — самохідний обприскувач із баком 4 500 л і робочою шириною 21–48 м. Двигун Deutz, 6-циліндровий 6,1 л, макс. 218 к.с. (160 кВт), безступінчастий гідростатичний привід до 50 км/год. Версія H має гідравлічно регульований кліренс 1,25–1,70 м, версія W ширшу колію 2,25–3,00 м (кліренс 1,15 м), HW поєднує обидві. Більша Pantera 7004 має бак 6 600 л.
  ux: >-
    UX — причіпний обприскувач для середніх і великих ферм. Об'єм бака 4 200–11 200 л,
    робоча ширина 21–42 м. Версія Super з активним керуванням осі, ContourControl
    для автоматичного копіювання рельєфу штангою. Центр керування SmartCenter
    з індукційним наповненням. Підходить для інтенсивного зерновиробництва та олійних культур.
  uf: >-
    UF — навісний обприскувач з об'ємом бака 1 002–2 002 л та шириною 12–30 м.
    Компактні розміри для малих та середніх ферм або як доповнення до самохідної
    машини. Центр керування DC або TC, сумісний з AmaSelect та AmaSwitch.
    Опціонально передній бак FT 1502 для збільшення місткості до 3 500 л без втрати
    маневреності.
  cataya: >-
    Cataya — навісна механічна сівалка для комбінації з ротаційною бороною KE або
    компактоматом KG. Робоча ширина 3,0–4,0 м, дозувальний механізм з електричним
    приводом (eDrive) для змінної дози за картою. Сошники WS (дискові) або
    RoTeC для борозенної сівби в різних умовах. Версія Special для класичного
    застосування, Super з системою попереднього дозування та вищим комфортом.
  centaya: >-
    Centaya — навісна пневматична сівалка шириною 3,0–4,0 м для агрегатування з ротаційною бороною KE або ротаційним культиватором KG. Типи Centaya 3000/3500/4000 у версіях Special і Super, варіанти -C з розділеним бункером для насіння й добрив. Централізоване дозування з розподільною головкою, ISOBUS.
  cirrus: >-
    Cirrus — причіпна посівна комбінація для мульчованої та традиційної сівби шириною 3–6 м із бункером 3 000–4 000 л. Типи Cirrus 3003 Compact, 4003 і складані 4003-2 та 6003-2; варіанти -C мають двокамерний напірний бункер для насіння й добрив, -CC — ще третє дозування. Для 8–9 м Amazone пропонує Cirrus Grand 8004-2C і 9004-2C.
  precea: >-
    Precea — точна сівалка нового покоління для кукурудзи, соняшнику, буряку
    та інших широкорядних культур. Ширина 3–6 м, дозувальний механізм
    з вакуумною турбіною, що працює до 15 км/год. Версія 3000-A (навісна), 4500-2
    та 6000-2 (причіпні дворядні), 6000-2CC (з мікрогранулятом) та TCC (з великомісткісним
    бункером для добрива). FertiSpot для точкового внесення добрива під сошник.
    Замінює старі серії ED та EDX.
  primera-dmc: >-
    Primera DMC — причіпна сівалка, спеціаліст з прямої сівби (no-till)
    у мульчу та стерню. Ширина 6–9 м, лапові сошники з тиском до 130 кг
    для проникнення у тверду суху землю. Великомісткісний бункер 4 200–5 000 л,
    ISOBUS стандарт. Затребувана модель в аридних регіонах (південь ЧР, Угорщина)
    та на фермах з ґрунтозахисною агротехнікою.
  catros: >-
    Catros+ — компактна дискова борона з дисками 510 мм для мілкого обробітку стерні. Навісні жорсткі типи 2503–4003 (2,5–4 м) і складані -2 (4–7 м), причіпні -2TS (4–7 м) і великі причіпні -2TX (7–12 м). Кожен диск має власну гумову підвіску, котки на вибір залежно від ґрунту.
  catros-xl: >-
    CatrosXL — дискова борона з більшими дисками 610 мм для глибшого обробітку та великої кількості пожнивних решток (кукурудза, соняшник). Навісні типи 3003, 3503 і 4003, причіпні -2TS (5–8 м) і -2TX (7–8 м).
  cenius: >-
    Cenius — лаповий культиватор для лущення, передпосівного обробітку та глибшого розпушування. Навісні типи 3003, 3503 і 4003 у версіях Special (зрізний болт), Super (пружинний запобіжник) і Ultra (гідравлічний запобіжник), причіпні Cenius-2TX шириною 4–7 м.
  cenio: >-
    Cenio — компактний навісний лаповий культиватор для мілкого лущення. Жорсткі типи Cenio 3000 і 3500, складані Cenio 4000-2 і 5000-2; версія Special із жорсткими стійками, Super із пружинним запобіжником для кам'янистих ґрунтів.
  ceus: >-
    Ceus — комбінований розпушувач, що поєднує два ряди дисків і три ряди лап
    для глибини 10–30 см за один прохід. Ширина 4–7 м, причіпна двовісна
    конструкція. Економить проходи: замінює окреме лущення та глибоке
    розпушування. Підходить як альтернатива плугу за безвідвальних систем.
  cobra: >-
    Cobra-2TX — причіпний культиватор для мілкого обробітку (Flachgrubber) шириною 6–7 м для суцільного обробітку на глибину 4–13 см на швидкості до 16 км/год. Типи Cobra 6000-2TX і 7000-2TX, міжслідя 13,3 см, пружинні стійки з вібраційною дією.
  kg: >-
    KG Cultimix — навісний ротаційний культиватор (Kreiselgrubber) для тракторів до 360 к.с. Жорсткі типи KG 3001, 3501 і 4001 у версіях Special і Super, складані KG 4002-2, 5002-2 і 6002-2 (4–6 м, до 360 к.с.). Частий партнер сівалок Cataya, Centaya і Avant.
  ke: >-
    KE 02 Rotamix — навісна ротаційна борона. Жорсткі типи KE 02-150, 02-190 і 02-240 (ширина 2,5–4 м, для тракторів до 150, 190 або 240 к.с.), складані KE 02-2-300 і 02-2-400 (4–6 м, до 300 і 400 к.с.). Число після дефіса означає максимальну потужність трактора. Агрегатується із сівалками Cataya і Centaya.
  kx: >-
    KX — ротаційна борона для середнього класу, компактніша версія за KG. Робоча
    ширина 3,0 м, потужність трактора до 190 к.с. Легша конструкція, підходить для
    ферм з тракторами 100–180 к.с. як комбінація з сівалкою.
