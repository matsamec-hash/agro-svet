# UK overlay (описи/поля) на cs структуру. AI draft+editor, review потрібен.

country: "Фінляндія"
description: >-
  Фінський виробник тракторів з давньою традицією (раніше Valmet). Частина концерну AGCO з 2004 року. Відомий міцною конструкцією для північних умов, реверсивною системою TwinTrac (кабіна з поворотним сидінням для роботи назад) та персоналізацією — кожен трактор виготовляється на замовлення відповідно до вимог клієнта. Комбайни не виробляє.

categories:
  traktory: "Трактори"

series:
  valmet-6000-8000: >-
    Трактори Valmet / Valtra Valmet: серія Mezzo 6000 (з 1991) і «п'ятдесяті» моделі 8000 (1995–2004); 6200–6400 випускали ще у 2005–2007 роках. Двигуни Valmet / Sisu 4- і 6-циліндрові, трансмісія 12F/12R синхронізована, опційно Delta Powershift 36F/36R.
  hitech: >-
    Чотирициліндрові трактори HiTech 6250, 6350, 6550, 6650, 6750 і 6850 (приблизно 1998–2006) з двигунами Sisu 4,4 л і трансмісією HiTech 36F/36R з перемиканням під навантаженням. Продавалися під марками Valtra Valmet і Valtra. У переліку є також Valmet 6600 і 6800 із серії Mezzo, які не мали версії HiTech.
  n-gen1: >-
    Перше покоління N Series (2005): N91, N101, N111, N111e, N121 і N141, з 2007 також N82 і N92. Двигуни Sisu / AGCO Power 4,4 л, трансмісії HiTech, а з 2008/09 Versu й безступінчаста Direct (N122, N142). З січня 2012 року її замінило 3-тє покоління N93–N163.
  n-gen2:
    name: "N Series Mk3 / 4-те покоління (2014–2021)"
    description: >-
      4-те покоління N Series (N4, 2014/2015–2021): N104, N114e, N124, N134, N154e і N174. Двигуни AGCO Power 4,4 і 4,9 л, версії HiTech, Active, Versu і безступінчаста Direct, дахове вікно SkyView для роботи з фронтальним навантажувачем.
  n-gen3:
    name: "N Series Mk4 / 5-те покоління (2021–дотепер)"
    description: >-
      5-те покоління N Series (N5, з 14.04.2021): N135, N155e і N175. Двигун AGCO Power 4,9 л Stage V, версії Active, Versu і безступінчаста Direct, кабіна SmartTouch.
  t-gen1: >-
    Зведений рядок трьох поколінь T Series: T130–T190 (2003–2007/08), T121–T191 (2007–2012, з 2009 також безступінчаста Direct) і T213 (2012–2014). Шестициліндрові двигуни Sisu / AGCO Power 6,6 і 7,4 л, трансмісії HiTech, HiTech 5 і Versu.
  t-gen2: >-
    4-те покоління T Series (T4, осінь 2014 – квітень 2021): T144 і T154 з двигуном AGCO Power 6,6 л, більші моделі 7,4 л; трансмісії HiTech, Active, Versu і безступінчаста Direct, з 2017 кабіна SmartTouch. З квітня 2021 її замінило 5-те покоління T145–T255, нині випускається 6-те покоління T146–T236.
  s-gen1: >-
    S Series S232–S352 (2009–2011): двигун AGCO Power 8,4 л, трансмісія AGCO Variable Transmission (AVT), реверсивний пост TwinTrac. З 2011 року її замінили S233–S353.
  s-gen5: >-
    4-те покоління S Series (S4): S274–S374 з межі 2013/2014, S394 з 2017. Двигун AGCO Power 8,4 л, трансмісія AGCO Variable Transmission (AVT), кабіна SmartTouch. У листопаді 2023 року її замінило 6-те покоління S286–S416.
  a-series: >-
    4-те покоління A Series (A4, 2017–2021) для менших господарств і комунальних робіт: A74–A94 з трициліндровим AGCO Power 3,3 л, A104–A134 з чотирициліндровим 4,4 л. У січні 2021 року її замінило 5-те покоління A75–A135, потужніше на 5 к.с.
  g-series: >-
    Середній клас між A та N. Двигун AGCO Power 4,4 л Stage V, компактні розміри з сучасною кабіною SmartTouch (опціонально) або Classic.
  q-series: >-
    Серія між T і S, представлена 2.09.2022. Шестициліндровий AGCO Power 7,4 л Stage V, безступінчаста трансмісія, кабіна SmartTouch. Моделі Q225–Q305.
