# UK overlay (описи/поля) на cs структуру. AI draft+editor, потрібен review.

country: "Німеччина / Італія"
description: >-
  Німецький бренд з довгою традицією від 1864 року (Deutz), злиття з Fahr 1969. Частина SDF Group (Same Deutz-Fahr) з італійською складовою. Трактори виробляються у Лауїнгені (Німеччина) та Тревільйо (Італія). Виразне зелене забарвлення. Флагман — 9 Series.

categories:
  traktory: "Трактори"
  kombajny: "Комбайни"

series:
  06-series: >-
    Серія зелених тракторів Deutz (Klöckner-Humboldt-Deutz) кінця 1960-х і 1970-х років із двигунами Deutz серії 912 повітряного охолодження. Моделі D 4006–D 13006 охоплювали потужність приблизно 35–120 к.с.; флагман D 13006 мав шестициліндровий турбодвигун BF6L 912. Типи D 5206–D 7206 з'явилися в 1974 році.
  dx: >-
    Історична класика Deutz-Fahr з двигунами Deutz F3L / F4L / F6L 912 та 913 повітряного охолодження. Знакова серія, поділена на класи DX 3 (компактний 3-циліндровий), DX 4 (4-циліндровий), DX 6 (6-циліндровий) та флагманські DX 7/8. У 1983 році модернізація з вищою потужністю.
  agrostar: >-
    Попередник серії Agrotron. Модернізований наступник серії DX з двигунами Deutz повітряного охолодження. Репрезентативна «зірка» 90-х років з характерним дизайном та відкритою кабіною StarCab.
  agroxtra: >-
    Серія AgroXtra продовжувала DX 4 і AgroPrima. Чотирициліндрові 4.47 і 4.57 мали турбований двигун Deutz BF4L 913 (4,1 л) повітряного охолодження, шестициліндрові 6.07 і 6.17 — атмосферні F6L 912/913.
  agrotron-legacy: >-
    Знакове покоління Agrotron. **MK1** (1995–1997) мала революційну засклену кабіну та двигун Deutz з проблемною трансмісією ZF Eccom. **MK2** (1997–2000) усунула проблеми з надійністю. **MK3** (2000–2003) принесла моделі 80–230 та у **2001 році перший Agrotron TTV** з CVT (безступінчаста варіаторна).
  agroplus: >-
    Компактні універсальні трактори. Типи 60 і 70 з двигунами Deutz повітряного охолодження та типи 75, 85, 95 і 100 з двигунами Deutz 1012 рідинного охолодження випускалися паралельно приблизно у 1997–2005 роках; Agroplus 100 мав шестициліндровий двигун. У 2005–2007 роках пропозицію доповнили вузькі виконання Agroplus S 70–S 100 для виноградників і садів.
  agrofarm: >-
    Універсальні трактори для менших господарств. Agrofarm 85 і 100 (2007–2008) з двигунами Deutz, потім Agrofarm 410, 420 і 430 та безступінчасті Agrofarm TTV 420 і TTV 430 (з 2008). Серія Agrofarm G (G 85, G 100, G 115, G 410, G 430) має двигуни SDF 1000.4 об'ємом 4,0 л.
  agrotron-m: >-
    Преміальна середньовелика серія. M410/M420 — 4-циліндрові, M600–M650 — 6-циліндрові з двигунами Deutz TCD 2012 / TCD 2013 та впорскуванням DCR (Deutz Common Rail). Доступні також у варіанті Profiline.
  agrotron-k: >-
    Наступник найменших Agrotron MK3 з двигунами Deutz 2012 рідинного охолодження: чотирициліндрові (K90, K100, K120, K410, K420, K430) і шестициліндрові (K110, K610). Версія Profiline з автоматичним powershift, гідравлікою load-sensing і керуванням на розворотах.
  5g: >-
    Цей рядок об'єднує експортну серію 5G (5090.4 G, 5100 G, 5110 G) з двигунами SDF, яку Deutz-Fahr пропонує поза ЄС, та моделі 5120 (2013–2016) і 5125 (з 2016) європейської серії 5 з двигуном Deutz 3,6 л.
  6g: >-
    Серія 6 (Agrotron 6): чотирициліндровий 6140 з 2013 року та шестициліндрові 6155–6215 з двигуном Deutz TCD 6.1 з нової серії 6, представленої в липні 2016 року (156–226 к.с.), трансмісії RCshift або безступінчаста TTV. Експортна серія 6G (6155 G–6205 G) — інша. Нині Deutz-Fahr пропонує наступників 6160–6230 і серії 6.4 та 6C.
  7: >-
    Преміальна серія з двигуном Deutz TCD 6.1 і безступінчастою трансмісією TTV. Дизайн Giugiaro. З липня 2016 року до неї входять 7230 TTV і 7250 TTV.
  8: >-
    8280 TTV (з 2020 року) з двигуном Deutz TTCD 6.1 з подвійним наддувом і трансмісією TTV. Нова серія 8, представлена в листопаді 2025 року (8310 TTV і 8340 TTV), має двигун FPT N67 об'ємом 6,7 л і кабіну SigmaVision.
  9: >-
    Флагманська серія Deutz-Fahr, представлена на Agritechnica 2013 і виготовлювана з 2015 року в Лауїнгені. Двигун Deutz TTCD 7.8 з двоступеневим наддувом, безступінчаста трансмісія TTV, максимальна потужність 295–336 к.с. Дизайн Giugiaro.
  9-warrior: >-
    Спеціальна редакція Warrior флагманської серії 9. LED-освітлювальний пакет 4-го покоління, комфортне сидіння Evolution Active, автоматичний кондиціонер, підніжка DEUTZ-FAHR у чорному кольорі. Доступна також у класичному зеленому кольорі.
  6c: >-
    Компактна 4-циліндрова серія 6 Series з двигунами Stage V та кабіною TopVision. Три варіанти трансмісії: Powershift 3-ступеневий, RVshift full-powershift 20F/16R або CVT TTV. Гідравліка load-sensing 120 л/хв, вантажопідйомність заднього підіймача 7 000 кг.
  5d: >-
    Базова серія з трициліндровим двигуном FARMotion 35 і механічною трансмісією 15+15 або 30+15, макс. 40 км/год. Потужності в каталозі відповідають версії 2018 року; з 2021 року випускається версія Stage V з максимальною потужністю 66–102 к.с.
  m-series-old: >-
    Старіше покоління класичних комбайнів до модернізації на Topliner. Дизелі Deutz F5L / F6L 912 та 913 повітряного охолодження. Моделі M1080, M2385, M2480, M2580, M2680, M2685, M2780 та M34 / M36 для великих господарств.
  starliner: >-
    Середні класичні комбайни Starliner. Класичні 5-клавішні соломотряси з прямим ремінним приводом. Паралельне покоління до Topliner для нижчого класу потужності.
  htc-old: >-
    Великі класичні комбайни з системою APS (Advanced Propulsion System) — подвійний прискорювальний барабан та довгі соломотряси. Серед моделей 5690 HTS та 6090 HTS найпотужнішим був 7545 RTS з роторною сепарацією.
  topliner: >-
    Легендарні класичні комбайни. У 90-х роках домінантні на центральноєвропейському ринку.
  c-series-old: >-
    Середні та великі класичні комбайни. Двигун MTU/Deutz, роторний сепаратор.
  c-series-new: >-
    Нове покоління комбайнів. Двигун Deutz TCD 6.1 л та 12.0 л, гібридна система у флагманського C9000 (APS + ротор).
