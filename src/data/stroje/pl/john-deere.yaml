# PL overlay (opisy/pola) na strukturę cs. Tłumaczenie z cs/sk, wymaga korekty.

country: "USA"
description: >-
  Największy producent maszyn rolniczych na świecie. Amerykańska firma z zielonymi ciągnikami i żółtą gwiazdą dominuje na rynku w Ameryce Północnej, Europie i Azji.

categories:
  traktory: "Ciągniki"
  kombajny: "Kombajny"
  rezacky: "Sieczkarnie samojezdne"
  postrikovace: "Opryskiwacze samojezdne"

series:
  new-generation-10-series: >-
    Przełomowa generacja, która zakończyła erę dwucylindrowych silników John Deere („Johnny Popper"). Premiera 30 sierpnia 1960 w Dallas („Deere Day in Dallas") zaprezentowała całkowicie nowe wielocylindrowe silniki wysokoprężne — rzędowe czterocylindrowe i sześciocylindrowe, nową przekładnię Synchro-Range i nowoczesną hydraulikę. Ogromnej modernizacji towarzyszyło przeniesienie produkcji do Waterloo (Iowa) i Dubuque. New Generation położyła podwaliny pod wszystkie kolejne serie i zdefiniowała John Deere jako lidera technologicznego w rolnictwie.
  20-series-1963: >-
    Ulepszona generacja 10 Series. Kluczowy model 4020 (1963–1972) stał się jednym z najlepiej sprzedających się ciągników w historii John Deere — wyprodukowano ponad 184 000 sztuk. Dysponował opcjonalną przekładnią Power Shift (8 biegów pod obciążeniem), sześciocylindrowym silnikiem 6,6 L i później ikoniczną kabiną „hex-shaped" (1972). W 1965 roku fabryka Mannheim (Niemcy) rozpoczęła produkcję serii 20 na rynek europejski — pierwsza europejska produkcja John Deere.
  30-series-sound-gard: >-
    Generacja, która zdefiniowała komfort w rolnictwie. We wrześniu 1972 roku John Deere zaprezentował rewolucyjną kabinę **Sound-Gard** — pierwszą zintegrowaną, dźwiękoszczelną kabinę w technice rolniczej z klimatyzacją, ogrzewaniem i tłumieniem drgań (maks. 80 dB(A) wewnątrz). Nazywana „Generation II". Modele 4030/4230/4430/4630 zastąpiły udane serie 4020/4320/4520/4620 i ustanowiły nowe standardy ergonomii dla całej branży.
  40-series-iron-horse: >-
    Modernizacja kabiny Sound-Gard (Sound-Gard II). Modele 4040/4240/4440/4640/4840 przyniosły oszczędniejsze silniki, ulepszoną hydraulikę i solidniejsze przekładnie. Ikoniczny **4440** o mocy 130 KM stał się najlepiej sprzedającym się modelem dekady — wyprodukowano ponad 95 000 sztuk. Dołączył najmocniejszy 4840 (180 KM) jako flagowiec.
  50-series-1982: >-
    Kontynuacja udanej generacji z naciskiem na oszczędność paliwa i ulepszoną przekładnię **Quad-Range** (16 biegów). Silniki z elektroniczną regulacją obrotów, nowy wyświetlacz w kabinie i hydraulika o większym wydatku. Modele 4050/4250/4450/4650/4850 obejmowały 105–193 koni.
  55-series-1988: >-
    Ostatnia „czysta" generacja do upraw rzędowych przed podziałem na serie 7000 (row-crop) i 8000 (flagowe). Modele 4055/4255/4455/4555/4755/4955 przyniosły elektronicznie sterowane podnośniki hydrauliczne, ulepszony monitor PerformanceMonitor i nowoczesny wygląd kabiny. Topowy **4955** (200 KM) był najmocniejszym row-crop John Deere swoich czasów.
  5000: >-
    Pierwsze ciągniki użytkowe na rynek europejski produkowane w Mannheim. Moce 40–75 KM, prosta koncepcja przeznaczona dla mniejszych gospodarstw i zastosowań komunalnych.
  5010-5020-5030: >-
    Stopniowo ulepszane generacje ciągników użytkowych. Silniki PowerTech, w pełni zsynchronizowana przekładnia SyncShuttle 9x3.
  5m: >-
    Nowoczesna seria użytkowa z silnikiem PowerTech i elektronicznie sterowaną hydrauliką. Warianty dla rolników, sadowników i służb miejskich.
  5r: >-
    Premium seria użytkowa z technologiami wyższych klas — CommandArm, przekładnia IVT, pełna łączność kabiny.
  6000: >-
    Przełomowa seria ciągników średnich produkowana w Mannheim. Kabina **OOS** (Open Operator Station) z panoramicznym widokiem, silnik PowerTech 4045 (4-cylindrowy, 4,5 L) dla 6100–6400 i 6076 (6-cylindrowy, 7,6 L) dla 6500–6900, przekładnia **PowrQuad 16/16**, opcjonalne zawieszenie osi przedniej **Triple-Link Suspension**.
  6010: >-
    Następca serii 6000, silniki PowerTech, przekładnia PowrQuad Plus 16x16. Rozszerzony wybór od 80 do 150 koni.
  6020: >-
    Całkowicie nowa platforma. Kabina ComfortGard, silnik PowerTech Plus z common-rail, opcjonalna przekładnia AutoQuad Plus i hydraulika z detekcją obciążenia (load sensing).
  6030-premium: >-
    Premium seria z technologią AutoPowr (CVT), pełnym zawieszeniem osi przedniej TLS, kabiną Premium i integracją z GreenStar 2.
  6m: >-
    Uniwersalna seria do gospodarstw mieszanych. Silnik PowerTech 4,5 / 6,8 L, przekładnia AutoQuad lub CommandQuad, norma emisji Stage V (od 2019).
  6r: >-
    Premium wszechstronna seria. Silnik PowerTech PSS/PVS, przekładnia AutoPowr IVT lub CommandPro, pełne zawieszenie TLS Plus, kabina CommandView III, wyświetlacze Gen 4.
  6r-gen3: >-
    Trzecia generacja premium serii 6R, produkowana w Mannheim. Silnik PowerTech 4,5 L (4-cylindrowy) i 6,8 L (6-cylindrowy) Stage V ze SCR i DPF, przekładnia AutoPowr (CVT) lub CommandQuad Plus, kabina CommandView 4 z 12,8" wyświetlaczem G5, pełna łączność JDLink oraz wsparcie funkcji autonomicznych AutoTrac i AutoPath. Oznaczenia modeli 6R 110 / 120 / 130 / 140 / 150 / 165 / 185 / 195 / 215 / 230 / 250.
  7000: >-
    Pierwsza generacja ciągników row-crop powyżej 150 koni produkowana w Waterloo. Podstawa dla wszystkich kolejnych serii 7R.
  7010: >-
    Ciągniki row-crop drugiej generacji, silnik PowerTech 6,8 L, przekładnia PowrQuad Plus lub AutoQuad.
  7020: >-
    Silnik PowerTech Plus z wtryskiem elektronicznym. Opcjonalna przekładnia AutoPowr IVT (bezstopniowa wariatorowa) — pierwsza w tej klasie u John Deere.
  7030: >-
    Norma emisji Tier 3, silnik PowerTech Plus 6,8 L z 24-zaworową głowicą. Kabina Premium z wentylacją, klimatyzacją i elektronicznie regulowanym fotelem.
  7r: >-
    Flagowa seria row-crop średniej wielkości. Silnik PowerTech PSS 6,8/9,0 L, przekładnia e23 PowerShift lub AutoPowr IVT, kabina CommandView III, AutoTrac, AutoPath.
  7r-gen3: >-
    Aktualna generacja 7R z silnikiem PowerTech PSS 9,0 L (6-cylindrowy, Stage V), przekładnią e23 PowerShift (23 biegi) lub AutoPowr IVT, kabiną CommandView 4 z 10" wyświetlaczem CommandCenter i 12,8" Gen 4 Extended. Pełne wsparcie AutoPath, AutoTrac SF7000 i JDLink. Seria modelowa od 7R 230 do 7R 350 w krokach co 60 koni.
  8000: >-
    Legendarna „wielka zielona". Pierwszy row-crop powyżej 200 koni z nowoczesną kabiną, elektronicznie sterowaną hydrauliką i PowerShift 16/4.
  8010: >-
    Silnik PowerTech 8,1 L, przekładnia PowerShift 16/4, kabina ComfortGard Plus.
  8020: >-
    Nowa generacja z silnikiem PowerTech Plus, opcjonalna przekładnia IVT AutoPowr, aktywne zawieszenie osi przedniej ILS.
  8030: >-
    Norma emisji Tier 3 (PowerTech Plus 9,0 L), automatyczne prowadzenie **AutoTrac**, wyświetlacz GreenStar 2 1800/2630, kabina CommandView, zawieszenie osi przedniej TLS Plus, wersja gąsienicowa 8030T (8130T/8230T/8330T/8430T/8530T).
  8r-gen1: >-
    Pierwsza generacja 8R z opcjonalnym podwoziem gąsienicowym 8RT. Silnik PowerTech PSS 9,0 L, przekładnia e23 PowerShift lub AutoPowr IVT, kabina CommandView II/III.
  8r-gen2: >-
    Całkowicie nowa platforma, silnik PowerTech PSS 9,0 L, przekładnia e23 / IVT / DirectDrive, kabina CommandView 4, wersje gąsienicowe 8RT i kołowe 8R. AutoPath i prowadzenie autonomiczne (CES 2022).
  8rx-4track: >-
    Przełomowy wariant gąsienicowy serii 8R — pierwszy **czterogąsienicowy (four-track)** ciągnik rolniczy w segmencie średniej wielkości. Każde koło zastępuje osobna gumowa gąsienica, co zapewnia minimalny nacisk na glebę, wysoki uciąg i komfort porównywalny z ciągnikiem kołowym. Dzieli silnik PowerTech PSS 9,0 L i kabinę CommandView 4 z serią 8R, przekładnia e23 lub IVT.
  9000: >-
    Przegubowe ciągniki 4WD dla rozległych gospodarstw. Silnik PowerTech 12,5 L i PowerShift 12/3.
  9020: >-
    Silnik PowerTech 12,5 L, opcjonalne podwozie gąsienicowe 9000T, Greenstar 2.
  9030: >-
    Silnik PowerTech Plus 13,5 L, AutoTrac Universal, GreenStar 3.
  9r-gen1: >-
    Pierwsza generacja oznaczenia 9R. Silnik Cummins QSX 15,0 L, wersje gąsienicowe 9RT (dwie gumowe gąsienice) i 9RX (cztery gumowe gąsienice).
  9r-gen2: >-
    Generacja z silnikiem JD 13,6 L i 18,0 L, kabina nowej generacji, e18 PowerShift, prowadzenie autonomiczne, wersje gąsienicowe 9RX w pięciu wariantach mocy.
  9rx:
    name: "9RX 4-track (2015–2021, osobna seria)"
    description: >-
      Pierwsza generacja pierwszego w branży **przegubowego czterogąsienicowego** ciągnika — wprowadzona w 2015 roku jako samodzielna wersja gąsienicowa serii 9R. Cztery niezależne gumowe gąsienice zapewniają równomierne rozłożenie masy, minimalne zagęszczenie gleby i uciąg porównywalny z najcięższymi kołowymi 9R. Silnik Cummins QSX 15,0 L, 18-biegowy PowerShift e18. Od 2022 roku 9RX zintegrowano z nową serią Gen2.
  cts: >-
    Technologia hybrydowa CTS (Cylinder Tine Separator) — połączenie klasycznego bębna i dwóch rotorów. Następca serii 9000/9500/9600.
  9000-kombajn: >-
    Klasyczny bęben-wytrząsacz, typowa amerykańska ciężka seria.
  wts: >-
    Europejska generacja kombajnów, klasyczny system separacji z ulepszonymi wytrząsaczami i rotacyjnym doseparatorem.
  9000-sts: >-
    Rewolucyjna jednorotorowa technologia STS (Single Tine Separator). Od 9660 STS po 9880i STS.
  s-series: >-
    Premium seria jednorotorowych kombajnów. Silnik JD PowerTech / Cummins 13,5 L, napęd hydrostatyczny, ActiveYield, automatyka HarvestSmart, wyświetlacz Gen 4.
  t-series: >-
    Europejski klasyczny kombajn z wytrząsaczami (Walker). Silnik JD PowerTech 6,8/9,0/13,5 L, przekładnia ProDrive, pięć wytrząsaczy.
  w-series: >-
    Ekonomiczna seria europejska z klasyczną separacją, 4 lub 5 wytrząsaczy, silnik JD PowerTech 6,8 L.
  x-series: >-
    Rewolucyjny dwurotorowy system Dual Separator. Największa przepustowość i najniższe straty w klasie. Silnik JD PowerTech 13,6 L, AutoMaintain, HarvestVision.
  6000-rezacky: >-
    Pierwsze nowoczesne sieczkarnie samojezdne John Deere produkowane w Zweibrücken (Niemcy). Po przejęciu niemieckiej firmy Hesston/Heesemann i know-how o paszach. Silniki PowerTech 8,1–12,5 L, mechaniczny napęd walców, klasyczny metalowy wyrzutnik.
  7000-rezacky: >-
    Modernizacja z elektronicznym sterowaniem zespołu tnącego, automatyczna regulacja długości sieczki AutoLOC i ulepszony system KernelStar do zgniatania ziaren kukurydzy. Silnik PowerTech Tier 3, kabina ComfortGard.
  7050-rezacky: >-
    Generacja 7050 przyniosła AutoLOC II, czujnik HarvestLab NIR do analizy suchej masy i składników w czasie rzeczywistym oraz integrację z GreenStar 2. Silniki Tier 3, moce od 360 do 625 koni.
  8000-rezacky: >-
    Generacja 8000 przyniosła całkowicie nowy przepływ maszyny — zespół tnący o 25 % większy, nowy system KernelStar 2 (zgniatacz ziarna), HarvestLab 3000 i integrację z JDLink. Silnik JD PowerTech 9,0 / 13,5 / 19,0 L Tier 4.
  9000-rezacky: >-
    Flagowa seria sieczkarni samojezdnych. **9900** z silnikiem 24,2 L Liebherr i mocą ponad 1 000 koni to najwydajniejsza sieczkarnia samojezdna na świecie. AutoLOC III, KernelStar 3, HarvestLab 3000, w pełni zintegrowany AutoTrac, systemy kamer i JDLink Connect.
  4730-postrikovace: >-
    Pierwsza nowoczesna generacja opryskiwaczy samojezdnych John Deere na rynek europejski. Produkowane w Waterloo (USA) i Horst (Holandia). Silnik PowerTech, cztery koła z niezależnym napędem (HydroHandle), zbiornik 1 500–4 540 l. Modele 4730/4830/4930 zapewniły zakres mocy od 200 do 360 koni.
  r-series-postrikovace: >-
    Aktualna generacja opryskiwaczy samojezdnych. Modele R4030/R4040i/R4045i oraz amerykańska seria R4044/R4060/R4150. Silnik JD PowerTech, BoomTrac Pro (automatyczna regulacja wysokości belek), indywidualne załączanie dysz (ExactApply, See & Spray), AutoTrac, integracja z Operations Center.

models:
  john-deere-5010: >-
    Pierwszy John Deere, który oficjalnie przekroczył 100 koni. Duży ciągnik terenowy przeznaczony dla zachodnich równin USA.
  john-deere-4020: >-
    Ikona amerykańskiej mechanizacji rolnictwa lat 60. Przekładnia Power Shift z 8 biegami pod obciążeniem była rewolucyjna. Jeden z najcenniejszych kolekcjonerskich ciągników John Deere.
  john-deere-4430: >-
    Bestseller ery Sound-Gard. Przekładnia Quad-Range lub Power Shift, silnik turbo 125 KM. Wyprodukowano ponad 95 000 sztuk.
  john-deere-4440: >-
    Najbardziej ikoniczny John Deere lat 70. i 80. Power Shift, Sound-Gard II, turbo 7,6 L. Synonim niezawodności.
  john-deere-8r-410: >-
    Flagowy model. Kabina CommandView 4, AutoPath, hydraulika 435 l/min, tylny podnośnik 12 000 kg. IVT Boost do 428 KM.
  john-deere-8rx-410: >-
    Flagowy model czterogąsienicowy. Ten sam silnik co 8R 410, cztery gumowe gąsienice dla maksymalnego uciągu i minimalnego ugniatania gleby.
  john-deere-fh-7950: >-
    Najwydajniejsza sieczkarnia samojezdna swoich czasów — ponad 800 koni z silnika 19,0 L.
  john-deere-fh-9900: >-
    Flagowa sieczkarnia samojezdna. Silnik V12 24,2 L Liebherr, zbiór do 12 rzędów, przepustowość ponad 400 t/h zielonej masy. Symbol siły w europejskim rolnictwie.
  john-deere-4730: >-
    Zbiornik 3 000 l, belki 24/27/28 m.
  john-deere-4830: >-
    Zbiornik 3 800 l, belki 27/30 m.
  john-deere-4930: >-
    Zbiornik 4 540 l, belki 36 m.
  john-deere-4940: >-
    Tier 4 Final. Zbiornik 4 540 l.
  john-deere-r4030: >-
    Zbiornik 3 000 l, belki 24–28 m.
  john-deere-r4040i: >-
    Zbiornik 4 000 l, belki 27–36 m, system izolowany.
  john-deere-r4045i: >-
    Zbiornik 4 500 l, belki 30–40 m, ExactApply.
  john-deere-r4150i: >-
    Flagowy model. Zbiornik 5 700 l, belki 36–40 m, See & Spray Premium.
