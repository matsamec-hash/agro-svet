# PL overlay (opisy/pola) na strukturę cs. Tłumaczenie z cs/sk, wymaga korekty.

country: "USA"
description: >-
  Największy producent maszyn rolniczych na świecie. Amerykańska firma z zielonymi ciągnikami i żółtą gwiazdą dominuje na rynku w Ameryce Północnej, Europie i Azji.

categories:
  traktory: "Ciągniki"
  kombajny: "Kombajny"
  rezacky: "Sieczkarnie samojezdne"
  postrikovace: "Opryskiwacze samojezdne"

series:
  new-generation-10-series: >-
    Seria, która zakończyła erę dwucylindrowych silników John Deere („Johnny Popper”). Premiera 30 sierpnia 1960 w Dallas („Deere Day in Dallas”) przyniosła silniki wielocylindrowe, przekładnię Synchro-Range i nową hydraulikę. Ciągniki 1010–5010 produkowano w latach 1960–1965, potem zastąpiła je seria 20.
  20-series-1963: >-
    Następca serii 10. Kluczowy model 4020 (1963–1972) należy do najlepiej sprzedających się ciągników John Deere, wyprodukowano ponad 184 000 sztuk; oferował przekładnię Power Shift zmienianą pod obciążeniem i sześciocylindrowy diesel 6,6 l. W Mannheim John Deere produkuje od przejęcia firmy Heinrich Lanz w 1956 roku. Podane moce to moce na WOM.
  30-series-sound-gard: >-
    Generacja, która zdefiniowała komfort w rolnictwie. We wrześniu 1972 roku John Deere zaprezentował rewolucyjną kabinę **Sound-Gard** — pierwszą zintegrowaną, dźwiękoszczelną kabinę w technice rolniczej z klimatyzacją, ogrzewaniem i tłumieniem drgań (maks. 80 dB(A) wewnątrz). Nazywana „Generation II". Modele 4030/4230/4430/4630 zastąpiły udane serie 4020/4320/4520/4620 i ustanowiły nowe standardy ergonomii dla całej branży.
  40-series-iron-horse: >-
    Modernizacja kabiny Sound-Gard. Modele 4040/4240/4440/4640/4840 przyniosły oszczędniejsze silniki, ulepszoną hydraulikę i przekładnię Quad-Range z częściową zmianą pod obciążeniem. Podane moce to moce na WOM, jak podawał je wtedy John Deere; 4840 miał 180 KM na WOM.
  50-series-1982: >-
    Kontynuacja serii 40 z naciskiem na oszczędność. Modele 4050/4250/4450/4650/4850 miały moc silnika ok. 130–215 KM (DIN), wolnossący lub turbodoładowany sześciocylindrowy silnik 7,6 l i przekładnie Quad-Range lub Power Shift.
  55-series-1988: >-
    Ostatnia seria dużych ciągników row-crop John Deere przed serią 7000. Modele 4055/4255/4455/4555/4755/4955 miały turbodoładowany sześciocylindrowy silnik 7,6 l; topowy 4955 miał moc silnika 230 KM (DIN), 200 KM na WOM.
  5000: >-
    Ciągniki użytkowe 5200, 5300, 5400 i 5500 z fabryki John Deere w Auguście (Georgia, USA), moc silnika ok. 45–85 KM. Prosta koncepcja dla mniejszych gospodarstw i usług komunalnych; wersje europejskie produkowała firma Carraro we Włoszech.
  5010-5020-5030: >-
    Zbiorcza pozycja kilku generacji ciągników użytkowych John Deere (serie 5015, 5020 i 5M). Silniki PowerTech, przekładnie synchronizowane.
  5m: >-
    Uniwersalna seria 5M (od 2009) z silnikami PowerTech i elektronicznie sterowaną hydrauliką. Od roku modelowego 2023 (USA) i 2024 (Europa) tworzą ją 5075M, 5095M, 5105M, 5120M i 5130M.
  5r: >-
    Seria użytkowa premium w dwóch generacjach: 5080R/5090R/5100R (2008–2013) i 5090R/5100R/5115R/5125R (2016–2022). Przekładnie CommandQuad lub bezstopniowa AutoPowr, sterowanie CommandARM.
  6000: >-
    Seria ciągników średniej klasy z Mannheim: czterocylindrowe 6100–6400 (od 1992, silniki 3,9 i 4,5 l) i sześciocylindrowe 6506, 6600, 6800 i 6900 (od 1994, silniki 5,9 i 6,8 l). Przekładnia PowrQuad, opcjonalna amortyzacja przedniej osi Triple Link Suspension.
  6010: >-
    Następca serii 6000, silniki PowerTech, przekładnia PowrQuad Plus 16x16. Rozszerzony wybór od 80 do 150 koni.
  6020: >-
    Całkowicie nowa platforma. Kabina ComfortGard, silnik PowerTech Plus z common-rail, opcjonalna przekładnia AutoQuad Plus i hydraulika z detekcją obciążenia (load sensing).
  6030-premium: >-
    Premium seria z technologią AutoPowr (CVT), pełnym zawieszeniem osi przedniej TLS, kabiną Premium i integracją z GreenStar 2.
  6m: >-
    Uniwersalna seria dla gospodarstw mieszanych w trzech generacjach (2012–2016, 2016–2019, 2019–2024). Silniki PowerTech 4,5 i 6,8 l, przekładnie AutoQuad, CommandQuad i AutoPowr. Od 2024 roku zastąpiły ją modele 6M 95–6M 250.
  6r: >-
    Uniwersalna seria premium w dwóch generacjach: 2012–2015 z silnikami PowerTech PVX (Stage IIIB) i 2015–2021 (Stage IV). Przekładnie AutoQuad, DirectDrive i bezstopniowa AutoPowr IVT, joystick CommandPRO, amortyzacja TLS Plus. Od listopada 2021 zastąpiły ją modele 6R 110–6R 250.
  6r-gen3: >-
    Obecna generacja 6R (od roku modelowego 2022) z Mannheim. Silniki PowerTech 4,5 l (4-cylindrowe, do 6R 150) i 6,8 l (6-cylindrowe) Stage V, przekładnie AutoQuad, DirectDrive i bezstopniowa AutoPowr, kabina CommandView 4. Na rok modelowy 2027 John Deere zapowiedział nowe duże modele 6R 180–6R 260.
  7000: >-
    Ciągniki row-crop 7600, 7700 i 7800 z fabryki Waterloo (1992–1997), moc silnika 130–170 KM. Poprzednicy serii 7010 i 7020.
  7010: >-
    Ciągniki row-crop drugiej generacji: silniki PowerTech 6,8 l, w 7710 i 7810 8,1 l, przekładnie PowrQuad Plus, AutoQuad, 19-biegowa PowerShift, a w dużych modelach także bezstopniowa IVT.
  7020: >-
    Silniki PowerTech z elektronicznym wtryskiem (7920 8,1 l), przekładnie AutoQuad, PowerShift i bezstopniowa AutoPowr IVT, którą John Deere oferował już w serii 7010.
  7030: >-
    Norma emisji Tier 3, silnik PowerTech Plus 6,8 L z 24-zaworową głowicą. Kabina Premium z wentylacją, klimatyzacją i elektronicznie regulowanym fotelem.
  7r: >-
    Seria row-crop 7R (2011–2019): pierwsza generacja 7200R–7280R (2011–2013), potem 7210R–7310R. Silniki PowerTech 6,8 i 9,0 l, przekładnie PowerQuad, AutoQuad, od roku modelowego 2014 e23 PowerShift, oraz bezstopniowa AutoPowr IVT. Od roku modelowego 2020 zastąpiła ją seria 7R 210–7R 350.
  7r-gen3: >-
    Obecna seria 7R (od roku modelowego 2020, 7R 350 od 2021): 7R 210–270 z silnikiem PowerTech PSS 6,8 l, 7R 290–350 z silnikiem PowerTech PVS 9,0 l, przekładnie e23 PowerShift lub bezstopniowa AutoPowr IVT, kabina CommandView 4. Stopnie mocy co 20 KM; w Europie oferowane są 7R 270–7R 350.
  8000: >-
    Legendarna „wielka zielona". Pierwszy row-crop powyżej 200 koni z nowoczesną kabiną, elektronicznie sterowaną hydrauliką i PowerShift 16/4.
  8010: >-
    Silnik PowerTech 8,1 L, przekładnia PowerShift 16/4, kabina ComfortGard Plus.
  8020: >-
    Nowa generacja z silnikiem PowerTech Plus, opcjonalna przekładnia IVT AutoPowr, aktywne zawieszenie osi przedniej ILS.
  8030: >-
    Norma emisji Tier 3 (PowerTech Plus 9,0 L), automatyczne prowadzenie **AutoTrac**, wyświetlacz GreenStar 2 1800/2630, kabina CommandView, zawieszenie osi przedniej TLS Plus, wersja gąsienicowa 8030T (8130T/8230T/8330T/8430T/8530T).
  8r-gen1: >-
    Pierwsza generacja 8R z wersją gąsienicową 8RT w trzech zestawach modeli: rok modelowy 2010 (8225R–8345R), 2011–2013 Interim Tier 4 (8235R–8360R) i 2014–2019 Final Tier 4 (8245R–8370R, od 2016 także 8400R). Silniki PowerTech 9,0 l, przekładnie PowerShift, od 2014 e23, oraz bezstopniowa AutoPowr IVT.
  8r-gen2: >-
    Całkowicie nowa platforma, silnik PowerTech PSS 9,0 L, przekładnia e23 / IVT / DirectDrive, kabina CommandView 4, wersje gąsienicowe 8RT i kołowe 8R. AutoPath i prowadzenie autonomiczne (CES 2022).
  8rx-4track: >-
    Czterogąsienicowa wersja serii 8R (od roku modelowego 2020): zamiast każdego koła osobna gumowa gąsienica dla niskiego nacisku na glebę i dużej siły uciągu. Silnik PowerTech PSX 9,0 l (od roku modelowego 2027 John Deere JD9) i kabina jak w 8R, przekładnie e23 lub AutoPowr IVT.
  9000: >-
    Przegubowe ciągniki 4WD dla dużych gospodarstw. Silniki PowerTech 8,1 l (9100), 10,5 l (9200) i 12,5 l (9300, 9400), przekładnia PowerShift 12/3.
  9020: >-
    Przegubowe ciągniki z silnikami PowerTech 8,1 l (9120) i 12,5 l, opcjonalne podwozie gąsienicowe 9020T, GreenStar 2. Model 9620 doszedł w roku modelowym 2004.
  9030: >-
    Przegubowe ciągniki z silnikami PowerTech 9,0 l (9230) i 13,5 l, AutoTrac i GreenStar 3.
  9r-gen1: >-
    Pierwsza generacja 9R/9RT. W latach 2012–2014 modele 9360R–9560R, od roku modelowego 2015 9370R–9620R. Silniki John Deere 9,0 l (9370R) i 13,5 l (9420R–9520R), Cummins QSX15 tylko w 9570R i 9620R. Wersje gąsienicowe 9RT (dwie gąsienice) i od 2016 9RX (cztery gąsienice).
  9r-gen2: >-
    Obecna generacja 9R/9RT/9RX (od roku modelowego 2022). Silniki John Deere JD14 (13,6 l) z przekładnią e18 PowerShift, a od roku modelowego 2025 JD18 (18,0 l) z przekładnią e21 PowerShift, który napędza 9RX 710, 770 i 830. Wersje gąsienicowe 9RT (dwie gąsienice) i 9RX (cztery gąsienice).
  9rx:
    name: "9RX 4-track (2015–2021, osobna seria)"
    description: >-
      Pierwsza generacja przegubowego czterogąsienicowego 9RX, zaprezentowana w sierpniu 2015 (dostawy od wiosny 2016): modele 9470RX i 9520RX z silnikiem John Deere 13,5 l, 9570RX i 9620RX z silnikiem Cummins QSX15, przekładnia e18 PowerShift. Od roku modelowego 2022 9RX przeszedł do nowej generacji 9R.
  cts: >-
    Technologia hybrydowa CTS (Cylinder Tine Separator) — połączenie klasycznego bębna i dwóch rotorów. Następca serii 9000/9500/9600.
  9000-kombajn: >-
    Klasyczny bęben-wytrząsacz, typowa amerykańska ciężka seria.
  wts: >-
    Europejska generacja kombajnów, klasyczny system separacji z ulepszonymi wytrząsaczami i rotacyjnym doseparatorem.
  9000-sts: >-
    Rewolucyjna jednorotorowa technologia STS (Single Tine Separator). Od 9660 STS po 9880i STS.
  s-series: >-
    Premium seria jednorotorowych kombajnów. Silnik JD PowerTech / Cummins 13,5 L, napęd hydrostatyczny, ActiveYield, automatyka HarvestSmart, wyświetlacz Gen 4.
  t-series: >-
    Europejski klasyczny kombajn z wytrząsaczami (Walker). Silnik JD PowerTech 6,8/9,0/13,5 L, przekładnia ProDrive, pięć wytrząsaczy.
  w-series: >-
    Ekonomiczna seria europejska z klasyczną separacją, 4 lub 5 wytrząsaczy, silnik JD PowerTech 6,8 L.
  x-series: >-
    Rewolucyjny dwurotorowy system Dual Separator. Największa przepustowość i najniższe straty w klasie. Silnik JD PowerTech 13,6 L, AutoMaintain, HarvestVision.
  6000-rezacky: >-
    Pierwsze nowoczesne sieczkarnie samojezdne John Deere produkowane w Zweibrücken (Niemcy). Po przejęciu niemieckiej firmy Hesston/Heesemann i know-how o paszach. Silniki PowerTech 8,1–12,5 L, mechaniczny napęd walców, klasyczny metalowy wyrzutnik.
  7000-rezacky: >-
    Modernizacja z elektronicznym sterowaniem zespołu tnącego, automatyczna regulacja długości sieczki AutoLOC i ulepszony system KernelStar do zgniatania ziaren kukurydzy. Silnik PowerTech Tier 3, kabina ComfortGard.
  7050-rezacky: >-
    Generacja 7050 przyniosła AutoLOC II, czujnik HarvestLab NIR do analizy suchej masy i składników w czasie rzeczywistym oraz integrację z GreenStar 2. Silniki Tier 3, moce od 360 do 625 koni.
  8000-rezacky: >-
    Generacja 8000 przyniosła całkowicie nowy przepływ maszyny — zespół tnący o 25 % większy, nowy system KernelStar 2 (zgniatacz ziarna), HarvestLab 3000 i integrację z JDLink. Silnik JD PowerTech 9,0 / 13,5 / 19,0 L Tier 4.
  9000-rezacky: >-
    Flagowa seria sieczkarni samojezdnych. **9900** z silnikiem 24,2 L Liebherr i mocą ponad 1 000 koni to najwydajniejsza sieczkarnia samojezdna na świecie. AutoLOC III, KernelStar 3, HarvestLab 3000, w pełni zintegrowany AutoTrac, systemy kamer i JDLink Connect.
  4730-postrikovace: >-
    Pierwsza nowoczesna generacja opryskiwaczy samojezdnych John Deere na rynek europejski. Produkowane w Waterloo (USA) i Horst (Holandia). Silnik PowerTech, cztery koła z niezależnym napędem (HydroHandle), zbiornik 1 500–4 540 l. Modele 4730/4830/4930 zapewniły zakres mocy od 200 do 360 koni.
  r-series-postrikovace: >-
    Aktualna generacja opryskiwaczy samojezdnych. Modele R4030/R4040i/R4045i oraz amerykańska seria R4044/R4060/R4150. Silnik JD PowerTech, BoomTrac Pro (automatyczna regulacja wysokości belek), indywidualne załączanie dysz (ExactApply, See & Spray), AutoTrac, integracja z Operations Center.

models:
  john-deere-5010: >-
    Pierwszy John Deere, który oficjalnie przekroczył 100 koni. Duży ciągnik terenowy przeznaczony dla zachodnich równin USA.
  john-deere-4020: >-
    Ikona amerykańskiej mechanizacji rolnictwa lat 60. Przekładnia Power Shift z 8 biegami pod obciążeniem była rewolucyjna. Jeden z najcenniejszych kolekcjonerskich ciągników John Deere.
  john-deere-4430: >-
    Bestseller ery Sound-Gard. Przekładnia Quad-Range lub Power Shift, silnik turbo 125 KM. Wyprodukowano ponad 95 000 sztuk.
  john-deere-4440: >-
    Najbardziej ikoniczny John Deere lat 70. i 80. Power Shift, Sound-Gard II, turbo 7,6 L. Synonim niezawodności.
  john-deere-8r-410: >-
    Flagowy model. Kabina CommandView 4, AutoPath, hydraulika 435 l/min, tylny podnośnik 12 000 kg. IVT Boost do 428 KM.
  john-deere-8rx-410: >-
    Flagowy model czterogąsienicowy. Ten sam silnik co 8R 410, cztery gumowe gąsienice dla maksymalnego uciągu i minimalnego ugniatania gleby.
  john-deere-fh-7950: >-
    Najwydajniejsza sieczkarnia samojezdna swoich czasów — ponad 800 koni z silnika 19,0 L.
  john-deere-fh-9900: >-
    Flagowa sieczkarnia samojezdna. Silnik V12 24,2 L Liebherr, zbiór do 12 rzędów, przepustowość ponad 400 t/h zielonej masy. Symbol siły w europejskim rolnictwie.
  john-deere-4730: >-
    Zbiornik 3 000 l, belki 24/27/28 m.
  john-deere-4830: >-
    Zbiornik 3 800 l, belki 27/30 m.
  john-deere-4930: >-
    Zbiornik 4 540 l, belki 36 m.
  john-deere-4940: >-
    Tier 4 Final. Zbiornik 4 540 l.
  john-deere-r4030: >-
    Zbiornik 3 000 l, belki 24–28 m.
  john-deere-r4040i: >-
    Zbiornik 4 000 l, belki 27–36 m, system izolowany.
  john-deere-r4045i: >-
    Zbiornik 4 500 l, belki 30–40 m, ExactApply.
  john-deere-r4150i: >-
    Flagowy model. Zbiornik 5 700 l, belki 36–40 m, See & Spray Premium.
