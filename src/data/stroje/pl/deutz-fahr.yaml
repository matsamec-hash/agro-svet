# PL overlay (opisy/pola) na strukturę cs. AI draft + edytor, wymaga review.

country: "Niemcy / Włochy"
description: >-
  Niemiecka marka z długą tradycją od 1864 roku (Deutz), fuzja z Fahr w 1969. Część grupy SDF (Same Deutz-Fahr) z włoskim udziałem. Ciągniki produkowane w Lauingen (Niemcy) i Treviglio (Włochy). Charakterystyczne zielone malowanie. Flagową jest seria 9.

categories:
  traktory: "Ciągniki"
  kombajny: "Kombajny"

series:
  06-series: >-
    Seria zielonych ciągników Deutz (Klöckner-Humboldt-Deutz) z końca lat 60. i z lat 70. z chłodzonymi powietrzem silnikami Deutz serii 912. Modele D 4006–D 13006 obejmowały moc ok. 35–120 KM; topowy D 13006 miał turbodoładowany sześciocylindrowy BF6L 912. Typy D 5206–D 7206 pojawiły się w 1974 roku.
  dx: >-
    Historyczna klasyka Deutz-Fahr z powietrzem chłodzonymi silnikami Deutz F3L / F4L / F6L 912 i 913. Ikoniczna seria podzielona na klasy DX 3 (kompaktowy 3-cylindrowy), DX 4 (4-cylindrowy), DX 6 (6-cylindrowy) oraz flagowe DX 7/8. W 1983 roku modernizacja z wyższą mocą.
  agrostar: >-
    Poprzednik serii Agrotron. Zmodernizowany następca serii DX z powietrzem chłodzonymi silnikami Deutz. Reprezentacyjna „gwiazda" lat 90. z charakterystycznym designem i otwartą kabiną StarCab.
  agroxtra: >-
    Seria AgroXtra nawiązywała do DX 4 i AgroPrimy. Czterocylindrowe 4.47 i 4.57 miały turbodoładowany, chłodzony powietrzem silnik Deutz BF4L 913 (4,1 l), sześciocylindrowe 6.07 i 6.17 wolnossące F6L 912/913.
  agrotron-legacy: >-
    Ikoniczna generacja Agrotron. **MK1** (1995–1997) miała rewolucyjną przeszkloną kabinę i silnik Deutz z problematyczną przekładnią ZF Eccom. **MK2** (1997–2000) usunęła problemy z niezawodnością. **MK3** (2000–2003) wprowadziła modele 80–230, a w **2001 pierwszy Agrotron TTV** z CVT (płynna przekładnia bezstopniowa).
  agroplus: >-
    Kompaktowe ciągniki uniwersalne. Typy 60 i 70 z chłodzonymi powietrzem silnikami Deutz oraz typy 75, 85, 95 i 100 z chłodzonymi cieczą silnikami Deutz 1012 produkowano równolegle mniej więcej w latach 1997–2005; Agroplus 100 miał sześć cylindrów. W latach 2005–2007 ofertę uzupełniały wąskie wersje Agroplus S 70–S 100 do winnic i sadów.
  agrofarm: >-
    Ciągniki uniwersalne dla mniejszych gospodarstw. Agrofarm 85 i 100 (2007–2008) z silnikami Deutz, następnie Agrofarm 410, 420 i 430 oraz bezstopniowe Agrofarm TTV 420 i TTV 430 (od 2008). Seria Agrofarm G (G 85, G 100, G 115, G 410, G 430) ma silniki SDF 1000.4 o pojemności 4,0 l.
  agrotron-m: >-
    Premium średniej wielkości seria. M410/M420 to 4-cylindrowe, M600–M650 6-cylindrowe z silnikami Deutz TCD 2012 / TCD 2013 i wtryskiem DCR (Deutz Common Rail). Dostępne także w wariancie Profiline.
  agrotron-k: >-
    Następca najmniejszych Agrotronów MK3 z chłodzonymi cieczą silnikami Deutz 2012: czterocylindrowe (K90, K100, K120, K410, K420, K430) i sześciocylindrowe (K110, K610). Wersja Profiline z automatycznym powershiftem, hydrauliką load-sensing i zarządzaniem uwrociem.
  5g: >-
    Ta pozycja łączy eksportową serię 5G (5090.4 G, 5100 G, 5110 G) z silnikami SDF, oferowaną przez Deutz-Fahr poza UE, oraz modele 5120 (2013–2016) i 5125 (od 2016) z europejskiej serii 5 z silnikiem Deutz 3,6 l.
  6g: >-
    Seria 6 (Agrotron 6): czterocylindrowy 6140 od 2013 roku i sześciocylindrowe 6155–6215 z silnikiem Deutz TCD 6.1 z nowej serii 6 zaprezentowanej w lipcu 2016 (156–226 KM), przekładnie RCshift lub bezstopniowa TTV. Eksportowa seria 6G (6155 G–6205 G) to inna seria. Obecnie Deutz-Fahr oferuje następców 6160–6230 oraz serie 6.4 i 6C.
  7: >-
    Seria premium z silnikiem Deutz TCD 6.1 i bezstopniową przekładnią TTV. Projekt Giugiaro. Od lipca 2016 tworzą ją 7230 TTV i 7250 TTV.
  8: >-
    8280 TTV (od 2020 roku) z silnikiem Deutz TTCD 6.1 z podwójnym doładowaniem i przekładnią TTV. Nowa seria 8 zaprezentowana w listopadzie 2025 (8310 TTV i 8340 TTV) ma silnik FPT N67 o pojemności 6,7 l i kabinę SigmaVision.
  9: >-
    Flagowa seria Deutz-Fahr, zaprezentowana na Agritechnice 2013 i produkowana od 2015 roku w Lauingen. Silnik Deutz TTCD 7.8 z dwustopniowym doładowaniem, bezstopniowa przekładnia TTV, moc maksymalna 295–336 KM. Projekt Giugiaro.
  9-warrior: >-
    Specjalna edycja Warrior flagowej serii 9. Pakiet oświetlenia LED 4. generacji, wygodne siedzenie Evolution Active, automatyczna klimatyzacja, mata DEUTZ-FAHR w czarnym kolorze. Dostępne także w klasycznym zielonym kolorze.
  6c: >-
    Kompaktowa 4-cylindrowa seria 6 Series z silnikami Stage V i kabiną TopVision. Trzy warianty przekładni: Powershift 3-biegowy, RVshift pełny powershift 20F/16R lub CVT TTV. Hydraulika load-sensing 120 l/min, udźwig tylnego podnośnika 7 000 kg.
  5d: >-
    Seria podstawowa z trzycylindrowym silnikiem FARMotion 35 i mechaniczną przekładnią 15+15 lub 30+15, maks. 40 km/h. Moce w katalogu odpowiadają wersji z 2018 roku; od 2021 produkowana jest wersja Stage V o mocy maks. 66–102 KM.
  m-series-old: >-
    Starsza generacja klasycznych konwencjonalnych kombajnów przed modernizacją do Topliner. Powietrzem chłodzone diesle Deutz F5L / F6L 912 i 913. Modele M1080, M2385, M2480, M2580, M2680, M2685, M2780 oraz M34 / M36 dla dużych gospodarstw.
  starliner: >-
    Średnie konwencjonalne kombajny Starliner. Klasyczne 5-bębnowe młocarniaki ze sprzęgłem pasowym bezpośrednim. Równoległa generacja do Topliner dla niższej klasy mocy.
  htc-old: >-
    Duże konwencjonalne kombajny z systemem APS (Advanced Propulsion System) — podwójny bęben przyspieszający i długie wytrząsacze. Spośród modeli 5690 HTS i 6090 HTS najwydajniejszy był 7545 RTS z separacją rotacyjną.
  topliner: >-
    Legendarne konwencjonalne kombajny. W latach 90. dominowały na rynku środkowoeuropejskim.
  c-series-old: >-
    Średnie i duże konwencjonalne kombajny. Silnik MTU/Deutz, separator rotacyjny.
  c-series-new: >-
    Nowa generacja kombajnów. Silnik Deutz TCD 6.1 L i 12.0 L, system hybrydowy w flagowym C9000 (APS + rotor).
