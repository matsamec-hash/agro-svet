# PL overlay (opisy/pola) na strukturę cs. AI draft + edytor, wymaga review.

country: "Niemcy / Włochy"
description: >-
  Niemiecka marka z długą tradycją od 1864 roku (Deutz), fuzja z Fahr w 1969. Część grupy SDF (Same Deutz-Fahr) z włoskim udziałem. Ciągniki produkowane w Lauingen (Niemcy) i Treviglio (Włochy). Charakterystyczne zielone malowanie. Silna pozycja w serii 5G i 6G na rynku środkowoeuropejskim, flagową jest seria 9.

categories:
  traktory: "Ciągniki"
  kombajny: "Kombajny"

series:
  06-series: >-
    Ikoniczna seria zielonych ciągników Deutz z końca lat 60. i 70. — najważniejszy sukces komercyjny marki z ponad 600 000 wyprodukowanymi egzemplarzami na całym świecie. Cała seria wykorzystywała powietrzem chłodzone silniki Diesla Deutz F3L / F4L / F6L / F8L / F10L (513 i 413), co czyniło ciągniki niezależnymi od chłodziwa — zaleta w obszarach o ekstremalnym klimacie. Na rynku środkowoeuropejskim były szeroko importowane jako premium alternatywa dla Zetorów, cenione za prostą konserwację i niezawodność. Modele D 4006, D 4506, D 5206, D 6206, D 6806, D 7206, D 7506, D 8006, D 9006, D 10006 oraz flagowy D 13006 obejmowały moc od 40 do 160 KM.
  dx: >-
    Historyczna klasyka Deutz-Fahr z powietrzem chłodzonymi silnikami Deutz F3L / F4L / F6L 912 i 913. Ikoniczna seria podzielona na klasy DX 3 (kompaktowy 3-cylindrowy), DX 4 (4-cylindrowy), DX 6 (6-cylindrowy) oraz flagowe DX 7/8. W 1983 roku modernizacja z wyższą mocą.
  agrostar: >-
    Poprzednik serii Agrotron. Zmodernizowany następca serii DX z powietrzem chłodzonymi silnikami Deutz. Reprezentacyjna „gwiazda" lat 90. z charakterystycznym designem i otwartą kabiną StarCab.
  agroxtra: >-
    Seria przejściowa między AgroStar a Agrotron. Silnik Deutz 6-cylindrowy powietrzem chłodzony (BF6L).
  agrotron-legacy: >-
    Ikoniczna generacja Agrotron — Ciągnik Roku 1996. **MK1** (1995–1997) miała rewolucyjną przeszkloną kabinę i silnik Deutz z problematyczną przekładnią ZF Eccom. **MK2** (1997–2000) usunęła problemy z niezawodnością. **MK3** (2000–2003) wprowadziła modele 80–230, a w **2001 pierwszy Agrotron TTV** z CVT (płynna przekładnia bezstopniowa).
  agroplus: >-
    Kompaktowe ciągniki użytkowe oparte na technologii SAME. Pierwsza generacja 60/70/80 z powietrzem chłodzonymi silnikami Deutz (1996–2004), druga generacja 75/85/95/100 z wodą chłodzonymi turbodieslami. Agroplus 100 był pierwszym 6-cylindrowym w klasie kompaktowej. Warianty S (specjalnie wąskie) dla winiarstwa i sadownictwa, F Keyline do prac wąskimi ciągnikami.
  agrofarm: >-
    Podstawowa seria użytkowa dla mniejszych gospodarstw. Pierwsza generacja 85/95/100 i 410/420/430 (2008–2013) z silnikami Deutz Tier 3, zaawansowany wariant TTV z przekładnią CVT. Od 2018 seria G (85/100/115) z nowoczesnymi silnikami SDF i normą emisji Stage V.
  agrotron-m: >-
    Premium średniej wielkości seria. M410/M420 to 4-cylindrowe, M600–M650 6-cylindrowe z silnikami Deutz TCD 2012 / TCD 2013 i wtryskiem DCR (Deutz Common Rail). Dostępne także w wariancie Profiline.
  agrotron-k: >-
    Następca najmniejszych Agrotron MK3. 4-cylindrowe ciągniki z elektronicznie sterowanymi wodą chłodzonymi silnikami Deutz. Wersja Profiline z automatycznym powershift, hydrauliką load-sensing i automatyzacją zarządzania obszarami pracy.
  5g: >-
    Użytkowa seria dla małych i średnich gospodarstw. Silnik Deutz TCD 3.6 / 4.1 L 4-cylindrowy, przekładnia Powershift 60/60 (5 biegów x 4 grupy x 3 rewersy).
  6g: >-
    Uniwersalna średnia seria. Silnik Deutz TCD 4.1 L / 6.1 L, przekładnia Powershift 6x6 lub RCShift 50/50 z rewersją, opcjonalna CVT (wariant TTV).
  7: >-
    Premium seria row-crop. Silnik Deutz TCD 6.1 L, przekładnia Powershift lub CVT (TTV). Projekt Giugiaro (włoski).
  8: >-
    Nowa generacja po długiej przerwie w tej klasie. Silnik Deutz TCD 9.0 L, przekładnia TTV CVT. Nowa kabina MaxiView.
  9: >-
    Flagowa seria row-crop. Silnik Deutz TCD 7.8 L, przekładnia CVT (TTV). Projekt Giugiaro. Kabina MaxiVision 4 z panoramicznym przeszklonym dachem.
  9-warrior: >-
    Specjalna edycja Warrior flagowej serii 9. Pakiet oświetlenia LED 4. generacji, wygodne siedzenie Evolution Active, automatyczna klimatyzacja, mata DEUTZ-FAHR w czarnym kolorze. Dostępne także w klasycznym zielonym kolorze.
  6c: >-
    Kompaktowa 4-cylindrowa seria 6 Series z silnikami Stage V i kabiną TopVision. Trzy warianty przekładni: Powershift 3-biegowy, RVshift pełny powershift 20F/16R lub CVT TTV. Hydraulika load-sensing 120 l/min, udźwig tylnego podnośnika 7 000 kg.
  5d: >-
    Seria podstawowa z silnikiem FARMotion 35 (3-cylindrowy) zgodnym z normą emisji Stage V. Elektroniczny common-rail 2 000 bar, recyrkulacja spalin, intercooler i DOC. Dwie mechaniczne 5-biegowe przekładnie (15+15 lub 30+15), max. 40 km/h przy 1 870 obr/min.
  m-series-old: >-
    Starsza generacja klasycznych konwencjonalnych kombajnów przed modernizacją do Topliner. Powietrzem chłodzone diesle Deutz F5L / F6L 912 i 913. Modele M1080, M2385, M2480, M2580, M2680, M2685, M2780 oraz M34 / M36 dla dużych gospodarstw.
  starliner: >-
    Średnie konwencjonalne kombajny Starliner. Klasyczne 5-bębnowe młocarniaki ze sprzęgłem pasowym bezpośrednim. Równoległa generacja do Topliner dla niższej klasy mocy.
  htc-old: >-
    Duże konwencjonalne kombajny z systemem APS (Advanced Propulsion System) — podwójny bęben przyspieszający i długie wytrząsacze. Spośród modeli 5690 HTS i 6090 HTS najwydajniejszy był 7545 RTS z separacją rotacyjną.
  topliner: >-
    Legendarne konwencjonalne kombajny. W latach 90. dominowały na rynku środkowoeuropejskim.
  c-series-old: >-
    Średnie i duże konwencjonalne kombajny. Silnik MTU/Deutz, separator rotacyjny.
  c-series-new: >-
    Nowa generacja kombajnów. Silnik Deutz TCD 6.1 L i 12.0 L, system hybrydowy w flagowym C9000 (APS + rotor).
