# PL overlay (opisy/pola) na strukturę cs. AI draft + edytor, wymaga review.

country: "Niemcy"
description: >-
  Niemiecki rodzinny producent ze Spelle (Dolna Saksonia) od 1906 roku, światowy specjalista w zbiorze pasz i słomy. Flagowe produkty: kosiarki EasyCut i samobieżne BiG M, prasy zwijające Comprima, prasy kostkujące BiG Pack (do 120×130 cm) oraz samobieżne sieczkarnie BiG X o mocy ponad 1 100 KM. Dodatkowo zgrabiarki Swadro, przetrząsacze Vendro oraz samozbierające wozy ZX/RX/MX.

categories:
  zaci-stroje: "Kosiarki"
  obracece: "Przetrząsacze"
  shrnovace: "Zgrabiarki"
  lisy-valcove: "Prasy zwijające"
  lisy-hranolove: "Prasy kostkujące"
  rezacky-samojizdne: "Samobieżne sieczkarnie"
  samosberaci-vozy: "Samozbierające wozy"
  navesy-valnik: "Przyczepy skrzyniowe"

series:
  easycut-f: >-
    EasyCut F — czołowo zawieszane kosiarki tarczowe do kombinacji z tylną kosiarką motylkową. Szerokość robocza 2,80–4,00 m, dostępne wersje z kondycjonerem palcowym (CV) lub wałkowym (CR) oraz taśmami zbierającymi (Collect). Nowy SafeCut INSIDE chroni każdą tarczę osobnym zabezpieczeniem przed najechaniem na przeszkodę.
  easycut-r: >-
    EasyCut R — tylno zawieszane kosiarki tarczowe o szerokości roboczej 2,40–3,60 m. DuoGrip podwójne centralne zawieszenie zapewnia idealne dopasowanie do terenu, gładka listwa tnąca z dużymi ślizgowymi talerzami. Wersje CV (kondycjoner palcowy) i CR (kondycjoner wałkowy) przeznaczone do intensywnej produkcji siana i kiszonki.
  easycut-b: >-
    EasyCut B — ciągnione boczne i motylkowe kombinacje kosiarek dla średnich i dużych gospodarstw. Szerokość od 7,3 m (B 750) do 10,1 m (B 1000) w układzie motylkowym, modele Collect dodatkowo wyposażone w taśmy poprzeczne do tworzenia jednego dużego rzędu. Hydrauliczne odciążenie i centralna regulacja nacisku należą do wyposażenia standardowego.
  big-m: >-
    BiG M — samobieżna jednostka kosząca 4×4 (cztery turbiny chłodzące hydromotory), unikalna koncepcja w świecie zbioru pasz. Trzy jednostki koszące o szerokości 13,2 m, kondycjoner wałkowy lub palcowy, silnik Mercedes-Benz 449 KM (BiG M 450) i 530 KM (BiG M 500). Wydajność powierzchniowa ponad 5 ha/h, idealna dla dużych gospodarstw i biogazowni.
  vendro: >-
    Vendro — generacja przetrząsaczy o szerokości roboczej 4,7–13,1 m, dostępne jako zawieszane (Vendro 470/560/680/790) oraz ciągnione (Vendro 820, 1020, 1120). Wirniki OptiTurn z asymetrycznymi palcami zapewniają delikatne przetrząsanie z minimalną utratą liści, hydrauliczne składanie przy granicznym rozrzucie chroni krawędzie pola.
  swadro-s: >-
    Swadro S — jednowirnikowe zgrabiarki o szerokości roboczej 3,8–4,6 m dla małych i średnich gospodarstw. Bezobsługowa przekładnia Jet Effect, zawieszenie trzypunktowe i 3D dopasowanie do terenu dzięki tandemowym podwoziom. Lekka i zwrotna konstrukcja odpowiednia także na zbocza.
  swadro-tc: >-
    Swadro TC — dwuwirnikowe ciągnione zgrabiarki z bocznym (TC 680/760) lub centralnym (TC 880/930/1250) rzędem. Przekładnia DuraMax w kąpieli olejowej, płynna hydrauliczna regulacja szerokości rzędu i wysokość transportowa poniżej 4 m. TC 1250 osiąga szerokość do 12,5 m i służy do zbioru o dużej wydajności.
  swadro-ts: >-
    Swadro TS — średniej wielkości jednowirnikowe zgrabiarki z osią tandemową i centralnym rzędem. Szerokość robocza 6,2–7,4 m, urządzenie wyrównujące wirnika OptiTurf zapewnia stałą wysokość palców nawet na nierównym terenie.
  bellima: >-
    Bellima — podstawowa seria pras komorowych o średnicy beli 1,25 m, komora łańcuchowa z 17 stalowymi listwami i zbieracz o szerokości 1,85 m. Skierowana do małych i średnich gospodarstw, gdzie oczekuje się prostej obsługi bez elektroniki oraz zbioru słomy lub siana z mniejszych areałów.
  fortima: >-
    Fortima — prasy komorowe (F) oraz zmiennokomorowe (V) średniej klasy. Komora łańcuchowa z prętami do twardych bel siana lub słomy, rotor tnący MultiCut z 17 nożami oraz zintegrowany zgarniacz do łatwego odłączania beli. Zbieracz EasyFlow bez krzywek zapewnia płynny odbiór nawet w ciężkich rzędach.
  comprima: >-
    Comprima — flagowa seria pras zwijających z opatentowaną komorą taśmową NovoGrip (pasy lamelowe z segmentami poliuretanowymi), która prasuje belę już od średnicy 0,5 m. Modele V 150/180 XC ze zmienną komorą (1,25–1,80 m), F 125/155 XC z komorą stałą. Wersje XC mają rotor tnący z 17 nożami, zintegrowane owijanie siatką lub folią oraz duży zbieracz 2,15 m.
  varipack: >-
    VariPack — nowa generacja zmiennokomorowych pras zwijających (wprowadzona w 2020) zastępująca starsze modele Comprima V w segmencie klasycznych komór łańcuchowych. Średnica beli 1,00–1,65 m (V 165) lub 1,80 m (V 190), rotor tnący XCut z aż 26 nożami (XC), maksymalna przepustowość ponad 60 t/h. Skierowana do profesjonalnych dostawców i dużych gospodarstw prasujących słomę i siano.
  ultima: >-
    Ultima — światowo unikalna prasa-owijarka non-stop z przedkomorą, która płynnie przejmuje paszę podczas wyrzucania gotowej beli — ciągnik nie musi się zatrzymywać. Modele CF 155 XC (zmienna średnica) i F 155 XC (komora stała 1,55 m), zbieracz 2,35 m, rotor tnący 26 noży. Wydajność o 25% wyższa niż klasyczna prasa-owijarka, przeznaczona do wymagających komercyjnych zbiorów kiszonki.
  big-pack: >-
    BiG Pack — flagowa seria pras kostkujących wysokociśnieniowych Krone, dostępna w wymiarach kanału 80×70, 90×80, 90×120, 120×70, 120×90 oraz unikalny BiG Pack 4×4 (120×125 cm). Wersja HDP (High Density Press) zwiększa gęstość beli o 25%, VC (VariCut) dodaje rotor tnący z 26 nożami, wersja XC aż 51 noży. MultiBale produkuje 2–9 mniejszych beli w jednym kanale dla hodowli zwierząt gospodarskich. Profesjonalni dostawcy i duże gospodarstwa.
  big-x: >-
    BiG X — flagowa seria samobieżnych sieczkarni Krone z silnikami MTU/Liebherr 12,8–24,2 l i mocą od 490 do 1 156 KM (BiG X 1180 posiada rekord świata). Bęben tnący MaxFlow (28/36/40 noży, szerokość 800 mm), 16 noży VariStream z płynnie zmienną długością cięcia. StreamControl zmienna turbina wyrzutowa oraz OptiMaize rozdrabniacz ziaren do kukurydzianej kiszonki. Adaptery: EasyCollect (kukurydza 6–12 rzędów) i XCollect (z tarczowym systemem koszącym), XDisc 620 (bezpośredni zbiór zbóż).
  mx: >-
    MX — kombajnowe wozy zbierające/dawkowe o pojemności 32–40 m³ (DIN, niesprasowane). Rotor prasujący PowerLoad z 41 nożami do krótkiego cięcia 37 mm, hydraulicznie składane czoła GD (Grass Dosing) do łatwego opróżniania. Dla średnich gospodarstw łączących zbiór kiszonki i dozowanie paszy bezpośrednio do żłobu.
  rx: >-
    RX — wydajne samozbierające wozy nowej generacji (wprowadzone w 2020) o pojemności 36–49 m³. Zbieracz EasyFlow Pro 2,35 m bez krzywek, rotor tnący PowerCut z 53 nożami (krótkie cięcie 37 mm). System PowerLoad z aktywnym rotorem podającym, system ważenia i terminal ISOBUS w standardowym wyposażeniu.
  zx: >-
    ZX — flagowe dwuosiowe samozbierające wozy o dużej ładowności do profesjonalnego zbioru pasz i biogazowni. System PowerOff przesuwnego czoła rozładowuje wóz w 30 s, aluminiowe ściany zmniejszają masę własną. Hydraulicznie zawieszone zbieracz 2,12 m i rotor tnący 40 noży do krótkiego sieczkowania.
  tx: >-
    TX — rolnicze przyczepy skrzyniowe do transportu zebranych pasz i słomy między polem a silosowym żłobem lub stodołą. Hydraulicznie składane czoło, stalowa konstrukcja i hamulce pneumatyczne. Pojemność 46–56 m³ w zależności od modelu.
