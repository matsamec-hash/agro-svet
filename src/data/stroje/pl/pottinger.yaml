# PL overlay (opisy/pola) na strukturę cs. AI draft + edytor, wymaga review.

country: "Austria"
description: >-
  Austriacki rodzinny producent z szerokim portfolio maszyn do uprawy gleby (pługi Servo, Terradisc, Synkro, Lion), siewu (Aerosem, Terrasem, Vitasem) i przede wszystkim zbioru pasz (kosiarki Novacat, przetrząsacze Top, zgrabiarki Hit, prasy Impress, samozbierające wozy Jumbo i Faro). Siedziba w Grieskirchen, zakłady produkcyjne w Austrii, Czechach (Vodňany), Niemczech i Polsce.

categories:
  seti: "Siew i sadzenie"
  sklizen-picnin: "Zbiór pasz i słomy"
  zpracovani-pudy: "Uprawa gleby"

series:
  aerosem: >-
    AEROSEM to pneumatyczne siewniki Pöttinger przeznaczone do pracy w połączeniu z brona rotacyjną (Lion) lub samodzielnie. Charakteryzują się centralnym dystrybutorem, technologią IDS do wyłączania rzędów w koleinach oraz unikalną funkcją PCS (Precision Combi Seeding) do siewu kukurydzy w ramach uniwersalnego siewnika. Grupa docelowa to średnie i duże gospodarstwa potrzebujące wszechstronnej maszyny do zbóż i roślin rzędowych.
  terrasem: >-
    TERRASEM to flagowa seria kombinacji siewnych Pöttinger z zintegrowanym krótkim talerzowym podorywaczem, oponami zagęszczającymi i stopkami DUAL DISC. Maszyna w jednym przejeździe wykonuje płytką uprawę, wyrównanie, zagęszczenie i siew, co oszczędza czas i koszty. Wersje ciągnione C i V przeznaczone są dla dużych gospodarstw i profesjonalnych firm agro z naciskiem na wydajność i uniwersalność (zboża, rzepak, kukurydza z systemem siewu ISOBUS).
  vitasem: >-
    VITASEM to klasyczne mechaniczne siewniki Pöttinger z zębowym aparatem siewnym i możliwością agregacji z broną rotacyjną Lion (wariant M). Niezawodna technologia dla małych i średnich gospodarstw, które wymagają prostej obsługi, niskiej ceny zakupu i uniwersalnego zastosowania do zbóż i roślin drobnoziarnistych. Szerokości robocze 2,5–4 m pokrywają potrzeby zdecydowanej większości gospodarstw rodzinnych.
  eurocat: >-
    EUROCAT to bębnowe kosiarki Pöttinger przeznaczone do obszarów górskich i małych gospodarstw z lekkimi ciągnikami. Konstrukcja bębnowa lepiej znosiła kamienie i nierówności niż kosiarki tarczowe, miała jednak wyższe zużycie energii. Seria została stopniowo zastąpiona nowoczesnymi maszynami tarczowymi NOVACAT i NOVADISC, które oferują niższą wagę i lepszą jakość cięcia. Maszyny nadal pracują na tysiącach górskich gospodarstw w Austrii i Bawarii.
  hit: >-
    HIT (HEUTEDDER) to zgrabiarki Pöttinger w szerokim zakresie szerokości od 4,5 m (4 rotory) do 12,7 m (12 rotorów). Kluczowe technologie obejmują system DYNATECH z aerodynamicznym kształtem rotorów dla delikatnego zgrabiania oraz LIFTMATIC do płynnego podnoszenia rotorów na zakrętach bez kontaktu z darnią. Celem jest maksymalna jakość paszy przy minimalnych stratach liści w koniczynie i lucernie.
  impress: >-
    IMPRESS to pierwsza generacja pras walcowych Pöttinger wprowadzona w 2017 roku, zaprojektowana całkowicie od podstaw. Kluczową innowacją jest technologia LIFTUP z rotorem w górnej pozycji (prasa otwiera się do góry), dzięki czemu prasa ma najkrótszą drogę materiału i wysoką przepustowość. Dostępne warianty F (fix-chamber 125 cm), V (zmienny 155/185 cm) oraz kombinacje z owijarką (FC PRO, VC PRO). Grupa docelowa to wymagające gospodarstwa i usługi, które oczekują wysokiej wydajności i doskonałej gęstości beli.
  jumbo: >-
    JUMBO to flagowa seria samozbierających wozów Pöttinger o największych pojemnościach w portfolio (38–50 m³ DIN). Maszyny przeznaczone dla dużych gospodarstw i usług, które potrzebują maksymalnej wydajności przy zbiorze pasz. Kluczowe cechy: krótka droga materiału, aparat tnący z 45 nożami (długość cięcia 4 cm), automatyczne ostrzenie, trzyosiowe osie z wymuszonym skrętem i hydrauliczne zawieszenie. Modernizacja 2022 przyniosła nowe HMI i integrację z sekcyjnym sterowaniem ISOBUS.
  faro: >-
    FARO to średniej wielkości samozbierające wozy Pöttinger przeznaczone dla średnich gospodarstw, które nie potrzebują pojemności flagowej serii JUMBO. Pojemność 25–35 m³ DIN, aparat tnący z 31 nożami, dwuosiowe osie. Korzystniejsza cenowo alternatywa z niższymi wymaganiami względem ciągnika (od 100 KM). Wariant COMBILINE umożliwia użycie jako samozbierający lub jako wóz transportowy do sieczki z sieczkarni.
  novacat: >-
    NOVACAT to kluczowa seria tarczowych kosiarek Pöttinger obejmująca pełne spektrum od małych zawieszanych maszyn 2,6 m do kombinacji kosiarek 10 m z przednim i dwoma tylnymi zespołami tnącymi. Kluczowe technologie: napęd Y DRIVE z przestrzenią do mieszania paszy, hydrauliczne odciążenie (Hydraulic Compensation), kondycjoner ED (palcowy) lub RC (walcowy) oraz system ochrony przed kolizją NONSTOP LIFT. Flagowy model A10 oferuje zmienną szerokość roboczą 9,52–10,02 m z automatyczną kontrolą nakładania.
  novadisc: >-
    NOVADISC to lekkie tarczowe kosiarki Pöttinger bez kondycjonera, przeznaczone do obszarów górskich, małych gospodarstw i hodowców koni, którzy preferują naturalne przesychanie paszy w rzędzie. Niska waga (250–500 kg) umożliwia zastosowanie także do ciągników od 40 KM. Szerokości robocze 2,2–3,5 m, 4–7 tarcz. Dostępna cenowo alternatywa dla NOVACAT do gospodarki ekstensywnej.
  top: >-
    TOP to najszersza seria przetrząsaczy Pöttinger obejmująca jednorotorowe (3,4–4,6 m), dwurotorowe z bocznym układaniem (6,8–9,5 m), czterorotorowe z centralnym układaniem (8,8–12,5 m) oraz jeden środkowy przetrząsacz dla maksymalnej szerokości roboczej. Kluczowe technologie: TOPTECH PLUS dla przekładni w kąpieli olejowej, koło kopiujące MULTITAST do delikatnego kopiowania terenu oraz hydrauliczne składanie do pozycji transportowej. Szerokie pokrycie potrzeb od małych gospodarstw po profesjonalne przedsiębiorstwa.
  fox: >-
    FOX to seria kompaktomatów Pöttinger przeznaczona dla małych i średnich gospodarstw z ciągnikami 80–130 KM. Połączenie przednich listew ślizgowych, dwóch rzędów tarcz i tylnego wałka zapewnia przygotowanie łóżka siewnego w jednym przejeździe. Szerokość 3 m, wersja zawieszana. Atrakcyjne cenowo rozwiązanie dla gospodarstw, które nie potrzebują szerokozakresowych maszyn TERRADISC lub TERRIA.
  lion: >-
    LION to seria solidnych bron rotacyjnych Pöttinger do wymagającego przygotowania łóżka siewnego, zwłaszcza po orce, na ciężkich glebach i w połączeniu z siewnikami AEROSEM lub VITASEM. Szerokości 2,5–6 m, przekładnie do mocy do 360 KM. Wersje CLASSIC, MASTER i SUPERIOR różnią się wytrzymałością i maksymalną dopuszczalną mocą ciągnika. Kluczowe cechy: szybko wymienne noże QUICKFIT, zintegrowane przednie wałki i kompatybilność z układem 3-punktowym siewników.
  servo: >-
    SERVO to flagowa seria obrotowych pługów Pöttinger, od dawna uznawana za jedne z najwyższej jakości pługów na rynku. Asortyment obejmuje pługi zawieszane (3–6 korpusów), półzawieszane (5–9 korpusów) i ciągnione (do 14 korpusów). Kluczowe technologie: TRACTION CONTROL do automatycznej regulacji docisku, SERVOMATIC plus do łatwej regulacji szerokości i kąta, hydrauliczne zabezpieczenie przed przeciążeniem NONSTOP oraz uniwersalne korpusy orne do różnych typów gleb. Generacja SERVO 3000/4000 (2020+) przyniosła 50% wzrost sztywności ramy.
  synkro: >-
    SYNKRO to wielorzędowe kultywatory zębowe Pöttinger do płytkiej podorywki i głębokiego spulchniania do 30 cm. Dostępne są warianty 2-, 3- i 4-rzędowe o szerokościach 2,5–6 m (zawieszane) i do 8 m (ciągnione). Kluczowe cechy: hydrauliczne zabezpieczenie przed przeciążeniem NONSTOP, szeroka oferta zębów (wąskie/szerokie/dłutowe) oraz wał tylny (rurowy, palcowy, gumowy). Uniwersalna maszyna do całego cyklu uprawy gleby między zbiorem a siewem.
  terradisc: >-
    TERRADISC to seria krótkich talerzowych podorywaczy Pöttinger do szybkiej i jakościowej płytkiej uprawy ścierniska (5–15 cm). Duże talerze (510 lub 580 mm) z indywidualnym mocowaniem na gumowych silentblokach zapewniają dobre kopiowanie terenu nawet na kamienistych glebach. Szerokości 3–6 m (zawieszane, składane, ciągnione). Flagowa maszyna dla średnich i dużych gospodarstw do likwidacji ścierniska, wymieszania nawozów organicznych i przygotowania do siewu ozimin.
  terria: >-
    TERRIA to nowa seria głębokich kultywatorów zębowych Pöttinger wprowadzona w 2020 roku, przeznaczona do głębokiej uprawy gleby 5–35 cm. Konstrukcja czterorzędowa z dużym rozstawem między rzędami (95 cm) zapewnia doskonały przepływ masy organicznej i słomy. Solidna konstrukcja z szybko wymiennymi zębami i szerokim wyborem wałów tylnych. Grupa docelowa to duże gospodarstwa i profesjonalni rolnicy preferujący technologie bezorkowe i minimalizacyjne.
