# PL overlay (opisy/pola) na strukturę cs. AI draft + edytor, wymaga review.

country: "Norwegia"
description: >-
  Norweski producent maszyn rolniczych założony w 1879 roku w Kverneland (Jæren), od 2012 roku część japońskiej grupy Kubota Corporation. Tradycyjnie określany jako „king of plows" — klasyczne pługi 150 / 2300 / ED / EG, półzawieszane PB100 / 6300 oraz ich lemiesze z opatentowanej stali Kverneland są światowym wzorcem orki. Dodatkowo agregaty talerzowe Qualidisc Pro/Farmer, lemieszowe Enduro / CTC / Turbo, brony rotacyjne NG-S/H, wały Actiroll oraz precyzyjne siewniki Optima (precyzyjne), e-drill / u-drill / Accord (pneumatyczne) i TS-Evo (mechaniczne). Do nawożenia rozsiewacze Exacta CL / TL / HL z ekskluzywną technologią GEOSPREAD do sterowania sekcjami nawet 1 m po odcinku. Ochrona roślin: zawieszane iXter B/A, ciągnione iXtrack T3/T4/T6 oraz samobieżne iXdrive 4180–5240. Kverneland Group skupia także marki siostrzane Vicon, Roc i Kubota Implements.

categories:
  zpracovani-pudy: "Uprawa gleby"
  seti: "Siew i sadzenie"
