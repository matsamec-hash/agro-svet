series:
  plough-150: >-
    Kverneland 150 — klasyczny zawieszany pług obracalny na 3–6 lemieszy, flagowa seria
    dla małych i średnich gospodarstw. Wersje B (mechaniczna regulacja szerokości roboczej), S (zabezpieczenie śrubowe Shear-bolt przeciw przeciążeniom) oraz V (Vari-Width płynna hydrauliczna regulacja szerokości bruzdy 30–50 cm z kabiny). Lemiesze ze specjalnej stali Kverneland o wysokiej trwałości i uniwersalnej geometrii do orki na głębokość do 30 cm.
  plough-2300: >-
    Kverneland 2300 — zawieszany pług obracalny na 5–7 lemieszy przeznaczony dla średnich i większych gospodarstw z ciągnikami 130–280 KM. Solidna rama z automatycznym odbezpieczeniem Auto-reset (wersja S) chroni lemiesze przy najeździe na kamień i po pokonaniu przeszkody wraca do pozycji roboczej bez konieczności zatrzymania. System Vari-Width umożliwia płynną zmianę szerokości bruzdy 30–55 cm dla dostosowania do różnych warunków glebowych.
  plough-ed: >-
    Kverneland ED — kompaktowy zawieszany pług obracalny na 3–5 lemieszy, odpowiedni dla małych gospodarstw i ciągników 80–150 KM. Lekka konstrukcja o niskiej masie i prosta obsługa w połączeniu z lemieszem Kverneland gwarantują wysoką jakość orki także w warunkach typowych dla gospodarstw Europy Środkowej. Dostępne warianty z mechaniczną lub hydrauliczną regulacją szerokości roboczej.
  plough-eg: >-
    Kverneland EG — pług obracalny zawieszany heavy-duty na 5–7 lemieszy przeznaczony dla dużych gospodarstw z ciągnikami 180–360 KM. Masywna rama 200×200 mm i zabezpieczenie Auto-reset umożliwiają orkę nawet na kamienistych glebach bez przestojów. Wersja Vari-Width oferuje płynną zmianę szerokości bruzdy z kabiny, śrubowe zabezpieczenie X-Bolt zapewnia stałe ustawienie z wyższą przepustowością.
  plough-pb100: >-
    Kverneland PB100 — półzawieszany pług obracalny na 6–9 lemieszy, flagowa seria dla dużych gospodarstw i przedsiębiorstw usługowych. Własne koło jezdne przenosi część masy, dzięki czemu ciągnik 200–360 KM może orać pełnym szerokim zasięgiem bez przeciążania tylnej osi. Zabezpieczenie Auto-reset i Vari-Width do płynnej zmiany szerokości bruzdy 30–55 cm są standardem. Solidna rama do całorocznej intensywnej pracy.
  plough-6300: >-
    Kverneland 6300 — ciężki półzawieszany pług obracalny na 7–12 lemieszy, topowa seria przeznaczona na duże pola i przedsiębiorstwa usługowe z ciągnikami 280–500 KM. Hydraulicznie sterowany system transportowy, masywny przegub główny i solidna rama umożliwiają duże szerokości robocze do 6,6 m. Hydrauliczne zabezpieczenie Auto-reset i regulacja szerokości bruzdy Vari-Width z kabiny gwarantują maksymalną efektywność i trwałość przy intensywnej całorocznej eksploatacji.
  qualidisc: >-
    Qualidisc — agregaty talerzowe Kverneland z konfiguracją X talerzy do płytkiej uprawy ścierniska i wymieszania resztek pożniwnych. Wersja Pro (heavy-duty z głębokością roboczą 3–15 cm i szerokością 3–7 m, zawieszane i ciągnione) oraz Farmer (lżejsza, dla średnich gospodarstw). Duże talerze o średnicy 510 mm i hydraulicznie regulowany kąt umożliwiają pracę także w resztkach słomy kukurydzianej przy prędkości 8–15 km/h.
  enduro: >-
    Enduro — lemieszowy agregat podorywkowy Kverneland do średniej i głębokiej uprawy gleby do 30 cm. Trzy do czterech rzędów lemieszy strzałkowych z automatycznym hydraulicznym zabezpieczeniem Triflex chronią przed uszkodzeniami na kamienistych glebach. Szerokość robocza 3–6 m, dostępne wersje zawieszane i ciągnione. Odpowiedni do siewu mulczowego oraz tradycyjnej uprawy z przygotowaniem gleby.
  ctc: >-
    CTC (Conventional Tillage Cultivator) — ciężki lemieszowy agregat podorywkowy Kverneland do głębokiej uprawy do 35 cm. Cztery rzędy lemieszy strzałkowych z dużymi odstępami (95 cm między rzędami) zapewniają wysoką przepustowość resztek pożniwnych bez zapychania. Solidna rama z hydraulicznym zabezpieczeniem i duża przestrzeń robocza umożliwiają wysoką jakość uprawy nawet na ciężkich gliniastych glebach z dużą ilością słomy.
  turbo: >-
    Turbo — lemieszowy płytki agregat podorywkowy Kverneland do szybkiej uprawy ścierniska na głębokość 5–15 cm. Gęste rozmieszczenie wąskich lemieszy (3 rzędy, rozstaw 27 cm) zapewnia 100% przepustowość profilu i skuteczne podcięcie ścierniska oraz drobnych chwastów. Idealna maszyna do płytkiej podorywki zaraz po zbiorze z możliwością siewu międzyplonów lub bez przygotowania łóżka siewnego.
  ng: >-
    NG — brony rotacyjne Kverneland do przygotowania łóżka siewnego w połączeniu z siewnikami. Wersje NG-S (kompaktowa, do ciągników do 180 KM, szerokość 2,5–4,0 m), NG-H (heavy-duty, do 250 KM, szerokość 3,0–4,5 m) oraz NG-M (składana, szerokość do 6 m). Solidna przekładnia, łatwo wymienne noże oraz system Quick-Fit do szybkiego podłączenia wałów i siewnika w jednym przejeździe.
  actiroll: >-
    Actiroll — ciągniony wał Kverneland do rekonsolidacji gleby po orce lub podorywce. Szerokości robocze 6,3 / 8,3 / 9,9 / 12,3 m, składana konstrukcja do transportu. Dostępne pierścienie Cambridge (522 mm) lub Crosskill (550 mm) do różnych warunków glebowych. Centralna hydrauliczna regulacja nacisku z kabiny pozwala dostosować do wilgotności gleby.
  optima: >-
    Optima — precyzyjny siewnik Kverneland do siewu kukurydzy, słonecznika, rzepaku, soi i innych szeroko rzędowych roślin. Wersje TF Profi (ciągniona rama do wysokich prędkości), SX (e-drive elektryczny napęd zespołu wysiewającego), HD-II (heavy-duty pneumatyczny dysk) oraz M (mechaniczna). Indywidualna singulacja nasion w każdej sekcji, GEOCONTROL section control umożliwia wyłączanie sekcji na zakrętach. Szerokości robocze 3–12 m, rozstaw rzędów 45–80 cm.
  e-drill: >-
    e-drill — kompaktowy zawieszany pneumatyczny siewnik Kverneland dla małych i średnich gospodarstw. Elektryczny napęd zespołu wysiewającego umożliwia płynną zmienną dawkę nasion (VRT) z terminala ISOBUS bez mechanicznej przekładni. Szerokość robocza 3–4 m, zbiornik 1100 l, dostępne wersje maxi (większy zbiornik) i compact (lżejsza konstrukcja). Idealny do siewu w przygotowane łóżko siewne w połączeniu z broną rotacyjną NG.
  u-drill: >-
    u-drill — uniwersalny ciągniony pneumatyczny siewnik Kverneland do siewu w mulcz i klasycznie uprawioną glebę. Krótka konstrukcja z lemieszami talerzowymi CX-II umożliwia pracę w resztkach pożniwnych bez zapychania. Wersje Pro (Plus z dużym zbiornikiem 4350 l i dzielonym fronthopperem na nawóz) oraz standard dla szerokości roboczych 3, 4 i 6 m. Nacisk na lemiesze do 200 kg dla pewnego umieszczenia nasion.
  accord: >-
    Accord — tradycyjna pneumatyczna jednostka siewna Kverneland z zintegrowanym zespołem wysiewającym i lemieszami CX-II. Modele DA (zawieszany, szerokość 3 m w połączeniu z broną rotacyjną) oraz MSC (Mounted Seedline Combination, modułowa kombinacja z broną NG-H). Sprawdzona technologia od lat 80. nadal używana w Europie do niezawodnego siewu zbóż i rzepaku w intensywnych systemach.
  ts-evo: >-
    TS-Evo — mechaniczny siewnik Kverneland z grawitacyjnym dozowaniem nasion dla małych i średnich gospodarstw. Szerokości robocze 2,5 / 3,0 / 4,0 m, prosta obsługa bez ISOBUS, solidna przekładnia Norton. Idealny do siewu zbóż, roślin motylkowych i międzyplonów tam, gdzie nie jest potrzebna zmienna dawka. Dostępny zawieszany lub w połączeniu z broną NG jako TS-Drill.
  exacta: >-
    Exacta — rozsiewacz nawozów mineralnych Kverneland z ekskluzywną technologią GEOSPREAD do precyzyjnego dawkowania po sekcjach (nawet 1 m po odcinku) sterowany przez GPS. Wersje CL (compact, 750–1900 l, szerokość 9–28 m), TL (medium, 1100–2700 l, szerokość 12–42 m) oraz HL (heavy, 1500–3900 l, szerokość 18–54 m). Podwójne talerze z łopatkami ProfShape zapewniają równomierny rozsiew z symetrycznym wachlarzem nawet przy rozsiewie brzegowym (Border-spread). Standard ISOBUS, integracja z oprogramowaniem zarządzania gospodarstwem do aplikacji zmiennych dawek (VRA).
  ixter: >-
    iXter — zawieszane opryskiwacze Kverneland dla małych i średnich gospodarstw. Wersje iXter B (compact, 1000–1800 l, szerokość 15–28 m) oraz iXter A (advanced, ISOBUS, automatyczne poziomowanie belki BoomGuide, 1500 l). Aluminiowe belki HC z pneumatycznym zawieszeniem, iXflow-Air ciągła cyrkulacja do szybkiej zmiany preparatów bez płukania. SectionControl do wyłączania sekcji według GPS na zakrętach.
  ixtrack: >-
    iXtrack — ciągnione opryskiwacze Kverneland dla średnich i dużych gospodarstw. Wersje T3 (compact, 2400–3400 l, szerokość 18–30 m), T4 (medium, 3400–4600 l, szerokość 24–36 m) oraz T6 (heavy, 4600–6400 l, szerokość 27–40 m). Aluminiowe belki HC z BoomGuide ProActive do precyzyjnego kopiowania rzędu, iXflow-Air ciągła cyrkulacja i zintegrowany terminal ISOBUS Tellus PRO. Hydropneumatyczne zawieszenie osi i TrailControl do sterowania jazdą.
  ixdrive: >-
    iXdrive — samobieżne opryskiwacze Kverneland z własnym silnikiem i kabiną. Modele 4180 (4000 l, 180 KM) i 5240 (5200 l, 220 KM) z szerokościami roboczymi 24–40 m. Hydrostatyczny napęd na wszystkie cztery koła, prześwit 1,25 m i regulowany rozstaw 1,80–2,25 m umożliwiają wjazd w wyższe uprawy. Kabina zawieszona na powietrzu, automatyczne sterowanie BoomGuide ProActive i cyrkulacja iXflow-Air. Idealne dla dużych gospodarstw i przedsiębiorstw usługowych o wysokich wymaganiach aplikacyjnych.
  5000-m: >-
    Kverneland 5000 M — tylne zawieszane kosiarki tarczowe o szerokościach roboczych 2,4–3,2 m (modele 5087 M / 5095 M / 53100 M). Solidna listwa tnąca z 6–8 tarczami, geometria noży ProLine dla czystego cięcia i łatwej wymiany. System zawieszenia QuattroLink zapewnia idealne kopiowanie terenu nawet na zboczach. Opcjonalne kondycjonery z rotorem palcowym lub wałowym przyspieszają więdnięcie skoszonej masy.
  51000-mt: >-
    Kverneland 51000 MT — przednie zawieszane kosiarki tarczowe do współpracy z tylną kosiarką motylkową 53100 MT i łącznej szerokości do 9 m. Zawieszenie pull-type zapewnia idealne kopiowanie terenu także na zakrętach, system ProtectionDrive chroni przekładnię przy najeździe na przeszkodę. Odpowiedni dla przedsiębiorstw usługowych i dużych gospodarstw z intensywnym zbiorem pasz.
