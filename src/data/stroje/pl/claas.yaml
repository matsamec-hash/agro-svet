# PL overlay (opisy/pola) na strukturę cs. Tłumaczenie z cs/sk, wymaga korekty.
# Cel: polskie zapytania „dane techniczne" (Lexion, Trion) trafiają na stronę z polskim
# opisem marki/serii zamiast czeskiego. Struktura + liczby zostają z cs.

country: "Niemcy"
description: >-
  Niemiecka firma rodzinna założona w 1913 roku przez braci Claas. Światowy lider w kombajnach (seria Lexion) i sieczkarniach samojezdnych Jaguar. Ciągniki CLAAS nawiązują do dziedzictwa francuskiego Renault Agriculture (przejęcie w 2003). Siedziba w Harsewinkel.

categories:
  traktory: "Ciągniki"
  kombajny: "Kombajny"
  sklizen-picnin: "Sieczkarnie samojezdne"

series:
  ares: >-
    Seria kontynuowana po przejęciu Renault Agriculture (2003), odziedziczona po francuskim producencie. Silnik John Deere 4- i 6-cylindrowy.
  atles: >-
    Duża, flagowa seria przed pojawieniem się Axion. Silnik DPS 6-cylindrowy 7,4 L.
  celtis: >-
    Przystępna cenowo seria podstawowa odziedziczona po Renault. Silnik Perkins 4-cylindrowy.
  elios: >-
    Kompaktowa seria użytkowa. Silnik FPT 4-cylindrowy, prosta przekładnia mechaniczna.
  atos: >-
    Ciągnik użytkowy z przekładnią Revershift i hydrauliką Power Shuttle.
  nexos: >-
    Wąska seria specjalistyczna do sadów i winnic. Silnik FPT NEF 4-cylindrowy.
  arion-gen1: >-
    Uniwersalna seria premium do gospodarstw mieszanych. Silnik DPS Perkins, przekładnia QuadriShift lub HexaShift.
  arion-gen2: >-
    Zmodernizowana seria. Silnik FPT/DPS, przekładnia HexaShift lub CMATIC (CVT). Kabina PANORAMIC z panoramicznym przeszklonym dachem pod ładowacz czołowy.
  axion-800-900: >-
    Flagowa duża seria produkowana w Le Mans (Francja). Silnik FPT NEF 6,7 L (Axion 800) i FPT Cursor 9 8,7 L (Axion 900). Przekładnia CMATIC (ZF Eccom CVT), joystick CMOTION, terminal CEBIS Touch. Axion 960 = 445 KM, flagowy ciągnik CLAAS (Stage V). Axion 940 był Ciągnikiem Roku 2014.
  xerion: >-
    Ciągnik systemowy z odwracalnym stanowiskiem kierowcy (obrotowa kabina Trac VC) i 4 jednakowymi kołami. Silnik **Mercedes-Benz** (OM906 / OM471 / OM473 6-cylindrowy, 7,7–12,8 L zależnie od modelu), przekładnia **HM4** hydromechaniczna 4-trybowa CVT (opcjonalnie ZF Eccom). Produkowany w Harsewinkel. Warianty **Trac** (standardowy) i **Saddle Trac** (stała kabina pod maszyny nabudowane, np. na gnojowicę). **Xerion 5000** był Ciągnikiem Roku 2014.
  dominator: >-
    Legendarne kombajny klasyczne, które wyniosły CLAAS na czoło. W Polsce wciąż spotykane w mniejszych gospodarstwach.
  mega: >-
    Średnia klasa kombajnów klasycznych. Silnik Mercedes-Benz 6-cylindrowy. Technologia APS dla większej przepustowości.
  avero: >-
    Przystępna cenowo seria podstawowa dla mniejszych gospodarstw. Silnik John Deere 4-cylindrowy.
  tucano: >-
    Średnia klasa. Warianty klasyczne Tucano 300–500 lub rotorowe hybrydowe serii 400 z jednym rotorem APS HYBRID.
  lexion-400-500-600-700: >-
    Flagowa seria CLAAS wprowadzona w 1995 roku modelem Lexion 480 — pierwszy **APS HYBRID** (wstępny separator APS + 1 rotor wzdłużny ROTO PLUS) w Europie. Silnik Mercedes-Benz (OM906/OM471/OM473) lub Caterpillar (rynek USA, joint venture od 1999). Produkowane w Harsewinkel (Niemcy) i Omaha (Nebraska, USA).
  lexion-5000-8000: >-
    Całkowicie nowa platforma wprowadzona w 2019 roku. Projekt Volker Groth (były BMW), APS Synflow Walker (5000 — klasyczny z 6 wytrząsaczami) lub APS Synflow Hybrid (6000–8000 — 1 rotor wzdłużny ROTO PLUS o średnicy 600 mm). Cemos Auto Threshing / Cleaning / Separation, FieldScanner, silnik Mercedes-Benz OM471 / OM473 (Stage V). Lexion 8900 z 790 KM należy do najwydajniejszych kombajnów świata.
  trion: >-
    Następca Tucano. Całkowicie nowa platforma pomiędzy Tucano a Lexion. Warianty APS / APS HYBRID, Trion Montana z kompensacją zboczy do 18 %.
  jaguar-700: >-
    Pierwsza generacja sieczkarni samojezdnych Jaguar — wprowadzona w 1973 roku modelami Jaguar 60 SF, 70 SF i 80 SF. Ikoniczne maszyny do zbioru kiszonki z kukurydzy i traw w latach 70. i 80. Silnik Mercedes-Benz 6-cylindrowy, mechaniczna 4-biegowa przekładnia. Późniejsze modele 685/690/695 SL przyniosły automatyzację i wyższą moc.
  jaguar-800: >-
    Zmodernizowana generacja z cyfrową regulacją i szerszym bębnem tnącym (V-MAX). Silnik Mercedes-Benz OM441/OM442 6/8-cylindrowy, automatyczne ostrzenie noży. Modele 820/840/860/880/890/900 w zakresie mocy 286–605 KM.
  jaguar-900-modern: >-
    Nowoczesna generacja z technologią **Dynamic Power** (zmienna moc silnika zależnie od obciążenia) i Auto Fill (automatyczne napełnianie przyczepy). Silnik Mercedes-Benz OM502 V8, później MAN V12 (980). Modele 930/940/950/960/970/980/990, moc 360–884 KM. Flagowy Jaguar 980 długo dzierżył tytuł najwydajniejszej sieczkarni świata.
  jaguar-current: >-
    Aktualna generacja Stage V. Trzy klasy mocy: **Jaguar 800** (podstawowa, 408–490 KM), **Jaguar 900** (główna, 503–925 KM) i flagowy **Jaguar 1000** (wprowadzony w 2023, 925 KM, najwydajniejsza sieczkarnia samojezdna świata). Silnik MAN V12 24,2 L (1000), Mercedes-Benz OM471/OM473 (900). CEMOS Auto Performance, system konserwujący Shredlage, Auto Fill 3D.

models:
  claas-lexion-8700: >-
    CLAAS Lexion 8700 to hybrydowy kombajn wyższej klasy o mocy 625 KM (460 kW) i zbiorniku ziarna 13 500 l. Należy do generacji Lexion 8000 (od 2019 roku) z układem omłotowym APS SYNFLOW HYBRID. Lexion 8700 jest przeznaczony do dużych gospodarstw zbożowych o wysokiej dziennej wydajności; niższą alternatywą jest Lexion 8600, mocniejszym modelem Lexion 8800.
