# PL overlay (opisy/pola) na strukturę cs. AI draft + edytor, wymaga review.

country: "Niemcy"
description: >-
  Niemiecki producent maszyn rolniczych do uprawy gleby i siewu. Klasyczne pługi zawieszane Juwel i Diamant, kultywatory Rubin, glebogryzarki Karat, siewniki Solitair.

categories:
  hnojeni: "Nawożenie"
  seti: "Siew i sadzenie"
  zpracovani-pudy: "Uprawa gleby"
  ochrana-rostlin: "Opryskiwacze"

series:
  polaris: >-
    Polaris — zawieszane rozsiewacze nawozów mineralnych Lemken z podwójnym talerzem dla maksymalnej precyzji i efektywności aplikacji.
  spica: >-
    Spica — proste i praktyczne rozsiewacze nawozów mineralnych Lemken dla małych i średnich gospodarstw.
  tauri: >-
    Tauri — wydajne rozsiewacze nawozów mineralnych Lemken o dużym roboczym zasięgu i wysokim zasięgu wyrzutu.
  saphir: >-
    Saphir — mechaniczne siewniki Lemken do precyzyjnego układania nasion, odpowiednie do samodzielnego siewu oraz w kombinacji z brona wirnikową.
  solitair-mr: >-
    Solitair MR — zawieszane, sztywne pneumatyczne siewniki Lemken do małych i średnich szerokości roboczych w połączeniu z narzędziami aktywnymi.
  solitair: >-
    Solitair — pneumatyczne uniwersalne siewniki Lemken o dużych szerokościach roboczych, odpowiednie do samodzielnego siewu oraz w kombinacji z narzędziami aktywnymi.
  solitair-combinations: >-
    Solitair DT/PT — kombinacje siewne Lemken łączące przygotowanie łóżka siewnego i siew w jednej operacji dla maksymalnej wydajności.
  solitair-12-sw: >-
    Solitair 12 SW — siewnik transportowy Lemken z dużym zasobnikiem nasion przeznaczony dla dużych gospodarstw i usług kontraktowych.
  solitair-nt: >-
    Solitair NT — pneumatyczny siewnik Lemken do siewu bezpośredniego (no-till) w nieuprawianą glebę.
  faya-mf: >-
    Faya MF — precyzyjny siewnik Lemken do siewu kukurydzy, rzepaku i innych szeroko rzędowych roślin.
  juwel: >-
    Juwel — zawieszane obrotowe pługi Lemken klasy średniej z systemem TurnControl Pro dla efektywnej pracy w różnych warunkach.
  diamant: >-
    Diamant — półzawieszane obrotowe pługi Lemken dla dużych ciągników o wysokiej wydajności roboczej i nowym systemie regulacji.
  titan: >-
    Titan — półzawieszane obrotowe pługi Lemken najwyższej klasy o wysokiej wydajności roboczej dla największych ciągników.
  plough-equipment: >-
    Osprzęt do pługów Lemken — koła, system regulacji OptiQuick, talerze tnące, korpusy orne, przedpługi i wyposażenie do orki onland.
  optistone: >-
    OptiStone — hydrauliczna blokada kamieni Lemken do bezproblemowej orki na glebach kamienistych.
  rubin: >-
    Rubin — kompaktowe kultywatory talerzowe Lemken do intensywnej, płytkiej uprawy gleby o wysokiej wydajności roboczej i dokładnym wymieszaniu resztek roślinnych.
  heliodor-slurrykit: >-
    Heliodor SlurryKit — zestaw Lemken do wprowadzania gnojowicy w glebę za pomocą kultywatora talerzowego w jednej operacji.
  karat-koralin-kristall: >-
    Karat, Koralin i Kristall — kultywatory i glebogryzarki Lemken do płytkiej i średnio głębokiej uprawy gleby z naciskiem na ochronę wilgoci.
  onyx: >-
    Onyx — głęboki glebogryzarka Lemken do rozluźniania zbitych warstw podglebia bez odwracania profilu gleby.
  gigant: >-
    Gigant — systemowy nośnik Lemken do elastycznego wykorzystania różnych modułów roboczych o wysokiej wydajności i niskim zużyciu.
  zirkon: >-
    Zirkon — brony wirnikowe Lemken do przygotowania łóżka siewnego, odpowiednie do samodzielnego stosowania oraz w kombinacji z siewnikami Solitair i Saphir.
  system-kompaktor-korund: >-
    System-Kompaktor i Korund — pasywne wały Lemken do przygotowania łóżka siewnego z uniwersalnym zestawem elementów roboczych.
  variopack-flexpack: >-
    VarioPack i FlexPack — ugniatacze Lemken do zagęszczania rozoranej gleby za pługiem w jednej operacji z orką.
  rollers: >-
    Wały Lemken — wały śladujące do niezawodnego zagęszczania gleby w każdych warunkach jako element przygotowania łóżka siewnego.
  sirius: >-
    Sirius — ciągnione opryskiwacze polowe Lemken do niezawodnej aplikacji środków ochrony roślin. Konstrukcja modułowa z pojemnością zbiornika 2 600 – 3 800 l, belki 15 – 30 m, rama hydropneumatycznie zawieszona dla płynnej pracy przy dużych prędkościach i precyzyjnego rozprowadzania cieczy opryskowej.
  vega: >-
    Vega — wydajny ciągniony opryskiwacz polowy Lemken wyższej klasy ze zbiornikiem 4 600 – 6 200 l i belkami do 36 m. Sterowanie ISOBUS, sterowanie sekcyjne, automatyczne prowadzenie ramy HeightControl oraz precyzyjne indywidualne sterowanie dyszami do zmiennej aplikacji ochrony roślin na dużych polach.
