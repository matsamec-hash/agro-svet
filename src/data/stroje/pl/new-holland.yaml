# PL overlay (opisy/pola) na strukturę cs. Tłumaczenie z cs/sk, wymaga korekty.

country: "Włochy / USA"
description: >-
  Włosko-amerykańska marka należąca do koncernu CNH Industrial (razem z Case IH). Ciągniki produkowane są w Bazylei i St. Valentin, kombajny w Zedelgem (Belgia). Charakterystyczny niebieski kolor i serie oparte na konstrukcji Forda z lat 90. Dziś oferta obejmuje serie od T4 (40 KM) do T9 (700+ KM), a kombajny CR dominują w klasie kombajnów rotorowych.

categories:
  traktory: "Ciągniki"
  kombajny: "Kombajny"

series:
  40-series: >-
    Pierwsza generacja po fuzji Ford Tractors + New Holland (1991). Silnik Ford/Genesis 7,5 L, napęd 4WD, przekładnia mechaniczna 16/9.
  60-series: >-
    Następca serii 40 z ulepszoną hydrauliką i przekładnią ElectroShift. Silnik Genesis z intercoolerem.
  ts: >-
    Bardziej kompaktowa seria użytkowa. Wersje czterocylindrowe (TS90/100/110) miały silnik 5 000 cm³, sześciocylindrowe (TS115) silnik wolnossący 7 480 cm³ — TS115 był bardzo popularny na rynku środkowoeuropejskim. Przekładnia Synchro Shuttle lub Electro Command 16/16, podwójnie zredukowana oś tylna z przekładniami planetarnymi, blokada mechanizmu różnicowego Electrolok oraz wielotarczowe mokre hamulce.
  ts-a: >-
    Pięć całkowicie nowych modeli z kabiną Horizon (bez czwartego słupka). Silnik z wtryskiem Common Rail, turbodoładowaniem i intercoolerem, moc 101–136 KM, z funkcją Power Management do 168 KM (TS135A). W 2006 roku dołączyły warianty TS-A Plus i TS-A Delta. Oś przednia SuperSteer lub zawieszana Terraglide.
  tm: >-
    Większa seria do upraw rzędowych z pięcioma modelami 116–168 KM (ISO). Silniki Ford turbo, przekładnia Electroshift 16/16, pneumatycznie zawieszany fotel, hydraulika Bosch EHR, zawieszana oś przednia Terraglide i zawieszenie kabiny Comfort Ride. Opcjonalna oś SuperSteer z kątem skrętu 65° skróciła promień skrętu o ~3 m. Modele TM175 i TM190 DT (2002–2007) miały przekładnię Powershift 18/6 lub 19/6, generator hydrauliczny 120 l/min, PowerBoost +46 KM i elektronicznie sterowaną pompę Bosch VP44.
  tl: >-
    Przystępna cenowo seria użytkowa. Silnik 4-cylindrowy 4,5 L, przekładnia Synchro Shuttle 12/12.
  tg: >-
    Topowa seria do upraw rzędowych produkowana w zakładzie Racine (USA), zastąpiła dwa najmocniejsze modele NH 70A. Sześciocylindrowy silnik Cummins 8,3 l z czterema zaworami na cylinder (TG255/285) przy 2 200 obr./min, przekładnia Ultra Command Powershift 18/4. Hydraulika MegaFlow o wydatku do 257 l/min — jedna z najwydajniejszych w segmencie swojego czasu. Poprzednik serii T8.
  t4: >-
    Seria użytkowa dla mniejszych gospodarstw, sadów i winnic. Silnik Iveco F5C 3,4 L, przekładnia Dual Command / Electro Command, emisje Tier 4B / Stage V.
  t5: >-
    Uniwersalna seria do produkcji zwierzęcej i roślinnej. Silnik FPT NEF 4,5 L, przekładnia Dual/Electro Command 24/24. W 2024 roku wprowadzono trzecią generację T5 DynamicCommand o mocy do 140 KM.
  t6: >-
    Najlepiej sprzedająca się seria. Silnik FPT NEF 6,7 L, przekładnia Electro Command (16/16) lub Auto Command CVT (bezstopniowa). Wariant metanowy T6 Methane Power od 2020 roku — pierwszy seryjny ciągnik na biometan.
  t7: >-
    Premium seria do upraw rzędowych zastępująca TM. Poprzednik T7000 PowerCommand został wprowadzony w 2007 roku; w 2009 dołączył wariant T7000 Auto Command z przekładnią bezstopniową (CVT), nawiązujący do T7500 produkowanego w austriackim Sankt Valentin (pierwotne oznaczenie TVT). Wersja topowa miała 18-biegową przekładnię Power Command — w ciągu trzech lat wyprodukowano ponad 23 000 sztuk. Obecny T7 ma silnik FPT NEF 6,7 L (T7.170–T7.245) lub FPT Cursor 9 (T7.260+), przekładnię Range Command 18/6 lub Auto Command CVT oraz kabinę klasy SideWinder II z joystickiem.
  t8: >-
    Flagowa seria do upraw rzędowych. Poprzednik T8000 (wprowadzony 2006) miał silnik 8 268 cm³ z 24 zaworami i wtryskiem Common Rail; wariant T8050 otrzymał 9-litrowy silnik 325 KM i 19-biegową przekładnię umożliwiającą 40 km/h przy niższych obrotach. Obecny T8 ma silnik FPT Cursor 9 8,7 L, przekładnię Ultra Command 18/4 lub Auto Command CVT, monitor IntelliView, IntelliSense oraz wersje gąsienicowe T8 SmartTrax.
  t9: >-
    Przegubowe ciągniki 4WD dla dużych gospodarstw i rynku amerykańskiego. Silnik FPT Cursor 13 (12,9 L) lub Cursor 16 (16 L), przekładnia 16/4 PowerShift. Wersje gąsienicowe SmartTrax.
  tx: >-
    Kombajny klasyczne z wytrząsaczami. Silnik NH/FPT 6-cylindrowy 7,5 L, 5 wytrząsaczy, rotacyjny doseparator.
  cx: >-
    Klasyczna flagowa seria (bęben + 5 wytrząsaczy). W Zedelgem od 2002 roku, wielokrotnie modernizowana. CX7 / CX8 / CX8.91 — największe w kategorii kombajnów klasycznych.
  cr: >-
    Dwurotorowa flagowa seria. Rewolucyjna konstrukcja Twin Rotor — dwa wzdłużne rotory ze zmiennym wyważeniem. CR11 (wprowadzony 2023) dzierży światowy rekord dziennej wydajności.

models:
  new-holland-cr11: >-
    Flagowy model CR11 zastępuje CR10.90. Silnik Cursor 16 o pojemności skokowej 16 L, optymalizacja IntelliSense AI, zbiornik ziarna do 20 000 l. Dzierży światowy rekord w zbiorze kukurydzy.
