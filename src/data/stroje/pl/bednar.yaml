# PL overlay (opisy/pola) na strukturę cs. AI draft + edytor, wymaga review.

country: "Czechy"
description: >-
  BEDNAR FMT to czeski producent maszyn premium do uprawy gleby, siewu i aplikacji nawozów, założony w 1997 roku w Rychnovie nad Kněžnou. Firma produkuje solidne maszyny dla dużych gospodarstw, kładąc nacisk na szerokość roboczą 3–18 m oraz wysoką wydajność powierzchniową. Flagowe serie to głębokie kultywatory TERRALAND, kompaktomaty SWIFTER, talerzowe podorywacze ATLAS oraz uniwersalne siewniki OMEGA. Bednar dostarcza do ponad 40 krajów na świecie i należy do najważniejszych czeskich marek techniki rolniczej.

categories:
  seti: "Siew i sadzenie"
  zpracovani-pudy: "Uprawa gleby"

series:
  omega: >-
    OMEGA to flagowy uniwersalny pneumatyczny siewnik BEDNAR do technologii min-till, mulch-till oraz konwencjonalnych. Szerokość robocza 3–9 m, dwutarczowe redlice siewne CrossBoard Heavy oraz centralny zasobnik o pojemności 3 000–5 000 l. Modele OO (ciągnięty) i OF (z przedredliczkami) umożliwiają siew w mulcz, słomę oraz na zwarte pożniwne resztki. Maszyna jest popularna w dużych gospodarstwach w Czechach oraz w Europie Wschodniej.
  ferox: >-
    FEROX to szybki pneumatyczny siewnik BEDNAR zoptymalizowany do wysokich prędkości roboczych do 18 km/h. Krótka długość robocza, agresywna sekcja talerzowa oraz precyzyjne dawkowanie zapewniają wysoką wydajność powierzchniową na dużych areałach. Szerokość 4–6 m, idealny do współpracy z przygotowaniem gleby.
  corsa: >-
    CORSA to precyzyjny siewnik BEDNAR do siewu kukurydzy, słonecznika, rzepaku i soi. Pneumatyczna singulacja, elektryczny napęd jednostek siewnych oraz sekcja z indywidualną kontrolą docisku. Szerokość od 4,5 m przy rozstawie międzyrzędzi 70 cm, przeznaczony do precyzyjnego rolnictwa z terminalem ISOBUS.
  combo: >-
    COMBO LO to siewnik kombinowany BEDNAR łączący przygotowanie gleby z precyzyjnym siewem w jednym przejeździe. Sekcja talerzowa, kompaktomatowy talerz oraz pneumatyczna jednostka siewna umożliwiają siew w nieuprawioną glebę lub po podorywce. Szerokość 4–6 m, odpowiedni do systemów mulch-till.
  ferti-box: >-
    FERTI-BOX FB to czołowo zawieszony zasobnik nawozów BEDNAR do uzupełnienia siewników o aplikację nawozów mineralnych podczas siewu. Pojemność 1 700–3 000 l, pneumatyczny transport nawozu rurami do jednostki siewnej z tyłu. Umożliwia nawożenie strip-till oraz dawki startowe dla kukurydzy i rzepaku.
  terraland: >-
    TERRALAND to flagowa seria głębokich kultywatorów BEDNAR do głębokiego spulchniania do 65 cm bez odwracania gleby. Solidna rama, łopatka Active-Mix w kształcie łzy oraz tylny wał CrossBoard zapewniają wymieszanie resztek roślinnych i strukturę gleby. Modele TN (zawieszany), TO (ciągnięty) i DO (ciągnięty z sekcją talerzową) obejmują szerokości 3–7 m i wymagają ciągnika 200–500 KM.
  swifter: >-
    SWIFTER to flagowy kompaktomat BEDNAR do przygotowania łóżka siewnego w jednym przejeździe. Połączenie przedniego lemiesza, sekcji kompaktomatowej, brony prętowej i tylnego wału zapewnia równy i ustrukturyzowany profil do siewu. Szerokości 6–18 m w zależności od modelu (SO zawieszany, SM średni, SN ciągnięty) należą do najszerszych w kategorii.
  atlas: >-
    ATLAS to seria krótkich talerzowych podorywaczy BEDNAR do płytkiej uprawy 5–15 cm oraz podorywki po zbiorach. Duże talerze 620–660 mm z indywidualnym mocowaniem na gumowych silentblokach radzą sobie nawet z twardymi pożniwnymi resztkami. Szerokości 3–15 m w zależności od modelu: AO (zawieszany), AN (ciągnięty średni) i AM (ciągnięty duży) obejmują gospodarstwa od 200 do 5 000 ha.
  fenix: >-
    FENIX to redlicowy podorywacz BEDNAR do płytkiej i średniej uprawy 8–25 cm. Strzałkowe redlice z szerokim zakresem pracy zapewniają całopowierzchniowe podcinanie i mieszanie resztek roślinnych. Model FN jest zawieszany o szerokości do 4 m, FO ciągnięty 4–7 m. Odpowiedni do podorywki, wiosennego spulchniania oraz przygotowania przed siewem.
  versatill: >-
    VERSATILL to uniwersalny redlicowy kultywator BEDNAR do średniej głębokości 10–35 cm z systemem szybkiej wymiany łopat. Dzięki modułowej konstrukcji radzi sobie z podorywką, spulchnianiem oraz przygotowaniem łóżka siewnego. Szerokość 3–6 m, model VO dostępny w wersji zawieszanej i ciągniętej.
  kor: >-
    KOR to kompaktowy zawieszany talerzowy podorywacz BEDNAR dla małych i średnich gospodarstw. Talerze 510 mm w układzie X zapewniają agresywne cięcie i mieszanie. Szerokość 2,5–4 m, odpowiedni do ciągników od 100 KM. Model KO dostępny wyłącznie w wersji zawieszanej.
  mulchfarmer: >-
    MULCHFARMER to kombinowany kultywator BEDNAR zaprojektowany do technologii mulch-till. Łączy sekcję talerzową, redlice i wał w jednym przejeździe, co umożliwia przygotowanie gleby z wysokim udziałem resztek roślinnych. Szerokość 4–6 m, model MF radzi sobie w trudnych warunkach po kukurydzy i rzepaku.
  strip-master: >-
    STRIP-MASTER to maszyna strip-till BEDNAR do pasowej uprawy gleby z aplikacją nawozu. Spulchnia tylko pas szerokości 20 cm w rozstawie 45–80 cm, między pasami pozostawia mulcz. Umożliwia oszczędność paliwa, ochronę gleby przed erozją oraz precyzyjne nawożenie. Model SM o szerokości 3–6 m z zintegrowanym zasobnikiem lub podłączeniem do FERTI-BOX.
  row-master: >-
    ROW-MASTER RN to międzyrzędowa pielnik BEDNAR do mechanicznej pielęgnacji kukurydzy, słonecznika, rzepaku i soi. Sekcja z nożowymi redlicami i talerzami do precyzyjnego prowadzenia w międzyrzędziu 45–80 cm. Możliwość doposażenia w aplikację nawozów płynnych lub nawożenie pasowe. Szerokość 6–12 m.
  galaxy: >-
    GALAXY to seria ciężkich wałów BEDNAR do rekonsolidacji gleby po orce, uprawie lub wiosną na pszenicy. Segmenty Cambridge lub Crosskill o średnicy 530–630 mm, szerokości 6–18 m. Model GO z ramą składną do zastosowań na dużych areałach.
  presspack: >-
    PRESSPACK to zawieszany wał dociskowy BEDNAR za pługiem lub kultywatorem do natychmiastowej rekonsolidacji i zamknięcia profilu. Gumowe lub stalowe pierścienie o średnicy 700–900 mm o dużej masie dla głębokiego działania. Model PP o szerokości 3–6 m, montaż na tylny układ trzypunktowy lub bezpośrednio na narzędzie.
  presser: >-
    PRESSER PE to ciągnięty wał dociskowy BEDNAR za pługiem do ciągłej rekonsolidacji orki podczas orki. Eliminuje drugi przejazd wałem i umożliwia bezpośrednie przejście do siewu. Szerokości odpowiadają wielkości pługa, model PE dla pługów 5–9 skibowych.
