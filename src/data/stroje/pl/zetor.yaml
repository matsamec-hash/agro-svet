# PL overlay (opisy/pola) na strukturę cs. Tłumaczenie z cs/sk, wymaga korekty.

country: "Czechy"
description: >-
  Tradycyjny czeski producent ciągników z Brna, powstały w 1946 roku ze Zbrojovki Brno (pierwotnie silniki lotnicze Aero/Avia). Nazwa **Z**brojovka + trak**TOR**. Definiująca seria **UR I** (od 1962) stała się kręgosłupem czeskiego i wschodnioeuropejskiego rolnictwa. Obecne serie **Major, Proxima, Forterra, Crystal HD** obejmują 53–170 KM. Od 2018 roku współpraca z John Deere. Właściciel: HTC Investments. Eksport do ponad 60 krajów.

categories:
  traktory: "Ciągniki"

series:
  z-25: >-
    Pierwszy ciągnik Zetora, zaprezentowany w **1946** w Brnie. Powstał w zakładach **Zbrojovki Brno** (przedwojenne silniki lotnicze Aero/Avia) i zdefiniował **system Zetora** — prosta obsługa, dostępny serwis, jeden układ paliwowy dla całej serii. Wersja **Z 25K** (1950) przyniosła lepszą kabinę, **Z 25A** (1952) otrzymał hydrauliczny trzypunktowy układ zawieszenia. Łącznie wyprodukowano ponad **158 500 sztuk** — ciągnik definiujący powojenne rolnictwo czechosłowackie.
  ur-i:
    name: "UR I — Unifikowana seria I (1962–1998)"
    description: >-
      Ikoniczna zunifikowana seria wprowadzona w **1962** modelami 4011/5511/6711 — kręgosłup czeskiego i wschodnioeuropejskiego rolnictwa. Pierwotna generacja (1962–1979) miała otwartą kabinę i silniki Zetor 4001/5001 (4-cylindrowe); **modernizacja z 1980** przyniosła nową zamkniętą kabinę, nowe silniki Zetor 5201/7201 (3-cylindrowe) oraz modele 5211/7211/7745 produkowane aż do **1998**. Przekładnia 10/2, prosta konstrukcja, legendarna niezniszczalność.
  ur-ii:
    name: "UR II — Unifikowana seria II (1968–2002)"
    description: >-
      Większa i mocniejsza zunifikowana seria wprowadzona w **1968** modelem **Crystal 8011** — pierwszy sześciocylindrowy Zetor. **Crystal 12011** (1972) dodał turbo i zyskał kultowy status jako **wersja leśna** do zrywki drewna. Do średnich i większych gospodarstw. Silniki Zetor 7401 (4-cylindrowy) i 8001/8101 (6-cylindrowe), przekładnia 10/2 lub 16/8 z biegiem pełzającym. Modernizacja z 1986 przyniosła nową kabinę (8111/9111/10111).
  super: >-
    Modernizacja UR II z nową kabiną i silnikiem Zetor Z 1505. Ogniwo pośrednie do serii Forterra.
  forterra: >-
    Flagowa seria — nowoczesna kabina Horizon II, w pełni zsynchronizowana przekładnia 24/18 z rewersem i napędem 4WD. Silnik Zetor Z 1505/1605 z turbo i intercoolerem.
  forterra-hsx-hd-cl: >-
    Modernizacja Forterry z nową maską, wyświetlaczem i silnikiem Zetor Stage IV / V. Warianty HSX (power shift), HD (premium), CL (klasyczny).
  proxima-gen1: >-
    Następca serii Super. Przystępny cenowo ciągnik do mniejszych gospodarstw. Silnik Z 1205, zsynchronizowana przekładnia 10/10 lub 20/20 z rewersem.
  proxima-cl-gp-hs: >-
    Aktualna generacja Proximy w kilku wariantach — CL (classic), GP (general purpose), HS (high spec), Power i Plus. Silnik Zetor 1204 / 1605 Stage V.
  crystal: >-
    Powrót legendarnej nazwy Crystal (pierwotny Crystal 8011/12011 z lat 70. i 80.). Najmocniejszy współczesny Zetor — 150–170 koni, silnik **Deutz TCD 6.1** (6-cylindrowy), przekładnia ZF 16/16 z PowerShift, zawieszana oś przednia.
  major: >-
    Najmniejsza seria Zetora — ciągnik użytkowy do zastosowań komunalnych, sadów i drobnych gospodarstw. Silnik **Iveco F5C** (4-cylindrowy, 3,2 l), przekładnia 12/12 zsynchronizowana. Warianty **CL** (Comfort Line) i **HT** (High Tech) dodane w 2018.
  utilix-compax: >-
    Kompaktowe ciągniki 25–55 KM do zastosowań komunalnych i specjalistycznych. Rebranding OEM (Utilix HT z TYM Korea, Compax z TAFE Indie) sprzedawany pod marką Zetor. Produkcja zakończona w 2020 — ta klasa pozostaje w ofercie nieobsadzona (Major zaczyna się od 53 KM).

models:
  zetor-25: >-
    Pierwszy w historii seryjny Zetor. Produkowany w latach 1946–1949 (ok. 43 tys. szt.).
  zetor-25k: >-
    Konstrukcyjnie zmodyfikowana wersja — ulepszona kabina i mocowanie osprzętu.
  zetor-25a: >-
    Najbardziej zaawansowany Z 25 — hydrauliczny trzypunktowy układ zawieszenia, zmodernizowana hydraulika. Produkowany równolegle z UR I aż do 1968 roku.
  zetor-4011: >-
    Pierwszy model UR I — klasa podstawowa. Zdefiniował serię razem z 5511 i 6711.
  zetor-5511: >-
    Średniej wielkości UR I. Najlepiej sprzedający się model lat 60. w Czechosłowacji.
  zetor-6711: >-
    Wyższa klasa średnia UR I. Dołączony w 1966 roku w odpowiedzi na rosnące gospodarstwa.
  zetor-7011: >-
    Szczyt pierwotnej serii UR I. Zastąpiony w 1980 roku zmodernizowanym 7211.
  zetor-7245-horal: >-
    Specjalna wersja górska o zwiększonej stateczności.
  zetor-crystal-8011: >-
    Pierwszy w historii sześciocylindrowy Zetor. Otworzył erę UR II i później przekazał nazwę Crystal nowoczesnej serii HD (od 2014).
  zetor-crystal-10011: >-
    Ogniwo pośrednie między 8011 a 12011. 6-cylindrowy wolnossący.
  zetor-crystal-12011: >-
    Szczytowy Zetor lat 70. Wersja leśna (Lesní 12011) z ramą ochronną i wciągarką była ikoną lasów czechosłowackich — używana do zrywki drewna jeszcze w XXI wieku.
  zetor-16245: >-
    Najmocniejszy model UR II, 6-cylindrowy turbo.
  zetor-proxima-power-120: >-
    Zetor Proxima Power 120 nowej generacji (od 2024) — nowy silnik, kabina, cyfrowy wyświetlacz. Inspiracja włoskim wzornictwem SDF (Same Deutz-Fahr).
