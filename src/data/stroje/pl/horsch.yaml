# PL overlay (opisy/pola) na strukturę cs. AI draft + edytor, wymaga review.

country: "Niemcy"
description: >-
  Niemiecki pionier technologii no-till i minimum-till z siedzibą w Schwandorfie (Bawaria). Pneumatyczne siewniki Pronto i Sprinter, precyzyjne siewniki Maestro, no-till talerzowy siewnik Avatar, głębokościowe kultywatory Tiger, brony talerzowe Terrano, brony talerzowe Joker oraz opryskiwacze Leeb (ciągnione i samobieżne PT/VL).

categories:
  ochrana-rostlin: "Ochrona roślin"
  seti: "Siew i sadzenie"
  zpracovani-pudy: "Uprawa gleby"

series:
  leeb-ax: >-
    Leeb AX — ciągniony opryskiwacz dla średnich gospodarstw, kontynuuje poprzednią serię Leeb LT (4 000 i 6 000 l). Oferuje ramę opryskową BoomControl z aktywnym tłumieniem, precyzyjną regulację poszczególnych dysz (PrecisionSpray) oraz terminal isobus SmartTouch. Kompromis między ceną a najwyższą jakością aplikacji charakterystyczną dla Horsch.
  leeb-gs: >-
    Leeb GS — ciągniony opryskiwacz o dużej pojemności (6 000 i 8 000 l) do dużych areałów. Standardowy BoomControl Pro z czujnikami ultradźwiękowymi utrzymuje ramę opryskową 30–50 cm nad uprawą nawet przy prędkości powyżej 15 km/h. Wewnętrzna cyrkulacja CCS Pro umożliwia szybkie przejście między preparatami bez ryzyka zanieczyszczenia. Rama opryskowa do 42 m.
  leeb-pt: >-
    Leeb PT — samobieżny opryskiwacz dla dużych gospodarstw i usług aplikacyjnych. Zbiornik 6 000 lub 8 000 l, szerokość robocza 24–42 m. Hydropneumatyczne zawieszenie ramy i osi, płynna regulacja prześwitu oraz przekładnia HydroDrive. Flagowy model segmentu samobieżnych opryskiwaczy Horsch.
  leeb-vl: >-
    Leeb VL — samobieżny opryskiwacz o zwiększonym prześwicie (do 165 cm) przeznaczony do aplikacji w wysokich uprawach, takich jak kukurydza, słonecznik i ziemniaki. Zbiornik 5 000 lub 6 000 l, hydraulicznie regulowany rozstaw kół 1,80–2,25 m. Konfiguracja pośrednia między PT a opryskiwaczem typu high-clearance.
  avatar: >-
    Avatar — ciągniony pneumatyczny siewnik do bezpośredniego siewu (no-till) w nieuprawioną glebę i międzyplony. Talerzowy redlicowy SingleDisc z dociskiem do 350 kg radzi sobie nawet z twardą ściernią. Wersja SD to siewnik rzędowy z dwoma zbiornikami, SL posiada duży zbiornik na nawóz (wariant solo lub duo). Szerokość robocza 6, 8, 10 i 12 m.
  express: >-
    Express — kombinacja siewna z aktywnym rotacyjnym lemieszem (KR) lub turbo talerzowym kultywatorem (TD). Niesiona wersja 3, 3,5 i 4 m do tradycyjnego przygotowania łóżka siewnego w jednym przejeździe z ciągnikiem średniej mocy. Redlice TurboDisc 2.0 gwarantują precyzyjne umieszczenie nasion.
  focus: >-
    Focus TD — ciągniona kombinacja siewna z zintegrowanym głębokościowym kultywatorem (TerraGrip), redlicami do nawozu oraz redlicami siewnymi TurboDisc 2.0. Strip-till w jednej operacji: kultywuje, nawozi pod nasiona i sieje. Szerokość robocza 4 i 6 m, wariant Focus z zbiornikiem PPF na nawóz.
  maestro: >-
    Maestro — precyzyjny siewnik do kukurydzy, słonecznika, buraków i soi z elektrycznym aparatem wysiewającym AirVac (CV/CX) lub AirSpeed (SV/SX) do 15 km/h. CV/SV to klasyczne modele z centralnym zbiornikiem na nawóz, CX/SX mają indywidualne zasobniki. RV to wersja ciągniona z dużym centralnym zbiornikiem PPF. Szerokość robocza 6–24 m, rozstaw rzędów 45/50/70/75/80 cm.
  pronto: >-
    Pronto DC — flagowa seria pneumatycznych uniwersalnych siewników Horsch. Standardowa kombinacja przedniego koła, talerzowego kultywatora, wału ugniatającego i redlic TurboDisc 2.0 umożliwia siew w mulcz oraz w przygotowaną orkę w jednym przejeździe. Niesione wersje 3 m oraz ciągnione do 9 m, zdolne do obsługi 5–18 ha na godzinę.
  serto: >-
    Serto SC — ciągniony pneumatyczny siewnik o krótkiej konstrukcji i dwurzędowym układzie redlic TurboDisc z indywidualnym dociskiem 5–120 kg. Odpowiedni do wysokich prędkości siewu w mulcz oraz orkę z dużą ilością resztek. Szerokość robocza 10 i 12 m.
  sprinter: >-
    Sprinter ST/NT — pneumatyczny siewnik z elastycznymi redlicami grzebieniowymi typu tine seeder do siewu w nieuprawioną ściernię, płytko uprawioną glebę lub międzyplony. ST ma sztywną ramę 6 m, NT składana rama do 12 m z prędkością roboczą powyżej 12 km/h. Odpowiedni do suchych obszarów i prostej technologii no-till.
  versa: >-
    Versa KR — niesiona pneumatyczna kombinacja siewna z aktywnymi rotacyjnymi bronami dla małych i średnich gospodarstw. Uniwersalne zastosowanie w różnych warunkach glebowych bez konieczności przygotowania łóżka siewnego osobnym sprzętem. Szerokość robocza 3 i 4 m.
  cruiser: >-
    Cruiser SL/XL — brona talerzowa do płytkiej uprawy 3–15 cm z wąskimi redlicami w 5–6 rzędach o rozstawie 15 cm. SL to wersja niesiona 5 i 6 m, XL ciągniona do 12 m. Odpowiednia do szybkiej, intensywnej uprawy po zbiorze i przyspieszenia rozkładu resztek roślinnych.
  finer: >-
    Finer SL — kompaktomat do przygotowania drobnego łóżka siewnego z kombinacją sprężynowych i redlicowych lemieszy oraz wału ugniatającego. Wersja niesiona o szerokości roboczej 6 m, głębokość 2–10 cm. Przeznaczony głównie do wiosennego przygotowania przed siewem buraków cukrowych i kukurydzy.
  joker: >-
    Joker CT/RT/HT — kompaktowa brona talerzowa z talerzami 52 cm w układzie X do płytkiej uprawy 3–12 cm. CT to wersja niesiona 3–6 m ze sztywną ramą, RT ciągniona 4–12 m z wałem pneumatycznym, HT ciągniona 8–12 m z dużymi oponami pneumatycznymi do wyższych prędkości (do 18 km/h). Idealna do intensywnej uprawy po zbiorze zbóż.
  terrano: >-
    Terrano FX/GX/MT — flagowa seria bron talerzowych Horsch do średnio głębokiej uprawy 5–30 cm. FX (3 i 4 m, niesione), GX (5 i 6 m, ciągnione półniesione) oraz MT (5–8 m, ciągnione z szybkim systemem TerraGrip). Uniwersalny sprzęt do uprawy, głębszego kultywowania oraz przygotowania pod siew.
  tiger: >-
    Tiger MT/AS/LT — głębokościowy kultywator do intensywnej uprawy do głębokości 35 cm. MT (4 i 6 m) ma redlice TerraGrip dla maksymalnej przepustowości masy organicznej, AS (kombinowany 4–8 m) dodaje talerze i wał do pełnego przygotowania łóżka w jednym przejeździe, LT (10 i 12 m) to duża wersja ciągniona dla największych gospodarstw. Zastępuje pług w systemach minimum-till.
