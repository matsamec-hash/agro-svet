# PL overlay (opisy/pola) na strukturę cs. AI draft + edytor, wymaga review.

country: "Finlandia"
description: >-
  Fiński producent ciągników z długą tradycją (wcześniej Valmet). Część koncernu AGCO od 2004 roku. Znany z solidnej konstrukcji przystosowanej do warunków północnych, systemu rewersu TwinTrac (kabina z obrotowym fotelem do pracy tyłem) oraz personalizacji — każdy ciągnik jest produkowany na miarę według wymagań klienta. Nie produkuje kombajnów.

categories:
  traktory: "Ciągniki"

series:
  valmet-6000-8000: >-
    Ciągniki Valmet / Valtra Valmet: seria Mezzo 6000 (od 1991) i modele „pięćdziesiątki” 8000 (1995–2004); 6200–6400 produkowano jeszcze w latach 2005–2007. Silniki Valmet / Sisu 4- i 6-cylindrowe, przekładnia 12F/12R synchronizowana, opcjonalnie Delta Powershift 36F/36R.
  hitech: >-
    Czterocylindrowe ciągniki HiTech 6250, 6350, 6550, 6650, 6750 i 6850 (ok. 1998–2006) z silnikami Sisu 4,4 l i przekładnią HiTech 36F/36R zmienianą pod obciążeniem. Sprzedawane pod markami Valtra Valmet i Valtra. W zestawieniu są też Valmet 6600 i 6800 z serii Mezzo, które nie miały wersji HiTech.
  n-gen1: >-
    Pierwsza generacja N Series (2005): N91, N101, N111, N111e, N121 i N141, od 2007 także N82 i N92. Silniki Sisu / AGCO Power 4,4 l, przekładnie HiTech, a od 2008/09 Versu i bezstopniowa Direct (N122, N142). Od stycznia 2012 zastąpiła ją 3. generacja N93–N163.
  n-gen2:
    name: "N Series Mk3 / 4. generacja (2014–2021)"
    description: >-
      4. generacja N Series (N4, 2014/2015–2021): N104, N114e, N124, N134, N154e i N174. Silniki AGCO Power 4,4 i 4,9 l, wersje HiTech, Active, Versu i bezstopniowa Direct, okno dachowe SkyView do pracy z ładowaczem czołowym.
  n-gen3:
    name: "N Series Mk4 / 5. generacja (2021–obecnie)"
    description: >-
      5. generacja N Series (N5, od 14.04.2021): N135, N155e i N175. Silnik AGCO Power 4,9 l Stage V, wersje Active, Versu i bezstopniowa Direct, kabina SmartTouch.
  t-gen1: >-
    Zbiorcza pozycja trzech generacji T Series: T130–T190 (2003–2007/08), T121–T191 (2007–2012, od 2009 także bezstopniowa Direct) i T213 (2012–2014). Sześciocylindrowe silniki Sisu / AGCO Power 6,6 i 7,4 l, przekładnie HiTech, HiTech 5 i Versu.
  t-gen2: >-
    4. generacja T Series (T4, jesień 2014 – kwiecień 2021): T144 i T154 z silnikiem AGCO Power 6,6 l, większe modele 7,4 l; przekładnie HiTech, Active, Versu i bezstopniowa Direct, od 2017 kabina SmartTouch. Od kwietnia 2021 zastąpiła ją 5. generacja T145–T255, obecnie produkowana jest 6. generacja T146–T236.
  s-gen1: >-
    S Series S232–S352 (2009–2011): silnik AGCO Power 8,4 l, przekładnia AGCO Variable Transmission (AVT), stanowisko rewersyjne TwinTrac. Od 2011 roku zastąpiły ją S233–S353.
  s-gen5: >-
    4. generacja S Series (S4): S274–S374 od przełomu 2013/2014, S394 od 2017. Silnik AGCO Power 8,4 l, przekładnia AGCO Variable Transmission (AVT), kabina SmartTouch. W listopadzie 2023 zastąpiła ją 6. generacja S286–S416.
  a-series: >-
    4. generacja A Series (A4, 2017–2021) dla mniejszych gospodarstw i usług komunalnych: A74–A94 z trzycylindrowym AGCO Power 3,3 l, A104–A134 z czterocylindrowym 4,4 l. W styczniu 2021 zastąpiła ją mocniejsza o 5 KM 5. generacja A75–A135.
  g-series: >-
    Klasa średnia pomiędzy A i N. Silnik AGCO Power 4,4 L Stage V, kompaktowe rozmiary z nowoczesną kabiną SmartTouch (opcjonalna) lub Classic.
  q-series: >-
    Seria między T a S, zaprezentowana 2.09.2022. Sześciocylindrowy AGCO Power 7,4 l Stage V, przekładnia bezstopniowa, kabina SmartTouch. Modele Q225–Q305.
