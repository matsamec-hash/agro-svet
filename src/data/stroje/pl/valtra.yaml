# PL overlay (opisy/pola) na strukturę cs. AI draft + edytor, wymaga review.

country: "Finlandia"
description: >-
  Fiński producent ciągników z długą tradycją (wcześniej Valmet). Część koncernu AGCO od 2004 roku. Znany z solidnej konstrukcji przystosowanej do warunków północnych, systemu rewersu TwinTrac (kabina z obrotowym fotelem do pracy tyłem) oraz personalizacji — każdy ciągnik jest produkowany na miarę według wymagań klienta. Nie produkuje kombajnów.

categories:
  traktory: "Ciągniki"

series:
  valmet-6000-8000: >-
    Ostatnia generacja pod marką Valmet przed przemianowaniem na Valtra (2001). Silnik Valmet 4- i 6-cylindrowy, przekładnia synchronizowana 30/30. Popularne w Europie Środkowej ze względu na prostotę i dostępność.
  hitech: >-
    Pierwsza generacja pod marką Valtra (od 2001). Silnik Sisu Power 4- i 6-cylindrowy, przekładnia HiShift z elektronicznym sterowaniem 40/40. Dostępny system rewersu TwinTrac.
  direct-legacy: >-
    Pierwsza Valtra z płynną przekładnią bezstopniową (CVT). Rewolucyjna technologia dla producenta historycznie opartego na przekładniach mechanicznych.
  n-gen1: >-
    Nowa uniwersalna seria. Silnik AGCO Power 4-cylindrowy, przekładnia HiTech 5 / Versu Powershift 36/36 / Direct CVT. Kabina opracowana we współpracy z projektantem przemysłowym.
  n-gen2:
    name: "N Series Mk3 / 4. generacja (2014–2021)"
    description: >-
      Trzecia generacja serii N (Valtra marketingowo określa ją jako 4. generację). Silnik AGCO Power 4,4 L (4-cylindrowy) lub 4,9 L (4-cylindrowy), Stage IV/V. Wersje Active (mechaniczna), Versu (Powershift) i Direct (CVT). Kabina z dachem SkyView dla przedniego ładowacza. Modele z sufiksem -4 (N104, N114, …, N174).
  n-gen3:
    name: "N Series Mk4 / 5. generacja (2021–obecnie)"
    description: >-
      Czwarta generacja serii N (Valtra Unlimited). Silnik AGCO Power 4,9 L Stage V, przekładnia Active / Versu (Powershift) / Direct (CVT). Kabina SmartTouch 3 z 9" wyświetlaczem, podłokietnik z przyciskami OLED. Modele bez sufiksu -4 (zmiana nazewnictwa na N135/N155/N175/N195).
  t-gen1: >-
    Flagowa seria row-crop. Silnik Sisu/AGCO Power 6-cylindrowy 6,6 L i 7,4 L. Wersje HiTech, HiTech 5, Versu (Powershift) i Direct (CVT).
  t-gen2: >-
    4. i 5. generacja. Silnik AGCO Power 6-cylindrowy 7,4 L, przekładnia HiTech 5, Active, Versu (Powershift 5x5), Direct (CVT). Kabina SmartTouch (od 2015) — zintegrowany 9" wyświetlacz i joystick z symbolami OLED.
  s-gen1: >-
    Pierwsza generacja serii S. Silnik AGCO Power 8,4 L, przekładnia Direct CVT, kabina TwinTrac (rewersyjna).
  s-gen5: >-
    5. generacja. Silnik AGCO Power 8,4 L Stage V, przekładnia AGCO PowerSplit CVT. Kabina SmartTouch.
  a-series: >-
    Seria użytkowa dla mniejszych gospodarstw i sektora komunalnego. Silnik AGCO Power 3,3 L i 4,4 L, przekładnia mechaniczna / HiTech, rewersor Power Shuttle.
  g-series: >-
    Klasa średnia pomiędzy A i N. Silnik AGCO Power 4,4 L Stage V, kompaktowe rozmiary z nowoczesną kabiną SmartTouch (opcjonalna) lub Classic.
  q-series: >-
    Najnowsza seria pomiędzy T i S, wprowadzona w 2022 roku (FIMA Zaragoza). Silnik **AGCO Power CORE66 6,6 L** (NIE 7,4 L jak w serii T) Stage V, przekładnia PowerSplit CVT, kabina SmartTouch 3 z opcjonalnym rewersyjnym układem kierowniczym TwinTrac, Valtra SmartControl, tryb EcoPower dla niższego zużycia.
