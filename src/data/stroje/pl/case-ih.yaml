# PL overlay (opisy/pola) na strukturę cs. AI draft + edytor, wymaga review.

country: "USA / UK"
description: >-
  Amerykańska marka z korzeniami w Case Corporation (1842) i International Harvester (1902), połączona w 1985 roku. W ramach koncernu CNH Industrial. Charakterystyczny czerwony kolor i flagowa seria Magnum, ceniona za wytrzymałość i przekładnie CVT. Kombajny Axial-Flow utrzymują pozycję lidera w konstrukcji z jednym rotorem od 1977 roku.

categories:
  traktory: "Ciągniki"
  kombajny: "Kombajny"

series:
  7100-magnum: >-
    Legendarna pierwsza generacja Magnum — pierwszy ciągnik marki Case IH po połączeniu. Silnik Case 5,9 L turbo, przekładnia Powershift 18/2.
  8900-magnum: >-
    Krótka generacja pomiędzy 7000 a MX. Silnik Case 8,3 L o wyższej mocy.
  mx-maxxum: >-
    Oryginalna seria MX Maxxum (poprzednik MXM i nowoczesnego Maxxuma). Średni ciągnik użytkowy produkowany w Doncaster (UK) i Racine (USA). Silnik Case 4- i 6-cylindrowy, przekładnia 16/12 Synchro. Modele 80–150 KM.
  mx-magnum: >-
    Nowa generacja Magnum oznaczona jako MX. Silnik Case 8,3 L common-rail, przekładnia 18/4 PowerShift lub 8/2 ClutchPak.
  cvx: >-
    Pierwsza seria Case IH z płynną przekładnią CVT — technologia przejęta po akwizycji Steyr (1996). Produkowana w St. Valentin (Austria). Silnik Sisu/Iveco 6-cylindrowy, przekładnia **Steyr S-Matic CVT**. Oryginalna generacja CVX 130/150/170 (1999), modernizacja CVX 1135/1145/1155/1170/1190/1195 (2003+). Poprzednik Puma CVX i Maxxum CVX.
  mxm: >-
    Uniwersalna seria następująca po MX Maxxum, poprzednik Puma. Produkowana w Basildon (UK) we współpracy z New Holland (model siostrzany TM). Silnik Iveco/NEF 6-cylindrowy, przekładnia Range Command 18/6 lub Power Command 19/6. Modele 110–180 KM.
  cs-series: >-
    Klasa użytkowa z fabryki **St. Valentin (Austria)** — dawna fabryka Steyr. Silnik **Sisu/Steyr 4-cylindrowy 4,5 L** (wspólny ze Steyr Profi/Profi Plus), przekładnia Synchro-Shuttle 16/8. Poprzednik Maxxum i Vestrum.
  cx-series: >-
    Ciągniki użytkowe dla małych i średnich gospodarstw. Silnik Case 4-cylindrowy, hydraulika 80 l/min.
  farmall: >-
    Seria użytkowa nawiązująca do słynnej nazwy Farmall z lat 70. IH. Silnik FPT 3- i 4-cylindrowy, przekładnia mechaniczna lub ActiveDrive. Produkowana lokalnie we Włoszech i Turcji.
  maxxum: >-
    Średnia seria dla gospodarstw mieszanych. Silnik FPT NEF 6,7 L, przekładnia 16/16 Electro Command lub ActiveDrive 8 (nowa wersja z podwójnym sprzęgłem), opcjonalna CVT (CVXDrive).
  puma: >-
    Premium uniwersalna seria. Silnik FPT NEF 6,7 L (do Puma 220), Cursor 9 (Puma 230+), przekładnia Full Powershift 18/6 lub CVXDrive (CVT). Kabina MultiControl armrest.
  magnum: >-
    Flagowa seria row-crop. Silnik FPT Cursor 9 (8,7 L) i Cursor 13 (12,9 L), przekładnia Full Powershift 19/4 lub CVXDrive. AFS AccuTurn, warianty gąsienicowe Rowtrac.
  optum: >-
    Między Magnum a Puma — kompaktowy row-crop z CVT. Silnik FPT Cursor 9, przekładnia CVXDrive (płynna).
  vestrum: >-
    Kompaktowa średnia seria z płynną przekładnią CVT (CVXDrive). Wypełnia lukę między Maxxum a Puma. Silnik FPT NEF 4-cylindrowy 4,5 L Stage V, przekładnia CVXDrive S-Matic. Kabina MultiControl Armrest, terminal AFS Pro 700.
  steiger: >-
    Przegubowe ciągniki 4WD dla dużych gospodarstw, produkowane w Fargo (North Dakota, USA). Akwizycja Steiger Tractor Co. miała miejsce w roku **1986** (założona 1957 w Red Lake Falls, Minnesota). Obecne warianty: **kołowy Steiger** (klasyczna rama) i **Quadtrac** (4 trójkątne gumowe gąsienice, wprowadzony w 1996 jako STX375 Quadtrac). Silnik FPT Cursor 13 (12,9 L) i Cursor 16 (16 L) w aktualnych modelach.
  quadtrac: >-
    Pierwszy na świecie przegubowy ciągnik z 4 niezależnymi gumowymi gąsienicami (4-track). Wprowadzony w 1996 jako Steiger STX 4-Track, od 2006 w pełni pod marką Case IH Quadtrac. Produkowany w Fargo (North Dakota, USA). Specjalnie przeznaczony do dużej orki i uprawy z niskim naciskiem na glebę (powierzchnia kontaktu 4× większa niż przy kołach). Silnik FPT Cursor 13 (12,9 L) i Cursor 16 (16 L), przekładnia Full Powershift 16/2. Na rynku środkowoeuropejskim stosowany na dużych farmach do głębokiej uprawy gleby. Obecne modele: Quadtrac 470, 500, 540, 580, 620 oraz flagowy **Quadtrac 715** (2024) — najpotężniejszy ciągnik Case IH.
  axial-flow-16-21-series: >-
    Legendarna konstrukcja z jednym rotorem — Case IH wynalazł system młócący osiowy w 1977 roku. Serie 1660, 1666, 1680, 1688, 2166, 2188, 2366, 2388 były produkowane ponad 20 lat i do dziś na rynku wtórnym w Europie Środkowej są powszechnie sprzedawane.
  axial-flow-80-series: >-
    Kontynuacja serii Axial-Flow. Silnik Iveco/FPT 8,3 i 10,3 L, ulepszony system młócący.
  axial-flow-130-140-series: >-
    Silniki FPT Tier 4, AFS Harvest Command, zmienny rotor. Seria 140 do wymagającej pracy.
  axial-flow-150-250-series: >-
    Najnowocześniejsza generacja. AFS Harvest Command Automation z AI, silniki FPT Cursor 9/13 Stage V, w pełni automatyczne ustawianie systemu młócącego według plonu. Flagowy 9250 to najpotężniejszy kombajn Case IH.
