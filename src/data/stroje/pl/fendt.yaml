# PL overlay (opisy/pola) na strukturę cs. Tłumaczenie z cs/sk, wymaga korekty.

country: "Niemcy"
description: >-
  Premium niemiecka marka ciągników znana z przekładni CVT Vario. Należy do koncernu AGCO od 1997 roku. Technologia Vario (przekładnia bezstopniowa) zadebiutowała w 1995 roku i dziś obejmuje całą ofertę — od małego 200 Vario po flagowy 1000 Vario. Kombajny IDEAL należą do najbardziej zaawansowanych na świecie.

categories:
  traktory: "Ciągniki"
  kombajny: "Kombajny"

series:
  dieselross: >-
    Pierwotny ciągnik Fendta — Hermann Fendt zbudował pierwszego „diesel horse" w warsztacie ojca w 1928 roku ze stacjonarnego silnika i starej kosiarki. W 1937 roku firma została wpisana do rejestru handlowego jako Xaver Fendt & Co. i ruszyła produkcja seryjna. Chłodzony powietrzem jednocylindrowy diesel Deutz zdefiniował niemiecki wiejski ciągnik — prosty, solidny, zaprojektowany dla małych gospodarstw. Seria Dieselross obejmowała od 6 koni (F6) po 40 koni (F40) i zakończyła się w 1958 roku, gdy zastąpiły ją serie Favorit, Farmer i Fix.
  favorit-classic: >-
    Legendarna seria, która zdefiniowała premium pozycję Fendta. Favorit 1 z 1958 roku był pierwszym modelem z nowo zaprojektowaną przekładnią, Favorit 4 był pierwszym 6-cylindrowcem marki, a Favorit 600 LS przyniósł w 1979 roku hydrodynamiczny Turbomatik (sterowany rozruch przez sprzęgło hydrauliczne) wraz z w pełni zsynchronizowaną przekładnią TriPower. Flagowy Favorit 626 LS Turbomatik o mocy 252 koni i silniku MAN D2566 był przez wiele lat najmocniejszym ciągnikiem marki — wyprodukowano zaledwie 66 sztuk. Ta seria jest bezpośrednim poprzednikiem Favorit 500/700/800/900 z lat 90. i stoi u źródeł premium reputacji Fendta.
  farmer-100-200: >-
    Następca serii Dieselross w klasie małej i średniej. Klasyczny Farmer z mechaniczną zsynchronizowaną przekładnią, licznie importowany do ówczesnej Czechosłowacji i krajów RWPG po politycznej odwilży lat 60. W 1978 roku na wystawie DLG zaprezentowano serię 100 w wersjach S i LSA z nieco podwyższoną mocą i kabiną Edition. Chłodzony powietrzem silnik MWM AKD lub Deutz F3L912 słynął z niezawodności i niskiej pracochłonności obsługi.
  farmer-300-400-lsa: >-
    Średnia i większa klasa Farmer z mechaniczną przekładnią. Silnik MWM/Deutz, zsynchronizowana przekładnia 21/6 lub 24/8. Solidna konstrukcja, do dziś popularna w drobnych i sadowniczych gospodarstwach.
  xylon: >-
    Specjalność Fendta — uniwersalny ciągnik systemowy z centralną kabiną, odwracalnym stanowiskiem kierowcy i trzema układami zawieszenia (przednim, środkowym, tylnym). Do zastosowań komunalnych i specjalistycznych.
  favorit-500-c: >-
    Mechaniczna przekładnia 44/44 TurboMatik, przed pojawieniem się technologii Vario. Silnik MWM 6-cylindrowy 6,2 L.
  favorit-500-vario: >-
    **Historyczny kamień milowy** — pierwszy seryjnie produkowany ciągnik na świecie z bezstopniową przekładnią wariatorową (CVT). Przekładnia ML70 Vario pracuje bez biegów, z płynną zmianą prędkości od 0 do 40 km/h. Przełom w konstrukcji ciągników.
  favorit-700-vario: >-
    Flagowa seria po Favorit 500/600. Silnik MAN 6-cylindrowy 6,9 L, przekładnia ML85 Vario z płynną zmianą 0–50 km/h.
  favorit-800-vario: >-
    Duża premium seria. Silnik MAN 6-cylindrowy 7,1 L, przekładnia ML100 Vario.
  favorit-900-vario: >-
    Flagowa seria dla wielkoobszarowych gospodarstw. Silnik MAN 6-cylindrowy 10,5 L, przekładnia ML150 Vario. Pierwszy ciągnik z Vario powyżej 200 KM.
  200-vario: >-
    Najmniejszy Fendt — generacja Gen3 wprowadzona do sprzedaży od końca stycznia 2021 (zamówienia od października 2020) w pełni zastąpiła pierwotną serię z 2009 roku. Warianty do sadów, winnic i zastosowań komunalnych (wersje V/F/P). Kompaktowa kabina ze standardowym sterowaniem FendtONE, przekładnia Vario, silnik AGCO Power 3-cylindrowy 3,3 L Stage V.
  300-vario-gen1: >-
    Użytkowa seria Vario. Silnik Deutz 4-cylindrowy 4,0 L turbo z intercoolerem, przekładnia ML75 Vario, kabina Visio Plus.
  300-vario-gen2: >-
    Generacja S4 z nową kabiną Visio Cab, wyświetlaczem VarioTerminal 7" i silnikiem Tier 4 AGCO Power 4,4 L.
  500-vario-gen1: >-
    Średnia seria. Silnik Deutz 4-cylindrowy 4,0 L, przekładnia ML90 Vario.
  500-vario-s4: >-
    Generacja S4/Gen3. Silnik Deutz 4-cylindrowy 4,0 L Stage IV/V, kabina Visio Cab, wyświetlacz 7", terminal FendtONE farmer od 2021.
  700-vario-gen1: >-
    Najlepiej sprzedająca się seria premium w Europie. Silnik Deutz 6-cylindrowy 6,1 L, przekładnia ML120 Vario. Ikoniczny układ.
  700-vario-s4: >-
    Generacje S4 i Gen6. Silnik Deutz 6-cylindrowy 6,1 L Stage IV/V, kabina VisioPlus, wyświetlacz VarioGuide + TI Headland. Rekordowa sprzedaż w CZ i SK.
  700-vario-gen7: >-
    Całkowicie nowa platforma. Silnik AGCO Power 7,5 L Core75 z układem eHybrid (generator 48V), przekładnia Vario TA 150, kabina FendtONE, dynamiczna oś kierująca VarioDrive. Moc do 303 KM, zupełnie nowa linia wzornicza.
  800-vario-gen1: >-
    Duża seria do upraw rzędowych. Silnik Deutz 6-cylindrowy 7,8 L, przekładnia ML130 Vario.
  800-vario-s4: >-
    Generacja Gen5/Gen6. Silnik **Deutz TCD 6.1 L** (6-cylindrowy, 6,06 L) Stage V, kabina ProfiPlus, ConceptCab. Aktualny skład: 826/829/832 Vario.
  900-vario-gen2: >-
    2. generacja serii 900. Silnik MAN 6-cylindrowy 9,0 L, przekładnia ML260 Vario, hydraulika 220 l/min, przednie zawieszenie.
  900-vario-gen3: >-
    Całkowicie nowa generacja — MAN D3876 6-cylindrowy 9,0 L, VarioDrive, FendtONE, kompletna cyfryzacja. Najmocniejszy 942 o mocy 415 KM jest najwyższym Vario w klasycznym ciągniku kołowym.
  1000-vario: >-
    Największy Fendt — całkowicie nowa platforma. Silnik MAN D4276 6-cylindrowy 12,4 L, napęd VarioDrive z elektronicznie sterowanymi osiami, przekładnia TA300 Vario. Masa 14 t, najmocniejszy ciągnik kołowy w standardowej konfiguracji.
  1100-vario-mt: >-
    Ciągnik gąsienicowy — flagowiec Fendta. Silnik MAN, gumowe gąsienice MTrack, przekładnia VarioDrive. Do dużych zastosowań rolniczych i budowlanych.
  600-vario: >-
    Aktualny Fendt 600 Vario — dane synchronizowane z api.fendt.com.
  900-vario-mt: >-
    Aktualny Fendt 900 Vario MT — dane synchronizowane z api.fendt.com.
  1000-vario-gen4: >-
    Aktualny Fendt 1000 Vario Gen4 — dane synchronizowane z api.fendt.com.
  c-series: >-
    Ekonomiczna seria kombajnów klasycznych przejęta od Laverdy (AGCO). Odpowiednia dla średnich gospodarstw. Silnik AGCO Power 6,6 L.
  l-series: >-
    Kombajny klasyczne Laverda pod marką Fendt. System 6 wytrząsaczy, rotacyjny doseparator. Silnik AGCO SISU Power 7,4 L.
  ideal: >-
    Rewolucyjna platforma rozwijana przez 7 lat wspólnie przez AGCO + MIT. Dwa rotory 600 mm HARVEST CORE, optymalizacja IDEALharvest z użyciem AI, konstrukcje węglowe. Warianty 7, 8, 9, 10 zależnie od mocy. Wersje gąsienicowe -T dla mniej ugniecionej gleby.
  corus-500: >-
    Aktualny Fendt CORUS 500 — dane synchronizowane z api.fendt.com.

models:
  fendt-dieselross-f6: >-
    Pierwszy seryjny Fendt — jednocylindrowiec 6 KM położył podwaliny całej marki.
  fendt-dieselross-f18: >-
    F18 był pierwszym Fendtem z niezależnym wałem odbioru mocy (WOM).
  fendt-dieselross-g25: >-
    Wojenny wariant na gaz drzewny — podczas wojny obowiązywał zakaz konstruowania ciągników na paliwo płynne, wyprodukowano 1 497 sztuk.
  fendt-farmer-1: >-
    Pierwszy Fendt z bezpośrednim wtryskiem oleju napędowego — przełom w sprawności małych diesli.
  fendt-favorit-4: >-
    Pierwszy 6-cylindrowy Fendt.
  fendt-favorit-615-lsa: >-
    Hydrodynamiczne sprzęgło Turbomatik do sterowanego płynnego rozruchu.
  fendt-favorit-626-lsa: >-
    Wówczas najmocniejszy Fendt — wyprodukowano tylko 66 sztuk.
  fendt-farmer-104-lsa: >-
    LSA = LS z napędem wszystkich kół (Allrad).
  fendt-farmer-200: >-
    Kompaktowe wymiary dla małych gospodarstw i zastosowań sadowniczych.
