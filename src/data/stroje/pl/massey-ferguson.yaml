# PL overlay (opisy/pola) na strukturę cs. AI draft + edytor, wymaga review.

country: "Kanada / USA"
description: >-
  Tradycyjna kanadyjsko-amerykańska marka powstała w 1953 roku w wyniku fuzji Massey-Harris (Kanada, 1847) i Ferguson (Wielka Brytania, 1933). Od 1994 roku część koncernu AGCO. Ciągniki produkowane w Beauvais (Francja), kombajny w Breganze (Włochy) i Hesstonie (USA). Znana z trójkątnego logo i numeracji serii (3000, 4700, 5M, 5S, 6S, 7S, 8S, 9S). Kluczową innowacją jest **Ferguson System** (3-punktowy zaczep, 1933), który wpłynął na wszystkie nowoczesne ciągniki.

categories:
  traktory: "Ciągniki"
  kombajny: "Kombajny"

series:
  100: >-
    Kluczowa seria Massey Ferguson lat 60. i 70. Modele 130, 135, 148, 165, 175, 178, 185 i 188 łączyły hydraulikę Fergusona z silnikami Perkins; produkowano je w Wielkiej Brytanii i we Francji. Dziś są poszukiwanymi zabytkami.
  500: >-
    Klasyczna seria użytkowa lat 70. i 80. Produkowana w Coventry (Wielka Brytania). Silnik Perkins 4-cylindrowy, mechaniczna przekładnia Multi-Power.
  1000: >-
    Duże ciągniki row-crop głównie na rynek północnoamerykański (1964–1978), produkowane w Detroit; MF 1080 powstawał też we Francji. Silniki Perkins 4- i 6-cylindrowe, najmocniejsze wersje z Perkinsem V8.
  200: >-
    Długotrwale udana seria użytkowa. Silniki Perkins 3- i 4-cylindrowe. Zastąpiła serię 100, a później została zastąpiona serią 300.
  300: >-
    Następca 200 Series produkowany w Coventry (1986–1997), silniki Perkins 3-, 4- i 6-cylindrowe. Modele 3610–3690 w tym zestawieniu należą do odrębnej serii MF 3600 z Beauvais (1987–1995).
  3000: >-
    Długa seria ciągników średnich i mocniejszych. Silnik Perkins 4- i 6-cylindrowy, przekładnia Speedshift.
  4200: >-
    Kompleksowa seria użytkowa dla małych i średnich gospodarstw. Silnik Perkins 1000 Series, 3- i 4-cylindrowy z turbodoładowaniem w wyższych wariantach. Synchronizowana przekładnia 12/12.
  4300: >-
    Zmodernizowana seria użytkowa. Silnik Perkins 900 i 1000 Series, przekładnia Speedshift z elektrohydraulicznym rewersem. Kabina o niskim poziomie hałasu.
  5400: >-
    Uniwersalna seria średnia. Silnik Perkins 1100 4- i 6-cylindrowy, przekładnia Dyna-4 i Dyna-6 Powershift. Kabina Tech-Platform.
  5600: >-
    Kompaktowa seria uniwersalna. Krótki rozstaw osi w modelach 3-cylindrowych (5608–5610) i długi rozstaw w 4-cylindrowych (5611–5613). Silnik AGCO Power, przekładnia Dyna-4.
  6100-6200: >-
    Średni row-crop. 6100 (1995–1999) zastąpił serię 3000, 6200 (1999–2002) jako ewolucja. Silnik Perkins 1000 Series 4- i 6-cylindrowy, przekładnia Dynashift 32/32.
  3700: >-
    Wąskie ciągniki specjalistyczne do sadów i winnic (MF 3707–3710, wersje V, S, F, GE i WF), zaprezentowane w listopadzie 2017. Silnik AGCO Power 3,4 l, 4-cylindrowy, 75–105 KM.
  4700: >-
    Ciągniki uniwersalne MF 4707–4710. Silnik AGCO Power 3,3 l, 3-cylindrowy (na niektórych rynkach poza Europą 4,4 l, 4-cylindrowy), przekładnia 12×12, w europejskiej 4700 M także Dyna-2.
  5700: >-
    MF 5700 M (5709 M–5713 M), zaprezentowana na Agritechnice w listopadzie 2019: silnik AGCO Power 4,4 l, 4-cylindrowy Stage V, przekładnia 12×12 lub Dyna-4. Starsza europejska MF 5700 / 5700 SL to inna seria.
  6700: >-
    MF 6700 S, zaprezentowana we wrześniu 2016: silnik AGCO Power 4,9 l, 4-cylindrowy, przekładnia Dyna-6 lub bezstopniowa Dyna-VT, z EPM do 200 KM (MF 6718 S). W Europie w 2021 roku zastąpiła ją MF 6S.
  7700: >-
    MF 7700 (od 2015) i 7700 S: silniki AGCO Power 6,6 l (7715 S–7720 S) i 7,4 l (7722 S–7726 S), przekładnia Dyna-6 lub bezstopniowa Dyna-VT. W Europie w 2021 roku zastąpiła ją MF 7S.
  8700: >-
    MF 8700 S: flagowa seria z silnikiem AGCO Power 8,4 l i bezstopniową przekładnią Dyna-VT. Wprowadzona w 2017 roku, ostatni egzemplarz wyprodukowano w styczniu 2025; następcą jest MF 9S (zaprezentowana w listopadzie 2023).
  5s: >-
    Nowa seria użytkowa z silnikiem AGCO Power 4,4 L 4-cylindrowym, przekładnią Dyna-4 Powershift i kabiną Visio zaprojektowaną dla maksymalnej widoczności. Red Dot Design Award 2022.
  6s: >-
    Średnia seria o wysokiej mocy z silnikiem AGCO Power 4,9 L 4-cylindrowym (najwyższa moc wśród 4-cylindrowych na rynku). Przekładnia Dyna-6 lub Dyna-VT (CVT).
  7s: >-
    Następca 7700 S. Silnik AGCO Power 6,6 L 6-cylindrowy, przekładnia Dyna-6 lub Dyna-VT (CVT). EPM (Engine Power Management) +30 KM.
  8s: >-
    Premium row-crop. Silnik AGCO Power 7,4 L 6-cylindrowy, przekładnia Dyna-VT (CVT) z Dynamic Tractor Management. Kabina Protect-U z izolowaną konstrukcją.
  9s: >-
    Flagowa seria, następca 8700 S, zaprezentowana na Agritechnice w listopadzie 2023. Silnik AGCO Power 8,4 l, 6-cylindrowy, przekładnia Dyna-VT (CVT), kabina Protect-U. Sześć modeli 285–425 KM.
  5m: >-
    MF 5M, następca 5700 M, zaprezentowana w listopadzie 2024: silnik AGCO Power 4,4 l, 4-cylindrowy, przekładnia Dyna-4, moc 95–145 KM.
  6400: >-
    MF 6400 (2003–2013): silniki Perkins 4,4, 6,0 i 6,6 l oraz SisuDiesel 6,6 i 7,4 l, przekładnie Dynashift i Dyna-6. Bezstopniową Dyna-VT miała równoległa seria 7400. Następcą była MF 6600.
  6600: >-
    Międzypokoleniowa seria między 6400 a 6700. Silnik AGCO Power 4,9 L 4-cylindrowy i 6,6 L 6-cylindrowy, przekładnia Dyna-4, Dyna-6 lub Dyna-VT (CVT). Emisje Stage IIIB / Tier 4i.
  7400: >-
    Premium row-crop z silnikiem Perkins / Sisu / AGCO Power 6,6 L i 7,4 L 6-cylindrowym, przekładnia Dyna-6 Powershift lub Dyna-VT (CVT) — generacja z najszerszym zakresem mocy dla gospodarstw środkowoeuropejskich. Zastąpiona serią 7600 / 7700.
  7600: >-
    Modernizacja serii 7400 z silnikiem AGCO Power 6,6 L i 7,4 L 6-cylindrowym spełniającym normę Stage IIIB. Przekładnia Dyna-6 lub Dyna-VT (CVT). Poprzednik serii 7700.
  8100: >-
    Seria MF 8100 (1995–1999), następca MF 3600: silniki sześciocylindrowe i przekładnia Dynashift, moc 135–230 KM. Zastąpiła ją seria 8200.
  8200: >-
    Kolejna generacja dużych ciągników z ulepszonym silnikiem Perkins 6-cylindrowym, przekładnią Dynashift Plus i zintegrowaną elektroniczną regulacją podnośnika. Moce **160–260 KM**.
  8400: >-
    Seria MF 8400 (2003–2008) z bezstopniową przekładnią Dyna-VT i silnikami Sisu 7,4 l (8450, 8460) i 8,4 l (8470, 8480). Pierwszą Dyna-VT w MF miała w 2003 roku seria 7400. Następcą była seria 8600.
  8600: >-
    Flagowy row-crop przed 8700. Silnik AGCO Sisu Power 8,4 L 6-cylindrowy z technologią e3 SCR (selektywna redukcja katalityczna — premiera w segmencie dużych ciągników). Przekładnia Dyna-VT. Moce **270–370 KM**.
  30-series-old: >-
    Historyczna seria konwencjonalnych kombajnów Dronningborg/MF. Klasyczny wytrząsacz młócący, silnik Perkins/Sisu 6-cylindrowy.
  cerea: >-
    Wyższa klasa konwencjonalnych kombajnów produkowanych w Dronningborgu (Dania). Rotor APS i 5 wytrząsaczy. Silnik SisuDiesel 6-cylindrowy.
  activa: >-
    Średnie konwencjonalne kombajny. Silnik AGCO Sisu Power 6-cylindrowy 6,6 L, 5 wytrząsaczy.
  beta: >-
    Wyższa klasa konwencjonalnych kombajnów. Rotor APS Plus.
  delta: >-
    Hybrydowy system APS + rotor. Silnik AGCO Power 7,4 L.
  ideal-mf: >-
    Wspólna platforma z Fendt IDEAL. Warianty 7, 8, 9 pod marką MF dla sieci AGCO.
  activa-s: >-
    Modernizacja serii Activa z 5 wytrząsaczami. Silnik AGCO Power 6,6 L 6-cylindrowy, bęben młócący Power Flow, rozdrabnianie słomy V-Inox. Seria podstawowa konwencjonalnych kombajnów MF dla średnich gospodarstw. Modele 7340 S, 7344 S, 7345 S.
  beta-s: >-
    Wyższa klasa konwencjonalnych kombajnów z 5 wytrząsaczami i systemem APS (Accelerated Pre-Separation). Silnik AGCO Power 7,4 L 6-cylindrowy, większy zbiornik ziarna i wyższa przepustowość niż Activa S.
  delta-s: >-
    Premium hybrydowe kombajny — połączenie rotora APS i wytrząsaczy. Silnik AGCO Power 9,8 L 6-cylindrowy, przekładnia ParaLevel w wariantach do pracy na zboczach. Najwyższa klasa w konwencjonalnym programie MF przed wprowadzeniem IDEAL.

models:
  massey-ferguson-130: >-
    Najmniejszy z serii 100, produkowany we Francji.
  massey-ferguson-135: >-
    Model podstawowy i bestseller serii — wyprodukowano ponad 350 000 sztuk. W Europie Środkowej jeden z najczęściej spotykanych zachodnich ciągników w JRD.
  massey-ferguson-165: >-
    Średnia klasa serii. 4-cylindrowy Perkins, popularny do orki i transportu.
  massey-ferguson-188: >-
    Szczyt serii 100 — 4-cylindrowy Perkins 4,1 L.
