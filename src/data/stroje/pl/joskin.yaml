# PL overlay (opisy/pola) na strukturę cs. AI draft + edytor, wymaga review.

country: "Belgia"
description: >-
  Belgijski specjalista w dziedzinie cystern na gnojowicę i przyczep rolniczych. Cysterny Modulo 2, Quadra, Komfort 2, Volumetra, X-Trem, Cargo i EuroLiner, przyczepy Trans-CAP, Trans-KTP, Trans-SPACE, Trans-EX i Drakkar, aplikatory Pendislide, Pendiwing, Solodisc i Multitwist oraz rozsiewacze nawozów naturalnych Tornado3, Ferti-CAP i Siroko.

categories:
  doprava: "Transport"
  hnojeni: "Nawożenie"

series:
  drakkar: >-
    Drakkar to przyczepa o dużej pojemności z przesuwanym dnem na kiszonkę, sianokiszonkę, zboże i zrębki. Solidne podwozie z osią tandemową lub tridemową radzi sobie z objętością do 38 m³ i 30 t ładowności. Hydraulicznie napędzany łańcuchowy przenośnik umożliwia szybkie i delikatne opróżnianie bez podnoszenia skrzyni, co jest idealne dla niskich hal i biogazowni. Pneumatycznie tłumione osie i hydrauliczne sterowanie zapewniają stabilność nawet przy dużych prędkościach.
  trans-cap: >-
    Trans-CAP to trzystronna wywrotka średniej klasy do uniwersalnego zastosowania rolniczego. Hydraulicznie sterowane wywroty na trzy strony umożliwiają wygodne rozładunki na wąskich przestrzeniach. Skrzynia wykonana jest z wysokowytrzymałej stali HARDOX i przystosowana do przewozu zboża, buraków, ziemniaków oraz nawozów organicznych. Pneumatycznie hamowane osie i opony komercyjne gwarantują bezpieczny transport drogowy.
  trans-ktp: >-
    Trans-KTP to wywrotka tylna heavy-duty przeznaczona do najcięższych zadań transportowych w rolnictwie i budownictwie. Solidna monocoque skrzynia z blachy HARDOX o grubości 6 mm odporna jest na kamienie, żwir i zamarzniętą ziemię. Oś tridem z samosterującą ostatnią osią zmniejsza zużycie opon i zwiększa zwrotność. Hydrauliczna tylna burta z automatycznym otwieraniem przyspiesza rozładunek.
  trans-space: >-
    Trans-SPACE to przyczepa o dużej pojemności z przesuwaną przednią ścianą dla maksymalnego wykorzystania przestrzeni ładunkowej. Konstrukcja z równą podłogą i gładkimi aluminiowymi burtami minimalizuje pozostałości ładunku i ułatwia czyszczenie. Hydraulicznie napędzana przednia ściana stopniowo wypycha ładunek na zewnątrz, co jest delikatne dla materiału i samej maszyny. Idealna do kiszonki, sianokiszonki, ziemniaków lub buraków cukrowych.
  trans-ex: >-
    Trans-EX to ekonomiczna wywrotka klasy podstawowej dla małych i średnich gospodarstw. Wersja jednoosiowa lub tandemowa jest zoptymalizowana pod kątem niskich kosztów zakupu przy zachowaniu jakości Joskin. Hydrauliczne wywroty do tyłu lub na trzy strony pokrywają standardowe zadania transportowe. Boki skrzyni są łatwo demontowalne, co umożliwia przebudowę na przyczepę skrzyniową.
  euroliner: >-
    EuroLiner to przyczepa dalekobieżna z przesuwanym dnem przeznaczona do transportu drogowego kiszonki i zrębków między gospodarstwami a biogazowniami. Aerodynamiczna aluminiowa nadbudowa zmniejsza wagę i zużycie paliwa. Oś tridem z zawieszeniem pneumatycznym umożliwia legalny transport drogowy z prędkością do 60 km/h. Przesuwane dno z wolnym tempem rozładunku oszczędza podłogę i łańcuchy.
  cargo: >-
    Cargo to kompaktowa cysterna na gnojowicę dla małych i średnich gospodarstw o pojemnościach od 2 700 do 7 100 litrów. Konstrukcja jednoosiowa z niskim środkiem ciężkości umożliwia pracę na pochyłych terenach. Standardowym wyposażeniem jest pompa odśrodkowa Joskin oraz system samossący do szybkiego napełniania. Cysterna jest kompatybilna z całym szeregiem aplikatorów Joskin, w tym Pendislide i Solodisc.
  ferti-cap: >-
    Ferti-CAP to kompaktowy rozsiewacz nawozów naturalnych z pionowymi rotorami do równomiernego rozprowadzania obornika, kompostu lub digestatu. Solidna podłoga z HARDOX 450 odporna jest na materiały ścierne. Hydraulicznie regulowana prędkość łańcucha transportowego umożliwia precyzyjne dawkowanie w kg/ha. Szerokość robocza 6–12 m jest idealna dla małych i średnich gospodarstw.
  komfort-2: >-
    Komfort 2 to cysterna na gnojowicę średniej klasy z naciskiem na komfort obsługi i łatwą konserwację. Centralny panel hydrauliczny skupia wszystkie elementy sterujące w jednym miejscu. Pneumatyczne hamulce i wahliwy dyszel z zawieszeniem powietrznym tłumią wstrząsy podczas pracy w polu. Standardowe wyposażenie obejmuje pompę próżniową Battioni lub pompę odśrodkową Joskin.
  modulo-2: >-
    Modulo 2 to flagowa cysterna Joskin na gnojowicę o konstrukcji modułowej, obejmująca pojemności od 4 500 do 18 000 litrów. Ocynkowany zbiornik stalowy o grubości 6 mm jest odporny na korozję i najbardziej agresywną gnojowicę przez dziesięciolecia. Oś tandemowa lub tridemowa z zawieszeniem pneumatycznym umożliwia szybki transport drogowy. Szeroka gama aplikatorów (Pendislide, Pendiwing, Solodisc, Multitwist) czyni ją uniwersalnym rozwiązaniem dla każdego gospodarstwa.
  pendislide: >-
    Pendislide to ciągniony aplikator wężowy do precyzyjnego nanoszenia gnojowicy bezpośrednio na ziemię między rośliny. Stalowe płozy na końcu każdego węża rozgarniają uprawę i kładą gnojowicę bezpośrednio na powierzchnię gleby, minimalizując straty amoniaku. Hydraulicznie składane ramiona zapewniają kompaktowe wymiary transportowe. Nadaje się do kukurydzy, zbóż i trwałych użytków zielonych.
  pendiwing: >-
    Pendiwing to elastyczny aplikator wężowy z teleskopowo regulowanymi ramionami do upraw wąskorzędowych i szerokorzędowych. Patentowany system TerraFlex automatycznie odwzorowuje nierówności terenu dla równomiernej aplikacji. Pulsator zapewnia stały przepływ we wszystkich wężach bez zatykania. Idealny na wąskie pola, sady i nierówne tereny.
  quadra: >-
    Quadra to heavy-duty cysterna na gnojowicę z czterema osiami dla największych gospodarstw i spółdzielni aplikacyjnych. Stalowy zbiornik o pojemności do 28 000 litrów jest podparty na czterech skrętnych osiach, co minimalizuje ugniatanie gleby. Dwie pary skrętnych osi (przednie i tylne) umożliwiają manewrowanie nawet z pełnym ładunkiem. Standardowo wyposażona w turbinowe ramię napełniające o przepływie do 12 000 l/min.
  siroko: >-
    Siroko to uniwersalny rozsiewacz nawozów naturalnych z poziomymi rotorami o szerokości roboczej do 18 m. Hydraulicznie regulowana prędkość łańcucha transportowego umożliwia precyzyjne dawkowanie od 5 do 60 t/ha. Solidna konstrukcja z HARDOX 450 radzi sobie z obornikiem, kompostem, nawozem drobiowym i digestatem. Opcjonalny terminal ISOBUS umożliwia GPS section control dla oszczędności nawozów.
  solodisc: >-
    Solodisc to dyskowy aplikator gnojowicy z talerzami iniekcyjnymi, które płytko wprowadzają gnojowicę do gleby, znacznie redukując emisję amoniaku. Każdy talerz jest niezależnie zawieszony na sprężynie, co pozwala na kopiowanie terenu. Hydraulicznie składane ramiona umożliwiają szerokość transportową poniżej 3 m. Idealny na ściernisko, podorywkę i aplikacje zgodne z dyrektywą azotową UE.
  multitwist: >-
    Multitwist to rotacyjny rozdzielacz dla aplikatorów wężowych gnojowicy zapewniający równomierny przepływ do wszystkich węży. Patentowany system z obracającym się nożem tnie stałe cząstki i zapobiega zatykania. Solidna żeliwna konstrukcja ma interwały serwisowe dłuższe niż 5 000 hektarów. Kompatybilny ze wszystkimi cysternami Joskin Modulo 2, Komfort 2 i Volumetra.
  tornado3: >-
    Tornado3 to trzecia generacja flagowego rozsiewacza nawozów naturalnych z pionowymi lub poziomymi rotorami do wyboru. Maksymalne obciążenie użytkowe 24 tony i szerokość robocza do 24 m czynią Tornado3 najwydajniejszą maszyną w swojej klasie. Hydrauliczna skrzynia z przesuwanym dnem wykonana jest z blachy HARDOX o grubości 8 mm. ISOBUS z automatycznym GPS section control umożliwia precyzyjną aplikację z zmiennymi dawkami według mapy agronomicznej.
  volumetra: >-
    Volumetra to cysterna o dużej pojemności na gnojowicę o pojemnościach od 12 000 do 30 000 litrów, przeznaczona dla dużych gospodarstw rolnych i spółdzielni aplikacyjnych. Oś tridemowa z zawieszeniem pneumatycznym i wszystkie osie skrętne zapewniają zwrotność nawet z pełnym zbiornikiem. Standardowe wyposażenie obejmuje turbinowe ramię napełniające z pamięcią ostatniej pozycji. Ocynkowany zbiornik stalowy o grubości 6 mm jest odporny na najbardziej agresywną gnojowicę i digestat przez dziesięciolecia.
  x-trem: >-
    X-Trem to najwydajniejsza cysterna w portfolio Joskin do najbardziej wymagających zastosowań na dużych gospodarstwach i w spółdzielniach aplikacyjnych. Ekstremalne pojemności powyżej 30 000 litrów w połączeniu z heavy-duty podwoziem czteroosiowym umożliwiają aplikację 200 ha dziennie. Patentowany system TridemAxle z niezależnym sterowaniem wszystkich trzech osi minimalizuje ślady na polu. Opcjonalne GPS auto-steering i section control dla w pełni automatycznej aplikacji.
