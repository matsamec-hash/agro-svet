# PL overlay (opisy/pola) na strukturę cs. AI draft + edytor, wymaga review.

country: "Japonia"
description: >-
  Japoński producent z bogatą tradycją. Silna pozycja w segmencie ciągników kompaktowych i średnich, historycznie znany z zastosowań w sadach, winnicach i usługach komunalnych. W ostatnich latach rozwija się również w klasie row-crop (seria M powyżej 130 KM). Kombajny pod marką Kubota są na rynku środkowoeuropejskim marginalne (seria DC), głównie przeznaczone na rynek japoński/azjatycki.

categories:
  traktory: "Ciągniki"
  kombajny: "Kombajny"

series:
  b: >-
    Kompaktowe ciągniki do 30 KM do ogrodów, sadów, usług komunalnych i gospodarstw hobbystycznych. Silnik Kubota 3-cylindrowy diesel, przekładnia HST lub stopniowa. Aktualna seria modelowa B01 (B2301, B2601) kontynuuje tradycję historycznych modeli B7500/B2920/B3350.
  bx: >-
    Subkompaktowe ciągniki do ogrodów, usług komunalnych i gospodarstw hobbystycznych. Silnik Kubota 3-cylindrowy diesel, hydrostatyczna przekładnia (HST).
  l: >-
    Kompaktowa klasa użytkowa 20–60 KM. Silnik Kubota 3-cylindrowy, przekładnia HST lub synchronizowana.
  lx: >-
    Kompaktowe ciągniki użytkowe 24–30 KM. Klasa podstawowa dla gospodarstw hobbystycznych i utrzymania terenów komunalnych — poniżej 30 KM. Silnik Kubota 3-cylindrowy diesel, hydrostatyczna przekładnia HST. Zastąpiły starsze kompaktowe modele L w segmencie poniżej 30 KM.
  l02: >-
    Najnowsza generacja kompaktowych ciągników serii L spełniająca normę emisji Stage V. Zmodernizowana kabina, wsparcie ISOBUS, moc 38–62 KM. Sprzedawana równolegle z LX (LX = prostsza klasa podstawowa, L02 = w pełni wyposażona klasa kompaktowa premium).
  sta: >-
    Małe ciągniki kompaktowej klasy z 3-cylindrowym silnikiem diesla. Przeznaczone do usług komunalnych, ogrodów i mniejszych gospodarstw hobbystycznych. Napęd 4x4 MFWD, przekładnia synchronizowana i rama ROPS.
  me: >-
    Linia użytkowa przeznaczona głównie na rynek japoński i azjatycki z eksportem także do Europy. Odpowiednia do sadów, winnic i prac polowych. Wersja Narrow DTN z węższym rozstawem kół do specjalistycznego zastosowania w sadownictwie.
  mx: >-
    Uniwersalny średni ciągnik rolniczy — pomiędzy seriami B/L (kompaktowe) a M (duże). Silnik Kubota Stage V, moc 55–63 KM. Zastępuje starszą linię użytkową M5040/M5640/M6040.
  m60-legacy: >-
    Starsza klasa użytkowa 60–100 KM. Pierwsza generacja M6040/M7040/M8540/M9540 (2007–2013) z silnikiem V3300/V3800, następnie zastąpiona nowocześniejszymi M6060/M7060/M8560/M9960 z Common Rail i emisjami Tier IV.
  mgx: >-
    Tzw. „M Grand X" — wyższa klasa użytkowa z 8-biegową przekładnią Powershift i przestronną kabiną. Silnik V3800 (100/110 KM) i V6108 (126/135 KM). Generacje oznaczane MGX, MGX-II, MGX-III i MGX-IV z kolejnymi innowacjami (Stage IIIB → Stage V, zawieszenie przedniej osi FSS w wersji S).
  m4002: >-
    Przystępna cenowo klasa użytkowa. Silnik Kubota V3307 4-cylindrowy 3,3 l.
  m5: >-
    Popularna linia użytkowa 95–115 KM. Silnik Kubota V3800 4-cylindrowy turbo, przekładnia Speed-Shift 36/36. Kabina Premium.
  m6: >-
    Średnia klasa premium. Silnik Kubota V6108 4-cylindrowy 6,1 l, przekładnia Powershift 24/24, opcjonalna CVT (linia MGX).
  m5002: >-
    Modernizacja popularnej serii M5 spełniająca normę emisji Stage V. Silnik Kubota V3800 4-cylindrowy turbo 3,8 l, przekładnia Speed-Shift 36/36. Dostępny także jako M5002 Narrow do sadów i winnic.
  m6002: >-
    Następca oryginalnej serii M6, zaprezentowany na targach FIMA 2020 w Saragossie. Silnik Kubota V6108-TIEF5 4-cylindrowy 6,1 l z funkcją boost, przekładnia 24/24 z elektronicznym sterowaniem trzech grup i 8 biegami load-shift. Rozstaw osi 2 690 mm, system Bi-speed do zmniejszenia promienia skrętu.
  m7: >-
    Flagowa seria row-crop — pierwsza Kubota w kategorii powyżej 150 KM. Silnik Kubota V6108 6,1 l common-rail, przekładnia Powershift 24/24 lub KVT (CVT). Produkowana w Bierne, Francja.
  m7002: >-
    Generacja flagowej serii M7 spełniająca normę emisji Stage V. Silnik Kubota V6108 TIER V 6,1 l z zoptymalizowaną charakterystyką mocy. Nowa 6-biegowa przekładnia Powershift 30F/15R lub 54F/27R z redukcją pełzającą. Następca M7-1/M7001, zastąpiony generacją M7-4 (2023+).
  m8: >-
    Największy ciągnik rolniczy w historii Kubota. Efekt współpracy z kanadyjską firmą Buhler Industries (producent Versatile), montaż w Winnipeg. Silnik Cummins B6.7 6-cylindrowy Tier 4 Final bez EGR (SCR + DPF), opcjonalna przekładnia Semi-Powershift 30x15 lub Variable Transmission (CVT).
  mk: >-
    Wąskie warianty do winnic i sadów. Silnik Kubota 4-cylindrowy 3,8 l, szerokość od 1,2 m.
  sr: >-
    Seria kompaktowych kombajnów głównie na rynek japoński i azjatycki, przeznaczona przede wszystkim do zbioru ryżu, pszenicy i jęczmienia. Na rynku europejskim praktycznie nieobecne, importowane sporadycznie przez japońskich handlarzy maszyn używanych.
  dc: >-
    Mniejsze kompaktowe kombajny głównie na rynki azjatyckie, na rynku środkowoeuropejskim marginalne. Odpowiednie do zbioru ryżu, pszenicy, soi.
