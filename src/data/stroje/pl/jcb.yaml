country: "Wielka Brytania"
description: >-
  Brytyjski rodzinny producent maszyn budowlanych i rolniczych, założony przez Josepha Cyrila Bamforda. Dla rolnictwa produkuje ikoniczne teleskopowe manipulatory Loadall (od kompaktowych 525-60 po heavy-duty 560-80), kompaktowe manipulatory przegubowe TM Telemaster, kompaktowe ładowarki kołowe serii 400 oraz unikalne wysokoprędkościowe ciągniki Fastrac z zawieszeniem i prędkością drogową 70 km/h.

categories:
  manipulace: "Manipulacja i załadunek"
  traktory: "Ciągniki"

series:
  compact-wheel-loader: >-
    Kompaktowe ładowarki kołowe JCB serii 400 do pracy na podwórku, w korytarzu paszowym i w wąskich przestrzeniach obory. Oferują doskonałą widoczność przez niską maskę, mały promień skrętu i ramę przegubową do manewrowania w ciasnych miejscach. Modele od 2,6 t (403) do 10,3 t (417) pokrywają gospodarstwa wszystkich rozmiarów.
  loadall-525: >-
    Najbardziej kompaktowy Loadall — teleskopowy manipulator o szerokości zaledwie 1,84 m i wysokości 1,9 m, idealny do niskich obór i wąskich przejść. Udźwig 2,5 t i zasięg 6 m pokrywają standardową manipulację belami, paletami i paszą. Charakterystyczny 360° widok z kabiny CommandPlus dzięki nisko umieszczonemu ramieniu po lewej stronie operatora.
  loadall-527: >-
    Kompaktowy Loadall dla średnich gospodarstw — wyższy udźwig 2,7 t w porównaniu do modelu 525 przy zachowaniu kompaktowych wymiarów i doskonałej widoczności. Zasięg 5,8 m i niska wysokość transportowa czynią model 527-58 popularnym urządzeniem do pracy w starszych oborach i budynkach z niskimi przejazdami.
  loadall-532: >-
    Średni Loadall o udźwigu 3,2 t — najlepiej sprzedający się rozmiar w serii, dostępny w dwóch długościach ramienia (6 m i 7 m). Odpowiedni do większości standardowych operacji rolniczych: bele, pasza, załadunek obornika, paletyzacja. Dostępny w wersjach wyposażenia Agri, Agri Plus, Agri Super, Agri Pro i Agri Xtra w zależności od wymagań dotyczących przekładni i komfortu.
  loadall-536: >-
    Średniej wielkości Loadall o udźwigu 3,6 t — popularny na średnich i większych gospodarstwach ze względu na wyższą zdolność podnoszenia przy zachowaniu średnich wymiarów. Dostępny z ramieniem 6 m i 7 m oraz w różnych wersjach wyposażenia od podstawowego Agri po Agri Pro z przekładnią DualTech VT.
  loadall-538: >-
    Kompaktowy Loadall o najwyższym udźwigu w serii 3,8 t przy zachowaniu kompaktowych wymiarów (szerokość poniżej 2,3 m). Dostępny z ramieniem 6 m i 7 m; wersja Agri Plus oferuje wygodniejszą kabinę i funkcje hydrauliczne. Popularny rozmiar dla mlecznych gospodarstw z wozem paszowym.
  loadall-542: >-
    Heavy-duty Loadall o udźwigu 4,2 t i zasięgu 7 m — przejście do ciężkiej klasy. Dostępny w najwyższych wersjach wyposażenia Agri Pro (przekładnia DualTech VT), Agri Super (hydrostatyczna) i Agri Xtra (powershift) do zastosowań od standardowych gospodarstw po kontraktorów transportowych.
  loadall-550: >-
    Heavy-duty Loadall o udźwigu 5 t i zasięgu 8,1 m — przeznaczony dla dużych gospodarstw, spółdzielni i kontraktorów. Zdolny do układania bel na wysokość 8 i załadunku do najwyższych wozów kiszonkarskich. Dostępny w wersjach Agri Pro (DualTech VT) i Agri Super (hydrostatyczna).
  loadall-555: >-
    Heavy-duty Loadall z ekstra długim ramieniem 9,5 m i udźwigiem 5,5 t — specjalnie do wysokich jam kiszonkarskich, wysokiego układania bel i załadunku do wysokich silosów. Największy zasięg w serii Loadall.
  loadall-560: >-
    Flagowy Loadall o udźwigu 6 t i zasięgu 8,1 m — największy i najwydajniejszy teleskop rolniczy w ofercie JCB. Przeznaczony do najcięższych zastosowań: załadunek przyczep zbożowych, manipulacja ciężkimi belami biomasy i prace kontraktorskie. Dostępny wyłącznie w wersji Agri Pro z przekładnią DualTech VT.
  loadall-tm: >-
    Telemaster — przegubowe (pivot-steer) teleskopowe ładowarki JCB, hybryda między ładowarką kołową a teleskopem. Przegubowe sterowanie zapewnia ekstremalną zwrotność w ciasnych oborach, teleskopowe ramię dodaje zasięg w pionie. Idealny dla mlecznych gospodarstw z wąskimi korytarzami paszowymi. Modele TM 220, TM 320 i TM 420 oferują udźwigi od 2,1 do 4,1 t.
  fastrac-2000: >-
    Druga generacja pionierskich wysokoprędkościowych ciągników JCB Fastrac z centralnie umieszczoną kabiną, przednim i tylnym zawieszeniem oraz hamulcami ABS — koncepcja bardziej przypominająca samochód ciężarowy niż klasyczny ciągnik. Prędkość drogowa 75 km/h radykalnie zmieniła logistykę gospodarstw, ponieważ maszyna radziła sobie z pracą polową i transportem drogowym z prędkością ciężarówki. Modele 2115, 2125, 2135 i 2155 (później 2150 i 2170) z 6-cylindrowymi silnikami Cummins o mocy 115–170 KM. Poprzednik dzisiejszej serii Fastrac 4000/8000.
  fastrac-4000: >-
    Średnio wydajna seria wysokoprędkościowych ciągników Fastrac (160–235 KM) z w pełni zawieszonym podwoziem (przednie i tylne pneumatyczne zawieszenie), 4-kołowym układem kierowniczym i prędkością drogową 60 km/h. Symetryczna konstrukcja z kabiną pośrodku oferuje rozkład masy 50/50, podwójne hamulce i platformę za kabiną na osprzęt zawieszany. Unikat na rynku — jedyny ciągnik nadający się do transportu drogowego z prędkością samochodu osobowego.
  fastrac-8000: >-
    Flagowa seria Fastrac o mocach 290–348 KM i rekordowej prędkości drogowej 70 km/h — najszybszy seryjny ciągnik na świecie. Przekładnia CVT, pełne zawieszenie i udźwig 18 t dla osprzętu zawieszanego czynią model 8000 idealnym urządzeniem dla kontraktorów, łączącym prace polowe i transport kiszonki na duże odległości. Limitowana edycja Iconic celebruje historię Fastraca.

