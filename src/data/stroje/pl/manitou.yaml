# PL overlay (opisy/pola) na strukturę cs. AI draft + edytor, wymaga review.

country: "Francja"
description: >-
  Francuski lider w teleskopowych manipulatorach i ładowaczach rolniczych. Flagowa seria MLT NewAg (ciężkie teleskopy 6–10 m, udźwig 2,5–6 t) z kabiną premium, telematyką EasyManager i silnikami Stage V 75–160 KM. Kompaktowa seria MT-X dla małych gospodarstw, przegubowe MLA-T do obór, ładowacze czołowe MAC i ładowacze przegubowe R/RT do uniwersalnego zastosowania.

categories:
  manipulace: "Manipulacja i załadunek"

series:
  mlt-625: >-
    MLT 625 — podstawowy ciężki teleskopowy manipulator serii NewAg. Maksymalna wysokość 6,1 m, udźwig 2,5 t.
    Silnik Stage V 75 KM, przekładnia hydrostatyczna, kabina NewAg z panoramicznym widokiem.
    Odpowiedni dla małych i średnich gospodarstw do manipulacji belami słomy, pasz i towarów paletowanych.
  mlt-730: >-
    MLT 730 — kompaktowy ciężki teleskopowy manipulator NewAg o zasięgu 7 m i udźwigu 3 t.
    Dostępny w wersjach 115 KM (D — direct drive) i 130 KM (PS+ — powershift). Kabina NewAg,
    joystick JSM, telematyka EasyManager. Uniwersalna maszyna dla średnich gospodarstw i spółdzielni.
  mlt-737: >-
    MLT 737 — ciężki teleskop NewAg o zasięgu 7 m i wyższym udźwigu 3,7 t do wymagającej
    manipulacji dużymi belami i obornikiem. Silnik Stage V 130 KM, przekładnia PS+ powershift,
    kabina NewAg. Popularna maszyna na dużych gospodarstwach mlecznych.
  mlt-840: >-
    MLT 840 — ciężki teleskopowy manipulator NewAg dla dużych gospodarstw. Maksymalna wysokość 7,55 m,
    udźwig 4 t, silnik 145 KM Stage V z przekładnią PS+ powershift. Kabina NewAg z pneumatycznym fotelem,
    telematyka EasyManager, odpowiedni do wymagającej całodziennej pracy i podwórkowych paszarni.
  mlt-940: >-
    MLT 940 — topowy ciężki teleskop serii NewAg o zasięgu 9 m i udźwigu 4 t.
    Przekładnia hydrostatyczna Vario V+, silnik 140 KM Stage V, kabina premium NewAg. Idealny do
    układania dużych bel, napełniania koryt i manipulacji w dużych magazynach.
  mlt-961: >-
    MLT 961 — ekstra ciężki teleskop NewAg z udźwigiem 6 t i zasięgiem 9 m, przeznaczony do najbardziej wymagającej
    pracy. Silnik 145 KM Stage V z przekładnią Vario+, wzmocniony mechanizm podnoszenia. Układanie
    dużych bel, manipulacja ciężkimi paletami w biogazowniach i kompostowniach.
  mlt-1041: >-
    MLT 1041 — flagowy ciężki teleskopowy manipulator NewAg z rekordowym zasięgiem 9,65 m
    i udźwigiem 4,1 t. Silnik 145 KM Stage V, przekładnia PS+ powershift, kabina premium NewAg. Dla dużych
    gospodarstw, gdzie trzeba sięgnąć na najwyższe poziomy stosów i sił.
  mt-x-420: >-
    MT-X 420 — kompaktowy teleskopowy manipulator dla małych gospodarstw i ciasnych przestrzeni.
    Maksymalna wysokość 4,3 m, udźwig 2 t, szerokość poniżej 1,8 m dla przejazdu niskimi oborami. Silnik 75 KM,
    przekładnia hydrostatyczna, prosta obsługa do codziennej pracy na podwórku.
  mt-x-625: >-
    MT-X 625 — kompaktowy teleskop o zasięgu 6 m i udźwigu 2,5 t, odpowiedni dla średnich gospodarstw
    z naciskiem na zwrotność. Silnik 75 KM Stage V, przekładnia hydrostatyczna,
    czterokołowe skręcanie z trybami jazdy równoległej i krabowej.
  mt-x-730: >-
    MT-X 730 — topowy model kompaktowej serii MT-X o zasięgu 7 m i udźwigu 3 t. Silnik 75 KM Stage V,
    napęd hydrostatyczny, kompaktowe wymiary do niskich obór i wąskich przejść.
    Idealne połączenie zasięgu i zwrotności dla średnich gospodarstw.
  mac-50: >-
    MAC 50 — kompaktowy kołowy ładowacz czołowy do rolnictwa o udźwigu 5 t i wysokości podnoszenia ponad 3 m.
    Silnik Stage V, przekładnia hydrostatyczna, kabina z panoramicznym widokiem.
    Odpowiedni do załadunku obornika, pasz i materiałów sypkich na podwórku.
  mac-60: >-
    MAC 60 — większa wersja kompaktowego kołowego ładowacza MAC o udźwigu 6 t. Wyższa wysokość podnoszenia i większa łyżka,
    silnik Stage V z przekładnią hydrostatyczną. Dla średnich i dużych gospodarstw z regularną manipulacją dużymi materiałami.
  mla-t-516: >-
    MLA-T 516 — przegubowy teleskopowy ładowacz rolniczy o udźwigu 1,6 t i zasięgu 5 m.
    Łączy zalety ładowacza czołowego (zwrotność, krótki promień skrętu) z teleskopowym wysuwem.
    Silnik Stage V, napęd hydrostatyczny, idealny do pracy w wąskich oborach.
  mla-t-533: >-
    MLA-T 533 — topowy przegubowy teleskopowy ładowacz o udźwigu 3,3 t i zasięgu 5 m. Wersje
    PS+ (powershift) i V+ (Vario hydrostat) z silnikiem 130 lub 145 KM Stage V. Kabina z joystickiem
    JSM, telematyka EasyManager. Odpowiedni do dużych obór i podwórkowych paszarni.
  rr-13: >-
    RR 13 — kompaktowy ładowacz przegubowy o udźwigu 1,3 t do pracy w wąskich przestrzeniach obór
    i budynków gospodarczych. Silnik Stage V, pionowy podnośnik, szeroka oferta osprzętu
    (łyżki, widły, miotły). Idealny do codziennej konserwacji i manipulacji paszami.
  rr-16: >-
    RR 16 — średniej wielkości ładowacz przegubowy o udźwigu 1,6 t i pionowym podnoszeniu.
    Silnik Stage V, solidna konstrukcja, kompatybilny z pełną gamą osprzętu Manitou.
    Odpowiedni dla średnich gospodarstw z codzienną manipulacją dużymi materiałami.
  rr-18: >-
    RR 18 — topowy ładowacz przegubowy serii RR o udźwigu 1,8 t. Wyższa moc silnika, solidna rama
    i pionowy podnośnik dla maksymalnego zasięgu. Dla dużych gospodarstw i uniwersalnego zastosowania z ciężkim
    osprzętem (szczotki, pług śnieżny, widły do bel).
  mrt: >-
    MRT (Manitou Roto) — flagowa seria obrotowych teleskopowych manipulatorów z wieżą obracaną o 360°,
    wprowadzona po raz pierwszy w 1981 roku. Unikalne połączenie teleskopu i dźwigu mobilnego: zasięg do ponad
    30 m w topowych modelach, udźwig 4,5–7 t, pełny obrót ramienia ładunkowego bez konieczności przesuwania maszyny.
    Obecna nowoczesna generacja MRT-X / MRT Vision+ oferuje zaawansowaną stabilizację,
    telematykę Manitou EasyManager, w pełni obrotową kabinę i silniki Stage V. Profesjonalna maszyna
    wykorzystywana głównie w budownictwie, dużych magazynach i przy specjalnych zadaniach manipulacyjnych w rolnictwie — alternatywa dla dźwigu mobilnego na obszarach o ograniczonej przestrzeni.

models:
  mrt-1440: >-
    Podstawowy model obrotowej serii z zasięgiem 14 m i udźwigiem 4 t — do budów i magazynów, gdzie klasyczny teleskop stały nie wystarcza.
  mrt-1840: >-
    Średniej wielkości obrotowy teleskop o zasięgu 18 m, popularny w firmach budowlanych do wymagających prac wysokościowych.
  mrt-2150: >-
    Uniwersalny profesjonalny Roto z zasięgiem 21 m i udźwigiem 5 t, silnik 145 KM Stage V, kabina premium Vision+.
  mrt-2470: >-
    Ciężki obrotowy teleskop z rekordowym udźwigiem 7 t i zasięgiem 24 m, silnik 170 KM — do najbardziej wymagających zastosowań budowlanych i przemysłowych.
  mrt-3050: >-
    Flagowy model obrotowej serii z zasięgiem 30 m i udźwigiem 5 t — alternatywa dźwigu mobilnego do budów i specjalnych zadań manipulacyjnych.
  mrt-3060: >-
    Topowy MRT z zasięgiem 30 m i wyższym udźwigiem 6 t — najlepsze połączenie zasięgu i pojemności w segmencie obrotowych teleskopów.
