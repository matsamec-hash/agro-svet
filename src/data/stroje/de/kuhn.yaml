# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Frankreich"
description: >-
  Französischer Hersteller mit dem breitesten Landtechnikportfolio — Pflüge Master und Vari-Master, Sämaschinen Espro und Venta, Feldspritzen Altis/Metris/Oceanis, Streuer Axis und Aero, Pressen VB/LSB, Mähwerke GMD sowie Futtermischwagen Euromix und Profile.

categories:
  hnojeni: "Düngung"
  komunal-les: "Kommunal und Forst"
  ochrana-rostlin: "Pflanzenschutz"
  seti: "Aussaat und Pflanzung"
  sklizen-picnin: "Futter- und Strohernte"
  staj-chov: "Stall und Tierhaltung"
  zpracovani-pudy: "Bodenbearbeitung"

series:
  aero: >-
    Pneumatische Mineraldüngerstreuer mit Verteilergestänge bis 27 m Arbeitsbreite. Der Aero arbeitet mit Luftverteilung statt Wurfscheiben und erreicht damit auch bei Industriedüngern eine sehr hohe Verteilgenauigkeit. Geeignet für die Fahrgassenapplikation und die Teilbreitenschaltung. Gezogene Ausführungen mit über 3 m³ Volumen.
  axis: >-
    Die Flaggschiff-Baureihe der angebauten Schleuderstreuer mit dem elektronischen System EMC, das das Drehmoment jeder Scheibe laufend misst und die Menge in Echtzeit korrigiert. Arbeitsbreiten 12–50 m, Behältervolumen 1 000–4 500 l. Die Version H mit kontinuierlicher Wiegetechnik für höchste Genauigkeit bei wechselndem Gelände und Hanglage.
  msp: >-
    Universelle Stalldungstreuer mit Vertikaltrommeln oder Streutellern. Die Bauweise mit tiefem Schwerpunkt und hydraulischem Heckschieber erlaubt die gleichmäßige Ausbringung von Stallmist, Kompost und Gärresten. Modelle mit 8–24 m³ Brückenvolumen, ISOBUS-kompatibel.
  pul: >-
    Angebaute und gezogene Güllefässer mit 7–28 m³ Volumen. Serienmäßig mit Vakuumbefüllung und der Möglichkeit zur Kombination mit Ausbringtechnik (Schleppschlauch, Scheiben, Schlitzinjektor). Kompatibel mit ISOBUS und Teilbreitenschaltung für die exakte Ausbringung in Schutzgebieten.
  bp: >-
    Universalmulcher für die Pflege von Grünflächen, Bankettstreifen und Stoppeln. Arbeitsbreiten 1,8–3,2 m mit Pendelgelenk zur Bodenanpassung. Die reversiblen BPR-Varianten erlauben Front- und Heckanbau und eignen sich für den Einsatz mit Kommunaltechnik.
  tbe: >-
    Auslegermulcher für die Pflege von Gräben, Banketten und Hecken. Hydraulischer Ausleger mit 5–8 m Reichweite und schwenkbarem Mulchkopf. Serienmäßig mit proportionaler Joysticksteuerung und Float-Sicherheitssystem gegen Anfahrschäden.
  altis: >-
    Angebaute Feldspritzen mit 1 000–1 800 l Tank und 18–28 m Gestängebreite. Hydraulisch bediente Stahlgestänge mit Federung und Teilbreitenschaltung. Geeignet für mittelgroße Betriebe und für die Kombination mit einem Fronttank zur Kapazitätserweiterung.
  deltis: >-
    Kompakte Anbauspritzen für kleinere und mittlere Betriebe. Tank 600–1 300 l, Gestänge 12–24 m mit manueller oder hydraulischer Ausklappung. Serienmäßig mit dem Rechner DPAE für die exakte, geschwindigkeitsabhängige Dosierung.
  lexis: >-
    Kompakte gezogene Feldspritze der Einstiegsklasse mit 2 400–3 000 l Tank und 18–24 m Gestänge. Einachsiges Fahrgestell, mechanisch gelenkte Deichsel und einfache Wartung. Geeignet für mittelgroße Betriebe, die auf die erste gezogene Maschine umsteigen.
  metris: >-
    Gezogene Feldspritze der Mittelklasse mit 3 200–4 100 l Tankvolumen und 18–30 m Gestänge. Ausgestattet mit der Gestängestabilisierung Equilibra und aktiver Teilbreitenschaltung. ISOBUS mit Applikationskarten und optionaler Auto-Section-Funktion.
  oceanis: >-
    Die Flaggschiff-Baureihe der gezogenen Feldspritzen mit 4 600–7 700 l Tank und Aluminiumgestänge bis 44 m. Luftfederung, gelenkte Achse und die Gestängestabilisierung Equilibra+. Vollständig ISOBUS-fähig, kompatibel mit GPS-Teilbreitenschaltung und PWM-Düsen.
  espro: >-
    Gezogene Scheiben-Säkombinationen für Minimalbodenbearbeitung und konventionelle Verfahren. Zwei Scheibenreihen mit einstellbarem Anstellwinkel, TF-Walzen mit Rückverfestigung und Parallelogramm-Säschare. Arbeitsbreiten 3–8 m, ein- oder zweikammerige Behälter für die Aussaat von Mischungen und Zwischenfrüchten.
  maxima: >-
    Einzelkornsämaschinen für Reihenkulturen — Mais, Sonnenblumen, Raps und Zuckerrüben. Elektrischer Antrieb der Dosierung mit Einzelreihenabschaltung und exakter Kornvereinzelung. Arbeitsbreite 4–18 Reihen, Bedienung über das ISOBUS-Terminal CCI.
  sitera: >-
    Mechanische Sämaschinen für die Kombination mit der Kreiselegge HR. Säsystem Suprapack (Schleppschar) oder CD (Scheibenschar) für unterschiedliche Bodenverhältnisse. Hydraulisches Umsetzen in Transportstellung und die Möglichkeit der Düngerausbringung. Arbeitsbreite 3–4 m.
  venta: >-
    Pneumatische Sämaschinen für die Kombination mit aktiven Geräten. Zentraldosierung mit elektrischem Antrieb, pneumatische Verteilung zu den Säscharen und ein großer Behälter bis 1 500 l. Geeignet für intensive Betriebe, die Kreiselegge und Sämaschine in einer Überfahrt kombinieren.
  fc: >-
    Mähwerke mit Aufbereiter (Stahlzinken oder Walzen) für das schnellere Abtrocknen des Futters. Arbeitsbreiten 2,4–13,4 m in Heck-, Front- und Triple-Ausführung. Asymmetrischer Antrieb Optidisc und die hydropneumatische Entlastung Lift-Control für schonendes Arbeiten in unebenem Gelände.
  ga: >-
    Schwader mit einem, zwei oder vier Kreiseln. Arbeitsbreiten 3,2–15 m, das gelenkte Fahrwerk MASTER DRIVE GIII für lange Lebensdauer und 3D-Kreiselpendelung zur Bodenanpassung. Die Modelle 9531/15131 sind die Flaggschiffe für große Betriebe und die professionelle Silageernte.
  gf: >-
    Zettwender mit 4,5–17 m Arbeitsbreite und 4–14 Kreiseln. Hydraulische Verstellung des Streuwinkels für unterschiedliche Kulturen und das schonende Wenden auch jungen Futters. Pendelnder Digihead für Stabilität am Hang und Transport in eingeklappter Stellung.
  gmd: >-
    Scheibenmähwerke ohne Aufbereiter für Anbau- und Zuganwendungen. Der Mähbalken Optidisc Elite hat große Scheibenabstände für einen gleichmäßigen Gutfluss. Arbeitsbreiten 1,7–9,5 m, Anbau- und Triple-Varianten mit automatischer Hindernisumgehung (NSH).
  lsb: >-
    Quaderballenpressen der Mittelklasse mit Kanalmaßen 80×70 oder 80×90 cm. Pick-up mit 2,3 m Breite und integriertes Schneidwerk mit bis zu 23 Messern. Geeignet für Stroh, Heu und Silage bei hoher Ballendichte und niedrigen Betriebskosten.
  merge-maxx: >-
    Bandschwader (Merger) mit Pick-up und Förderband anstelle von Kreiseln. Schonende Futterbehandlung ohne Erdbeimengung — ideal für hochwertige Silage und Vermehrungsbestände. Arbeitsbreite 9,5 m mit Ablage nach rechts, links oder beidseitig.
  profile-fs: >-
    Ladewagen mit großem Laderaum von 36–58 m³ DIN. Pick-up mit 2 m Breite und Messerrotor mit 35–46 Messern für kurzen Schnitt. Gefederte Tandemachse und hydraulischer Kratzboden.
  rw: >-
    Gezogene Ballenwickler für Rund- und Quaderballen. Doppelte Vorstreckeinheiten mit 500/750 mm und hydraulisches Ablegen des Ballens für den reibungslosen Ablauf mit dem Lader. Die Modelle RW 1410/1610 zählen zu den meistverkauften in Europa.
  vb: >-
    Rundballenpressen mit variabler Kammer für Ballendurchmesser von 0,8–1,85 m. Der neue Rotor Integral bringt hohe Leistung auch in feuchtem Material, das Schneidwerk OptiCut hat 14, 23 oder 25 Messer. Die VBP-Varianten kombinieren Presse und Wickler in einer Überfahrt.
  euromix: >-
    Horizontale Futtermischwagen mit 2–4 Schnecken bzw. Paddeln und 8–24 m³ Volumen. Die schonende Mischwirkung eignet sich für TMR mit einem Anteil langstängeligen Futters und Heus. Serienmäßig mit programmierbarer Wiegetechnik und Rezeptspeicher.
  primor: >-
    Maschinen zum Auflösen und Einblasen von Stroh in Ställe — Ballenauflöser. Seitenauswurf bis 18 m, drehbarer Kamin zum Einblasen in tiefe Ställe. Modelle von 1,3 bis 5,7 m³ mit Pick-up für Großballen von 120×120 cm.
  profile-mixer: >-
    Vertikale Futtermischwagen mit einer oder zwei Schnecken und 12–46 m³ Volumen. Schnecke mit scharfen Messern für die schnelle Verarbeitung großer Ballen und von Silage. Die Version Plus ergänzt programmierbare Wiegetechnik, ISOBUS-Schnittstelle und Eco-Drive-Modus.
  spv: >-
    Selbstfahrende Futtermischwagen mit integriertem Fräsarm und 12–27 m³ Volumen. Hydrostatischer Antrieb, Kabine mit 360°-Sicht und wahlweise Antrieb 4×4 oder 4×4×4 mit gelenkter Hinterachse. Geeignet für Großbetriebe mit täglicher Fütterung von 200+ Tieren.
  tks: >-
    Automatisches Fütterungssystem auf Basis eines Roboterwagens an einer Deckenschiene im Stall. Er wird mit dem TMR-Vorratsbehälter beladen und fährt den Futtertisch programmiert zu festgelegten Zeiten ab. Das senkt die Arbeitskosten und stabilisiert die Tagesration — geeignet für Milchviehbetriebe mit automatischem Melksystem.
  cultimer: >-
    Zinkengrubber mit 2–4 Zinkenreihen und der hydraulischen Non-Stop-Sicherung. Arbeitsbreiten 3–6 m in Anbau- und 6–10 m in gezogener Ausführung. Wechselbare Schare erlauben die Anpassung von der flachen Stoppelbearbeitung ab 5 cm bis zur tiefen Lockerung auf 35 cm.
  discover-xm2: >-
    Kurzscheibenegge für die flache Stoppelbearbeitung und die Einebnung der Oberfläche. Scheiben mit 510 mm, einzeln aufgehängt und hydraulisch gesichert. Geeignet für den Hochleistungseinsatz mit Traktoren ab 150 PS bei Arbeitsgeschwindigkeiten von 12–15 km/h. Arbeitsbreiten 3–6 m.
  hr: >-
    Kreiseleggen mit aktiven Kreiseln für eine hochwertige Saatbettbereitung. Arbeitsbreiten 3–8 m, Anbau- und Klappvarianten mit festem Getriebe oder Speedline-Option. Serienmäßig mit Maxipack-Walze und der Möglichkeit zur Kombination mit einer mechanischen oder pneumatischen Sämaschine.
  master: >-
    Angebaute und aufgesattelte Drehpflüge mit 3–8 Scharen. Die Modelle Master 103/153 bieten mechanische oder hydraulische Arbeitsbreitenverstellung, der Vari-Master die stufenlose Einstellung der Furchenbreite von 30–55 cm. Grindel aus Borstahl mit Reserven für tiefes Pflügen bis 35 cm.
  optimer: >-
    Kurzscheibeneggen für die flache Stoppelbearbeitung nach der Ernte. Scheiben mit 510 mm, einzeln in Gummielementen gelagert. Arbeitsbreiten 3–7,5 m in Anbau- und gezogener Ausführung. Hydraulische Tiefenverstellung aus der Kabine für die Anpassung an unterschiedliche Bodenarten.
  prolander: >-
    Federzinkengrubber für die flache Stoppelbearbeitung und die Saatbettbereitung. Sechs Zinkenreihen mit 6 cm Strichabstand sorgen für ein gleichmäßiges Arbeitsprofil und die saubere Einarbeitung der Ernterückstände. Arbeitsbreiten 3–7,5 m, Anbau- und gezogene Ausführung.
