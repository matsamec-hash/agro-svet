# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Deutschland"
description: >-
  Deutscher Landtechnikhersteller für Bodenbearbeitung und Aussaat. Klassische Anbaupflüge Juwel und Diamant, Scheibeneggen Rubin, Grubber Karat und Sämaschinen Solitair.

categories:
  hnojeni: "Düngung"
  seti: "Aussaat und Pflanzung"
  zpracovani-pudy: "Bodenbearbeitung"
  ochrana-rostlin: "Feldspritzen"

series:
  polaris: >-
    Polaris — angebaute Mineraldüngerstreuer von Lemken mit Doppelscheibensystem für maximale Genauigkeit und effiziente Ausbringung.
  spica: >-
    Spica — einfache und praxisgerechte Mineraldüngerstreuer von Lemken für kleinere und mittlere Betriebe.
  tauri: >-
    Tauri — leistungsstarke Mineraldüngerstreuer von Lemken mit großer Arbeitsbreite und hoher Wurfweite.
  saphir: >-
    Saphir — mechanische Sämaschinen von Lemken für die exakte Kornablage, geeignet für die Solo-Aussaat wie auch in Kombination mit Kreiseleggen.
  solitair-mr: >-
    Solitair MR — angebaute, starre pneumatische Sämaschinen von Lemken für kleine und mittlere Arbeitsbreiten in Kombination mit aktiven Werkzeugen.
  solitair: >-
    Solitair — pneumatische Universalsämaschinen von Lemken mit großen Arbeitsbreiten, geeignet für die Solo-Aussaat wie auch für Kombinationen mit aktiven Geräten.
  solitair-combinations: >-
    Solitair DT/PT — Säkombinationen von Lemken, die Saatbettbereitung und Aussaat in einem Arbeitsgang vereinen und so maximale Leistung bringen.
  solitair-12-sw: >-
    Solitair 12 SW — Sätank-Kombination von Lemken mit großem Saatgutbehälter für Großbetriebe und Lohnunternehmen.
  solitair-nt: >-
    Solitair NT — pneumatische Sämaschine von Lemken für die Direktsaat (No-Till) in unbearbeiteten Boden.
  faya-mf: >-
    Faya MF — Einzelkornsämaschine von Lemken für Mais, Raps und weitere Reihenkulturen.
  juwel: >-
    Juwel — angebaute Drehpflüge von Lemken in der Mittelklasse mit dem System TurnControl Pro für effizientes Arbeiten unter unterschiedlichen Bedingungen.
  diamant: >-
    Diamant — aufgesattelte Drehpflüge von Lemken für große Traktoren mit hoher Flächenleistung und neuem Einstellsystem.
  titan: >-
    Titan — aufgesattelte Drehpflüge von Lemken der höchsten Klasse mit hoher Flächenleistung für die größten Traktoren.
  plough-equipment: >-
    Zubehör für Lemken-Pflüge — Räder, das Einstellsystem OptiQuick, Scheibensechs, Pflugkörper, Vorschäler und Ausstattung für die Onland-Furche.
  optistone: >-
    OptiStone — die hydraulische Steinsicherung von Lemken für störungsfreies Pflügen in steinigen Böden.
  rubin: >-
    Rubin — kompakte Kurzscheibeneggen von Lemken für die intensive flache Bodenbearbeitung mit hoher Flächenleistung und gründlicher Einmischung der Pflanzenreste.
  heliodor-slurrykit: >-
    Heliodor SlurryKit — die Lemken-Lösung für die Einarbeitung von Gülle mit der Scheibenegge in einem Arbeitsgang.
  karat-koralin-kristall: >-
    Karat, Koralin und Kristall — Zinkengrubber von Lemken für die flache bis mitteltiefe Bodenbearbeitung mit Fokus auf Wasserhaushalt und Bodenschutz.
  onyx: >-
    Onyx — der Tiefenlockerer von Lemken zum Aufbrechen verdichteter Unterbodenschichten, ohne das Bodenprofil zu wenden.
  gigant: >-
    Gigant — der Systemträger von Lemken für den flexiblen Einsatz verschiedener Arbeitsmodule bei hoher Leistung und niedrigem Verbrauch.
  zirkon: >-
    Zirkon — Kreiseleggen von Lemken für die Saatbettbereitung, geeignet solo wie auch in Kombination mit den Sämaschinen Solitair und Saphir.
  system-kompaktor-korund: >-
    System-Kompaktor und Korund — passive Saatbettkombinationen von Lemken mit universeller Zusammenstellung der Arbeitswerkzeuge.
  variopack-flexpack: >-
    VarioPack und FlexPack — Packer von Lemken zur Rückverfestigung der Pflugfurche in einem Arbeitsgang mit dem Pflügen.
  rollers: >-
    Lemken-Walzen — Nachlaufwalzen für die zuverlässige Rückverfestigung unter allen Bedingungen als Teil der Saatbettbereitung.
  sirius: >-
    Sirius — gezogene Feldspritzen von Lemken für die zuverlässige Ausbringung von Pflanzenschutzmitteln. Modularer Aufbau mit Tankvolumen von 2 600–3 800 l, Gestänge von 15–30 m, hydropneumatisch gefederter Rahmen für ruhigen Lauf bei hohem Tempo und präzise Verteilung der Spritzbrühe.
  vega: >-
    Vega — leistungsstarke gezogene Feldspritze von Lemken der gehobenen Klasse mit 4 600–6 200 l Tank und Gestänge bis 36 m. ISOBUS-Bedienung, Teilbreitenschaltung, automatische Gestängeführung HeightControl und präzise Einzeldüsenschaltung für die teilflächenspezifische Applikation auf großen Flächen.
