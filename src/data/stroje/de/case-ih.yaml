# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "USA / Großbritannien"
description: >-
  US-Marke mit Wurzeln in der Case Corporation (1842) und International Harvester (1902), 1985 fusioniert. Teil des CNH-Industrial-Konzerns. Charakteristisch sind die rote Lackierung und die Flaggschiff-Baureihe Magnum, die für Robustheit und stufenlose Getriebe geschätzt wird. Die Mähdrescher der Axial-Flow-Reihe halten seit 1977 die Führungsrolle bei der Einrotor-Bauweise.

categories:
  traktory: "Traktoren"
  kombajny: "Mähdrescher"

series:
  7100-magnum: >-
    Die legendäre erste Magnum-Generation — der erste Traktor der Marke Case IH nach der Fusion. Motor Case 5,9 l Turbo, Getriebe Powershift 18/2.
  8900-magnum: >-
    Kurze Generation zwischen 7000 und MX. Motor Case 8,3 l mit höherer Leistung.
  mx-maxxum: >-
    Die ursprüngliche Baureihe MX Maxxum (Vorgänger der MXM und des modernen Maxxum). Utility-Traktor der Mittelklasse, gebaut in Doncaster (Großbritannien) und Racine (USA). Motor Case als 4- und 6-Zylinder, Getriebe 16/12 Synchro. Modelle von 80–150 PS.
  mx-magnum: >-
    Neue Magnum-Generation mit der Bezeichnung MX. Motor Case 8,3 l Common Rail, Getriebe 18/4 PowerShift oder 8/2 ClutchPak.
  cvx: >-
    Die erste Case-IH-Baureihe mit stufenlosem Getriebe — die Technologie kam mit der Übernahme von Steyr (1996). Gebaut in St. Valentin (Österreich). Motor Sisu/Iveco 6-Zylinder, Getriebe **Steyr S-Matic CVT**. Ursprüngliche Generation CVX 130/150/170 (1999), Modernisierung CVX 1135/1145/1155/1170/1190/1195 (ab 2003). Vorgänger von Puma CVX und Maxxum CVX.
  mxm: >-
    Universelle Baureihe im Anschluss an die MX Maxxum, Vorgängerin der Puma. Gebaut in Basildon (Großbritannien) in Zusammenarbeit mit New Holland (Schwestermodell TM). Motor Iveco/NEF 6-Zylinder, Getriebe Range Command 18/6 oder Power Command 19/6. Modelle von 110–180 PS.
  cs-series: >-
    Utility-Klasse aus dem Werk **St. Valentin (Österreich)** — dem früheren Steyr-Werk. Motor **Sisu/Steyr 4-Zylinder 4,5 l** (geteilt mit Steyr Profi/Profi Plus), Getriebe Synchro-Shuttle 16/8. Vorgänger von Maxxum und Vestrum.
  cx-series: >-
    Utility-Traktoren für kleine und mittlere Betriebe. Motor Case 4-Zylinder, Hydraulik 80 l/min.
  farmall: >-
    Utility-Baureihe, die an den berühmten Namen Farmall von International Harvester anknüpft. Motor FPT als 3- bis 4-Zylinder, Getriebe mechanisch oder ActiveDrive. Fertigung in Italien und der Türkei.
  maxxum: >-
    Mittlere Baureihe für Gemischtbetriebe. Motor FPT NEF 6,7 l, Getriebe 16/16 Electro Command oder ActiveDrive 8 (neue Version mit Doppelkupplung), optional stufenlos (CVXDrive).
  puma: >-
    Universelle Premium-Baureihe. Motor FPT NEF 6,7 l (bis Puma 220), Cursor 9 (ab Puma 230), Getriebe Full Powershift 18/6 oder CVXDrive (stufenlos). Kabine mit MultiControl-Armlehne.
  magnum: >-
    Die Row-Crop-Flaggschiffbaureihe. Motor FPT Cursor 9 (8,7 l) und Cursor 13 (12,9 l), Getriebe Full Powershift 19/4 oder CVXDrive. AFS AccuTurn, Raupenvarianten Rowtrac.
  optum: >-
    Zwischen Magnum und Puma angesiedelt — kompakter Row-Crop mit stufenlosem Getriebe. Motor FPT Cursor 9, Getriebe CVXDrive.
  vestrum: >-
    Kompakte Mittelklasse mit stufenlosem Getriebe (CVXDrive). Sie füllt die Lücke zwischen Maxxum und Puma. Motor FPT NEF 4-Zylinder 4,5 l nach Abgasstufe V, Getriebe CVXDrive S-Matic. Kabine mit MultiControl-Armlehne, Terminal AFS Pro 700.
  steiger: >-
    Knickgelenkte Allradtraktoren für Großbetriebe, gebaut in Fargo (North Dakota, USA). Die Übernahme der Steiger Tractor Co. erfolgte **1986** (gegründet 1957 in Red Lake Falls, Minnesota). Aktuelle Varianten: **Steiger als Radtraktor** (klassischer Rahmen) und **Quadtrac** (vier dreieckige Gummiraupen, 1996 als STX375 Quadtrac eingeführt). In den aktuellen Modellen arbeiten die Motoren FPT Cursor 13 (12,9 l) und Cursor 16 (16 l).
  quadtrac: >-
    Der weltweit erste knickgelenkte Traktor mit vier unabhängigen Gummiraupen. 1996 als Steiger STX 4-Track eingeführt, seit 2006 vollständig unter der Marke Case IH Quadtrac. Gebaut in Fargo (North Dakota, USA). Speziell für Pflug- und Kultivierungsarbeiten mit geringem Bodendruck ausgelegt (die Aufstandsfläche ist viermal größer als bei Rädern). Motor FPT Cursor 13 (12,9 l) und Cursor 16 (16 l), Getriebe Full Powershift 16/2. In Mitteleuropa vor allem bei Großbetrieben für die tiefe Bodenbearbeitung im Einsatz. Aktuelle Modelle: Quadtrac 470, 500, 540, 580, 620 und das Spitzenmodell **Quadtrac 715** (2024) — der stärkste Case-IH-Traktor.
  axial-flow-16-21-series: >-
    Die legendäre Einrotor-Bauweise — Case IH erfand den Axialflussmähdrescher 1977. Die Baureihen 1660, 1666, 1680, 1688, 2166, 2188, 2366 und 2388 liefen über 20 Jahre in Produktion und sind auf dem Gebrauchtmarkt bis heute gängig.
  axial-flow-80-series: >-
    Fortsetzung der Axial-Flow-Reihe. Motor Iveco/FPT 8,3 und 10,3 l, verbessertes Dreschwerk.
  axial-flow-130-140-series: >-
    Motoren FPT nach Tier 4, AFS Harvest Command, variabler Rotor. Die 140er-Serie ist für den harten Dauereinsatz ausgelegt.
  axial-flow-150-250-series: >-
    Die modernste Generation. AFS Harvest Command Automation mit KI, Motoren FPT Cursor 9/13 nach Abgasstufe V, vollautomatische Anpassung des Dreschwerks an die Kultur. Der 9250 ist das leistungsstärkste Spitzenmodell von Case IH.
