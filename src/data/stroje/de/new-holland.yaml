# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Italien / USA"
description: >-
  Italienisch-amerikanische Marke im CNH-Industrial-Konzern (zusammen mit Case IH). Die Traktoren werden in Basildon und St. Valentin gebaut, die Mähdrescher in Zedelgem (Belgien). Charakteristisch sind die blaue Lackierung und die Ford-basierten Baureihen der 1990er-Jahre. Heute reicht das Programm von der T4 (40 PS) bis zur T9 (700+ PS); die Mähdrescher der CR-Baureihe dominieren die Klasse der Rotormaschinen.

categories:
  traktory: "Traktoren"
  kombajny: "Mähdrescher"

series:
  40-series: >-
    Die erste Generation nach der Fusion von Ford Tractors und New Holland (1991). Motor Ford/Genesis 7,5 l, Allradantrieb, mechanisches Getriebe 16/9.
  60-series: >-
    Nachfolger der 40 Series mit verbesserter Hydraulik und dem Getriebe ElectroShift. Genesis-Motor mit Ladeluftkühler.
  ts: >-
    Kompaktere Utility-Klasse. Die Vierzylinderversionen (TS90/100/110) hatten einen 5 000-cm³-Motor, die Sechszylinderversion (TS115) einen Saugmotor mit 7 480 cm³ — die TS115 war in Mitteleuropa sehr beliebt. Getriebe Synchro Shuttle oder Electro Command 16/16, doppelt untersetzte Hinterachse mit Planetengetrieben, Differenzialsperre Electrolok und nasse Lamellenbremsen.
  ts-a: >-
    Fünf völlig neue Modelle mit der Kabine Horizon (ohne vierte Säule). Motor mit Common-Rail-Einspritzung, Turbolader und Ladeluftkühler, 101–136 PS, mit Power Management bis 168 PS (TS135A). 2006 kamen die Varianten TS-A Plus und TS-A Delta dazu. Vorderachse SuperSteer oder gefedert als Terraglide.
  tm: >-
    Größere Row-Crop-Baureihe mit fünf Modellen von 116–168 PS (ISO). Ford-Turbomotoren, Getriebe Electroshift 16/16, luftgefederter Sitz, Bosch-EHR-Hydraulik, gefederte Vorderachse Terraglide und Kabinenfederung Comfort Ride. Die optionale SuperSteer-Achse mit 65° Lenkeinschlag verkürzte den Wendekreis um rund 3 m. Die Modelle TM175 und TM190 DT (2002–2007) hatten ein Powershift-Getriebe 18/6 oder 19/6, eine Hydraulikpumpe mit 120 l/min, PowerBoost von +46 PS und die elektronisch geregelte Bosch-Pumpe VP44.
  tl: >-
    Preislich zugängliche Utility-Baureihe. 4-Zylinder-Motor 4,5 l, Getriebe Synchro Shuttle 12/12.
  tg: >-
    Die Top-Row-Crop-Baureihe aus dem Werk Racine (USA), die die beiden stärksten Modelle der NH 70A ersetzte. Sechszylinder Cummins 8,3 l mit vier Ventilen je Zylinder (TG255/285) bei 2 200 min⁻¹, Getriebe Ultra Command Powershift 18/4. Die MegaFlow-Hydraulik mit bis zu 257 l/min zählte damals zu den leistungsstärksten des Segments. Vorgänger der T8.
  t4: >-
    Utility-Baureihe für kleinere Betriebe, Obst- und Weinbau. Motor Iveco F5C 3,4 l, Getriebe Dual Command / Electro Command, Abgasstufe Tier 4B / V.
  t5: >-
    Universelle Baureihe für Tierhaltung und Ackerbau. Motor FPT NEF 4,5 l, Getriebe Dual/Electro Command 24/24. 2024 kam die dritte Generation T5 DynamicCommand mit bis zu 140 PS.
  t6: >-
    Die meistverkaufte Baureihe. Motor FPT NEF 6,7 l, Getriebe Electro Command (16/16) oder Auto Command CVT (stufenlos). Die Methanvariante T6 Methane Power gibt es seit 2020 — der erste Serientraktor für Biomethan.
  t7: >-
    Premium-Row-Crop-Baureihe als Nachfolgerin der TM. Der Vorläufer T7000 PowerCommand kam 2007; 2009 folgte die Variante T7000 Auto Command mit stufenlosem Getriebe (CVT), die an die im österreichischen St. Valentin gebaute T7500 anknüpfte (ursprüngliche Bezeichnung TVT). Die Spitzenversion hatte ein 18-stufiges Power-Command-Getriebe — in drei Jahren entstanden über 23 000 Einheiten. Die aktuelle T7 hat den Motor FPT NEF 6,7 l (T7.170–T7.245) oder FPT Cursor 9 (ab T7.260), das Getriebe Range Command 18/6 oder Auto Command CVT und die Klasse SideWinder II mit Joystick.
  t8: >-
    Die Row-Crop-Flaggschiffbaureihe. Der Vorläufer T8000 (2006 eingeführt) hatte einen 8 268-cm³-Motor mit 24 Ventilen und Common-Rail-Einspritzung; die Variante T8050 bekam einen 9-Liter-Motor mit 325 PS und ein 19-stufiges Getriebe für 40 km/h bei reduzierter Drehzahl. Die aktuelle T8 hat den Motor FPT Cursor 9 8,7 l, das Getriebe Ultra Command 18/4 oder Auto Command CVT, den Monitor IntelliView, IntelliSense und die Raupenversionen T8 SmartTrax.
  t9: >-
    Knickgelenkte Allradtraktoren für Großbetriebe und den US-Markt. Motor FPT Cursor 13 (12,9 l) oder Cursor 16 (16 l), Getriebe 16/4 PowerShift. Raupenvarianten SmartTrax.
  tx: >-
    Schüttler-Mähdrescher. Motor NH/FPT 6-Zylinder, 7,5 l, 5 Schüttler, Rotor-Nachabscheider.
  cx: >-
    Die Flaggschiff-Baureihe der Schüttlermaschinen (Dreschtrommel + 5 Schüttler). Seit 2002 in Zedelgem gebaut und mehrfach modernisiert. CX7 / CX8 / CX8.91 — die größten ihrer Kategorie.
  cr: >-
    Die Doppelrotor-Flaggschiffbaureihe. Die revolutionäre Twin-Rotor-Konstruktion arbeitet mit zwei längs liegenden Rotoren mit variabler Auswuchtung. Die CR11 (2023 vorgestellt) hält den Weltrekord in der Tagesdruschleistung.

