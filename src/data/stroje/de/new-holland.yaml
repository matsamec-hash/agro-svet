models:
  new-holland-cr11: >-
    Das Flaggschiff CR11 löst den CR10.90 ab. Cursor-16-Motor mit 16 l Hubraum, IntelliSense-KI-Optimierung, Korntank bis 20 000 l. Hält den Weltrekord in der Maisernte.
