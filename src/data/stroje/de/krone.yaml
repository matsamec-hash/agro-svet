# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Deutschland"
description: >-
  Deutsches Familienunternehmen aus Spelle (Niedersachsen), seit 1906 und weltweiter Spezialist für die Futter- und Strohernte. Flaggschiffe sind die Mähwerke EasyCut und die Selbstfahrer BiG M, die Rundballenpressen Comprima, die Quaderballenpressen BiG Pack (bis 120×130 cm) und die selbstfahrenden Feldhäcksler BiG X mit über 1 100 PS. Ergänzt wird das Programm durch die Schwader Swadro, die Zettwender Vendro und die Ladewagen ZX/RX/MX.

categories:
  zaci-stroje: "Mähwerke"
  obracece: "Zettwender"
  shrnovace: "Schwader"
  lisy-valcove: "Rundballenpressen"
  lisy-hranolove: "Quaderballenpressen"
  rezacky-samojizdne: "Selbstfahrende Feldhäcksler"
  samosberaci-vozy: "Ladewagen"
  navesy-valnik: "Plateauwagen"

series:
  easycut-f: >-
    EasyCut F — frontangebaute Scheibenmähwerke für die Kombination mit einem Schmetterlings-Heckmähwerk. Arbeitsbreite 2,80–4,00 m, verfügbar mit Zinken- (CV) oder Walzenaufbereiter (CR) sowie mit Förderbändern (Collect). Das neue SafeCut INSIDE schützt jede Scheibe mit einer eigenen Sicherung gegen das Auffahren auf Hindernisse.
  easycut-r: >-
    EasyCut R — heckangebaute Scheibenmähwerke mit 2,40–3,60 m Arbeitsbreite. Die doppelte Mittelaufhängung DuoGrip sorgt für ideale Bodenanpassung, der glatte Mähbalken hat große Gleitteller. Die Versionen CV (Zinkenaufbereiter) und CR (Walzenaufbereiter) sind für intensive Heu- und Silageernte ausgelegt.
  easycut-b: >-
    EasyCut B — gezogene Seiten- und Schmetterlingsmähkombinationen für mittlere und große Betriebe. Arbeitsbreiten von 7,3 m (B 750) bis 10,1 m (B 1000) in Schmetterlingsanordnung; die Collect-Modelle haben zusätzlich Querförderbänder für einen großen Sammelschwad. Hydraulische Entlastung und zentrale Druckeinstellung gehören zur Serienausstattung.
  big-m: >-
    BiG M — selbstfahrende Mäheinheit mit 4×4-Antrieb (vier turbinengekühlte Hydromotoren), ein einzigartiges Konzept in der Futterernte. Drei Mäheinheiten mit 13,2 m Arbeitsbreite, Walzen- oder Zinkenaufbereiter, Mercedes-Benz-Motor mit 449 PS (BiG M 450) und 530 PS (BiG M 500). Flächenleistung über 5 ha/h, ideal für Großbetriebe und Biogasanlagen.
  vendro: >-
    Vendro — die Zettwender-Generation mit 4,7–13,1 m Arbeitsbreite, verfügbar als Anbaugerät (Vendro 470/560/680/790) und gezogen (Vendro 820, 1020, 1120). Die OptiTurn-Kreisel mit asymmetrischen Zinken sorgen für schonendes Wenden mit minimalen Blattverlusten, das hydraulische Klappen beim Grenzstreuen schützt die Feldränder.
  swadro-s: >-
    Swadro S — Einkreiselschwader mit 3,8–4,6 m Arbeitsbreite für kleine und mittlere Betriebe. Wartungsfreies Getriebe Jet Effect, Dreipunktanbau und 3D-Bodenanpassung dank Tandemfahrwerken. Leichte und wendige Bauweise, auch für Hanglagen geeignet.
  swadro-tc: >-
    Swadro TC — gezogene Zweikreiselschwader mit Seitenablage (TC 680/760) oder Mittelablage (TC 880/930/1250). DuraMax-Getriebe im Ölbad, stufenlose hydraulische Schwadbreitenverstellung und Transporthöhe unter 4 m. Der TC 1250 erreicht bis zu 12,5 m Arbeitsbreite und dient der Großflächenernte.
  swadro-ts: >-
    Swadro TS — mittelgroße Einkreiselschwader mit Tandemachse und Mittelablage. Arbeitsbreite 6,2–7,4 m; die Kreiselausgleichseinrichtung OptiTurf hält die Zinkenhöhe auch in unebenem Gelände konstant.
  bellima: >-
    Bellima — die Einstiegsbaureihe der Festkammerpressen mit 1,25 m Ballendurchmesser, Kettenkammer mit 17 Stahlleisten und 1,85 m Pick-up. Ausgerichtet auf kleine und mittlere Betriebe, die eine einfache Bedienung ohne Elektronik und das Pressen von Stroh oder Heu auf kleineren Flächen erwarten.
  fortima: >-
    Fortima — Festkammer- (F) und variable (V) Rundballenpressen der Mittelklasse. Kettenkammer mit Leisten für feste Heu- und Strohballen, Schneidrotor MultiCut mit 17 Messern und integrierter Abstreifer für das leichte Ablegen des Ballens. Die nockenlose Pick-up EasyFlow sorgt auch in schweren Schwaden für gleichmäßigen Gutfluss.
  comprima: >-
    Comprima — die Flaggschiff-Baureihe der Rundballenpressen mit der patentierten Riemenkammer NovoGrip (Lamellenriemen mit Polyurethansegmenten), die den Ballen bereits ab 0,5 m Durchmesser verdichtet. Die Modelle V 150/180 XC mit variabler Kammer (1,25–1,80 m), F 125/155 XC mit Festkammer. Die XC-Versionen haben einen Schneidrotor mit 17 Messern, integrierte Netz- oder Folienbindung und eine große Pick-up mit 2,15 m.
  varipack: >-
    VariPack — die neue Generation der variablen Rundballenpressen (2020 eingeführt), die die älteren Comprima-V-Modelle im Segment der klassischen Kettenkammern ablöst. Ballendurchmesser 1,00–1,65 m (V 165) oder 1,80 m (V 190), Schneidrotor XCut mit bis zu 26 Messern (XC), Durchsatz über 60 t/h. Zielgruppe sind Lohnunternehmen und große Betriebe, die Stroh und Heu pressen.
  ultima: >-
    Ultima — die weltweit einzigartige Non-Stop-Press-Wickel-Kombination mit Vorkammer, die das Erntegut während des Ballenauswurfs kontinuierlich aufnimmt — der Traktor muss nicht anhalten. Die Modelle CF 155 XC (variabler Durchmesser) und F 155 XC (Festkammer 1,55 m), Pick-up 2,35 m, Schneidrotor mit 26 Messern. Die Leistung liegt 25 % über einer klassischen Press-Wickel-Kombination; ausgelegt auf die anspruchsvolle gewerbliche Silageernte.
  big-pack: >-
    BiG Pack — die Flaggschiff-Baureihe der Hochdruck-Quaderballenpressen von Krone, verfügbar mit den Kanalmaßen 80×70, 90×80, 90×120, 120×70, 120×90 sowie der einzigartigen BiG Pack 4×4 (120×125 cm). Die Version HDP (High Density Press) erhöht die Ballendichte um 25 %, VC (VariCut) ergänzt einen Schneidrotor mit 26 Messern, die XC-Version bis zu 51 Messer. MultiBale erzeugt 2–9 kleinere Ballen in einem Kanal für die Tierhaltung. Für Lohnunternehmen und Großbetriebe.
  big-x: >-
    BiG X — die Flaggschiff-Baureihe der selbstfahrenden Feldhäcksler von Krone mit MTU/Liebherr-Motoren von 12,8–24,2 l und 490 bis 1 156 PS (der BiG X 1180 hält den Weltrekord). MaxFlow-Häckseltrommel (28/36/40 Messer, 800 mm Breite), VariStream mit stufenlos verstellbarer Schnittlänge. Die variable Auswurfturbine StreamControl und der Corncracker OptiMaize für Maissilage. Vorsätze: EasyCollect (Mais, 6–12-reihig), XCollect (mit Scheibenmähsystem) und XDisc 620 (Direktschnitt von Ganzpflanzen).
  mx: >-
    MX — kombinierte Lade- und Dosierwagen mit 32–40 m³ Volumen (DIN, unverdichtet). Presskrotor PowerLoad mit 41 Messern für 37 mm Schnittlänge, hydraulisch klappbare Stirnwand GD (Grass Dosing) für das leichte Entladen. Für mittlere Betriebe, die Silageernte und Futterdosierung direkt am Trog verbinden.
  rx: >-
    RX — leistungsstarke Ladewagen der neuen Generation (2020 eingeführt) mit 36–49 m³ Volumen. Nockenlose Pick-up EasyFlow Pro mit 2,35 m, Schneidrotor PowerCut mit 53 Messern (37 mm Schnittlänge). PowerLoad-System mit aktivem Förderrotor, Wiegesystem und ISOBUS-Terminal in der Grundausstattung.
  zx: >-
    ZX — die zweiachsigen Flaggschiff-Ladewagen mit hoher Nutzlast für die professionelle Futterernte und Biogasanlagen. Das Schubwandsystem PowerOff entlädt den Wagen in 30 s, Aluminiumwände senken das Eigengewicht. Hydraulisch gefederte Pick-up mit 2,12 m und Schneidrotor mit 40 Messern für kurzes Häckselgut.
  tx: >-
    TX — landwirtschaftliche Plateauwagen für den Transport von Erntegut und Stroh zwischen Feld und Fahrsilo oder Heulager. Hydraulisch klappbare Stirnwand, Stahlkonstruktion und Druckluftbremsen. Volumen je nach Modell 46–56 m³.
