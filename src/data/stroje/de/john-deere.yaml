# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "USA"
description: >-
  Der größte Landtechnikhersteller der Welt. Das US-Unternehmen mit den grünen Traktoren und dem gelben Hirschen dominiert die Märkte in Nordamerika, Europa und Asien.

categories:
  traktory: "Traktoren"
  kombajny: "Mähdrescher"
  rezacky: "Feldhäcksler"
  postrikovace: "Selbstfahrende Feldspritzen"

series:
  "5000": >-
    Die ersten Utility-Traktoren für den europäischen Markt, gebaut in Mannheim. Leistungen von 40–75 PS, einfache Auslegung für kleinere Betriebe und den Kommunaleinsatz.
  "6000": >-
    Die bahnbrechende Baureihe der Mitteltraktoren aus Mannheim. Kabine **OOS** (Open Operator Station) mit Panoramasicht, Motor PowerTech 4045 (4-Zylinder, 4,5 l) für 6100–6400 und 6076 (6-Zylinder, 7,6 l) für 6500–6900, Getriebe **PowrQuad 16/16**, optional **Triple-Link Suspension** an der Vorderachse.
  "6010": >-
    Nachfolger der 6000er-Reihe, PowerTech-Motoren, Getriebe PowrQuad Plus 16x16. Erweitertes Programm von 80 bis 150 PS.
  "6020": >-
    Komplett neue Plattform. Kabine ComfortGard, Motor PowerTech Plus mit Common Rail, optional Getriebe AutoQuad Plus und Load-Sensing-Hydraulik.
  "7000": >-
    Die erste Generation der Row-Crop-Traktoren über 150 PS, gebaut in Waterloo. Grundlage für alle folgenden 7R-Baureihen.
  "7010": >-
    Row-Crop-Traktoren der zweiten Generation, Motor PowerTech 6,8 l, Getriebe PowrQuad Plus oder AutoQuad.
  "7020": >-
    Motor PowerTech Plus mit elektronischer Einspritzung. Optional das stufenlose Getriebe AutoPowr IVT — bei John Deere das erste in dieser Klasse.
  "7030": >-
    Abgasnorm Tier 3, Motor PowerTech Plus 6,8 l mit 24-Ventil-Kopf. Premium-Kabine mit Belüftung, Klimaanlage und elektronisch verstellbarem Sitz.
  "8000": >-
    Die legendäre „große Grüne“. Der erste Row-Crop über 200 PS mit moderner Kabine, elektronisch geregelter Hydraulik und PowerShift 16/4.
  "8010": >-
    Motor PowerTech 8,1 l, Getriebe PowerShift 16/4, Kabine ComfortGard Plus.
  "8020": >-
    Neue Generation mit dem Motor PowerTech Plus, optional das stufenlose Getriebe AutoPowr, aktive Vorderachsfederung ILS.
  "8030": >-
    Abgasnorm Tier 3 (PowerTech Plus 9,0 l), automatische Lenkung **AutoTrac**, Display GreenStar 2 1800/2630, Kabine CommandView, Vorderachsfederung TLS Plus, Raupenversion 8030T (8130T/8230T/8330T/8430T/8530T).
  "9000": >-
    Knicklenker mit Allradantrieb für ausgedehnte Betriebe. Motor PowerTech 12,5 l und PowerShift 12/3.
  "9020": >-
    Motor PowerTech 12,5 l, optionales Raupenlaufwerk 9000T, GreenStar 2.
  "9030": >-
    Motor PowerTech Plus 13,5 l, AutoTrac Universal, GreenStar 3.
  new-generation-10-series: >-
    Die bahnbrechende Generation, die bei John Deere die Ära der Zweizylindermotoren („Johnny Popper“) beendete. Die Premiere am 30. August 1960 in Dallas („Deere Day in Dallas“) zeigte komplett neue Mehrzylinder-Dieselmotoren — Reihenvierzylinder und -sechszylinder —, das neue Getriebe Synchro-Range und eine moderne Hydraulik. Die gewaltige Modernisierung ging mit der Verlagerung der Produktion nach Waterloo (Iowa) und Dubuque einher. Die New Generation legte den Grundstein für alle folgenden Baureihen und etablierte John Deere als Technologieführer in der Landwirtschaft.
  20-series-1963: >-
    Verbesserte Generation der 10 Series. Das Schlüsselmodell 4020 (1963–1972) wurde zu einem der meistverkauften Traktoren der Firmengeschichte — über 184 000 gebaute Einheiten. Es bot optional das Power-Shift-Getriebe (8 Lastschaltstufen), einen 6,6-l-Sechszylinder und ab 1972 die ikonische sechseckige Kabine. 1965 startete das Werk Mannheim (Deutschland) die Fertigung der 20er-Reihe für den europäischen Markt — die erste europäische Produktion von John Deere.
  30-series-sound-gard: >-
    Die Generation, die den Komfort in der Landwirtschaft neu definierte. Im September 1972 stellte John Deere die revolutionäre Kabine **Sound-Gard** vor — die erste integrierte schallgedämmte Kabine in der Landtechnik mit Klimaanlage, Heizung und Schwingungsdämpfung (max. 80 dB(A) im Innenraum). Sie trug den Beinamen „Generation II“. Die Modelle 4030/4230/4430/4630 lösten die erfolgreichen Reihen 4020/4320/4520/4620 ab und setzten neue Ergonomiestandards für die gesamte Branche.
  40-series-iron-horse: >-
    Modernisierung der Sound-Gard-Kabine (Sound-Gard II). Die Modelle 4040/4240/4440/4640/4840 brachten sparsamere Motoren, verbesserte Hydraulik und robustere Getriebe. Der ikonische **4440** mit 130 PS wurde zum meistverkauften Modell des Jahrzehnts — über 95 000 gebaute Einheiten. Als Flaggschiff kam der stärkste 4840 (180 PS) hinzu.
  50-series-1982: >-
    Fortsetzung der erfolgreichen Generation mit Fokus auf Kraftstoffeffizienz und dem verbesserten Getriebe **Quad-Range** (16 Gänge). Motoren mit elektronischer Drehzahlregelung, neues Display in der Kabine und Hydraulik mit höherer Fördermenge. Die Modelle 4050/4250/4450/4650/4850 deckten 105–193 PS ab.
  55-series-1988: >-
    Die letzte „reine“ Row-Crop-Generation vor der Aufteilung in die Baureihen 7000 (Row Crop) und 8000 (Flaggschiff). Die Modelle 4055/4255/4455/4555/4755/4955 brachten elektronisch geregelte Hubwerke, den verbesserten PerformanceMonitor und ein moderneres Kabinendesign. Der Spitzenreiter **4955** (200 PS) war der stärkste Row-Crop-John-Deere seiner Zeit.
  5010-5020-5030: >-
    Schrittweise verbesserte Generationen der Utility-Traktoren. PowerTech-Motoren, voll synchronisiertes Getriebe SyncShuttle 9x3.
  5m: >-
    Moderne Utility-Baureihe mit PowerTech-Motor und elektronisch geregelter Hydraulik. Varianten für Ackerbau, Obstbau und kommunale Dienste.
  5r: >-
    Premium-Utility-Baureihe mit Technik aus höheren Klassen — CommandArm, IVT-Getriebe, volle Kabinenkonnektivität.
  6030-premium: >-
    Premium-Baureihe mit der Technologie AutoPowr (CVT), voller Vorderachsfederung TLS, Premium-Kabine und Einbindung von GreenStar 2.
  6m: >-
    Universelle Baureihe für Gemischtbetriebe. Motor PowerTech 4,5 / 6,8 l, Getriebe AutoQuad oder CommandQuad, Abgasstufe V (ab 2019).
  6r: >-
    Vielseitige Premium-Baureihe. Motor PowerTech PSS/PVS, Getriebe AutoPowr IVT oder CommandPro, volle Federung TLS Plus, Kabine CommandView III, Displays der Generation 4.
  6r-gen3: >-
    Die dritte Generation der Premium-Baureihe 6R aus Mannheim. Motor PowerTech 4,5 l (4-Zylinder) und 6,8 l (6-Zylinder) nach Abgasstufe V mit SCR und DPF, Getriebe AutoPowr (CVT) oder CommandQuad Plus, Kabine CommandView 4 mit 12,8-Zoll-Display G5, volle JDLink-Konnektivität und Unterstützung der Assistenzfunktionen AutoTrac und AutoPath. Modellbezeichnungen 6R 110 / 120 / 130 / 140 / 150 / 165 / 185 / 195 / 215 / 230 / 250.
  7r: >-
    Die Row-Crop-Flaggschiffbaureihe der mittleren Größe. Motor PowerTech PSS 6,8/9,0 l, Getriebe e23 PowerShift oder AutoPowr IVT, Kabine CommandView III, AutoTrac, AutoPath.
  7r-gen3: >-
    Die aktuelle 7R-Generation mit dem Motor PowerTech PSS 9,0 l (6-Zylinder, Abgasstufe V), dem Getriebe e23 PowerShift (23 Gänge) oder AutoPowr IVT und der Kabine CommandView 4 mit 10-Zoll-CommandCenter und 12,8-Zoll-Display der Generation 4 Extended. Volle Unterstützung von AutoPath, AutoTrac SF7000 und JDLink. Das Programm reicht vom 7R 230 bis zum 7R 350 in 60-PS-Schritten.
  8r-gen1: >-
    Die erste 8R-Generation mit optionalem Raupenlaufwerk 8RT. Motor PowerTech PSS 9,0 l, Getriebe e23 PowerShift oder AutoPowr IVT, Kabine CommandView II/III.
  8r-gen2: >-
    Komplett neue Plattform, Motor PowerTech PSS 9,0 l, Getriebe e23 / IVT / DirectDrive, Kabine CommandView 4, Raupenversionen 8RT und Radversionen 8R. AutoPath und autonome Lenkung (CES 2022).
  8rx-4track: >-
    Die bahnbrechende Raupenvariante der 8R-Baureihe — der erste **Vierraupen-Traktor** in der mittleren Größenklasse. Jedes Rad wird durch eine eigene Gummiraupe ersetzt, was minimalen Bodendruck, hohe Zugkraft und einen Komfort auf Radtraktorniveau bringt. Motor PowerTech PSS 9,0 l und Kabine CommandView 4 werden mit der 8R geteilt, Getriebe e23 oder IVT.
  9r-gen1: >-
    Die erste Generation der Bezeichnung 9R. Motor Cummins QSX 15,0 l, Raupenversionen 9RT (zwei Gummiraupen) und 9RX (vier Gummiraupen).
  9r-gen2: >-
    Generation mit den JD-Motoren 13,6 l und 18,0 l, Kabine der neuen Generation, e18 PowerShift, autonome Lenkung, Raupenversionen 9RX in fünf Leistungsvarianten.
  9rx: >-
    Die erste Generation des branchenweit ersten **knickgelenkten Vierraupen-Traktors** — 2015 als eigenständige Raupenversion der 9R-Baureihe eingeführt. Vier unabhängige Gummiraupen sorgen für eine gleichmäßige Gewichtsverteilung, minimale Bodenverdichtung und eine Zugkraft auf dem Niveau der schwersten 9R-Radtraktoren. Motor Cummins QSX 15,0 l, 18-Gang-PowerShift e18. Ab 2022 wurde die 9RX in die neue Gen-2-Baureihe integriert.
  cts: >-
    Die Hybridtechnologie CTS (Cylinder Tine Separator) — Kombination aus konventioneller Dreschtrommel und zwei Rotoren. Nachfolger der Baureihen 9000/9500/9600.
  9000-kombajn: >-
    Konventionelle Trommel-Schüttler-Bauweise, die typische amerikanische Schwergewichtsreihe.
  wts: >-
    Die europäische Mähdrescher-Generation, konventionelle Abscheidung mit verbesserten Schüttlern und Rotor-Nachabscheider.
  9000-sts: >-
    Die revolutionäre Einrotor-Technologie STS (Single Tine Separator). Vom 9660 STS bis zum 9880i STS.
  s-series: >-
    Premium-Baureihe der Einrotor-Mähdrescher. Motor JD PowerTech / Cummins 13,5 l, hydrostatischer Fahrantrieb, ActiveYield, Automatik HarvestSmart, Display der Generation 4.
  t-series: >-
    Der europäische Schüttler-Mähdrescher (Walker). Motor JD PowerTech 6,8/9,0/13,5 l, ProDrive-Fahrantrieb, fünf Schüttler.
  w-series: >-
    Wirtschaftliche europäische Baureihe mit konventioneller Abscheidung, 4 bis 5 Schüttlern, Motor JD PowerTech 6,8 l.
  x-series: >-
    Das revolutionäre Doppelrotorsystem Dual Separator. Höchster Durchsatz und niedrigste Verluste der Klasse. Motor JD PowerTech 13,6 l, AutoMaintain, HarvestVision.
  6000-rezacky: >-
    Die ersten modernen Feldhäcksler von John Deere, gebaut in Zweibrücken (Deutschland) — nach der Übernahme deutscher Futtererntekompetenz. Motoren PowerTech 8,1–12,5 l, mechanischer Walzenantrieb, klassischer Metallauswurf.
  7000-rezacky: >-
    Modernisierung mit elektronischer Steuerung des Einzugs, automatischer Schnittlängenverstellung AutoLOC und dem verbesserten Corncracker-System KernelStar. Tier-3-Motor PowerTech, Kabine ComfortGard.
  7050-rezacky: >-
    Die Generation 7050 brachte AutoLOC II, den NIR-Sensor HarvestLab für die Echtzeitanalyse von Trockenmasse und Inhaltsstoffen sowie die Einbindung von GreenStar 2. Tier-3-Motoren, Leistungen von 360 bis 625 PS.
  8000-rezacky: >-
    Die Generation 8000 brachte einen völlig neuen Gutfluss — ein um 25 % größeres Einzugsaggregat, das neue System KernelStar 2 (Corncracker), HarvestLab 3000 und die Einbindung von JDLink. Motor JD PowerTech 9,0 / 13,5 / 19,0 l Tier 4.
  9000-rezacky: >-
    Die Flaggschiff-Baureihe der Feldhäcksler. Der **9900** mit 24,2-l-Liebherr-Motor und über 1 000 PS ist der leistungsstärkste Feldhäcksler der Welt. AutoLOC III, KernelStar 3, HarvestLab 3000, voll integriertes AutoTrac, Kamerasysteme und JDLink Connect.
  4730-postrikovace: >-
    Die erste moderne Generation der selbstfahrenden Feldspritzen von John Deere für den europäischen Markt. Gebaut in Waterloo (USA) und Horst (Niederlande). Motor PowerTech, vier einzeln angetriebene Räder (HydroHandle), Tank 1 500–4 540 l. Die Modelle 4730/4830/4930 deckten 200 bis 360 PS ab.
  r-series-postrikovace: >-
    Die aktuelle Generation der selbstfahrenden Feldspritzen. Modelle R4030/R4040i/R4045i sowie die US-Baureihe R4044/R4060/R4150. Motor JD PowerTech, BoomTrac Pro (automatische Gestängeführung), Einzeldüsenschaltung (ExactApply, See & Spray), AutoTrac, Einbindung ins Operations Center.

