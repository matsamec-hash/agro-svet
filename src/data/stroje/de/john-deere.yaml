models:
  john-deere-5010: >-
    Der erste John Deere, der offiziell die Marke von 100 PS überschritt. Ein großer Traktor für die westlichen Prärien der USA.
  john-deere-4020: >-
    Eine Ikone der amerikanischen Landtechnik der 1960er-Jahre. Das Power-Shift-Getriebe mit acht Lastschaltstufen war revolutionär. Einer der begehrtesten Sammlertraktoren von John Deere.
  john-deere-4430: >-
    Bestseller der Sound-Gard-Ära. Quad-Range- oder Power-Shift-Getriebe, Turbomotor mit 125 PS. Über 95 000 Stück gebaut.
  john-deere-4440: >-
    Der ikonischste John Deere der 1970er- und 1980er-Jahre. Power Shift, Sound-Gard II, 7,6-l-Turbomotor. Ein Synonym für Zuverlässigkeit.
  john-deere-8r-410: >-
    Flaggschiff der Baureihe. CommandView-4-Kabine, AutoPath, Hydraulik mit 435 l/min, Heckhubwerk 12 000 kg. IVT Boost bis 428 PS.
  john-deere-8rx-410: >-
    Flaggschiff mit vier Raupenlaufwerken. Gleicher Motor wie der 8R 410, vier Gummibänder für maximale Zugkraft und minimale Bodenverdichtung.
  john-deere-fh-7950: >-
    Der stärkste Feldhäcksler seiner Zeit — über 800 PS aus 19,0 l Hubraum.
  john-deere-fh-9900: >-
    Das Feldhäcksler-Flaggschiff. V12-Liebherr-Motor mit 24,2 l, Arbeitsbreite bis zwölf Reihen, Durchsatz über 400 t/h Grünmasse. Ein Symbol der Leistung in der europäischen Landwirtschaft.
