# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "USA"
description: >-
  Der größte Landtechnikhersteller der Welt. Das US-Unternehmen mit den grünen Traktoren und dem gelben Hirschen dominiert die Märkte in Nordamerika, Europa und Asien.

categories:
  traktory: "Traktoren"
  kombajny: "Mähdrescher"
  rezacky: "Feldhäcksler"
  postrikovace: "Selbstfahrende Feldspritzen"

series:
  5000: >-
    Utility-Traktoren 5200, 5300, 5400 und 5500 aus dem John-Deere-Werk in Augusta (Georgia, USA), Motorleistung etwa 45–85 PS. Einfaches Konzept für kleinere Betriebe und den Kommunaleinsatz; die europäischen Versionen baute Carraro in Italien.
  6000: >-
    Mittelklasse-Baureihe aus Mannheim: Vierzylinder 6100–6400 (ab 1992, Motoren 3,9 und 4,5 l) und Sechszylinder 6506, 6600, 6800 und 6900 (ab 1994, Motoren 5,9 und 6,8 l). PowrQuad-Getriebe, optional Vorderachsfederung Triple Link Suspension.
  "6010": >-
    Nachfolger der 6000er-Reihe, PowerTech-Motoren, Getriebe PowrQuad Plus 16x16. Erweitertes Programm von 80 bis 150 PS.
  "6020": >-
    Komplett neue Plattform. Kabine ComfortGard, Motor PowerTech Plus mit Common Rail, optional Getriebe AutoQuad Plus und Load-Sensing-Hydraulik.
  7000: >-
    Row-Crop-Traktoren 7600, 7700 und 7800 aus dem Werk Waterloo (1992–1997), Motorleistung 130–170 PS. Vorgänger der Baureihen 7010 und 7020.
  7010: >-
    Row-Crop-Traktoren der zweiten Generation: PowerTech-Motoren mit 6,8 l, beim 7710 und 7810 mit 8,1 l, Getriebe PowrQuad Plus, AutoQuad, 19-Gang-PowerShift und bei den großen Modellen auch das stufenlose IVT.
  7020: >-
    PowerTech-Motoren mit elektronischer Einspritzung (7920 mit 8,1 l), Getriebe AutoQuad, PowerShift und stufenloses AutoPowr IVT, das John Deere schon bei der Baureihe 7010 anbot.
  "7030": >-
    Abgasnorm Tier 3, Motor PowerTech Plus 6,8 l mit 24-Ventil-Kopf. Premium-Kabine mit Belüftung, Klimaanlage und elektronisch verstellbarem Sitz.
  "8000": >-
    Die legendäre „große Grüne“. Der erste Row-Crop über 200 PS mit moderner Kabine, elektronisch geregelter Hydraulik und PowerShift 16/4.
  "8010": >-
    Motor PowerTech 8,1 l, Getriebe PowerShift 16/4, Kabine ComfortGard Plus.
  "8020": >-
    Neue Generation mit dem Motor PowerTech Plus, optional das stufenlose Getriebe AutoPowr, aktive Vorderachsfederung ILS.
  "8030": >-
    Abgasnorm Tier 3 (PowerTech Plus 9,0 l), automatische Lenkung **AutoTrac**, Display GreenStar 2 1800/2630, Kabine CommandView, Vorderachsfederung TLS Plus, Raupenversion 8030T (8130T/8230T/8330T/8430T/8530T).
  9000: >-
    Knickgelenkte 4WD-Traktoren für große Betriebe. PowerTech-Motoren mit 8,1 l (9100), 10,5 l (9200) und 12,5 l (9300, 9400), Getriebe PowerShift 12/3.
  9020: >-
    Knickgelenkte Traktoren mit PowerTech-Motoren mit 8,1 l (9120) und 12,5 l, optional Raupenlaufwerk 9020T, GreenStar 2. Der 9620 kam mit dem Modelljahr 2004 hinzu.
  9030: >-
    Knickgelenkte Traktoren mit PowerTech-Motoren mit 9,0 l (9230) und 13,5 l, AutoTrac und GreenStar 3.
  new-generation-10-series: >-
    Die Baureihe, die die Ära der Zweizylindermotoren von John Deere („Johnny Popper“) beendete. Die Premiere am 30. August 1960 in Dallas („Deere Day in Dallas“) brachte Mehrzylindermotoren, das Synchro-Range-Getriebe und eine neue Hydraulik. Die Traktoren 1010–5010 wurden 1960–1965 gebaut und dann von der Baureihe 20 abgelöst.
  20-series-1963: >-
    Nachfolger der Baureihe 10. Das Schlüsselmodell 4020 (1963–1972) gehört zu den meistverkauften John-Deere-Traktoren, gebaut wurden über 184 000 Stück; er bot das Lastschaltgetriebe Power Shift und einen Diesel-Sechszylinder mit 6,6 l. In Mannheim fertigt John Deere seit der Übernahme der Heinrich Lanz AG 1956. Die angegebenen Leistungen sind Zapfwellenleistungen.
  30-series-sound-gard: >-
    Die Generation, die den Komfort in der Landwirtschaft neu definierte. Im September 1972 stellte John Deere die revolutionäre Kabine **Sound-Gard** vor — die erste integrierte schallgedämmte Kabine in der Landtechnik mit Klimaanlage, Heizung und Schwingungsdämpfung (max. 80 dB(A) im Innenraum). Sie trug den Beinamen „Generation II“. Die Modelle 4030/4230/4430/4630 lösten die erfolgreichen Reihen 4020/4320/4520/4620 ab und setzten neue Ergonomiestandards für die gesamte Branche.
  40-series-iron-horse: >-
    Weiterentwicklung der Sound-Gard-Kabine. Die Modelle 4040/4240/4440/4640/4840 brachten sparsamere Motoren, eine verbesserte Hydraulik und das Teillastschaltgetriebe Quad-Range. Die angegebenen Leistungen sind Zapfwellenleistungen, wie John Deere sie damals angab; der 4840 hatte 180 PS an der Zapfwelle.
  50-series-1982: >-
    Fortsetzung der Baureihe 40 mit Schwerpunkt auf Sparsamkeit. Die Modelle 4050/4250/4450/4650/4850 hatten etwa 130–215 PS Motorleistung (DIN), einen Saug- oder Turbo-Sechszylinder mit 7,6 l und die Getriebe Quad-Range oder Power Shift.
  55-series-1988: >-
    Die letzte Baureihe großer Row-Crop-Traktoren von John Deere vor der Baureihe 7000. Die Modelle 4055/4255/4455/4555/4755/4955 hatten einen Turbo-Sechszylinder mit 7,6 l; das Spitzenmodell 4955 leistete 230 PS (DIN), 200 PS an der Zapfwelle.
  5010-5020-5030: >-
    Sammelzeile mehrerer Generationen von John-Deere-Utility-Traktoren (Baureihen 5015, 5020 und 5M). PowerTech-Motoren, synchronisierte Getriebe.
  5m: >-
    Universalbaureihe 5M (ab 2009) mit PowerTech-Motoren und elektronisch geregelter Hydraulik. Seit Modelljahr 2023 (USA) bzw. 2024 (Europa) besteht sie aus 5075M, 5095M, 5105M, 5120M und 5130M.
  5r: >-
    Premium-Utility-Baureihe in zwei Generationen: 5080R/5090R/5100R (2008–2013) und 5090R/5100R/5115R/5125R (2016–2022). Getriebe CommandQuad oder stufenlos AutoPowr, Bedienung CommandARM.
  6030-premium: >-
    Premium-Baureihe mit der Technologie AutoPowr (CVT), voller Vorderachsfederung TLS, Premium-Kabine und Einbindung von GreenStar 2.
  6m: >-
    Universalbaureihe für Gemischtbetriebe in drei Generationen (2012–2016, 2016–2019, 2019–2024). PowerTech-Motoren mit 4,5 und 6,8 l, Getriebe AutoQuad, CommandQuad und AutoPowr. Seit 2024 von den Modellen 6M 95 bis 6M 250 abgelöst.
  6r: >-
    Premium-Allround-Baureihe in zwei Generationen: 2012–2015 mit PowerTech-PVX-Motoren (Stufe IIIB) und 2015–2021 (Stufe IV). Getriebe AutoQuad, DirectDrive und stufenloses AutoPowr IVT, Joystick CommandPRO, Federung TLS Plus. Seit November 2021 von den Modellen 6R 110 bis 6R 250 abgelöst.
  6r-gen3: >-
    Aktuelle Generation 6R (ab Modelljahr 2022) aus Mannheim. PowerTech-Motoren mit 4,5 l (4 Zylinder, bis 6R 150) und 6,8 l (6 Zylinder) Stufe V, Getriebe AutoQuad, DirectDrive und stufenlos AutoPowr, Kabine CommandView 4. Für das Modelljahr 2027 hat John Deere neue große Modelle 6R 180 bis 6R 260 angekündigt.
  7r: >-
    Row-Crop-Baureihe 7R (2011–2019): erste Generation 7200R–7280R (2011–2013), danach 7210R–7310R. PowerTech-Motoren mit 6,8 und 9,0 l, Getriebe PowerQuad, AutoQuad, ab Modelljahr 2014 e23 PowerShift, sowie stufenloses AutoPowr IVT. Ab Modelljahr 2020 von der Baureihe 7R 210–7R 350 abgelöst.
  7r-gen3: >-
    Aktuelle Baureihe 7R (ab Modelljahr 2020, 7R 350 ab 2021): 7R 210–270 mit PowerTech-PSS-Motor 6,8 l, 7R 290–350 mit PowerTech-PVS-Motor 9,0 l, Getriebe e23 PowerShift oder stufenlos AutoPowr IVT, Kabine CommandView 4. Leistungsstufen von 20 PS; in Europa werden 7R 270 bis 7R 350 angeboten.
  8r-gen1: >-
    Erste Generation 8R mit der Raupenversion 8RT in drei Modellsätzen: Modelljahr 2010 (8225R–8345R), 2011–2013 Interim Tier 4 (8235R–8360R) und 2014–2019 Final Tier 4 (8245R–8370R, ab 2016 auch 8400R). PowerTech-Motoren mit 9,0 l, Getriebe PowerShift, ab 2014 e23, und stufenlos AutoPowr IVT.
  8r-gen2: >-
    Komplett neue Plattform, Motor PowerTech PSS 9,0 l, Getriebe e23 / IVT / DirectDrive, Kabine CommandView 4, Raupenversionen 8RT und Radversionen 8R. AutoPath und autonome Lenkung (CES 2022).
  8rx-4track: >-
    Vierraupenversion der Baureihe 8R (ab Modelljahr 2020): statt jedes Rades eine eigene Gummiraupe für geringen Bodendruck und hohe Zugkraft. Motor PowerTech PSX 9,0 l (ab Modelljahr 2027 John Deere JD9) und Kabine wie bei der 8R, Getriebe e23 oder AutoPowr IVT.
  9r-gen1: >-
    Erste Generation 9R/9RT. 2012–2014 die Modelle 9360R–9560R, ab Modelljahr 2015 9370R–9620R. John-Deere-Motoren mit 9,0 l (9370R) und 13,5 l (9420R–9520R), Cummins QSX15 nur beim 9570R und 9620R. Raupenversionen 9RT (zwei Raupen) und ab 2016 9RX (vier Raupen).
  9r-gen2: >-
    Aktuelle Generation 9R/9RT/9RX (ab Modelljahr 2022). John-Deere-Motoren JD14 (13,6 l) mit e18-PowerShift-Getriebe und ab Modelljahr 2025 JD18 (18,0 l) mit e21 PowerShift, der die 9RX 710, 770 und 830 antreibt. Raupenversionen 9RT (zwei Raupen) und 9RX (vier Raupen).
  9rx: >-
    Erste Generation des knickgelenkten Vierraupentraktors 9RX, vorgestellt im August 2015 (Auslieferung ab Frühjahr 2016): die Modelle 9470RX und 9520RX mit John-Deere-Motor mit 13,5 l, 9570RX und 9620RX mit Cummins QSX15, Getriebe e18 PowerShift. Ab Modelljahr 2022 ging der 9RX in die neue Generation 9R über.
  cts: >-
    Die Hybridtechnologie CTS (Cylinder Tine Separator) — Kombination aus konventioneller Dreschtrommel und zwei Rotoren. Nachfolger der Baureihen 9000/9500/9600.
  9000-kombajn: >-
    Konventionelle Trommel-Schüttler-Bauweise, die typische amerikanische Schwergewichtsreihe.
  wts: >-
    Die europäische Mähdrescher-Generation, konventionelle Abscheidung mit verbesserten Schüttlern und Rotor-Nachabscheider.
  9000-sts: >-
    Die revolutionäre Einrotor-Technologie STS (Single Tine Separator). Vom 9660 STS bis zum 9880i STS.
  s-series: >-
    Premium-Baureihe der Einrotor-Mähdrescher. Motor JD PowerTech / Cummins 13,5 l, hydrostatischer Fahrantrieb, ActiveYield, Automatik HarvestSmart, Display der Generation 4.
  t-series: >-
    Der europäische Schüttler-Mähdrescher (Walker). Motor JD PowerTech 6,8/9,0/13,5 l, ProDrive-Fahrantrieb, fünf Schüttler.
  w-series: >-
    Wirtschaftliche europäische Baureihe mit konventioneller Abscheidung, 4 bis 5 Schüttlern, Motor JD PowerTech 6,8 l.
  x-series: >-
    Das revolutionäre Doppelrotorsystem Dual Separator. Höchster Durchsatz und niedrigste Verluste der Klasse. Motor JD PowerTech 13,6 l, AutoMaintain, HarvestVision.
  6000-rezacky: >-
    Die ersten modernen Feldhäcksler von John Deere, gebaut in Zweibrücken (Deutschland) — nach der Übernahme deutscher Futtererntekompetenz. Motoren PowerTech 8,1–12,5 l, mechanischer Walzenantrieb, klassischer Metallauswurf.
  7000-rezacky: >-
    Modernisierung mit elektronischer Steuerung des Einzugs, automatischer Schnittlängenverstellung AutoLOC und dem verbesserten Corncracker-System KernelStar. Tier-3-Motor PowerTech, Kabine ComfortGard.
  7050-rezacky: >-
    Die Generation 7050 brachte AutoLOC II, den NIR-Sensor HarvestLab für die Echtzeitanalyse von Trockenmasse und Inhaltsstoffen sowie die Einbindung von GreenStar 2. Tier-3-Motoren, Leistungen von 360 bis 625 PS.
  8000-rezacky: >-
    Die Generation 8000 brachte einen völlig neuen Gutfluss — ein um 25 % größeres Einzugsaggregat, das neue System KernelStar 2 (Corncracker), HarvestLab 3000 und die Einbindung von JDLink. Motor JD PowerTech 9,0 / 13,5 / 19,0 l Tier 4.
  9000-rezacky: >-
    Die Flaggschiff-Baureihe der Feldhäcksler. Der **9900** mit 24,2-l-Liebherr-Motor und über 1 000 PS ist der leistungsstärkste Feldhäcksler der Welt. AutoLOC III, KernelStar 3, HarvestLab 3000, voll integriertes AutoTrac, Kamerasysteme und JDLink Connect.
  4730-postrikovace: >-
    Die erste moderne Generation der selbstfahrenden Feldspritzen von John Deere für den europäischen Markt. Gebaut in Waterloo (USA) und Horst (Niederlande). Motor PowerTech, vier einzeln angetriebene Räder (HydroHandle), Tank 1 500–4 540 l. Die Modelle 4730/4830/4930 deckten 200 bis 360 PS ab.
  r-series-postrikovace: >-
    Die aktuelle Generation der selbstfahrenden Feldspritzen. Modelle R4030/R4040i/R4045i sowie die US-Baureihe R4044/R4060/R4150. Motor JD PowerTech, BoomTrac Pro (automatische Gestängeführung), Einzeldüsenschaltung (ExactApply, See & Spray), AutoTrac, Einbindung ins Operations Center.

# Popisy jednotlivých modelů (model.slug → DE text). V základních datech
# jsou česky a overlay je jinak nepokrývá — bez tohohle bloku svítila na
# /de/stroje/<značka>/<řada>/<model>/ česká věta pod německým nadpisem.
models:
  john-deere-5010: >-
    Der erste John Deere, der offiziell die Marke von 100 PS überschritt. Ein großer Traktor für die westlichen Prärien der USA.
  john-deere-4020: >-
    Eine Ikone der amerikanischen Landtechnik der 1960er-Jahre. Das Power-Shift-Getriebe mit acht Lastschaltstufen war revolutionär. Einer der begehrtesten Sammlertraktoren von John Deere.
  john-deere-4430: >-
    Bestseller der Sound-Gard-Ära. Quad-Range- oder Power-Shift-Getriebe, Turbomotor mit 125 PS. Über 95 000 Stück gebaut.
  john-deere-4440: >-
    Der ikonischste John Deere der 1970er- und 1980er-Jahre. Power Shift, Sound-Gard II, 7,6-l-Turbomotor. Ein Synonym für Zuverlässigkeit.
  john-deere-8r-410: >-
    Flaggschiff der Baureihe. CommandView-4-Kabine, AutoPath, Hydraulik mit 435 l/min, Heckhubwerk 12 000 kg. IVT Boost bis 428 PS.
  john-deere-8rx-410: >-
    Flaggschiff mit vier Raupenlaufwerken. Gleicher Motor wie der 8R 410, vier Gummibänder für maximale Zugkraft und minimale Bodenverdichtung.
  john-deere-fh-7950: >-
    Der stärkste Feldhäcksler seiner Zeit — über 800 PS aus 19,0 l Hubraum.
  john-deere-fh-9900: >-
    Das Feldhäcksler-Flaggschiff. V12-Liebherr-Motor mit 24,2 l, Arbeitsbreite bis zwölf Reihen, Durchsatz über 400 t/h Grünmasse. Ein Symbol der Leistung in der europäischen Landwirtschaft.
  john-deere-4730: >-
    3 000 l Tank, Gestänge 24/27/28 m.
  john-deere-4830: >-
    3 800 l Tank, Gestänge 27/30 m.
  john-deere-4930: >-
    4 540 l Tank, Gestänge 36 m.
  john-deere-4940: >-
    Tier 4 Final. 4 540 l Tank.
  john-deere-r4030: >-
    3 000 l Tank, Gestänge 24–28 m.
  john-deere-r4040i: >-
    4 000 l Tank, Gestänge 27–36 m, isoliertes System.
  john-deere-r4045i: >-
    4 500 l Tank, Gestänge 30–40 m, ExactApply.
  john-deere-r4150i: >-
    Flaggschiff der Baureihe. 5 700 l Tank, Gestänge 36–40 m, See & Spray Premium.
