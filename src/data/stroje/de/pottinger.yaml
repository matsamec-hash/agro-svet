# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Österreich"
description: >-
  Österreichischer Familienbetrieb mit breitem Portfolio für die Bodenbearbeitung (Servo-Pflüge, Terradisc, Synkro, Lion), die Aussaat (Aerosem, Terrasem, Vitasem) und vor allem die Futterernte (Novacat-Mähwerke, Top-Schwader, Hit-Zettwender, Impress-Pressen, Jumbo- und Faro-Ladewagen). Stammsitz ist Grieskirchen, Produktionswerke bestehen in Österreich, Tschechien (Vodňany), Deutschland und Polen.

categories:
  seti: "Aussaat und Pflanzung"
  sklizen-picnin: "Futter- und Strohernte"
  zpracovani-pudy: "Bodenbearbeitung"

series:
  aerosem: >-
    AEROSEM sind pneumatische Sämaschinen von Pöttinger für den Einsatz in Kombination mit einer Kreiselegge (Lion) oder solo. Kennzeichnend sind der Zentralverteiler, die IDS-Technologie zum Abschalten der Fahrgassen und die einzigartige Funktion PCS (Precision Combi Seeding) für die Maisaussaat mit einer Universalsämaschine. Zielgruppe sind mittlere und große Betriebe, die eine vielseitige Maschine für Getreide und Reihenkulturen brauchen.
  terrasem: >-
    TERRASEM ist die Flaggschiff-Baureihe der Pöttinger-Säkombinationen mit integrierter Kurzscheibenegge, Packerreifen und DUAL-DISC-Säscharen. Die Maschine erledigt in einer Überfahrt flache Bearbeitung, Einebnung, Rückverfestigung und Aussaat und spart damit Zeit und Kosten. Die gezogenen Versionen C und V sind für große Betriebe und Lohnunternehmen mit hohem Leistungs- und Vielseitigkeitsanspruch gedacht (Getreide, Raps, Mais mit ISOBUS-Sästeuerung).
  vitasem: >-
    VITASEM sind klassische mechanische Sämaschinen von Pöttinger mit Nockenrad-Säaggregat und der Möglichkeit zur Kombination mit der Kreiselegge Lion (Variante M). Zuverlässige Technik für kleine und mittlere Betriebe, die eine einfache Bedienung, niedrige Anschaffungskosten und universellen Einsatz für Getreide und Feinsämereien verlangen. Arbeitsbreiten von 2,5–4 m decken den Bedarf der allermeisten Familienbetriebe ab.
  eurocat: >-
    EUROCAT waren Trommelmähwerke von Pöttinger für Berggebiete und kleine Betriebe mit leichten Traktoren. Die Trommelbauweise steckte Steine und Unebenheiten besser weg als Scheibenmähwerke, hatte aber einen höheren Leistungsbedarf. Die Baureihe wurde schrittweise durch die modernen Scheibenmähwerke NOVACAT und NOVADISC ersetzt, die geringeres Gewicht und bessere Schnittqualität bieten. Die Maschinen sind auf tausenden Bergbetrieben in Österreich und Bayern nach wie vor im Einsatz.
  hit: >-
    HIT (HEUTEDDER) sind die Zettwender von Pöttinger mit einem breiten Spektrum an Arbeitsbreiten von 4,5 m (4 Kreisel) bis 12,7 m (12 Kreisel). Zu den Schlüsseltechnologien zählen das System DYNATECH mit aerodynamisch geformten Kreiseln für schonendes Wenden sowie LIFTMATIC für das gleichmäßige Ausheben der Kreisel am Vorgewende ohne Narbenkontakt. Ziel ist maximale Futterqualität bei minimalen Blattverlusten bei Klee und Luzerne.
  impress: >-
    IMPRESS ist die 2017 vorgestellte erste Rundballenpressen-Generation von Pöttinger, komplett neu entwickelt. Die Schlüsselinnovation ist die LIFTUP-Technologie mit dem Rotor in oberer Position (die Presse öffnet nach oben), wodurch der kürzeste Materialweg und ein hoher Durchsatz erreicht werden. Erhältlich sind die Varianten F (Festkammer 125 cm), V (variabel 155/185 cm) sowie Kombinationen mit Wickler (FC PRO, VC PRO). Zielgruppe sind anspruchsvolle Betriebe und Lohnunternehmen mit hohem Leistungs- und Ballendichteanspruch.
  jumbo: >-
    JUMBO ist die Flaggschiff-Baureihe der Pöttinger-Ladewagen mit den größten Volumina im Portfolio (38–50 m³ DIN). Die Maschinen richten sich an Großbetriebe und Lohnunternehmen, die bei der Futterernte maximale Leistung brauchen. Kennzeichnend sind der kurze Erntegutfluss, das Schneidwerk mit 45 Messern (4 cm Schnittlänge), das automatische Schleifen, dreiachsige Fahrwerke mit Zwangslenkung und hydraulische Federung. Die Modernisierung 2022 brachte ein neues HMI und die Einbindung der ISOBUS-Teilbreitensteuerung.
  faro: >-
    FARO sind mittelgroße Ladewagen von Pöttinger für mittlere Betriebe, die die Kapazität der Flaggschiff-Baureihe JUMBO nicht benötigen. Volumen 25–35 m³ DIN, Schneidwerk mit 31 Messern, zweiachsige Fahrwerke. Die preislich günstigere Alternative mit geringerem Traktorbedarf (ab 100 PS). Die Variante COMBILINE erlaubt den Einsatz sowohl als Ladewagen als auch als Transportwagen für Häckselgut.
  novacat: >-
    NOVACAT ist die zentrale Scheibenmähwerks-Baureihe von Pöttinger und deckt das gesamte Spektrum von kleinen Anbaumähwerken mit 2,6 m bis zu Mähkombinationen mit 10 m aus Front- und zwei Heckmähwerken ab. Schlüsseltechnologien: Y-DRIVE-Antrieb mit Raum für die Futterdurchmischung, hydraulische Entlastung (Hydraulic Compensation), Aufbereiter ED (Zinken) oder RC (Walze) sowie der Kollisionsschutz NONSTOP LIFT. Das Spitzenmodell A10 bietet eine variable Arbeitsbreite von 9,52–10,02 m mit automatischer Überlappungsregelung.
  novadisc: >-
    NOVADISC sind leichte Scheibenmähwerke von Pöttinger ohne Aufbereiter, gedacht für Berggebiete, kleine Betriebe und Pferdehalter, die das Abtrocknen im natürlichen Schwad bevorzugen. Das geringe Gewicht (250–500 kg) erlaubt den Einsatz auch an Traktoren ab 40 PS. Arbeitsbreiten 2,2–3,5 m, 4–7 Scheiben. Die preislich zugängliche Alternative zur NOVACAT für die extensive Bewirtschaftung.
  top: >-
    TOP ist die breiteste Schwader-Baureihe von Pöttinger und umfasst Einkreisel- (3,4–4,6 m), Zweikreiselschwader mit Seitenablage (6,8–9,5 m), Vierkreiselschwader mit Mittelablage (8,8–12,5 m) sowie einen Mittelschwader für maximale Arbeitsbreite. Schlüsseltechnologien: TOPTECH PLUS mit Getriebe im Ölbad, das Tastrad MULTITAST für schonende Bodenanpassung und das hydraulische Einklappen in Transportstellung. Damit werden die Bedürfnisse vom kleinen Betrieb bis zum Lohnunternehmen abgedeckt.
  fox: >-
    FOX ist die Einstiegsbaureihe der Pöttinger-Saatbettkombinationen für kleine und mittlere Betriebe mit Traktoren von 80–130 PS. Die Kombination aus vorderen Planierschienen, zwei Scheibenreihen und Heckwalze bereitet das Saatbett in einer Überfahrt. Arbeitsbreite 3 m, Anbauausführung. Preislich attraktive Lösung für Betriebe, die keine großen Arbeitsbreiten der TERRADISC oder TERRIA brauchen.
  lion: >-
    LION ist die Baureihe robuster Kreiseleggen von Pöttinger für die anspruchsvolle Saatbettbereitung, vor allem nach dem Pflügen, auf schweren Böden und in Kombination mit den Sämaschinen AEROSEM oder VITASEM. Arbeitsbreiten 2,5–6 m, Getriebe für Leistungen bis 360 PS. Die Versionen CLASSIC, MASTER und SUPERIOR unterscheiden sich in Robustheit und maximal zulässiger Traktorleistung. Kennzeichnend sind die Schnellwechselzinken QUICKFIT, integrierte Frontpacker und die Kompatibilität mit dem Dreipunktsystem der Sämaschinen.
  servo: >-
    SERVO ist die Flaggschiff-Baureihe der Pöttinger-Drehpflüge und gilt seit Langem als einer der hochwertigsten Pflüge am Markt. Das Sortiment umfasst Anbaupflüge (3–6 Schare), Aufsattelpflüge (5–9 Schare) und gezogene Pflüge (bis 14 Schare). Schlüsseltechnologien: TRACTION CONTROL zur automatischen Auflastregelung, SERVOMATIC plus für die einfache Einstellung von Arbeitsbreite und Neigung, die hydraulische Steinsicherung NONSTOP und universelle Pflugkörper für unterschiedliche Bodenarten. Die Generation SERVO 3000/4000 (ab 2020) brachte eine um 50 % höhere Rahmensteifigkeit.
  synkro: >-
    SYNKRO sind mehrbalkige Zinkengrubber von Pöttinger für die flache Stoppelbearbeitung wie auch für die tiefe Lockerung bis 30 cm. Verfügbar sind 2-, 3- und 4-balkige Varianten mit Arbeitsbreiten von 2,5–6 m (Anbau) und bis 8 m (gezogen). Kennzeichnend sind die hydraulische Steinsicherung NONSTOP, ein breites Scharangebot (schmal/breit/Meißel) und die Heckwalze (Rohrstab-, Zinken- oder Gummiwalze). Eine Universalmaschine für den gesamten Bearbeitungszyklus zwischen Ernte und Aussaat.
  terradisc: >-
    TERRADISC ist die Baureihe der Kurzscheibeneggen von Pöttinger für die schnelle und saubere flache Stoppelbearbeitung (5–15 cm). Große Scheiben (510 oder 580 mm) mit Einzelaufhängung in Gummielementen sorgen auch auf steinigen Böden für eine gute Bodenanpassung. Arbeitsbreiten 3–6 m (Anbau, klappbar, gezogen). Die Standardmaschine mittlerer und großer Betriebe für die Stoppelbearbeitung, die Einarbeitung organischer Dünger und die Vorbereitung der Winterungssaat.
  terria: >-
    TERRIA ist die 2020 vorgestellte neue Baureihe der Tiefengrubber von Pöttinger für die tiefe Bodenbearbeitung von 5–35 cm. Die vierbalkige Bauweise mit großem Balkenabstand (95 cm) sorgt für einen hervorragenden Durchgang von organischer Masse und Stroh. Robuste Konstruktion mit Schnellwechselscharen und einem breiten Angebot an Heckwalzen. Zielgruppe sind Großbetriebe und Profis, die auf pfluglose Verfahren und Minimalbodenbearbeitung setzen.
