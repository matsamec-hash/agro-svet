# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Schweden"
description: >-
  Schwedischer Hersteller hochleistungsfähiger Sämaschinen (Tempo, Rapid, Spirit, Inspire, Proceed) und Bodenbearbeitungsgeräte (Carrier, Cultus, TopDown, Opus, NZ Aggressive). Globaler Marktführer bei der Präzisionssaat von Mais mit dem Tempo-System, das Weltrekorde in der Sägeschwindigkeit hält (bis 20 km/h). Der Sitz liegt im schwedischen Väderstad; robuste Bauweise und präzise agronomische Lösungen sind das Markenzeichen.

categories:
  seti: "Aussaat und Pflanzung"
  zpracovani-pudy: "Bodenbearbeitung"

series:
  inspire: >-
    Die Inspire 1200S ist eine universelle gezogene pneumatische Sämaschine für kleine und mittlere Betriebe. Sie verbindet die Bodenvorbereitung (Scheiben und Packer) mit der exakten Kornablage in einer Überfahrt. Arbeitsbreite 12 m, Tankvolumen 6 300 l und der hydraulisch geregelte Schardruck erlauben flexible Aussaat in unterschiedlichen Bearbeitungsverfahren.
  proceed: >-
    Die Proceed V ist die neue Präzisionsplattform von Väderstad für die Aussaat von Weizen, Soja, Raps und weiteren Kulturen mit Einzelkornkontrolle. Die Vereinzelung in jeder Reihe spart 20–40 % Saatgut gegenüber der klassischen Drillsaat und bringt einen gleichmäßigen Bestand. Als Spitzenneuheit im Portfolio überträgt die Proceed die Prinzipien des Precision Planting vom Mais auf feinkörnige Kulturen.
  rapid-a: >-
    Die Rapid A ist eine gezogene Universalsämaschine und die Flaggschiff-Baureihe von Väderstad für große Betriebe. Arbeitsbreiten von 4–9 m, das OffSet-System der exakten Kornablage und die System Disc für die Bodenvorbereitung meistern die Aussaat in Mulch wie auch in klassisch bearbeitetem Boden. Der Großtank mit 3 900–5 500 l minimiert Standzeiten beim Nachfüllen von Saatgut und Dünger.
  rapid-rd: >-
    Die Rapid RD 300-400C ist eine pneumatische Anbausämaschine für die intensive Aussaat auf mittleren und kleineren Flächen. Sie verbindet die passive Bodenbearbeitung mit Scheiben und die exakte Kornablage. Arbeitsbreiten von 3–4 m, ein auf mittelstarke Traktoren abgestimmtes Gewicht und das bewährte Väderstad-Säschar sichern auch unter schwierigen Bedingungen einen guten Bestand.
  spirit: >-
    Die Spirit ist eine leistungsstarke gezogene Sämaschine mit großen Arbeitsbreiten von 6–9 m für Großflächenbetriebe. System Disc Aggressive und Crossboard Heavy erledigen die Bodenvorbereitung auch unter schwierigen Bedingungen in einer Überfahrt. Der 5 000-l-Großtank und das präzise pneumatische Verteilsystem bewältigen die Hochleistungssaat von Getreide und Raps.
  spirit-r: >-
    Die Spirit R ist die Zinkenversion der Spirit mit aktivem Reihenschar, ausgelegt auf Minimalbodenbearbeitung und No-Till. Arbeitsbreiten von 3–4 m, der individuell geregelte Druck auf jedes Zinkenschar sorgt für gleichmäßige Ablagetiefe. Geeignet für dichte Bestände von Getreide, Raps und Leguminosen in Fruchtfolgen mit reduzierter Bodenbearbeitung.
  tempo-f: >-
    Die Tempo F ist eine frontangebaute Einzelkornsämaschine für die Kombination mit einer angebauten Rapid am Heck-Dreipunkt. Sie erlaubt die gleichzeitige Aussaat von Mais oder Sonnenblumen mit Startdüngergabe in einer Überfahrt. Das PowerShoot-System von Väderstad sichert die exakte Kornablage auch bei 12–15 km/h.
  tempo-l: >-
    Die Tempo L ist die gezogene Flaggschiff-Einzelkornsämaschine von Väderstad, verfügbar mit 6, 8, 12, 16 und 18 Reihen. Das PowerShoot-System mit aktiver Dosiereinheit hält die präzise Vereinzelung auch bei Rekordgeschwindigkeiten von 15–20 km/h — dem Doppelten klassischer Sägeräte. Das Light-Pulse-Saatgutmonitoring überwacht jedes Korn in Echtzeit und passt die Aussaat den Feldbedingungen an.
  tempo-r: >-
    Die Tempo R ist eine gezogene Einzelkornsämaschine mit starrem Rahmen für mittelgroße Betriebe mit 6–8 Reihen. Die robuste Bauweise und die PowerShoot-Dosiereinheit sichern hohe Produktivität bei der Aussaat von Mais, Sonnenblumen, Soja und Raps. Der starre Rahmen bringt einfache Wartung und kompakte Transportmaße.
  tempo-v: >-
    Die Tempo V ist die Anbauvariante der Einzelkornsämaschine mit 6–8 Reihen, passend für europäische Betriebe mit kleinerer Fläche. Das hydraulische Klappen hält die Transportbreite unter 3 m. Die PowerShoot-Dosiereinheit und die aktive Tiefenführung halten die Ablagetiefe von 1–7 cm bei 12–18 km/h konstant.
  carrier: >-
    Die Carrier ist die Flaggschiff-Scheibenegge von Väderstad für die flache bis mitteltiefe Stoppelbearbeitung, das Einmischen von Ernterückständen und die Saatbettbereitung. Die geschmiedeten 450–510-mm-Scheiben CrossCutter Disc oder TrueCut schneiden Stroh auch bei hohen Geschwindigkeiten von 12–20 km/h. Die modulare Baureihe reicht von 3 m (Carrier Basis) bis 12 m (Carrier XL/XT) für jede Betriebsgröße.
  crosscutter-disc: >-
    Die CrossCutter Disc ist eine ultraflache Scheibenegge für das ganzflächige Abschneiden der Stoppel in 2–5 cm Tiefe und die Förderung des Auflaufens von Ausfallgetreide und Unkräutern. Speziell geformte Scheiben mit 14° Konkavität schneiden aggressiv, ohne die Bodenschichten unnötig zu vermischen. Eine Schlüsselmaschine für das Stoppelmanagement in CTF- und regenerativen Systemen. Arbeitsbreiten 5–12 m bei bis zu 20 km/h.
  cultus: >-
    Der Cultus CS ist ein universeller Zinkengrubber für mittlere Tiefen von 5–25 cm. Der Balkenabstand von 80 cm und die gesicherten Federzinken mit 600 kg Auslösekraft sorgen auch auf steinigen Böden für Durchgang. Die dreireihige Zinkenanordnung minimiert Verstopfungen durch Pflanzenreste. Geeignet für Stoppelbearbeitung, tiefe Lockerung und Saatbettbereitung in einer Maschine.
  swift: >-
    Der Swift ist ein Hochgeschwindigkeits-Zinkengrubber für die flache Stoppelbearbeitung in 3–15 cm Tiefe. Die Arbeitsgeschwindigkeit von 12–20 km/h bringt eine hohe Flächenleistung bei niedrigem Kraftstoffverbrauch. Zwei Zinkenreihen mit schmalen 50-mm-Scharen und eine Nachlaufwalze erledigen Oberflächenbearbeitung und Saatbett in einer Überfahrt.
  opus: >-
    Der Opus L500 ist der Tiefengrubber von Väderstad für die intensive Lockerung bis 35 cm Tiefe. Hydraulisch gesicherte Zinken mit bis zu 850 kg Auslösekraft und 80 cm Reihenabstand brechen verdichtete Bodenprofile auch auf schweren Böden auf. Die zweireihige Walzenausstattung bringt den Boden in einem Arbeitsgang in eine saatfähige Struktur.
  topdown: >-
    Die TopDown ist eine Kombinationsmaschine für One-Pass-Tillage und vereint vier Arbeitsgänge in einer Überfahrt: Scheiben für die flache Einmischung, Tiefenzinken (bis 30 cm), Einebnungsscheiben und Nachlaufwalze. Ideal für den Übergang von der konventionellen Bearbeitung zur Minimalbodenbearbeitung. Arbeitsbreiten 3–7 m, die Lockerungstiefe lässt sich hydraulisch aus der Kabine stufenlos einstellen.
  nz-aggressive: >-
    Die NZ Aggressive ist eine leistungsfähige Saatbettkombination mit Federzinken für die intensive Saatbettbereitung in 3–10 cm Tiefe. Arbeitsbreiten von 5–10 m und die vierreihige Zinkenanordnung sorgen auch nach tiefem Pflügen für feine Krümelung und ebene Oberfläche. Geeignet für die Frühjahrs- und Herbstvorbereitung für Getreide, Raps und Hackfrüchte.
  rexius: >-
    Die Rexius ist die schwere Nachernte- und Saatbettwalze von Väderstad für die Rückverfestigung und Einebnung nach dem Pflügen oder Grubbern. Arbeitsbreiten 6,2–12,4 m, 600 kg/m Betriebsgewicht zerkleinern Kluten und schaffen optimale Kapillarität für die Keimung. Der Frontausgleich CrossBoard Heavy ebnet Unebenheiten ein.
  rexius-twin: >-
    Die Rexius Twin ist eine Doppelwalze mit zwei Reihen CambridgeRing-Ringen (Ø 470 + 510 mm) für zusätzliche Rückverfestigung und maximale Kapillarität. Höheres Gewicht und doppelter Bodenkontakt sichern die Bestandsetablierung von Getreide und Raps zuverlässiger ab. Geeignet für anspruchsvolle Minimalbodenbearbeitung und regenerativen Ackerbau.
  rollex: >-
    Die Rollex ist eine kompakte gezogene Walze für kleinere und mittlere Betriebe mit 6,2–12,4 m Arbeitsbreite. Die im Vergleich zur Rexius leichtere Bauweise erlaubt den Anbau an Traktoren ab 120 PS. Serienmäßig mit 470-mm-Cambridge- oder CrossKill-Ringen für unterschiedliche Einsatzbedingungen. Hydraulisches Klappen auf unter 3 m Transportbreite.
