# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Finnland"
description: >-
  Finnischer Traktorenhersteller mit langer Tradition (früher Valmet). Seit 2004 Teil des AGCO-Konzerns. Bekannt für die robuste Konstruktion für nordische Bedingungen, das Rückfahrsystem TwinTrac (Kabine mit drehbarem Sitz für die Arbeit nach hinten) und die Individualisierung — jeder Traktor wird nach Kundenwunsch gebaut. Mähdrescher werden nicht produziert.

categories:
  traktory: "Traktoren"

series:
  valmet-6000-8000: >-
    Traktoren von Valmet / Valtra Valmet: Baureihe Mezzo 6000 (ab 1991) und die „Fünfziger“-Modelle 8000 (1995–2004); 6200 bis 6400 wurden noch 2005–2007 gebaut. Valmet-/Sisu-Motoren mit 4 und 6 Zylindern, Getriebe 12V/12R synchronisiert, optional Delta Powershift 36V/36R.
  hitech: >-
    Vierzylinder-Traktoren HiTech 6250, 6350, 6550, 6650, 6750 und 6850 (etwa 1998–2006) mit Sisu-Motoren mit 4,4 l und HiTech-Lastschaltgetriebe 36V/36R. Verkauft unter den Marken Valtra Valmet und Valtra. In dieser Liste stehen auch die Valmet 6600 und 6800 aus der Mezzo-Reihe, die es nicht als HiTech gab.
  n-gen1: >-
    Erste Generation der N Series (2005): N91, N101, N111, N111e, N121 und N141, ab 2007 auch N82 und N92. Sisu-/AGCO-Power-Motoren mit 4,4 l, Getriebe HiTech und ab 2008/09 Versu sowie stufenlos Direct (N122, N142). Ab Januar 2012 von der 3. Generation N93–N163 abgelöst.
  n-gen2: >-
    4. Generation der N Series (N4, 2014/2015–2021): N104, N114e, N124, N134, N154e und N174. AGCO-Power-Motoren mit 4,4 und 4,9 l, Versionen HiTech, Active, Versu und stufenlos Direct, Dachfenster SkyView für die Frontladerarbeit.
  n-gen3: >-
    5. Generation der N Series (N5, ab 14. 4. 2021): N135, N155e und N175. Motor AGCO Power 4,9 l Stufe V, Versionen Active, Versu und stufenlos Direct, Kabine SmartTouch.
  t-gen1: >-
    Sammelzeile dreier Generationen der T Series: T130–T190 (2003–2007/08), T121–T191 (2007–2012, ab 2009 auch stufenlos Direct) und T213 (2012–2014). Sisu-/AGCO-Power-Sechszylinder mit 6,6 und 7,4 l, Getriebe HiTech, HiTech 5 und Versu.
  t-gen2: >-
    4. Generation der T Series (T4, Herbst 2014 – April 2021): T144 und T154 mit AGCO-Power-Motor 6,6 l, die größeren Modelle mit 7,4 l; Getriebe HiTech, Active, Versu und stufenlos Direct, ab 2017 Kabine SmartTouch. Ab April 2021 von der 5. Generation T145–T255 abgelöst, heute wird die 6. Generation T146–T236 gebaut.
  s-gen1: >-
    S Series S232–S352 (2009–2011): Motor AGCO Power 8,4 l, Getriebe AGCO Variable Transmission (AVT), Rückfahreinrichtung TwinTrac. Ab 2011 von den S233–S353 abgelöst.
  s-gen5: >-
    4. Generation der S Series (S4): S274–S374 ab dem Jahreswechsel 2013/2014, S394 ab 2017. Motor AGCO Power 8,4 l, Getriebe AGCO Variable Transmission (AVT), Kabine SmartTouch. Im November 2023 von der 6. Generation S286–S416 abgelöst.
  a-series: >-
    4. Generation der A Series (A4, 2017–2021) für kleinere Betriebe und den Kommunaleinsatz: A74–A94 mit AGCO-Power-Dreizylinder 3,3 l, A104–A134 mit Vierzylinder 4,4 l. Im Januar 2021 von der um 5 PS stärkeren 5. Generation A75–A135 abgelöst.
  g-series: >-
    Mittelklasse zwischen A und N. Motor AGCO Power 4,4 l Abgasstufe V, kompakte Abmessungen mit moderner Kabine SmartTouch (optional) oder Classic.
  q-series: >-
    Baureihe zwischen T und S, vorgestellt am 2. 9. 2022. AGCO-Power-Sechszylinder mit 7,4 l, Stufe V, stufenloses Getriebe, Kabine SmartTouch. Modelle Q225 bis Q305.
