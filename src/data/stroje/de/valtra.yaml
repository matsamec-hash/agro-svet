# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Finnland"
description: >-
  Finnischer Traktorenhersteller mit langer Tradition (früher Valmet). Seit 2004 Teil des AGCO-Konzerns. Bekannt für die robuste Konstruktion für nordische Bedingungen, das Rückfahrsystem TwinTrac (Kabine mit drehbarem Sitz für die Arbeit nach hinten) und die Individualisierung — jeder Traktor wird nach Kundenwunsch gebaut. Mähdrescher werden nicht produziert.

categories:
  traktory: "Traktoren"

series:
  valmet-6000-8000: >-
    Die letzte Generation unter der Marke Valmet vor der Umbenennung in Valtra (2001). Motor Valmet als 4- und 6-Zylinder, synchronisiertes Getriebe 30/30. Wegen Einfachheit und Verfügbarkeit in Mitteleuropa beliebt.
  hitech: >-
    Die erste Generation unter der Marke Valtra (ab 2001). Motor Sisu Power als 4- und 6-Zylinder, Getriebe HiShift mit elektronischer Schaltung 40/40. Das Rückfahrsystem TwinTrac war verfügbar.
  direct-legacy: >-
    Der erste Valtra mit stufenlosem Getriebe (CVT). Eine revolutionäre Technologie für einen Hersteller, der historisch auf mechanischen Getrieben aufbaute.
  n-gen1: >-
    Neue Universalbaureihe. Motor AGCO Power 4-Zylinder, Getriebe HiTech 5 / Versu Powershift 36/36 / Direct CVT. Die Kabine wurde gemeinsam mit einem Industriedesigner entwickelt.
  n-gen2: >-
    Die dritte Generation der N (von Valtra im Marketing als 4. Generation bezeichnet). Motor AGCO Power 4,4 l (4-Zylinder) oder 4,9 l (4-Zylinder), Abgasstufe IV/V. Versionen Active (mechanisch), Versu (Powershift) und Direct (CVT). Kabine mit SkyView-Dach für den Frontladerbetrieb. Modelle mit dem Suffix -4 (N104, N114, …, N174).
  n-gen3: >-
    Die vierte Generation der N-Serie (Valtra Unlimited). Motor AGCO Power 4,9 l Abgasstufe V, Getriebe Active / Versu (Powershift) / Direct (CVT). Kabine SmartTouch 3 mit 9-Zoll-Display, Armlehne mit OLED-Tasten. Modelle ohne Suffix -4 (Umbenennung in N135/N155/N175/N195).
  t-gen1: >-
    Die Flaggschiff-Baureihe der Row-Crop-Klasse. Motor Sisu/AGCO Power 6-Zylinder mit 6,6 l und 7,4 l. Versionen HiTech, HiTech 5, Versu (Powershift) und Direct (CVT).
  t-gen2: >-
    Die 4. und 5. Generation. Motor AGCO Power 6-Zylinder 7,4 l, Getriebe HiTech 5, Active, Versu (Powershift 5x5), Direct (CVT). Kabine SmartTouch (ab 2015) — integriertes 9-Zoll-Display und Joystick mit OLED-Symbolen.
  s-gen1: >-
    Die erste Generation der S-Serie. Motor AGCO Power 8,4 l, Getriebe Direct CVT, Kabine mit TwinTrac (Rückfahreinrichtung).
  s-gen5: >-
    Die 5. Generation. Motor AGCO Power 8,4 l Abgasstufe V, Getriebe AGCO PowerSplit CVT. Kabine SmartTouch.
  a-series: >-
    Utility-Baureihe für kleinere Betriebe und Kommunen. Motor AGCO Power 3,3 l und 4,4 l, Getriebe Mechanical / HiTech, Wendeschaltung Power Shuttle.
  g-series: >-
    Mittelklasse zwischen A und N. Motor AGCO Power 4,4 l Abgasstufe V, kompakte Abmessungen mit moderner Kabine SmartTouch (optional) oder Classic.
  q-series: >-
    Die neueste Baureihe zwischen T und S, 2022 auf der FIMA in Saragossa vorgestellt. Motor **AGCO Power CORE66 6,6 l** (NICHT 7,4 l wie bei der T-Serie) Abgasstufe V, Getriebe PowerSplit CVT, Kabine SmartTouch 3 mit der Rückfahreinrichtung TwinTrac als Option, Valtra SmartControl und EcoPower-Modus für geringeren Verbrauch.
