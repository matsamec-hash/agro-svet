# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Norwegen"
description: >-
  Norwegischer Landtechnikhersteller, 1879 in Kverneland (Jæren) gegründet und seit 2012 Teil der japanischen Kubota Corporation. Traditionell als „King of Plows“ bezeichnet — die klassischen Pflüge 150 / 2300 / ED / EG, die aufgesattelten PB100 / 6300 und ihre Grindel aus dem patentierten Kverneland-Stahl sind weltweit der Maßstab beim Pflügen. Dazu kommen die Scheibeneggen Qualidisc Pro/Farmer, die Zinkengrubber Enduro / CTC / Turbo, die Kreiseleggen NG-S/H, die Walzen Actiroll sowie die Sämaschinen Optima (Einzelkorn), e-drill / u-drill / Accord (pneumatisch) und TS-Evo (mechanisch). Für die Düngung stehen die Streuer Exacta CL / TL / HL mit der exklusiven Technologie GEOSPREAD für die Teilbreitenschaltung im Meterraster bereit. Im Pflanzenschutz: die Anbauspritzen iXter B/A, die gezogenen iXtrack T3/T4/T6 und die Selbstfahrer iXdrive 4180–5240. Zur Kverneland Group gehören auch die Schwestermarken Vicon, Roc und Kubota Implements.

categories:
