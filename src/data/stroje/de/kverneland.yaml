series:
  plough-150: >-
    Kverneland 150 — der klassische Anbau-Drehpflug mit 3–6 Scharen, die Flaggschiffreihe für kleine und mittlere Betriebe. Die Versionen B (mechanische Arbeitsbreitenverstellung), S (Scherbolzensicherung gegen Überlast) und V (Vari-Width, stufenlose hydraulische Furchenbreitenverstellung von 30–50 cm aus der Kabine). Grindel aus dem speziellen Kverneland-Stahl mit hoher Lebensdauer und universeller Geometrie für Pflugtiefen bis 30 cm.
  plough-2300: >-
    Kverneland 2300 — Anbau-Drehpflug mit 5–7 Scharen für mittlere und größere Betriebe mit Traktoren von 130–280 PS. Der robuste Rahmen mit der automatischen Steinsicherung Auto-Reset (Version S) schützt die Grindel beim Auffahren auf Steine und kehrt nach dem Hindernis ohne Anhalten in die Arbeitsstellung zurück. Das Vari-Width-System erlaubt die stufenlose Änderung der Furchenbreite von 30–55 cm zur Anpassung an unterschiedliche Bodenverhältnisse.
  plough-ed: >-
    Kverneland ED — kompakter Anbau-Drehpflug mit 3–5 Scharen, geeignet für kleine Betriebe und Traktoren von 80–150 PS. Die leichte Bauweise mit geringem Gewicht und einfacher Bedienung in Verbindung mit dem Kverneland-Grindel sichert eine gute Pflugarbeit auch unter mitteleuropäischen Bedingungen. Erhältlich mit mechanischer oder hydraulischer Arbeitsbreitenverstellung.
  plough-eg: >-
    Kverneland EG — Heavy-Duty-Anbau-Drehpflug mit 5–7 Scharen für große Betriebe mit Traktoren von 180–360 PS. Der massive Rahmen mit 200×200 mm und die Auto-Reset-Sicherung erlauben das Pflügen auch in steinigen Böden ohne Stillstände. Die Vari-Width-Version bietet die stufenlose Furchenbreitenverstellung aus der Kabine, die X-Bolt-Versionen mit Scherbolzensicherung eine feste Einstellung mit höherem Durchsatz.
  plough-pb100: >-
    Kverneland PB100 — aufgesattelter Drehpflug mit 6–9 Scharen, die Flaggschiffreihe für große Betriebe und Lohnunternehmen. Das eigene Laufrad trägt einen Teil des Gewichts, sodass ein Traktor mit 200–360 PS auch mit großer Arbeitsbreite pflügen kann, ohne die Hinterachse zu überlasten. Auto-Reset-Sicherung und Vari-Width für die stufenlose Furchenbreite von 30–55 cm sind Standard. Robuster Rahmen für den ganzjährigen Intensiveinsatz.
  plough-6300: >-
    Kverneland 6300 — aufgesattelter Heavy-Duty-Drehpflug mit 7–12 Scharen, die Spitzenbaureihe für große Schläge und Lohnunternehmen mit Traktoren von 280–500 PS. Hydraulisch gesteuertes Transportsystem, massives Kopfgelenk und ein robuster Rahmen erlauben Arbeitsbreiten bis 6,6 m. Die hydraulische Auto-Reset-Sicherung und die Vari-Width-Verstellung aus der Kabine sichern maximale Effizienz und Lebensdauer im ganzjährigen Intensiveinsatz.
  qualidisc: >-
    Qualidisc — Scheibeneggen von Kverneland mit X-Anordnung der Scheiben für die flache Stoppelbearbeitung und die Einarbeitung von Ernterückständen. Die Versionen Pro (Heavy Duty mit 3–15 cm Arbeitstiefe und 3–7 m Arbeitsbreite, Anbau und gezogen) und Farmer (leichter, für mittlere Betriebe). Große Scheiben mit 510 mm Durchmesser und hydraulisch verstellbarem Anstellwinkel erlauben die Arbeit auch in Maisstrohresten bei 8–15 km/h.
  enduro: >-
    Enduro — Zinkengrubber von Kverneland für die mitteltiefe und tiefe Bodenbearbeitung bis 30 cm. Drei bis vier Reihen Gänsefußschare mit der automatischen hydraulischen Sicherung Triflex schützen vor Schäden in steinigen Böden. Arbeitsbreite 3–6 m, erhältlich als Anbau- und gezogene Version. Geeignet für Mulchsaat wie auch für die klassische Bearbeitung mit anschließender Saatbettbereitung.
  ctc: >-
    CTC (Conventional Tillage Cultivator) — Heavy-Duty-Zinkengrubber von Kverneland für die tiefe Bearbeitung bis 35 cm. Vier Reihen Gänsefußschare mit großen Abständen (95 cm zwischen den Balken) sorgen für einen hohen Durchgang der Ernterückstände ohne Verstopfungen. Der robuste Rahmen mit hydraulischer Sicherung und großer Rahmenhöhe erlaubt gute Arbeit auch in schweren Tonböden mit viel Stroh.
  turbo: >-
    Turbo — flach arbeitender Zinkengrubber von Kverneland für die schnelle Stoppelbearbeitung in 5–15 cm Tiefe. Die dichte Bestückung mit schmalen Scharen (3 Reihen, 27 cm Strichabstand) sichert einen 100-prozentigen Schnitt des Profils und das saubere Unterschneiden von Stoppeln und Unkräutern. Die ideale Maschine für die flache Stoppelbearbeitung direkt nach der Ernte, mit anschließender Zwischenfruchtsaat oder ohne Saatbettbereitung.
  ng: >-
    NG — Kreiseleggen von Kverneland für die Saatbettbereitung in Kombination mit Sämaschinen. Die Versionen NG-S (kompakt, für Traktoren bis 180 PS, Arbeitsbreite 2,5–4,0 m), NG-H (Heavy Duty, bis 250 PS, Arbeitsbreite 3,0–4,5 m) und NG-M (klappbar, Arbeitsbreite bis 6 m). Robustes Getriebe, leicht wechselbare Zinken und das Quick-Fit-System für die schnelle Verbindung von Walze und Sämaschine in einer Überfahrt.
  actiroll: >-
    Actiroll — gezogene Walze von Kverneland für die Rückverfestigung nach dem Pflügen oder Grubbern. Arbeitsbreiten 6,3 / 8,3 / 9,9 / 12,3 m, klappbare Bauweise für den Transport. Erhältlich mit Cambridge-Ringen (522 mm) oder Crosskill-Ringen (550 mm) für unterschiedliche Bodenverhältnisse. Die zentrale hydraulische Druckregelung aus der Kabine erlaubt die Anpassung an die Bodenfeuchte.
  optima: >-
    Optima — Einzelkornsämaschine von Kverneland für Mais, Sonnenblumen, Rüben, Soja und weitere Reihenkulturen. Die Versionen TF Profi (gezogener Rahmen für hohes Tempo), SX (e-drive, elektrischer Antrieb der Dosierung), HD-II (Heavy-Duty-Pneumatikscheibe) und M (mechanisch). Die Vereinzelung erfolgt in jeder Sektion einzeln, GEOCONTROL Section Control schaltet die Sektionen am Vorgewende ab. Arbeitsbreiten 3–12 m, Reihenweiten 45–80 cm.
  e-drill: >-
    e-drill — kompakte pneumatische Anbausämaschine von Kverneland für kleine und mittlere Betriebe. Der elektrische Antrieb der Dosierung erlaubt die stufenlose teilflächenspezifische Aussaatmenge (VRT) über das ISOBUS-Terminal ohne mechanisches Getriebe. Arbeitsbreite 3–4 m, Behälter 1 100 l, erhältlich als Maxi (größerer Behälter) und Compact (leichtere Bauweise). Ideal für die Aussaat in ein vorbereitetes Saatbett in Kombination mit der Kreiselegge NG.
  u-drill: >-
    u-drill — universelle gezogene pneumatische Sämaschine von Kverneland für die Aussaat in Mulch wie auch in klassisch bearbeiteten Boden. Die kurze Bauweise mit den Scheibenscharen CX-II erlaubt die Arbeit in Ernterückständen ohne Verstopfen. Die Versionen Pro (Plus mit großem 4 350-l-Behälter und geteiltem Fronthopper für Dünger) und Standard für Arbeitsbreiten von 3, 4 und 6 m. Schardruck bis 200 kg für die zuverlässige Kornablage.
  accord: >-
    Accord — die traditionelle pneumatische Säeinheit von Kverneland mit integrierter Dosierung und CX-II-Scharen. Die Modelle DA (Anbau, 3 m Arbeitsbreite in Kombination mit einer Kreiselegge) und MSC (Mounted Seedline Combination, modulare Kombination mit der Kreiselegge NG-H). Eine bewährte Technik aus den 1980er-Jahren, die in Europa bis heute für die zuverlässige Getreide- und Rapsaussaat in intensiven Systemen eingesetzt wird.
  ts-evo: >-
    TS-Evo — mechanische Sämaschine von Kverneland mit Schwerkraftdosierung für kleine und mittlere Betriebe. Arbeitsbreiten 2,5 / 3,0 / 4,0 m, einfache Bedienung ohne ISOBUS, robustes Norton-Getriebe. Ideal für die Aussaat von Getreide, Kleearten und Zwischenfrüchten dort, wo keine teilflächenspezifische Menge nötig ist. Erhältlich als Anbaugerät oder in Kombination mit der NG-Kreiselegge als TS-Drill.
  exacta: >-
    Exacta — Mineraldüngerstreuer von Kverneland mit der exklusiven Technologie GEOSPREAD für die exakte Teilbreitenschaltung (im Meterraster) über GPS. Die Versionen CL (kompakt, 750–1 900 l, Arbeitsbreite 9–28 m), TL (mittel, 1 100–2 700 l, Arbeitsbreite 12–42 m) und HL (schwer, 1 500–3 900 l, Arbeitsbreite 18–54 m). Doppelscheiben mit ProfShape-Schaufeln sorgen für ein gleichmäßiges, symmetrisches Streubild auch beim Grenzstreuen. ISOBUS serienmäßig, Integration in Farmmanagement-Software für die teilflächenspezifische Ausbringung (VRA).
  ixter: >-
    iXter — Anbauspritzen von Kverneland für kleine und mittlere Betriebe. Die Versionen iXter B (kompakt, 1 000–1 800 l, Arbeitsbreite 15–28 m) und iXter A (Advanced, ISOBUS, automatische Gestängeführung BoomGuide, 1 500 l). Aluminiumgestänge HC mit Luftaufhängung, iXflow-Air mit kontinuierlicher Zirkulation für den schnellen Mittelwechsel ohne Spülung. SectionControl schaltet die Teilbreiten nach GPS am Vorgewende ab.
  ixtrack: >-
    iXtrack — gezogene Feldspritzen von Kverneland für mittlere und große Betriebe. Die Versionen T3 (kompakt, 2 400–3 400 l, Arbeitsbreite 18–30 m), T4 (mittel, 3 400–4 600 l, Arbeitsbreite 24–36 m) und T6 (schwer, 4 600–6 400 l, Arbeitsbreite 27–40 m). Aluminiumgestänge HC mit BoomGuide ProActive für die exakte Bestandsführung, iXflow-Air mit kontinuierlicher Zirkulation und das integrierte ISOBUS-Terminal Tellus PRO. Hydropneumatische Achsaufhängung und die Spurführung TrailControl.
  ixdrive: >-
    iXdrive — Selbstfahrspritzen von Kverneland mit eigenem Motor und eigener Kabine. Die Modelle 4180 (4 000 l, 180 PS) und 5240 (5 200 l, 220 PS) mit Arbeitsbreiten von 24–40 m. Hydrostatischer Allradantrieb, 1,25 m Bodenfreiheit und die verstellbare Spurweite von 1,80–2,25 m erlauben die Einfahrt in höhere Bestände. Luftgefederte Kabine, automatische Gestängeführung BoomGuide ProActive und iXflow-Air-Zirkulation. Ideal für große Betriebe und Lohnunternehmen mit hoher Flächenleistung.
  5000-m: >-
    Kverneland 5000 M — heckangebaute Scheibenmähwerke mit Arbeitsbreiten von 2,4–3,2 m (Modelle 5087 M / 5095 M / 53100 M). Robuster Mähbalken mit 6–8 Scheiben, ProLine-Messergeometrie für einen sauberen Schnitt und einfachen Wechsel. Die QuattroLink-Aufhängung sorgt für ideale Bodenanpassung auch am Hang. Optionale Aufbereiter mit Zinken- oder Walzenrotor beschleunigen das Anwelken.
  51000-mt: >-
    Kverneland 51000 MT — frontangebautes Scheibenmähwerk für die Kombination mit dem Schmetterlings-Heckmähwerk 53100 MT und einer Gesamtarbeitsbreite bis 9 m. Die Pull-Type-Aufhängung sorgt auch in Kurven für ideale Bodenanpassung, ProtectionDrive schützt das Getriebe beim Auffahren auf Hindernisse. Geeignet für Lohnunternehmen und große Betriebe mit intensiver Futterernte.
