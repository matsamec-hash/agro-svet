# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Tschechien"
description: >-
  BEDNAR FMT ist ein tschechischer Hersteller von Premiummaschinen für Bodenbearbeitung, Aussaat und Düngerausbringung, 1997 in Rychnov nad Kněžnou gegründet. Das Unternehmen baut robuste Maschinen für große Betriebe mit Arbeitsbreiten von 3–18 m und hoher Flächenleistung. Die Flaggschiff-Baureihen sind die Tiefengrubber TERRALAND, die Saatbettkombinationen SWIFTER, die Kurzscheibeneggen ATLAS und die Universalsämaschinen OMEGA. Bednar liefert in über 40 Länder und zählt zu den bedeutendsten tschechischen Landtechnikmarken.

categories:
  seti: "Aussaat und Pflanzung"
  zpracovani-pudy: "Bodenbearbeitung"

series:
  omega: >-
    Die OMEGA ist die universelle pneumatische Flaggschiff-Sämaschine von BEDNAR für Minimalbodenbearbeitung, Mulchsaat und konventionelle Verfahren. Arbeitsbreite 3–9 m, Doppelscheiben-Säschare, CrossBoard Heavy und ein Zentraltank mit 3 000–5 000 l. Die Modelle OO (gezogen) und OF (mit Vorwerkzeugen) erlauben die Aussaat in Mulch, Stroh und festes Stoppelfeld. Die Maschine ist bei Großbetrieben in Mitteleuropa und Osteuropa beliebt.
  ferox: >-
    Die FEROX ist die schnelle pneumatische Sämaschine von BEDNAR, optimiert für Arbeitsgeschwindigkeiten bis 18 km/h. Die kurze Bauweise, die aggressive Scheibensektion und die exakte Dosierung bringen eine hohe Flächenleistung auf großen Schlägen. Arbeitsbreite 4–6 m, ideal in Kombination mit vorheriger Bodenbearbeitung.
  corsa: >-
    Die CORSA ist die Einzelkornsämaschine von BEDNAR für Mais, Sonnenblumen, Rüben und Soja. Pneumatische Vereinzelung, elektrischer Antrieb der Säaggregate und Sektionen mit individueller Schardruckregelung. Arbeitsbreite ab 4,5 m bei 70 cm Reihenweite, ausgelegt auf Precision Farming mit ISOBUS-Terminal.
  combo: >-
    Die COMBO LO ist die Kombisämaschine von BEDNAR, die Bodenvorbereitung und exakte Aussaat in einer Überfahrt verbindet. Scheibensektion, Packerwalze und pneumatisches Säaggregat erlauben die Aussaat in unbearbeiteten Boden oder nach der Stoppelbearbeitung. Arbeitsbreite 4–6 m, geeignet für Mulchsaatsysteme.
  ferti-box: >-
    Die FERTI-BOX FB ist der frontangebaute Düngertank von BEDNAR, mit dem sich Sämaschinen um die Mineraldüngerausbringung während der Saat erweitern lassen. Volumen 1 700–3 000 l, pneumatischer Transport des Düngers über Leitungen zum Säaggregat im Heck. Sie erlaubt Strip-Till-Düngung und Startgaben für Mais und Raps.
  terraland: >-
    Der TERRALAND ist die Flaggschiff-Baureihe der BEDNAR-Tiefengrubber für die tiefe Lockerung bis 65 cm ohne Wenden des Bodens. Der robuste Rahmen, der Meißel Active-Mix und die Nachlaufwalze CrossBoard sorgen für die Einmischung der Pflanzenreste und eine gute Bodenstruktur. Die Modelle TN (Anbau), TO (gezogen) und DO (gezogen mit Scheibensektion) decken Arbeitsbreiten von 3–7 m ab und verlangen Traktoren mit 200–500 PS.
  swifter: >-
    Der SWIFTER ist die Flaggschiff-Saatbettkombination von BEDNAR für die Saatbettbereitung in einer Überfahrt. Die Kombination aus Frontstriegel, Kompaktorsektionen, Federzinkenegge und Nachlaufwalze schafft ein ebenes, gut strukturiertes Profil für die Aussaat. Die Arbeitsbreiten von 6–18 m je nach Modell (SO Anbau, SM mittel, SN gezogen) zählen zu den größten der Kategorie.
  atlas: >-
    Der ATLAS ist die Baureihe der BEDNAR-Kurzscheibeneggen für die flache Bearbeitung von 5–15 cm und die Stoppelbearbeitung nach der Ernte. Große Scheiben von 620–660 mm mit Einzelaufhängung in Gummielementen bewältigen auch hartes Stoppelfeld. Arbeitsbreiten von 3–15 m je nach Modell: AO (Anbau), AN (gezogen, mittel) und AM (gezogen, groß) decken Betriebe von 200 bis 5 000 ha ab.
  fenix: >-
    Der FENIX ist der Zinkengrubber von BEDNAR für die flache bis mitteltiefe Bearbeitung von 8–25 cm. Gänsefußschare mit großer Überlappung sorgen für ganzflächiges Unterschneiden und die Einmischung der Pflanzenreste. Das Modell FN ist die Anbauversion bis 4 m, FO die gezogene mit 4–7 m. Geeignet für Stoppelbearbeitung, Frühjahrslockerung und Saatbettvorbereitung.
  versatill: >-
    Der VERSATILL ist der universelle Zinkengrubber von BEDNAR für mittlere Tiefen von 10–35 cm mit Schnellwechselsystem für die Meißel. Dank modularer Bauweise bewältigt er Stoppelbearbeitung, Lockerung und Saatbettbereitung. Arbeitsbreite 3–6 m, Modell VO als Anbau- und als gezogene Ausführung.
  kor: >-
    Der KOR ist die kompakte angebaute Kurzscheibenegge von BEDNAR für kleinere und mittlere Betriebe. Scheiben mit 510 mm in X-Anordnung sorgen für aggressiven Schnitt und gute Einmischung. Arbeitsbreite 2,5–4 m, geeignet für Traktoren ab 100 PS. Das Modell KO gibt es nur in Anbauausführung.
  mulchfarmer: >-
    Der MULCHFARMER ist der Kombigrubber von BEDNAR für die Mulchsaattechnologie. Er vereint Scheibensektion, Zinken und Walze in einer Überfahrt und erlaubt so die Bodenvorbereitung bei hohem Anteil an Pflanzenresten. Arbeitsbreite 4–6 m; das Modell MF meistert schwierige Bedingungen nach Mais und Raps.
  strip-master: >-
    Der STRIP-MASTER ist die Strip-Till-Maschine von BEDNAR für die streifenweise Bodenbearbeitung mit Düngerausbringung. Gelockert wird nur ein 20 cm breiter Streifen im Abstand von 45–80 cm, zwischen den Streifen bleibt der Mulch erhalten. Das spart Kraftstoff, schützt den Boden vor Erosion und ermöglicht eine gezielte Nährstoffversorgung. Modell SM mit 3–6 m Arbeitsbreite, mit integriertem Tank oder Anschluss an die FERTI-BOX.
  row-master: >-
    Der ROW-MASTER RN ist die Reihenhacke von BEDNAR für die mechanische Pflege von Mais, Sonnenblumen, Rüben und Soja. Sektionen mit Messerscharen und Scheiben für die exakte Führung in Reihenweiten von 45–80 cm. Optional mit Flüssigdüngerausbringung oder Banddüngung erweiterbar. Arbeitsbreite 6–12 m.
  galaxy: >-
    Die GALAXY ist die Baureihe der schweren Walzen von BEDNAR für die Rückverfestigung nach Pflug oder Grubber sowie für den Frühjahrseinsatz im Weizen. Cambridge- oder Crosskill-Segmente mit 530–630 mm Durchmesser, Arbeitsbreiten 6–18 m. Das Modell GO hat einen Klapprahmen für den Großflächeneinsatz.
  presspack: >-
    Der PRESSPACK ist die angebaute Packerwalze von BEDNAR hinter Pflug oder Grubber für die sofortige Rückverfestigung und den Schluss des Bodenprofils. Gummi- oder Stahlringe mit 700–900 mm Durchmesser und hohem Gewicht wirken bis in die Tiefe. Das Modell PP gibt es mit 3–6 m Arbeitsbreite, zur Montage am Heck-Dreipunkt oder direkt am Gerät.
  presser: >-
    Der PRESSER PE ist die gezogene Packerwalze von BEDNAR hinter dem Pflug für die laufende Rückverfestigung der Krume während des Pflügens. Er erspart die zweite Überfahrt mit der Walze und erlaubt den direkten Anschluss der Aussaat. Die Arbeitsbreiten richten sich nach der Pfluggröße; das Modell PE passt zu 5- bis 9-scharigen Pflügen.
