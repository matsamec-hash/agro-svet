# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Japan"
description: >-
  Japanischer Hersteller mit langer Tradition. Starke Position im Segment der Kompakt- und Mitteltraktoren, historisch bekannt für Obstbau, Weinbau und Kommunaldienste. In den letzten Jahren expandiert die Marke auch in die Row-Crop-Klasse (M-Serie über 130 PS). Mähdrescher von Kubota (Baureihe DC) spielen in Europa praktisch keine Rolle — sie sind vor allem für den japanischen und asiatischen Markt bestimmt.

categories:
  traktory: "Traktoren"
  kombajny: "Mähdrescher"

series:
  b: >-
    Kompakttraktoren bis 30 PS für Gärten, Obstbau, Kommunaldienste und Hobbybetriebe. Kubota 3-Zylinder-Diesel, HST- oder Stufengetriebe. Die aktuelle Baureihe B01 (B2301, B2601) knüpft an die historischen B7500/B2920/B3350 an.
  bx: >-
    Subkompakttraktoren für Gärten, Kommunaldienste und Hobbybetriebe. Kubota 3-Zylinder-Diesel, hydrostatisches Getriebe (HST).
  l: >-
    Kompakte Utility-Klasse von 20–60 PS. Kubota 3-Zylinder, HST- oder synchronisiertes Getriebe.
  lx: >-
    Kompakte Utility-Traktoren mit 24–30 PS. Einstiegsklasse für Hobbybetriebe und die Kommunalpflege — unter 30 PS. Kubota 3-Zylinder-Diesel, hydrostatisches Getriebe HST. Sie lösten die älteren Kompaktmodelle der L-Serie im Segment unter 30 PS ab.
  l02: >-
    Die neueste Generation der Kompakttraktoren der L-Serie nach Abgasstufe V. Modernisierte Kabine, ISOBUS-Unterstützung, 38–62 PS. Sie wird parallel zur LX verkauft (LX = einfachere Einstiegsklasse, L02 = voll ausgestattete Premium-Kompaktklasse).
  sta: >-
    Kleintraktoren der Kompaktklasse mit 3-Zylinder-Diesel. Bestimmt für Kommunaldienste, Gärten und kleinere Hobbybetriebe. Allradantrieb (MFWD), synchronisiertes Getriebe und ROPS-Bügel.
  me: >-
    Utility-Baureihe vor allem für den japanischen und asiatischen Markt, mit Export auch nach Europa. Geeignet für Obstbau, Weinbau und Feldarbeit. Die Schmalspurversion DTN mit reduzierter Breite ist für den spezialisierten Obstbaueinsatz gedacht.
  mx: >-
    Universeller Traktor der Mittelklasse — zwischen den Baureihen B/L (kompakt) und M (groß). Kubota-Motor nach Abgasstufe V, 55–63 PS. Er ersetzt die ältere Utility-Baureihe M5040/M5640/M6040.
  m60-legacy: >-
    Die ältere Utility-Klasse von 60–100 PS. Die erste Generation M6040/M7040/M8540/M9540 (2007–2013) mit dem Motor V3300/V3800 wurde später durch die moderneren M6060/M7060/M8560/M9960 mit Common Rail und Tier-IV-Abgasnorm ersetzt.
  mgx: >-
    Die sogenannte „M Grand X“ — gehobene Utility-Klasse mit 8-stufigem Powershift und breiter Kabine. Motoren V3800 (100/110 PS) und V6108 (126/135 PS). Die Generationen MGX, MGX-II, MGX-III und MGX-IV brachten schrittweise Neuerungen (Abgasstufe IIIB → V, FSS-Vorderachsfederung bei der S-Version).
  m4002: >-
    Preislich zugängliche Utility-Klasse. Motor Kubota V3307, 4-Zylinder, 3,3 l.
  m5: >-
    Beliebte Utility-Baureihe mit 95–115 PS. Motor Kubota V3800, 4-Zylinder mit Turbo, Getriebe Speed-Shift 36/36. Premium-Kabine.
  m6: >-
    Mittlere Premium-Baureihe. Motor Kubota V6108, 4-Zylinder, 6,1 l, Getriebe Powershift 24/24, optional CVT (MGX-Baureihe).
  m5002: >-
    Modernisierung der beliebten M5-Baureihe nach Abgasstufe V. Motor Kubota V3800, 4-Zylinder mit Turbo, 3,8 l, Getriebe Speed-Shift 36/36. Auch als M5002 Narrow für Obst- und Weinbau erhältlich.
  m6002: >-
    Nachfolger der ursprünglichen M6-Baureihe, vorgestellt auf der FIMA 2020 in Saragossa. Motor Kubota V6108-TIEF5, 4-Zylinder, 6,1 l mit Boost-Funktion, Getriebe 24/24 mit elektronischer Schaltung dreier Gruppen und 8 Lastschaltstufen. Radstand 2 690 mm, Bi-Speed-System für einen kleineren Wendekreis.
  m7: >-
    Die Row-Crop-Flaggschiffbaureihe — der erste Kubota in der Klasse über 150 PS. Motor Kubota V6108, 6,1 l Common Rail, Getriebe Powershift 24/24 oder KVT (CVT). Gebaut in Bierne, Frankreich.
  m7002: >-
    Die Generation der Flaggschiffbaureihe M7 nach Abgasstufe V. Motor Kubota V6108 Tier V, 6,1 l mit optimierter Leistungscharakteristik. Neues 6-stufiges Powershift-Getriebe 30F/15R, wahlweise 54F/27R mit Kriechgruppe. Nachfolger der M7-1/M7001, abgelöst von der Generation M7-4 (ab 2023).
  m8: >-
    Der größte Ackerschlepper in der Geschichte von Kubota. Ergebnis der Zusammenarbeit mit dem kanadischen Unternehmen Buhler Industries (Hersteller von Versatile), Endmontage in Winnipeg. Motor Cummins B6.7, 6-Zylinder Tier 4 Final ohne AGR (SCR + DPF), wahlweise Semi-Powershift 30x15 oder stufenloses Getriebe (CVT).
  mk: >-
    Schmalspurvarianten für Wein- und Obstbau. Motor Kubota 4-Zylinder, 3,8 l, Breite ab 1,2 m.
  sr: >-
    Baureihe kompakter Mähdrescher vorrangig für den japanischen und asiatischen Markt, ausgelegt vor allem auf Reis, Weizen und Gerste. Auf dem europäischen Markt kommen sie nicht vor, ein Import erfolgt allenfalls vereinzelt über japanische Gebrauchtmaschinenhändler.
  dc: >-
    Kleinere Kompaktmähdrescher vorrangig für asiatische Märkte, in Europa ohne Bedeutung. Geeignet für Reis, Weizen und Soja.
