models:
  claas-lexion-8700: >-
    Der CLAAS Lexion 8700 ist ein Hybridmähdrescher der oberen Klasse mit 625 PS (460 kW) und 13 500 l Korntank. Er gehört zur Generation Lexion 8000 (ab 2019) mit dem Dreschsystem APS SYNFLOW HYBRID. Der Lexion 8700 zielt auf große Getreidebetriebe mit hohen Tagesleistungen; die kleinere Alternative ist der Lexion 8600, die stärkere der Lexion 8800.
