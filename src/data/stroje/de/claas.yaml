# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Deutschland"
description: >-
  Deutsches Familienunternehmen, 1913 von den Gebrüdern Claas gegründet. Weltmarktführer bei Mähdreschern (Baureihe Lexion) und Feldhäckslern (Jaguar). Die CLAAS-Traktoren führen das Erbe des französischen Herstellers Renault Agriculture fort (Übernahme 2003). Stammsitz ist Harsewinkel.

categories:
  traktory: "Traktoren"
  kombajny: "Mähdrescher"
  sklizen-picnin: "Feldhäcksler"

series:
  ares: >-
    Nach der Übernahme von Renault Agriculture (2003) fortgeführte Baureihe, vom französischen Hersteller übernommen. Motor John Deere als 4- und 6-Zylinder.
  atles: >-
    Die große Flaggschiff-Baureihe vor dem Erscheinen der Axion. Motor DPS 6-Zylinder 7,4 l.
  celtis: >-
    Preislich zugängliche Einstiegsbaureihe aus dem Renault-Erbe. Motor Perkins 4-Zylinder.
  elios: >-
    Kompakte Utility-Baureihe. Motor FPT 4-Zylinder, einfaches mechanisches Getriebe.
  atos: >-
    Utility-Traktor mit Revershift-Getriebe und Power-Shuttle-Wendeschaltung.
  nexos: >-
    Schmalspur-Baureihe für Obst- und Weinbau. Motor FPT NEF 4-Zylinder.
  arion-gen1: >-
    Universelle Premium-Baureihe für Gemischtbetriebe. Motor DPS Perkins, Getriebe QuadriShift oder HexaShift.
  arion-gen2: >-
    Modernisierte Baureihe. Motor FPT/DPS, Getriebe HexaShift oder CMATIC (CVT). Kabine PANORAMIC mit verglastem Dach für den Frontladerbetrieb.
  axion-800-900: >-
    Die große Flaggschiff-Baureihe, gebaut in Le Mans (Frankreich). Motor FPT NEF 6,7 l (Axion 800) und FPT Cursor 9 8,7 l (Axion 900). Getriebe CMATIC (ZF Eccom CVT), Bedienhebel CMOTION, Terminal CEBIS Touch. Der Axion 960 leistet 445 PS und ist das Spitzenmodell der CLAAS-Traktoren (Abgasstufe V). Der Axion 940 war Tractor of the Year 2014.
  xerion: >-
    Systemtraktor mit Rückfahreinrichtung (drehbare Kabine Trac VC) und vier gleich großen Rädern. Motor **Mercedes-Benz** (OM906 / OM471 / OM473, 6-Zylinder, 7,7–12,8 l je nach Modell), Getriebe **HM4**, ein hydromechanisches 4-Mode-CVT (optional ZF Eccom). Gebaut in Harsewinkel. Varianten **Trac** (Standard) und **Saddle Trac** (fest positionierte Kabine für Aufbaugeräte, z. B. Gülletechnik). Der **Xerion 5000** war Tractor of the Year 2014.
  dominator: >-
    Die legendären Schüttler-Mähdrescher, die CLAAS an die Spitze brachten. In Mitteleuropa auf kleineren Betrieben noch regelmäßig im Einsatz.
  mega: >-
    Mittelklasse der Schüttler-Mähdrescher. Motor Mercedes-Benz 6-Zylinder. APS-Technologie für höheren Durchsatz.
  avero: >-
    Preislich zugängliche Einstiegsbaureihe für kleinere Betriebe. Motor John Deere 4-Zylinder.
  tucano: >-
    Mittelklasse. Schüttlerversionen Tucano 300–500 oder die Hybridvarianten der 400er-Serie mit einem APS-HYBRID-Rotor.
  lexion-400-500-600-700: >-
    Die Flaggschiff-Baureihe von CLAAS, 1995 mit dem Lexion 480 eingeführt — dem ersten **APS HYBRID** (APS-Vorabscheider + 1 längs liegender Rotor ROTO PLUS) in Europa. Motor Mercedes-Benz (OM906/OM471/OM473) oder Caterpillar (US-Markt, Joint Venture ab 1999). Gebaut in Harsewinkel (Deutschland) und Omaha (Nebraska, USA).
  lexion-5000-8000: >-
    Komplett neue Plattform, 2019 eingeführt. Design von Volker Groth (ehemals BMW), APS Synflow Walker (5000 — Schüttlermaschine mit 6 Schüttlern) oder APS Synflow Hybrid (6000–8000 — 1 längs liegender Rotor ROTO PLUS mit 600 mm Durchmesser). Cemos Auto Threshing / Cleaning / Separation, FieldScanner, Motor Mercedes-Benz OM471 / OM473 (Abgasstufe V). Der Lexion 8900 mit 790 PS zählt zu den leistungsstärksten Mähdreschern der Welt.
  trion: >-
    Nachfolger der Tucano. Komplett neue Plattform zwischen Tucano und Lexion. Varianten mit APS oder APS HYBRID, Trion Montana mit Hangausgleich bis 18 %.
  jaguar-700: >-
    Die erste Generation der selbstfahrenden Feldhäcksler Jaguar — 1973 mit den Modellen Jaguar 60 SF, 70 SF und 80 SF eingeführt. Ikonische Maschinen für die Mais- und Grassilageernte der 1970er- und 80er-Jahre. Motor Mercedes-Benz 6-Zylinder, mechanisches 4-Gang-Getriebe. Die späteren Modelle 685/690/695 SL brachten Automatisierung und mehr Leistung.
  jaguar-800: >-
    Modernisierte Generation mit digitaler Regelung und breiterer Häckseltrommel (V-MAX). Motor Mercedes-Benz OM441/OM442 als 6- bzw. 8-Zylinder, automatisches Messerschleifen. Modelle 820/840/860/880/890/900 im Bereich von 286–605 PS.
  jaguar-900-modern: >-
    Moderne Generation mit der Technologie **Dynamic Power** (lastabhängig variable Motorleistung) und Auto Fill (automatische Befüllung des Transportwagens). Motor Mercedes-Benz OM502 V8, später MAN V12 (980). Modelle 930/940/950/960/970/980/990 mit 360–884 PS. Der Jaguar 980 hielt lange den Titel des leistungsstärksten Feldhäckslers der Welt.
  jaguar-current: >-
    Die aktuelle Generation nach Abgasstufe V. Drei Leistungsklassen: **Jaguar 800** (Einstieg, 408–490 PS), **Jaguar 900** (Hauptbaureihe, 503–925 PS) und das Spitzenmodell **Jaguar 1000** (2023 vorgestellt, 925 PS, der leistungsstärkste selbstfahrende Feldhäcksler der Welt). Motor MAN V12 24,2 l (1000), Mercedes-Benz OM471/OM473 (900). CEMOS Auto Performance, Shredlage-Aufbereitung, Auto Fill 3D. Im deutschsprachigen Raum die dominierende Maschine für die Maissilageernte.

