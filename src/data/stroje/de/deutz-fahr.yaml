# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Deutschland / Italien"
description: >-
  Deutsche Marke mit langer Tradition seit 1864 (Deutz), 1969 Fusion mit Fahr. Teil der SDF Group (Same Deutz-Fahr) mit italienischem Anteil. Die Traktoren werden in Lauingen (Deutschland) und Treviglio (Italien) gebaut. Charakteristisch ist die grüne Lackierung. Starke Marktstellung haben die Baureihen 5G und 6G, das Flaggschiff ist die 9 Series.

categories:
  traktory: "Traktoren"
  kombajny: "Mähdrescher"

series:
  "7": >-
    Premium-Row-Crop-Baureihe. Motor Deutz TCD 6,1 l, Getriebe Powershift oder CVT (TTV). Design von Giugiaro.
  "8": >-
    Neue Generation nach langer Abwesenheit in dieser Klasse. Motor Deutz TCD 9,0 l, Getriebe TTV CVT. Neue Kabine MaxiView.
  "9": >-
    Row-Crop-Flaggschiff. Motor Deutz TCD 7,8 l, Getriebe CVT (TTV). Design von Giugiaro. Kabine MaxiVision 4 mit verglastem Panoramadach.
  06-series: >-
    Die ikonische Baureihe der grünen Deutz-Traktoren der späten 1960er- und der 1970er-Jahre — mit über 600 000 weltweit gebauten Einheiten der größte kommerzielle Erfolg der Marke. Die gesamte Baureihe nutzte luftgekühlte Deutz-Dieselmotoren F3L / F4L / F6L / F8L / F10L (513 und 413), was die Traktoren unabhängig von Kühlflüssigkeit machte — ein Vorteil in Regionen mit extremem Klima. Sie wurde auch in den Ostblock exportiert, wo sie als Premiumalternative galt und für einfache Wartung und Zuverlässigkeit geschätzt wurde. Die Modelle D 4006, D 4506, D 5206, D 6206, D 6806, D 7206, D 7506, D 8006, D 9006, D 10006 und das Spitzenmodell D 13006 deckten 40 bis 160 PS ab.
  dx: >-
    Der historische Klassiker von Deutz-Fahr mit luftgekühlten Deutz-Motoren F3L / F4L / F6L der Baureihen 912 und 913. Ikonische Reihe, unterteilt in die Klassen DX 3 (kompakter 3-Zylinder), DX 4 (4-Zylinder), DX 6 (6-Zylinder) und die Spitzenmodelle DX 7/8. 1983 folgte eine Modernisierung mit höherer Leistung.
  agrostar: >-
    Vorgänger der Baureihe Agrotron. Modernisierter Nachfolger der DX-Reihe mit luftgekühlten Deutz-Motoren. Der repräsentative „Star“ der 1990er-Jahre mit markantem Design und der Kabine StarCab.
  agroxtra: >-
    Übergangsbaureihe zwischen AgroStar und Agrotron. Motor Deutz 6-Zylinder, luftgekühlt (BF6L).
  agrotron-legacy: >-
    Die ikonische Agrotron-Generation — Tractor of the Year 1996. Die **MK1** (1995–1997) hatte eine revolutionär verglaste Kabine und einen Deutz-Motor mit dem problematischen ZF-Eccom-Getriebe. Die **MK2** (1997–2000) behob die Zuverlässigkeitsprobleme. Die **MK3** (2000–2003) brachte die Modelle 80–230 und **2001 den ersten Agrotron TTV** mit stufenlosem Getriebe.
  agroplus: >-
    Kompakte Utility-Traktoren auf Basis der SAME-Technik. Die erste Generation 60/70/80 mit luftgekühlten Deutz-Motoren (1996–2004), die zweite Generation 75/85/95/100 mit wassergekühlten Turbomotoren. Der Agroplus 100 war der erste 6-Zylinder in der Kompaktklasse. Varianten S (Schmalspur) für Wein- und Obstbau, F Keyline für schmale Arbeiten.
  agrofarm: >-
    Einstiegs-Utility-Baureihe für kleinere Betriebe. Die erste Generation 85/95/100 und 410/420/430 (2008–2013) mit Deutz-Motoren nach Tier 3, dazu die höherwertige TTV-Variante mit stufenlosem Getriebe. Ab 2018 folgte die G-Serie (85/100/115) mit modernen SDF-Motoren nach Abgasstufe V.
  agrotron-m: >-
    Premium-Baureihe der oberen Mittelklasse. M410/M420 sind 4-Zylinder, M600–M650 6-Zylinder mit Deutz-Motoren TCD 2012 / TCD 2013 und DCR-Einspritzung (Deutz Common Rail). Auch als Profiline-Variante erhältlich.
  agrotron-k: >-
    Nachfolger der kleinsten Agrotron MK3. 4-Zylinder-Traktoren mit elektronisch geregelten, wassergekühlten Deutz-Motoren. Die Version Profiline bietet automatisches Powershift, Load-Sensing-Hydraulik und Vorgewendemanagement.
  5g: >-
    Utility-Baureihe für kleine und mittlere Betriebe. Motor Deutz TCD 3,6 / 4,1 l, 4-Zylinder, Getriebe Powershift 60/60 (5 Gänge x 4 Gruppen x 3 Wendeschaltung).
  6g: >-
    Universelle Mittelklasse. Motor Deutz TCD 4,1 l / 6,1 l, Getriebe Powershift 6x6 oder RCShift 50/50 mit Wendeschaltung, optional CVT (TTV-Variante).
  9-warrior: >-
    Sonderedition Warrior der Flaggschiffbaureihe 9. LED-Beleuchtungspaket der 4. Generation, Komfortsitz Evolution Active, Klimaautomatik, DEUTZ-FAHR-Schriftzug in Schwarz. Auch im klassischen Grün erhältlich.
  6c: >-
    Kompakte 4-Zylinder-Reihe der 6 Series mit Motoren nach Abgasstufe V und der Kabine TopVision. Drei Getriebevarianten: 3-stufiges Powershift, RVshift als Volllastschaltgetriebe 20F/16R oder CVT TTV. Load-Sensing-Hydraulik mit 120 l/min, Hubkraft der Heckhydraulik 7 000 kg.
  5d: >-
    Einstiegsbaureihe mit dem Motor FARMotion 35 (3-Zylinder) nach Abgasstufe V. Elektronisches Common Rail mit 2 000 bar, Abgasrückführung, Ladeluftkühler und DOC. Zwei mechanische 5-Gang-Getriebe (15+15 oder 30+15), 40 km/h bei 1 870 min⁻¹.
  m-series-old: >-
    Die ältere Generation klassischer Schüttler-Mähdrescher vor der Modernisierung zur Topliner. Luftgekühlte Deutz-Diesel F5L / F6L der Baureihen 912 und 913. Modelle M1080, M2385, M2480, M2580, M2680, M2685, M2780 sowie M34 / M36 für große Betriebe.
  starliner: >-
    Mittlere Schüttler-Mähdrescher Starliner. Klassische 5-Schüttler-Maschinen mit direktem Riemenantrieb. Parallelgeneration zur Topliner für die kleinere Leistungsklasse.
  htc-old: >-
    Große Schüttler-Mähdrescher mit dem APS-System (Advanced Propulsion System) — Doppelbeschleunigertrommel und lange Schüttler. Zwischen den Modellen 5690 HTS und 6090 HTS war der 7545 RTS mit Rotorabscheidung der leistungsstärkste.
  topliner: >-
    Die legendären Schüttler-Mähdrescher. In den 1990er-Jahren auf dem mitteleuropäischen Markt marktbeherrschend.
  c-series-old: >-
    Mittlere und große Schüttler-Mähdrescher. Motor MTU/Deutz, Rotorabscheider.
  c-series-new: >-
    Neue Mähdrescher-Generation. Motor Deutz TCD 6,1 l und 12,0 l, Hybridsystem beim Spitzenmodell C9000 (APS + Rotor).
