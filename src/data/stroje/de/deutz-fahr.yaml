# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Deutschland / Italien"
description: >-
  Deutsche Marke mit langer Tradition seit 1864 (Deutz), 1969 Fusion mit Fahr. Teil der SDF Group (Same Deutz-Fahr) mit italienischem Anteil. Die Traktoren werden in Lauingen (Deutschland) und Treviglio (Italien) gebaut. Charakteristisch ist die grüne Lackierung. Das Flaggschiff ist die 9 Series.

categories:
  traktory: "Traktoren"
  kombajny: "Mähdrescher"

series:
  7: >-
    Premium-Baureihe mit Deutz-Motor TCD 6.1 und stufenlosem TTV-Getriebe. Design von Giugiaro. Seit Juli 2016 besteht sie aus 7230 TTV und 7250 TTV.
  8: >-
    8280 TTV (ab 2020) mit Deutz-Motor TTCD 6.1 mit Doppelaufladung und TTV-Getriebe. Die im November 2025 vorgestellte neue Serie 8 (8310 TTV und 8340 TTV) hat einen FPT-Motor N67 mit 6,7 l und die Kabine SigmaVision.
  9: >-
    Die Flaggschiffbaureihe von Deutz-Fahr, vorgestellt auf der Agritechnica 2013 und seit 2015 in Lauingen gebaut. Motor Deutz TTCD 7.8 mit zweistufiger Aufladung, stufenloses TTV-Getriebe, Maximalleistung 295–336 PS. Design von Giugiaro.
  06-series: >-
    Baureihe der grünen Deutz-Traktoren (Klöckner-Humboldt-Deutz) der späten 1960er- und der 1970er-Jahre mit luftgekühlten Deutz-Motoren der Baureihe 912. Die Modelle D 4006 bis D 13006 deckten etwa 35–120 PS ab; das Spitzenmodell D 13006 hatte den aufgeladenen Sechszylinder BF6L 912. Die Typen D 5206 bis D 7206 kamen 1974.
  dx: >-
    Der historische Klassiker von Deutz-Fahr mit luftgekühlten Deutz-Motoren F3L / F4L / F6L der Baureihen 912 und 913. Ikonische Reihe, unterteilt in die Klassen DX 3 (kompakter 3-Zylinder), DX 4 (4-Zylinder), DX 6 (6-Zylinder) und die Spitzenmodelle DX 7/8. 1983 folgte eine Modernisierung mit höherer Leistung.
  agrostar: >-
    Vorgänger der Baureihe Agrotron. Modernisierter Nachfolger der DX-Reihe mit luftgekühlten Deutz-Motoren. Der repräsentative „Star“ der 1990er-Jahre mit markantem Design und der Kabine StarCab.
  agroxtra: >-
    Die Baureihe AgroXtra knüpfte an DX 4 und AgroPrima an. Die Vierzylinder 4.47 und 4.57 hatten den aufgeladenen luftgekühlten Deutz BF4L 913 (4,1 l), die Sechszylinder 6.07 und 6.17 Saugmotoren F6L 912/913.
  agrotron-legacy: >-
    Die ikonische Agrotron-Generation. Die **MK1** (1995–1997) hatte eine revolutionär verglaste Kabine und einen Deutz-Motor mit dem problematischen ZF-Eccom-Getriebe. Die **MK2** (1997–2000) behob die Zuverlässigkeitsprobleme. Die **MK3** (2000–2003) brachte die Modelle 80–230 und **2001 den ersten Agrotron TTV** mit stufenlosem Getriebe.
  agroplus: >-
    Kompakte Universaltraktoren. Die Typen 60 und 70 mit luftgekühlten Deutz-Motoren und die Typen 75, 85, 95 und 100 mit wassergekühlten Deutz-Motoren 1012 wurden etwa 1997–2005 parallel gebaut; der Agroplus 100 hatte einen Sechszylinder. 2005–2007 ergänzten die schmalen Agroplus S 70 bis S 100 für Wein- und Obstbau das Angebot.
  agrofarm: >-
    Universaltraktoren für kleinere Betriebe. Agrofarm 85 und 100 (2007–2008) mit Deutz-Motoren, danach Agrofarm 410, 420 und 430 sowie die stufenlosen Agrofarm TTV 420 und TTV 430 (ab 2008). Die Baureihe Agrofarm G (G 85, G 100, G 115, G 410, G 430) hat SDF-Motoren 1000.4 mit 4,0 l.
  agrotron-m: >-
    Premium-Baureihe der oberen Mittelklasse. M410/M420 sind 4-Zylinder, M600–M650 6-Zylinder mit Deutz-Motoren TCD 2012 / TCD 2013 und DCR-Einspritzung (Deutz Common Rail). Auch als Profiline-Variante erhältlich.
  agrotron-k: >-
    Nachfolger der kleinsten Agrotron MK3 mit wassergekühlten Deutz-Motoren 2012: Vierzylinder (K90, K100, K120, K410, K420, K430) und Sechszylinder (K110, K610). Die Version Profiline bietet automatisches Powershift, Load-Sensing-Hydraulik und Vorgewendemanagement.
  5g: >-
    Diese Zeile fasst die Exportbaureihe 5G (5090.4 G, 5100 G, 5110 G) mit SDF-Motoren, die Deutz-Fahr außerhalb der EU anbietet, und die Modelle 5120 (2013–2016) und 5125 (ab 2016) der europäischen Serie 5 mit Deutz-Motor 3,6 l zusammen.
  6g: >-
    Serie 6 (Agrotron 6): der Vierzylinder 6140 ab 2013 und die Sechszylinder 6155–6215 mit Deutz-Motor TCD 6.1 aus der im Juli 2016 vorgestellten neuen Serie 6 (156–226 PS), Getriebe RCshift oder stufenlos TTV. Die Exportbaureihe 6G (6155 G–6205 G) ist eine andere. Heute bietet Deutz-Fahr die Nachfolger 6160–6230 sowie die Serien 6.4 und 6C an.
  9-warrior: >-
    Sonderedition Warrior der Flaggschiffbaureihe 9. LED-Beleuchtungspaket der 4. Generation, Komfortsitz Evolution Active, Klimaautomatik, DEUTZ-FAHR-Schriftzug in Schwarz. Auch im klassischen Grün erhältlich.
  6c: >-
    Kompakte 4-Zylinder-Reihe der 6 Series mit Motoren nach Abgasstufe V und der Kabine TopVision. Drei Getriebevarianten: 3-stufiges Powershift, RVshift als Volllastschaltgetriebe 20F/16R oder CVT TTV. Load-Sensing-Hydraulik mit 120 l/min, Hubkraft der Heckhydraulik 7 000 kg.
  5d: >-
    Einstiegsbaureihe mit Dreizylinder FARMotion 35 und mechanischem Getriebe 15+15 oder 30+15, max. 40 km/h. Die Leistungen im Katalog entsprechen der Version von 2018; seit 2021 wird die Stage-V-Version mit 66–102 PS Maximalleistung gebaut.
  m-series-old: >-
    Die ältere Generation klassischer Schüttler-Mähdrescher vor der Modernisierung zur Topliner. Luftgekühlte Deutz-Diesel F5L / F6L der Baureihen 912 und 913. Modelle M1080, M2385, M2480, M2580, M2680, M2685, M2780 sowie M34 / M36 für große Betriebe.
  starliner: >-
    Mittlere Schüttler-Mähdrescher Starliner. Klassische 5-Schüttler-Maschinen mit direktem Riemenantrieb. Parallelgeneration zur Topliner für die kleinere Leistungsklasse.
  htc-old: >-
    Große Schüttler-Mähdrescher mit dem APS-System (Advanced Propulsion System) — Doppelbeschleunigertrommel und lange Schüttler. Zwischen den Modellen 5690 HTS und 6090 HTS war der 7545 RTS mit Rotorabscheidung der leistungsstärkste.
  topliner: >-
    Die legendären Schüttler-Mähdrescher. In den 1990er-Jahren auf dem mitteleuropäischen Markt marktbeherrschend.
  c-series-old: >-
    Mittlere und große Schüttler-Mähdrescher. Motor MTU/Deutz, Rotorabscheider.
  c-series-new: >-
    Neue Mähdrescher-Generation. Motor Deutz TCD 6,1 l und 12,0 l, Hybridsystem beim Spitzenmodell C9000 (APS + Rotor).
