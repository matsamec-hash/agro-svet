# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Deutschland"
description: >-
  Deutsche Premiummarke, bekannt für das stufenlose Vario-Getriebe. Seit 1997 im Besitz des AGCO-Konzerns. Die Vario-Technologie debütierte 1995 und deckt heute das gesamte Programm ab — vom kleinen 200 Vario bis zum Spitzenmodell 1000 Vario. Die Mähdrescher der Baureihe IDEAL zählen zu den fortschrittlichsten der Welt.

categories:
  traktory: "Traktoren"
  kombajny: "Mähdrescher"

series:
  dieselross: >-
    Der Ursprungstraktor von Fendt — Hermann Fendt baute 1928 in der Werkstatt seines Vaters aus einem Stationärmotor und einem alten Mähwerk das erste „Dieselross“. 1937 wurde das Unternehmen als Xaver Fendt & Co. ins Handelsregister eingetragen und die Serienfertigung begann. Der luftgekühlte Einzylinder-Diesel von Deutz prägte den deutschen Dorftraktor — einfach, robust, ausgelegt auf kleine Betriebe. Die Baureihe Dieselross reichte von 6 PS (F6) bis 40 PS (F40) und endete 1958, als sie von den Baureihen Favorit, Farmer und Fix abgelöst wurde.
  favorit-classic: >-
    Die legendäre Baureihe, die Fendts Premiumposition begründete. Der Favorit 1 von 1958 war das erste Modell mit neu konstruiertem Getriebe, der Favorit 4 der erste 6-Zylinder der Marke, und der Favorit 600 LS brachte 1979 die hydrodynamische Turbomatik (geregeltes Anfahren über eine hydraulische Kupplung) zusammen mit dem voll synchronisierten TriPower-Getriebe. Das Spitzenmodell Favorit 626 LS Turbomatik mit 252 PS und dem MAN-Motor D2566 war viele Jahre der stärkste Traktor der Marke — gebaut wurden nur 66 Stück. Diese Baureihe ist der direkte Vorgänger der Favorit 500/700/800/900 der 1990er-Jahre und steht am Ursprung von Fendts Premiumruf.
  farmer-100-200: >-
    Nachfolger der Dieselross-Reihe in der kleinen und mittleren Klasse. Der klassische Farmer mit mechanischem, synchronisiertem Getriebe wurde nach der politischen Öffnung der 1960er-Jahre auch in großer Zahl in den Ostblock exportiert. 1978 wurde auf der DLG-Ausstellung die 100er-Serie in den Ausführungen S und LSA mit leicht erhöhter Leistung und der Kabine Edition vorgestellt. Der luftgekühlte Motor MWM AKD oder Deutz F3L912 stand für Zuverlässigkeit und geringen Wartungsaufwand. Die 200er-Reihe wurde später durch eine spezialisierte Kompaktbaureihe für Wein- und Obstbau ersetzt (ab 1987).
  farmer-300-400-lsa: >-
    Mittlere und größere Farmer-Klasse mit mechanischem Getriebe. Motor MWM/Deutz, synchronisiertes Getriebe 21/6 oder 24/8. Robuste Auslegung, bis heute in Kleinbetrieben und im Obstbau beliebt.
  xylon: >-
    Eine Fendt-Besonderheit — universeller Systemtraktor mit mittiger Kabine, Rückfahreinrichtung und drei Anbauräumen (front, mitte, heck). Für Kommunal- und Spezialeinsätze.
  favorit-500-c: >-
    Mechanisches Getriebe 44/44 TurboMatik, noch vor der Vario-Technologie. Motor MWM 6-Zylinder, 6,2 l.
  favorit-500-vario: >-
    **Ein historischer Meilenstein** — der erste in Serie gebaute Traktor der Welt mit stufenlosem Getriebe (CVT). Das Getriebe ML70 Vario arbeitet ohne Schaltstufen und ändert die Geschwindigkeit unbegrenzt stufenlos von 0 bis 40 km/h. Ein Bruch in der Traktorkonstruktion.
  favorit-700-vario: >-
    Die Flaggschiff-Baureihe nach Favorit 500/600. Motor MAN 6-Zylinder, 6,9 l, Getriebe ML85 Vario mit stufenloser Änderung von 0–50 km/h.
  favorit-800-vario: >-
    Große Premium-Baureihe. Motor MAN 6-Zylinder, 7,1 l, Getriebe ML100 Vario.
  favorit-900-vario: >-
    Flaggschiff-Baureihe für Großbetriebe. Motor MAN 6-Zylinder, 10,5 l, Getriebe ML150 Vario. Der erste Traktor mit Vario über 200 PS.
  200-vario: >-
    Der kleinste Fendt — die Generation Gen3 kam Ende Januar 2021 in den Verkauf (Bestellungen ab Oktober 2020) und ersetzte die ursprüngliche Baureihe von 2009 vollständig. Variante für Obstbau, Weinbau und Kommunaleinsatz (Ausführungen V/F/P). Kompakte Kabine mit FendtONE-Bedienung serienmäßig, Vario-Getriebe, Motor AGCO Power 3-Zylinder, 3,3 l, Abgasstufe V.
  300-vario-gen1: >-
    Utility-Baureihe mit Vario. Motor Deutz 4-Zylinder, 4,0 l Turbo mit Ladeluftkühler, Getriebe ML75 Vario, Kabine Visio Plus.
  300-vario-gen2: >-
    Generation S4 mit neuer Kabine Visio Cab, 7-Zoll-VarioTerminal und Tier-4-Motor AGCO Power 4,4 l.
  500-vario-gen1: >-
    Mittlere Baureihe. Motor Deutz 4-Zylinder, 4,0 l, Getriebe ML90 Vario.
  500-vario-s4: >-
    Generation S4/Gen3. Motor Deutz 4-Zylinder, 4,0 l, Abgasstufe IV/V, Kabine Visio Cab, 7-Zoll-Display, ab 2021 FendtONE Farmer Terminal.
  700-vario-gen1: >-
    Die meistverkaufte Premium-Baureihe Europas. Motor Deutz 6-Zylinder, 6,1 l, Getriebe ML120 Vario. Ikonische Auslegung.
  700-vario-s4: >-
    Generationen S4 und Gen6. Motor Deutz 6-Zylinder, 6,1 l, Abgasstufe IV/V, Kabine VisioPlus, VarioGuide-Display + TI Headland. Rekordabsätze in Mitteleuropa.
  700-vario-gen7: >-
    Komplett neue Plattform. Motor AGCO Power 7,5 l Core75 mit eHybrid-System (48-V-Generator), Getriebe Vario TA 150, Kabine FendtONE, dynamischer Antriebsstrang VarioDrive. Leistung bis 303 PS, vollständig neue Designlinie.
  800-vario-gen1: >-
    Große Row-Crop-Baureihe. Motor Deutz 6-Zylinder, 7,8 l, Getriebe ML130 Vario.
  800-vario-s4: >-
    Generationen Gen5/Gen6. Motor **Deutz TCD 6.1 l** (6-Zylinder, 6,06 l), Abgasstufe V, Kabine ProfiPlus, ConceptCab. Aktuelles Programm: 826/829/832 Vario.
  900-vario-gen2: >-
    Die 2. Generation der 900er-Baureihe. Motor MAN 6-Zylinder, 9,0 l, Getriebe ML260 Vario, Hydraulik 220 l/min, Vorderachsfederung.
  900-vario-gen3: >-
    Komplett neue Generation — MAN D3876 6-Zylinder, 9,0 l, VarioDrive, FendtONE, durchgängige Digitalisierung. Der stärkste 942 mit 415 PS ist der leistungsstärkste Vario im konventionellen Radtraktor.
  1000-vario: >-
    Der größte Fendt — komplett neue Plattform. Motor MAN D4276 6-Zylinder, 12,4 l, VarioDrive-Antrieb mit elektronisch geregelten Achsen, Getriebe TA300 Vario. Gewicht 14 t, der leistungsstärkste Radtraktor in Standardkonfiguration.
  1100-vario-mt: >-
    Raupentraktor — das Flaggschiff von Fendt. MAN-Motor, Gummiraupen MTrack, VarioDrive-Antrieb. Für große landwirtschaftliche und bauliche Einsätze.
  600-vario: >-
    Aktueller Fendt 600 Vario — Daten synchronisiert von api.fendt.com.
  900-vario-mt: >-
    Aktueller Fendt 900 Vario MT — Daten synchronisiert von api.fendt.com.
  1000-vario-gen4: >-
    Aktueller Fendt 1000 Vario Gen4 — Daten synchronisiert von api.fendt.com.
  c-series: >-
    Wirtschaftliche Baureihe der Schüttler-Mähdrescher, von Laverda (AGCO) übernommen. Geeignet für mittlere Betriebe. Motor AGCO Power 6,6 l.
  l-series: >-
    Schüttler-Mähdrescher von Laverda mit Fendt-Branding. 6-Schüttler-System, Rotor-Nachabscheider. Motor AGCO SISU Power 7,4 l.
  ideal: >-
    Revolutionäre Plattform, sieben Jahre lang gemeinsam von AGCO und dem MIT entwickelt. Zwei 600-mm-Rotoren HARVEST CORE, KI-gestützte Optimierung IDEALharvest, Bauteile aus Karbon. Die Varianten 7, 8, 9 und 10 unterscheiden sich in der Leistung. Die Raupenversionen -T schonen den Boden.
  corus-500: >-
    Aktueller Fendt CORUS 500 — Daten synchronisiert von api.fendt.com.

