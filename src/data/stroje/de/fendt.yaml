models:
  fendt-dieselross-f6: >-
    Der erste Serien-Fendt — ein Einzylinder mit 6 PS legte den Grundstein für die gesamte Marke.
  fendt-dieselross-f18: >-
    Der F18 war der erste Fendt mit unabhängiger Zapfwelle (PTO).
  fendt-dieselross-g25: >-
    Kriegsvariante mit Holzgasantrieb — während des Krieges war der Bau von Traktoren mit Flüssigkraftstoff untersagt; 1 497 Stück gebaut.
  fendt-farmer-1: >-
    Der erste Fendt mit Diesel-Direkteinspritzung — ein Durchbruch beim Wirkungsgrad kleiner Dieselmotoren.
  fendt-favorit-4: >-
    Der erste Fendt mit Sechszylindermotor.
  fendt-favorit-615-lsa: >-
    Turbomatik — hydrodynamische Kupplung für ein kontrolliertes, ruckfreies Anfahren.
  fendt-favorit-626-lsa: >-
    Damals der stärkste Fendt — nur 66 Stück gebaut.
  fendt-farmer-104-lsa: >-
    LSA = LS mit Allradantrieb.
  fendt-farmer-200: >-
    Kompakte Abmessungen für kleine Betriebe und den Einsatz im Obstbau.
