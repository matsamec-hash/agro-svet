# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Deutschland"
description: >-
  Deutscher Vorreiter der No-Till- und Mulchsaat-Technologien mit Sitz in Schwandorf (Bayern). Pneumatische Sämaschinen Pronto und Sprinter, Einzelkornsägeräte Maestro, die No-Till-Scheibensämaschine Avatar, Tiefengrubber Tiger, Zinkengrubber Terrano, Scheibeneggen Joker und Feldspritzen Leeb (gezogen sowie selbstfahrend als PT/VL).

categories:
  ochrana-rostlin: "Pflanzenschutz"
  seti: "Aussaat und Pflanzung"
  zpracovani-pudy: "Bodenbearbeitung"

series:
  leeb-ax: >-
    Leeb AX — gezogene Feldspritze für mittlere Betriebe, Nachfolgerin der Baureihe Leeb LT (4 000 und 6 000 l). Sie bietet das Gestänge BoomControl mit aktiver Dämpfung, die präzise Einzeldüsenregelung (PrecisionSpray) und das ISOBUS-Terminal SmartTouch. Ein Kompromiss zwischen Preis und der für Horsch typischen Applikationsqualität.
  leeb-gs: >-
    Leeb GS — gezogene Feldspritze großer Kapazität (6 000 und 8 000 l) für große Flächen. Das serienmäßige BoomControl Pro mit Ultraschallsensoren hält das Gestänge auch bei über 15 km/h 30–50 cm über dem Bestand. Die Innenreinigung CCS Pro erlaubt den schnellen Mittelwechsel ohne Kontamination. Gestängebreite bis 42 m.
  leeb-pt: >-
    Leeb PT — Selbstfahrspritze für Großbetriebe und Lohnunternehmen. Tank mit 6 000 oder 8 000 l, Arbeitsbreite 24–42 m. Hydropneumatische Federung von Rahmen und Achse, stufenlose Bodenfreiheitsregelung und HydroDrive-Fahrantrieb. Das Flaggschiff im Selbstfahrsegment von Horsch.
  leeb-vl: >-
    Leeb VL — Selbstfahrspritze mit größerer Bodenfreiheit (bis 165 cm) für Applikationen in hohen Beständen wie Mais, Sonnenblumen und Kartoffeln. Tank mit 5 000 oder 6 000 l, hydraulisch verstellbare Spurweite 1,80–2,25 m. Konfiguration zwischen der PT und einer High-Clearance-Spritze.
  avatar: >-
    Avatar — gezogene pneumatische Sämaschine für die Direktsaat (No-Till) in unbearbeiteten Boden und in Zwischenfrüchte. Das SingleDisc-Säschar mit bis zu 350 kg Schardruck schafft auch festes Stoppelfeld. Die Ausführung SD ist die Reihenversion mit zwei Tanks, die SL hat einen Großtank für Dünger (solo oder duo). Arbeitsbreiten 6, 8, 10 und 12 m.
  express: >-
    Express — Säkombination mit aktiver Kreiselegge (KR) oder Turbo-Scheibenegge (TD). Anbauausführung mit 3, 3,5 und 4 m für die klassische Saatbettbereitung in einer Überfahrt mit einem Traktor der Mittelklasse. Die Säschare TurboDisc 2.0 sorgen für eine exakte Kornablage.
  focus: >-
    Focus TD — gezogene Säkombination mit integriertem Tiefengrubber (TerraGrip), Düngerscharen und Säscharen TurboDisc 2.0. Strip-Till in einem Arbeitsgang: lockern, unter das Saatgut düngen und säen. Arbeitsbreiten 4 und 6 m, die Variante Focus mit PPF-Tank für Dünger.
  maestro: >-
    Maestro — Einzelkornsägerät für Mais, Sonnenblumen, Rüben und Soja mit elektrischem Dosiersystem AirVac (CV/CX) oder AirSpeed (SV/SX) bis 15 km/h. CV/SV sind die klassischen Versionen mit Zentraltank für Dünger, CX/SX haben Einzeltanks. RV ist die gezogene Ausführung mit großem PPF-Zentraltank. Arbeitsbreite 6–24 m, Reihenweiten 45/50/70/75/80 cm.
  pronto: >-
    Pronto DC — die Flaggschiff-Baureihe der pneumatischen Universalsämaschinen von Horsch. Die serienmäßige Kombination aus Frontpacker, Scheibenegge, Packerwalze und Säscharen TurboDisc 2.0 erlaubt die Aussaat in Mulch wie auch in vorbereitete Pflugfurche in einer Überfahrt. Anbauversion mit 3 m und gezogene Versionen bis 9 m, Flächenleistung 5 bis 18 ha pro Stunde.
  serto: >-
    Serto SC — gezogene pneumatische Sämaschine mit kurzer Bauweise und zweireihiger Anordnung der TurboDisc-Schare mit individuellem Schardruck von 5–120 kg. Geeignet für hohe Sägeschwindigkeiten in Mulch wie auch in Pflugfurche mit hohem Anteil an Erntereststoffen. Arbeitsbreiten 10 und 12 m.
  sprinter: >-
    Sprinter ST/NT — pneumatische Sämaschine mit federnden Zinkenscharen für die Aussaat in unbearbeitetes Stoppelfeld, flach bearbeiteten Boden oder Zwischenfrüchte. Die ST hat einen starren Rahmen mit 6 m, die NT einen klappbaren Rahmen bis 12 m bei über 12 km/h Arbeitsgeschwindigkeit. Geeignet für trockene Regionen und einfache No-Till-Verfahren.
  versa: >-
    Versa KR — pneumatische Anbausäkombination mit aktiver Kreiselegge für kleine und mittlere Betriebe. Universeller Einsatz in unterschiedlichen Bodenverhältnissen ohne separate Saatbettbereitung. Arbeitsbreiten 3 und 4 m.
  cruiser: >-
    Cruiser SL/XL — Zinkengrubber für die flache Bearbeitung von 3–15 cm mit schmalen Scharen in 5–6 Reihen bei 15 cm Strichabstand. SL ist die Anbauversion mit 5 und 6 m, XL die gezogene bis 12 m. Geeignet für die schnelle, intensive Stoppelbearbeitung nach der Ernte und die beschleunigte Rotte der Ernterückstände.
  finer: >-
    Finer SL — Saatbettkombination für ein feines Saatbett mit Feder- und Zinkenstriegeln sowie Packerwalze. Anbauversion mit 6 m Arbeitsbreite, Arbeitstiefe 2–10 cm. Sie dient vor allem der Frühjahrsvorbereitung vor der Aussaat von Zuckerrüben und Mais.
  joker: >-
    Joker CT/RT/HT — Kurzscheibenegge mit 52-cm-Scheiben in X-Anordnung für die flache Bearbeitung von 3–12 cm. CT ist die Anbauversion mit 3–6 m und starrem Rahmen, RT die gezogene mit 4–12 m und Reifenpacker, HT die gezogene mit 8–12 m und großvolumigen Reifen für höheres Tempo (bis 18 km/h). Ideal für die intensive Stoppelbearbeitung nach dem Getreidedrusch.
  terrano: >-
    Terrano FX/GX/MT — die Flaggschiff-Baureihe der Horsch-Zinkengrubber für die mitteltiefe Bearbeitung von 5–30 cm. FX (3 und 4 m, Anbau), GX (5 und 6 m, aufgesattelt gezogen) und MT (5–8 m, gezogen mit dem schnellen TerraGrip-System). Universalmaschine für Stoppelbearbeitung, tiefere Lockerung und die Saatbettvorbereitung.
  tiger: >-
    Tiger MT/AS/LT — Tiefengrubber für die intensive Bearbeitung bis 35 cm Tiefe. MT (4 und 6 m) hat TerraGrip-Zinken für maximalen Durchgang organischer Masse, AS (kombiniert, 4–8 m) ergänzt Scheiben und Packer für die vollständige Saatbettbereitung in einer Überfahrt, LT (10 und 12 m) ist die großflächige gezogene Ausführung für die größten Betriebe. Er ersetzt den Pflug in Minimalbodenbearbeitungssystemen.
