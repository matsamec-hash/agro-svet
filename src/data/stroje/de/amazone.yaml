# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Deutschland"
description: >-
  Deutscher Spezialist (Sitz Hasbergen-Gaste) für Mineraldüngerstreuer (Baureihen ZA-V, ZA-TS, ZG-TS), Feldspritzen (UF, UX, Selbstfahrer Pantera), Sämaschinen (Cataya, Centaya, Cirrus, Precea, Primera DMC) und Bodenbearbeitung (Scheibeneggen Catros/Catros XL, Zinkengrubber Cenius/Cenio, Tiefenlockerer Cobra, Kreiseleggen KE/KG/KX). Bekannt für die Technologien ArgusTwin (Streuer) und SmartSprayer (Feldspritzen).

categories:
  hnojeni: "Düngung"
  ochrana-rostlin: "Pflanzenschutz"
  seti: "Aussaat und Pflanzung"
  zpracovani-pudy: "Bodenbearbeitung"

series:
  za-v: >-
    ZA-V — angebauter Scheibenstreuer für Mineraldünger für mittlere und größere Betriebe. Arbeitsbreite 10–36 m, Behältervolumen 1 400–4 200 l je nach Aufbau. Gewichtsbasierte Mengenregelung über AMADOS+, Grenzstreuen mit BorderTS. Gutes Preis-Leistungs-Verhältnis, ideal für Betriebe von 100–500 ha. Wiegetechnik und Teilbreiten optional.
  za-ts: >-
    ZA-TS — das Flaggschiff der angebauten Streuer für die präzise Ausbringung. Arbeitsbreite bis 54 m, Volumen 1 400–4 200 l. Das System ArgusTwin überwacht den Abwurfwinkel des Düngers laufend mit vier Radarsensoren und korrigiert die Schaufelstellung für ein homogenes Streubild. AutoTS erlaubt automatisches Grenz- und Vorgewendestreuen ohne Schaufelwechsel. Geeignet für die teilflächenspezifische Ausbringung nach GPS-Karte.
  za-m: >-
    ZA-M — Anbau-Zweischeibenstreuer für Mineraldünger mit 10–36 m Arbeitsbreite. Typen ZA-M 1002 Special (1 200–1 700 l), ZA-M 1202 (1 200–2 700 l) und ZA-M 1502 (1 500–3 000 l); das Volumen wächst mit Aufsätzen. Streuwerk komplett aus Edelstahl, wartungsfreie Ölbadgetriebe mit Überlastsicherung.
  zg-ts: >-
    ZG-TS — Anhängestreuer für Mineraldünger mit dem Streusystem TS und 15–54 m Arbeitsbreite. Typen ZG-TS 7501 (7 500 l) und ZG-TS 10001 (10 000 l). Grenzstreuen mit AutoTS oder BorderTS, Teilbreitenschaltung mit bis zu 128 Teilbreiten über ISOBUS. Für große Betriebe und Lohnunternehmen.
  pantera: >-
    Pantera 4504 — Selbstfahrspritze mit 4 500 l Tank und 21–48 m Arbeitsbreite. Deutz-Sechszylinder mit 6,1 l und max. 218 PS (160 kW), stufenloser hydrostatischer Fahrantrieb bis 50 km/h. Die Version H hat eine hydraulisch verstellbare Bodenfreiheit von 1,25–1,70 m, die Version W eine breitere Spur von 2,25–3,00 m (Bodenfreiheit 1,15 m), HW verbindet beides. Die größere Pantera 7004 hat 6 600 l.
  ux: >-
    UX — gezogene Feldspritze für mittlere und große Betriebe. Tankvolumen 4 200–11 200 l, Arbeitsbreite 21–42 m. Die Version Super mit aktiver Achsschenkellenkung und ContourControl für die automatische Gestängeführung. Bedienzentrale SmartCenter mit Induktionseinspülung. Geeignet für den intensiven Getreide- und Ölfruchtanbau.
  uf: >-
    UF — Anbauspritze mit 1 002–2 002 l Tankvolumen und 12–30 m Arbeitsbreite. Kompakte Abmessungen für kleine bis mittlere Betriebe oder als Ergänzung zur Selbstfahrspritze. Bedienzentrale DC oder TC, kompatibel mit AmaSelect und AmaSwitch. Optional erhöht der Fronttank FT 1502 die Kapazität auf bis zu 3 500 l, ohne die Wendigkeit einzubüßen.
  cataya: >-
    Cataya — mechanische Anbausämaschine für die Kombination mit der Kreiselegge KE oder dem Kreiselgrubber KG. Arbeitsbreite 3,0–4,0 m, elektrisch angetriebene Dosierung (eDrive) für die teilflächenspezifische Aussaatmenge. Säschare WS (Scheiben) oder RoTeC für die Ablage unter verschiedenen Bedingungen. Die Version Special für den klassischen Einsatz, die Version Super mit Vordosierung und höherem Komfort.
  centaya: >-
    Centaya — pneumatische Aufbausämaschine mit 3,0–4,0 m Arbeitsbreite für die Kombination mit der Kreiselegge KE oder dem Kreiselgrubber KG. Typen Centaya 3000/3500/4000 in den Versionen Special und Super, Varianten -C mit geteiltem Behälter für Saatgut und Dünger. Zentraldosierung mit Verteilerkopf, ISOBUS.
  cirrus: >-
    Cirrus — Anhängesäkombination für Mulch- und konventionelle Saat mit 3–6 m Arbeitsbreite und 3 000–4 000 l Behälter. Typen Cirrus 3003 Compact, 4003 sowie die klappbaren 4003-2 und 6003-2; die Varianten -C haben einen Zweikammer-Druckbehälter für Saatgut und Dünger, -CC zusätzlich eine dritte Dosierung. Für 8–9 m bietet Amazone die Cirrus Grand 8004-2C und 9004-2C.
  precea: >-
    Precea — Einzelkornsämaschine der neuen Generation für Mais, Sonnenblumen, Rüben und weitere Reihenkulturen. Arbeitsbreite 3–6 m, Dosierung mit Vakuumturbine bis 15 km/h. Die Versionen 3000-A (Anbau), 4500-2 und 6000-2 (gezogen, zweireihig), 6000-2CC (mit Mikrogranulat) und TCC (mit Großbehälter für Dünger). FertiSpot für die punktuelle Unterfußdüngung. Sie ersetzt die alten Baureihen ED und EDX.
  primera-dmc: >-
    Primera DMC — gezogene Sämaschine, spezialisiert auf die Direktsaat (No-Till) in Mulch und Stoppel. Arbeitsbreite 6–9 m, Zinkenschare mit bis zu 130 kg Schardruck für das Eindringen in harten, trockenen Boden. Großbehälter mit 4 200–5 000 l, ISOBUS serienmäßig. Ein gefragtes Modell in trockenen Regionen und bei Betrieben mit konservierender Bodenbearbeitung.
  catros: >-
    Catros+ — Kompaktscheibenegge mit 510-mm-Scheiben für die flache Stoppelbearbeitung. Angebaute starre Typen 2503–4003 (2,5–4 m) und klappbare -2 (4–7 m), gezogene -2TS (4–7 m) und große gezogene -2TX (7–12 m). Jede Scheibe ist einzeln gummigefedert, Walzen je nach Boden wählbar.
  catros-xl: >-
    CatrosXL — Kompaktscheibenegge mit größeren 610-mm-Scheiben für die tiefere Bearbeitung und viel Ernterückstand (Mais, Sonnenblumen). Angebaute Typen 3003, 3503 und 4003, gezogene -2TS (5–8 m) und -2TX (7–8 m).
  cenius: >-
    Cenius — Zinkengrubber für Stoppelbearbeitung, Saatbettbereitung und tiefere Lockerung. Angebaute Typen 3003, 3503 und 4003 in den Versionen Special (Scherbolzen), Super (Federsicherung) und Ultra (hydraulische Überlastsicherung), gezogene Cenius-2TX mit 4–7 m Arbeitsbreite.
  cenio: >-
    Cenio — kompakter Anbaugrubber für die flache Stoppelbearbeitung. Starre Typen Cenio 3000 und 3500, klappbare Cenio 4000-2 und 5000-2; die Version Special mit starren Zinken, die Version Super mit Federsicherung für steinige Böden.
  ceus: >-
    Ceus — Kombinationsgrubber mit zwei Scheibenreihen und drei Zinkenreihen für Arbeitstiefen von 10–30 cm in einer Überfahrt. Arbeitsbreite 4–7 m, gezogene zweiachsige Bauweise. Er spart Überfahrten, weil er die separate Stoppelbearbeitung und die tiefe Lockerung ersetzt. Geeignet als Pflugalternative in pfluglosen Systemen.
  cobra: >-
    Cobra-2TX — gezogener Flachgrubber mit 6–7 m Arbeitsbreite für die ganzflächige flache Bearbeitung in 4–13 cm Tiefe bei bis zu 16 km/h. Typen Cobra 6000-2TX und 7000-2TX, Strichabstand 13,3 cm, gefederte Zinken mit Vibrationswirkung.
  kg: >-
    KG Cultimix — Anbau-Kreiselgrubber für Traktoren bis 360 PS. Starre Typen KG 3001, 3501 und 4001 in den Versionen Special und Super, klappbare KG 4002-2, 5002-2 und 6002-2 (4–6 m, bis 360 PS). Häufiger Partner der Sämaschinen Cataya, Centaya und Avant.
  ke: >-
    KE 02 Rotamix — Anbau-Kreiselegge. Starre Typen KE 02-150, 02-190 und 02-240 (2,5–4 m Arbeitsbreite, für Traktoren bis 150, 190 oder 240 PS), klappbare KE 02-2-300 und 02-2-400 (4–6 m, bis 300 und 400 PS). Die Zahl nach dem Bindestrich nennt die Leistungsfreigabe. Kombinierbar mit den Sämaschinen Cataya und Centaya.
  kx: >-
    KX — Kreiselegge für die Mittelklasse, kompakter als die KG. Arbeitsbreite 3,0 m, Traktorleistung bis 190 PS. Leichtere Bauweise, geeignet für Betriebe mit Traktoren von 100–180 PS als Kombination mit einer Sämaschine.
