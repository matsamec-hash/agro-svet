# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Deutschland"
description: >-
  Deutscher Spezialist (Sitz Hasbergen-Gaste) für Mineraldüngerstreuer (Baureihen ZA-V, ZA-TS, ZG-TS), Feldspritzen (UF, UX, Selbstfahrer Pantera), Sämaschinen (Cataya, Centaya, Cirrus, Precea, Primera DMC) und Bodenbearbeitung (Scheibeneggen Catros/Catros XL, Zinkengrubber Cenius/Cenio, Tiefenlockerer Cobra, Kreiseleggen KE/KG/KX). Bekannt für die Technologien ArgusTwin (Streuer) und SmartSprayer (Feldspritzen).

categories:
  hnojeni: "Düngung"
  ochrana-rostlin: "Pflanzenschutz"
  seti: "Aussaat und Pflanzung"
  zpracovani-pudy: "Bodenbearbeitung"

series:
  za-v: >-
    ZA-V — angebauter Scheibenstreuer für Mineraldünger für mittlere und größere Betriebe. Arbeitsbreite 10–36 m, Behältervolumen 1 400–4 200 l je nach Aufbau. Gewichtsbasierte Mengenregelung über AMADOS+, Grenzstreuen mit BorderTS. Gutes Preis-Leistungs-Verhältnis, ideal für Betriebe von 100–500 ha. Wiegetechnik und Teilbreiten optional.
  za-ts: >-
    ZA-TS — das Flaggschiff der angebauten Streuer für die präzise Ausbringung. Arbeitsbreite bis 54 m, Volumen 1 400–4 200 l. Das System ArgusTwin überwacht den Abwurfwinkel des Düngers laufend mit vier Radarsensoren und korrigiert die Schaufelstellung für ein homogenes Streubild. AutoTS erlaubt automatisches Grenz- und Vorgewendestreuen ohne Schaufelwechsel. Geeignet für die teilflächenspezifische Ausbringung nach GPS-Karte.
  za-m: >-
    ZA-M — die Einstiegsbaureihe der angebauten Streuer mit 10–36 m Arbeitsbreite und 1 000–3 000 l Volumen. Einfache Bauweise mit mechanischer oder hydraulischer Schieberbetätigung. Geeignet für kleinere Betriebe und den Kommunaleinsatz (Parkdüngung, Salzstreuen im Winter). Das preislich günstigste Modell im Programm.
  zg-ts: >-
    ZG-TS — gezogener Großflächenstreuer für den anspruchsvollsten Einsatz. Volumen 5 500–10 500 l, Arbeitsbreite bis 54 m mit ArgusTwin und AutoTS. Gefedertes hydraulisches Fahrwerk, Teilbreitenschaltung für die teilflächenspezifische Ausbringung nach GPS. Ausgelegt auf Betriebe über 500 ha und Lohnunternehmen. ISOBUS Section Control in Verbindung mit der Traktornavigation möglich.
  pantera: >-
    Pantera — Selbstfahrspritze mit 4 500 l Tank und 24–40 m Arbeitsbreite. Die Version H hat ein hydropneumatisches Fahrwerk mit 1,25 m Bodenfreiheit, die Version W eine größere Bodenfreiheit für Applikationen in hohen Beständen (Mais, Sonnenblumen). Deutz-Sechszylinder mit 218 PS (4503) oder 250 PS (4504). Hydrostatischer Allradantrieb, GPS-Navigation und die Teilbreitenschaltung AmaSwitch sind inklusive. Optional AmaSelect für den Düsenwechsel während der Fahrt.
  ux: >-
    UX — gezogene Feldspritze für mittlere und große Betriebe. Tankvolumen 4 200–11 200 l, Arbeitsbreite 21–42 m. Die Version Super mit aktiver Achsschenkellenkung und ContourControl für die automatische Gestängeführung. Bedienzentrale SmartCenter mit Induktionseinspülung. Geeignet für den intensiven Getreide- und Ölfruchtanbau.
  uf: >-
    UF — Anbauspritze mit 1 002–2 002 l Tankvolumen und 12–30 m Arbeitsbreite. Kompakte Abmessungen für kleine bis mittlere Betriebe oder als Ergänzung zur Selbstfahrspritze. Bedienzentrale DC oder TC, kompatibel mit AmaSelect und AmaSwitch. Optional erhöht der Fronttank FT 1502 die Kapazität auf bis zu 3 500 l, ohne die Wendigkeit einzubüßen.
  cataya: >-
    Cataya — mechanische Anbausämaschine für die Kombination mit der Kreiselegge KE oder dem Kreiselgrubber KG. Arbeitsbreite 3,0–4,0 m, elektrisch angetriebene Dosierung (eDrive) für die teilflächenspezifische Aussaatmenge. Säschare WS (Scheiben) oder RoTeC für die Ablage unter verschiedenen Bedingungen. Die Version Special für den klassischen Einsatz, die Version Super mit Vordosierung und höherem Komfort.
  centaya: >-
    Centaya — pneumatische Anbausämaschine mit 3,0–4,0 m Arbeitsbreite für die Kombination mit der Kreiselegge KE/KG oder dem Kreiselgrubber KX. Zentraldosierung mit Verteilerkopf, Säschare TwinTeC mit bis zu 70 kg Schardruck für die zuverlässige Ablage in hartem Boden. Die Version Super mit Vordosierung für das gleichmäßige Anfahren am Vorgewende, ISOBUS serienmäßig. Die Centaya 6000-2 Super (Variante 2C) ist die gezogene zweireihige Version mit 6 m Arbeitsbreite für Großbetriebe.
  cirrus: >-
    Cirrus — gezogene Universalsäkombination für Mulchsaat wie auch konventionelle Aussaat. Arbeitsbreite 3–9 m, Scheibenschare TwinTeC mit geringerem Zugkraftbedarf und bis zu 50 kg Schardruck. Die Versionen 02 (einfach), 2C (zwei Behälter für Saatgut und Dünger zur Unterfußdüngung) und 2CC (zusätzlich mit Mikrogranulat). Die aktuelle Generation 9004-2C und 6004-2C löste die älteren Modelle 9003-2 ab. ISOBUS, Teilbreitenschaltung und GPS für die variable Aussaatmenge.
  precea: >-
    Precea — Einzelkornsämaschine der neuen Generation für Mais, Sonnenblumen, Rüben und weitere Reihenkulturen. Arbeitsbreite 3–6 m, Dosierung mit Vakuumturbine bis 15 km/h. Die Versionen 3000-A (Anbau), 4500-2 und 6000-2 (gezogen, zweireihig), 6000-2CC (mit Mikrogranulat) und TCC (mit Großbehälter für Dünger). FertiSpot für die punktuelle Unterfußdüngung. Sie ersetzt die alten Baureihen ED und EDX.
  primera-dmc: >-
    Primera DMC — gezogene Sämaschine, spezialisiert auf die Direktsaat (No-Till) in Mulch und Stoppel. Arbeitsbreite 6–9 m, Zinkenschare mit bis zu 130 kg Schardruck für das Eindringen in harten, trockenen Boden. Großbehälter mit 4 200–5 000 l, ISOBUS serienmäßig. Ein gefragtes Modell in trockenen Regionen und bei Betrieben mit konservierender Bodenbearbeitung.
  catros: >-
    Catros — Kurzscheibenegge für die flache Stoppelbearbeitung in 5–12 cm Tiefe. Arbeitsbreite 3–12 m, 510-mm-Scheiben in X-Anordnung mit Einzelaufhängung. Wartungsfreie Lagerung, Walzen wahlweise (Stab-, Zahn-, Gummi- oder Doppelwalze). Die Versionen 2TX (gezogen, zweiachsig) und 2TS (gezogen für große Arbeitsbreiten mit Fahrwerk). Geeignet für Stroh, Raps und Zwischenfrüchte.
  catros-xl: >-
    Catros XL — die Version mit größeren 610-mm-Scheiben für die tiefere Bearbeitung bis 15 cm und besseres Eindringen in harten Boden. Arbeitsbreite 3–9 m, höherer Scheibendruck zum Schneiden voluminöser Ernterückstände (Mais, Sonnenblumen). Empfohlen für die erste Stoppelbearbeitung nach der Ernte oder für Gründüngung mit hoher Masse.
  cenius: >-
    Cenius — Zinkengrubber für mittlere Tiefen von 5–30 cm. Arbeitsbreite 3–8 m, dreibalkiger Rahmen mit 28,5 cm Strichabstand. Wahlweise Überlastsicherung C-Mix Shear (Scherbolzen) oder Cenius Super (Schraubenfeder für steinige Bedingungen). Universalmaschine für Stoppelbearbeitung, Saatbettvorbereitung und tiefere Lockerung. Die Version 2TX ist die gezogene zweiachsige Ausführung ab 4 m Arbeitsbreite.
  cenio: >-
    Cenio — kompakter angebauter Zinkengrubber, 2022 als Einstiegsmodell unterhalb der Cenius vorgestellt. Arbeitsbreite 3–4 m, vierbalkiger Rahmen mit Scharen für die flache Stoppelbearbeitung von 5–15 cm. Die Version Special mit starren Scharen, die Version Super mit der Federsicherung C-Mix Pro für steinige Böden. Geeignet für kleine und mittlere Betriebe.
  ceus: >-
    Ceus — Kombinationsgrubber mit zwei Scheibenreihen und drei Zinkenreihen für Arbeitstiefen von 10–30 cm in einer Überfahrt. Arbeitsbreite 4–7 m, gezogene zweiachsige Bauweise. Er spart Überfahrten, weil er die separate Stoppelbearbeitung und die tiefe Lockerung ersetzt. Geeignet als Pflugalternative in pfluglosen Systemen.
  cobra: >-
    Cobra — Tiefenlockerer zum Aufbrechen verdichteter Unterbodenschichten bis 40 cm Tiefe. Arbeitsbreite 3 m, sieben schmale Zinken mit geringem Zugkraftbedarf. Er schont die Oberflächenstruktur — er lockert die tiefe Schicht, ohne die Horizonte zu vermischen. Empfohlen für langjährig pfluglos bewirtschaftete Böden oder nach der Zuckerrübenernte.
  kg: >-
    KG — leistungsstarker Kreiselgrubber für Traktoren von 130–360 PS. Arbeitsbreite 3,0–6,0 m, Sechskantgetriebe, Rotoren mit Schnellwechselzinken QuickChange. Die Versionen 2 (KG 4001-2, KG 6001-2) sind für große Arbeitsbreiten klappbar. Der ideale Partner für Centaya/Cataya bei der Kombisaat.
  ke: >-
    KE — Kreiselegge für die mittlere Leistungsklasse (bis 200 PS). Arbeitsbreite 3,0–4,0 m, die klassische Lösung für die Kombination mit den Sämaschinen Cataya oder Centaya. Die Version Special mit Schiebergetriebe, die Version Super mit Pendelaufhängung und integrierter Walze. Die Bezeichnung 190 steht für ein Getriebe bis 190 PS.
  kx: >-
    KX — Kreiselegge für die Mittelklasse, kompakter als die KG. Arbeitsbreite 3,0 m, Traktorleistung bis 190 PS. Leichtere Bauweise, geeignet für Betriebe mit Traktoren von 100–180 PS als Kombination mit einer Sämaschine.
