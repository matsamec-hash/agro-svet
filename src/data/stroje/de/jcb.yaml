# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Großbritannien"
description: >-
  Britisches Familienunternehmen für Bau- und Landmaschinen, gegründet von Joseph Cyril Bamford. Für die Landwirtschaft baut JCB die ikonischen Teleskoplader Loadall (vom kompakten 525-60 bis zum Heavy-Duty-560-80), die kompakten knickgelenkten Telemaster TM, die kompakten Radlader der 400er-Reihe sowie die einzigartigen Schnellläufer-Traktoren Fastrac mit gefedertem Fahrwerk und 70 km/h Reisegeschwindigkeit.

categories:
  manipulace: "Handling und Verladung"
  traktory: "Traktoren"

series:
  compact-wheel-loader: >-
    Kompakte Radlader von JCB aus der 400er-Reihe für die Arbeit auf dem Hof, am Futtertisch und in engen Stallbereichen. Sie bieten dank flacher Motorhaube eine sehr gute Sicht, einen kleinen Wendekreis und einen Knickrahmen für das Manövrieren auf engem Raum. Die Modelle von 2,6 t (403) bis 10,3 t (417) decken Betriebe jeder Größe ab.
  loadall-525: >-
    Der kompakteste Loadall — Teleskoplader mit nur 1,84 m Breite und 1,9 m Höhe, ideal für niedrige Ställe und enge Durchfahrten. Tragkraft 2,5 t und 6 m Hubhöhe decken das übliche Handling von Ballen, Paletten und Futter ab. Charakteristisch ist die 360°-Sicht aus der Kabine CommandPlus dank des tief links neben dem Fahrer liegenden Auslegers.
  loadall-527: >-
    Kompakter Loadall für mittlere Betriebe — höhere Tragkraft von 2,7 t als beim 525 bei weiterhin kompakten Abmessungen und sehr guter Sicht. Hubhöhe 5,8 m und die niedrige Transporthöhe machen den 527-58 zur beliebten Maschine für ältere Ställe und Gebäude mit niedrigen Durchfahrten.
  loadall-532: >-
    Mittlerer Loadall mit 3,2 t Tragkraft — die meistverkaufte Größe der Baureihe, verfügbar mit zwei Auslegerlängen (6 m und 7 m). Geeignet für die meisten landwirtschaftlichen Arbeiten: Ballen, Futter, Mistladen, Palettieren. Erhältlich in den Ausstattungslinien Agri, Agri Plus, Agri Super, Agri Pro und Agri Xtra, je nach Anspruch an Getriebe und Komfort.
  loadall-536: >-
    Mittelgroßer Loadall mit 3,6 t Tragkraft — beliebt bei mittleren und größeren Betrieben wegen der höheren Hubkraft bei weiterhin mittleren Abmessungen. Verfügbar mit 6-m- und 7-m-Ausleger und in verschiedenen Ausstattungslinien vom Basismodell Agri bis zum Agri Pro mit DualTech-VT-Getriebe.
  loadall-538: >-
    Kompakter Loadall mit der höchsten Tragkraft der Reihe von 3,8 t bei weiterhin kompakten Abmessungen (Breite unter 2,3 m). Verfügbar mit 6-m- und 7-m-Ausleger; die Ausstattungslinie Agri Plus ergänzt eine komfortablere Kabine und zusätzliche Hydraulikfunktionen. Eine beliebte Größe für Milchviehbetriebe mit Futtermischwagen.
  loadall-542: >-
    Heavy-Duty-Loadall mit 4,2 t Tragkraft und 7 m Hubhöhe — der Einstieg in die schwere Klasse. Verfügbar in den Top-Ausstattungen Agri Pro (DualTech-VT-Getriebe), Agri Super (hydrostatisch) und Agri Xtra (Powershift) für Einsätze vom klassischen Ackerbaubetrieb bis zum Transportunternehmen.
  loadall-550: >-
    Heavy-Duty-Loadall mit 5 t Tragkraft und 8,1 m Hubhöhe — ausgelegt auf große Betriebe, Genossenschaften und Lohnunternehmen. Er stapelt Ballen bis in die achte Lage und belädt auch die höchsten Silagewagen. Verfügbar in den Ausstattungen Agri Pro (DualTech VT) und Agri Super (hydrostatisch).
  loadall-555: >-
    Heavy-Duty-Loadall mit extralangem 9,5-m-Ausleger und 5,5 t Tragkraft — speziell für hohe Fahrsilos, das Hochstapeln von Ballen und die Beladung hoher Behälter. Die größte Hubhöhe der Loadall-Baureihe.
  loadall-560: >-
    Der Spitzen-Loadall mit 6 t Tragkraft und 8,1 m Hubhöhe — der größte und stärkste Agrar-Teleskoplader im JCB-Programm. Ausgelegt auf die schwersten Anwendungen: Beladen von Getreideanhängern, Handling schwerer Biomasseballen und Lohnarbeit. Ausschließlich in der Ausstattung Agri Pro mit DualTech-VT-Getriebe erhältlich.
  loadall-tm: >-
    Telemaster — die knickgelenkten Teleskoplader von JCB, ein Hybrid aus Radlader und Teleskoplader. Die Knicklenkung bringt extreme Wendigkeit in engen Ställen, der Teleskopausleger zusätzliche Reichweite in die Höhe. Ideal für Milchviehbetriebe mit schmalen Futtergängen. Die Modelle TM 220, TM 320 und TM 420 decken Tragkräfte von 2,1 bis 4,1 t ab.
  fastrac-2000: >-
    Die zweite Generation der wegweisenden Schnellläufer-Traktoren JCB Fastrac mit mittig angeordneter Kabine, Vorder- und Hinterachsfederung und ABS-Bremsen — ein Konzept, das eher an einen Lkw als an einen klassischen Traktor erinnert. Die Reisegeschwindigkeit von 75 km/h veränderte die Logistik der Betriebe grundlegend, weil die Maschine Feldarbeit und Straßentransport mit Lkw-Tempo erledigte. Die Modelle 2115, 2125, 2135 und 2155 (später 2150 und 2170) hatten Cummins-Sechszylinder mit 115–170 PS. Vorgänger der heutigen Baureihen Fastrac 4000/8000.
  fastrac-4000: >-
    Die mittlere Leistungsklasse der Schnellläufer-Traktoren Fastrac (160–235 PS) mit voll gefedertem Fahrwerk (Luftfederung vorn und hinten), Vierradlenkung und 60 km/h Reisegeschwindigkeit. Die symmetrische Bauweise mit mittiger Kabine bringt eine Gewichtsverteilung von 50/50, Doppelbremsanlage und eine Ladefläche hinter der Kabine für Anbaugeräte. Eine Besonderheit am Markt — der einzige Traktor, der sich auch für den Straßentransport mit Pkw-Tempo eignet.
  fastrac-8000: >-
    Die Flaggschiff-Baureihe Fastrac mit 290–348 PS und einer Rekordreisegeschwindigkeit von 70 km/h — der schnellste Serientraktor der Welt. Stufenloses Getriebe, Vollfederung und 18 t Nutzlast für Anbaugeräte machen den 8000 zur idealen Maschine für Lohnunternehmen, die Feldarbeit und den Transport von Silage über größere Entfernungen kombinieren. Die limitierte Edition Iconic würdigt die Geschichte des Fastrac.

