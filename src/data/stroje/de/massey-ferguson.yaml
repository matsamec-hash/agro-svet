# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Kanada / USA"
description: >-
  Traditionsreiche kanadisch-amerikanische Marke, 1953 aus der Fusion von Massey-Harris (Kanada, 1847) und Ferguson (Großbritannien, 1933) entstanden. Seit 1994 Teil des AGCO-Konzerns. Die Traktoren werden in Beauvais (Frankreich) gebaut, die Mähdrescher in Breganze (Italien) und Hesston (USA). Bekannt für das Dreieckslogo und die Baureihennummerierung (3000, 4700, 5M, 5S, 6S, 7S, 8S, 9S). Die Schlüsselinnovation **Ferguson System** (Dreipunkt-Hubwerk, 1933) prägte alle modernen Traktoren.

categories:
  traktory: "Traktoren"
  kombajny: "Mähdrescher"

series:
  100: >-
    Die wichtigste Massey-Ferguson-Baureihe der 1960er- und 1970er-Jahre. Die Modelle 130, 135, 148, 165, 175, 178, 185 und 188 verbanden das Ferguson-Hydrauliksystem mit Perkins-Motoren; gebaut wurden sie in Großbritannien und Frankreich. Heute sind sie gesuchte Oldtimer.
  "200": >-
    Über lange Zeit erfolgreiche Utility-Baureihe. Perkins-Motoren als 3- und 4-Zylinder. Sie löste die 100er-Reihe ab und wurde später von der 300 Series ersetzt.
  300: >-
    Nachfolger der 200 Series, gebaut in Coventry (1986–1997), Perkins-Motoren mit 3, 4 und 6 Zylindern. Die Modelle 3610–3690 in dieser Liste gehören zur eigenständigen Baureihe MF 3600 aus Beauvais (1987–1995).
  "500": >-
    Klassische Utility-Baureihe der 1970er- und 80er-Jahre. Gebaut in Coventry (Großbritannien). Motor Perkins 4-Zylinder, mechanisches Getriebe Multi-Power.
  1000: >-
    Große Row-Crop-Traktoren vor allem für den nordamerikanischen Markt (1964–1978), gebaut in Detroit; der MF 1080 entstand auch in Frankreich. Perkins-Motoren mit 4 und 6 Zylindern, die stärksten Versionen mit Perkins-V8.
  "3000": >-
    Umfangreiche Baureihe mittlerer und stärkerer Traktoren. Perkins-Motoren als 4- und 6-Zylinder, Getriebe Speedshift.
  3700: >-
    Schmale Spezialtraktoren für Obst- und Weinbau (MF 3707–3710, Versionen V, S, F, GE und WF), vorgestellt im November 2017. Motor AGCO Power 3,4 l, 4 Zylinder, 75–105 PS.
  "4200": >-
    Umfassende Utility-Baureihe für kleine und mittlere Betriebe. Motor Perkins 1000 Series als 3- und 4-Zylinder, bei höheren Varianten mit Turbolader. Synchronisiertes Getriebe 12/12.
  "4300": >-
    Modernisierte Utility-Baureihe. Motor Perkins 900 und 1000 Series, Getriebe Speedshift mit elektrohydraulischer Wendeschaltung. Geräuscharme Kabine.
  4700: >-
    Universaltraktoren MF 4707–4710. Motor AGCO Power 3,3 l, 3 Zylinder (auf einigen Märkten außerhalb Europas 4,4 l, 4 Zylinder), Getriebe 12×12, bei der europäischen 4700 M auch Dyna-2.
  "5400": >-
    Universelle Mittelklasse. Motor Perkins 1100 als 4- und 6-Zylinder, Powershift-Getriebe Dyna-4 und Dyna-6. Kabine Tech-Platform.
  "5600": >-
    Kompakte Universalbaureihe. Kurzer Radstand bei den 3-Zylinder-Modellen (5608–5610), langer Radstand bei den 4-Zylindern (5611–5613). Motor AGCO Power, Getriebe Dyna-4.
  5700: >-
    MF 5700 M (5709 M–5713 M), vorgestellt auf der Agritechnica im November 2019: Motor AGCO Power 4,4 l, 4 Zylinder, Stufe V, Getriebe 12×12 oder Dyna-4. Die ältere europäische MF 5700 / 5700 SL ist eine andere Baureihe.
  6400: >-
    MF 6400 (2003–2013): Motoren Perkins 4,4, 6,0 und 6,6 l sowie SisuDiesel 6,6 und 7,4 l, Getriebe Dynashift und Dyna-6. Das stufenlose Dyna-VT hatte die parallele Baureihe 7400. Nachfolger war die MF 6600.
  "6600": >-
    Zwischengeneration zwischen 6400 und 6700. Motor AGCO Power 4,9 l (4-Zylinder) und 6,6 l (6-Zylinder), Getriebe Dyna-4, Dyna-6 oder Dyna-VT (CVT). Abgasstufe IIIB / Tier 4i.
  6700: >-
    MF 6700 S, vorgestellt im September 2016: Motor AGCO Power 4,9 l, 4 Zylinder, Getriebe Dyna-6 oder stufenlos Dyna-VT, mit EPM bis 200 PS (MF 6718 S). In Europa wurde sie 2021 von der MF 6S abgelöst.
  "7400": >-
    Premium-Row-Crop mit dem Motor Perkins / Sisu / AGCO Power 6,6 l und 7,4 l als 6-Zylinder, Getriebe Dyna-6 Powershift oder Dyna-VT (CVT) — die Generation mit der breitesten Leistungsspanne für mitteleuropäische Betriebe. Abgelöst von der 7600 / 7700.
  "7600": >-
    Modernisierung der 7400 Series mit dem Motor AGCO Power 6,6 l und 7,4 l als 6-Zylinder nach Abgasstufe IIIB. Getriebe Dyna-6 oder Dyna-VT (CVT). Vorgängerin der 7700 Series.
  7700: >-
    MF 7700 (ab 2015) und 7700 S: Motoren AGCO Power 6,6 l (7715 S–7720 S) und 7,4 l (7722 S–7726 S), Getriebe Dyna-6 oder stufenlos Dyna-VT. In Europa wurde sie 2021 von der MF 7S abgelöst.
  8100: >-
    Baureihe MF 8100 (1995–1999), Nachfolger der MF 3600: Sechszylindermotoren und Dynashift-Getriebe, 135–230 PS. Abgelöst von der Baureihe 8200.
  "8200": >-
    Weitere Generation der großen Traktoren mit aktualisiertem Perkins-Sechszylinder, dem Getriebe Dynashift Plus und integrierter elektronischer Hubwerksregelung. Leistungen von **160–260 PS**.
  8400: >-
    Baureihe MF 8400 (2003–2008) mit stufenlosem Dyna-VT und Sisu-Motoren mit 7,4 l (8450, 8460) und 8,4 l (8470, 8480). Das erste Dyna-VT bei MF hatte 2003 die Baureihe 7400. Nachfolger war die Baureihe 8600.
  "8600": >-
    Row-Crop-Flaggschiff vor der 8700. Motor AGCO Sisu Power 8,4 l, 6-Zylinder mit e3-SCR-Technologie (selektive katalytische Reduktion — eine Premiere im Segment der Großtraktoren). Getriebe Dyna-VT. Leistungen von **270–370 PS**.
  8700: >-
    MF 8700 S: Flaggschiffbaureihe mit Motor AGCO Power 8,4 l und stufenlosem Dyna-VT-Getriebe. Eingeführt 2017, der letzte Traktor wurde im Januar 2025 gebaut; Nachfolger ist die MF 9S (vorgestellt im November 2023).
  6100-6200: >-
    Mittlerer Row-Crop. Die 6100 (1995–1999) ersetzte die 3000 Series, die 6200 (1999–2002) war deren Evolution. Motor Perkins 1000 Series als 4- und 6-Zylinder, Getriebe Dynashift 32/32.
  5s: >-
    Neue Utility-Baureihe mit dem Motor AGCO Power 4,4 l (4-Zylinder), dem Powershift-Getriebe Dyna-4 und der auf maximale Sicht ausgelegten Kabine Visio. Red Dot Design Award 2022.
  6s: >-
    Leistungsstarke Mittelklasse mit dem Motor AGCO Power 4,9 l, 4-Zylinder (die höchste Leistung aus einem Vierzylinder am Markt). Getriebe Dyna-6 oder Dyna-VT (CVT).
  7s: >-
    Nachfolgerin der 7700 S. Motor AGCO Power 6,6 l, 6-Zylinder, Getriebe Dyna-6 oder Dyna-VT (CVT). EPM (Engine Power Management) mit +30 PS.
  8s: >-
    Premium-Row-Crop. Motor AGCO Power 7,4 l, 6-Zylinder, Getriebe Dyna-VT (CVT) mit Dynamic Tractor Management. Kabine Protect-U mit isolierter Bauweise.
  9s: >-
    Flaggschiffbaureihe, Nachfolger der 8700 S, vorgestellt auf der Agritechnica im November 2023. Motor AGCO Power 8,4 l, 6 Zylinder, Getriebe Dyna-VT (CVT), Kabine Protect-U. Sechs Modelle mit 285–425 PS.
  5m: >-
    MF 5M, Nachfolger der 5700 M, vorgestellt im November 2024: Motor AGCO Power 4,4 l, 4 Zylinder, Getriebe Dyna-4, 95–145 PS.
  30-series-old: >-
    Historische Baureihe der Schüttler-Mähdrescher von Dronningborg/MF. Klassisches Schüttler-Dreschwerk, Motor Perkins/Sisu 6-Zylinder.
  cerea: >-
    Gehobene Klasse der Schüttler-Mähdrescher, gebaut in Dronningborg (Dänemark). APS-Rotor und 5 Schüttler. Motor SisuDiesel 6-Zylinder.
  activa: >-
    Mittlere Schüttler-Mähdrescher. Motor AGCO Sisu Power 6,6 l, 6-Zylinder, 5 Schüttler.
  beta: >-
    Gehobene Klasse der Schüttler-Mähdrescher. Rotor APS Plus.
  delta: >-
    Hybridsystem aus APS und Rotor. Motor AGCO Power 7,4 l.
  ideal-mf: >-
    Gemeinsame Plattform mit dem Fendt IDEAL. Die Varianten 7, 8 und 9 laufen unter der Marke MF im AGCO-Netz.
  activa-s: >-
    Modernisierung der Activa mit 5 Schüttlern. Motor AGCO Power 6,6 l, 6-Zylinder, Dreschtrommel Power Flow, Strohhäcksler V-Inox. Die Einstiegsklasse der MF-Schüttlermaschinen für mittelgroße Betriebe. Modelle 7340 S, 7344 S, 7345 S.
  beta-s: >-
    Gehobene Klasse der Schüttler-Mähdrescher mit 5 Schüttlern und dem System APS (Accelerated Pre-Separation). Motor AGCO Power 7,4 l, 6-Zylinder, größerer Korntank und höherer Durchsatz als die Activa S.
  delta-s: >-
    Premium-Hybridmähdrescher — Kombination aus APS-Rotor und Schüttlern. Motor AGCO Power 9,8 l, 6-Zylinder, Getriebe ParaLevel bei den Hangausgleichsvarianten. Die Spitzenklasse im konventionellen MF-Programm vor dem Erscheinen der IDEAL.

