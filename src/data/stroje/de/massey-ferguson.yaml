models:
  massey-ferguson-130: >-
    Das kleinste Modell der 100 Series, gebaut in Frankreich.
  massey-ferguson-135: >-
    Einstiegsmodell und Bestseller der Baureihe — über 350 000 Stück gebaut. In der Tschechoslowakei einer der häufigsten westlichen Traktoren in den Genossenschaften.
  massey-ferguson-165: >-
    Mittelklasse der Baureihe. Perkins-Vierzylinder, beliebt für Pflugarbeit und Transport.
  massey-ferguson-188: >-
    Spitzenmodell der Baureihe 100 — Perkins-Vierzylinder mit 4,1 l.
