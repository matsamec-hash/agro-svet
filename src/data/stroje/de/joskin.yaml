# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Belgien"
description: >-
  Belgischer Spezialist für Güllefässer und landwirtschaftliche Anhänger. Fässer Modulo 2, Quadra, Komfort 2, Volumetra, X-Trem, Cargo und EuroLiner, Anhänger Trans-CAP, Trans-KTP, Trans-SPACE, Trans-EX und Drakkar, Ausbringtechnik Pendislide, Pendiwing, Solodisc und Multitwist sowie Stalldungstreuer Tornado3, Ferti-CAP und Siroko.

categories:
  doprava: "Transport"
  hnojeni: "Düngung"

series:
  drakkar: >-
    Der Drakkar ist ein Großraum-Abschiebewagen für Silage, Anwelksilage, Getreide und Hackschnitzel. Das robuste Fahrgestell mit Tandem- oder Tridemachse bewältigt bis zu 38 m³ Volumen und 30 t Nutzlast. Der hydraulisch angetriebene Kettenförderer erlaubt eine schnelle und schonende Entladung ohne Anheben der Brücke — ideal für niedrige Hallen und Biogasanlagen. Luftgefederte Achsen und hydraulische Lenkung sorgen auch bei höherem Tempo für Stabilität.
  trans-cap: >-
    Der Trans-CAP ist ein Dreiseitenkipper der Mittelklasse für den universellen Einsatz auf dem Betrieb. Das hydraulische Kippen zu drei Seiten erlaubt bequemes Abladen auch auf engem Raum. Die Brücke besteht aus hochfestem HARDOX-Stahl und ist für Getreide, Rüben, Kartoffeln und organische Dünger ausgelegt. Druckluftgebremste Achsen und Nutzfahrzeugbereifung sichern den Straßentransport ab.
  trans-ktp: >-
    Der Trans-KTP ist ein Heckkipper in Heavy-Duty-Ausführung für die schwersten Transportaufgaben in Landwirtschaft und Bauwesen. Die Monocoque-Brücke aus 6 mm HARDOX-Blech hält Steinen, Schotter und gefrorenem Boden stand. Die Tridemachse mit selbstlenkender letzter Achse reduziert den Reifenverschleiß und erhöht die Wendigkeit. Die hydraulische Heckklappe mit automatischer Öffnung beschleunigt das Abladen.
  trans-space: >-
    Der Trans-SPACE ist ein Großraumwagen mit beweglicher Stirnwand für die maximale Ausnutzung des Laderaums. Der ebene Boden und die glatten Aluminiumwände minimieren Rückstände und erleichtern die Reinigung. Die hydraulisch angetriebene Stirnwand schiebt die Ladung nach und nach heraus, was Material und Maschine schont. Ideal für Silage, Anwelksilage, Kartoffeln und Zuckerrüben.
  trans-ex: >-
    Der Trans-EX ist ein wirtschaftlicher Kipper der Einstiegsklasse für kleine und mittlere Betriebe. Die ein- oder zweiachsige Variante ist auf niedrige Anschaffungskosten bei erhaltener Joskin-Qualität ausgelegt. Das hydraulische Kippen nach hinten oder zu drei Seiten deckt die üblichen Transportaufgaben ab. Die Bordwände lassen sich leicht demontieren, um den Wagen als Plateauwagen zu nutzen.
  euroliner: >-
    Der EuroLiner ist ein Fernverkehrs-Abschiebewagen für den Straßentransport von Silage und Hackschnitzeln zwischen Betrieben und Biogasanlagen. Der aerodynamische Aluminiumaufbau senkt Gewicht und Verbrauch. Die luftgefederte Tridemachse erlaubt den legalen Straßentransport mit bis zu 60 km/h. Der langsam laufende Schubboden schont Boden und Ketten.
  cargo: >-
    Das Cargo ist ein kompaktes Güllefass für kleine und mittlere Betriebe mit 2 700 bis 7 100 Litern. Die einachsige Bauweise mit niedrigem Schwerpunkt erlaubt die Arbeit in Hanglagen. Serienmäßig sind die Joskin-Kreiselpumpe und ein selbstansaugendes System für die schnelle Befüllung. Das Fass ist mit dem gesamten Joskin-Ausbringprogramm kompatibel, inklusive Pendislide und Solodisc.
  ferti-cap: >-
    Der Ferti-CAP ist ein kompakter Stalldungstreuer mit Vertikalstreuwerk für die gleichmäßige Verteilung von Mist, Kompost oder Gärresten. Der robuste Boden aus HARDOX 450 hält abrasiven Materialien stand. Die hydraulisch geregelte Kratzbodengeschwindigkeit erlaubt eine exakte Dosierung in kg/ha. Die Arbeitsbreite von 6–12 m passt zu kleinen und mittleren Betrieben.
  komfort-2: >-
    Das Komfort 2 ist ein Güllefass der Mittelklasse mit Fokus auf Bedienkomfort und einfache Wartung. Ein zentrales Hydraulikpaneel fasst alle Bedienelemente an einer Stelle zusammen. Druckluftbremsen und eine luftgefederte Pendeldeichsel dämpfen Stöße bei der Feldarbeit. Zur Serienausstattung gehört eine Vakuumpumpe von Battioni oder die Joskin-Kreiselpumpe.
  modulo-2: >-
    Das Modulo 2 ist das Flaggschiff-Güllefass von Joskin mit modularer Bauweise und Volumina von 4 500 bis 18 000 Litern. Der verzinkte Stahlbehälter mit 6 mm Wandstärke widersteht auch aggressivster Gülle über Jahrzehnte. Tandem- oder Tridemachse mit Luftfederung erlauben schnellen Straßentransport. Das breite Programm an Ausbringtechnik (Pendislide, Pendiwing, Solodisc, Multitwist) macht es zur Universallösung für jeden Betrieb.
  pendislide: >-
    Das Pendislide ist ein Schleifschuhverteiler für die exakte Gülleablage direkt am Boden zwischen den Pflanzen. Die Stahlkufen am Ende jedes Schlauchs teilen den Bestand und legen die Gülle direkt auf die Bodenoberfläche, was Ammoniakverluste minimiert. Hydraulisch klappbare Ausleger sorgen für kompakte Transportmaße. Geeignet für Mais, Getreide und Dauergrünland.
  pendiwing: >-
    Das Pendiwing ist ein flexibler Schleppschlauchverteiler mit teleskopierbaren Auslegern für eng- wie weitreihige Kulturen. Das patentierte System TerraFlex folgt Bodenunebenheiten automatisch und sorgt für gleichmäßige Ausbringung. Der Pulsator hält den Durchfluss in allen Schläuchen konstant und verhindert Verstopfungen. Ideal für schmale Schläge, Obstanlagen und unebene Flächen.
  quadra: >-
    Das Quadra ist ein vierachsiges Heavy-Duty-Güllefass für die größten Betriebe und Lohnunternehmen. Der Stahlbehälter mit bis zu 28 000 Litern ruht auf vier gelenkten Achsen für minimale Bodenverdichtung. Zwei Paare gelenkter Achsen (vorn und hinten) machen die Maschine auch voll beladen manövrierfähig. Serienmäßig mit Turbo-Füllarm und bis zu 12 000 l/min Förderleistung.
  siroko: >-
    Der Siroko ist ein universeller Stalldungstreuer mit Horizontalstreuwerk und bis zu 18 m Arbeitsbreite. Die hydraulisch regelbare Kratzbodengeschwindigkeit erlaubt eine exakte Dosierung von 5 bis 60 t/ha. Die robuste Bauweise aus HARDOX 450 bewältigt Mist, Kompost, Hühnertrockenkot und Gärreste. Das optionale ISOBUS-Terminal ermöglicht GPS-Teilbreitenschaltung zur Düngereinsparung.
  solodisc: >-
    Das Solodisc ist ein Scheibeninjektor, der die Gülle mit Injektionsscheiben flach in den Boden einarbeitet und damit die Ammoniakemissionen drastisch senkt. Jede Scheibe ist einzeln gefedert und folgt so dem Bodenrelief. Hydraulisch klappbare Ausleger halten die Transportbreite unter 3 m. Ideal für Stoppelfelder, Stoppelbearbeitung und Ausbringungen im Sinne der EU-Nitratrichtlinie.
  multitwist: >-
    Der Multitwist ist ein Drehverteiler für Schleppschlauchsysteme und sorgt für einen gleichmäßigen Durchfluss in allen Schläuchen. Das patentierte System mit rotierendem Messer zerkleinert Feststoffe und verhindert Verstopfungen. Die robuste Gusskonstruktion hat Wartungsintervalle von über 5 000 Hektar. Kompatibel mit allen Joskin-Fässern Modulo 2, Komfort 2 und Volumetra.
  tornado3: >-
    Der Tornado3 ist die dritte Generation des Flaggschiff-Stalldungstreuers, wahlweise mit Vertikal- oder Horizontalstreuwerk. Die maximale Nutzlast von 24 Tonnen und bis zu 24 m Arbeitsbreite machen ihn zur leistungsstärksten Maschine seiner Klasse. Die hydraulische Brücke mit Schubboden besteht aus 8 mm HARDOX. ISOBUS mit automatischer GPS-Teilbreitenschaltung erlaubt die teilflächenspezifische Ausbringung nach Applikationskarte.
  volumetra: >-
    Das Volumetra ist ein Großraum-Güllefass mit 12 000 bis 30 000 Litern für große Betriebe und Lohnunternehmen. Die luftgefederte Tridemachse mit durchgehender Lenkung sorgt auch mit vollem Behälter für Wendigkeit. Serienmäßig gehört ein Turbo-Füllarm mit Positionsspeicher dazu. Der verzinkte 6-mm-Stahlbehälter widersteht aggressivster Gülle und Gärresten über Jahrzehnte.
  x-trem: >-
    Das X-Trem ist das leistungsstärkste Fass im Joskin-Programm für die anspruchsvollsten Ausbringungen auf Großbetrieben und bei Lohnunternehmen. Volumina über 30 000 Liter in Verbindung mit dem vierachsigen Heavy-Duty-Fahrwerk erlauben bis zu 200 ha Ausbringung pro Tag. Das patentierte System TridemAxle mit unabhängiger Lenkung aller drei Achsen minimiert Fahrspuren im Feld. Optional mit GPS-Spurführung und Teilbreitenschaltung für die vollautomatische Ausbringung.
