# DE overlay (Prosa-Felder) über der cs-Struktur. Markt: Deutschland + Österreich.

country: "Frankreich"
description: >-
  Französischer Marktführer bei Teleskopladern und Ladern für die Landwirtschaft. Die Flaggschiff-Baureihe MLT NewAg (Heavy-Duty-Teleskoplader mit 6–10 m Hubhöhe und 2,5–6 t Tragkraft) bietet eine Premiumkabine, die Telematik EasyManager und Motoren nach Abgasstufe V mit 75–160 PS. Die Kompaktbaureihe MT-X richtet sich an kleine Betriebe, die knickgelenkten MLA-T an Stallarbeiten, dazu kommen die Radlader MAC und die Kompaktlader R/RT für den universellen Einsatz.

categories:
  manipulace: "Handling und Verladung"

series:
  mlt-625: >-
    MLT 625 — der Einstieg in die Heavy-Duty-Teleskoplader der NewAg-Baureihe. Max. Hubhöhe 6,1 m, Tragkraft 2,5 t. Motor mit 75 PS nach Abgasstufe V, hydrostatisches Getriebe, NewAg-Kabine mit Panoramasicht. Geeignet für kleine bis mittlere Betriebe beim Umgang mit Strohballen, Futter und Palettenware.
  mlt-730: >-
    MLT 730 — kompakter Heavy-Duty-Teleskoplader der NewAg-Reihe mit 7 m Hubhöhe und 3 t Tragkraft. Erhältlich mit 115 PS (D — Direct Drive) und 130 PS (PS+ — Powershift). NewAg-Kabine, JSM-Joystick, EasyManager-Telematik. Universelle Maschine für mittlere Betriebe und Genossenschaften.
  mlt-737: >-
    MLT 737 — Heavy-Duty-Teleskoplader der NewAg-Reihe mit 7 m Hubhöhe und höherer Tragkraft von 3,7 t für anspruchsvolleres Handling von Großballen und Mist. Motor mit 130 PS nach Abgasstufe V, Powershift-Getriebe PS+, NewAg-Kabine. Beliebt auf großen Milchviehbetrieben.
  mlt-840: >-
    MLT 840 — Heavy-Duty-Teleskoplader der NewAg-Reihe für große Betriebe. Max. Hubhöhe 7,55 m, Tragkraft 4 t, Motor mit 145 PS nach Abgasstufe V mit Powershift PS+. NewAg-Kabine mit luftgefedertem Sitz, EasyManager-Telematik, geeignet für den anspruchsvollen Ganztageseinsatz und den Futtertisch.
  mlt-940: >-
    MLT 940 — Spitzenmodell der Heavy-Duty-Teleskoplader der NewAg-Reihe mit 9 m Hubhöhe und 4 t Tragkraft. Hydrostatisches Vario-Getriebe V+, Motor mit 140 PS nach Abgasstufe V, Premium-NewAg-Kabine. Ideal für das Stapeln großer Ballen, das Befüllen von Trögen und das Handling in großen Lagern.
  mlt-961: >-
    MLT 961 — besonders schwerer Teleskoplader der NewAg-Reihe mit 6 t Tragkraft und 9 m Hubhöhe für den härtesten Betrieb. Motor mit 145 PS nach Abgasstufe V mit Vario+-Getriebe, verstärkte Hubkinematik. Für das Stapeln voluminöser Ballen und das Handling schwerer Paletten in Biogas- und Kompostanlagen.
  mlt-1041: >-
    MLT 1041 — das Flaggschiff der Heavy-Duty-Teleskoplader der NewAg-Reihe mit einer Rekordhubhöhe von 9,65 m und 4,1 t Tragkraft. Motor mit 145 PS nach Abgasstufe V, Powershift PS+, Premium-NewAg-Kabine. Für große Betriebe, die bis in die obersten Lagen von Stapeln und Silos reichen müssen.
  mt-x-420: >-
    MT-X 420 — kompakter Teleskoplader für kleine Betriebe und beengte Verhältnisse. Max. Hubhöhe 4,3 m, Tragkraft 2 t, Breite unter 1,8 m für die Durchfahrt in niedrigen Ställen. Motor mit 75 PS, hydrostatisches Getriebe, einfache Bedienung für die tägliche Hofarbeit.
  mt-x-625: >-
    MT-X 625 — kompakter Teleskoplader mit 6 m Hubhöhe und 2,5 t Tragkraft für mittlere Betriebe mit Fokus auf Wendigkeit. Motor mit 75 PS nach Abgasstufe V, hydrostatisches Getriebe, Vierradlenkung mit Diagonal- und Hundegangmodus.
  mt-x-730: >-
    MT-X 730 — Topmodell der Kompaktbaureihe MT-X mit 7 m Hubhöhe und 3 t Tragkraft. Motor mit 75 PS nach Abgasstufe V, hydrostatischer Antrieb, kompakte Abmessungen für niedrige Ställe und enge Durchfahrten. Die ideale Kombination aus Reichweite und Wendigkeit für mittelgroße Betriebe.
  mac-50: >-
    MAC 50 — kompakter Radlader für die Landwirtschaft mit 5 t Tragkraft und über 3 m Kipphöhe. Motor nach Abgasstufe V, hydrostatisches Getriebe, Kabine mit Panoramasicht. Geeignet für das Laden von Mist, Futter und Schüttgütern auf dem Hof.
  mac-60: >-
    MAC 60 — die größere Variante des kompakten Radladers MAC mit 6 t Tragkraft. Höhere Kipphöhe und größeres Schaufelvolumen, Motor nach Abgasstufe V mit hydrostatischem Getriebe. Für mittlere und große Betriebe mit regelmäßigem Handling voluminöser Materialien.
  mla-t-516: >-
    MLA-T 516 — knickgelenkter Teleskoplader für die Landwirtschaft mit 1,6 t Tragkraft und 5 m Hubhöhe. Er verbindet die Vorteile eines Hofladers (Wendigkeit, kleiner Radius) mit dem Teleskopauszug. Motor nach Abgasstufe V, hydrostatischer Antrieb, ideal für die Arbeit in engen Ställen.
  mla-t-533: >-
    MLA-T 533 — der stärkste knickgelenkte Teleskoplader mit 3,3 t Tragkraft und 5 m Hubhöhe. Varianten PS+ (Powershift) und V+ (Vario-Hydrostat) mit 130 oder 145 PS nach Abgasstufe V. Kabine mit JSM-Joystick, EasyManager-Telematik. Geeignet für große Ställe und Futtertische.
  rr-13: >-
    RR 13 — kompakter Kompaktlader mit 1,3 t Tragkraft für die Arbeit in engen Ställen und Wirtschaftsgebäuden. Motor nach Abgasstufe V, Vertikalhub, breites Anbaugeräteprogramm (Schaufeln, Gabeln, Kehrbesen). Ideal für die tägliche Reinigung und das Futterhandling.
  rr-16: >-
    RR 16 — mittelgroßer Kompaktlader mit 1,6 t Tragkraft und Vertikalhub. Motor nach Abgasstufe V, robuste Bauweise, kompatibel mit dem gesamten Manitou-Anbaugeräteprogramm. Geeignet für mittlere Betriebe mit täglichem Handling voluminöser Materialien.
  rr-18: >-
    RR 18 — Topmodell der Kompaktlader-Baureihe RR mit 1,8 t Tragkraft. Höhere Motorleistung, robuster Rahmen und Vertikalhub für maximale Reichweite. Für große Betriebe und den universellen Einsatz mit schweren Anbaugeräten (Kehrbesen, Schneeschild, Ballengabeln).
  mrt: >-
    MRT (Manitou Roto) — die Flaggschiff-Baureihe der Rotationsteleskoplader mit um 360° drehbarem Oberwagen, erstmals 1981 vorgestellt. Eine einzigartige Kombination aus Teleskoplader und Mobilkran: Reichweite bei den Spitzenmodellen über 30 m, Tragkraft 4,5–7 t, volle Drehung des Auslegers ohne Umsetzen der Maschine. Die aktuelle Generation MRT-X / MRT Vision+ bietet fortgeschrittene Stabilisierung, die Telematik Manitou EasyManager, eine mitdrehende Kabine und Motoren nach Abgasstufe V. Eine Profimaschine, die vor allem im Bauwesen, in großen Lagern und bei speziellen Handling-Aufgaben in der Landwirtschaft eingesetzt wird — eine Alternative zum Mobilkran bei begrenztem Platzangebot.

# Popisy jednotlivých modelů (model.slug → DE text). V základních datech
# jsou česky a overlay je jinak nepokrývá — bez tohohle bloku svítila na
# /de/stroje/<značka>/<řada>/<model>/ česká věta pod německým nadpisem.
models:
  mrt-1440: >-
    Einstiegsmodell der Roto-Baureihe mit 14 m Reichweite und 4 t Tragkraft — für Bau und Lager, wo ein klassischer starrer Teleskoplader nicht ausreicht.
  mrt-1840: >-
    Mittelgroßer Rotationsteleskoplader mit 18 m Reichweite, bei Bauunternehmen für anspruchsvollere Höhenarbeiten beliebt.
  mrt-2150: >-
    Universeller Profi-Roto mit 21 m Reichweite und 5 t Tragkraft, 145 PS Stage V, Premiumkabine Vision+.
  mrt-2470: >-
    Heavy-Duty-Rotationsteleskoplader mit rekordverdächtigen 7 t Tragkraft und 24 m Reichweite, 170 PS — für die anspruchsvollsten Bau- und Industrieanwendungen.
  mrt-3050: >-
    Flaggschiff der Roto-Baureihe mit 30 m Reichweite und 5 t Tragkraft — eine Alternative zum Mobilkran für Baustellen und spezielle Handlingaufgaben.
  mrt-3060: >-
    Der stärkste MRT mit 30 m Reichweite und 6 t Tragkraft — die beste Kombination aus Reichweite und Kapazität im Segment der Rotationsteleskoplader.
