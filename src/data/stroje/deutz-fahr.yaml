            power_hp: 95
            power_kw: 70
            engine: "Deutz 4-válec turbo"
          - slug: deutz-fahr-agroplus-100
            name: "Agroplus 100"
            year_from: 2001
            year_to: 2010
            power_hp: 99
            power_kw: 74
            engine: "Deutz 6-válec"
            overview: >
              Nejvyšší model řady Agroplus s výkonem kolem 99 koní, v koncepci motor
              Deutz a komponenty SAME. Univerzál pro střední hospodářství k těžšímu
              nářadí, nakladači a transportu. Běžně k mání na trhu ojetin.
            reliability: >
              Motor Deutz je solidní; hlášené problémy míří na pohon všech kol a spojku
              4WD u manuálních verzí. Pozdější kusy jsou spolehlivější.
            common_faults:
              - issue: "Namáhaná spojka pohonu všech kol u manuálních verzí 4WD"
                note: "Opakovaně praská; velký pozor u verzí s ručním řazením náhonu."
              - issue: "Chybové hlášení pohonu 4WD"
                note: "Prověřit, zda se náhon skutečně sepne."
              - issue: "Prasklé palivové potrubí u raných kusů"
                note: "Novější mají zesílené; u starých ověřit výměnu."
              - issue: "Přehřívání při zaneseném chladicím okruhu"
                note: "Kontrolovat termostat a žebrování."
            pros:
              - "Výkonný motor Deutz"
              - "Univerzálnost na střední farmu"
              - "Solidní tažná síla"
              - "Dobrá dostupnost dílů"
            cons:
              - "Křehčí spojka 4WD u manuálních verzí"
              - "Elektronické neduhy náhonu"
              - "Komponenty SAME"
              - "Dětské nemoci raných kusů"
            for_whom: >
              Vhodný pro střední farmu chtějící silnější univerzál za rozumnou cenu;
              klíčové je vyhnout se opotřebené manuální spojce 4WD a prověřit náhon.
          - slug: deutz-fahr-agroplus-s70
            name: "Agroplus S70 (specialty)"
            year_from: 2008
            year_to: 2015
            power_hp: 70
            power_kw: 52
          - slug: deutz-fahr-agroplus-s75
            name: "Agroplus S75 (specialty)"
            year_from: 2008
            year_to: 2015
            power_hp: 75
            power_kw: 56
          - slug: deutz-fahr-agroplus-s90
            name: "Agroplus S90 (specialty)"
            year_from: 2008
            year_to: 2015
            power_hp: 90
            power_kw: 66
          - slug: deutz-fahr-agroplus-s100
            name: "Agroplus S100 (specialty)"
            year_from: 2008
            year_to: 2015
            power_hp: 97
            power_kw: 71
            overview: >
              Úzkorozchodný speciál z řady Agroplus F/V/S, určený do vinic a sadů.
              Štíhlá stavba (šířka kolem 1,3 metru) z něj dělá manévrovatelný stroj do
              řádků, přitom s plnohodnotným výkonem kolem 90 koní a motorem Deutz.
              Na běžném poli je méně univerzální, na trhu ojetin vzácnější.
            reliability: >
              Sdílí ústrojí s běžnou řadou Agroplus (motor Deutz a komponenty SAME),
              takže platí obdobné slabiny (spojka 4WD, elektronika). Jako specializovaný
              stroj bývá méně vytížený, ale opotřebení řízení a náprav z práce v řádcích
              je vhodné hlídat.
            common_faults:
              - issue: "Slabiny spojky a pohonu 4WD sdílené s řadou Agroplus"
                note: "Prověřit funkci náhonu."
              - issue: "Opotřebení řízení a předních náprav z práce v úzkých řádcích"
                note: "Sadařské nasazení zatěžuje řízení; kontrolovat vůle."
            pros:
              - "Úzký rozměr do vinic a sadů"
              - "Plnohodnotný výkon v kompaktu"
              - "Dobrá manévrovatelnost"
              - "Mokré brzdy a náhon 4WD"
            cons:
              - "Úzké určení = pro běžné pole méně univerzální"
              - "Sdílené neduhy řady Agroplus"
              - "Na trhu ojetin vzácnější"
            for_whom: >
              Vhodný pro vinaře a ovocnáře, kteří potřebují úzký, ale plně výkonný traktor
              do řádků; méně vhodný pro univerzální polní nasazení.

