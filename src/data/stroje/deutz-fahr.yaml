slug: deutz-fahr
name: Deutz-Fahr
country: Německo / Itálie
founded: 1864
website: https://www.deutz-fahr.com
wikipedia: https://en.wikipedia.org/wiki/Deutz-Fahr
wikidata: https://www.wikidata.org/wiki/Q645697
description: >
  Německá značka s dlouhou tradicí od roku 1864 (Deutz), fúze s Fahr 1969. Součást SDF Group
  (Same Deutz-Fahr) s italskou součástí. Traktory vyráběné v Lauingenu (Německo) a Treviglio
  (Itálie). Výrazné zelené zbarvení. Silná pozice v řadě 5G a 6G v ČR, vlajkový je 9 Series.

categories:
  traktory:
    name: Traktory

    series:
      # ========== 06 Series (historické, 1968-1981) ==========
      - slug: 06-series
        name: "06 Series (1968–1981)"
        year_from: 1968
        year_to: 1981
        description: >
          Ikonická řada zelených traktorů Deutz konce 60. a 70. let — nejvýznamnější komerční úspěch
          značky s více než 600 000 vyrobenými kusy globálně. Celá řada využívala vzduchem chlazené
          dieselové motory Deutz F3L / F4L / F6L / F8L / F10L (513 a 413), což dělalo traktory
          nezávislé na chladicí kapalině — výhoda v oblastech s extrémním klimatem. V ČSSR a zemích
          RVHP byly hojně dováženy jako prémiová alternativa k Zetorům, oblíbené pro jednoduchou
          údržbu a spolehlivost. Modely D 4006, D 4506, D 5206, D 6206, D 6806, D 7206, D 7506,
          D 8006, D 9006, D 10006 a vlajková D 13006 pokrývaly výkon od 40 do 160 hp.
        models:
          - slug: deutz-d-4006
            name: "Deutz D 4006"
            year_from: 1968
            year_to: 1974
            power_hp: 40
            power_kw: 30
            engine: "Deutz F3L 812 3-válec vzduchem chlazený 2.8 L"
          - slug: deutz-d-4506
            name: "Deutz D 4506"
            year_from: 1968
            year_to: 1974
            power_hp: 45
            power_kw: 33
            engine: "Deutz F3L 912 3-válec vzduchem chlazený"
          - slug: deutz-d-5206
            name: "Deutz D 5206"
            year_from: 1971
            year_to: 1980
            power_hp: 51
            power_kw: 37
            engine: "Deutz F3L 912, 3-válec vzduchem chlazený"
            overview: >
              Historický traktor řady D 06 od Klöckner-Humboldt-Deutz, lehká až střední
              třída kolem 50 koní. Ve své době mimořádně rozšířený a robustní stroj.
              Dnes patří do veteránské a hobby kategorie — oblíbený jako druhý traktor
              na dvůr, k vleku a pro sběratele řady 06.
            reliability: >
              Vzduchem chlazený motor řady 912 je jednoduchý a odolný; bez kapalinového
              okruhu odpadá zamrzání i přehřívání od netěsností. Při základní údržbě
              velmi spolehlivý.
            common_faults:
              - issue: "Pomalejší reakce hydrauliky"
                note: "Bolest nájezdů řady; kontrolovat čerpadlo a těsnění zvedacího ústrojí."
              - issue: "Zanesené chladicí žebrování válců"
                note: "Řadový rys vzduchem chlazených Deutzů; při ucpání hrozí lokální přehřátí, nutná čistota."
              - issue: "Horší studené starty pod −5 °C"
                note: "Typické pro starší vzduchem chlazené motory; počítat s předehřevem a dobrou baterií."
            pros:
              - "Jednoduchá a odolná vzduchem chlazená koncepce"
              - "Snadná a levná svépomocná údržba"
              - "Výborná dostupnost dílů řady 06"
              - "Nezávislý vývodový hřídel"
            cons:
              - "Hlučnost vzduchem chlazeného motoru"
              - "Nízká maximální rychlost"
              - "Skromný komfort dle dnešních měřítek"
            for_whom: >
