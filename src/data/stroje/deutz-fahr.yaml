            year_from: 1996
            year_to: 2004
            power_hp: 70
            power_kw: 52
            engine: "Deutz 4-válec 4.1 L vzduchem chlazený"
          - slug: deutz-fahr-agroplus-75
            name: "Agroplus 75"
            year_from: 2001
            year_to: 2010
            power_hp: 75
            power_kw: 56
            engine: "Deutz 4-válec turbo"
            overview: >
              Kompaktní univerzál s výkonem 75 koní z řady Agroplus (od roku 2001),
              stavěné společně se značkou SAME (motor Deutz, řada komponent SAME).
              Praktický menší farmářský traktor k nakladači, vleku a lehčí polní práci.
              Běžně dostupný na trhu ojetin.
            reliability: >
              Motor Deutz je solidní; kritika míří na komponenty SAME (převodovka,
              elektronika). První série byly problematičtější, pozdější kusy jsou
              vyladěnější — doporučuje se preferovat novější sérii.
            common_faults:
              - issue: "Chybující snímač rychlosti"
                note: "Elektronika hlásí chybu a pípá (umlčí až vypnutí motoru), typicky v teple; ověřit funkci."
              - issue: "Ložiska výkyvných blatníků"
                note: "Náchylná k poruše, kontrolovat."
              - issue: "Těžší řazení první rychlosti"
                note: "Přičítáno převodovce SAME."
              - issue: "Koroze a neduhy úplně prvních sérií"
                note: "U nejstarších kusů zvýšená ostražitost."
            pros:
              - "Spolehlivý motor Deutz"
              - "Kompaktní obratný rozměr vhodný k nakladači"
              - "Dobrý poměr cena/výkon"
              - "Hospodárný provoz"
            cons:
              - "Komponenty SAME vnímané jako slabší"
              - "Elektronické neduhy"
              - "Problematičtější první série"
            for_whom: >
              Vhodný pro menší a střední farmu hledající obratný univerzál k nakladači;
              při koupi preferovat novější sérii a prověřit elektroniku.
