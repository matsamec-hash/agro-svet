      # ========== Agroplus (2001-2015, kompaktní utility) ==========
      - slug: agroplus
        name: "Agroplus (1996–2015)"
        year_from: 1996
        year_to: 2015
        description: >
          Kompaktní utility traktory založené na technice SAME. První generace 60/70/80
          se vzduchem chlazenými Deutz motory (1996–2004), druhá generace 75/85/95/100
          s vodou chlazenými turbo motory. Agroplus 100 byl první 6-válec v kompaktní třídě.
          Varianty S (specialty úzké) pro vinařství a sadařství, F Keyline pro úzké práce.
