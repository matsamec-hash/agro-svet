slug: hovezi
name: Велика рогата худоба
name_plural: Породи великої рогатої худоби
description: >
  Огляд порід великої рогатої худоби, що утримуються у Чеській Республіці та Європі. Молочні,
  м’ясні, комбіновані та малочисельні регіональні породи. Дані містять інформацію про походження,
  вагу, молочну продуктивність і основні племінні ознаки.
