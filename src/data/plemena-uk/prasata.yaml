    description: >
      Дикий предок усіх свійських свиней. У Чехії вільно живе як об'єкт полювання, а також
      утримується у вольєрах і на фермах для виробництва дичини. М'ясо темне, пісне, з виразним
      смаком — цінна сировина для ресторанів і мисливських ковбас. Схрещування зі свійською свинею
