    body: >
      <h2>Біле батьківське порідне — чеська батьківська лінія</h2>

      <p><strong>Біле батьківське порідне</strong> (скорочено BO) — це чеська батьківська лінія,
      виведена

      з <a href="/plemena/prasata/bile-uslechtile/">білого високопродуктивного свиня</a> з акцентом
      на

      м’ясистість і щодобовий приріст. Внесена до племінної книги SCHP ČR у Чехії та слугує
      альтернативою

      <a href="/plemena/prasata/pietrain/">Pietrain</a> для тваринників, які віддають перевагу білим
      поросятам

      і уникають галогенової генетики.</p>


      <h3>Це не те саме, що біле високопродуктивне</h3>

      <p>Зверніть увагу: якщо ви шукаєте материнське <strong>чеське біле високопродуктивне
      свиня</strong> (Large White,

      плідність і молочність), перейдіть на окрему сторінку

      <a href="/plemena/prasata/bile-uslechtile/">Біле високопродуктивне свиня</a>. Біле батьківське
      порідне —

      це, навпаки, <strong>відокремлена батьківська лінія</strong>, орієнтована на м’ясну
      продуктивність.</p>
    faq:
