          приріст.
      - q: Для чого використовується біле батьківське порідне?
        a: >
          Як батьківська (термінальна) лінія у гібридних господарствах — забезпечує нащадків
          м’ясистістю. Це чеська альтернатива Pietrain з перевагою білого поросяти та без
          галогенової генетики.
