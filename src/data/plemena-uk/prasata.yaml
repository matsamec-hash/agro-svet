    image_license: Synthetic — illustrative only
    body: >
      <h2>Чеська біла унікальна свиня — найпоширеніша материнська порода</h2>

      <p><strong>Чеська біла унікальна свиня</strong> (скорочено ЧБУ, міжнародно Large White або
      Yorkshire) — це вітчизняна селекційна популяція найпоширенішої у світі білої породи, яка є
      основою майже всіх комерційних гібридних ліній у Чехії. Породу виведено з середини XIX
      століття в англійському Йоркширі та введено до чеських господарств як <strong>материнську
      лінію</strong>.</p>


      <h3>Властивості та використання</h3>

      <p>Характеризується білою шерстю, рожевою шкірою та напівстоячими вухами; кнури досягають
      близько 350 кг, свиноматки — приблизно 270 кг. Порода вирізняється <strong>високою
      плодючістю</strong> (12–14 поросят у приплоді), чудовими материнськими якостями та гарною
      швидкістю росту. У гібридних програмах формує прабатьківську лінію, найчастіше у поєднанні з
      <a href="/plemena/prasata/landrasa/">landrace</a>.</p>


      <h3>Біла унікальна vs. біла батьківська</h3>

      <p>Чеська біла унікальна свиня — це <strong>материнська</strong> порода (плодючість,
      молочність). Не плутайте її з похідною <a href="/plemena/prasata/bile-otcovske/">білою
      батьківською породою</a>, яка, навпаки, є батьківською лінією, орієнтованою на м’ясистість і
      добовий приріст. Інші породи дивіться у <a href="/plemena/prasata/">каталозі свиней</a>.</p>
    faq:
      - q: Що таке чеська біла унікальна свиня?
        a: >
          Це вітчизняна селекційна популяція породи Large White (Yorkshire) — найпоширенішої у світі
          білої материнської породи. У Чехії є основою комерційних гібридних ліній завдяки високій
          плодючості та чудовим материнським якостям.
      - q: Яка різниця між білою унікальною та білою батьківською свинею?
        a: >
          <strong>Біла унікальна</strong> — це материнська порода (плодючість, молочність), а <a
          href="/plemena/prasata/bile-otcovske/">біла батьківська</a> — це похідна батьківська
          лінія, орієнтована на м’ясистість і добовий приріст.
      - q: Скільки поросят має свиноматка білої унікальної свині?
        a: >
          Зазвичай 12–14 поросят у приплоді. Висока плодючість — головна причина, чому порода формує
          материнську (прабатьківську) лінію гібридних господарств.
