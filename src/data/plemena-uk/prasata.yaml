slug: prasata
name: Свійська свиня
name_plural: Породи свиней
description: >
  Огляд порід свиней, які утримуються в Чеській Республіці та Європі. Материнські породи (Bílé
  ušlechtilé, Česká landrasa) складають основу поголів'я, батьківські лінії (Pietrain, Duroc,
  Hampshire) забезпечують м'язистість і якість м'яса. Набір даних містить інформацію про походження,
  вагу, плодючість і основні племінні ознаки, включаючи чеську автохтонну породу Přeštické
  černostrakaté.
