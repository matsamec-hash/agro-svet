    wikipedia: https://cs.wikipedia.org/wiki/Prase_divok%C3%A9
    wikidata: https://www.wikidata.org/wiki/Q58697
    image_url: /images/plemena/prasata/divoke-prase.webp
    image_credit: Valentin Panzirsch
    image_license: CC BY-SA 3.0 at
    image_source_url: https://commons.wikimedia.org/wiki/File:Wildschwein,_N%C3%A4he_Pulverstampftor.jpg
    body: >
      <h2>Дика свиня (дикун) — первісний предок свійських свиней</h2>

      <p><strong>Дика свиня</strong> (<em>Sus scrofa</em>), у народі <strong>дикун</strong> або

      «дика свиня», є диким видом, від якого шляхом одомашнення походять усі

      <a href="/plemena/prasata/">свійські породи свиней</a>. У мисливській термінології називається

      <strong>чорна дичина</strong>. У Чехії належить до найпоширенішої копитної дичини, і її
      чисельність постійно зростає.</p>


      <h3>Як розпізнати дику свиню</h3>

      <p>Дикуна вирізняє темно-коричнева до чорної щетиниста шерсть, характерна гребенеподібна спина
      та

      витягнутий рило. Самці досягають близько 200 кг, самки приблизно 130 кг. Від свійської свині
      відрізняється

      масивнішою передньою частиною тіла, коротшими ногами та виразними іклами у дорослих
      самців.</p>


      <h3>Утримання та виробництво дичини</h3>

      <p>Окрім вільноживучої популяції, дику свиню утримують у вольєрах і на фермах для виробництва

      <strong>дичини</strong> — темного, пісного м'яса з виразним смаком, цінного у гастрономії та

      мисливських ковбасах. Схрещування зі свійською свинею (так званий «канець-дикун») дає

      спеціалізовані продукти. Якщо шукаєте племінних тварин або дичину,

      <a href="/bazar/?category=zvirata&amp;q=divok%C3%A9%20prase">перегляньте пропозиції в Agro
      bazaru</a>.</p>
    faq:
      - q: Як науково називається дика свиня?
        a: >
          Наукова (атласна) назва — <strong>дика свиня</strong>, латинською <em>Sus scrofa</em>. У
          розмовній мові використовують форму «дика свиня» або <strong>дикун</strong>, у мисливстві
          — «чорна дичина». Це один і той самий вид — дикий предок свійських свиней.
      - q: Скільки важить дика свиня?
        a: >
          Дорослий самець дикуна досягає приблизно 200 кг, самка — близько 130 кг. Маса залежить від
          віку, місцевості та наявності корму.
      - q: Чи можна утримувати дику свиню на фермі?
        a: >
          Так. Дику свиню утримують у вольєрах і на фермах для виробництва дичини. Утримання
          регулюється мисливськими та ветеринарними правилами; м'ясо (дичина) темне, пісне й
          затребуване ресторанами та виробниками мисливських ковбас.
