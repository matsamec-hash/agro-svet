    wikidata: https://www.wikidata.org/wiki/Q12048096
    image_url: /images/plemena/prasata/prestice-cernostrakate.webp
    image_credit: Roy147
    image_license: CC BY-SA 3.0
    image_source_url: >-
      https://commons.wikimedia.org/wiki/File:P%C5%99e%C5%A1tick%C3%A9_%C4%8Dernostrakat%C3%A9_prase,_ZOO_Plze%C5%88.JPG
    body: >
      <h2>Пшештіцька чорно-строката свиня — єдина автохтонна чеська порода</h2>

      <p><strong>Пшештіцька чорно-строката свиня</strong> (заводське скорочення PC, у народі —
      «пшештічки»)

      є єдиною автохтонною чеською породою свиней і з 1992 року визнана <strong>національним
      генетичним

      ресурсом Чеської Республіки</strong>. Виникла наприкінці XIX століття в околицях Пшештіце на
      Пльзенщині шляхом схрещування місцевих свиноматок з породами <a
      href="/plemena/prasata/berkshire/">berkshire</a> та cornwall.</p>


      <h3>Зовнішній вигляд і властивості</h3>

      <p>Породу легко впізнати за білою шерстю з нерегулярними чорними плямами та напівзвислими
      вухами.

      Кнури досягають маси близько 300 кг, свиноматки — приблизно 220 кг. На відміну від комерційних
      ліній, ріст повільніший,

      зате м’ясо <strong>виняткової якості</strong> — з мармуровістю та жировим прошарком, цінується

      м’ясниками та в гастрономії (відомий продукт — <strong>пшештіцька шинка</strong>).</p>


      <h3>Розведення та консерваційна програма</h3>

      <p>Пшештіцька чорно-строката свиня нині утримується в межах консерваційної програми —
      популяція налічує

      лише близько 200–300 свиноматок. Завдяки цьому заводчики зберігають генетичне різноманіття та
      підтримують традиційну

      чеську породу. Порівняйте її з іншими

      <a href="/plemena/prasata/">породами свиней у каталозі</a> або

      <a
      href="/bazar/?category=zvirata&amp;q=p%C5%99e%C5%A1tick%C3%A9%20%C4%8Dernostrakat%C3%A9%20prase">шукайте
      племінних тварин на базарі</a>.</p>
    faq:
      - q: Чому пшештіцька чорно-строката свиня така рідкісна?
        a: >-
          Вона росте повільніше, ніж комерційні гібридні лінії, тому була витіснена з великих
          господарств. Збереглася завдяки <strong>консерваційній програмі</strong> як національний
          генетичний ресурс Чеської Республіки — нині її утримує лише близько 200–300 свиноматок у
          Чехії.
      - q: Яке м’ясо у пшештіцької чорно-строкатої свині?
        a: >-
          М’ясо мармурове, з жировим прошарком і виразним смаком — справжній делікатес. Найвідоміший
          продукт — <strong>пшештіцька шинка</strong>.
      - q: Де була виведена пшештіцька чорно-строката свиня?
        a: >-
          В околицях <strong>Пшештіце на Пльзенщині</strong> наприкінці XIX століття шляхом
          схрещування місцевих свиноматок з породами berkshire та cornwall. Як порода була визнана у
          1962 році.
