# Ukrajinský overlay katalogu plemen. slug, názvy plemen, čísla, obrázky
# a wiki odkazy zůstávají z cs — vážou se na ně slugy i fotky.
slug: ovce
name: Вівця
name_plural: Породи овець
description: >
  Породи овець, що утримуються в Чеській Республіці — м’ясного, вовняного, молочного та
  комбінованого напрямків. Окрім комерційних порід, включає також чеські регіональні та місцеві
  різновиди.
plemena:
  - slug: suffolk
    name: Суффолк
    origin_country: Велика Британія
    year_registered: 1859
    uzitkovost:
      - maso
    color: чорна голова і ноги, біле тіло
    weight_male_kg: 140
    weight_female_kg: 85
    description: >
      Найпоширеніша м’ясна порода овець у Європі. Швидкий ріст, відмінна забійна вихідність, масивна
      м’язиста будова. У Чехії основна порода для м’ясного виробництва.
    wikipedia: https://en.wikipedia.org/wiki/Suffolk_sheep
    wikidata: https://www.wikidata.org/wiki/Q787795
    image_url: /images/plemena/ovce/suffolk.webp
    image_credit: J gareth p at English Wikipedia
    image_license: CC BY-SA 3.0
    image_source_url: https://commons.wikimedia.org/wiki/File:7_month_old_Suffolk_Ram_Lamb.JPG
  - slug: texel
