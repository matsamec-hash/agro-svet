    body: >
      <h2>Přeštice-Schwarzbunt — die einzige ursprüngliche tschechische
      Rasse</h2>

      <p>Das <strong>Přeštice-Schwarzbunte Schwein</strong> (Zuchtkürzel PC,
      umgangssprachlich <em>přeštičky</em>) ist die einzige ursprüngliche
      tschechische Schweinerasse und wird seit 1992 als <strong>nationale
      genetische Ressource Tschechiens</strong> geführt. Sie entstand Ende des
      19. Jahrhunderts in der Umgebung von Přeštice in der Region Pilsen durch
      Kreuzung heimischer Sauen mit den Rassen <a
      href="/de/plemena/prasata/berkshire/">Berkshire</a> und Cornwall.</p>


      <h3>Aussehen und Eigenschaften</h3>

      <p>Die Rasse erkennt man an den weißen Borsten mit unregelmäßigen
      schwarzen Flecken und den halb hängenden Ohren. Eber erreichen rund 300
      kg, Sauen etwa 220 kg. Gegenüber kommerziellen Linien wächst sie
      langsamer, liefert dafür aber <strong>Fleisch von außergewöhnlicher
      Qualität</strong> — marmoriert und mit Fettabdeckung, geschätzt von
      Metzgern wie von der Gastronomie (der bekannte
      <strong>Přeštice-Schinken</strong>).</p>


      <h3>Haltung und Erhaltungsprogramm</h3>

      <p>Das Přeštice-Schwarzbunte Schwein wird heute im Rahmen eines
      Erhaltungsprogramms gehalten — der Bestand umfasst nur etwa 200 bis 300
      Sauen. Die Züchter bewahren damit genetische Vielfalt und eine
      traditionelle Rasse. Vergleichen Sie sie mit den übrigen <a
      href="/de/plemena/prasata/">Schweinerassen im Katalog</a>.</p>
    faq:
      - q: Warum ist das Přeštice-Schwarzbunte Schwein so selten?
        a: >
          Es wächst langsamer als kommerzielle Hybridlinien und wurde deshalb
          aus den großen Beständen verdrängt. Erhalten blieb es durch ein
          <strong>Erhaltungsprogramm</strong> als nationale genetische Ressource
          Tschechiens — heute halten es nur rund 200 bis 300 Sauen.
      - q: Welches Fleisch liefert das Přeštice-Schwarzbunte Schwein?
        a: >
          Das Fleisch ist marmoriert, mit Fettabdeckung und ausgeprägtem
          Geschmack — eine gesuchte Delikatesse. Das bekannteste Erzeugnis ist
          der <strong>Přeštice-Schinken</strong>.
      - q: Wo wurde die Rasse gezüchtet?
        a: >
          In der Umgebung von <strong>Přeštice in der Region Pilsen</strong>
          gegen Ende des 19. Jahrhunderts, durch Kreuzung heimischer Sauen mit
          Berkshire und Cornwall. Als Rasse anerkannt wurde sie 1962.
