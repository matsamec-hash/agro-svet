    body: >
      <h2>Large White — die verbreitetste Mutterrasse</h2>

      <p>Das <strong>Large White</strong> (auch Yorkshire, in Deutschland als
      <strong>Deutsches Edelschwein</strong> gezüchtet) ist die weltweit
      verbreitetste weiße Rasse und bildet die Grundlage nahezu aller
      kommerziellen Hybridlinien. Gezüchtet wurde sie seit der Mitte des 19.
      Jahrhunderts im englischen Yorkshire und überall als
      <strong>Mutterlinie</strong> eingesetzt.</p>


      <h3>Eigenschaften und Verwendung</h3>

      <p>Kennzeichnend sind weiße Borsten, rosa Haut und halb stehende Ohren;
      Eber erreichen rund 350 kg, Sauen etwa 270 kg. Die Rasse überzeugt durch
      <strong>hohe Fruchtbarkeit</strong> (12 bis 14 Ferkel je Wurf),
      hervorragende Muttereigenschaften und gutes Wachstum. In Hybridprogrammen
      bildet sie die Großelternlinie, am häufigsten in Kombination mit der <a
      href="/de/plemena/prasata/landrasa/">Landrasse</a>.</p>


      <h3>Mutterrasse, nicht Vaterlinie</h3>

      <p>Das Large White ist eine <strong>Mutterrasse</strong> (Fruchtbarkeit,
      Milchleistung). Verwechseln Sie es nicht mit der davon abgeleiteten <a
      href="/de/plemena/prasata/bile-otcovske/">weißen Vaterrasse</a>, die
      umgekehrt eine auf Bemuskelung und Tageszunahme ausgerichtete Vaterlinie
      ist. Weitere Rassen finden Sie im <a href="/de/plemena/prasata/">Katalog
      der Schweinerassen</a>.</p>
    faq:
      - q: Was ist das Large White?
        a: >
          Es ist die weltweit verbreitetste weiße Mutterrasse, in Großbritannien
          auch Yorkshire und in Deutschland als Deutsches Edelschwein gezüchtet.
          Wegen ihrer hohen Fruchtbarkeit und guten Muttereigenschaften bildet
          sie die Grundlage kommerzieller Hybridlinien.
      - q: Worin unterscheiden sich Large White und die weiße Vaterrasse?
        a: >
          Das <strong>Large White</strong> ist eine Mutterrasse (Fruchtbarkeit,
          Milchleistung), während die <a
          href="/de/plemena/prasata/bile-otcovske/">weiße Vaterrasse</a> eine
          daraus abgeleitete Vaterlinie mit dem Zuchtziel Bemuskelung und
          Tageszunahme ist.
      - q: Wie viele Ferkel hat eine Large-White-Sau?
        a: >
          Typischerweise 12 bis 14 Ferkel je Wurf. Die hohe Fruchtbarkeit ist
          der Hauptgrund, warum die Rasse die Mutter- beziehungsweise
          Großelternlinie der Hybridzucht bildet.
