    body: >
      <h2>Wildschwein — die Stammform der Hausschweine</h2>

      <p>Das <strong>Wildschwein</strong> (<em>Sus scrofa</em>) ist die frei
      lebende Art, aus der durch Domestikation alle <a
      href="/de/plemena/prasata/">Hausschweinerassen</a> hervorgegangen sind. In
      der Jägersprache heißt es <strong>Schwarzwild</strong>. In Mitteleuropa
      zählt es zu den verbreitetsten Schalenwildarten, und die Bestände wachsen
      weiter.</p>


      <h3>Wie man das Wildschwein erkennt</h3>

      <p>Das Wildschwein hat ein dunkelbraunes bis schwarzes, borstiges
      Haarkleid, einen ausgeprägten Rückenkamm und einen gestreckten Rüssel.
      Keiler erreichen rund 200 kg, Bachen etwa 130 kg. Vom Hausschwein
      unterscheidet es sich durch die kräftigere Vorhand, kürzere Läufe und die
      ausgeprägten Waffen der ausgewachsenen Keiler.</p>


      <h3>Haltung und Wildbreterzeugung</h3>

      <p>Neben der frei lebenden Population wird das Wildschwein in Gattern und
      auf Farmen zur Erzeugung von <strong>Wildbret</strong> gehalten — dunklem,
      magerem Fleisch mit kräftigem Geschmack, das in der Gastronomie und für
      Wildwurst geschätzt wird. Aus der Kreuzung mit dem Hausschwein entstehen
      spezialisierte Erzeugnisse.</p>
    faq:
      - q: Wie heißt das Wildschwein fachlich?
        a: >
          Der wissenschaftliche Name lautet <em>Sus scrofa</em>. In der
          Jägersprache spricht man von <strong>Schwarzwild</strong>, das
          männliche Tier heißt Keiler, das weibliche Bache. Es handelt sich um
          dieselbe Art — die wilde Stammform der Hausschweine.
      - q: Wie schwer wird ein Wildschwein?
        a: >
          Ein ausgewachsener Keiler erreicht rund 200 kg, eine Bache etwa 130
          kg. Das Gewicht schwankt mit Alter, Lebensraum und Nahrungsangebot.
      - q: Kann man Wildschweine auf einer Farm halten?
        a: >
          Ja. Wildschweine werden in Gattern und auf Farmen zur
          Wildbreterzeugung gehalten. Die Haltung unterliegt jagd- und
          veterinärrechtlichen Vorschriften; das Wildbret ist dunkel, mager und
          bei Restaurants wie bei Wildwurstherstellern gefragt.
