    body: >
      <h2>Weiße Vaterrasse — eine tschechische Vaterlinie</h2>

      <p>Die <strong>weiße Vaterrasse</strong> (Kürzel BO, tschechisch <em>bílé
      otcovské plemeno</em>) ist eine tschechische Vaterlinie, gezüchtet aus dem
      <a href="/de/plemena/prasata/bile-uslechtile/">Large White</a> mit dem
      Zuchtziel Bemuskelung und Tageszunahme. Sie ist im Herdbuch des
      tschechischen Schweinezüchterverbands geführt und dient als Alternative
      zum <a href="/de/plemena/prasata/pietrain/">Pietrain</a> für Betriebe, die
      ein weißes Ferkel bevorzugen und die Halothangenetik meiden wollen.</p>


      <h3>Nicht dasselbe wie das Large White</h3>

      <p>Vorsicht vor der Verwechslung: Wenn Sie die
      <strong>Mutterrasse</strong> Large White suchen (Fruchtbarkeit und
      Milchleistung), gehört diese auf die eigene Seite <a
      href="/de/plemena/prasata/bile-uslechtile/">Large White</a>. Die weiße
      Vaterrasse ist umgekehrt eine <strong>daraus abgeleitete
      Vaterlinie</strong> mit dem Schwerpunkt Fleischleistung.</p>
    faq:
      - q: Aus welcher Rasse entstand die weiße Vaterrasse?
        a: >
          Sie wurde aus dem <a href="/de/plemena/prasata/bile-uslechtile/">Large
          White</a> als spezialisierte Vaterlinie mit dem Zuchtziel Bemuskelung
          und Tageszunahme gezüchtet.
      - q: Wozu dient die weiße Vaterrasse?
        a: >
          Als Vater- beziehungsweise Endstufenlinie in der Hybridzucht — sie
          vererbt den Nachkommen Bemuskelung. Sie ist die tschechische
          Alternative zum Pietrain, mit dem Vorteil eines weißen Ferkels und
          ohne Halothangenetik.
