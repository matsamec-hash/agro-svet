slug: hovezi
name: Bydło
name_plural: Rasy bydła
description: |
  Przegląd ras bydła hodowanych w Czechach i w Europie. Rasy mleczne, mięsne, kombinowane oraz mniejszościowe rasy regionalne. Dane obejmują pochodzenie, masę ciała, wydajność mleczną i główne cechy hodowlane.
