slug: kone
name: Konie
name_plural: Rasy koni
description: |
  Rasy koni w Czechach — gorącokrwiste konie sportowe, zimnokrwiste konie pociągowe, kucyki, szlachetne i regionalne rasy. Obejmuje rasy krajowe oraz importowane.
