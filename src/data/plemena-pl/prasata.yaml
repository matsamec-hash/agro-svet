  image_license: Synthetic — illustrative only
  body: |
    <h2>Biała rasa ojcowska — czeska linia ojcowska</h2>
    <p><strong>Biała rasa ojcowska</strong> (skrót BO) to czeska linia ojcowska wyhodowana ze <a href="/pl/plemena/prasata/bile-uslechtile/">świni wielkiej białej</a> z naciskiem na umięśnienie i dzienny przyrost. Jest zarejestrowana w księdze hodowlanej SCHP CZ i służy jako alternatywa dla <a href="/pl/plemena/prasata/pietrain/">pietraina</a> dla hodowców, którzy preferują białe prosię i unikają genetyki halotanowej.</p>

    <h3>To nie to samo co wielka biała</h3>
    <p>Uwaga na pomyłkę: jeśli szukasz matecznej <strong>czeskiej wielkiej białej</strong> (Large White, plenność i mleczność), znajdziesz ją na osobnej stronie <a href="/pl/plemena/prasata/bile-uslechtile/">Świnia wielka biała</a>. Biała rasa ojcowska to natomiast <strong>pochodna od niej linia ojcowska</strong> ukierunkowana na użytkowość mięsną.</p>
  faq:
  - q: Z jakiej rasy powstała biała ojcowska?
    a: |
      Została wyhodowana ze <a href="/pl/plemena/prasata/bile-uslechtile/">świni wielkiej białej</a> jako wyspecjalizowana linia ojcowska z naciskiem na umięśnienie i dzienny przyrost.
  - q: Do czego wykorzystuje się białą rasę ojcowską?
    a: |
      Jako linia ojcowska (terminalna) w stadach hybrydowych — nadaje potomstwu umięśnienie. To czeska alternatywa dla pietraina z zaletą białego prosięcia i bez genetyki halotanowej.
