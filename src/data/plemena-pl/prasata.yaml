slug: prasata
name: Świnia domowa
name_plural: Rasy świń
description: |
  Przegląd ras świń hodowanych w Czechach i Europie. Rasy mateczne (Wielka biała, Czeska landrasa) stanowią podstawę stad, linie ojcowskie (Pietrain, Duroc, Hampshire) zapewniają umięśnienie i jakość mięsa. Zbiór obejmuje pochodzenie, masę, plenność oraz główne cechy hodowlane, w tym rodzimą czeską rasę Przesticką czarno-łaciatą.
