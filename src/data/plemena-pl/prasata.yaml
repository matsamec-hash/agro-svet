  body: |
    <h2>Czeska wielka biała — najbardziej rozpowszechniona rasa mateczna</h2>
    <p><strong>Czeska wielka biała</strong> (skrót ČBU, międzynarodowo Large White lub Yorkshire) to rodzima populacja hodowlana najbardziej rozpowszechnionej na świecie białej rasy i stanowi podstawę niemal wszystkich komercyjnych linii hybrydowych w Czechach. Rasa została wyhodowana od połowy XIX wieku w angielskim Yorkshire i włączona do czeskich stad jako <strong>linia mateczna</strong>.</p>

    <h3>Cechy i wykorzystanie</h3>
    <p>Charakterystyczna jest biała szczecina, różowa skóra i uszy półstojące; knury osiągają około 350 kg, lochy około 270 kg. Rasa wyróżnia się <strong>wysoką plennością</strong> (12–14 prosiąt w miocie), znakomitymi cechami matecznymi i dobrym tempem wzrostu. W programach hybrydowych stanowi linię prarodzicielską, najczęściej w połączeniu z <a href="/pl/plemena/prasata/landrasa/">landrasą</a>.</p>

    <h3>Wielka biała vs. biała ojcowska</h3>
    <p>Czeska wielka biała to rasa <strong>mateczna</strong> (plenność, mleczność). Nie należy jej mylić z pochodną <a href="/pl/plemena/prasata/bile-otcovske/">białą rasą ojcowską</a>, która jest z kolei linią ojcowską ukierunkowaną na umięśnienie i dzienny przyrost. Pozostałe rasy znajdziesz w <a href="/pl/plemena/prasata/">katalogu świń</a>.</p>
  faq:
  - q: Czym jest czeska wielka biała?
    a: |
      To rodzima populacja hodowlana rasy Large White (Yorkshire) — najbardziej rozpowszechnionej na świecie białej rasy matecznej. W Czechach stanowi podstawę komercyjnych linii hybrydowych dzięki wysokiej plenności i dobrym cechom matecznym.
  - q: Jaka jest różnica między wielką białą a białą świnią ojcowską?
    a: |
      <strong>Wielka biała</strong> to rasa mateczna (plenność, mleczność), podczas gdy <a href="/pl/plemena/prasata/bile-otcovske/">biała ojcowska</a> to pochodna od niej linia ojcowska ukierunkowana na umięśnienie i dzienny przyrost.
  - q: Ile prosiąt ma locha wielkiej białej?
    a: |
      Zwykle 12–14 prosiąt w miocie. Wysoka plenność to główny powód, dla którego rasa stanowi mateczną (prarodzicielską) linię stad hybrydowych.
