  body: |
    <h2>Przesticka świnia czarno-łaciata — jedyna rodzima czeska rasa</h2>
    <p><strong>Przesticka świnia czarno-łaciata</strong> (hodowlany skrót PC, potocznie „przesticzki") to jedyna rodzima czeska rasa świni, od 1992 roku prowadzona jako <strong>narodowy zasób genetyczny Czech</strong>. Powstała pod koniec XIX wieku w okolicach Přeštic w regionie Pilzna przez krzyżowanie rodzimych świń z rasami <a href="/pl/plemena/prasata/berkshire/">berkshire</a> i cornwall.</p>

    <h3>Wygląd i cechy</h3>
    <p>Rasę rozpoznasz po białej szczecinie z nieregularnymi czarnymi plamami i uszach półzwisających. Knury osiągają około 300 kg, lochy około 220 kg. W porównaniu z liniami komercyjnymi rośnie wolniej, za to daje <strong>mięso wyjątkowej jakości</strong> — z marmurkowaniem i okrywą tłuszczową, cenione przez rzeźników i gastronomię (słynna <strong>szynka przesticka</strong>).</p>

    <h3>Hodowla i program ochrony</h3>
    <p>Przesticka świnia czarno-łaciata jest dziś hodowana w ramach programu ochrony — populacja liczy zaledwie około 200–300 loch. Hodowcy chronią w ten sposób różnorodność genetyczną i utrzymują tradycyjną czeską rasę. Porównaj ją z innymi <a href="/pl/plemena/prasata/">rasami świń w katalogu</a> lub <a href="/bazar/?category=zvirata&amp;q=p%C5%99e%C5%A1tick%C3%A9%20%C4%8Dernostrakat%C3%A9%20prase">szukaj zwierząt hodowlanych w bazarze</a>.</p>
  faq:
  - q: Dlaczego przesticka świnia czarno-łaciata jest tak rzadka?
    a: |
      Rośnie wolniej niż komercyjne linie hybrydowe i dlatego została wyparta z ferm wielkotowarowych. Zachowała się dzięki <strong>programowi ochrony</strong> jako narodowy zasób genetyczny Czech — dziś hoduje ją zaledwie około 200–300 loch.
  - q: Jakie mięso ma przesticka świnia czarno-łaciata?
    a: |
      Mięso jest marmurkowane, z okrywą tłuszczową i wyrazistym smakiem — poszukiwany specjał. Najbardziej znanym wyrobem jest <strong>szynka przesticka</strong>.
  - q: Gdzie wyhodowano przesticką świnię czarno-łaciatą?
    a: |
      W okolicach <strong>Přeštic w regionie Pilzna</strong> pod koniec XIX wieku, przez krzyżowanie rodzimych świń z rasami berkshire i cornwall. Jako rasę uznano ją w 1962 roku.
