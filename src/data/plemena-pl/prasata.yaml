    Czeska linia ojcowska wyhodowana ze świni wielkiej białej z naciskiem na umięśnienie i dzienny przyrost. Alternatywa dla Pietraina dla tych hodowców, którzy preferują białe prosię i unikają genetyki halotanowej. Zarejestrowana w księdze hodowlanej SCHP CZ.
