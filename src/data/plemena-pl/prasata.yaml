  body: |
    <h2>Dzik (Sus scrofa) — pierwotny przodek świń domowych</h2>
    <p><strong>Dzik</strong> (<em>Sus scrofa</em>) to żyjący na wolności gatunek, z którego drogą udomowienia wywiedziono wszystkie <a href="/pl/plemena/prasata/">domowe rasy świń</a>. W mowie myśliwskiej określany jest jako <strong>czarny zwierz</strong>. W Czechach należy do najbardziej rozpowszechnionej zwierzyny płowej i wciąż liczebnie rośnie.</p>

    <h3>Jak rozpoznać dzika</h3>
    <p>Dzik ma ciemnobrązową do czarnej szczeciniastą okrywę, charakterystyczny grzebieniasty grzbiet i wydłużony ryj. Odyńce dorastają do około 200 kg, lochy około 130 kg. Od świni domowej różni się potężniejszą przednią częścią ciała, krótszymi nogami i wyraźnymi szablami u dorosłych odyńców.</p>

    <h3>Hodowla i produkcja dziczyzny</h3>
    <p>Oprócz populacji żyjącej na wolności dzik jest hodowany w zwierzyńcach i na fermach do produkcji <strong>dziczyzny</strong> — ciemnego, chudego mięsa o wyrazistym smaku, cenionego w gastronomii i wędlinach myśliwskich. Krzyżowaniem ze świnią domową (tzw. „knur dzik") powstają wyroby specjalistyczne. Jeśli szukasz zwierząt hodowlanych lub dziczyzny, <a href="/bazar/?category=zvirata&amp;q=divok%C3%A9%20prase">przejrzyj ofertę w Agro bazarze</a>.</p>
  faq:
  - q: Jak fachowo nazywa się dzik?
    a: |
      Nazwa fachowa (systematyczna) to <strong>dzik</strong>, po łacinie <em>Sus scrofa</em>. W mowie potocznej używa się określenia „dzik", a w łowiectwie „czarny zwierz". To ten sam gatunek — dziki przodek świń domowych.
  - q: Ile waży dzik?
    a: |
      Dorosły odyniec dorasta do około 200 kg, locha około 130 kg. Masa waha się w zależności od wieku, lokalizacji i dostępności pokarmu.
  - q: Czy dzika można hodować na fermie?
    a: |
      Tak. Dzik jest hodowany w zwierzyńcach i na fermach do produkcji dziczyzny. Chów podlega przepisom łowieckim i weterynaryjnym; mięso (dziczyzna) jest ciemne, chude i poszukiwane przez restauracje oraz producentów wędlin myśliwskich.
