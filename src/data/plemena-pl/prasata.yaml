  description: |
    Dziki przodek wszystkich świń domowych. W Czechach żyje na wolności jako zwierzyna łowna, ale jest też hodowany w zwierzyńcach i na fermach do produkcji dziczyzny. Mięso ciemne, chude, o wyrazistym smaku — cenny surowiec dla restauracji i wędlin myśliwskich. Krzyżowanie ze świnią domową (tzw. "knur dzik") bywa wykorzystywane do wyrobów specjalistycznych.
