slug: ovce
name: Owce
name_plural: Rasy owiec
description: |
  Rasy owiec hodowane w Czechach — mięsne, wełniste, mleczne i kombinowane. Oprócz ras komercyjnych obejmuje także czeskie rasy regionalne i lokalne.
