description: >
  Farma Kačiny na Benešovsku se specializuje na prémiové seno a stelivo pro koně
  a na výrobu balíků slámy pro slaměné domy. K produkci slámy patří i pěstování
  kvalitních obilovin — ovsa, ječmene a pšenice. Balíky vždy dopraví na místo
  a pomohou i se složením. Farmaří s ohledem na přírodu a místní společenství.
